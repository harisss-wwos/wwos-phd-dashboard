<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unique Cases Log · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shimmer.css">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;padding:8px 16px;background:var(--o);color:#000;border-radius:6px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.wrap{max-width:1000px;margin:0 auto;padding:40px 24px}
h1{color:#fff;font-size:1.6em;margin-bottom:6px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:26px}
.entry{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;margin-bottom:14px;overflow:hidden}
.entry-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid transparent;cursor:pointer;transition:background .12s}
.entry-head:hover{background:#0d0d0d}
.entry.open .entry-head{border-bottom-color:var(--bd)}
.entry-caret{color:var(--tm);transition:transform .18s;flex-shrink:0}
.entry.open .entry-caret{transform:rotate(180deg)}
.entry-body{display:none;padding:12px 18px}
.entry.open .entry-body{display:block}
.act{padding:2px 10px;border-radius:20px;font-size:.72em;font-weight:700;text-transform:uppercase}
.act.mark{background:rgba(74,222,128,.15);color:var(--gl)}
.act.update{background:rgba(251,191,36,.15);color:#fbbf24}
.act.unmark{background:rgba(255,82,82,.15);color:var(--rl)}
.btn.danger{background:transparent;border:1px solid rgba(255,82,82,.5);color:var(--rl)}
.btn.danger:hover{background:rgba(255,82,82,.12)}
.btn.mini{padding:5px 12px;font-size:.78em}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;max-width:440px;width:100%;padding:24px}
.modal h2{color:var(--rl);font-size:1.05em;margin-bottom:10px}
.modal p{color:var(--t);font-size:.9em;line-height:1.6}
.entry-id{color:#44b9d6;font-weight:700}
.entry-user{color:var(--tm);font-size:.85em}
.entry-user b{color:#d5dbdb}.entry-role{color:var(--o);text-transform:uppercase;font-size:.72em;font-weight:700;margin-left:4px}
.entry-when{margin-left:auto;text-align:right;font-size:.8em;color:var(--tm);line-height:1.5}
.entry-when b{color:#d5dbdb}
.blk-t{color:var(--tm);font-size:.72em;text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin:10px 0 6px}
.info-box{white-space:pre-wrap;color:var(--t);font-size:.88em;line-height:1.6;background:#000;border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.links{display:flex;flex-direction:column;gap:6px}
.link-item{background:#000;border:1px solid var(--bd);border-radius:8px;padding:7px 11px}
.link-item a{color:#44b9d6;text-decoration:none;font-size:.84em;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.link-item a:hover{text-decoration:underline}
.none{color:#5f6b6c;font-size:.84em;font-style:italic}
.meta-row{display:flex;gap:16px;flex-wrap:wrap;font-size:.82em;color:var(--tm)}
.meta-row b{color:#fff;font-weight:600}
.gate{text-align:center;padding:50px 0}.gate p{color:var(--tm);margin-bottom:18px}
.empty{text-align:center;color:var(--tm);padding:40px;border:1px dashed var(--bd);border-radius:12px}
</style>
</head>
<body data-nav-active="" data-back-href="important-cases.html" data-back-label="Unique Cases">
<div class="top-bar">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap"><div class="sk-wrap"><div class="shimmer sk-title"></div><div class="shimmer sk-sub"></div><div class="shimmer sk-card" style="min-height:100px;margin-bottom:14px"></div><div class="shimmer sk-card" style="min-height:100px"></div></div></div>

<div class="modal-bg" id="confirmModal" onclick="if(event.target===this)closeConfirm()">
  <div class="modal">
    <h2>Delete log entry?</h2>
    <p>This permanently removes this entry from the unique cases log. This cannot be undone.</p>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn sec" onclick="closeConfirm()">Cancel</button>
      <button class="btn danger" onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js"></script>
<script>
const A=window.PHDAuth;
let MY_TZ='IST';const TZ_ZONE={IST:'Asia/Kolkata',MST:'America/Denver'};
function fmtTZ(iso,zone){try{return new Date(iso).toLocaleString('en-US',{timeZone:zone,day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});}catch(e){return iso;}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gate(msg){document.getElementById('wrap').innerHTML='<div class="gate"><h1>Unique Cases Log</h1><p>'+msg+'</p><a class="btn" href="app.html">Go to Live Dashboard</a></div>';}

const isOwner=()=>A.role&&A.role()==='owner';
const ACT_LABEL={mark:'Marked',update:'Updated',unmark:'Unmarked'};

function linkRow(url){const u=esc(url);return '<div class="link-item"><a href="'+u+'" target="_blank" rel="noopener" title="'+u+'">'+u+'</a></div>';}

function bodyFor(e){
  const links=(e.links&&e.links.length)?('<div class="links">'+e.links.map(linkRow).join('')+'</div>'):'<div class="none">No links.</div>';
  return '<div class="meta-row">'+
      '<span>Ticket: <b><a href="https://t.corp.amazon.com/issues/'+encodeURIComponent(e.shortId)+'" target="_blank" rel="noopener" style="color:#44b9d6;text-decoration:none">'+esc(e.shortId)+'</a></b></span>'+
      (e.quarter?('<span>Quarter: <b>'+esc(e.quarter)+'</b></span>'):'')+
    '</div>'+
    '<div class="blk-t">Information</div>'+(e.info?('<div class="info-box">'+esc(e.info)+'</div>'):'<div class="none">No notes.</div>')+
    '<div class="blk-t">Links</div>'+links;
}

function render(entries){
  const wrap=document.getElementById('wrap');
  const owner=isOwner();
  let html='<div style="margin-bottom:14px"><a class="btn sec" href="important-cases.html">← Back to Unique Cases</a></div>'
    +'<h1>Unique Cases Log</h1><p class="sub">Every time an admin marked or updated a case, with the notes and links at that moment. Latest first.'+(owner?' As the owner, you can delete log entries.':'')+'</p>';
  if(!entries.length){html+='<div class="empty">No unique-case markings recorded yet.</div>';wrap.innerHTML=html;return;}
  html+=entries.map((e,i)=>`
    <div class="entry${i===0?' open':''}">
      <div class="entry-head" onclick="toggleEntry(this)">
        <span class="act ${e.action==='unmark'?'unmark':(e.action==='update'?'update':'mark')}">${ACT_LABEL[e.action]||e.action}</span>
        <span class="entry-id">${esc(e.shortId)}</span>
        <span class="entry-user">by <b>${esc(e.user)}</b><span class="entry-role">${esc(e.role||'')}</span></span>
        <span class="entry-when"><b>IST:</b> ${fmtTZ(e.at,'Asia/Kolkata')}<br><b>MST:</b> ${fmtTZ(e.at,'America/Denver')}</span>
        ${owner?`<button class="btn danger mini" onclick="event.stopPropagation();confirmDelete('${e.id}')">Delete</button>`:''}
        <span class="entry-caret">▾</span>
      </div>
      <div class="entry-body">${bodyFor(e)}</div>
    </div>`).join('');
  wrap.innerHTML=html;
}
function toggleEntry(head){var en=head.closest('.entry');if(en)en.classList.toggle('open');}

let DEL_ID=null;
function confirmDelete(id){DEL_ID=id;document.getElementById('confirmModal').style.display='flex';}
function closeConfirm(){document.getElementById('confirmModal').style.display='none';DEL_ID=null;}
async function doDelete(){
  if(!DEL_ID)return;
  const r=await A.api('DELETE','/api/unique-cases-log/'+DEL_ID);
  closeConfirm();
  if(r.ok){load();}
  else{alert((r.data&&r.data.error)||('Delete failed (HTTP '+r.status+')'));}
}

async function load(){
  if(!A.getUser()||!A.getToken()){gate('This page is for logged-in users. Log in from the Live Dashboard first.');return;}
  if(!(A.atLeast&&A.atLeast('admin'))){gate('This page is for admins and above. Your role: '+(A.role?A.role():'user')+'.');return;}
  const r=await A.api('GET','/api/unique-cases-log');
  if(r.status===401){gate('Session expired. Please log in again.');return;}
  if(!r.ok){gate('Could not load the unique cases log (HTTP '+r.status+').');return;}
  render(Array.isArray(r.data)?r.data:[]);
}
load();
</script>
</body>
</html>
