<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Types · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252;--tl:#44b9d6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#000;border-radius:5px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.wrap{padding:32px 24px;width:auto;max-width:1200px;margin:0 auto}
/* ---- Illustrated gradient banner header (standardization theme: amber/orange) ---- */
.iz-banner{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-radius:5px;padding:16px 22px;min-height:82px;margin-bottom:20px;
  border:1px solid #2a2117;box-shadow:0 12px 30px -20px rgba(0,0,0,.75);
  background:linear-gradient(90deg,#b4530a,#f08a1d 55%,#ffd27a);background-size:200% 100%;animation:izBanner 9s ease infinite}
@keyframes izBanner{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.iz-banner .hb-left{position:relative;z-index:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.iz-banner .hb-title{margin:0;display:inline-flex;align-items:center;gap:11px;font-size:1.5em;font-weight:800;letter-spacing:-.3px;line-height:1.1;color:#2a1706}
.iz-banner .hb-title svg{flex-shrink:0;color:#2a1706}
.iz-banner .hb-sub{font-size:.86em;font-weight:500;line-height:1.5;max-width:92ch;color:rgba(42,23,6,.84)}
.iz-banner .hb-sub b{color:#1e1004;font-weight:800}
.iz-banner .hb-right{position:relative;z-index:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.iz-banner .hb-total{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.80);border-radius:5px;padding:9px 18px;box-shadow:0 2px 6px rgba(0,0,0,.12);color:#2a1706}
.iz-banner .hb-total .n{font-size:1.5em;font-weight:900;line-height:1}
.iz-banner .hb-total .l{font-size:.66em;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.iz-banner::after{content:"";position:absolute;top:0;bottom:0;right:150px;width:200px;
  background-repeat:no-repeat;background-position:right center;background-size:auto 112%;opacity:.30;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 80" fill="none" stroke="%23ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h40l14 14v46a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z"/><path d="M56 10v16h16"/><path d="M26 42l8 8 18-18"/></svg>')}
@media(max-width:640px){.iz-banner .hb-title{font-size:1.25em}.iz-banner::after{opacity:.18}}
/* Edit-mode buttons living in the banner (only shown to allowed editors). */
.iz-ebtn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:5px;font-weight:700;font-size:.82em;cursor:pointer;border:1px solid transparent;font-family:inherit;text-decoration:none;transition:transform .12s,filter .15s}
.iz-ebtn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.iz-ebtn svg{width:15px;height:15px}
.iz-ebtn.primary{background:#1e1004;color:#ffd27a;border-color:rgba(42,23,6,.4)}
.iz-ebtn.ghost{background:rgba(255,255,255,.82);color:#2a1706}
.iz-edit-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(30,16,4,.72);color:#ffe3b0;font-size:.72em;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.3px}

/* ================= Taxonomy as a 2-COLUMN CARD GRID ================= */
/* Masonry-style 2-column grid: each CATEGORY is a self-contained card that ALWAYS shows its header
   + the list of its incident-type names. Only a type's DETAILS are hidden until the type is clicked.
   columns layout keeps cards tight to their content (no equal-height stretching / big gaps). */
.iz-wire{column-count:2;column-gap:16px}
@media(max-width:860px){.iz-wire{column-count:1}}
.iz-grp{display:flex;flex-direction:column;break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;margin:0 0 16px;background:linear-gradient(180deg,#15181d,#0f1115);border:1px solid #26211a;border-top:3px solid #f08a1d;border-radius:5px;overflow:hidden;box-shadow:0 8px 20px -16px rgba(0,0,0,.8);transition:box-shadow .15s}
.iz-grp:hover{box-shadow:0 10px 26px -14px rgba(0,0,0,.9)}
/* Category header — static (not clickable); it just labels the card. */
.iz-cat-col{display:flex}
.iz-cat-node{display:flex;align-items:center;gap:12px;width:100%;background:rgba(255,255,255,.02);border:none;border-bottom:1px solid #22272e;border-radius:0;padding:14px 18px}
.iz-cat-node .ic{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:5px;background:rgba(240,138,29,.14);color:#ffce8a;flex-shrink:0}
.iz-cat-txt{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:3px}
.iz-cat-name{display:block;color:#fff;font-size:1.02em;font-weight:800;line-height:1.25}
.iz-cat-meta{display:block;color:#9fb6d6;font-size:.74em;font-weight:600;letter-spacing:.2px}
/* Category edit/delete controls (editors only). */
.iz-cat-actions{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;margin-left:4px}
.iz-catbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:5px;border:1px solid #2a3540;background:#141a21;color:#9fb0c3;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.iz-catbtn:hover{background:rgba(255,255,255,.06);border-color:#ff9900;color:#ff9900}
.iz-catbtn.del:hover{background:rgba(255,82,82,.14);border-color:#ff5252;color:#ff5252}
.iz-catbtn svg{width:15px;height:15px}
/* Type list — always visible inside the card. */
.iz-type-col{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px}
.iz-type{background:#0f1317;border:1px solid #1e242b;border-left:4px solid var(--iz-ac,#e08a1d);border-radius:5px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.iz-type:hover{box-shadow:0 6px 18px -12px rgba(0,0,0,.9)}
.iz-type-head{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer;user-select:none;transition:background .15s}
.iz-type-head:hover{background:rgba(255,255,255,.03)}
.iz-type-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:5px;background:var(--iz-acbg,rgba(240,138,29,.14));color:var(--iz-ac,#e08a1d);flex-shrink:0}
.iz-type-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.iz-type-nrow{display:inline-flex;align-items:center;gap:8px;min-width:0}
.iz-type-name{color:#eef1f4;font-size:.96em;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Copy-name button — small, appears beside the type name; available to everyone. */
.iz-copybtn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex-shrink:0;border-radius:5px;border:1px solid #2a3540;background:#141a21;color:#9fb0c3;cursor:pointer;padding:0;transition:border-color .15s,color .15s,background .15s}
.iz-copybtn:hover{border-color:#ff9900;color:#ff9900}
.iz-copybtn.copied{border-color:#4ade80;color:#4ade80;background:rgba(74,222,128,.12)}
.iz-copybtn svg{width:13px;height:13px}
.iz-type-desc{color:#8a94a2;font-size:.79em;font-style:italic;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iz-type-caret{color:var(--tm);display:inline-flex;transition:transform .22s ease;flex-shrink:0}
.iz-type.open .iz-type-caret{transform:rotate(180deg)}
.iz-type.open{border-color:var(--iz-ac,#e08a1d)}
.iz-type-body{max-height:0;overflow:hidden;transition:max-height .32s ease;padding:0 15px}
.iz-type.open .iz-type-body{max-height:520px;padding:2px 15px 15px}
.iz-def{border-left:3px solid var(--iz-ac,#e08a1d);background:#0b0d10;border-radius:0 10px 10px 0;padding:4px 2px;margin-top:4px}
.iz-def-row{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
.iz-def-row:last-child{border-bottom:none}
.iz-def-k{display:inline-flex;align-items:center;gap:6px;color:#ffb454;font-size:.72em;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding-top:2px}
.iz-def-k svg{width:13px;height:13px}
.iz-def-k.use{color:#7fe0a0}.iz-def-k.ex{color:#7fdfff}
.iz-def-v{color:var(--t);font-size:.9em;line-height:1.6}
.iz-def-v.ex{color:#c9d3dc;font-style:italic}
/* Row-level edit/delete controls (editors only) */
.iz-type-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-right:2px}
.iz-iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:5px;border:1px solid #2a3540;background:#141a21;color:#9fb0c3;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.iz-iconbtn:hover{border-color:#ff9900;color:#ff9900}
.iz-iconbtn.del:hover{border-color:#ff5252;color:#ff5252}
.iz-iconbtn svg{width:15px;height:15px}
.iz-addtype{margin-top:6px;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:5px;border:1px dashed #3a4a5e;background:#101722;color:#9fd0ff;font-weight:600;font-size:.84em;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s}
.iz-addtype:hover{border-color:#4a86d8;color:#cfe6ff}
.iz-addtype svg{width:15px;height:15px}
/* Modal */
.iz-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:4000;display:none;align-items:center;justify-content:center;padding:20px}
/* Category icon picker grid (edit-category modal). */
.iz-icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.iz-icon-opt{display:inline-flex;align-items:center;justify-content:center;width:100%;height:40px;border-radius:5px;border:1px solid #2a3540;background:#141a21;color:#9fb0c3;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.iz-icon-opt:hover{border-color:#4a86d8;color:#cfe6ff}
.iz-icon-opt.sel{border-color:#4a86d8;background:#17314f;color:#cfe6ff;box-shadow:0 0 0 2px rgba(74,134,216,.35)}
.iz-icon-opt svg{width:18px;height:18px}
.iz-modal-bg.show{display:flex}
.iz-modal{background:#11161c;border:1px solid #2a3340;border-radius:5px;width:560px;max-width:94vw;max-height:92vh;overflow:auto;padding:24px}
.iz-modal h2{color:#fff;font-size:1.15em;margin:0 0 4px}
.iz-modal .sub{color:var(--tm);font-size:.83em;margin:0 0 16px;line-height:1.5}
.iz-field{margin-bottom:14px}
.iz-field label{display:block;color:#cdd7de;font-size:.78em;font-weight:700;letter-spacing:.3px;margin-bottom:6px}
.iz-field input,.iz-field textarea,.iz-field select{width:100%;padding:10px 12px;background:#0a0e12;border:1px solid #2a3340;border-radius:5px;color:#eef1f4;font-size:.9em;font-family:inherit}
.iz-field input:focus,.iz-field textarea:focus,.iz-field select:focus{outline:none;border-color:#ff9900}
.iz-field textarea{min-height:70px;resize:vertical;line-height:1.5}
.iz-field .hint{color:#6b7681;font-size:.74em;margin-top:5px}
.iz-modal-err{color:#ff6b6b;font-size:.84em;margin-top:10px;display:none}
.iz-modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.iz-mbtn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:5px;font-weight:700;font-size:.86em;cursor:pointer;border:none;font-family:inherit}
.iz-mbtn.primary{background:#ff9900;color:#000}.iz-mbtn.primary:hover{background:#ec7211}
.iz-mbtn.sec{background:transparent;border:1px solid #2a3340;color:#cdd7de}.iz-mbtn.sec:hover{border-color:#ff9900;color:#ff9900}
.iz-mbtn.danger{background:#ff5252;color:#fff}.iz-mbtn.danger:hover{background:#e03e3e}
.iz-mbtn[disabled]{opacity:.5;cursor:not-allowed}
@media(max-width:720px){
  .iz-cat-name,.iz-cat-meta{white-space:normal}
  .iz-def-row{grid-template-columns:1fr;gap:3px}
}
.iz-gate{max-width:560px;margin:60px auto;text-align:center}
.iz-gate h1{color:#fff;font-size:1.5em;margin-bottom:10px}
.iz-gate p{color:var(--tm);line-height:1.55}
.iz-loading{color:#6b7681;text-align:center;padding:50px 0;font-size:.9em}
</style>

<!-- ===== Light-theme page override (loaded last, wins the cascade) ===== -->
<style id="iz-light">
/* ---- Title bar: white, 60px, black title (overrides the orange gradient banner). ---- */
.iz-banner{background:#fff!important;border:1px solid #e2e6ea!important;min-height:60px!important;height:60px!important;padding:0 16px!important;margin-bottom:16px!important;box-shadow:0 1px 3px rgba(20,30,50,.06)!important;animation:none!important;flex-wrap:nowrap!important}
.iz-banner .hb-title,.iz-banner .hb-title svg{color:#1b2026!important}
.iz-banner .hb-title{font-size:1.25em!important}
.iz-banner .hb-total{flex-direction:row!important;align-items:center!important;gap:6px!important;background:#fff4e8!important;color:#b5560c!important;box-shadow:none!important;border:1px solid #f3d4b0!important;padding:5px 14px!important;white-space:nowrap!important}
.iz-banner .hb-total .n{font-size:1.1em!important}
.iz-banner .hb-total .l{text-transform:none!important;letter-spacing:0!important}
.iz-banner::after{display:none!important}             /* drop the watermark on the slim bar */
/* Edit buttons readable on the white bar: orange primary, outlined ghost. */
.iz-banner .iz-ebtn.primary{background:linear-gradient(180deg,#ff9f2e,#f07d0a)!important;color:#fff!important;border:none!important}
.iz-banner .iz-ebtn.ghost{background:#fff!important;color:#b5560c!important;border:1px solid #e2e6ea!important}
.iz-banner .iz-ebtn.ghost:hover{border-color:#ec7211!important;background:#fff4e8!important}
/* Content column: kill the injected 14px top gutter (topbar-auth .wrap{padding-top}). */
#wrap.wrap{padding-top:0!important}

/* Grid container is transparent; each CATEGORY CARD gets its own pastel tint (--iz-cbg) + accent
   (--iz-cac), set per-card inline, so adjacent categories are easy to differentiate. */
.iz-wire{background:transparent!important;border:none!important;box-shadow:none!important}
.iz-grp{background:var(--iz-cbg,#fff)!important;border:1px solid #e2e6ea!important;border-top:3px solid var(--iz-cac,#f08a1d)!important;box-shadow:0 1px 3px rgba(20,30,50,.06)!important}
.iz-grp:hover{box-shadow:0 10px 26px -18px rgba(20,40,70,.45)!important}
/* Category card head: slightly darker tint strip + accent-coloured icon tile. */
.iz-cat-node{background:var(--iz-chd,#fbfcfd)!important;border:none!important;border-bottom:1px solid rgba(0,0,0,.06)!important;box-shadow:none!important}
.iz-cat-node .ic{background:rgba(255,255,255,.6)!important;color:var(--iz-cac,#b5680c)!important;overflow:hidden}
.iz-cat-node .ic .iz-cat-img{width:28px;height:28px;object-fit:contain;display:block}
.iz-cat-name{color:#1b2026!important}
.iz-cat-meta{color:#5c6773!important}
/* Category edit/delete buttons on the white head. */
.iz-catbtn{background:#fff!important;border:1px solid #d4dce4!important;color:#5c6773!important}
.iz-catbtn:hover{border-color:#ec7211!important;color:#ec7211!important}
.iz-catbtn.del:hover{border-color:#dc2626!important;color:#dc2626!important}
/* Type cards (nested inside the tinted category card -> translucent white so they read on any tint). */
.iz-type{background:rgba(255,255,255,.72)!important;border:1px solid rgba(0,0,0,.08)!important;border-left:4px solid var(--iz-ac,#e08a1d)!important}
.iz-type-head:hover{background:rgba(255,255,255,.95)!important}
.iz-type-name{color:#1b2026!important}
.iz-type-desc{color:#8793a0!important}
.iz-type-caret{color:#9aa5b1!important}
/* Definition panel. */
.iz-def{background:#f7f9fb!important;border-left:3px solid var(--iz-ac,#e08a1d)!important}
.iz-def-row{border-bottom:1px solid #eef1f4!important}
.iz-def-k{color:#b5680c!important}
.iz-def-k.use{color:#1f9d57!important}.iz-def-k.ex{color:#1577a0!important}
.iz-def-v{color:#2a3340!important}
.iz-def-v.ex{color:#5c6773!important}
/* Copy + icon buttons. */
.iz-copybtn,.iz-iconbtn{background:#fff!important;border:1px solid #d4dce4!important;color:#5c6773!important}
.iz-copybtn:hover,.iz-iconbtn:hover{border-color:#ec7211!important;color:#ec7211!important}
.iz-copybtn.copied{border-color:#1f9d57!important;color:#1f9d57!important;background:#eafaf0!important}
.iz-iconbtn.del:hover{border-color:#dc2626!important;color:#dc2626!important}
.iz-addtype{background:#eaf4fb!important;border:1px dashed #9fcbe0!important;color:#1577a0!important}
.iz-addtype:hover{border-color:#1577a0!important;color:#0f5f80!important}
/* Category edit/delete buttons are on the blue node — keep them light (no override needed). */
/* Category icon picker (light theme). */
.iz-icon-opt{background:#f7f9fb!important;border:1px solid #d4dce4!important;color:#5c6773!important}
.iz-icon-opt:hover{border-color:#1577a0!important;color:#0f5f80!important}
.iz-icon-opt.sel{border-color:#1577a0!important;background:#eaf4fb!important;color:#0f5f80!important;box-shadow:0 0 0 2px rgba(21,119,160,.25)!important}
/* Modal. */
.iz-modal-bg{background:rgba(20,30,45,.55)!important}
.iz-modal{background:#fff!important;border:1px solid #e2e6ea!important}
.iz-modal h2{color:#1b2026!important}
.iz-modal .sub{color:#5c6773!important}
.iz-field label{color:#2a3340!important}
.iz-field input,.iz-field textarea,.iz-field select{background:#fff!important;border:1px solid #d4dce4!important;color:#1b2026!important}
.iz-field input:focus,.iz-field textarea:focus,.iz-field select:focus{border-color:#ec7211!important}
.iz-field .hint{color:#8793a0!important}
.iz-modal-err{color:#d33a3a!important}
.iz-mbtn.primary{background:linear-gradient(180deg,#ff9f2e,#f07d0a)!important;color:#fff!important}
.iz-mbtn.sec{background:#fff!important;border:1px solid #e2e6ea!important;color:#b5560c!important}
.iz-mbtn.sec:hover{border-color:#ec7211!important;color:#ec7211!important}
.iz-mbtn.danger{background:#dc2626!important;color:#fff!important}
/* Gate + loading. */
.iz-gate h1{color:#1b2026!important}
.iz-gate p{color:#5c6773!important}
.iz-loading{color:#5c6773!important}

/* ===== Root-Cause-Details converter modal ===== */
.rc-ov{position:fixed;inset:0;z-index:4000;background:rgba(16,22,30,.6);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.rc-ov.show{display:flex}
.rc-modal{width:80vw;max-width:80vw;height:80vh;max-height:80vh;display:flex;flex-direction:column;background:#fff;border:1px solid #e2e6ea;border-radius:12px;box-shadow:0 30px 70px -20px rgba(20,30,50,.5);overflow:hidden;animation:rcPop .18s ease}
.rc-modal .rc-head,.rc-modal .rc-actions{flex:0 0 auto}
.rc-modal .rc-body{flex:1 1 auto;overflow:auto}
@media(max-width:860px){.rc-modal{width:94vw;max-width:94vw;height:90vh;max-height:90vh}}
@keyframes rcPop{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.rc-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #eef1f4;background:linear-gradient(90deg,#1e1004,#2a1706);color:#ffd27a}
.rc-head .rc-title{display:inline-flex;align-items:center;gap:10px;font-size:1.08em;font-weight:800}
.rc-head .rc-x{margin-left:auto;background:rgba(255,255,255,.14);border:none;color:#ffd27a;width:30px;height:30px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.rc-head .rc-x:hover{background:rgba(255,255,255,.26)}
.rc-body{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px}
@media(max-width:760px){.rc-body{grid-template-columns:1fr}}
.rc-col h3{font-size:.76em;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#8a94a2;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.rc-step{font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#8a94a2;font-size:.92em}
.rc-field{margin-bottom:14px}
.rc-field label{display:block;font-size:.82em;font-weight:700;color:#2a3340;margin-bottom:5px}
.rc-field select,.rc-field textarea{width:100%;background:#fff;border:1px solid #d4dce4;border-radius:8px;color:#1b2026;font-family:inherit;font-size:.9em;padding:10px 12px}
.rc-field select:focus,.rc-field textarea:focus{outline:none;border-color:#ec7211;box-shadow:0 0 0 3px rgba(236,114,17,.14)}
.rc-field select:disabled{background:#f1f3f6;color:#a7b0ba;cursor:not-allowed;opacity:.8}
.rc-field textarea{resize:vertical;line-height:1.5;white-space:pre}
/* Raw-input box: 50% of the modal body's height (body is 80vh -> ~40vh). */
#rcRaw{height:40vh;min-height:160px}
.rc-out-wrap{position:relative}
.rc-out{width:100%;min-height:230px;background:#0f1622;border:1px solid #243041;border-radius:8px;color:#e6edf3;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;line-height:1.6;padding:12px 14px;white-space:pre-wrap;word-break:break-word;overflow:auto}
.rc-actions{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid #eef1f4;background:#fafbfc}
.rc-actions .spacer{flex:1}
.rc-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:7px;font-weight:700;font-size:.88em;cursor:pointer;border:none;font-family:inherit}
.rc-btn.prim{background:#ec7211;color:#fff}.rc-btn.prim:hover{background:#d9660d}
.rc-btn.sec{background:#fff;border:1px solid #d4dce4;color:#2a3340}.rc-btn.sec:hover{background:#f1f4f7}
.rc-btn.ok{background:#1f9d57;color:#fff}
.rc-btn[disabled],.rc-btn.is-off{opacity:.45;cursor:not-allowed;pointer-events:none}
.rc-copywarn{font-size:.78em;font-weight:700;color:#b5680c;align-self:center;margin-left:4px}
.rc-hint{font-size:.78em;color:#8a94a2;margin-top:6px;line-height:1.5}
.rc-def{margin-top:12px;background:#fff7ef;border:1px solid #f3d4b0;border-left:4px solid #ec7211;border-radius:8px;padding:12px 14px}
.rc-def .rc-def-t{display:flex;align-items:center;gap:8px;font-size:.74em;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#b5560c;margin-bottom:6px}
.rc-def .rc-def-name{font-weight:800;color:#1b2026;font-size:.95em;margin-bottom:4px}
.rc-def .rc-def-v{font-size:.86em;line-height:1.6;color:#4a3524}
/* Resolution risk-metadata panel. */
.rc-resmeta{margin-top:12px;background:#f7f9fc;border:1px solid #e2e6ea;border-radius:8px;padding:12px 14px}
.rc-resmeta .rc-rm-line{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.rc-resmeta .rc-rm-right{display:inline-flex;align-items:center;flex-wrap:wrap;gap:10px;margin-left:auto}
.rc-resmeta .rc-rm-t{display:inline-flex;align-items:center;gap:7px;font-size:.74em;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#5c6773;white-space:nowrap}
.rc-resmeta .rc-rm-name{font-weight:800;color:#1b2026;font-size:.95em;white-space:nowrap}
.rc-rm-grid{display:flex;flex-wrap:wrap;gap:8px}
.rc-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.78em;font-weight:800;border:1px solid}
.rc-chip .k{font-weight:700;opacity:.75}
/* value tones */
.rc-chip.v-high{color:#b02a2a;background:#fdeaea;border-color:#f6cccc}
.rc-chip.v-low{color:#1f7a44;background:#eafaf0;border-color:#c8efd8}
.rc-chip.v-na{color:#5c6773;background:#eef1f4;border-color:#e2e6ea}
.rc-chip.v-eff{color:#1f7a44;background:#eafaf0;border-color:#c8efd8}
.rc-chip.v-lim{color:#b5680c;background:#fff3e0;border-color:#f6ddb8}
/* severity tag */
.rc-sev{display:inline-flex;align-items:center;gap:6px;font-size:.72em;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-radius:999px;padding:4px 11px}
.rc-sev.s-critical{color:#b02a2a;background:#fdeaea;border:1px solid #f6cccc}
.rc-sev.s-moderate{color:#b5680c;background:#fff3e0;border:1px solid #f6ddb8}
.rc-sev.s-low{color:#1f7a44;background:#eafaf0;border:1px solid #c8efd8}
.rc-sev.s-operational{color:#1577a0;background:#eaf4fb;border:1px solid #cfe6f5}
/* Trigger button in the banner. */
.iz-rcbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:5px;font-weight:800;font-size:.82em;cursor:pointer;border:none;font-family:inherit;background:#161d2d;color:#f4f3ef}
.iz-rcbtn:hover{background:#0f1420}
.iz-rcbtn svg{width:15px;height:15px}
</style>

function izTotalTypes(){ return IZ_CATS.reduce(function(s,c){return s+c.types.length;},0); }
function izTint(hex){

  var n=parseInt(m[1],16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',.14)';
}

// Copy an incident type's NAME to the clipboard; briefly flash a check mark. Available to everyone.
function izCopyType(gi,ti,btn,ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  var cat=IZ_CATS[gi]; if(!cat) return; var ty=cat.types[ti]; if(!ty) return;
  var text=String(ty.type||'');
  var done=function(ok){
    if(!btn) return;
    if(ok){
      var orig=btn.innerHTML;
      btn.innerHTML=ICO_CHECK; btn.classList.add('copied'); btn.title='Copied!';
      setTimeout(function(){ btn.innerHTML=orig; btn.classList.remove('copied'); btn.title='Copy incident type name'; }, 1300);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ izCopyFallback(text,done); });
  } else { izCopyFallback(text,done); }
}
// Fallback copy for insecure contexts / older browsers (uses a hidden textarea + execCommand).
function izCopyFallback(text,done){
  try{
    var ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=document.execCommand('copy'); document.body.removeChild(ta); done(ok);
  }catch(e){ done(false); }
}
// Within an open category card, only ONE incident type is expanded at a time.
function izToggleType(gi,ti,ev){
  if(ev) ev.stopPropagation();
  var grp=document.getElementById('izGrp'+gi); if(!grp) return;
  var el=document.getElementById('izType'+gi+'_'+ti); if(!el) return;
  var wasOpen=el.classList.contains('open');
  grp.querySelectorAll('.iz-type.open').forEach(function(s){ s.classList.remove('open'); });
  if(!wasOpen) el.classList.add('open');
}

// ================= Root-Cause-Details converter ================================================
// Resolutions in the required order, each with its risk metadata. Index 0 unused so #1..#21 line up.
//   name = clean value written to the Res: line; note = optional parenthetical detail;
//   sev = severity bucket; lk = likelihood; im = impact; eff = effectiveness.
var RC_RESLIST=[null,
  {name:'Account Closure',           note:'Permanent',          sev:'CRITICAL',    lk:'High', im:'High', eff:'Effective'},
  {name:'Account Suspension',        note:'Temporary Lock',     sev:'CRITICAL',    lk:'High', im:'High', eff:'Effective'},
  {name:'Blocking Place ID',         note:'',                   sev:'CRITICAL',    lk:'High', im:'High', eff:'Limited'},
  {name:'Physical Order Block',      note:'',                   sev:'CRITICAL',    lk:'High', im:'High', eff:'Limited'},
  {name:'Address Exclusion',         note:'',                   sev:'MODERATE',    lk:'High', im:'Low',  eff:'Limited'},
  {name:'Address Deprioritization or Address Depri', note:'', sev:'MODERATE',    lk:'High', im:'Low',  eff:'Limited'},
  {name:'Area Exclusion',            note:'',                   sev:'MODERATE',    lk:'High', im:'Low',  eff:'Limited'},
  {name:'GeoPin Update',             note:'',                   sev:'MODERATE',    lk:'Low',  im:'High', eff:'Effective'},
  {name:'GeoFence Update',           note:'',                   sev:'MODERATE',    lk:'Low',  im:'High', eff:'Effective'},
  {name:'Geo-Routing Update',        note:'',                   sev:'MODERATE',    lk:'Low',  im:'High', eff:'Effective'},
  {name:'Parcel Box Installation',   note:'',                   sev:'MODERATE',    lk:'Low',  im:'High', eff:'Limited'},
  {name:'Delivery Hint Update',      note:'',                   sev:'MODERATE',    lk:'Low',  im:'High', eff:'Effective'},
  {name:'Customer Education',        note:'',                   sev:'MODERATE',    lk:'Low',  im:'High', eff:'Effective'},
  {name:'Customer Reassurance',      note:'',                   sev:'LOW',         lk:'Low',  im:'Low',  eff:'Effective'},
  {name:'Driver Follow-up',          note:'',                   sev:'LOW',         lk:'Low',  im:'Low',  eff:'Effective'},
  {name:'Pet Info Update',           note:'',                   sev:'LOW',         lk:'Low',  im:'Low',  eff:'Effective'},
  {name:'Insufficient Information',  note:'',                   sev:'LOW',         lk:'Low',  im:'Low',  eff:'Effective'},
  {name:'PHD Outreach',              note:'CX, Driver, Site Leadership', sev:'OPERATIONAL', lk:'N/A (Administrative)', im:'N/A (Administrative)', eff:'Effective'},
  {name:'Driver Education',          note:'',                   sev:'OPERATIONAL', lk:'N/A (Administrative)', im:'N/A (Administrative)', eff:'Effective'},
  {name:'Driver Misconduct Reported',    note:'',               sev:'OPERATIONAL', lk:'N/A (Administrative)', im:'N/A (Administrative)', eff:'Limited'},
  {name:'Driver Misconduct Not Reported',note:'',               sev:'OPERATIONAL', lk:'N/A (Administrative)', im:'N/A (Administrative)', eff:'Limited'},
];
// Backward-compatible name accessor used by the output line (clean name only).
var RC_RES=RC_RESLIST.map(function(r){ return r?r.name:''; });
var RC_RES_FALLBACK='Driver Follow-up OR Customer Reassurance';
// Flat lookup of every issue type (lowercased name -> {type, def}) for case-insensitive matching.
var RC_ISSUE_MAP=(function(){
  var m={};
  IZ_CATS.forEach(function(cat){ cat.types.forEach(function(ty){ m[String(ty.type).trim().toLowerCase()]={type:ty.type,def:ty.def||''}; }); });
  return m;
})();
// Resolve a raw issue string to a known type (case-insensitive). Returns {type,def} or null.
function rcMatchIssue(name){ var k=String(name||'').trim().toLowerCase(); return k?(RC_ISSUE_MAP[k]||null):null; }
// Definition for a selected dropdown value (exact type name). '' if none.
function rcDefOf(typeName){ var hit=rcMatchIssue(typeName); return hit?hit.def:''; }
// Output field order: [shortKey, [aliases to look for in the pasted text]]. Issue + Res handled separately.
var RC_FIELDS=[
  ['SID',  ['Station ID','SID']],
  ['TID',  ['Transporter ID','TID']],
  ['Driv', ['Driver Type','Driv']],
  ['Date', ['Incident Date','Date of Incident','Date']],
  ['TBA',  ['Tracking ID','Related Tracking ID','TBA']],
  ['Cnt',  ['Historical Incident Count','Historical Incident','Historical Incidents','Cnt']],
  ['Zip',  ['Zip Code','Zip']],
  ['CID',  ['Customer Account ID','Account ID','AID','CID']],
  ['UPID', ['Unit Place ID','UPID']],
];
// Pull the value for a key from the raw text: find "<alias>:" and read up to the NEXT known key or EOL.
// We build a set of ALL known keys so a value never swallows the following key.
// Boundary keys = our mapped keys PLUS common UNMAPPED RootCauseDetails labels. A value stops at any
// of these so an unmapped trailing field (e.g. "Contact ID: ...") can't be swallowed into the value.
// The unmapped ones are only used as STOP boundaries — they are never emitted in the output.
var RC_OTHER_KEYS=['Contact ID','Contact Id','Contact Date','Severity','Tag','Place ID','UID','CAID',
  'Customer ID','Threat Contact ID','SIM Root Cause Details','Output','Historical','AID','CID'];
var RC_ALL_KEYS=(function(){
  var ks=['Issue','Resolution','Res'];
  RC_FIELDS.forEach(function(f){ f[1].forEach(function(a){ ks.push(a); }); });
  RC_OTHER_KEYS.forEach(function(k){ ks.push(k); });
  // de-dupe, longest-first so "Station ID" / "Contact ID" match before shorter fragments.
  ks=Array.from(new Set(ks)).sort(function(a,b){ return b.length-a.length; });
  return ks;
})();
function rcEscRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function rcGrab(raw, aliases){
  // Value runs from "<alias>:" up to the next KNOWN boundary key (mapped or common-unmapped) or EOL.
  var stop=RC_ALL_KEYS.map(rcEscRe).join('|');
  for(var i=0;i<aliases.length;i++){
    var a=rcEscRe(aliases[i]);
    var re=new RegExp('(?:^|[\\s,;|])'+a+'\\s*[:\\-]\\s*([\\s\\S]*?)(?=\\s*(?:'+stop+')\\s*[:\\-]|$)','i');
    var m=raw.match(re);
    if(m){ var v=String(m[1]||'').trim().replace(/[,;|]+$/,'').trim(); if(v) return v; }
  }
  return '';
}
// Normalize a date string to "YYYY-MM-DD HH:mm:ss" (24h). Falls back to the raw value if unparseable.
function rcFmtDate(v){
  if(!v) return '';
  var s=String(v).trim();
  var d=new Date(s);
  if(isNaN(d)){
    // try DD/MM/YYYY or MM/DD/YYYY -> let Date try a normalized form
    var m=s.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if(m){ var yr=m[3].length===2?('20'+m[3]):m[3]; d=new Date(yr+'-'+String(m[1]).padStart(2,'0')+'-'+String(m[2]).padStart(2,'0')); }
  }
  if(isNaN(d)) return s; // keep raw if we truly can't parse
  var p=function(n){ return String(n).padStart(2,'0'); };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
// Populate the Issue + Resolution dropdowns (once).
function rcInitSelects(){
  var is=document.getElementById('rcIssue'); if(is && !is.options.length){
    var opts='<option value="">\u2014 Select issue \u2014</option>';
    IZ_CATS.forEach(function(cat){ opts+='<optgroup label="'+esc(cat.category)+'">';
      cat.types.forEach(function(ty){ opts+='<option value="'+esc(ty.type)+'">'+esc(ty.type)+'</option>'; });
      opts+='</optgroup>'; });
    is.innerHTML=opts;
  }
  var rs=document.getElementById('rcRes'); if(rs && !rs.options.length){
    var ro='<option value="">\u2014 Select resolution \u2014</option>';
    for(var i=1;i<RC_RESLIST.length;i++){ var r=RC_RESLIST[i];
      var lbl=r.name+(r.note?(' ('+r.note+')'):'');
      ro+='<option value="'+i+'">'+String(i).padStart(2,'0')+'. '+esc(lbl)+'</option>'; }
    rs.innerHTML=ro;
  }
}
var _rcWired=false;
function rcOpen(){
  rcInitSelects();
  if(!_rcWired){ _rcWired=true; var ta=document.getElementById('rcRaw'); if(ta) ta.addEventListener('input',function(){ rcConvert(true); }); }
  rcGateSelects();   // start disabled when there's no input
  var ov=document.getElementById('rcOverlay'); if(ov) ov.classList.add('show');
}
window.rcOpen=rcOpen;
function rcClose(){ var ov=document.getElementById('rcOverlay'); if(ov) ov.classList.remove('show'); }
window.rcClose=rcClose;
// Re-render the definition box for whatever Issue is currently selected.
function rcRenderDef(){
  var box=document.getElementById('rcDef'); if(!box) return;
  var sel=document.getElementById('rcIssue').value;
  var def=sel?rcDefOf(sel):'';
  if(sel && def){
    box.style.display='block';
    box.innerHTML='<div class="rc-def-t">'+ic('info',13)+'Issue definition</div>'+
      '<div class="rc-def-name">'+esc(sel)+'</div>'+
      '<div class="rc-def-v">'+esc(def)+'</div>';
  }else if(sel){
    box.style.display='block';
    box.innerHTML='<div class="rc-def-t">'+ic('info',13)+'Issue definition</div>'+
      '<div class="rc-def-name">'+esc(sel)+'</div>'+
      '<div class="rc-def-v">No definition on file for this incident type.</div>';
  }else{ box.style.display='none'; box.innerHTML=''; }
}
// Convert flow: RAW text drives the Issue. If the pasted Issue matches a known type (case-insensitive)
// it is auto-selected in the dropdown. The dropdown also lets the user override manually.
// Enable the Issue + Resolution dropdowns only once the user has entered some raw input. When the
// textarea is empty, both are disabled (and reset) so nothing can be selected without input.
function rcGateSelects(){
  var has=!!String((document.getElementById('rcRaw')||{}).value||'').trim();
  ['rcIssue','rcRes'].forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    el.disabled=!has;
    if(!has) el.value='';
  });
  return has;
}
function rcConvert(fromRaw){
  var raw=String(document.getElementById('rcRaw').value||'');
  rcGateSelects();   // enable/disable the dropdowns based on whether there's input
  var issueSelEl=document.getElementById('rcIssue');
  // Resolve the Issue from the raw text and auto-select it ONLY if it matches a known type.
  var rawIssueTxt=rcGrab(raw,['Issue']);
  var matched=rcMatchIssue(rawIssueTxt);
  if(matched){ issueSelEl.value=matched.type; }
  // Issue is VALID only when the dropdown holds a real (known) type. If it's blank, the Issue line
  // is left blank in the output (we never echo an unrecognised raw issue).
  var issue=issueSelEl.value || '';
  var issueOk=!!issue;
  // Resolution: VALID only when one is picked. No fallback phrase; blank Res when none selected.
  var resNum=document.getElementById('rcRes').value;
  var res=(resNum && RC_RES[+resNum])?RC_RES[+resNum]:'';
  var resOk=!!res;

  var lines=['Issue: '+issue];
  RC_FIELDS.forEach(function(f){
    var v=rcGrab(raw,f[1]);
    if(f[0]==='Date' && v) v=rcFmtDate(v);
    lines.push(f[0]+': '+(v||'N/A'));
  });
  lines.push('Res: '+res);
  document.getElementById('rcOut').textContent=lines.join('\n');
  rcRenderDef();
  rcRenderResMeta();
  // Copy is allowed only when BOTH the Issue and the Resolution are valid.
  rcSetCopyState(issueOk, resOk);
}
window.rcConvert=rcConvert;
// Enable/disable the Copy button + show why it's blocked.
function rcSetCopyState(issueOk, resOk){
  var btn=document.getElementById('rcCopy'); var warn=document.getElementById('rcCopyWarn');
  var ok=issueOk && resOk;
  if(btn){ btn.disabled=!ok; btn.classList.toggle('is-off',!ok); }
  if(warn){
    if(ok){ warn.style.display='none'; warn.textContent=''; }
    else{
      var miss=[]; if(!issueOk) miss.push('select a valid Issue'); if(!resOk) miss.push('select a Resolution');
      warn.style.display='block';
      warn.textContent='Copy disabled \u2014 please '+miss.join(' and ')+'.';
    }
  }
}
// Reset the converter: clear the pasted text, both dropdowns, the output, and the info panels.
function rcClear(){
  var ta=document.getElementById('rcRaw'); if(ta) ta.value='';
  var is=document.getElementById('rcIssue'); if(is) is.value='';
  var rs=document.getElementById('rcRes'); if(rs) rs.value='';
  var out=document.getElementById('rcOut'); if(out) out.textContent='Paste details and click Convert.';
  var def=document.getElementById('rcDef'); if(def){ def.style.display='none'; def.innerHTML=''; }
  var rm=document.getElementById('rcResMeta'); if(rm){ rm.style.display='none'; rm.innerHTML=''; }
  rcSetCopyState(false,false);   // nothing valid yet -> Copy disabled
  var warn=document.getElementById('rcCopyWarn'); if(warn){ warn.style.display='none'; warn.textContent=''; }
  rcGateSelects();   // empty input -> re-disable the dropdowns
  if(ta) ta.focus();
}
window.rcClear=rcClear;
// Risk-metadata panel for the selected resolution (severity + likelihood / impact / effectiveness).
function rcRenderResMeta(){
  var box=document.getElementById('rcResMeta'); if(!box) return;
  var n=+document.getElementById('rcRes').value;
  var r=(n && RC_RESLIST[n])?RC_RESLIST[n]:null;
  if(!r){ box.style.display='none'; box.innerHTML=''; return; }
  var tone=function(v){ var s=String(v||'').toLowerCase(); if(s.indexOf('n/a')>=0) return 'v-na'; if(s.indexOf('high')>=0) return 'v-high'; if(s.indexOf('low')>=0) return 'v-low'; return 'v-na'; };
  box.style.display='block';
  // One line: RESOLUTION RISK label + resolution name + Likelihood + Impact (severity + effectiveness removed).
  box.innerHTML='<div class="rc-rm-line">'+
    '<span class="rc-rm-t">'+ic('target',13)+'Resolution risk</span>'+
    '<span class="rc-rm-right">'+
      '<span class="rc-rm-name">'+esc(r.name)+'</span>'+
      '<span class="rc-chip '+tone(r.lk)+'"><span class="k">Likelihood</span>'+esc(r.lk)+'</span>'+
      '<span class="rc-chip '+tone(r.im)+'"><span class="k">Impact</span>'+esc(r.im)+'</span>'+
    '</span>'+
  '</div>';
}
async function rcCopyOut(){
  var btn=document.getElementById('rcCopy');
  if(btn && btn.disabled){ return; }   // blocked until Issue + Resolution are both valid
  var txt=document.getElementById('rcOut').textContent||'';
  if(!txt.trim()||txt.indexOf('Fill the inputs')===0){ return; }
  try{
    await navigator.clipboard.writeText(txt);
    if(btn){ var prev=btn.textContent; btn.textContent='Copied!'; btn.classList.add('ok'); setTimeout(function(){ btn.textContent=prev; btn.classList.remove('ok'); },1500); }
  }catch(e){ window.prompt('Copy the result:', txt); }
}
window.rcCopyOut=rcCopyOut;
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ var ov=document.getElementById('rcOverlay'); if(ov&&ov.classList.contains('show')) rcClose(); } });

// ================= RENDER =======================================================================
// Data is hardcoded and read-only, so just render the categories directly on load.
render();
</script>
