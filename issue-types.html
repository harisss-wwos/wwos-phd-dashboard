<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Anti-FOUC: hide the body until topbar-auth.js injects its CSS + builds the chrome. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<!-- Keep the section hidden until the shared chrome (title bar + menu column) has wrapped it. -->
<style>#wrap{visibility:hidden}#tbHomeChrome #wrap,html.tb-wrap-timeout #wrap{visibility:visible}</style>
<script>setTimeout(function(){document.documentElement.classList.add('tb-wrap-timeout');},8000);</script>
<noscript><style>#wrap{visibility:visible!important}</style></noscript>
<title>Issue Types · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.wrap{padding:32px 24px;width:auto;max-width:none;margin:0}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
<style id="izr-light">
/* Issue Standardization — "field guide": the Errors-in-Resolved hero (dark navy, orange rule, faint grid),
   a sticky white search/filter bar that overlaps the hero, then one section per category with a tinted
   header strip and a 3/2/1 grid of white type cards. Everything is scoped under .izr. Breakpoints are
   viewport media queries (the shell sizes the main column, so a size container is not relied on). */
#wrap.wrap{padding-top:0!important;padding-bottom:28px!important}
.izr{--ink:#1b2026;--mut:#5c6773;--line:#e2e6ea;--soft:#f5f6f8;--acc:#ec7211;--acc-bg:#fff3e8;--acc-ink:#9a4100;
  --red:#b42318;--red-bg:#fdecec;--grn:#1a7a43;--grn-bg:#e5f5ec;--blu:#165f86;--focus:#f0a35a;color:var(--ink)}
:where(.izr) button{font:inherit;text-transform:none}
.izr :is(button,a,input,summary):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.izr-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.izr-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 76px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.izr-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.izr-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.izr-hero-in{position:relative;display:flex;gap:16px;align-items:flex-start}
.izr-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.izr-hero-txt{min-width:0;flex:1 1 auto}
.izr-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.izr-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.05;margin:0}
.izr-hero-sub{margin-top:9px;max-width:72ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.82)}
.izr-hero-sub b{color:#fff;font-weight:700}
.izr-chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:16px 0 0;padding:0}
.izr-chips li{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;font-size:.76em;font-weight:700;
  color:#e9edf3;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);font-variant-numeric:tabular-nums}
.izr-chips li::before{content:'';width:6px;height:6px;border-radius:50%;background:#ffb26b}
/* Jump nav: quiet glass links, one per category. */
.izr-jump{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:16px}
.izr-jump-k{font-size:.64em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:rgba(233,237,243,.6);margin-right:4px}
.izr-jump a{display:inline-flex;align-items:center;gap:7px;padding:4px 5px 4px 10px;border-radius:99px;font-size:.76em;font-weight:600;
  color:rgba(233,237,243,.88);text-decoration:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);transition:background-color .15s,border-color .15s,color .15s}
.izr-jump a::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.izr-jump a b{min-width:20px;text-align:center;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.1);font-weight:800;font-variant-numeric:tabular-nums}
.izr-jump a:hover{background:rgba(255,255,255,.1);border-color:rgba(255,178,107,.55);color:#fff}

/* ---- Sticky search / filter bar (overlaps the hero bottom) ---- */
.izr-bar{position:sticky;top:82px;z-index:30;margin:-48px 18px 22px;display:flex;flex-direction:column;gap:10px;padding:12px 14px;
  background:rgba(255,255,255,.96);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.izr-bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.izr-search{position:relative;flex:1 1 280px;max-width:520px}
.izr-search>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#8793a0;pointer-events:none}
.izr .izr-search input{width:100%;height:40px;font:inherit;font-size:.9em;padding:0 38px 0 38px;border-radius:10px;border:1px solid #d4dade;background:#fff;color:var(--ink);box-shadow:none}
.izr .izr-search input::placeholder{color:#8793a0}
.izr .izr-search input:hover{border-color:#c4ccd4}
.izr .izr-search input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px rgba(236,114,17,.18)}
.izr-search input::-webkit-search-cancel-button{display:none}
.izr-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;border-radius:7px;background:transparent;color:#5c6773;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.izr-clear:hover{background:var(--soft);color:var(--ink)}
.izr-clear[hidden]{display:none}
.izr-count{font-size:.84em;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.izr-count b{color:var(--ink);font-weight:800}
.izr-extog{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border:1px solid #d4dade;border-radius:99px;background:#fff;font-size:.82em;font-weight:700;color:#3a4552;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.izr-extog:hover{border-color:#c4ccd4;background:#fafbfc}
.izr-extog[aria-pressed="true"]{background:var(--acc-bg);border-color:#f7c99c;color:var(--acc-ink)}
/* contain:inline-size: the scrolling chip row must not push the (fit-content) main column wider on phones. */
.izr-fl{display:flex;align-items:center;gap:8px;min-width:0;contain:inline-size}
.izr-fl-k{flex-shrink:0;font-size:.66em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)}
.izr-fchips{display:flex;gap:6px;min-width:0;overflow-x:auto;padding:4px 2px;margin:-4px 0;scrollbar-width:thin;scrollbar-color:#d4dade transparent}
.izr-fchip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 5px 0 11px;border-radius:99px;border:1px solid var(--line);background:var(--soft);
  font-size:.8em;font-weight:700;color:#3a4552;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.izr-fchip::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c,#8793a0)}
.izr-fchip.is-all::before{display:none}
.izr-fchip.is-all{padding-left:13px}
.izr-fchip b{min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.izr-fchip:hover{border-color:#c4ccd4;background:#fff}
.izr-fchip[aria-pressed="true"]{background:#1f2a40;border-color:#1f2a40;color:#fff}
.izr-fchip[aria-pressed="true"] b{background:var(--acc);border-color:var(--acc);color:#fff}
.izr-fchip.is-zero:not([aria-pressed="true"]){color:#8793a0}
.izr .izr-fchip:focus-visible{outline-offset:1px}

/* ---- Category sections ---- */
.izr-list{display:flex;flex-direction:column;gap:28px;padding:0 2px}
/* No data -> no overlapping bar: close the hero and give the error card its own spacing. */
.izr.is-nobar .izr-hero{padding-bottom:26px}
.izr.is-nobar .izr-list{margin-top:16px}
.izr-cat{scroll-margin-top:200px}
.izr-cat-h{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 14px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--c);
  background:linear-gradient(90deg,var(--cbg),#fff 75%);box-shadow:0 2px 10px -8px rgba(20,30,50,.25)}
div.izr-cat-h{margin-bottom:12px}
/* Collapsible category: the whole header row is the toggle button (inside the h2). */
.izr .izr-cat-hh{margin:0;font-size:1em;font-weight:inherit;letter-spacing:0;line-height:inherit}
.izr button.izr-cat-h{width:100%;text-align:left;color:inherit;cursor:pointer;transition:border-color .15s,box-shadow .2s}
.izr button.izr-cat-h:hover{border-color:#cfd6dd;box-shadow:0 10px 24px -18px rgba(20,30,50,.55)}
.izr-cat-chev{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;color:#818284}
.izr-cat-chev svg{transition:transform .15s}
.izr-cat-h[aria-expanded="true"] .izr-cat-chev svg{transform:rotate(90deg)}
.izr-cat-h:hover .izr-cat-chev{background:#e6f0fc;color:#2b66c1}
/* Smooth height: 0fr -> 1fr grid rows. Collapsed content is visibility:hidden (out of tab order + AT). */
.izr-cat-b{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .28s ease,visibility 0s linear .28s}
.izr-cat.is-open .izr-cat-b{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .28s ease,visibility 0s linear 0s}
.izr-cat-in{min-height:0;overflow:hidden}
.izr-cat-in>.izr-grid{padding-top:12px}
.izr-list.is-cats{gap:12px}
.izr-cat-in>.izr-grid{padding-bottom:16px}
.izr-xc{display:inline-flex;align-items:center;gap:6px}
.izr-xc .izr-extog{margin-left:0}
.izr-cat-tile{width:46px;height:46px;flex-shrink:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid rgba(0,0,0,.06);color:var(--c);overflow:hidden}
.izr-cat-tile img{width:32px;height:32px;object-fit:contain;display:block}
.izr-cat-txt{flex:1 1 auto;min-width:0}
.izr .izr-cat-txt h2,.izr-cat-name{display:block;margin:0;font-size:1.18em;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:var(--ink)}
.izr .izr-cat-txt h2:focus{outline:none}
.izr-cat-sub{display:block;margin-top:2px;font-size:.8em;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.izr-cat-no{flex-shrink:0;font-size:1.5em;font-weight:800;letter-spacing:-.8px;color:rgba(27,32,38,.18);font-variant-numeric:tabular-nums}
.izr-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:760px){.izr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1240px){.izr-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---- Issue-type card ---- */
.izr-type{position:relative;display:flex;flex-direction:column;gap:12px;height:100%;padding:18px 18px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;
  overflow:hidden;box-shadow:0 2px 10px -6px rgba(20,30,50,.18);transition:border-color .15s,box-shadow .2s}
.izr-type::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.izr-type:hover{border-color:#cfd6dd;box-shadow:0 14px 30px -22px rgba(20,30,50,.6)}
.izr-type-top{display:flex;align-items:flex-start;gap:12px}
.izr-type-ic{width:38px;height:38px;flex-shrink:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--tbg);color:var(--t)}
.izr-type-ttl{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.izr .izr-type-name{margin:0;font-size:1.02em;font-weight:800;letter-spacing:-.2px;line-height:1.25;color:var(--ink);overflow-wrap:anywhere}
.izr-tag{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:2px 9px;border-radius:99px;background:var(--cbg);border:1px solid rgba(0,0,0,.06);
  font-size:.7em;font-weight:700;color:#3a4552;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.izr-tag::before{content:'';width:6px;height:6px;flex-shrink:0;border-radius:50%;background:var(--c)}
.izr-copy{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid #d4dade;background:#fff;color:#5c6773;
  font-size:.74em;font-weight:700;cursor:pointer;transition:border-color .15s,color .15s,background-color .15s}
.izr-copy:hover{border-color:var(--acc);color:var(--acc-ink);background:var(--acc-bg)}
.izr-copy.copied{border-color:#9fd5b5;color:var(--grn);background:var(--grn-bg)}
.izr-desc{font-size:.84em;font-weight:600;line-height:1.45;color:var(--mut)}
.izr-def{display:flex;flex-direction:column;gap:10px;margin:0}
.izr-def>div{display:flex;flex-direction:column;gap:4px}
.izr-def dt{display:inline-flex;align-items:center;gap:6px;font-size:.66em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--acc-ink)}
.izr-def dd{margin:0;font-size:.88em;line-height:1.58;color:#2a3340}
.izr-def .is-use{padding:9px 12px;border-radius:8px;background:#f2faf5;border:1px solid #d3eedd}
.izr-def .is-use dt{color:var(--grn)}
.izr-ex{margin-top:auto;border-top:1px dashed #dde2e7;padding-top:8px}
.izr-ex summary{list-style:none;display:flex;align-items:center;gap:8px;margin:0 -6px;padding:5px 6px;border-radius:7px;cursor:pointer;
  font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--blu);user-select:none}
.izr-ex summary::-webkit-details-marker{display:none}
.izr-ex summary:hover{background:#eef6fb}
.izr-ex summary .izr-chev{margin-left:auto;display:inline-flex;color:#818284;transition:transform .15s}
.izr-ex[open] summary .izr-chev{transform:rotate(180deg)}
.izr-ex p{margin:6px 0 2px;padding:9px 12px;border-radius:0 8px 8px 0;border-left:3px solid #4a9cc4;background:#f2f8fc;font-size:.86em;line-height:1.55;font-style:italic;color:#2a3340}
.izr mark{background:#ffe2c2;color:inherit;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px #f7c99c}

/* ---- States ---- */
.izr-state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 20px;text-align:center;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18)}
.izr-state-ic{width:58px;height:58px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#eef1f4;color:#5c6773;margin-bottom:4px}
.izr-state-ic.is-err{background:var(--red-bg);color:var(--red)}
.izr .izr-state-t{font-size:1.08em;font-weight:800;color:var(--ink)}
.izr-state p{font-size:.9em;max-width:52ch;line-height:1.5}
.izr-btn{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:9px 16px;border:none;border-radius:8px;background:#161d2d;color:#f4f3ef;font-size:.86em;font-weight:800;cursor:pointer;transition:background-color .15s}
.izr-btn:hover{background:#0f1420}
.izr-skel{display:block;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:izrShim 1.4s ease infinite}
.izr-skel-card{display:flex;flex-direction:column;gap:10px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:12px}
@keyframes izrShim{0%{background-position:100% 0}100%{background-position:0 0}}

/* ---- Motion: one orchestrated entrance (hero, bar, then sections) ---- */
@keyframes izrUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.izr.is-anim .izr-hero{animation:izrUp .45s ease both}
.izr.is-anim .izr-bar{animation:izrUp .5s ease .1s both}
.izr.is-anim .izr-cat{animation:izrUp .5s ease both;animation-delay:calc(.18s + var(--i,0) * .05s)}
@media (prefers-reduced-motion:reduce){
  .izr *,.izr *::before,.izr *::after{animation:none!important;transition:none!important}
}

/* ---- Small widths ---- */
@media (max-width:700px){
  .izr-hero{padding:22px 18px 76px 22px}
  .izr-hero-ic{display:none}
  .izr-hero h1{font-size:1.55em;letter-spacing:-.5px}
  .izr-hero-sub{font-size:.86em}
  .izr-jump{display:none}
  .izr-bar{margin:-50px 8px 18px;padding:10px}
  .izr-search{flex-basis:100%;max-width:none}
  .izr-extog{margin-left:0}
  .izr-fl-k{display:none}
  .izr-cat-h{padding:10px 12px}
  .izr-cat-no{display:none}
  .izr-copy span{display:none}
  .izr-copy{width:30px;padding:0;justify-content:center}
}
</style>
</head>

<script>
(function(){
var ic=function(n,s){ return window.icon?window.icon(n,s||14):''; };
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){ return document.getElementById(id); }
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Inline glyphs (decorative; aria-hidden).
function svg(p,s,w){ return '<svg width="'+(s||14)+'" height="'+(s||14)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+p+'</svg>'; }
var ICO_DOC=svg('<path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M8 13l3 3 5-5"/>',24);
var ICO_SEARCH=svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>',16);
var ICO_X=svg('<path d="M6 6l12 12M18 6L6 18"/>',14);
var ICO_DEF=svg('<path d="M4 5h12M4 10h12M4 15h8"/><circle cx="19" cy="15" r="2"/>',12);
var ICO_USE=svg('<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>',12);
var ICO_EX=svg('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10c-.7.7-1 1.3-1 2H9c0-.7-.3-1.3-1-2a6 6 0 0 1 4-10z"/>',13);
var ICO_CHEV=svg('<path d="M6 9l6 6 6-6"/>',14);
// Same right-pointing chevron as errors-in-resolved.html's expanders (rotates 90deg when open).
var CHEV='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var ICO_COPY=svg('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',13);
var ICO_CHECK=svg('<path d="M20 6L9 17l-5-5"/>',13,2.4);
var ICO_ALERT=svg('<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',26);
var ICO_EMPTY=svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M8 11h6"/>',26);
var ICO_RETRY=svg('<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>',15);

// Category accent palette (rotates per category). bg = header/tag tint, ac = top border, dot + rule.
var IZ_PALETTE=[
  { bg:'#fff4e9', ac:'#f0820f' }, { bg:'#eaf4fb', ac:'#1577a0' }, { bg:'#eafaf0', ac:'#1f9d57' },
  { bg:'#f3eefc', ac:'#7c5cf0' }, { bg:'#fdeef0', ac:'#dc2626' }, { bg:'#eef7f9', ac:'#0e9aa7' },
  { bg:'#fdf6e3', ac:'#c99a06' }, { bg:'#f1f0fb', ac:'#5b5bd6' }, { bg:'#fef0f7', ac:'#c026a6' },
  { bg:'#eef6ee', ac:'#4a8f4a' }
];
function pal(gi){ return IZ_PALETTE[gi%IZ_PALETTE.length]; }
function izTint(hex){
  var m=/^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim()); if(!m) return 'rgba(240,138,29,.14)';
  var n=parseInt(m[1],16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',.13)';
}
function pad2(n){ return (n<10?'0':'')+n; }

// Taxonomy comes from the shared, read-only issue-types-data.js (window.IZ_CATS), so this page and the
// Build-Root-Cause-Details converter stay in sync.
var IZ_CATS=window.IZ_CATS||[];
function total(){ return IZ_CATS.reduce(function(s,c){ return s+c.types.length; },0); }

// ---- View state ----
var S={q:'',cat:-1,exAll:false};
var EXOPEN={};          // "gi_ti" -> example disclosure opened by the user
// Category expand state, never persisted (always collapsed on load). OPEN = the normal state;
// SOPEN = overrides while a search is active (matching categories default to open). SOPEN is
// dropped when the search is cleared, so the page returns to the OPEN state.
var OPEN={}, SOPEN={};
var announceT=null;

function tokens(){ return S.q.trim().toLowerCase().split(/\s+/).filter(Boolean); }
function isOpen(gi){ return tokens().length ? (gi in SOPEN ? SOPEN[gi] : true) : !!OPEN[gi]; }
// Record + apply a category's state in place (no re-render, so the height transition runs).
function setOpen(gi,v){
  if(tokens().length) SOPEN[gi]=v; else OPEN[gi]=v;
  var sec=$('izGrp'+gi), b=$('izCatH'+gi);
  if(sec) sec.classList.toggle('is-open',v);
  if(b) b.setAttribute('aria-expanded',String(v));
}
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function hay(cat,ty){ return [ty.type,ty.desc,ty.def,ty.use,ty.ex,cat.category].join(' ').toLowerCase(); }
function matches(cat,ty,tk){ if(!tk.length) return true; var h=hay(cat,ty); return tk.every(function(t){ return h.indexOf(t)>=0; }); }
// Escape + wrap search hits in <mark>.
function hl(s,rx){
  s=String(s==null?'':s); if(!rx) return esc(s);
  return s.split(rx).map(function(p,i){ return i%2?'<mark>'+esc(p)+'</mark>':esc(p); }).join('');
}

// Copy an incident type's NAME to the clipboard; briefly flash a check mark. Available to everyone.
function izCopyType(gi,ti,btn,ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  var cat=IZ_CATS[gi]; if(!cat) return; var ty=cat.types[ti]; if(!ty) return;
  var text=String(ty.type||'');
  var done=function(ok){
    if(!btn||!ok) return;
    var orig=btn.innerHTML;
    btn.innerHTML=ICO_CHECK+'<span>Copied</span>'; btn.classList.add('copied');
    say('Copied \u201c'+text+'\u201d to the clipboard.');
    setTimeout(function(){ btn.innerHTML=orig; btn.classList.remove('copied'); }, 1300);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ izCopyFallback(text,done); });
  } else { izCopyFallback(text,done); }
}
window.izCopyType=izCopyType;
// Fallback copy for insecure contexts / older browsers (hidden textarea + execCommand).
function izCopyFallback(text,done){
  try{
    var ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=document.execCommand('copy'); document.body.removeChild(ta); done(ok);
  }catch(e){ done(false); }
}

function say(msg){ var l=$('izLive'); if(l){ l.textContent=''; setTimeout(function(){ l.textContent=msg; },30); } }

// ---------- Hero ----------
function heroHtml(){
  var n=total(), c=IZ_CATS.length;
  var jump=IZ_CATS.map(function(cat,gi){
    return '<a href="#izGrp'+gi+'" data-jump="'+gi+'" style="--c:'+pal(gi).ac+'">'+esc(cat.category)+'<b>'+cat.types.length+'</b></a>';
  }).join('');
  return '<header class="izr-hero"><div class="izr-hero-in"><span class="izr-hero-ic">'+ICO_DOC+'</span><div class="izr-hero-txt">'+
    '<p class="izr-eyebrow">Reference guide \u00b7 Issue standardization</p><h1>Issue Type Standardization</h1>'+
    '<p class="izr-hero-sub">Every PHD incident type, grouped by category, with what it means, when to use it and an example. '+
      'Use these names <b>exactly as written</b> in ticket titles and on the <b>Issue:</b> line of the SIM root cause details.</p>'+
    '<ul class="izr-chips" aria-label="About this guide"><li>'+(n||'\u2014')+' issue types \u00b7 '+(c||'\u2014')+' categories</li><li>Copy-ready names</li><li>Read-only reference</li></ul>'+
    (c?'<nav class="izr-jump" aria-label="Jump to a category"><span class="izr-jump-k">Jump to</span>'+jump+'</nav>':'')+
    '</div></div></header>';
}

// ---------- Search / filter bar ----------
function barHtml(){
  var chips='<button type="button" class="izr-fchip is-all" data-cat="-1" aria-pressed="true">All<b id="izCnt-1">'+total()+'</b></button>'+
    IZ_CATS.map(function(cat,gi){
      return '<button type="button" class="izr-fchip" data-cat="'+gi+'" aria-pressed="false" style="--c:'+pal(gi).ac+'">'+esc(cat.category)+'<b id="izCnt'+gi+'">'+cat.types.length+'</b></button>';
    }).join('');
  return '<div class="izr-bar" role="search" aria-label="Search and filter issue types">'+
    '<div class="izr-bar-row">'+
      '<div class="izr-search">'+ICO_SEARCH+'<label class="izr-sr" for="izQ">Search issue types</label>'+
        '<input id="izQ" type="search" autocomplete="off" spellcheck="false" placeholder="Search types, definitions, examples" aria-describedby="izCount">'+
        '<button type="button" class="izr-clear" id="izClear" aria-label="Clear search" hidden>'+ICO_X+'</button></div>'+
      '<p class="izr-count" id="izCount"></p>'+
      '<div class="izr-xc" role="group" aria-label="Categories" style="margin-left:auto">'+
        '<button type="button" class="izr-extog" id="izOpenAll">Expand all</button>'+
        '<button type="button" class="izr-extog" id="izShutAll">Collapse all</button></div>'+
      '<button type="button" class="izr-extog" id="izExAll" aria-pressed="false" style="margin-left:0">'+ICO_EX+'<span>Show all examples</span></button>'+
    '</div>'+
    '<div class="izr-fl"><span class="izr-fl-k" id="izFlK">Category</span><div class="izr-fchips" role="group" aria-labelledby="izFlK">'+chips+'</div></div>'+
  '</div>';
}

// ---------- Cards ----------
function cardHtml(cat,gi,ty,ti,rx,tk){
  var key=gi+'_'+ti, ac=ty.color||'#e08a1d';
  var exHit=!!(tk.length&&tk.some(function(t){ return String(ty.ex||'').toLowerCase().indexOf(t)>=0; }));
  var open=S.exAll||EXOPEN[key]||exHit;
  return '<li><article class="izr-type" id="izType'+key+'" aria-labelledby="izTn'+key+'" style="--t:'+ac+';--tbg:'+izTint(ac)+'">'+
    '<div class="izr-type-top"><span class="izr-type-ic" aria-hidden="true">'+(ic(ty.icon,18)||'\u25cf')+'</span>'+
      '<div class="izr-type-ttl"><h3 class="izr-type-name" id="izTn'+key+'">'+hl(ty.type,rx)+'</h3><span class="izr-tag">'+esc(cat.category)+'</span></div>'+
      '<button type="button" class="izr-copy" aria-label="Copy issue type name: '+esc(ty.type)+'" title="Copy the exact name" onclick="izCopyType('+gi+','+ti+',this,event)">'+ICO_COPY+'<span>Copy</span></button>'+
    '</div>'+
    (ty.desc?'<p class="izr-desc">'+hl(ty.desc,rx)+'</p>':'')+
    '<dl class="izr-def">'+
      '<div><dt>'+ICO_DEF+'Definition</dt><dd>'+hl(ty.def||'\u2014',rx)+'</dd></div>'+
      '<div class="is-use"><dt>'+ICO_USE+'Use when</dt><dd>'+hl(ty.use||'\u2014',rx)+'</dd></div>'+
    '</dl>'+
    '<details class="izr-ex" data-key="'+key+'"'+(open?' open':'')+'><summary>'+ICO_EX+'Example<span class="izr-chev">'+ICO_CHEV+'</span></summary>'+
      '<p>'+hl(ty.ex||'\u2014',rx)+'</p></details>'+
  '</article></li>';
}

function renderList(){
  var tk=tokens(), rx=tk.length?new RegExp('('+tk.map(reEsc).join('|')+')','gi'):null;
  var html='', shown=0, i=0, all=0;
  IZ_CATS.forEach(function(cat,gi){
    var items=[];
    cat.types.forEach(function(ty,ti){ if(matches(cat,ty,tk)) items.push(ti); });
    all+=items.length;
    var cnt=$('izCnt'+gi); if(cnt){ cnt.textContent=items.length; cnt.parentNode.classList.toggle('is-zero',!items.length); }
    if(S.cat>=0&&S.cat!==gi) return;
    if(!items.length) return;
    shown+=items.length;
    var p=pal(gi), n=cat.types.length;
    var op=isOpen(gi);
    html+='<section class="izr-cat'+(op?' is-open':'')+'" id="izGrp'+gi+'" aria-labelledby="izCatH'+gi+'" style="--c:'+p.ac+';--cbg:'+p.bg+';--i:'+(i++)+'">'+
      '<h2 class="izr-cat-hh"><button type="button" class="izr-cat-h" id="izCatH'+gi+'" data-cat-tog="'+gi+'" aria-expanded="'+op+'" aria-controls="izCatB'+gi+'">'+
        '<span class="izr-cat-chev">'+CHEV+'</span>'+
        '<span class="izr-cat-tile" aria-hidden="true">'+(cat.catImg?'<img src="'+esc(cat.catImg)+'" alt="">':(ic(cat.catIcon||'alert',22)||'\u25cf'))+'</span>'+
        '<span class="izr-cat-txt"><span class="izr-cat-name">'+esc(cat.category)+'</span>'+
        '<span class="izr-cat-sub">'+(items.length===n?n+' type'+(n===1?'':'s'):items.length+' of '+n+' types match')+'</span></span>'+
        '<span class="izr-cat-no" aria-hidden="true">'+pad2(gi+1)+'</span></button></h2>'+
      '<div class="izr-cat-b" id="izCatB'+gi+'"><div class="izr-cat-in">'+
      '<ul class="izr-grid">'+items.map(function(ti){ return cardHtml(cat,gi,cat.types[ti],ti,rx,tk); }).join('')+'</ul>'+
    '</div></div></section>';
  });
  var allCnt=$('izCnt-1'); if(allCnt){ allCnt.textContent=all; allCnt.parentNode.classList.toggle('is-zero',!all); }
  if(!shown){
    var what=S.q.trim()?'\u201c'+esc(S.q.trim())+'\u201d':'this filter';
    html='<div class="izr-state"><span class="izr-state-ic">'+ICO_EMPTY+'</span><p class="izr-state-t">No issue types match '+what+'</p>'+
      '<p>Try a shorter word, or search a different part of the definition or example.</p>'+
      '<button type="button" class="izr-btn" id="izReset">Clear search and filters</button></div>';
  }
  $('izList').innerHTML=html;
  $('izList').classList.toggle('is-cats',!!shown);
  var T=total();
  $('izCount').innerHTML=(shown===T?'<b>'+T+'</b> issue types':'Showing <b>'+shown+'</b> of '+T);
  document.querySelectorAll('.izr-fchip').forEach(function(b){ b.setAttribute('aria-pressed',String(+b.getAttribute('data-cat')===S.cat)); });
  $('izClear').hidden=!S.q;
  clearTimeout(announceT);
  announceT=setTimeout(function(){ say(shown===T?'Showing all '+T+' issue types.':shown+' of '+T+' issue types shown.'); },450);
}

function resetFilters(){ S.q=''; S.cat=-1; SOPEN={}; var q=$('izQ'); if(q) q.value=''; renderList(); }

// ---------- Error / loading states (the taxonomy file failed to load) ----------
function skeletonHtml(){
  var card='<li class="izr-skel-card"><span class="izr-skel" style="width:60%;height:16px"></span><span class="izr-skel" style="width:35%;height:12px"></span>'+
    '<span class="izr-skel" style="width:100%;height:11px"></span><span class="izr-skel" style="width:92%;height:11px"></span><span class="izr-skel" style="width:70%;height:11px"></span></li>';
  return '<section class="izr-cat" aria-hidden="true"><div class="izr-cat-h" style="--c:#c4ccd4;--cbg:#f5f6f8"><span class="izr-skel" style="width:46px;height:46px;border-radius:10px"></span>'+
    '<div class="izr-cat-txt"><span class="izr-skel" style="width:180px;height:16px"></span><span class="izr-skel" style="width:90px;height:11px;margin-top:6px"></span></div></div>'+
    '<ul class="izr-grid">'+card+card+card+'</ul></section>';
}
function errorHtml(){
  return '<div class="izr-state" role="alert"><span class="izr-state-ic is-err">'+ICO_ALERT+'</span><p class="izr-state-t">The issue types didn\u2019t load</p>'+
    '<p>The reference list couldn\u2019t be read from the dashboard server. Check your connection, then try again.</p>'+
    '<button type="button" class="izr-btn" id="izRetry">'+ICO_RETRY+'Retry</button></div>';
}
function retry(){
  var list=$('izList'); list.setAttribute('aria-busy','true'); list.innerHTML=skeletonHtml(); say('Loading issue types\u2026');
  var s=document.createElement('script'); s.src='issue-types-data.js?v=4&r='+Date.now();
  s.onload=function(){ IZ_CATS=window.IZ_CATS||[]; boot(); };
  s.onerror=function(){ list.removeAttribute('aria-busy'); list.innerHTML=errorHtml(); say('The issue types still could not be loaded.'); };
  document.body.appendChild(s);
}

// ---------- Boot + events ----------
function boot(){
  var ok=IZ_CATS.length>0;
  $('wrap').innerHTML='<main class="izr'+(REDUCED?'':' is-anim')+(ok?'':' is-nobar')+'" id="izMain">'+heroHtml()+(ok?barHtml():'')+
    '<p class="izr-sr" aria-live="polite" id="izLive"></p><div class="izr-list" id="izList">'+(ok?'':errorHtml())+'</div></main>';
  if(ok){
    var hm=/^#izGrp(\d+)$/.exec(location.hash); if(hm) OPEN[+hm[1]]=true;   // deep link opens its section
    renderList(); if(hm){ var t=document.querySelector(location.hash); if(t) t.scrollIntoView(); }
  }
  else say('The issue types could not be loaded.');
}

document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='izQ'){ S.q=e.target.value; if(!tokens().length) SOPEN={}; renderList(); }
});
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.id==='izQ'&&e.key==='Escape'&&e.target.value){ e.preventDefault(); S.q=''; SOPEN={}; e.target.value=''; renderList(); }
});
document.addEventListener('click',function(e){
  var t=e.target; if(!t||!t.closest) return;
  var tog=t.closest('[data-cat-tog]');
  if(tog){ var g=+tog.getAttribute('data-cat-tog'); setOpen(g,tog.getAttribute('aria-expanded')!=='true'); return; }
  var all=t.closest('#izOpenAll,#izShutAll');
  if(all){
    var v=all.id==='izOpenAll';
    IZ_CATS.forEach(function(c,gi){ setOpen(gi,v); });
    say(v?'All categories expanded.':'All categories collapsed.');
    return;
  }
  var chip=t.closest('.izr-fchip');
  if(chip){
    var c=+chip.getAttribute('data-cat'); S.cat=(S.cat===c&&c>=0)?-1:c;
    if(S.cat>=0){ if(tokens().length) SOPEN[S.cat]=true; else OPEN[S.cat]=true; }   // a single category opens
    renderList(); return;
  }
  if(t.closest('#izClear')){ S.q=''; SOPEN={}; var q=$('izQ'); q.value=''; renderList(); q.focus(); return; }
  if(t.closest('#izReset')){ resetFilters(); var q2=$('izQ'); if(q2) q2.focus(); return; }
  if(t.closest('#izRetry')){ retry(); return; }
  var ex=t.closest('#izExAll');
  if(ex){
    S.exAll=!S.exAll; EXOPEN={};
    ex.setAttribute('aria-pressed',String(S.exAll)); ex.querySelector('span').textContent=S.exAll?'Hide all examples':'Show all examples';
    document.querySelectorAll('.izr-ex').forEach(function(d){ d.open=S.exAll; });
    return;
  }
  var j=t.closest('[data-jump]');
  if(j){
    e.preventDefault();
    var gi=+j.getAttribute('data-jump');
    if(!$('izGrp'+gi)){ S.q=''; S.cat=-1; SOPEN={}; var q3=$('izQ'); if(q3) q3.value=''; renderList(); }
    var sec=$('izGrp'+gi); if(!sec) return;
    setOpen(gi,true);
    sec.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'});
    var h=$('izCatH'+gi); if(h) h.focus({preventScroll:true});
    try{ history.replaceState(null,'','#izGrp'+gi); }catch(err){}
  }
});
// Remember examples a user opened one by one (summary click/Enter/Space all fire click), so they survive
// re-renders while searching. A 'toggle' listener would also catch disclosures opened by a search hit.
document.addEventListener('click',function(e){
  var sm=e.target&&e.target.closest&&e.target.closest('.izr-ex>summary'); if(!sm) return;
  var d=sm.parentNode, k=d.getAttribute('data-key');
  if(!d.open) EXOPEN[k]=true; else delete EXOPEN[k];   // state before the browser flips it
});

boot();
})();
</script>
</body>
