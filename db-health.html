<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Health · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
/* Keep the static fallback bar's box (no layout jump) but invisible, so the shared toolbar (with the
   hamburger, injected by topbar-auth.js) is the only bar the user sees — no hamburger-less flash. */
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.wrap{padding:32px 24px}

/* Global: main content spans the viewport (15px gutters) at all sizes. */
.wrap,.content{width:auto!important;max-width:none!important;margin-left:15px!important;margin-right:15px!important}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
<!-- ===== Database Health page styles (loaded last, wins the cascade) =====
     Same visual language as errors-in-resolved.html / performance-summary.html: dark navy hero
     (grid texture + orange glow + orange left rule), KPI cards that overlap it, then white section
     cards. Everything is scoped under .dbh (a size container for the responsive grids). -->
<style id="db-light">
#wrap.wrap{padding-top:0!important;padding-bottom:28px!important}
.dbh{--ink:#1b2026;--mut:#5c6773;--mut2:#8793a0;--line:#e2e6ea;--soft:#f5f6f8;--acc:#ec7211;--acc-bg:#fff3e8;--acc-ink:#9a4100;
  --red:#b42318;--red-bg:#fdecec;--grn:#1a7a43;--grn-bg:#e5f5ec;--amb:#8a5300;--amb-bg:#fff4e0;--blue:#1f4f9a;--blue-bg:#e9f0fb;
  --navy:#1f2a40;--focus:#f0a35a;container-type:inline-size;color:var(--ink)}
.dbh button{font:inherit;text-transform:none}
.dbh :is(button,a,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.dbh-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.dbh-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 80px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.dbh-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.dbh-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.dbh-hero-in{position:relative;display:flex;gap:20px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.dbh-hero-main{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1 1 380px}
.dbh-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.dbh-hero-txt{min-width:0}
.dbh-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.dbh-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.08}
.dbh-hero-sub{margin-top:9px;max-width:64ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.8)}
.dbh-hero-sub b{color:#fff;font-weight:800;overflow-wrap:anywhere}
.dbh-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;list-style:none;padding:0}
.dbh-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  font-size:.8em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;max-width:100%;min-width:0;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dbh-chip svg{flex-shrink:0;color:#ffb26b}
.dbh-chip span{color:rgba(233,237,243,.62);font-weight:800;font-size:.86em;letter-spacing:1px;text-transform:uppercase;flex-shrink:0}
.dbh-chip b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Overall status badge on the hero (glassy, status-tinted; always icon + text). */
.dbh-hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto;max-width:100%}
.dbh-overall{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.dbh-overall-ic{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--sb);color:var(--sf)}
.dbh-overall-k{display:block;font-size:.64em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:rgba(233,237,243,.62)}
.dbh-overall-v{display:block;margin-top:2px;font-size:1.05em;font-weight:800;color:var(--sf)}
.dbh-overall.is-ok{--sb:rgba(74,222,128,.16);--sf:#7ee2a5}
.dbh-overall.is-warn{--sb:rgba(251,191,36,.18);--sf:#ffd27a}
.dbh-overall.is-bad{--sb:rgba(255,99,99,.2);--sf:#ff9b93}
.dbh-overall-note{font-size:.76em;font-weight:600;color:rgba(233,237,243,.7);text-align:right;max-width:34ch;line-height:1.4}

/* ---- KPI row (overlaps the hero) ---- */
.dbh-kpis{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:-58px 18px 16px}
@container (min-width:520px){.dbh-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.dbh-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dbh-kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.dbh-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,var(--navy))}
.dbh-kpi-l{display:flex;align-items:center;gap:9px;font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.dbh-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--kb,var(--soft));color:var(--ki,#3a4552)}
.dbh-kpi-v{margin-top:12px;font-size:2.2em;font-weight:800;letter-spacing:-1.1px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);overflow-wrap:anywhere}
.dbh-kpi-s{margin-top:9px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:.8em;font-weight:600;color:var(--mut)}
.dbh-kpi-s b{color:var(--ink);font-weight:800}
.dbh-kpi-bar{margin-top:12px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.dbh-kpi-bar i{display:block;height:100%;border-radius:inherit;background:var(--k)}
.dbh-kpi.k-base{--k:var(--navy)}
.dbh-kpi.k-blue{--k:#2b66c1;--kb:var(--blue-bg);--ki:var(--blue)}
.dbh-kpi.is-ok{--k:#1f9d57;--kb:var(--grn-bg);--ki:var(--grn)}
.dbh-kpi.is-warn{--k:#e09a12;--kb:var(--amb-bg);--ki:var(--amb)}
.dbh-kpi.is-bad{--k:#d92d20;--kb:var(--red-bg);--ki:var(--red)}
.dbh-kpi.is-bad .dbh-kpi-v{color:var(--red)}

/* ---- Status pills (icon + text, never colour only) ---- */
.dbh-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:99px;font-size:.78em;font-weight:800;line-height:1.25;white-space:nowrap;
  font-variant-numeric:tabular-nums;border:1px solid transparent}
.dbh-pill svg{flex-shrink:0}
.dbh-pill.is-ok{background:var(--grn-bg);color:var(--grn);border-color:#bfe6cf}
.dbh-pill.is-warn{background:var(--amb-bg);color:var(--amb);border-color:#f6d49a}
.dbh-pill.is-bad{background:var(--red-bg);color:var(--red);border-color:#f2c3bd}
.dbh-pill.is-mute{background:#eef1f4;color:#3a4552;border-color:var(--line)}
.dbh-cnt{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.78em;font-weight:700;color:#3a4552;white-space:nowrap;font-variant-numeric:tabular-nums}
.dbh-cnt b{color:var(--ink);font-weight:800}

/* ---- Section cards ---- */
.dbh-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18);margin-bottom:16px;overflow:hidden}
.dbh-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.dbh-card.is-shut .dbh-card-head{border-bottom-color:transparent}
.dbh-card-h{display:flex;align-items:center;gap:12px;min-width:0;font-size:1em;font-weight:inherit}
.dbh-card-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;flex-shrink:0;background:var(--cb,var(--blue-bg));color:var(--ci,var(--blue))}
.dbh-card.t-acc{--cb:var(--acc-bg);--ci:#b5530a}
.dbh-card.t-navy{--cb:#e8ebf1;--ci:var(--navy)}
.dbh-card-tt{display:flex;flex-direction:column;min-width:0;text-align:left}
.dbh-card-title{font-size:1.12em;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:var(--ink)}
.dbh-card-sub{margin-top:3px;font-size:.8em;font-weight:500;color:var(--mut);line-height:1.4}
.dbh-card-body{padding:16px 20px 18px}
.dbh-card-body[hidden]{display:none}
.dbh-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Chevron expander (as on errors-in-resolved). */
.dbh-exp{display:inline-flex;align-items:center;gap:12px;margin:-5px -8px;padding:5px 10px 5px 6px;border:none;border-radius:9px;background:none;color:var(--ink);cursor:pointer;min-width:0}
.dbh-exp:hover{background:#fafbfc}
.dbh-chev{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;color:#818284}
.dbh-chev svg{transition:transform .15s}
.dbh-exp[aria-expanded="true"] .dbh-chev svg{transform:rotate(90deg)}
.dbh-exp:hover .dbh-chev{background:#e6f0fc;color:#2b66c1}

/* ---- Storage usage gauge (segmented: data + indexes vs the tier limit, with 50% / 80% marks) ---- */
.dbh-gauge{position:relative;height:16px;border-radius:99px;background:#eef1f4;border:1px solid var(--line);overflow:hidden;display:flex}
.dbh-gauge i{display:block;height:100%}
.dbh-gauge .g-data{background:linear-gradient(90deg,#2f3f5f,var(--navy))}
.dbh-gauge .g-idx{background:linear-gradient(90deg,#f5a54a,var(--acc))}
.dbh-marks{position:relative;height:18px;margin-top:4px;font-size:.68em;font-weight:800;color:var(--mut2);font-variant-numeric:tabular-nums}
.dbh-marks>span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.dbh-marks>span::before{content:'';position:absolute;left:50%;top:-22px;width:1px;height:18px;background:rgba(27,32,38,.22)}
.dbh-marks .m0{left:0;transform:none}.dbh-marks .m0::before{display:none}
.dbh-marks .m100{left:auto;right:0;transform:none}.dbh-marks .m100::before{display:none}
.dbh-legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:12px;list-style:none;padding:0}
.dbh-legend li{display:flex;align-items:center;gap:8px;font-size:.84em;font-weight:600;color:var(--mut)}
.dbh-legend li::before{content:'';width:10px;height:10px;border-radius:3px;flex-shrink:0;background:var(--lg)}
.dbh-legend b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.dbh-legend .l-data{--lg:var(--navy)}.dbh-legend .l-idx{--lg:var(--acc)}.dbh-legend .l-free{--lg:#d8dde3}
.dbh-cap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;margin-top:12px;padding-top:12px;border-top:1px solid #eef1f4;font-size:.84em;font-weight:600;color:var(--mut)}
.dbh-cap b{color:var(--ink);font-weight:800}

/* ---- Tables ---- */
.dbh-scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.dbh-tbl{width:100%;min-width:640px;border-collapse:separate;border-spacing:0;font-size:.88em}
.dbh .dbh-tbl th,.dbh .dbh-tbl td{padding:10px 14px;border-bottom:1px solid #eef1f4!important;text-align:left;vertical-align:middle;color:#2a3340!important;white-space:nowrap;background:#fff!important}
.dbh .dbh-tbl thead th{position:sticky;top:0;z-index:1;background:#f5f6f8!important;border-bottom:1px solid var(--line)!important;font-size:.72em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)!important}
.dbh .dbh-tbl tbody tr:last-child>*{border-bottom:none!important}
.dbh .dbh-tbl tbody tr:hover>*{background:#fafbfc!important}
.dbh .dbh-tbl tbody th{font-weight:800;color:var(--ink)!important}
.dbh .dbh-tbl .n{text-align:center;font-variant-numeric:tabular-nums}
.dbh-name{display:inline-flex;align-items:center;gap:8px}
.dbh-name code{font-family:inherit;font-weight:800}
/* Number + proportional inline bar, centred in its cell. */
.dbh-num{display:inline-flex;flex-direction:column;align-items:center;gap:5px;min-width:86px}
.dbh-num>span{font-weight:700;color:var(--ink)}
.dbh-ibar{display:block;width:86px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.dbh-ibar i{display:block;height:100%;border-radius:inherit;background:var(--b,linear-gradient(90deg,#f5a54a,var(--acc)))}
.dbh-ibar.b-navy{--b:linear-gradient(90deg,#3d5078,var(--navy))}
.dbh-ibar.is-ok{--b:#1f9d57}.dbh-ibar.is-warn{--b:#e09a12}.dbh-ibar.is-bad{--b:#d92d20}
.dbh-na{color:var(--mut2);font-weight:700}
.dbh-note{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:.82em;line-height:1.55;color:var(--mut)}
.dbh-note svg{flex-shrink:0;margin-top:2px;color:var(--blue)}

/* ---- Buttons ---- */
.dbh-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;border:1px solid transparent;font-size:.86em;font-weight:800;
  cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s;background:var(--acc);color:#fff;box-shadow:0 8px 18px -12px rgba(236,114,17,.9)}
.dbh-btn:hover{background:#d4620b}
.dbh-btn:active{transform:translateY(1px)}
.dbh-btn.is-ghost{background:#fff;color:#3a4552;border-color:#d4dade;box-shadow:none}
.dbh-btn.is-ghost:hover{background:#f5f6f8;border-color:#c4ccd4}
.dbh-btn.is-danger{background:#c0261a;box-shadow:none}
.dbh-btn.is-danger:hover{background:#a11f15}

/* ---- States (gate / error) ---- */
.dbh-state{position:relative;z-index:1;margin:-58px 18px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 32px -24px rgba(20,30,50,.6);
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:38px 20px;text-align:center;color:var(--mut)}
.dbh-state-ic{width:58px;height:58px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--red-bg);color:var(--red);margin-bottom:4px}
.dbh-state-ic.is-lock{background:var(--acc-bg);color:#b5530a}
.dbh-state h2{font-size:1.08em;font-weight:800;color:var(--ink)!important}
.dbh-state p{font-size:.9em;max-width:52ch;line-height:1.5}
.dbh-state .dbh-btn{margin-top:6px}

/* ---- Loading skeleton ---- */
.dbh-sk{display:block;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:dbhShim 1.4s ease infinite}
.dbh-sk-d{background:linear-gradient(90deg,rgba(255,255,255,.08) 25%,rgba(255,255,255,.18) 40%,rgba(255,255,255,.08) 60%);background-size:400% 100%}
@keyframes dbhShim{0%{background-position:100% 0}100%{background-position:0 0}}
.dbh-kpi.is-sk::before{background:#e2e6ea}
.dbh-chip.is-sk{min-width:150px}
.dbh-sk-row{display:flex;align-items:center;gap:18px;padding:13px 14px;border-bottom:1px solid #eef1f4}
.dbh-sk-row:last-child{border-bottom:none}
.dbh-sk-row.is-h{background:#f5f6f8}

.dbh-foot{font-size:.78em;color:var(--mut2);text-align:center;margin-top:18px}
.dbh-foot b{color:var(--mut);font-weight:800}

/* One orchestrated entrance on first paint: hero, KPI cards (staggered), then the sections. */
@keyframes dbhUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dbh.is-anim .dbh-kpi{animation:dbhUp .5s ease both}
.dbh.is-anim .dbh-kpi:nth-child(2){animation-delay:.06s}
.dbh.is-anim .dbh-kpi:nth-child(3){animation-delay:.12s}
.dbh.is-anim .dbh-kpi:nth-child(4){animation-delay:.18s}
.dbh.is-anim .dbh-card{animation:dbhUp .5s ease .2s both}

/* Medium: the status block wraps under the title, so line it up with the title text. */
@container (max-width:1000px){
  .dbh-hero-side{align-items:flex-start;padding-left:64px}
  .dbh-overall-note{text-align:left}
}
/* Small screens */
@container (max-width:700px){
  .dbh-hero-side{padding-left:0}
  .dbh-hero{padding:22px 18px 76px 22px}
  .dbh-hero h1{font-size:1.6em;letter-spacing:-.6px}
  .dbh-hero-ic{display:none}
  .dbh-hero-main{flex-basis:100%}
  .dbh-hero-side{align-items:stretch;width:100%}
  .dbh-overall-note{text-align:left}
  .dbh-kpis,.dbh-state{margin-left:10px;margin-right:10px}
  .dbh-card-head,.dbh-card-body{padding-left:14px;padding-right:14px}
  .dbh-kpi-v{font-size:1.95em}
  .dbh-chip{flex:1 1 100%}
  .dbh-mk-t,.dbh-marks .m100{display:none}
}
@media (prefers-reduced-motion:reduce){
  .dbh *,.dbh *::before,.dbh *::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body data-nav-active="db-health" data-back-href="index.html" data-back-label="Home">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap" aria-busy="true"></div>
<!-- Polite live region (outside #wrap so re-renders never drop an announcement). -->
<p class="dbh-sr" id="dbhLive" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap"></p>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=215"></script>
<script>
const A=window.PHDAuth;
const canDatabase=()=>A.canDatabase&&A.canDatabase();
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const ic=(n,s)=>window.icon?window.icon(n,s||18):'';
// Human-friendly bytes.
function fmtBytes(b){
  b=Number(b)||0;
  if(b>=1073741824)return (b/1073741824).toFixed(2)+' GB';
  if(b>=1048576)return (b/1048576).toFixed(2)+' MB';
  if(b>=1024)return (b/1024).toFixed(1)+' KB';
  return b+' B';
}
function num(n){return (Number(n)||0).toLocaleString();}
function fmtDate(iso){ if(!iso) return '\u2014'; const d=new Date(iso); return isNaN(d)?'\u2014':d.toLocaleString(); }
function clampPct(p){ return Math.max(0,Math.min(100,Number(p)||0)); }
const CHEV='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// Status from a "% of limit" value (same thresholds as before: >=80 critical, >=50 warning).
function status(p){
  p=Number(p)||0;
  if(p>=80) return {k:'bad',label:'Critical',icon:'alert',rank:2};
  if(p>=50) return {k:'warn',label:'Warning',icon:'alert-triangle',rank:1};
  return {k:'ok',label:'Healthy',icon:'check-circle',rank:0};
}
function pill(s,txt){ return '<span class="dbh-pill is-'+s.k+'">'+ic(s.icon,13)+esc(txt||s.label)+'</span>'; }
function pctTxt(p){ return p<0.1?'<0.1%':(Math.round(p*10)/10)+'%'; }
function envName(){ return /^https?:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/.test(window.PHD_API_BASE||'')?'Local':'Production'; }

const $=id=>document.getElementById(id);
let FIRST=true;
// Collapsible sections: open by default; remembered in this browser.
const LS_OPEN='phd_dbh_open';
let OPEN={q:true,c:true}; try{ Object.assign(OPEN,JSON.parse(localStorage.getItem(LS_OPEN)||'{}')); }catch(e){}

function announce(msg){ const l=$('dbhLive'); if(l){ l.textContent=''; setTimeout(()=>{ l.textContent=msg; },30); } }
function setBusy(b){ const w=$('wrap'); if(w) w.setAttribute('aria-busy',b?'true':'false'); }

// ---------- Hero ----------
function heroHtml(d,mode){
  let chips='', side='';
  if(mode==='loading'){
    const sk=w=>'<li class="dbh-chip is-sk" aria-hidden="true"><span class="dbh-sk dbh-sk-d" style="width:'+w+'px;height:12px"></span></li>';
    chips='<ul class="dbh-chips">'+sk(150)+sk(190)+sk(210)+sk(130)+'</ul>';
    side='<div class="dbh-hero-side" aria-hidden="true"><div class="dbh-overall"><span class="dbh-sk dbh-sk-d" style="width:36px;height:36px;border-radius:10px"></span>'+
      '<span><span class="dbh-sk dbh-sk-d" style="width:90px;height:9px"></span><span class="dbh-sk dbh-sk-d" style="width:70px;height:14px;margin-top:6px"></span></span></div></div>';
  } else if(d){
    const chip=(icon,k,v)=>'<li class="dbh-chip">'+ic(icon,14)+'<span>'+k+'</span><b title="'+esc(v)+'">'+esc(v)+'</b></li>';
    chips='<ul class="dbh-chips" aria-label="Report details">'+
      chip('database','Database',d.db||'\u2014')+
      chip('shield','Tier',(d.tier&&d.tier.name)||'tier')+
      chip('clock','Last checked',fmtDate(d.generatedAt))+
      chip('globe','Environment',envName())+'</ul>';
    const o=overall(d);
    side='<div class="dbh-hero-side"><div class="dbh-overall is-'+o.s.k+'"><span class="dbh-overall-ic">'+ic(o.s.icon,20)+'</span>'+
      '<span><span class="dbh-overall-k">Overall status</span><span class="dbh-overall-v">'+o.s.label+'</span></span></div>'+
      '<p class="dbh-overall-note">'+esc(o.note)+'</p></div>';
  }
  const sub=d&&mode!=='loading'
    ?'Live storage and collection stats for the <b>'+esc(d.db)+'</b> database \u00b7 generated '+esc(fmtDate(d.generatedAt))+'.'
    :'Live storage and collection stats for the dashboard database.';
  return '<div class="dbh-hero"><div class="dbh-hero-in"><div class="dbh-hero-main"><span class="dbh-hero-ic">'+ic('database',24)+'</span><div class="dbh-hero-txt">'+
    '<p class="dbh-eyebrow">Platform \u00b7 Read-only monitor</p><h1>Database Health</h1>'+
    '<p class="dbh-hero-sub">'+sub+'</p>'+chips+'</div></div>'+side+'</div></div>';
}
// Worst of: storage vs tier limit, largest quarter document vs the 16 MB per-document limit.
function overall(d){
  const u=usage(d), s1=status(u.pct);
  const qmax=(d.quarters||[]).reduce((m,q)=>Math.max(m,Number(q.docLimitPct)||0),0), s2=status(qmax);
  const s=s2.rank>s1.rank?s2:s1;
  let note='Storage at '+pctTxt(u.pct)+' of the tier limit';
  if((d.quarters||[]).length) note+='; largest quarter document at '+pctTxt(qmax)+' of 16 MB';
  return {s:s,note:note+'.'};
}
function usage(d){
  const totals=d.totals||{};
  const limit=(d.tier&&d.tier.limitBytes)||(512*1024*1024);
  const used=totals.totalSize||0;
  return {limit:limit,used:used,pct:Math.min(100,(used/limit)*100)};
}

// ---------- KPIs ----------
function kpi(cls,icon,label,value,sub,ratio){
  return '<div class="dbh-kpi '+cls+'"><p class="dbh-kpi-l"><span class="dbh-kpi-ic">'+ic(icon,15)+'</span>'+label+'</p>'+
    '<p class="dbh-kpi-v">'+esc(value)+'</p><p class="dbh-kpi-s">'+sub+'</p>'+
    (ratio==null?'':'<div class="dbh-kpi-bar" aria-hidden="true"><i style="width:'+Math.max(ratio,0.5).toFixed(2)+'%"></i></div>')+'</div>';
}
function kpisHtml(d){
  const t=d.totals||{}, u=usage(d), s=status(u.pct);
  return '<div class="dbh-kpis">'+
    kpi('is-'+s.k,'database','Total size',fmtBytes(t.totalSize),pill(s,s.label)+'<span><b>'+pctTxt(u.pct)+'</b> of '+fmtBytes(u.limit)+' \u00b7 data + indexes</span>',u.pct)+
    kpi('k-base','inbox','Storage on disk',fmtBytes(t.storageSize),'Compressed size on disk',null)+
    kpi('k-blue','hash','Total documents',num(t.objects),'Across <b>'+num(t.collections)+'</b> collection'+(Number(t.collections)===1?'':'s'),null)+
    kpi('k-base','users','User accounts',num(d.usersCount),'Registered dashboard users',null)+
    '</div>';
}

// ---------- Storage usage ----------
function usageHtml(d){
  const t=d.totals||{}, u=usage(d), s=status(u.pct);
  const dp=clampPct((t.dataSize||0)/u.limit*100), ip=clampPct((t.indexSize||0)/u.limit*100);
  const free=Math.max(0,u.limit-u.used);
  // Keep a sliver visible when usage is tiny.
  const dw=Math.max(dp,dp>0?0.4:0), iw=Math.max(ip,ip>0?0.4:0);
  return '<section class="dbh-card t-navy" aria-labelledby="dbhUseH"><div class="dbh-card-head"><h2 class="dbh-card-h" id="dbhUseH"><span class="dbh-card-ic">'+ic('bar-chart',17)+'</span>'+
    '<span class="dbh-card-tt"><span class="dbh-card-title">Storage usage</span><span class="dbh-card-sub">Data and indexes against the '+esc((d.tier&&d.tier.name)||'tier')+' limit</span></span></h2>'+
    '<div class="dbh-card-meta">'+pill(s,s.label+' \u00b7 '+pctTxt(u.pct))+'</div></div>'+
    '<div class="dbh-card-body">'+
      '<div class="dbh-gauge" role="img" aria-label="'+esc(fmtBytes(u.used)+' used, '+pctTxt(u.pct)+' of '+fmtBytes(u.limit)+'. Status: '+s.label)+'">'+
        '<i class="g-data" style="width:'+dw.toFixed(2)+'%"></i><i class="g-idx" style="width:'+iw.toFixed(2)+'%"></i></div>'+
      '<div class="dbh-marks" aria-hidden="true"><span class="m0">0</span><span style="left:50%">50%<span class="dbh-mk-t"> warning</span></span><span style="left:80%">80%<span class="dbh-mk-t"> critical</span></span><span class="m100">'+esc(fmtBytes(u.limit))+'</span></div>'+
      '<ul class="dbh-legend"><li class="l-data">Data size <b>'+fmtBytes(t.dataSize)+'</b></li><li class="l-idx">Index size <b>'+fmtBytes(t.indexSize)+'</b></li><li class="l-free">Free <b>'+fmtBytes(free)+'</b></li></ul>'+
      '<div class="dbh-cap"><span><b>'+fmtBytes(u.used)+'</b> used</span><span><b>'+pctTxt(u.pct)+'</b> of '+fmtBytes(u.limit)+' ('+esc((d.tier&&d.tier.name)||'tier')+')</span></div>'+
    '</div></section>';
}

// ---------- Collapsible table sections ----------
function sectionHtml(key,tone,icon,title,sub,meta,body){
  const open=!!OPEN[key], bid='dbhSec_'+key;
  return '<section class="dbh-card '+tone+(open?'':' is-shut')+'" aria-labelledby="dbhSecH_'+key+'"><div class="dbh-card-head">'+
    '<h2 class="dbh-card-h" id="dbhSecH_'+key+'"><button type="button" class="dbh-exp" data-sec="'+key+'" aria-expanded="'+open+'" aria-controls="'+bid+'">'+
      '<span class="dbh-chev">'+CHEV+'</span><span class="dbh-card-ic">'+ic(icon,17)+'</span>'+
      '<span class="dbh-card-tt"><span class="dbh-card-title">'+title+'</span><span class="dbh-card-sub">'+sub+'</span></span></button></h2>'+
    '<div class="dbh-card-meta">'+meta+'</div></div>'+
    '<div class="dbh-card-body" id="'+bid+'"'+(open?'':' hidden')+'>'+body+'</div></section>';
}
// Number + proportional bar (ratio 0..1 of the column max).
function numBar(txt,ratio,cls,label){
  return '<span class="dbh-num"><span>'+esc(txt)+'</span><span class="dbh-ibar '+(cls||'')+'" aria-hidden="true"><i style="width:'+(ratio>0?Math.max(3,ratio*100):0).toFixed(1)+'%"></i></span>'+
    (label?'<span class="dbh-sr">'+esc(label)+'</span>':'')+'</span>';
}

function quartersHtml(d){
  if(!Array.isArray(d.quarters)||!d.quarters.length) return '';
  const qs=d.quarters.slice().sort((a,b)=>(b.tickets||0)-(a.tickets||0));
  const maxT=qs.reduce((m,q)=>Math.max(m,q.tickets||0),0), maxB=qs.reduce((m,q)=>Math.max(m,q.approxBytes||0),0);
  let worst=status(0);
  const rows=qs.map(q=>{
    const p=Number(q.docLimitPct)||0, s=status(p); if(s.rank>worst.rank) worst=s;
    return '<tr><th scope="row">'+esc(q.id)+'</th>'+
      '<td class="n">'+numBar(num(q.tickets),maxT?(q.tickets||0)/maxT:0,'b-navy')+'</td>'+
      '<td class="n">'+numBar(fmtBytes(q.approxBytes),maxB?(q.approxBytes||0)/maxB:0,'')+'</td>'+
      '<td class="n"><span class="dbh-num">'+pill(s,(p<0.1?'<0.1':p)+'% \u00b7 '+s.label)+
        '<span class="dbh-ibar is-'+s.k+'" aria-hidden="true"><i style="width:'+Math.max(p>0?2:0,clampPct(p)).toFixed(1)+'%"></i></span></span></td>'+
      '<td>'+(q.publishedAt?esc(fmtDate(q.publishedAt)):'<span class="dbh-na">\u2014</span>')+'</td></tr>';
  }).join('');
  const body='<div class="dbh-scroll" tabindex="0" role="region" aria-label="Ticket datasets by quarter"><table class="dbh-tbl"><thead><tr>'+
    '<th scope="col">Quarter</th><th scope="col" class="n">Tickets</th><th scope="col" class="n">Doc size</th><th scope="col" class="n">16MB limit</th><th scope="col">Published</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<p class="dbh-note">'+ic('info',14)+'<span>Each quarter stores all its tickets inside a single MongoDB document (16 MB hard limit). Watch the \u201c16MB limit\u201d column as ticket volume grows.</span></p>';
  return sectionHtml('q','t-acc','calendar','Ticket datasets (quarters)','Largest documents, sorted by ticket count',
    '<span class="dbh-cnt"><b>'+num(qs.length)+'</b> quarter'+(qs.length===1?'':'s')+'</span>'+pill(worst,worst.label),body);
}

function collectionsHtml(d){
  const cols=d.collections||[];
  const maxC=cols.reduce((m,c)=>Math.max(m,c.count||0),0), maxS=cols.reduce((m,c)=>Math.max(m,c.storageSize||0),0);
  const na='<span class="dbh-na" aria-label="Not available">\u2014</span>';
  const rows=cols.map(c=>{
    const err=!!c.error;
    return '<tr><th scope="row"><span class="dbh-name"><code>'+esc(c.name)+'</code>'+(err?'<span class="dbh-pill is-bad">'+ic('alert-triangle',12)+'Stats unavailable</span>':'')+'</span></th>'+
      '<td class="n">'+(err?na:numBar(num(c.count),maxC?(c.count||0)/maxC:0,'b-navy'))+'</td>'+
      '<td class="n">'+(err?na:esc(fmtBytes(c.dataSize)))+'</td>'+
      '<td class="n">'+(err?na:numBar(fmtBytes(c.storageSize),maxS?(c.storageSize||0)/maxS:0,''))+'</td>'+
      '<td class="n">'+(err?na:esc(fmtBytes(c.indexSize)))+'</td>'+
      '<td class="n">'+(err?na:num(c.indexes))+'</td></tr>';
  }).join('');
  const body=cols.length
    ?'<div class="dbh-scroll" tabindex="0" role="region" aria-label="Collections"><table class="dbh-tbl"><thead><tr>'+
      '<th scope="col">Collection</th><th scope="col" class="n">Docs</th><th scope="col" class="n">Data</th><th scope="col" class="n">Storage</th><th scope="col" class="n">Index</th><th scope="col" class="n"><abbr title="Number of indexes" style="text-decoration:none">#idx</abbr></th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div>'
    :'<p class="dbh-note">'+ic('info',14)+'<span>No collections reported.</span></p>';
  return sectionHtml('c','','grid','Collections ('+cols.length+')','Per-collection documents, data, storage and indexes \u00b7 largest storage first',
    '<span class="dbh-cnt"><b>'+num(cols.length)+'</b> collection'+(cols.length===1?'':'s')+'</span>',body);
}

// ---------- Page states ----------
function skeletonHtml(){
  const k='<div class="dbh-kpi is-sk" aria-hidden="true"><span class="dbh-sk" style="width:55%;height:11px"></span><span class="dbh-sk" style="width:45%;height:30px;margin-top:14px"></span><span class="dbh-sk" style="width:75%;height:10px;margin-top:12px"></span></div>';
  const row=(h)=>'<div class="dbh-sk-row'+(h?' is-h':'')+'"><span class="dbh-sk" style="flex:2 1 0;height:'+(h?9:12)+'px"></span>'+
    '<span class="dbh-sk" style="flex:1 1 0;height:'+(h?9:12)+'px"></span><span class="dbh-sk" style="flex:1 1 0;height:'+(h?9:12)+'px"></span><span class="dbh-sk" style="flex:1 1 0;height:'+(h?9:12)+'px"></span><span class="dbh-sk" style="flex:1 1 0;height:'+(h?9:12)+'px"></span></div>';
  const head='<div class="dbh-card-head"><span class="dbh-card-h"><span class="dbh-sk" style="width:34px;height:34px;border-radius:9px"></span><span><span class="dbh-sk" style="width:170px;height:14px"></span><span class="dbh-sk" style="width:240px;max-width:50vw;height:10px;margin-top:7px"></span></span></span><span class="dbh-sk" style="width:90px;height:24px;border-radius:99px"></span></div>';
  return '<div class="dbh-kpis">'+k+k+k+k+'</div>'+
    '<div class="dbh-card" aria-hidden="true">'+head+'<div class="dbh-card-body"><span class="dbh-sk" style="height:16px;border-radius:99px"></span>'+
      '<span class="dbh-sk" style="width:60%;height:11px;margin-top:18px"></span><span class="dbh-sk" style="width:100%;height:11px;margin-top:16px"></span></div></div>'+
    '<div class="dbh-card" aria-hidden="true">'+head+'<div class="dbh-card-body"><div class="dbh-scroll" style="overflow:hidden">'+row(true)+row()+row()+row()+row()+'</div></div></div>'+
    '<p class="dbh-sr">Loading database health\u2026</p>';
}
function showLoading(){
  setBusy(true);
  $('wrap').innerHTML='<div class="dbh">'+heroHtml(null,'loading')+skeletonHtml()+'</div>';
  announce('Loading database health\u2026');
}
function stateHtml(cls,icon,title,msg,btn){
  return '<div class="dbh">'+heroHtml(null)+'<div class="dbh-state" role="'+(cls==='is-lock'?'status':'alert')+'"><span class="dbh-state-ic '+cls+'">'+ic(icon,26)+'</span>'+
    '<h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p>'+btn+'</div></div>';
}
function gate(msg){
  setBusy(false);
  $('wrap').innerHTML=stateHtml('is-lock','lock','Database Health',msg,'<a class="dbh-btn" href="index.html">'+ic('home',15)+'Go to Home</a>');
  announce(msg);
}
function showError(status){
  setBusy(false);
  const msg=status?'Could not load database health (HTTP '+status+').':'Could not reach the server to load database health.';
  $('wrap').innerHTML=stateHtml('','alert-triangle','Couldn\u2019t load database health',msg+' Check your connection and try again.',
    '<button type="button" class="dbh-btn" id="dbhRetry">'+ic('refresh',15)+'Retry</button>');
  const b=$('dbhRetry'); if(b) b.addEventListener('click',()=>{ load(); });
  announce(msg);
}

async function load(){
  if(!A.getUser()||!A.getToken()){gate('Please log in to view Database health.');return;}
  showLoading();
  // Refresh /api/me so a session cached before the flag existed still sees the latest access.
  try{ if(A._refreshMe) await A._refreshMe(); }catch(e){}
  if(!canDatabase()){gate('You do not have access to Database health.');return;}
  // Cache (time-based): paint instantly from cache, then refresh in the background.
  const res=await A.swrLoad({
    key:'db-health',
    fetch:()=>A.api('GET','/api/db-health'),
    onData:(d)=>{ if(d)render(d); }
  });
  if(!res.painted){
    if(res.status===401){gate('Session expired. Please log in again.');return;}
    if(res.status===403){gate('You do not have access to Database health.');return;}
    showError(res.status);
  }
}

function render(d){
  const anim=FIRST; FIRST=false;
  $('wrap').innerHTML='<div class="dbh'+(anim?' is-anim':'')+'">'+heroHtml(d)+kpisHtml(d)+usageHtml(d)+quartersHtml(d)+collectionsHtml(d)+
    '<p class="dbh-foot">Read-only view \u00b7 <b>'+esc(d.db)+'</b> \u00b7 generated '+esc(fmtDate(d.generatedAt))+'</p></div>';
  setBusy(false);
  announce('Database health loaded. Overall status: '+overall(d).s.label+'.');
}

// Chevron sections: toggle in place (no re-render) and remember the choice.
document.addEventListener('click',ev=>{
  const b=ev.target&&ev.target.closest&&ev.target.closest('.dbh-exp[data-sec]'); if(!b) return;
  const key=b.getAttribute('data-sec'), open=b.getAttribute('aria-expanded')!=='true';
  OPEN[key]=open; try{ localStorage.setItem(LS_OPEN,JSON.stringify(OPEN)); }catch(e){}
  b.setAttribute('aria-expanded',String(open));
  const body=$(b.getAttribute('aria-controls')); if(body) body.hidden=!open;
  const card=b.closest('.dbh-card'); if(card) card.classList.toggle('is-shut',!open);
});

load();
</script>
</body>
</html>
