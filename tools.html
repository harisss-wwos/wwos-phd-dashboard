<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHD Tools · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#ec7211;--oh:#c85f0e;--t:#2a3340;--tm:#5c6773;--bd:#e2e7eb;--gl:#1f9d57;--rl:#dc2626;--tl:#2591ad}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#f3f5f7;color:var(--t);min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#1b2026;line-height:1}
.wrap{padding:0 0 8px}

/* ---- One padded column holds BOTH the title bar and the content. The 5px side gutter lives ONLY
   here, and the title bar + the embedded card wrap each use ZERO side padding, so both fill this
   column's content box with no per-child inset to drift. That makes their widths identical. ---- */
.tool-pad{padding:0 5px}

/* ---- Shared 60px white title bar: segmented radio (left) + per-tab actions (right) ---- */
.tool-titlebar{width:100%;box-sizing:border-box;height:60px;background:#fff;border:1px solid var(--bd);border-radius:5px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 10px;position:sticky;top:0;z-index:40;flex-wrap:nowrap}
@media(max-width:760px){.tool-titlebar{height:auto;min-height:60px;flex-wrap:wrap;padding:10px;gap:10px}}

/* Stylish segmented radio control (iOS-style sliding pill) */
.seg{position:relative;display:inline-flex;align-items:center;gap:2px;background:#f1f3f6;border:1px solid #e4e8ec;border-radius:10px;padding:4px}
.seg-ind{position:absolute;top:4px;bottom:4px;border-radius:7px;background:linear-gradient(180deg,#ff9f2e,#f07d0a);box-shadow:0 3px 10px -2px rgba(240,125,10,.5);transition:left .28s cubic-bezier(.4,.9,.3,1),width .28s cubic-bezier(.4,.9,.3,1);z-index:0}
.seg-opt{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border:none;background:transparent;color:var(--tm);font-family:inherit;font-size:.9em;font-weight:700;cursor:pointer;border-radius:7px;white-space:nowrap;transition:color .2s}
.seg-opt:hover{color:#1b2026}
.seg-opt.active{color:#fff}
.seg-opt svg{flex-shrink:0}
@media(max-width:760px){.seg-opt{padding:7px 13px;font-size:.84em}.seg-opt .seg-txt{display:none}}

/* Per-tab action buttons on the right of the title bar (switch with the radio) */
.tb-actions{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.tb-actions .btn,.tb-actions .btn.sec{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;font-weight:700;font-size:.85em;cursor:pointer;text-decoration:none;font-family:inherit;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
/* Both title-bar action buttons (Add + Edit Log): dark #151d28 bg, white font, 5px radius.
   Scoped under #tbActions (ID) + :not() chain so it beats theme.css's '.btn:not(.sec)...!important'
   (which forced an amber gradient + pill radius). */
#tbActions .btn,#tbActions .btn.sec,
#tbActions .btn:not(.sec):not(.danger):not(.mini):not(.tb-btn){
  background:#151d28!important;background-image:none!important;color:#fff!important;
  border:1px solid #151d28!important;border-radius:5px!important;box-shadow:none!important}
#tbActions .btn svg,#tbActions .btn.sec svg{color:#fff!important;stroke:currentColor!important}
#tbActions .btn:hover,#tbActions .btn.sec:hover,
#tbActions .btn:not(.sec):not(.danger):not(.mini):not(.tb-btn):hover{
  background:#243247!important;border-color:#243247!important;color:#fff!important;filter:none!important}
.tb-actions svg{flex-shrink:0}
@media(max-width:900px){.tb-actions .btn .tb-blabel{display:none}}

/* ---- Edit-log MODAL popup (Blurb/Hashtag/Paging edit log) — mirrors the "View upload log" modal ---- */
.tool-log-bg{position:fixed;inset:0;background:rgba(21,29,40,.6);z-index:3500;display:none;align-items:center;justify-content:center;padding:20px}
.tool-log{background:#fff;border-radius:5px;width:min(1000px,96vw);height:min(86vh,900px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 28px 70px -24px rgba(21,29,40,.5)}
.tool-log-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #e7e5df;flex:0 0 auto}
.tool-log-title{display:flex;align-items:center;gap:9px;font-size:1em;font-weight:800;color:#151d28}
.tool-log-ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:#c4def6;color:#2b66c1}
.tool-log-ic svg{width:16px;height:16px}
.tool-log-x{margin-left:auto;background:transparent;border:none;color:#818284;font-size:1.6em;line-height:1;cursor:pointer;padding:0 6px;border-radius:5px}
.tool-log-x:hover{color:#151d28;background:#f1efe9}
.tool-log-body{flex:1;min-height:0}
.tool-log-body iframe{width:100%;height:100%;border:none;display:block}

/* ---- Embedded-tool frame + skeleton ---- */
/* The iframe height is driven by JS (sizeFrame) to match its inner content, so the embedded tool
   flows with THIS page instead of scrolling inside its own fixed-height box. min-height just reserves
   room while the skeleton shows. overflow:hidden on the frame kills any residual inner scrollbar. */
/* No fixed min-height on the wrap: the iframe height is driven by auto-size to match its content, so
   the content FLOWS with this page (one page scrollbar, no inner iframe scrollbar, no reserved empty
   gap below short/paginated pages). The skeleton overlays the iframe's own min-height while loading. */
.tool-frame-wrap{position:relative;width:100%;box-sizing:border-box}
.tool-frame{width:100%;max-width:100%;box-sizing:border-box;border:0;display:block;min-height:300px;overflow:hidden}
.tool-skel{position:absolute;inset:0;background:#f3f5f7;padding:8px 0}
.tool-skel.hidden{display:none}
.sk{position:relative;overflow:hidden;background:#e9edf1;border-radius:5px;display:block}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:sksh 1.2s infinite}
@keyframes sksh{100%{transform:translateX(100%)}}
.gate{text-align:center;padding:50px 0}.gate p{color:var(--tm);margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;background:var(--o);color:#fff;border-radius:5px;font-weight:700;font-size:.88em;cursor:pointer;border:none;text-decoration:none;font-family:inherit}
.btn:hover{background:var(--oh)}

/* Global: main content spans the viewport at all sizes. */
.wrap,.content{width:auto!important;max-width:none!important;margin-left:15px!important;margin-right:15px!important}
/* Keep the OUTER #wrap on the standard content-band spacing (top gutter from topbar-auth, 12px side
   gutters from app-light's data-profile-panel rule) so the title bar + cards sit in the same band as
   every other page (Shift Report etc.). The INNER content wrap also carries class="wrap", so it would
   otherwise ADD a second 12px side gutter and a top gutter on top of the band — zero those so the
   cards line up flush with the title bar inside the one shared band. ID scope beats the !important
   shared rules. */
#wrap .tool-wrap{width:100%!important;box-sizing:border-box;padding-top:0!important;padding-left:0!important;padding-right:0!important;margin-left:0!important;margin-right:0!important}
#wrap .tool-wrap #tabBody{width:100%;box-sizing:border-box}
/* Zero ONLY the top gutter on the outer band (the 14px topbar-auth .wrap{padding-top} injection);
   keep the 12px left/right gutters to the nav rail + profile column. ID scope beats the !important. */
#wrap.wrap{padding-top:0!important}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
</head>
<body data-nav-active="tools" data-back-href="index.html" data-back-label="Home">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html" style="text-decoration:none"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap"><div class="gate"><p>Loading…</p></div></div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=201"></script>
<script>
const A=window.PHDAuth;
const ic=(n,s)=>window.icon?window.icon(n,s||15):'';

// Each tab embeds its existing tool page in an iframe (?embed=1 hides that page's own toolbar/FABs),
// so every tool keeps its full behaviour (copy counts, add/edit/delete modals, caching) with zero
// cross-tab collisions. Prompts is the WIP page, embedded the same way.
const TABS=[
  { id:'blurbs',   label:'Common Blurbs',   icon:'clipboard', src:'tool-blurbs.html',  addLabel:'Add New Blurb',   logHref:'blurb-log.html',   logLabel:'Blurb edit log' },
  { id:'paging',   label:'Paging Contacts', icon:'mail',      src:'tool-paging.html',   addLabel:'Add Region',      logHref:'paging-log.html',  logLabel:'Paging edit log' },
  { id:'hashtags', label:'Hashtags',        icon:'hash',      src:'tool-hashtags.html', addLabel:'Add New Hashtag', logHref:'hashtag-log.html', logLabel:'Hashtag edit log' },
  { id:'rcd',      label:'Build Root Cause Details', icon:'clipboard', src:'tool-rcd.html' },
];
let ACTIVE='blurbs';
const LOADED={}; // id -> true once its iframe has been created (kept alive so re-clicks are instant)

function skeleton(){
  var bars='<div class="sk" style="height:26px;width:240px;margin:6px 0 14px"></div>'+
    '<div class="sk" style="height:14px;width:60%;margin-bottom:22px"></div>';
  for(var i=0;i<4;i++){ bars+='<div class="sk" style="height:96px;margin-bottom:14px"></div>'; }
  return '<div class="tool-skel" id="skel-'+ACTIVE+'">'+bars+'</div>';
}

const canEditTools=function(){ return !!(A.canEditTools&&A.canEditTools()); };

function pageShell(){
  var opts=TABS.map(function(t){
    return '<button class="seg-opt'+(ACTIVE===t.id?' active':'')+'" id="tab-'+t.id+'" role="tab" aria-selected="'+(ACTIVE===t.id)+'" onclick="switchTab(\''+t.id+'\')">'+ic(t.icon,15)+'<span class="seg-txt">'+t.label+'</span></button>';
  }).join('');
  return '<div class="tool-pad">'
      +'<div class="tool-titlebar">'
        +'<div class="seg" id="segCtl" role="tablist"><span class="seg-ind" id="segInd"></span>'+opts+'</div>'
        +'<div class="tb-actions" id="tbActions"></div>'
      +'</div>'
      +'<div class="wrap tool-wrap"><div id="tabBody"></div></div>'
    +'</div>';
}

// Slide the segmented-radio indicator pill under the active option.
function moveSegIndicator(){
  var ind=document.getElementById('segInd'); var opt=document.getElementById('tab-'+ACTIVE);
  if(!ind||!opt) return;
  ind.style.left=opt.offsetLeft+'px';
  ind.style.width=opt.offsetWidth+'px';
}

// Render the per-tab action buttons (right side of the title bar). Switches with the active tab.
// "Add" (calls the embedded tool's own openAddModal) + "<Tool> edit log" (opens the log as a modal
// popup — see openLog). Admin-gated.
function renderActions(){
  var el=document.getElementById('tbActions'); if(!el) return;
  var t=TABS.find(function(x){return x.id===ACTIVE;}); if(!t){ el.innerHTML=''; return; }
  var editor=canEditTools();
  // Tabs without an add/log workflow (e.g. the RCD converter) show no action buttons.
  if(!editor || !t.addLabel){ el.innerHTML=''; return; }
  var html='';
  html+='<button class="btn" onclick="toolAdd()">'+ic('plus',15)+'<span class="tb-blabel">'+t.addLabel+'</span></button>';
  if(t.logHref) html+='<button class="btn sec" onclick="openLog()">'+ic('history',15)+'<span class="tb-blabel">'+t.logLabel+'</span></button>';
  el.innerHTML=html;
}

// Trigger the active embedded tool's own Add modal (same-origin iframe).
function toolAdd(){
  var frame=document.getElementById('frame-'+ACTIVE); if(!frame) return;
  try{
    var win=frame.contentWindow;
    if(win&&typeof win.openAddModal==='function') win.openAddModal();
  }catch(e){ /* not ready / cross-origin — ignore */ }
}
window.toolAdd=toolAdd;

// Show the change log as a MODAL POPUP (like "View upload log"): embed the log page in an iframe
// overlay instead of swapping the tool iframe in-place. The tool stays visible behind the modal.
function openLog(){
  var t=TABS.find(function(x){return x.id===ACTIVE;}); if(!t) return;
  var bg=document.getElementById('toolLogModal');
  if(!bg){
    bg=document.createElement('div'); bg.id='toolLogModal'; bg.className='tool-log-bg';
    bg.innerHTML='<div class="tool-log"><div class="tool-log-head">'
      +'<span class="tool-log-title"><span class="tool-log-ic">'+ic('history',16)+'</span><span id="toolLogTitle"></span></span>'
      +'<button type="button" class="tool-log-x" aria-label="Close">&times;</button></div>'
      +'<div class="tool-log-body"><iframe id="toolLogFrame" title="Edit log"></iframe></div></div>';
    bg.addEventListener('click',function(e){ if(e.target===bg) bg.style.display='none'; });
    bg.querySelector('.tool-log-x').onclick=function(){ bg.style.display='none'; };
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') bg.style.display='none'; });
    document.body.appendChild(bg);
  }
  document.getElementById('toolLogTitle').textContent=t.logLabel;
  var fr=document.getElementById('toolLogFrame');
  fr.setAttribute('title',t.logLabel);
  fr.setAttribute('src', t.logHref+(t.logHref.indexOf('?')>=0?'&':'?')+'embed=1&t='+Date.now());
  bg.style.display='flex';
}
window.openLog=openLog;

// Show a tab: create its iframe once (with a skeleton overlay until it loads), then just show/hide
// the frames on subsequent clicks so state is preserved and switching is instant.
function switchTab(id){
  ACTIVE=id;
  try{ localStorage.setItem('phd_tools_tab', id); }catch(e){}   // remember the last tab for next visit
  TABS.forEach(function(t){ var b=document.getElementById('tab-'+t.id); if(b){ b.classList.toggle('active',t.id===id); b.setAttribute('aria-selected',String(t.id===id)); } });
  moveSegIndicator();
  renderActions();
  const body=document.getElementById('tabBody');
  // Hide all existing frame-wraps.
  Array.prototype.forEach.call(body.querySelectorAll('.tool-frame-wrap'),function(w){ w.style.display=(w.getAttribute('data-id')===id)?'':'none'; });
  if(LOADED[id]) return; // already built -> just revealed above
  // Build this tab's frame + skeleton on first open.
  const tab=TABS.find(function(t){return t.id===id;});
  const wrap=document.createElement('div');
  wrap.className='tool-frame-wrap'; wrap.setAttribute('data-id',id);
  wrap.innerHTML=skeleton()+'<iframe class="tool-frame" id="frame-'+id+'" title="'+tab.label+'" src="'+tab.src+(tab.src.indexOf('?')>=0?'&':'?')+'embed=1&v=4"></iframe>';
  body.appendChild(wrap);
  const frame=wrap.querySelector('iframe');
  frame.addEventListener('load',function(){
    const s=document.getElementById('skel-'+id); if(s) s.classList.add('hidden');
    setupAutoSize(frame);
  });
  LOADED[id]=true;
}
window.switchTab=switchTab;

// Grow the iframe to match its inner document height so the embedded tool scrolls WITH this page
// (one page scrollbar) instead of inside its own fixed-height frame. Same-origin, so contentDocument
// is readable. Re-measures on inner-content changes (ResizeObserver) + window resize + a short poll
// to catch async renders (cards loading from cache/API after the initial load event).
function setupAutoSize(frame){
  function sizeFrame(){
    try{
      const doc=frame.contentDocument||(frame.contentWindow&&frame.contentWindow.document);
      if(!doc||!doc.documentElement) return;
      // documentElement.scrollHeight never drops below the frame's own height, so measuring at the
      // current height can only GROW the frame (collapsing an accordion left a blank gap). Collapse
      // the frame to 0 for the measurement so it reports the true content height, then apply it —
      // all in one synchronous step (no paint in between), restoring the page scroll if it moved.
      const y=window.scrollY;
      const prev=frame.style.height;
      frame.style.height='0px';
      const h=Math.max(doc.documentElement.scrollHeight, doc.body?doc.body.scrollHeight:0);
      frame.style.height=h?(h+'px'):prev;
      if(window.scrollY!==y) window.scrollTo(0,y);
    }catch(e){ /* cross-origin or not ready — ignore */ }
  }
  sizeFrame();
  try{
    const win=frame.contentWindow, doc=frame.contentDocument;
    if(win&&'ResizeObserver' in win && doc&&doc.body){
      const ro=new win.ResizeObserver(sizeFrame);
      ro.observe(doc.documentElement);
      if(doc.body) ro.observe(doc.body);
    }
  }catch(e){}
  window.addEventListener('resize',sizeFrame);
  // Poll briefly after load to catch late async content (API/cache paints, image loads).
  let n=0; const iv=setInterval(function(){ sizeFrame(); if(++n>=20) clearInterval(iv); },300);
}

function load(){
  // Tools are viewable by any logged-in user (edit actions inside each tool are admin-gated there).
  if(!A.getUser()||!A.getToken()){
    document.getElementById('wrap').innerHTML='<div class="gate"><h1 style="color:#1b2026">PHD Tools</h1><p>This page is for logged-in users. Log in from the Live Dashboard first.</p><a class="btn" href="app.html">Go to Live Dashboard</a></div>';
    return;
  }
  // Restore the last-used tab (falls back to the default if missing/unknown).
  try{ var saved=localStorage.getItem('phd_tools_tab'); if(saved && TABS.some(function(t){return t.id===saved;})) ACTIVE=saved; }catch(e){}
  document.getElementById('wrap').innerHTML=pageShell();
  switchTab(ACTIVE); // open the restored (or default) tab
  // Keep the sliding indicator aligned when the layout reflows (fonts load, window resize).
  moveSegIndicator();
  setTimeout(moveSegIndicator,120);
  window.addEventListener('resize',moveSegIndicator);
}
load();
</script>
</body>
</html>
