<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Anti-FOUC: hide the body until topbar-auth.js injects its CSS + builds the chrome. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<!-- Keep the section hidden until the shared chrome (title bar + menu column) has wrapped it. -->
<style>#wrap{visibility:hidden}#tbHomeChrome #wrap,html.tb-wrap-timeout #wrap{visibility:visible}</style>
<script>setTimeout(function(){document.documentElement.classList.add('tb-wrap-timeout');},8000);</script>
<noscript><style>#wrap{visibility:visible!important}</style></noscript>
<title>PHD Tools · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ec7211;--oh:#c85f0e;--t:#2a3340;--tm:#5c6773;--bd:#e2e7eb;--gl:#1f9d57;--rl:#dc2626;--tl:#2591ad}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#f3f5f7;color:var(--t);min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#1b2026;line-height:1}
.wrap{padding:32px 24px;width:auto;max-width:none;margin:0}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
<style id="tls-light">
/* PHD Tools — same "field guide" language as issue-types.html: dark navy hero (orange rule, faint grid,
   glassy chips), a sticky white tool-switcher bar overlapping the hero,
   then the open tool's workspace. Everything is scoped under .izr/.tls so the
   shared stylesheets are untouched. The tools themselves are separate pages embedded in iframes. */
#wrap.wrap{padding-top:0!important;padding-bottom:28px!important}
.izr{--ink:#1b2026;--mut:#5c6773;--line:#e2e6ea;--soft:#f5f6f8;--acc:#ec7211;--acc-bg:#fff3e8;--acc-ink:#9a4100;--acc-btn:#c2560a;--acc-btnh:#a54809;
  --red:#b42318;--red-bg:#fdecec;--grn:#1a7a43;--grn-bg:#e5f5ec;--blu:#165f86;--focus:#f0a35a;color:var(--ink)}
:where(.izr) button{font:inherit;text-transform:none}
.izr :is(button,a,input,summary):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.izr-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.izr-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 70px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.izr-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.izr-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.izr-hero-in{position:relative;display:flex;gap:16px;align-items:flex-start}
.izr-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.izr-hero-txt{min-width:0;flex:1 1 auto}
.izr-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.izr-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.05;margin:0}
.izr-hero-sub{margin-top:9px;max-width:72ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.82)}
.izr-hero-sub b{color:#fff;font-weight:700}
/* Desktop: keep the subtitle on one line; narrower screens wrap so nothing overflows. */
@media (min-width:1100px){
  .izr-hero-txt{container-type:inline-size}
  .izr-hero-sub{max-width:none;white-space:nowrap;font-size:min(.92em,calc(100cqi / 84))}
}
.izr-chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:16px 0 0;padding:0}
.izr-chips li{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;font-size:.76em;font-weight:700;
  color:#e9edf3;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);font-variant-numeric:tabular-nums}
.izr-chips li::before{content:'';width:6px;height:6px;border-radius:50%;background:#ffb26b}
.izr-chips li b{color:#fff;font-weight:800}

/* ---- Sticky tool-switcher bar (overlaps the hero bottom) ---- */
.izr-bar{position:sticky;top:82px;z-index:30;margin:-42px 18px 22px;display:flex;flex-direction:column;gap:10px;padding:12px 14px;
  background:rgba(255,255,255,.96);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
/* Bar row: tool switcher chips (left, scrolls on phones) + the open tool's actions (right). */
.tls-row2{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.izr-fl{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 320px;contain:inline-size}
.izr-fl-k{flex-shrink:0;font-size:.66em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)}
.izr-fchips{display:flex;gap:6px;min-width:0;overflow-x:auto;padding:4px 2px;margin:-4px 0;scrollbar-width:thin;scrollbar-color:#d4dade transparent}
.izr-fchip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px 0 10px;border-radius:99px;border:1px solid var(--line);background:var(--soft);
  font-size:.8em;font-weight:700;color:#3a4552;cursor:pointer;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.izr-fchip .tls-chip-ic{display:inline-flex;color:var(--c)}
.izr-fchip:hover{border-color:#c4ccd4;background:#fff}
.izr-fchip[aria-pressed="true"]{background:#1f2a40;border-color:#1f2a40;color:#fff}
.izr-fchip[aria-pressed="true"] .tls-chip-ic{color:#ffb26b}
.izr .izr-fchip:focus-visible{outline-offset:1px}
/* Per-tool actions (Add + edit log). Admin-gated; empty for view-only users and for the RCD builder. */
.tb-actions{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin-left:auto}
.tb-actions:empty{display:none}
.tls-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--acc-btn);
  background:var(--acc-btn);color:#fff;font-size:.82em;font-weight:800;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
.tls-btn:hover{background:var(--acc-btnh);border-color:var(--acc-btnh)}
.tls-btn svg{flex-shrink:0}
.tls-btn.is-ghost{background:#fff;border-color:#d4dade;color:#3a4552}
.tls-btn.is-ghost:hover{border-color:var(--acc);color:var(--acc-ink);background:var(--acc-bg)}

/* ---- Lists / headers ---- */
.izr-list{display:flex;flex-direction:column;gap:12px;padding:0 2px}
/* Header strip (used by the workspace heading). */
.izr-cat-h{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 14px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--c);
  background:linear-gradient(90deg,var(--cbg),#fff 75%);box-shadow:0 2px 10px -8px rgba(20,30,50,.25)}
.izr-cat-tile{width:46px;height:46px;flex-shrink:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid rgba(0,0,0,.06);color:var(--c);overflow:hidden}
.izr-cat-txt{flex:1 1 auto;min-width:0}
.izr-cat-sub{display:block;margin-top:2px;font-size:.8em;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}

/* ---- Workspace (the open tool) ---- */
.tls-ws{margin-top:22px;scroll-margin-top:200px}
.tls-ws-h{margin-bottom:12px}
.tls-ws-k{display:block;font-size:.64em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--acc-ink);margin-bottom:2px}
.izr .tls-ws-h h2{margin:0;font-size:1.18em;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:var(--ink)}
.tls-ws-h .izr-cat-tile{color:var(--c)}
.tool-frame-wrap{position:relative;width:100%;box-sizing:border-box}
.tool-frame{width:100%;max-width:100%;box-sizing:border-box;border:0;display:block;min-height:300px;overflow:hidden;background:transparent}
.tool-skel{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;gap:12px;padding:2px 0;background:#f3f5f7}
.tool-skel.hidden,.tool-err.hidden{display:none}
.tool-err{position:absolute;inset:0;z-index:3;background:#f3f5f7;padding:2px 0}
.izr-skel{display:block;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:izrShim 1.4s ease infinite}
.izr-skel-card{display:flex;align-items:center;gap:12px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:12px}
@keyframes izrShim{0%{background-position:100% 0}100%{background-position:0 0}}

/* ---- States ---- */
.izr-state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 20px;text-align:center;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18)}
.izr-state-ic{width:58px;height:58px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#eef1f4;color:#5c6773;margin-bottom:4px}
.izr-state-ic.is-err{background:var(--red-bg);color:var(--red)}
.izr .izr-state-t{font-size:1.08em;font-weight:800;color:var(--ink)}
.izr-state p{font-size:.9em;max-width:52ch;line-height:1.5}
.izr-btn{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:9px 16px;border:none;border-radius:8px;background:#161d2d;color:#f4f3ef;font-size:.86em;font-weight:800;cursor:pointer;text-decoration:none;transition:background-color .15s}
.izr-btn:hover{background:#0f1420}
.izr.is-nobar .izr-hero{padding-bottom:26px}
.izr.is-nobar .izr-list{margin-top:16px}

/* ---- Edit-log MODAL popup (Blurb/Hashtag/Paging edit log) ---- */
.tool-log-bg{position:fixed;inset:0;background:rgba(21,29,40,.6);z-index:3500;display:none;align-items:center;justify-content:center;padding:20px}
.tool-log{background:#fff;border-radius:12px;width:min(1000px,96vw);height:min(86vh,900px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 28px 70px -24px rgba(21,29,40,.5)}
.tool-log-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #e2e6ea;flex:0 0 auto}
.tool-log-title{display:flex;align-items:center;gap:9px;font-size:1em;font-weight:800;color:#1b2026}
.tool-log-ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:#fff3e8;color:#9a4100}
.tool-log-ic svg{width:16px;height:16px}
.tool-log-x{margin-left:auto;background:transparent;border:none;color:#5c6773;font-size:1.6em;line-height:1;cursor:pointer;padding:0 6px;border-radius:6px}
.tool-log-x:hover{color:#1b2026;background:#f5f6f8}
.tool-log-x:focus-visible{outline:3px solid #f0a35a;outline-offset:2px}
.tool-log-body{flex:1;min-height:0}
.tool-log-body iframe{width:100%;height:100%;border:none;display:block}

/* ---- Motion: one orchestrated entrance (hero, bar, then sections) ---- */
@keyframes izrUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.izr.is-anim .izr-hero{animation:izrUp .45s ease both}
.izr.is-anim .izr-bar{animation:izrUp .5s ease .1s both}
.izr.is-anim .tls-ws{animation:izrUp .5s ease both;animation-delay:calc(.18s + var(--i,0) * .05s)}
@media (prefers-reduced-motion:reduce){
  .izr *,.izr *::before,.izr *::after{animation:none!important;transition:none!important}
}

/* ---- Small widths ---- */
@media (max-width:900px){.tb-actions .tb-blabel{display:none}.tb-actions .tls-btn{width:36px;padding:0}}
@media (max-width:700px){
  .izr-hero{padding:22px 18px 100px 22px}
  .izr-hero-ic{display:none}
  .izr-hero h1{font-size:1.55em;letter-spacing:-.5px}
  .izr-hero-sub{font-size:.86em}
  .izr-bar{margin:-78px 8px 18px;padding:10px}
  .izr-fl-k{display:none}
  .izr-fl{flex-basis:100%}
  .tb-actions{margin-left:0}
  .izr-cat-h{padding:10px 12px}
}
</style>
</head>
<body data-nav-active="tools" data-back-href="index.html" data-back-label="Home">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html" style="text-decoration:none"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap"><div class="phd-load"><span class="phd-spin"></span> Loading tools…</div></div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=216"></script>
<script>
const A=window.PHDAuth;
const ic=(n,s)=>window.icon?window.icon(n,s||15):'';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){ return document.getElementById(id); }
const REDUCED=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// Inline glyphs (decorative; aria-hidden).
function svg(p,s,w){ return '<svg width="'+(s||14)+'" height="'+(s||14)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+p+'</svg>'; }
const ICO_ALERT=svg('<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',26);
const ICO_RETRY=svg('<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>',15);
const ICO_LOCK=svg('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',26);

// Each tool embeds its existing page in an iframe (?embed=1 hides that page's own toolbar/FABs),
// so every tool keeps its full behaviour (copy counts, add/edit/delete modals, caching) with zero
// cross-tool collisions. The order here is the switcher order.
const TABS=[
  { id:'blurbs',   label:'Common Blurbs',   icon:'clipboard', src:'tool-blurbs.html',  addLabel:'Add New Blurb',   logHref:'blurb-log.html',   logLabel:'Blurb edit log',
    group:'lib', color:'#d9650b', desc:'Pre-written messages for the replies the team sends most. Expand a blurb to read it, then copy it in one click.',
    feats:['One-click copy','Copy counts'], kw:'message template reply text response email' },
  { id:'paging',   label:'Paging Contacts', icon:'mail',      src:'tool-paging.html',   addLabel:'Add Region',      logHref:'paging-log.html',  logLabel:'Paging edit log',
    group:'lib', color:'#0d8a7f', desc:'SDS ECR paging contacts by region. Find the region and copy its email with one click.',
    feats:['By region','Copy email'], kw:'page escalation sds ecr region email contact' },
  { id:'hashtags', label:'Hashtags',        icon:'hash',      src:'tool-hashtags.html', addLabel:'Add New Hashtag', logHref:'hashtag-log.html', logLabel:'Hashtag edit log',
    group:'lib', color:'#3b6fe0', desc:'The approved ticket hashtags in one place, each ready to copy so tags stay consistent.',
    feats:['One-click copy','Copy counts'], kw:'tag hashtag label' },
  { id:'rcd',      label:'Build Root Cause Details', icon:'tool', src:'tool-rcd.html',
    group:'build', color:'#6d4fe0', desc:'Paste a raw SIM root cause string and convert it to the standard short key:value lines, then pick the Issue and Resolution.',
    feats:['Paste & convert','Copy output'], kw:'sim root cause rcd issue resolution sid tid driver zip upid convert format' },
];
let ACTIVE='blurbs';
const LOADED={}; // id -> true once its iframe has been created (kept alive so re-clicks are instant)
const LOADT={};  // id -> load-timeout handle
const LOAD_TIMEOUT_MS=20000;

const canEditTools=function(){ return !!(A.canEditTools&&A.canEditTools()); };
function tabById(id){ return TABS.find(function(t){ return t.id===id; }); }
function tint(hex){
  var m=/^#?([0-9a-f]{6})$/i.exec(String(hex||'').trim()); if(!m) return 'rgba(240,138,29,.14)';
  var n=parseInt(m[1],16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+',.13)';
}
function say(msg){ var l=$('tlsLive'); if(l){ l.textContent=''; setTimeout(function(){ l.textContent=msg; },30); } }

// ---------- Hero ----------
function heroHtml(loggedIn){
  var chips=loggedIn
    ? '<li>'+TABS.length+' tools</li><li>Open now: <b id="tlsHeroNow">\u2014</b></li><li>'+(canEditTools()?'You can add &amp; edit':'View &amp; copy only')+'</li>'
    : '<li>'+TABS.length+' tools</li><li>Login required</li>';
  return '<header class="izr-hero"><div class="izr-hero-in"><span class="izr-hero-ic">'+ic('tool',24)+'</span><div class="izr-hero-txt">'+
    '<p class="izr-eyebrow">Tools \u00b7 Agent toolkit</p><h1>PHD Tools</h1>'+
    '<p class="izr-hero-sub">Copy-ready <b>blurbs</b>, <b>paging contacts</b> and <b>hashtags</b>, plus the <b>Root Cause Details</b> builder. '+
      'Pick a tool below or switch from the bar; it opens in the workspace on this page.</p>'+
    '<ul class="izr-chips" aria-label="About these tools">'+chips+'</ul>'+
    '</div></div></header>';
}

// ---------- Sticky tool-switcher bar ----------
function barHtml(){
  var chips=TABS.map(function(t){
    return '<button type="button" class="izr-fchip" id="tab-'+t.id+'" data-tab="'+t.id+'" aria-pressed="'+(ACTIVE===t.id)+'" style="--c:'+t.color+'">'+
      '<span class="tls-chip-ic" aria-hidden="true">'+ic(t.icon,14)+'</span>'+esc(t.label)+'</button>';
  }).join('');
  return '<div class="izr-bar" role="region" aria-label="Switch tools">'+
    '<div class="tls-row2">'+
      '<div class="izr-fl"><span class="izr-fl-k" id="tlsFlK">Open tool</span><div class="izr-fchips" role="group" aria-labelledby="tlsFlK">'+chips+'</div></div>'+
      '<div class="tb-actions" id="tbActions" role="group" aria-label="Tool actions"></div>'+
    '</div>'+
  '</div>';
}

// ---------- Workspace ----------
function wsHtml(){
  return '<section class="tls-ws" id="tlsWs" aria-labelledby="tlsWsT" style="--i:1">'+
    '<div class="izr-cat-h tls-ws-h" id="tlsWsH">'+
      '<span class="izr-cat-tile" id="tlsWsIc" aria-hidden="true"></span>'+
      '<div class="izr-cat-txt"><span class="tls-ws-k">Open tool</span><h2 id="tlsWsT" tabindex="-1"></h2><span class="izr-cat-sub" id="tlsWsSub"></span></div>'+
    '</div>'+
    '<div id="tabBody" aria-live="off"></div>'+
  '</section>';
}
function paintWsHead(){
  var t=tabById(ACTIVE); if(!t) return;
  var h=$('tlsWsH'); if(h){ h.style.setProperty('--c',t.color); h.style.setProperty('--cbg',tint(t.color)); }
  if($('tlsWsIc')) $('tlsWsIc').innerHTML=ic(t.icon,22);
  if($('tlsWsT')) $('tlsWsT').textContent=t.label;
  if($('tlsWsSub')) $('tlsWsSub').textContent=t.desc;
  if($('tlsHeroNow')) $('tlsHeroNow').textContent=t.label;
}

function skeleton(id){
  var row='<div class="izr-skel-card"><span class="izr-skel" style="width:38px;height:38px;border-radius:10px;flex-shrink:0"></span>'+
    '<span style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="izr-skel" style="width:42%;height:14px"></span><span class="izr-skel" style="width:70%;height:11px"></span></span>'+
    '<span class="izr-skel" style="width:84px;height:32px;border-radius:8px;flex-shrink:0"></span></div>';
  return '<div class="tool-skel" id="skel-'+id+'" aria-hidden="true">'+row+row+row+row+'</div>';
}
function errorHtml(id){
  var t=tabById(id);
  return '<div class="tool-err hidden" id="err-'+id+'"><div class="izr-state" role="alert"><span class="izr-state-ic is-err">'+ICO_ALERT+'</span>'+
    '<p class="izr-state-t">'+esc(t.label)+' didn\u2019t load</p>'+
    '<p>The tool page couldn\u2019t be loaded from the dashboard server. Check your connection, then try again.</p>'+
    '<button type="button" class="izr-btn" data-retry="'+id+'">'+ICO_RETRY+'Retry</button></div></div>';
}
function frameSrc(t,bust){ return t.src+(t.src.indexOf('?')>=0?'&':'?')+'embed=1&v=5'+(bust?'&r='+Date.now():''); }
function setBusy(id,busy){
  var body=$('tabBody'); if(!body) return;
  if(id===ACTIVE){ if(busy) body.setAttribute('aria-busy','true'); else body.removeAttribute('aria-busy'); }
}
function markLoading(id){
  var t=tabById(id);
  var s=$('skel-'+id), e=$('err-'+id);
  if(s) s.classList.remove('hidden'); if(e) e.classList.add('hidden');
  setBusy(id,true);
  if(id===ACTIVE) say('Loading '+t.label+'\u2026');
  clearTimeout(LOADT[id]);
  LOADT[id]=setTimeout(function(){ markFailed(id); },LOAD_TIMEOUT_MS);
}
function markFailed(id){
  var t=tabById(id);
  var s=$('skel-'+id), e=$('err-'+id);
  if(s) s.classList.add('hidden'); if(e) e.classList.remove('hidden');
  var w=document.querySelector('.tool-frame-wrap[data-id="'+id+'"]'); if(w) w.style.minHeight='300px';
  setBusy(id,false);
  if(id===ACTIVE) say(t.label+' could not be loaded.');
}
// A same-origin page that rendered nothing (or the static server's 404 page) counts as a failed load.
function looksBroken(frame){
  try{
    var doc=frame.contentDocument;
    if(!doc||!doc.body) return true;
    if(/not\s*found|^\s*404/i.test(doc.title||'')) return true;
    return doc.body.children.length===0 && !String(doc.body.textContent||'').trim();
  }catch(e){ return false; }
}

// Show a tool: create its iframe once (with a skeleton overlay until it loads), then just show/hide
// the frames on subsequent picks so state is preserved and switching is instant.
function switchTab(id){
  if(!tabById(id)) return;
  ACTIVE=id;
  try{ localStorage.setItem('phd_tools_tab', id); }catch(e){}   // remember the last tool for next visit
  TABS.forEach(function(t){ var b=$('tab-'+t.id); if(b){ b.classList.toggle('active',t.id===id); b.setAttribute('aria-pressed',String(t.id===id)); } });
  paintWsHead();
  renderActions();
  const body=$('tabBody');
  Array.prototype.forEach.call(body.querySelectorAll('.tool-frame-wrap'),function(w){ w.style.display=(w.getAttribute('data-id')===id)?'':'none'; });
  if(LOADED[id]){
    var s=$('skel-'+id); setBusy(id,!!(s&&!s.classList.contains('hidden')));
    return;
  }
  const tab=tabById(id);
  const wrap=document.createElement('div');
  wrap.className='tool-frame-wrap'; wrap.setAttribute('data-id',id);
  wrap.innerHTML=skeleton(id)+errorHtml(id)+'<iframe class="tool-frame" id="frame-'+id+'" title="'+esc(tab.label)+'" src="'+frameSrc(tab)+'"></iframe>';
  body.appendChild(wrap);
  const frame=wrap.querySelector('iframe');
  markLoading(id);
  frame.addEventListener('load',function(){
    clearTimeout(LOADT[id]);
    if(looksBroken(frame)){ markFailed(id); return; }
    wrap.style.minHeight='';
    const s=$('skel-'+id); if(s) s.classList.add('hidden');
    const e=$('err-'+id); if(e) e.classList.add('hidden');
    setBusy(id,false);
    if(id===ACTIVE) say(tab.label+' loaded.');
    setupAutoSize(frame);
  });
  LOADED[id]=true;
}
window.switchTab=switchTab;

function retryTab(id){
  var t=tabById(id), fr=$('frame-'+id); if(!t||!fr) return;
  markLoading(id);
  fr.setAttribute('src',frameSrc(t,true));
}

// Pick a tool from the switcher; bring the workspace into view when it is off-screen.
function openTool(id){
  var was=ACTIVE;
  switchTab(id);
  var ws=$('tlsWs'); if(!ws) return;
  if(ws.getBoundingClientRect().top<0) ws.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'});
  if(was!==id) say(tabById(id).label+' opened.');
}

// Render the per-tool action buttons (right side of the sticky bar). Switches with the active tool.
// "Add" (calls the embedded tool's own openAddModal) + "<Tool> edit log" (opens the log as a modal
// popup — see openLog). Admin-gated.
function renderActions(){
  var el=$('tbActions'); if(!el) return;
  var t=tabById(ACTIVE); if(!t){ el.innerHTML=''; return; }
  var editor=canEditTools();
  // Tools without an add/log workflow (e.g. the RCD converter) show no action buttons.
  if(!editor || !t.addLabel){ el.innerHTML=''; return; }
  var html='';
  html+='<button type="button" class="tls-btn" onclick="toolAdd()" aria-label="'+esc(t.addLabel)+'" title="'+esc(t.addLabel)+'">'+ic('plus',15)+'<span class="tb-blabel">'+esc(t.addLabel)+'</span></button>';
  if(t.logHref) html+='<button type="button" class="tls-btn is-ghost" onclick="openLog()" aria-label="'+esc(t.logLabel)+'" title="'+esc(t.logLabel)+'">'+ic('history',15)+'<span class="tb-blabel">'+esc(t.logLabel)+'</span></button>';
  el.innerHTML=html;
}

// Trigger the active embedded tool's own Add modal (same-origin iframe).
function toolAdd(){
  var frame=$('frame-'+ACTIVE); if(!frame) return;
  try{
    var win=frame.contentWindow;
    if(win&&typeof win.openAddModal==='function') win.openAddModal();
  }catch(e){ /* not ready / cross-origin — ignore */ }
}
window.toolAdd=toolAdd;

// Show the change log as a MODAL POPUP (like "View upload log"): embed the log page in an iframe
// overlay instead of swapping the tool iframe in-place. The tool stays visible behind the modal.
function openLog(){
  var t=tabById(ACTIVE); if(!t) return;
  var bg=$('toolLogModal');
  if(!bg){
    bg=document.createElement('div'); bg.id='toolLogModal'; bg.className='tool-log-bg';
    bg.innerHTML='<div class="tool-log" role="dialog" aria-modal="true" aria-labelledby="toolLogTitle"><div class="tool-log-head">'
      +'<span class="tool-log-title"><span class="tool-log-ic">'+ic('history',16)+'</span><span id="toolLogTitle"></span></span>'
      +'<button type="button" class="tool-log-x" aria-label="Close">&times;</button></div>'
      +'<div class="tool-log-body"><iframe id="toolLogFrame" title="Edit log"></iframe></div></div>';
    bg.addEventListener('click',function(e){ if(e.target===bg) bg.style.display='none'; });
    bg.querySelector('.tool-log-x').onclick=function(){ bg.style.display='none'; };
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') bg.style.display='none'; });
    document.body.appendChild(bg);
  }
  $('toolLogTitle').textContent=t.logLabel;
  var fr=$('toolLogFrame');
  fr.setAttribute('title',t.logLabel);
  fr.setAttribute('src', t.logHref+(t.logHref.indexOf('?')>=0?'&':'?')+'embed=1&t='+Date.now());
  bg.style.display='flex';
  var x=bg.querySelector('.tool-log-x'); if(x) x.focus();
}
window.openLog=openLog;

// Grow the iframe to match its inner document height so the embedded tool scrolls WITH this page
// (one page scrollbar) instead of inside its own fixed-height frame. Same-origin, so contentDocument
// is readable. Re-measures on inner-content changes (ResizeObserver) + window resize + a short poll
// to catch async renders (cards loading from cache/API after the initial load event).
function setupAutoSize(frame){
  function sizeFrame(){
    try{
      const doc=frame.contentDocument||(frame.contentWindow&&frame.contentWindow.document);
      if(!doc||!doc.documentElement) return;
      // Collapse the frame to 0 for the measurement so it reports the true content height (measuring
      // at the current height can only grow it), then apply it in one synchronous step.
      const y=window.scrollY;
      const prev=frame.style.height;
      frame.style.height='0px';
      const h=Math.max(doc.documentElement.scrollHeight, doc.body?doc.body.scrollHeight:0);
      frame.style.height=h?(h+'px'):prev;
      if(window.scrollY!==y) window.scrollTo(0,y);
    }catch(e){ /* cross-origin or not ready — ignore */ }
  }
  sizeFrame();
  try{
    const win=frame.contentWindow, doc=frame.contentDocument;
    if(win&&'ResizeObserver' in win && doc&&doc.body){
      const ro=new win.ResizeObserver(sizeFrame);
      ro.observe(doc.documentElement);
      if(doc.body) ro.observe(doc.body);
    }
  }catch(e){}
  window.addEventListener('resize',sizeFrame);
  let n=0; const iv=setInterval(function(){ sizeFrame(); if(++n>=20) clearInterval(iv); },300);
}

// ---------- Events ----------
document.addEventListener('click',function(e){
  var t=e.target; if(!t||!t.closest||!t.closest('#tlsMain')) return;
  var chip=t.closest('[data-tab]');
  if(chip){ openTool(chip.getAttribute('data-tab')); return; }
  var rt=t.closest('[data-retry]');
  if(rt){ retryTab(rt.getAttribute('data-retry')); }
});

function load(){
  // Tools are viewable by any logged-in user (edit actions inside each tool are admin-gated there).
  if(!A.getUser()||!A.getToken()){
    $('wrap').innerHTML='<main class="izr is-nobar'+(REDUCED?'':' is-anim')+'" id="tlsMain">'+heroHtml(false)+
      '<div class="izr-list"><div class="izr-state"><span class="izr-state-ic">'+ICO_LOCK+'</span><p class="izr-state-t">Log in to use PHD Tools</p>'+
      '<p>This page is for logged-in users. Log in from the Live Dashboard first.</p>'+
      '<a class="izr-btn" href="app.html">Go to Live Dashboard</a></div></div></main>';
    return;
  }
  // Restore the last-used tool (falls back to the default if missing/unknown).
  try{ var saved=localStorage.getItem('phd_tools_tab'); if(saved && tabById(saved)) ACTIVE=saved; }catch(e){}
  $('wrap').innerHTML='<main class="izr'+(REDUCED?'':' is-anim')+'" id="tlsMain">'+heroHtml(true)+barHtml()+
    '<p class="izr-sr" aria-live="polite" id="tlsLive"></p>'+wsHtml()+'</main>';
  switchTab(ACTIVE); // open the restored (or default) tool
}
load();
</script>
</body>
