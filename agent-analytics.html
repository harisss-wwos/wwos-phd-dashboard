<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shimmer.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252;--yl:#fbbf24;--pu:#a78bfa;--tl:#44b9d6;--a1:#7dd3fc;--a2:#fbbf24;--b:#4ade80;--s:#000}
.spinner{width:44px;height:44px;border:4px solid var(--bd);border-top-color:var(--o);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#000;border-radius:6px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.wrap{width:94%;max-width:1400px;margin:0 auto;padding:32px 20px}
h1{color:#fff;font-size:1.6em;margin-bottom:6px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:24px}
.section{margin-bottom:30px}
.section h2{color:var(--o);font-size:1.05em;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tbl-card{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1000px}
thead th{background:#000;color:var(--tm);font-size:.68em;text-transform:uppercase;letter-spacing:.4px;font-weight:600;text-align:center;padding:10px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
thead th.l{text-align:left}
tbody td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-size:.86em;text-align:center;white-space:nowrap}
tbody td.l{text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,153,0,.03)}
.uname{color:#fff;font-weight:600}
.role{color:var(--o);text-transform:uppercase;font-size:.68em;font-weight:700;margin-left:6px;background:rgba(255,153,0,.14);padding:1px 7px;border-radius:20px}
.big{font-weight:700;color:#fff}
.colors{display:inline-flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dot{display:inline-flex;align-items:center;gap:3px;font-size:.8em;font-weight:600}
.dot i{width:9px;height:9px;border-radius:2px;display:inline-block}
.d-green i{background:#4ade80}.d-yellow i{background:#fbbf24}.d-red i{background:#ff5252}.d-black i{background:#888}.d-purple i{background:#a78bfa}
.gate{text-align:center;padding:50px 0}.gate p{color:var(--tm);margin-bottom:18px}
.btn.mini{padding:5px 12px;font-size:.78em}
/* Bucket popup */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;max-width:820px;width:100%;max-height:88vh;overflow:auto;padding:24px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:12px}
.modal-head h2{color:var(--o);font-size:1.1em;font-weight:700;text-transform:none;letter-spacing:0}
.modal-close{background:transparent;border:none;color:var(--tm);font-size:1.6em;line-height:1;cursor:pointer;padding:0 4px}
.modal-close:hover{color:#fff}
.bk-sub{color:var(--tm);font-size:.85em;margin-bottom:16px}
.bk-tk{background:#000;border:1px solid var(--bd);border-left:3px solid var(--o);border-radius:10px;padding:14px 16px;margin-bottom:14px;text-align:left}
.bk-tk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.bk-id{color:#44b9d6;font-weight:700;text-decoration:none}.bk-id:hover{text-decoration:underline}
.bk-title{color:var(--t);font-size:.9em;margin-bottom:10px;line-height:1.5}
.bk-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.82em;color:var(--tm);margin-bottom:10px}
.bk-meta b{color:#fff;font-weight:600}
.bk-rem{font-weight:700}.bk-rem.ok{color:var(--gl)}.bk-rem.warn{color:var(--yl)}.bk-rem.over{color:var(--rl)}
.bk-cmts{border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.bk-cmts-t{color:var(--tm);font-size:.72em;text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:8px}
.bk-cmt{background:#0a0a0a;border:1px solid var(--bd);border-radius:8px;padding:8px 11px;margin-bottom:7px}
.bk-cmt-meta{display:flex;justify-content:space-between;gap:10px;font-size:.72em;color:#5f6b6c;margin-bottom:3px}
.bk-cmt-meta b{color:#d5dbdb}
.bk-cmt-text{color:var(--t);font-size:.85em;white-space:pre-wrap;line-height:1.5}
.bk-nocmt{color:#5f6b6c;font-size:.82em;font-style:italic}
.bk-empty{text-align:center;color:var(--tm);padding:30px;border:1px dashed var(--bd);border-radius:10px}
/* ---- Teams (Alpha/Beta/Gamma) group cards with large avatars ---- */
.ga-page-head{margin-bottom:22px}
.ga-page-head h1{margin-bottom:4px}
.ga-page-sub{color:var(--tm);font-size:.9em}
.ga-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.ga-group{position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 13%,#0a0a0a),#0a0a0a 62%);border:1px solid var(--bd);border-radius:16px;padding:20px 18px 22px;overflow:hidden}
.ga-group::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gc)}
.ga-group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ga-group-name{display:flex;align-items:center;gap:9px;font-size:1.2em;font-weight:800;letter-spacing:.4px;color:#fff}
.ga-dot{width:11px;height:11px;border-radius:50%;background:var(--gc);box-shadow:0 0 0 4px color-mix(in srgb,var(--gc) 25%,transparent)}
.ga-group-count{color:var(--gc);background:color-mix(in srgb,var(--gc) 15%,transparent);border:1px solid color-mix(in srgb,var(--gc) 35%,transparent);font-size:.74em;font-weight:700;border-radius:20px;padding:3px 11px}
/* Team KPI strip (Resolved / Open totals). */
.ga-team-kpis{display:flex;gap:10px;margin-bottom:16px}
.ga-kpi{flex:1;background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;text-align:center}
.ga-kpi-v{display:block;font-size:1.5em;font-weight:800;color:var(--gc);line-height:1}
.ga-kpi-l{color:var(--tm);font-size:.68em;text-transform:uppercase;letter-spacing:.4px;margin-top:4px;display:block}
.ga-mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ga-mem{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:14px 8px 12px;border:1px solid var(--bd);border-radius:12px;text-decoration:none;background:rgba(0,0,0,.25);transition:transform .14s,background .14s,border-color .14s}
.ga-mem:hover{transform:translateY(-3px);background:rgba(255,255,255,.04);border-color:color-mix(in srgb,var(--gc) 55%,var(--bd))}
.ga-mem-av{width:60px;height:60px;display:inline-flex;border-radius:50%;box-shadow:0 0 0 2px color-mix(in srgb,var(--gc) 55%,transparent),0 4px 12px rgba(0,0,0,.4);transition:box-shadow .14s}
.ga-mem:hover .ga-mem-av{box-shadow:0 0 0 3px var(--gc),0 6px 16px rgba(0,0,0,.5)}
.ga-mem-av .phd-avatar,.ga-mem-av img,.ga-mem-av .avatar-initial{width:60px!important;height:60px!important;font-size:24px!important}
.ga-mem-name{color:#fff;font-size:.86em;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.ga-mem:hover .ga-mem-name{color:var(--gc)}
.ga-mem-id{color:var(--tm);font-size:.72em}
.ga-mem-stats{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.ga-chip{font-size:.66em;color:var(--tm);background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:20px;padding:2px 8px;display:inline-flex;gap:4px;align-items:center}
.ga-chip b{color:#fff;font-weight:800}
.ga-chip-r b{color:#4ade80}
.ga-chip-o b{color:var(--o)}
@media(max-width:600px){
  .ga-mem-grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
  .ga-mem-av{width:54px;height:54px}
  .ga-mem-av .phd-avatar,.ga-mem-av img,.ga-mem-av .avatar-initial{width:54px!important;height:54px!important;font-size:22px!important}
}
/* Stat tiles (shared look with the agent profile) — used by the 1st Pet incidents totals. */
.ac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ac-tile{background:#000;border:1px solid var(--bd);border-top:3px solid var(--o);border-radius:8px;padding:16px 12px;text-align:center}
.ac-num{font-size:1.9em;font-weight:800;color:#fff;line-height:1}
.ac-lbl{color:var(--tm);font-size:.8em;margin-top:6px}
/* ---- Ported Groups view (KPIs, charts, tables) ---- */
.gv-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.gv-kpi{background:var(--s);border-radius:8px;padding:20px;text-align:center;border:1px solid var(--bd);border-top:3px solid var(--o)}
.gv-kpi .value{font-size:2em;font-weight:700;color:#fff;margin-bottom:4px}
.gv-kpi .label{font-size:.78em;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.gv-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:20px;margin-bottom:24px}
.gv-chart{background:var(--s);border-radius:8px;padding:20px;border:1px solid var(--bd)}
.gv-chart h3{color:#fff;margin-bottom:16px;text-align:center;font-size:.95em;font-weight:600}
.gv-wrap{position:relative;height:300px}
.gv-sec{background:var(--s);border-radius:8px;padding:24px;margin-bottom:24px;border:1px solid var(--bd)}
.gv-sec h2{color:#fff;margin-bottom:18px;font-size:1.2em;font-weight:600;display:flex;align-items:center;gap:8px}
.gv-sec h2::before{content:'';display:inline-block;width:4px;height:20px;background:var(--o);border-radius:2px}
.gv-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gv-scroll table{min-width:760px}
.gv-sec table{width:100%;border-collapse:collapse;margin-top:12px}
.gv-sec th,.gv-sec td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--bd);font-size:.88em}
.gv-sec th{background:#0a0a0a;color:var(--tm);font-weight:600;text-transform:uppercase;font-size:.75em;letter-spacing:.5px}
.gv-sec tr:hover{background:rgba(255,153,0,.03)}
.gv-badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:.78em;font-weight:700;background:rgba(62,207,74,.2);color:#3ecf4a}
.gv-tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:.72em;font-weight:600}
.gv-tag.a1{background:rgba(125,211,252,.15);color:var(--a1)}
.gv-tag.a2{background:rgba(251,191,36,.15);color:var(--a2)}
.gv-tag.b{background:rgba(74,222,128,.15);color:var(--b)}
.gv-legend{display:flex;gap:24px;flex-wrap:wrap;background:var(--s);border:1px solid var(--bd);border-radius:8px;padding:16px 20px;margin-bottom:24px;font-size:.9em}
.gv-legend span{display:flex;align-items:center;gap:8px}
.gv-legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
@media(max-width:1024px){.gv-charts{grid-template-columns:1fr}}
@media(max-width:768px){.gv-kpi-grid{grid-template-columns:repeat(2,1fr)}.gv-wrap{height:260px}}
@media(max-width:480px){.gv-kpi-grid{grid-template-columns:1fr}}
.gv-wrap.tall{height:400px}
/* Collapsible Group Analytics sections (collapsed by default; fetch on first expand). */
.gv-list{display:flex;flex-direction:column;gap:14px}
.gv-card{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#0a0a0a;display:grid;grid-template-rows:auto 0fr;transition:grid-template-rows .3s ease}
.gv-card.open{grid-template-rows:auto 1fr}
.gv-card-head{display:flex;align-items:center;gap:12px;width:100%;padding:16px 20px;background:transparent;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.gv-card-head:hover{background:rgba(255,255,255,.04)}
.gv-card-title{color:#fff;font-weight:700;font-size:1em}
.gv-caret{margin-left:auto;color:var(--tm);transition:transform .3s ease;flex-shrink:0}
.gv-card.open .gv-caret{transform:rotate(180deg)}
.gv-card-body{overflow:hidden;min-height:0}
.gv-card-body>div{padding:0 20px 20px}
/* Inside a collapsible card the charts/tables shouldn't add their own card chrome or bottom gap. */
.gv-card-body .gv-chart,.gv-card-body .gv-sec{border:none;background:transparent;padding:0;margin:0}
.gv-card-body .gv-charts{margin-bottom:0}
/* ---- Page layout: title + evenly spaced, clearly labelled sections ---- */
.an-head{margin-bottom:28px}
.an-head h1{font-size:1.7em;margin-bottom:6px}
.an-sub{color:var(--tm);font-size:.92em}
.an-sec{margin:0 0 34px}
.an-sec:last-child{margin-bottom:0}
.an-sec-head{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.an-sec-head h2{color:#fff;font-size:1.15em;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:6px}
.an-sec-head h2 .ic{color:var(--o)}
.an-sec-desc{color:var(--tm);font-size:.86em;line-height:1.5;max-width:900px}
.an-sec-desc b{color:var(--t);font-weight:600}
/* ---- Shimmer skeleton for the Group Analytics section ---- */
.sk{position:relative;overflow:hidden;background:#0f0f0f;border-radius:8px}
.sk::after{content:"";position:absolute;top:0;left:-150%;height:100%;width:150%;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.06) 50%,transparent 100%);animation:skmove 1.3s infinite}
@keyframes skmove{100%{left:150%}}
.sk-h3{height:16px;width:180px;margin:0 auto 16px}
.sk-h2{height:20px;width:240px;margin-bottom:16px}
.sk-fill{position:absolute;inset:0;border-radius:8px}
.sk-row{height:34px;margin-bottom:8px;border-radius:6px}
.gv-wrap{background:transparent}
</style>
</head>
<body data-nav-active="agent-analytics" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap"><h1>Analytics</h1><p class="sub" style="color:#879596;font-size:.9em;margin:4px 0 24px">Team &amp; agent performance for the live quarter.</p></div>

<!-- Editor bucket popup -->
<div class="modal-bg" id="bucketModal" onclick="if(event.target===this)closeBucket()">
  <div class="modal">
    <div class="modal-head"><h2 id="bucketTitle">Bucket</h2><button class="modal-close" onclick="closeBucket()" aria-label="Close">&times;</button></div>
    <p class="bk-sub" id="bucketSub"></p>
    <div id="bucketBody"></div>
  </div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js"></script>
<script>
const A=window.PHDAuth;
const isAdminPlus=()=>A.atLeast&&A.atLeast('admin');
const ic=(n,s)=>window.icon?window.icon(n,s||14):'';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gate(msg){document.getElementById('wrap').innerHTML='<div class="gate"><h1>Analytics</h1><p>'+msg+'</p><a class="btn" href="app.html">Go to Live Dashboard</a></div>';}
let MY_TZ='IST';const TZ_ZONE={IST:'Asia/Kolkata',MST:'America/Denver'};
function fmtTZ(iso){if(!iso)return '—';try{return new Date(iso).toLocaleString('en-US',{timeZone:TZ_ZONE[MY_TZ]||TZ_ZONE.IST,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true})+' '+MY_TZ;}catch(e){return iso;}}

function colorsCell(c){
  return '<div class="colors">'
    +'<span class="dot d-green"><i></i>'+c.green+'</span>'
    +'<span class="dot d-yellow"><i></i>'+c.yellow+'</span>'
    +'<span class="dot d-red"><i></i>'+c.red+'</span>'
    +'<span class="dot d-black"><i></i>'+c.black+'</span>'
    +'<span class="dot d-purple"><i></i>'+c.purple+'</span>'
  +'</div>';
}

function tableFor(rows,isEditor){
  const head=`<thead><tr>
    <th class="l">Agent</th>
    <th>Resolved (quarter)</th>
    <th>Working on (open)</th>
    <th>Successful</th>
    <th>Immediate / Auto</th>
    <th>Resolved 12h</th>
    <th>Resolved 24h</th>
    <th>Open by color (G Y R B P)</th>
    ${isEditor?'<th>Tickets w/ comment</th>':''}
    ${isEditor&&isAdminPlus()?'<th></th>':''}
  </tr></thead>`;
  const body=rows.map(r=>`<tr>
    <td class="l"><span class="uname">${esc(r.username)}</span></td>
    <td class="big">${r.resolvedInQuarter}</td>
    <td>${r.open}</td>
    <td>${r.resolvedSuccessful}</td>
    <td>${r.immediateAuto}</td>
    <td>${r.resolved12}</td>
    <td>${r.resolved24}</td>
    <td>${colorsCell(r.colors)}</td>
    ${isEditor?('<td class="big">'+r.touched+'</td>'):''}
    ${isEditor&&isAdminPlus()?('<td><button class="btn sec mini" onclick="openBucket(\''+esc(r.username)+'\')">Check bucket</button></td>'):''}
  </tr>`).join('');
  return `<div class="tbl-card"><table>${head}<tbody>${body}</tbody></table></div>`;
}

// Time remaining vs the 240h SLA from creation (for open tickets).
function slaRem(deadlineIso){
  if(!deadlineIso)return {cls:'',txt:'—'};
  const ms=new Date(deadlineIso)-new Date();
  const over=ms<=0;const abs=Math.abs(ms);
  const d=Math.floor(abs/86400000),h=Math.floor((abs%86400000)/3600000);
  const span=(d>0?d+'d ':'')+h+'h';
  if(over)return {cls:'over',txt:'Overdue by '+span};
  return {cls:(ms<=48*3600000?'warn':'ok'),txt:span+' left'};
}
function ageText(ageHours){
  if(ageHours==null)return '—';
  const d=Math.floor(ageHours/24),h=Math.floor(ageHours%24);
  return (d>0?d+'d ':'')+h+'h';
}

async function openBucket(username){
  document.getElementById('bucketTitle').textContent="Bucket · "+username;
  document.getElementById('bucketSub').textContent='Open (live) tickets assigned to '+username+'. Times in '+MY_TZ+'.';
  document.getElementById('bucketBody').innerHTML='<div style="display:flex;justify-content:center;padding:30px"><div class="spinner"></div></div>';
  document.getElementById('bucketModal').style.display='flex';
  const r=await A.api('GET','/api/agent-bucket?username='+encodeURIComponent(username));
  const body=document.getElementById('bucketBody');
  if(!r.ok){body.innerHTML='<p style="color:var(--rl)">Could not load bucket (HTTP '+r.status+').</p>';return;}
  const tix=(r.data&&r.data.tickets)||[];
  if(!tix.length){body.innerHTML='<div class="bk-empty">No open tickets assigned to '+esc(username)+' right now. 🎉</div>';return;}
  body.innerHTML=tix.map(t=>{
    const rem=slaRem(t.deadline);
    const cmts=(t.comments||[]);
    const cmtHtml=cmts.length
      ? cmts.map(c=>'<div class="bk-cmt"><div class="bk-cmt-meta"><span>by <b>'+esc(c.user)+'</b></span><span>'+fmtTZ(c.at)+'</span></div><div class="bk-cmt-text">'+esc(c.text)+'</div></div>').join('')
      : '<div class="bk-nocmt">No comments on this ticket yet.</div>';
    return '<div class="bk-tk">'+
      '<div class="bk-tk-head"><a class="bk-id" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.shortId)+'</a>'+
        '<span class="bk-rem '+rem.cls+'">'+rem.txt+'</span></div>'+
      (t.title?('<div class="bk-title">'+esc(t.title)+'</div>'):'')+
      '<div class="bk-meta"><span>Created: <b>'+fmtTZ(t.createDate)+'</b></span><span>Age: <b>'+ageText(t.ageHours)+'</b></span><span>Status: <b>'+esc(t.status||'')+'</b></span></div>'+

// Ported "Groups" view (charts + tables), same output as app.html?view=groups.
// Loads the full live-quarter tickets via /api/live-quarter, computes metrics locally,
// and renders KPIs + 6 charts + the two tables into #groupsView.
// ============================================================================
const PHD_AGENTS=['harisss','shaavhad','flofalgu','punithsd','dbiswamb','arunkzn','tanviroo','obalasut','mellanej','chousoud','mbozied','urmahala','nobregak'];
const GA1=['harisss','punithsd','arunkzn','flofalgu'];
const GA2=['tanviroo','urmahala','chousoud','obalasut','shaavhad','dbiswamb'];
const GB=['mbozied','nobregak','mellanej'];
function getGroup(n){ if(GA1.includes(n))return 'A1'; if(GA2.includes(n))return 'A2'; if(GB.includes(n))return 'B'; return null; }
function gvAvg(a){ return a.length?a.reduce((s,v)=>s+v,0)/a.length:0; }
const GV_CHARTS=[];
function gvMakeChart(id,config){ const ctx=document.getElementById(id); if(ctx){ GV_CHARTS.push(new Chart(ctx,config)); } }
function gvDestroyCharts(){ GV_CHARTS.forEach(c=>{try{c.destroy();}catch(e){}}); GV_CHARTS.length=0; }

// Compute just the group/agent metrics renderGroupsView needs (subset of app.js computeMetrics).
function gvComputeMetrics(data){
  const allDates=data.map(r=>new Date(r.CreateDate)).filter(d=>!isNaN(d));
  const maxDate=allDates.length?new Date(Math.max(...allDates)):new Date();
  // Per-agent maps
  const aRes={},aTm={},aOpen={},aAsgn={};
  data.forEach(r=>{ if((r.Status==='Resolved'||r.Status==='Closed')&&r.ResolvedByIdentity&&!r.ResolvedByIdentity.includes('AutoSIM')){ const x=r.ResolvedByIdentity; aRes[x]=(aRes[x]||0)+1; if(r.CreateDate&&r.ResolvedDate){const h=(new Date(r.ResolvedDate)-new Date(r.CreateDate))/36e5; if(h>=0){(aTm[x]=aTm[x]||[]).push(h);}} } });
  data.filter(r=>r.Status!=='Resolved'&&r.Status!=='Closed').forEach(r=>{ if(r.AssigneeIdentity&&PHD_AGENTS.includes(r.AssigneeIdentity))aOpen[r.AssigneeIdentity]=(aOpen[r.AssigneeIdentity]||0)+1; });
  data.forEach(r=>{ if(r.AssigneeIdentity&&PHD_AGENTS.includes(r.AssigneeIdentity))aAsgn[r.AssigneeIdentity]=(aAsgn[r.AssigneeIdentity]||0)+1; });
  const aStatus={}; PHD_AGENTS.forEach(n=>{aStatus[n]={Assigned:0,'Work In Progress':0,Researching:0,Pending:0,Resolved:0,Closed:0};});
  data.forEach(r=>{ if(r.AssigneeIdentity&&PHD_AGENTS.includes(r.AssigneeIdentity)&&aStatus[r.AssigneeIdentity][r.Status]!==undefined){ aStatus[r.AssigneeIdentity][r.Status]++; } });
  const agents=PHD_AGENTS.map(n=>({name:n,assigned:aAsgn[n]||0,resolved:aRes[n]||0,open:aOpen[n]||0,avgTime:aTm[n]?gvAvg(aTm[n]):0,group:getGroup(n),statuses:aStatus[n]}));
  // Group tallies
  let a1R=0,a2R=0,bR=0,a1O=0,a2O=0,bO=0;
  data.forEach(r=>{ if(r.Status==='Resolved'){const g=getGroup(r.ResolvedByIdentity); if(g==='A1')a1R++;else if(g==='A2')a2R++;else if(g==='B')bR++;} if(r.Status!=='Resolved'){const g=getGroup(r.AssigneeIdentity); if(g==='A1')a1O++;else if(g==='A2')a2O++;else if(g==='B')bO++;} });
  const a1T=[],a2T=[],bT=[];
  data.forEach(r=>{ if(r.Status==='Resolved'&&r.ResolvedByIdentity&&r.CreateDate&&r.ResolvedDate){const g=getGroup(r.ResolvedByIdentity);const h=(new Date(r.ResolvedDate)-new Date(r.CreateDate))/36e5; if(h>=0){ if(g==='A1')a1T.push(h);else if(g==='A2')a2T.push(h);else if(g==='B')bT.push(h);}} });
  let a1As=0,a2As=0,bAs=0;
  data.forEach(r=>{ const g=getGroup(r.AssigneeIdentity); if(g==='A1')a1As++;else if(g==='A2')a2As++;else if(g==='B')bAs++; });
  const dL=[],dgA1=[],dgA2=[],dgB=[];
  for(let i=6;i>=0;i--){ const ds=new Date(maxDate);ds.setDate(ds.getDate()-i);ds.setHours(0,0,0,0);const de=new Date(ds);de.setDate(de.getDate()+1); dL.push(ds.toLocaleDateString('en-US',{month:'short',day:'numeric'})); let x=0,y=0,z=0; data.forEach(r=>{ if(r.ResolvedDate){const rd=new Date(r.ResolvedDate); if(rd>=ds&&rd<de){const g=getGroup(r.ResolvedByIdentity); if(g==='A1')x++;else if(g==='A2')y++;else if(g==='B')z++;}} }); dgA1.push(x);dgA2.push(y);dgB.push(z); }
  return { agents, a1R,a2R,bR,a1O,a2O,bO, a1Avg:gvAvg(a1T),a2Avg:gvAvg(a2T),bAvg:gvAvg(bT), a1As,a2As,bAs, dL,dgA1,dgA2,dgB };
}

};
function gvSortedByGroup(m){
  return [...m.agents.filter(a=>a.group==='A1').sort((a,b)=>b.resolved-a.resolved),...m.agents.filter(a=>a.group==='A2').sort((a,b)=>b.resolved-a.resolved),...m.agents.filter(a=>a.group==='B').sort((a,b)=>b.resolved-a.resolved)];
}

(async function init(){
  // Paint the layout first (initials for avatars), then load profiles/avatars and refresh member tiles.
  await load();
  await loadGroupProfiles();
  // Re-render just the team member grids now that display names + avatars are available.
  document.querySelectorAll('.ga-group').forEach(function(card){
    const team=card.getAttribute('data-team'); const g=GROUPS.find(x=>x.name===team); if(!g)return;
    const grid=card.querySelector('.ga-mem-grid');
    if(grid) grid.innerHTML=g.members.slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase())).map(memberCard).join('');
  });
})();
</script>
