<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Anti-FOUC: hide the body until topbar-auth.js injects its CSS + builds the nav rail / profile
     column, so the chrome doesn't flash in on refresh. Cleared by topbar-auth after the chrome
     builds; a failsafe timer clears it if the script never runs (offline) so it can't stay hidden. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<title>Analytics · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shimmer.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.wrap{padding:32px 24px;width:auto;max-width:none;margin:0}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
<style id="aa-light">
/* Analytics — same visual language as Errors in Resolved: dark navy hero with an orange rule, KPI cards
   overlapping it, then white collapsible cards (chevron expanders) holding filter bars + ledger tables.
   Everything is scoped under .aa (a size container, so the grids respond to the content width). */
#wrap.wrap{padding-top:0!important;padding-bottom:28px!important}
.aa{--ink:#1b2026;--mut:#5c6773;--line:#e2e6ea;--soft:#f5f6f8;--acc:#ec7211;--acc-bg:#fff3e8;--acc-ink:#9a4100;
  --red:#b42318;--red-bg:#fdecec;--grn:#1a7a43;--grn-bg:#e5f5ec;--navy:#1f2a40;--focus:#f0a35a;
  --g-a1:#1f5fbf;--g-a1-bg:#e6f0fc;--g-a1-dot:#3b82f6;--g-b:#1a7a43;--g-b-bg:#e5f5ec;--g-b-dot:#22a35a;--g-a2:#8f4f00;--g-a2-bg:#fff1dc;--g-a2-dot:#e8930c;
  container-type:inline-size;color:var(--ink)}
.aa button{font:inherit;text-transform:none}
.aa :is(button,a,select,[tabindex]):focus-visible{outline:3px solid var(--focus)!important;outline-offset:2px}
.aa-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.aa-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 78px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.aa-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.aa-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.aa-hero-in{position:relative;display:flex;gap:20px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.aa-hero-main{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1 1 360px}
.aa-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.aa-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.aa .aa-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.05}
.aa-hero-sub{margin-top:9px;max-width:62ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.82)}
.aa-meta{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:10px 26px;margin:0;padding:13px 16px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);max-width:100%;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.aa-meta dt{font-size:.64em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:rgba(233,237,243,.66)}
.aa-meta dd{margin:4px 0 0;font-size:.86em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.aa-meta .aa-meta-wide{grid-column:1/-1}
.aa-gchips{display:flex;flex-wrap:wrap;gap:6px}
.aa-gchip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font-size:.92em}
.aa-gchip::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--d)}

/* ---- KPI row (overlaps the hero) ---- */
.aa-kpis{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:-56px 18px 16px}
@container (min-width:520px){.aa-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.aa-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.aa-kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6);min-width:0}
.aa-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#c4ccd4)}
.aa-kpi-l{display:flex;align-items:center;gap:9px;font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.aa-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:#3a4552}
.aa-kpi-v{margin-top:12px;font-size:2.4em;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.aa-kpi-s{margin-top:7px;font-size:.82em;font-weight:600;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aa-kpi-s b{color:var(--ink);font-weight:800}
.aa-kpi-bar{margin-top:12px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.aa-kpi-bar i{display:block;height:100%;border-radius:inherit;background:var(--k)}
.aa-kpi.is-base{--k:var(--navy)}
.aa-kpi.is-good{--k:#1f9d57}.aa-kpi.is-good .aa-kpi-v{color:var(--grn)}.aa-kpi.is-good .aa-kpi-ic{background:var(--grn-bg);color:var(--grn)}
.aa-kpi.is-warn{--k:var(--acc)}.aa-kpi.is-warn .aa-kpi-ic{background:var(--acc-bg);color:#b5530a}
.aa-kpi.is-blue{--k:#2b66c1}.aa-kpi.is-blue .aa-kpi-ic{background:#e9f0fb;color:#1f4f9a}
.aa-kpi-who{margin-top:10px;display:flex;align-items:center;gap:10px;min-width:0}
.aa-kpi-who .aa-av{width:38px;height:38px;font-size:.95em}
.aa-kpi-name{font-size:1.25em;font-weight:800;letter-spacing:-.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}

/* ---- Collapsible section cards (chevron expanders, as on Errors in Resolved) ---- */
.aa .an-sec{margin:0}
.aa .gv-list{display:flex;flex-direction:column;gap:16px}
.aa .gv-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18);
  display:grid;grid-template-rows:auto 0fr;transition:grid-template-rows .3s ease,border-color .15s,box-shadow .15s;overflow:hidden}
.aa .gv-card.open{grid-template-rows:auto 1fr;border-color:#d8dee4;box-shadow:0 14px 30px -24px rgba(20,30,50,.55)}
.aa .aa-card-h{margin:0;font-size:1em;font-weight:inherit;letter-spacing:0;line-height:inherit}
.aa .gv-card-head{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 18px;background:#fff;border:none;border-bottom:1px solid transparent;color:var(--ink);text-align:left;cursor:pointer}
.aa .gv-card-head:hover{background:#fafbfc}
.aa .gv-card.open>.gv-card-head{background:#f7f8fa;border-bottom-color:var(--line)}
.aa .gv-card-head:focus-visible{outline-offset:-3px}
.aa-chev{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;color:#6b7580}
.aa-chev svg{transition:transform .15s}
.aa .gv-card-head[aria-expanded="true"] .aa-chev svg{transform:rotate(90deg)}
.aa .gv-card-head:hover .aa-chev{background:#e6f0fc;color:#2b66c1}
.aa-card-ic{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--acc-bg);color:#b5530a;border:1px solid #f7d4b0}
.aa-card-tt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.aa .gv-card-title{font-size:1.12em;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:var(--ink)}
.aa-card-sub{font-size:.8em;font-weight:600;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aa-card-tag{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:#eef1f4;border:1px solid #d4dade;color:#3a4552;font-size:.7em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap}
@container (max-width:560px){.aa-card-tag{display:none}}
.aa .gv-card-body{overflow:hidden;min-height:0}
.aa .gv-card:not(.open)>.gv-card-body{visibility:hidden;transition:visibility 0s .3s}
.aa .gv-card-body>div{padding:16px 18px 20px}
@container (max-width:520px){.aa .gv-card-body>div{padding:14px 12px 16px}.aa .gv-card-head{padding:12px}
  .aa .ga-opt,.aa .perf-chip{white-space:normal}.aa .ga-fopts.ga-radio{display:flex}.aa-card-sub{white-space:normal}.aa-hero-ic{display:none}}

/* ---- Filter bars (Recent Activity window + groups, Performance period picker) ---- */
.aa .ga-filters{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between;margin:0 0 12px;padding:12px 14px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.aa .ga-fgroup{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:7px}
.aa .ga-flabel{padding:0;font-size:.66em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)}
.aa .ga-fopts{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:12px;background:#e7eaee;max-width:100%}
.aa .ga-fopts.ga-checks{background:none;padding:0;gap:6px}
.aa .ga-opt{position:relative;display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:99px;font-size:.82em;font-weight:700;color:#3a4552;cursor:pointer;user-select:none;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.aa .ga-opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.aa .ga-opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.aa .ga-fopts.ga-radio .ga-opt:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.aa .ga-fopts.ga-radio .ga-opt.checked{background:var(--navy);color:#fff;box-shadow:0 2px 6px -2px rgba(20,30,50,.5)}
.aa .ga-checks .ga-opt{--gc:#5c6773;--gcb:#fff;--gd:#9aa4ae;background:#fff;border:1px solid #d4dade;padding:5px 12px 5px 10px}
.aa .ga-checks .ga-opt[data-g="A1"]{--gc:var(--g-a1);--gcb:var(--g-a1-bg);--gd:var(--g-a1-dot)}
.aa .ga-checks .ga-opt[data-g="B"]{--gc:var(--g-b);--gcb:var(--g-b-bg);--gd:var(--g-b-dot)}
.aa .ga-checks .ga-opt[data-g="A2"]{--gc:var(--g-a2);--gcb:var(--g-a2-bg);--gd:var(--g-a2-dot)}
.aa .ga-checks .ga-opt::before{content:'';width:14px;height:14px;border-radius:4px;flex-shrink:0;border:2px solid #b4bcc5;background:#fff center/10px 10px no-repeat;transition:background-color .15s,border-color .15s}
.aa .ga-checks .ga-opt:hover{border-color:#b4bcc5}
.aa .ga-checks .ga-opt.checked{background:var(--gcb);color:var(--gc);border-color:color-mix(in srgb,var(--gd) 55%,#fff)}
.aa .ga-checks .ga-opt.checked::before{background-color:var(--gd);border-color:var(--gd);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>')}
.aa .ga-scope-note{display:inline-flex;align-items:center;gap:8px;max-width:100%;margin:0 0 14px;padding:5px 12px 5px 10px;border-radius:99px;background:var(--acc-bg);border:1px solid #f7c99c;color:var(--acc-ink);font-size:.8em;font-weight:700}
.aa .ga-scope-note::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--acc);flex-shrink:0}
.aa .ga-scope-note:empty{display:none}

/* ---- Tables ---- */
.aa .ga-tables{display:flex;flex-direction:column;gap:22px}
.aa .ga-tbl-title{display:flex;align-items:center;gap:10px;margin:0 0 9px;font-size:.7em!important;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)!important}
.aa .ga-tbl-title::after{content:'';flex:1 1 auto;height:1px;background:var(--line)}
.aa .gv-scroll{overflow:auto;max-height:700px;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch;background:#fff}
.aa .iap-table{width:100%;min-width:980px;border-collapse:separate;border-spacing:0;font-size:.86em}
.aa .iap-table th,.aa .iap-table td{padding:9px 12px;border:0!important;border-bottom:1px solid #eef1f4!important;text-align:right;vertical-align:middle;white-space:nowrap;font-variant-numeric:tabular-nums;background:#fff!important}
.aa .iap-table th:first-child,.aa .iap-table td:first-child{text-align:left;position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}
.aa .iap-table thead th{position:sticky;top:0;z-index:2;background:#f5f6f8!important;color:var(--mut)!important;border-bottom:1px solid var(--line)!important;font-size:.72em;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.aa .iap-table thead th:first-child{z-index:3}
.aa .iap-table tbody tr:nth-child(even) td{background:#fff!important}
.aa .iap-table tbody tr:hover td{background:#fff7ed!important}
.aa .iap-table tbody tr:last-child td{border-bottom:0!important}
.aa .iap-table td.col-key{background:#f1faf4!important;color:#0f6b38!important;font-weight:800}
.aa .iap-table thead th.col-key{background:#e3f4ea!important;color:#14683a!important}
.aa .iap-table td.col-total{background:#f3f7fd!important;color:#1f4f9a!important}
.aa .iap-table thead th.col-total{background:#e6eefb!important;color:#1f4f9a!important}
.aa .iap-table tbody tr:hover td.col-key{background:#e6f6ec!important}
.aa .iap-table tbody tr:hover td.col-total{background:#e9f1fc!important}
.aa .iap-table td.zero,.aa .iap-table td .zero,.aa .iap-table td.col-key.zero,.aa .iap-table td.col-total.zero{color:#7c8792!important;font-weight:500}
.aa .iap-table th.iap-sort{cursor:pointer;user-select:none}
.aa .iap-table th.iap-sort:hover{color:var(--ink)!important;background:#edf0f3!important}
.aa .iap-table th.iap-sort.sorted{color:var(--acc-ink)!important;box-shadow:inset 0 -2px 0 var(--acc)}
.aa .iap-table th.iap-sort:focus-visible{outline-offset:-3px}
.aa .iap-table th .th-full{display:inline-block;overflow:hidden;text-overflow:ellipsis;max-width:130px;vertical-align:middle}
.aa .iap-table th .th-short{display:none;overflow:hidden;text-overflow:ellipsis;max-width:90px;vertical-align:middle}
.aa .iap-table th .th-arrow{white-space:nowrap;color:var(--acc)}
@container (max-width:900px){
  .aa .iap-table th .th-full{display:none}
  .aa .iap-table th .th-short{display:inline-block}
  .aa .iap-table th,.aa .iap-table td{padding:8px 10px}
  .aa .iap-table{min-width:760px}
}
.aa .iap-hint{color:var(--mut);font-size:.8em;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.aa .gamma-note{margin:10px 0 0;padding:10px 14px;border-radius:8px;background:#fffaf0;border:1px solid #f3dfb8;border-left:3px solid #d08a1a;color:#4a3a1c;font-size:.8em;line-height:1.55}
.aa .gamma-note b{color:#2a1f0a}
/* Group pills (BLR / AZA / WFH) */
.aa .gv-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.8em;font-weight:800;letter-spacing:.3px}
.aa .gv-tag::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.aa .gv-tag.a1{background:var(--g-a1-bg);color:var(--g-a1)}
.aa .gv-tag.b{background:var(--g-b-bg);color:var(--g-b)}
.aa .gv-tag.a2{background:var(--g-a2-bg);color:var(--g-a2)}
/* Agent cell: avatar-initial circle + login (+ display name) + PHD tag */
.aa-who{display:inline-flex;align-items:center;gap:10px;min-width:0}
.aa-av{flex-shrink:0;width:30px;height:30px;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-size:.84em;font-weight:800;
  background:hsl(var(--h) 60% 92%);color:hsl(var(--h) 55% 26%);border:1px solid hsl(var(--h) 45% 82%)}
.aa-av img{width:100%;height:100%;object-fit:cover;display:block}
.aa-who-t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.aa-who-t b{font-weight:800;color:var(--ink)}
.aa-who-t small{font-size:.78em;font-weight:600;color:var(--mut)!important}
.aa-phd{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:.66em;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#136b67;background:#d2f0ee;border:1px solid #9fd9d4;cursor:default;flex-shrink:0}

/* ---- Performance Overview ---- */
.aa .perf-body{padding:0}
.aa .perf-head-right{display:block;margin:0 0 16px;padding:12px 14px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.aa .perf-picker{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.aa .perf-chips{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:12px;background:#e7eaee;max-width:100%}
.aa .perf-chip{padding:6px 13px;border:none;border-radius:99px;background:none;font-size:.82em;font-weight:700;color:#3a4552;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.aa .perf-chip:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.aa .perf-chip.on{background:var(--navy);color:#fff;box-shadow:0 2px 6px -2px rgba(20,30,50,.5)}
.aa .perf-sub{display:inline-flex;flex-wrap:wrap;gap:8px}
.aa select.perf-sel{font:inherit;font-size:.84em;font-weight:700;color:var(--ink)!important;background:#fff!important;border:1px solid #d4dade!important;border-radius:8px!important;padding:6px 10px;cursor:pointer;max-width:100%}
.aa .perf-groups{margin-left:auto}
@container (max-width:700px){.aa .perf-groups{margin-left:0}}
.aa .pf-section-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:.7em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)}
.aa .pf-section-h::after{content:'';flex:1 1 auto;height:1px;background:var(--line)}
.aa .pf-section-h svg{color:var(--acc)}
.aa .pf-stats{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@container (min-width:440px){.aa .pf-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.aa .pf-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.aa .pf-stat{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px 13px;box-shadow:0 10px 24px -22px rgba(20,30,50,.55);min-width:0}

.aa .pf-stat-top svg{width:28px;height:28px;padding:6px;border-radius:8px;flex-shrink:0;background:color-mix(in srgb,var(--k) 12%,#fff);color:var(--k)}

.aa .pf-stat-v{margin-top:10px;font-size:1.9em;font-weight:800;letter-spacing:-.9px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.aa .pf-stat-s{margin-top:6px;font-size:.8em;font-weight:600;color:var(--mut)}
.aa .pf-created{--k:#2b66c1}.aa .pf-resolved{--k:#1f9d57}.aa .pf-avgres{--k:#0e7490}.aa .pf-sla{--k:#6d4fd6}
.aa .pf-autosim{--k:#d1650d}.aa .pf-repeat{--k:#a86c08}.aa .pf-avgrep{--k:#be185d}.aa .pf-pet{--k:#0d8278}

@container (min-width:600px){.aa .pf-podium{grid-template-columns:repeat(3,minmax(0,1fr))}}
.aa .pf-medal{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 14px 14px;text-align:center;box-shadow:0 12px 26px -22px rgba(20,30,50,.6);min-width:0}
.aa .pf-medal::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--m)}
.aa .pf-medal.pf-gold{--m:linear-gradient(90deg,#e8b10d,#ffd75e);background:linear-gradient(180deg,#fffaeb,#fff 55%)}
.aa .pf-medal.pf-silver{--m:linear-gradient(90deg,#97a4b1,#cfd8e0)}
.aa .pf-medal.pf-bronze{--m:linear-gradient(90deg,#b8702c,#e0a066)}
@container (min-width:600px){.aa .pf-medal.pf-gold{transform:translateY(-6px)}}
.aa .pf-medal-badge{position:absolute;top:10px;right:12px;font-size:1.25em;line-height:1}
.aa .pf-rank{position:absolute;top:10px;left:12px;font-size:.66em;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.aa .pf-medal .aa-av{width:54px;height:54px;font-size:1.25em;border-width:2px}
.aa .pf-medal-id{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:9px;font-size:.95em;font-weight:800;color:var(--ink);min-width:0}
.aa .pf-medal-id span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aa .pf-medal-metrics{display:flex;flex-direction:column;gap:3px;margin-top:9px}
.aa .pf-mm{font-size:.8em;color:var(--mut)}
.aa .pf-mm b{color:var(--ink);font-size:1.08em;font-variant-numeric:tabular-nums}
.aa .pf-mm-avg{font-size:.76em}
.aa .perf-ytd-block{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}

/* ---- Skeletons, states ---- */
.aa-skel{display:inline-block;vertical-align:middle;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:aaShim 1.4s ease infinite}

.aa-skel.is-circle{border-radius:50%}

<script src="icons.js?v=2"></script>
<script src="api-config.js"></script>

<script>
const A=window.PHDAuth;
const isAdminPlus=()=>A.atLeast&&A.atLeast('admin');
const ic=(n,s)=>window.icon?window.icon(n,s||14):'';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gate(msg){document.getElementById('wrap').innerHTML='<div class="aa">'+heroHtml()+'<div class="aa-kpis" aria-hidden="true"></div>'+
  '<section class="aa-panel" aria-labelledby="aaGateH">'+
  aaStateHtml('is-mute','lock','Log in to see Analytics',esc(msg),'<a class="aa-btn" href="app.html">'+ic('arrow-left',14)+'Go to Live Dashboard</a>','aaGateH')+
  '</section></div>';}
// ---------- Shared presentation helpers (hero, avatars, skeletons, states, live region) ----------
const AA_CHEV='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function aaNum(n){ return (Number(n)||0).toLocaleString('en-US'); }
function aaPct(n,d){ if(!d) return '0%'; const p=n/d*100; return (p>0&&p<10?p.toFixed(1).replace(/\.0$/,''):String(Math.round(p)))+'%'; }
function aaHue(s){ let h=0; s=String(s||''); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return [24,205,165,265,335,45,190,120][h%8]; }
function aaSafeImg(u){ u=String(u||''); return /^(https?:\/\/|data:image\/)/i.test(u)?u:''; }
// Avatar circle: photo when one is on file, otherwise a coloured initial.
function aaAvatar(login,avatar){
  const img=aaSafeImg(avatar);
  return '<span class="aa-av" style="--h:'+aaHue(login)+'" aria-hidden="true">'+(img?'<img src="'+esc(img)+'" alt="">':esc(String(login||'?').trim().charAt(0).toUpperCase()||'?'))+'</span>';
}
function aaIsPhd(login){ return PHD_AGENTS.indexOf(String(login||'').toLowerCase())>=0; }
function aaPhdTag(login){ return aaIsPhd(login)?'<span class="aa-phd" title="PHD agent">PHD</span>':''; }
// Agent cell for the tables: avatar + login (+ display name once /api/user-roles has loaded) + PHD tag.
function aaAgentCell(login){
  const p=GROUP_PROFILES[String(login||'').toLowerCase()]||{};
  const dn=(p.displayName&&p.displayName.toLowerCase()!==String(login).toLowerCase())?p.displayName:'';
  return '<span class="aa-who">'+aaAvatar(login,p.avatar)+'<span class="aa-who-t"><b>'+esc(login)+'</b>'+(dn?'<small>'+esc(dn)+'</small>':'')+'</span>'+aaPhdTag(login)+'</span>';
}
function aaSkel(w,h,extra){ return '<span class="aa-skel'+(extra?' '+extra:'')+'" style="width:'+w+';height:'+h+'px"></span>'; }
// Friendly empty / error state. `btn` is ready-made button HTML (e.g. a Retry that re-runs the same fetch).
function aaStateHtml(icCls,icon,title,text,btn,hid){
  return '<div class="aa-state"><span class="aa-state-ic '+(icCls||'')+'">'+ic(icon,24)+'</span><h3 class="aa-state-t"'+(hid?' id="'+hid+'"':'')+'>'+title+'</h3>'+(text?'<p>'+text+'</p>':'')+(btn||'')+'</div>';
}
function aaRetryBtn(js,label){ return '<button type="button" class="aa-btn" onclick="'+js+'">'+ic('refresh',14)+(label||'Retry')+'</button>'; }
function aaErrorHtml(what,js){ return aaStateHtml('','alert-triangle','Couldn\u2019t load '+what,'<span role="alert">The server didn\u2019t respond with the data. Check your connection, then try again.</span>',aaRetryBtn(js)); }
// Polite live region: loading / loaded / failed announcements for screen readers.
function aaAnnounce(msg){ const l=document.getElementById('aaLive'); if(!l)return; l.textContent=''; setTimeout(function(){ l.textContent=msg; },40); }
function aaBusy(id,on){ const el=document.getElementById(id); if(el) el.setAttribute('aria-busy',on?'true':'false'); }
// Extra attributes for a sortable header cell (keyboard-focusable + aria-sort for the active column).
function aaThAttrs(active,dir){ return ' scope="col" tabindex="0" aria-sort="'+(active?(dir==='asc'?'ascending':'descending'):'none')+'"'; }
function aaScrollAttrs(label){ return ' tabindex="0" role="region" aria-label="'+esc(label)+'"'; }
function heroHtml(){
  const gw=(typeof GW_TITLE==='function')?GW_TITLE(GW_FILTER.win):'';
  const pw=(typeof perfWindow==='function')?perfWindow().label:'';
  const g=function(name,dot){ return '<span class="aa-gchip" style="--d:'+dot+'">'+name+'</span>'; };
  return '<div class="aa-hero"><div class="aa-hero-in"><div class="aa-hero-main"><span class="aa-hero-ic">'+ic('bar-chart',24)+'</span><div>'+
    '<p class="aa-eyebrow">Team performance \u00b7 2026</p><h1>Analytics</h1>'+
    '<p class="aa-hero-sub">How the PHD agents and their groups are resolving tickets: recent activity by day and week, plus period performance, top performers and closure-code breakdowns.</p>'+
    '</div></div>'+
    '<dl class="aa-meta"><div class="aa-meta-wide"><dt>Groups</dt><dd class="aa-gchips">'+g('BLR','#7db3ff')+g('AZA','#5fd38d')+g('WFH','#ffc15e')+'</dd></div>'+
      '<div><dt>Agents</dt><dd>'+PHD_AGENTS.length+' PHD agents</dd></div>'+
      '<div><dt>Recent window</dt><dd id="aaHeroWin">'+esc(gw)+'</dd></div>'+
      '<div class="aa-meta-wide"><dt>Performance period</dt><dd id="aaHeroPeriod">'+esc(pw)+'</dd></div>'+
    '</dl></div></div>';
}
let MY_TZ='IST';const TZ_ZONE={IST:'Asia/Kolkata',MST:'America/Denver'};
function fmtTZ(iso){if(!iso)return '—';try{return new Date(iso).toLocaleString('en-US',{timeZone:TZ_ZONE[MY_TZ]||TZ_ZONE.IST,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true})+' '+MY_TZ;}catch(e){return iso;}}

function colorsCell(c){
  return '<div class="colors">'
    +'<span class="dot d-green"><i></i>'+c.green+'</span>'
    +'<span class="dot d-yellow"><i></i>'+c.yellow+'</span>'
    +'<span class="dot d-red"><i></i>'+c.red+'</span>'
    +'<span class="dot d-black"><i></i>'+c.black+'</span>'
    +'<span class="dot d-purple"><i></i>'+c.purple+'</span>'
  +'</div>';
}

function tableFor(rows,isEditor){
  const head=`<thead><tr>
    <th class="l">Agent</th>
    <th>Resolved (quarter)</th>
    <th>Working on (open)</th>
    <th>Successful</th>
    <th>Immediate / Auto</th>
    <th>Resolved 12h</th>
    <th>Resolved 24h</th>
    <th>Open by color (G Y R B P)</th>
    ${isEditor?'<th>Tickets w/ comment</th>':''}
    ${isEditor&&isAdminPlus()?'<th></th>':''}
  </tr></thead>`;
  const body=rows.map(r=>`<tr>
    <td class="l"><span class="uname">${esc(r.username)}</span></td>
    <td class="big">${r.resolvedInQuarter}</td>
    <td>${r.open}</td>
    <td>${r.resolvedSuccessful}</td>
    <td>${r.immediateAuto}</td>
    <td>${r.resolved12}</td>
    <td>${r.resolved24}</td>
    <td>${colorsCell(r.colors)}</td>
    ${isEditor?('<td class="big">'+r.touched+'</td>'):''}
    ${isEditor&&isAdminPlus()?('<td><button class="btn sec mini" onclick="openBucket(\''+esc(r.username)+'\')">Check bucket</button></td>'):''}
  </tr>`).join('');
  return `<div class="tbl-card"><table>${head}<tbody>${body}</tbody></table></div>`;
}

// Time remaining vs the 240h SLA from creation (for open tickets).
function slaRem(deadlineIso){
  if(!deadlineIso)return {cls:'',txt:'—'};
  const ms=new Date(deadlineIso)-new Date();
  const over=ms<=0;const abs=Math.abs(ms);
  const d=Math.floor(abs/86400000),h=Math.floor((abs%86400000)/3600000);
  const span=(d>0?d+'d ':'')+h+'h';
  if(over)return {cls:'over',txt:'Overdue by '+span};
  return {cls:(ms<=48*3600000?'warn':'ok'),txt:span+' left'};
}
function ageText(ageHours){
  if(ageHours==null)return '—';
  const d=Math.floor(ageHours/24),h=Math.floor(ageHours%24);
  return (d>0?d+'d ':'')+h+'h';
}

async function openBucket(username){
  document.getElementById('bucketTitle').textContent="Bucket · "+username;
  document.getElementById('bucketSub').textContent='Open (live) tickets assigned to '+username+'. Times in '+MY_TZ+'.';
  const body=document.getElementById('bucketBody');
  // Skeleton ticket cards while the bucket loads (same shape as the final cards).
  const sk='<div class="bk-tk" aria-hidden="true"><div class="bk-tk-head">'+aaSkel('90px',14)+aaSkel('80px',18)+'</div>'+aaSkel('80%',12)+'<div style="margin-top:12px">'+aaSkel('55%',10)+'</div></div>';
  body.setAttribute('aria-busy','true');
  body.innerHTML='<span class="aa-sr" role="status">Loading the bucket\u2026</span>'+sk+sk+sk;
  document.getElementById('bucketModal').style.display='flex';
  const cb=document.querySelector('#bucketModal .modal-close'); if(cb) try{ cb.focus(); }catch(e){}
  let r=null; try{ r=await A.api('GET','/api/agent-bucket?username='+encodeURIComponent(username)); }catch(e){}
  body.setAttribute('aria-busy','false');
  if(!r||!r.ok){body.innerHTML=aaErrorHtml('the bucket'+(r&&r.status?' (HTTP '+r.status+')':''),'openBucket(\''+String(username).replace(/[^\w.@-]/g,'')+'\')');return;}
  const tix=(r.data&&r.data.tickets)||[];
  if(!tix.length){body.innerHTML=aaStateHtml('is-mute','check-circle','Bucket is empty','No open tickets assigned to '+esc(username)+' right now.');return;}
  body.innerHTML=tix.map(t=>{
    const rem=slaRem(t.deadline);
    const cmts=(t.comments||[]);
    const cmtHtml=cmts.length
      ? cmts.map(c=>'<div class="bk-cmt"><div class="bk-cmt-meta"><span>by <b>'+esc(c.user)+'</b></span><span>'+fmtTZ(c.at)+'</span></div><div class="bk-cmt-text">'+esc(c.text)+'</div></div>').join('')
      : '<div class="bk-nocmt">No comments on this ticket yet.</div>';
    return '<div class="bk-tk">'+
      '<div class="bk-tk-head"><a class="bk-id" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.shortId)+'</a>'+
        '<span class="bk-rem '+rem.cls+'">'+rem.txt+'</span></div>'+
      (t.title?('<div class="bk-title">'+esc(t.title)+'</div>'):'')+
      '<div class="bk-meta"><span>Created: <b>'+fmtTZ(t.createDate)+'</b></span><span>Age: <b>'+ageText(t.ageHours)+'</b></span><span>Status: <b>'+esc(t.status||'')+'</b></span></div>'+
      '<div class="bk-cmts"><div class="bk-cmts-t">Comments ('+cmts.length+')</div>'+cmtHtml+'</div>'+
    '</div>';
  }).join('');
}
function closeBucket(){document.getElementById('bucketModal').style.display='none';}

async function load(){
  if(!A.getUser()||!A.getToken()){gate('This page is for logged-in users. Log in from the Live Dashboard first.');return;}
  // Paint the full layout IMMEDIATELY (hardcoded labels + shimmer for the data bits) — no full-page spinner.
  render();
  try{MY_TZ=await A.myTimezone();}catch(e){}
  try{
    const version=await A.liveVersion();
    const res=await A.swrLoad({
      key:'agent-analytics',
      version:version,
      fetch:()=>A.api('GET','/api/agent-analytics'),
      onData:(d)=>applyStats(d)
    });
    if(!res.painted && res.status===403){ /* still shows the static team layout */ }
  }catch(e){}
}
// login -> per-agent stats from /api/agent-analytics.
let AGENT_STATS={};
function applyStats(d){
  AGENT_STATS={};
  [].concat(d&&d.leads||[], d&&d.editors||[]).forEach(function(s){ AGENT_STATS[(s.username||'').toLowerCase()]=s; });
  fillTeamStats();
}
// ---- Group membership (Alpha / Beta / Gamma). Login IDs; display names/avatars fetched below. ----
const GROUPS=[
  {name:'BLR',color:'#7dd3fc',members:['harisss','punithsd','arunkzn','flofalgu']},
  {name:'AZA', color:'#4ade80',members:['mbozied','nobregak','mellanej']},
  {name:'WFH',color:'#fbbf24',members:['tanviroo','urmahala','obalasut','shaavhad','chousoud','dbiswamb']},
];
let GROUP_PROFILES={}; // lowercased login -> { username, displayName, avatar }

// Fetch display names (/api/user-roles) + avatars (/api/user-avatars) once, then render groups.
async function loadGroupProfiles(){

// Ported "Groups" view (charts + tables), same output as app.html?view=groups.
// Loads the full live-quarter tickets via /api/live-quarter, computes metrics locally,
// and renders KPIs + 6 charts + the two tables into #groupsView.
// ============================================================================
const PHD_AGENTS=['harisss','shaavhad','flofalgu','punithsd','dbiswamb','arunkzn','tanviroo','obalasut','mellanej','chousoud','mbozied','urmahala','nobregak'];
const GA1=['harisss','punithsd','arunkzn','flofalgu'];
const GA2=['tanviroo','urmahala','chousoud','obalasut','shaavhad','dbiswamb'];
const GB=['mbozied','nobregak','mellanej'];
function getGroup(n){ if(GA1.includes(n))return 'A1'; if(GA2.includes(n))return 'A2'; if(GB.includes(n))return 'B'; return null; }
function gvAvg(a){ return a.length?a.reduce((s,v)=>s+v,0)/a.length:0; }
// AUTHORITATIVE AutoSIM-resolved rule (ALL FOUR): empty RootCauseDetails; ClosureCode Immediately
// Resolved / Automatically Closed; ResolvedByIdentity == AutoSIM ARN; Tags has the auto-resolve marker.
const AUTOSIM_ARN='arn:aws:sts::511128310777:assumed-role/AutoSIM/AutoSIM';
function isAutoSimResolved(r){
  if(!r)return false;
  const cc=String(r.ClosureCode||'').trim();
  const tags=Array.isArray(r.Tags)?r.Tags.join(','):String(r.Tags||'');
  return String(r.RootCauseDetails||'').trim()===''
    &&(cc==='Immediately Resolved'||cc==='Automatically Closed')
    &&String(r.ResolvedByIdentity||'').trim()===AUTOSIM_ARN
    &&tags.toLowerCase().includes('pet_incident_auto_resolved');
}

try{ Chart.defaults.color='#5c6773'; Chart.defaults.borderColor='rgba(0,0,0,.06)'; Chart.defaults.font.family="'Inter',-apple-system,sans-serif"; Chart.defaults.plugins.legend.labels.usePointStyle=true; }catch(e){}

// Compute just the group/agent metrics renderGroupsView needs (subset of app.js computeMetrics).
function gvComputeMetrics(data){
  const allDates=data.map(r=>new Date(r.CreateDate)).filter(d=>!isNaN(d));
  const maxDate=allDates.length?new Date(Math.max(...allDates)):new Date();
  // Per-agent maps
  const aRes={},aTm={},aOpen={},aAsgn={};
  data.forEach(r=>{ if((r.Status==='Resolved'||r.Status==='Closed')&&r.ResolvedByIdentity&&!isAutoSimResolved(r)){ const x=r.ResolvedByIdentity; aRes[x]=(aRes[x]||0)+1; if(r.CreateDate&&r.ResolvedDate){const h=(new Date(r.ResolvedDate)-new Date(r.CreateDate))/36e5; if(h>=0){(aTm[x]=aTm[x]||[]).push(h);}} } });
  data.filter(r=>r.Status!=='Resolved'&&r.Status!=='Closed').forEach(r=>{ if(r.AssigneeIdentity&&PHD_AGENTS.includes(r.AssigneeIdentity))aOpen[r.AssigneeIdentity]=(aOpen[r.AssigneeIdentity]||0)+1; });
  data.forEach(r=>{ if(r.AssigneeIdentity&&PHD_AGENTS.includes(r.AssigneeIdentity))aAsgn[r.AssigneeIdentity]=(aAsgn[r.AssigneeIdentity]||0)+1; });
  const aStatus={}; PHD_AGENTS.forEach(n=>{aStatus[n]={Assigned:0,'Work In Progress':0,Researching:0,Pending:0,Resolved:0,Closed:0};});
  data.forEach(r=>{ if(r.AssigneeIdentity&&PHD_AGENTS.includes(r.AssigneeIdentity)&&aStatus[r.AssigneeIdentity][r.Status]!==undefined){ aStatus[r.AssigneeIdentity][r.Status]++; } });
  // Per-agent ClosureCode tally for the resolver (Immediately Resolved / Automatically Closed).
  const aClosure={}; PHD_AGENTS.forEach(n=>{aClosure[n]={'Immediately Resolved':0,'Automatically Closed':0};});
  data.forEach(r=>{ const rby=r.ResolvedByIdentity; if(rby&&PHD_AGENTS.includes(rby)&&aClosure[rby]){ const cc=String(r.ClosureCode||'').trim(); if(aClosure[rby][cc]!==undefined) aClosure[rby][cc]++; } });
  const agents=PHD_AGENTS.map(n=>({name:n,assigned:aAsgn[n]||0,resolved:aRes[n]||0,open:aOpen[n]||0,avgTime:aTm[n]?gvAvg(aTm[n]):0,group:getGroup(n),statuses:aStatus[n],closure:aClosure[n]}));
  // Group tallies
  let a1R=0,a2R=0,bR=0,a1O=0,a2O=0,bO=0;
  data.forEach(r=>{ if(r.Status==='Resolved'){const g=getGroup(r.ResolvedByIdentity); if(g==='A1')a1R++;else if(g==='A2')a2R++;else if(g==='B')bR++;} if(r.Status!=='Resolved'){const g=getGroup(r.AssigneeIdentity); if(g==='A1')a1O++;else if(g==='A2')a2O++;else if(g==='B')bO++;} });
  const a1T=[],a2T=[],bT=[];
  data.forEach(r=>{ if(r.Status==='Resolved'&&r.ResolvedByIdentity&&r.CreateDate&&r.ResolvedDate){const g=getGroup(r.ResolvedByIdentity);const h=(new Date(r.ResolvedDate)-new Date(r.CreateDate))/36e5; if(h>=0){ if(g==='A1')a1T.push(h);else if(g==='A2')a2T.push(h);else if(g==='B')bT.push(h);}} });
  let a1As=0,a2As=0,bAs=0;
  data.forEach(r=>{ const g=getGroup(r.AssigneeIdentity); if(g==='A1')a1As++;else if(g==='A2')a2As++;else if(g==='B')bAs++; });
  const dL=[],dgA1=[],dgA2=[],dgB=[];
  for(let i=6;i>=0;i--){ const ds=new Date(maxDate);ds.setDate(ds.getDate()-i);ds.setHours(0,0,0,0);const de=new Date(ds);de.setDate(de.getDate()+1); dL.push(ds.toLocaleDateString('en-US',{month:'short',day:'numeric'})); let x=0,y=0,z=0; data.forEach(r=>{ if(r.ResolvedDate){const rd=new Date(r.ResolvedDate); if(rd>=ds&&rd<de){const g=getGroup(r.ResolvedByIdentity); if(g==='A1')x++;else if(g==='A2')y++;else if(g==='B')z++;}} }); dgA1.push(x);dgA2.push(y);dgB.push(z); }
  return { agents, a1R,a2R,bR,a1O,a2O,bO, a1Avg:gvAvg(a1T),a2Avg:gvAvg(a2T),bAvg:gvAvg(bT), a1As,a2As,bAs, dL,dgA1,dgA2,dgB };
}

// ---- Consolidated Group Analytics: filter state + data loading ----
// GA_FILTER holds the current selection. GA_CACHE caches each fetched url's response.

const GA_FILTER={ period:'ytd', quarter:null, month:null, week:0, groups:['A1','A2','B'] };

// How many 2026 months exist up to today (1..12).
function GA_monthsCount(){ var n=GA_now(); return (n.getFullYear()>2026)?12:(n.getFullYear()<2026?0:(n.getMonth()+1)); }
function GA_quartersCount(){ var n=GA_now(); if(n.getFullYear()<2026)return 0; if(n.getFullYear()>2026)return 4; return Math.floor(n.getMonth()/3)+1; }
function GA_AC_QUARTERS(){ var out=[]; for(var q=1;q<=GA_quartersCount();q++) out.push({idx:q}); return out; }
function GA_AC_MONTHS(){ var out=[]; for(var m=0;m<GA_monthsCount();m++) out.push({idx:m,label:GA_MONTH_NAMES[m]+' 2026'}); return out; }
// Sun..Sat weeks of 2026 up to today (newest last). label like "W40 · 27 Sep – 3 Oct".
function GA_AC_WEEKS(){
  var out=[]; var now=GA_now(); var end=(now.getFullYear()>2026)?new Date(2027,0,1):now;
  var d=new Date(2026,0,1); d.setDate(d.getDate()-d.getDay());   // the Sunday on/just before 1 Jan 2026
  var wn=1;
  while(d<end){
    var wEndExcl=new Date(d); wEndExcl.setDate(wEndExcl.getDate()+7);
    var wEndIncl=new Date(wEndExcl.getTime()-86400000);
    if(wEndExcl>new Date(2026,0,1)){   // only weeks that touch 2026
      out.push({ idx:out.length, from:Math.max(d.getTime(), new Date(2026,0,1).getTime()), to:wEndExcl.getTime(),
        label:'W'+wn+' · '+d.getDate()+' '+GA_MON_SHORT[d.getMonth()]+' – '+wEndIncl.getDate()+' '+GA_MON_SHORT[wEndIncl.getMonth()] });
      wn++;
    }
    d=wEndExcl;
  }
  return out;
}
// Resolve the YTD Performance tables' source from the TOP Performance Overview picker (PERF window),
// so the tables track the same period as the podium/KPIs/chart. 'era' (YTD) uses the overall
// endpoint (complete database); every other period maps to a /api/group-range {from,to} window.
// The window bounds come from perfWindow() (ISO 'YYYY-MM-DD'); group-range takes ms timestamps.
function gaResolveSource(){
  var win=perfWindow();
  // EVERY period (including YTD/era) resolves to the SAME windowed range endpoint keyed off
  // perfWindow(), so the tables track the EXACT same {from,to} window as the podium/KPIs/chart.
  // (Previously YTD fell back to /api/group-overall = complete database, which made the table's
  // SUCCESS count diverge from the podium's window-scoped count.)
  // ISO date -> ms at UTC midnight. Must match the server, which reads the same 'YYYY-MM-DD' bounds
  // as UTC for the podium/KPIs/chart. (Local midnight shifted the table by the viewer's UTC offset,
  // e.g. IST pulled in 5.5h of the previous period, so its counts drifted from the podium.)
  var toMsExcl=function(iso){
    var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||'')); return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null;
  };
  var fromMs=toMsExcl(win.from);
  var toMs=win.to?toMsExcl(win.to):Date.now();
  var parts=[]; if(fromMs!=null)parts.push('from='+fromMs); if(toMs!=null)parts.push('to='+toMs);
  return { url:'/api/group-range?'+parts.join('&'), label:(win.label||'')+'.' };
}

  GA_FILTER.period=p;

  else if(p==='month') GA_FILTER.month=GA_monthsCount()-1;
  else if(p==='week') GA_FILTER.week=GA_AC_WEEKS().length-1;

  document.querySelectorAll('#perfCard .ga-pchip').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-period')===p); });

// Sum a list of scope datasets (for multi-month) into one {agents, groups} shape.
function gaSumData(list){
  if(list.length===1) return list[0];
  const codes=IAP_CC_ORDER, byName={}, gClo={A1:{},A2:{},B:{}}, gAsg={A1:0,A2:0,B:0}, gSlaE={A1:0,A2:0,B:0}, gSlaW={A1:0,A2:0,B:0};
  ['A1','A2','B'].forEach(function(g){ codes.forEach(function(c){ gClo[g][c]=0; }); });
  list.forEach(function(d){
    (d.agents||[]).forEach(function(a){
      var e=byName[a.name]||(byName[a.name]={name:a.name,group:a.group,assigned:0,closure:{},_rtSum:0,_rtN:0,_slaE:0,_slaW:0});
      e.assigned+=a.assigned||0;
      codes.forEach(function(c){ e.closure[c]=(e.closure[c]||0)+((a.closure&&a.closure[c])||0); });
      var tot=0; codes.forEach(function(c){ tot+=(a.closure&&a.closure[c])||0; });
      e._rtSum+=(a.avgTime||0)*tot; e._rtN+=tot;   // volume-weighted avg approximation
      if(a.sla){ e._slaE+=a.sla.eligible||0; e._slaW+=a.sla.within||0; }
    });
    var G=d.groups||{};
    ['A1','A2','B'].forEach(function(g){ codes.forEach(function(c){ gClo[g][c]+=((G.closure&&G.closure[g]&&G.closure[g][c])||0); }); if(G.assigned) gAsg[g]+=G.assigned[g]||0; });
  });
  const agents=Object.keys(byName).map(function(n){ var e=byName[n]; return {name:e.name,group:e.group,assigned:e.assigned,closure:e.closure,avgTime:e._rtN?e._rtSum/e._rtN:0,sla:{eligible:e._slaE,within:e._slaW,pct:e._slaE?Math.round((e._slaW/e._slaE)*1000)/10:null}}; });
  // group SLA from summed agents
  agents.forEach(function(a){ if(a.group){ gSlaE[a.group]+=a.sla.eligible||0; gSlaW[a.group]+=a.sla.within||0; } });
  const groups={ closure:gClo, assigned:gAsg, sla:{ A1:{pct:gSlaE.A1?Math.round((gSlaW.A1/gSlaE.A1)*1000)/10:null}, A2:{pct:gSlaE.A2?Math.round((gSlaW.A2/gSlaE.A2)*1000)/10:null}, B:{pct:gSlaE.B?Math.round((gSlaW.B/gSlaE.B)*1000)/10:null} } };
  return { agents, groups };
}
async function gaFetch(url){
  if(GA_CACHE[url]) return GA_CACHE[url];
  const r=await A.api('GET', url);
  if(r.ok&&r.data){ GA_CACHE[url]=r.data; return r.data; }
  return null;
}
// Load the current filter's dataset (scope + optional summed months), then render both tables.
async function gaLoad(){
  const seq=++GA_LOADSEQ;
  var ib=document.getElementById('gaIapBody'), gb=document.getElementById('gaGtsBody');
  if(ib) ib.innerHTML=tableSkeleton('iap'); if(gb) gb.innerHTML=tableSkeleton('gts');
  var src=gaResolveSource();
  gaSetScopeNote(src.label);
  let data;
  try{ data=await gaFetch(src.url); }catch(e){ data=null; }
  if(seq!==GA_LOADSEQ) return;   // a newer selection superseded this load
  if(!data){
    if(ib) ib.innerHTML=aaErrorHtml('the performance tables','gaLoad()');
    if(gb) gb.innerHTML='<p class="iap-hint">Retry above to load the group totals for this period.</p>'; return;
  }
  GA_DATA=data;
  gaRenderIap(); gaRenderGts();
}

// Paint a table skeleton: hardcoded header row + first column (names, alphabetical) + spinner cells.
// `kind` = 'iap' (agent rows) or 'gts' (group rows). Header uses IAP_COLS/GTS-style labels.
function tableSkeleton(kind){
  const isGts=(kind==='gts');
  const cols=isGts
    ? [{label:'Group',short:'Group',key:'name'}].concat(IAP_CC_ORDER.map(function(c){return {label:GV_CC_SHORT[c]||c,short:IAP_CC_ABBR[c]||c};})).concat([{label:'Total',short:'Total'},{label:'SLA',short:'SLA'}])
    : IAP_COLS.filter(function(c){return c.key!=='__assigned';}).map(function(c){return {label:c.label,short:c.short,succ:(c.key==='Successful')};});
  // For gts we don't have the .succ flag; add manually for the Successful column.
  const head='<tr>'+cols.map(function(c,i){ const kc=(c.succ||(isGts&&(c.label==='Successful'||c.label==='Success')))?' col-key':''; return '<th scope="col" class="'+kc.trim()+'"><span class="th-full">'+esc(c.label)+'</span><span class="th-short">'+esc(c.short||c.label)+'</span></th>'; }).join('')+'</tr>';
  const ncols=cols.length;
  // Shimmer bars in every number cell; the real names/group pills paint instantly in the first column.
  const skCell=function(i){ return '<td class="loading'+(i===1?' col-key':'')+'">'+aaSkel((22+((i*7)%18))+'px',10)+'</td>'; };
  var bodyRows;
  if(isGts){
    bodyRows=GROUP_ROWS_ALPHA.map(function(r){
      var cells='<td><span class="gv-tag '+r[1]+'">'+(GN[r[0]]||r[0])+'</span></td>';
      for(var i=1;i<ncols;i++) cells+=skCell(i);
      return '<tr>'+cells+'</tr>';
    }).join('');
  } else {
    bodyRows=AGENTS_ALPHA.map(function(n){
      var cells='<td>'+aaAgentCell(n)+'</td>';
      for(var i=1;i<ncols;i++) cells+=skCell(i);
      return '<tr>'+cells+'</tr>';
    }).join('');
  }
  return '<span class="aa-sr" role="status">Loading table\u2026</span><div class="gv-scroll" aria-hidden="true"><table class="iap-table xls"><thead>'+head+'</thead><tbody>'+bodyRows+'</tbody></table></div>';
}

// ---- Time-windowed sections (Today / Yesterday / Last 7 days / Last complete week): collapsible,
// lazy-load on first expand. Ranges are computed on the CLIENT (local day boundaries) and sent to
// /api/group-range?from=&to= (ResolvedDate-windowed, whole DB — no quarter filter), so "Today"
// respects the viewer's day and no resolves are missed across quarter edges. ----
var _GW_MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function _gwOrd(n){ var s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function _gwDay(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }     // local midnight
function _gwFmt(d){ return _gwOrd(d.getDate())+' '+_GW_MON[d.getMonth()]; }           // "14th Oct"
// Window keys -> { title, from(Date), toExcl(Date), label }. All bounds are half-open [from,toExcl).
function gwWindowRange(win){
  var now=new Date();
  var startToday=_gwDay(now);                         // 00:00 today
  var startTomorrow=new Date(startToday); startTomorrow.setDate(startTomorrow.getDate()+1);
  if(win==='today'){
    return { title:'Today', from:startToday, toExcl:startTomorrow, label:_gwFmt(startToday) };
  }
  if(win==='yesterday'){
    var y=new Date(startToday); y.setDate(y.getDate()-1);
    return { title:'Yesterday', from:y, toExcl:startToday, label:_gwFmt(y) };
  }
  if(win==='last7'){
    // Last 7 days INCLUDING today: [today-6 .. tomorrow). e.g. 14th Oct to 20th Oct.
    var f=new Date(startToday); f.setDate(f.getDate()-6);
    return { title:'Last 7 days', from:f, toExcl:startTomorrow, label:_gwFmt(f)+' to '+_gwFmt(startToday) };
  }
  // lastweek: the last COMPLETE week, Sunday..Saturday (ends before THIS week's Sunday).
  var thisSun=new Date(startToday); thisSun.setDate(thisSun.getDate()-thisSun.getDay());   // Sunday of current week
  var lastSun=new Date(thisSun); lastSun.setDate(lastSun.getDate()-7);                      // Sunday of last week
  var lastSatEnd=new Date(thisSun);                                                         // exclusive end = this Sunday 00:00
  var lastSat=new Date(thisSun); lastSat.setDate(lastSat.getDate()-1);                      // Saturday (for the label)
  return { title:'Last complete week', from:lastSun, toExcl:lastSatEnd, label:_gwFmt(lastSun)+' to '+_gwFmt(lastSat) };

function _acQuartersCount(){ const now=new Date(); if(now.getFullYear()<2026)return 0; if(now.getFullYear()>2026)return 4; return Math.floor(now.getMonth()/3)+1; }

function _weekNum(d){ const start=new Date(d.getFullYear(),0,1); const doy=Math.floor((d-start)/86400000)+1; const jan4dow=new Date(d.getFullYear(),0,4).getDay(); return Math.ceil((doy+jan4dow)/7); }

function _weeksInMonth(monthIdx){
  const first=new Date(2026,monthIdx,1);

  const out=[];
  let wStart=_sundayOf(first);
  while(wStart<nextMonth){
    const wEndExcl=new Date(wStart); wEndExcl.setDate(wEndExcl.getDate()+7);
    const wEndIncl=new Date(wEndExcl.getTime()-86400000);

      label:'W'+wn+' \u00b7 '+_rangeWords(wStart,wEndIncl), from:_ymd(wStart), to:_ymd(wEndExcl) });

function _perfEdges(win,bucket){

  if(bucket==='month'){ let d=new Date(from.getFullYear(),from.getMonth(),1); while(d<to){ const nx=new Date(d.getFullYear(),d.getMonth()+1,1); edges.push({start:new Date(d),end:nx}); d=nx; } }

  if(!d) gwShowLoader(true);
  const fetchP=(async function(){
    if(d) return d;
    // Compute THIS window's [from,to) in epoch ms (local day boundaries) and hit the ResolvedDate-
    // windowed, whole-DB range endpoint. A request fires ONLY on load / tab switch (cached per win).
    const rg=gwWindowRange(GW_FILTER.win);

  const head='<tr>'+cols.map(function(c){ const kc=(c.key==='Successful')?' col-key':''; const ac=(sort.key===c.key)?' sorted':''; return '<th class="iap-sort'+kc+ac+'"'+aaThAttrs(sort.key===c.key,sort.dir)+' title="'+esc(c.key.indexOf('__')===0?c.label:c.key)+'" onclick="gwSort(\'gts\',\''+esc(c.key)+'\')"><span class="th-full">'+esc(c.label)+'</span><span class="th-short">'+esc(c.short||c.label)+'</span><span class="th-arrow">'+(sort.key===c.key?(sort.dir==='desc'?' \u25be':' \u25b4'):'')+'</span></th>'; }).join('')+'</tr>';
  const trs=rows.length?rows.map(function(r){ const clo=cloOf(r); const s=slaOf(r); const sla=(s&&s.pct!=null)?(s.pct+'%'):'\u2014';
    return '<tr><td><span class="gv-tag '+r[1]+'">'+(GN[r[0]]||r[0])+'</span></td>'+
      IAP_CC_ORDER.map(function(c){var n=clo[c]||0;return '<td class="'+(c==='Successful'?'col-key':'')+(n===0?' zero':'')+'">'+n+'</td>';}).join('')+
      '<td class="col-total'+(iapTotal(clo)===0?' zero':'')+'"><b>'+iapTotal(clo)+'</b></td>'+
      '<td>'+(sla==='\u2014'?'<span class="zero">\u2014</span>':'<b>'+sla+'</b>')+'</td></tr>';
  }).join(''):('<tr><td colspan="'+cols.length+'" style="text-align:center;color:#5c6773;padding:22px;position:static">No groups selected.</td></tr>');
  const note=(GW_FILTER.groups.indexOf('A2')>=0)?GAMMA_NOTE:'';
  body.innerHTML='<div class="gv-scroll"'+aaScrollAttrs('Group Totals Summary table')+'><table class="iap-table xls"><thead>'+head+'</thead><tbody>'+trs+'</tbody></table></div>'+note;
}
// Group Totals Summary: same column arrangement + sortable headers (no Avg Res — not computed per group).
let GTS_M=null, GTS_BODY=null, GTS_SORT=null;
const GTS_ROWS=[['A1','a1'],['B','b'],['A2','a2']];   // Alpha, Beta, Gamma
const GTS_COLS=[{key:'name',label:'Group',short:'Group',type:'str',val:function(r){return GN[r[0]]||r[0];}},
  {key:'__assigned',label:'Assigned',short:'Asg',type:'num',val:function(r){return GTS_ASG(r);}}]
  .concat(IAP_CC_ORDER.map(function(c){return {key:c,label:GV_CC_SHORT[c]||c,short:IAP_CC_ABBR[c]||c,type:'num',val:function(r){return (GTS_CLO(r)[c])||0;}};}))
  .concat([
    {key:'__total',label:'Total',short:'Total',type:'num',val:function(r){return iapTotal(GTS_CLO(r));}},
    {key:'__sla',label:'SLA',short:'SLA',type:'num',val:function(r){var s=GTS_SLA(r);return (s&&s.pct!=null)?s.pct:-1;}}
  ]);
function GTS_CLO(r){ return (GTS_M&&GTS_M.groups&&GTS_M.groups.closure&&GTS_M.groups.closure[r[0]])||{}; }
function GTS_SLA(r){ return (GTS_M&&GTS_M.groups&&GTS_M.groups.sla&&GTS_M.groups.sla[r[0]])||null; }
function GTS_ASG(r){ return (GTS_M&&GTS_M.groups&&GTS_M.groups.assigned&&GTS_M.groups.assigned[r[0]])||0; }
function gtsSort(key){
  if(GTS_SORT&&GTS_SORT.key===key){ GTS_SORT.dir=(GTS_SORT.dir==='desc')?'asc':'desc'; }
  else { GTS_SORT={key:key, dir:(key==='name'?'asc':'desc')}; }
  gtsRenderTable();
}
window.gtsSort=gtsSort;
function gtsArrow(key){ return (GTS_SORT&&GTS_SORT.key===key)?(GTS_SORT.dir==='desc'?' \u25be':' \u25b4'):''; }
function gtsRenderTable(){
  const m=GTS_M, body=GTS_BODY; if(!m||!body)return;
  const col=GTS_COLS.find(function(c){return c.key===(GTS_SORT&&GTS_SORT.key);})||GTS_COLS[1];
  const dir=(GTS_SORT&&GTS_SORT.dir==='asc')?1:-1;
  const rows=[...GTS_ROWS].sort(function(a,b){
    let r; if(col.type==='str') r=String(col.val(a)).localeCompare(String(col.val(b)));
    else r=(col.val(a)-col.val(b));
    return (r*dir) || (GN[a[0]]||'').localeCompare(GN[b[0]]||'');
  });
  const head='<tr>'+GTS_COLS.map(function(c){
    const keyCls=(c.key==='Successful')?' col-key':'';
    const activeCls=(GTS_SORT&&GTS_SORT.key===c.key)?' sorted':'';
    return '<th class="iap-sort'+keyCls+activeCls+'" title="'+esc(c.key.indexOf('__')===0?c.label:c.key)+'" onclick="gtsSort(\''+esc(c.key)+'\')">'+
      '<span class="th-full">'+esc(c.label)+'</span><span class="th-short">'+esc(c.short||c.label)+'</span>'+
      '<span class="th-arrow">'+gtsArrow(c.key)+'</span></th>';
  }).join('')+'</tr>';
  const trs=rows.map(function(r){
    const g=r[0], tag=r[1], clo=GTS_CLO(r), s=GTS_SLA(r);
    const sla=(s&&s.pct!=null)?(s.pct+'%'):'\u2014';
    const asg=GTS_ASG(r);
    return '<tr><td><span class="gv-tag '+tag+'">'+(GN[g]||g)+'</span></td>'+
      '<td'+(asg===0?' class="zero"':'')+'>'+asg+'</td>'+
      IAP_CC_ORDER.map(function(c){var n=clo[c]||0;return '<td class="'+(c==='Successful'?'col-key':'')+(n===0?' zero':'')+'">'+n+'</td>';}).join('')+
      '<td class="col-total'+(iapTotal(clo)===0?' zero':'')+'"><b>'+iapTotal(clo)+'</b></td>'+
      '<td>'+(sla==='\u2014'?'<span class="zero">\u2014</span>':'<b>'+sla+'</b>')+'</td></tr>';
  }).join('');
  body.innerHTML='<p class="iap-hint">'+ic('bar-chart',13)+' Tip: click any column header to sort \u2014 click again to switch between lowest\u2194highest.</p>'+
    '<div class="gv-scroll"><table class="iap-table xls"><thead>'+head+'</thead><tbody>'+trs+'</tbody></table></div>'+GAMMA_NOTE;
}
function gvSortedByGroup(m){
  return [...m.agents.filter(a=>a.group==='A1').sort((a,b)=>b.resolved-a.resolved),...m.agents.filter(a=>a.group==='A2').sort((a,b)=>b.resolved-a.resolved),...m.agents.filter(a=>a.group==='B').sort((a,b)=>b.resolved-a.resolved)];
}

(async function init(){
  // Paint the layout first (initials for avatars), then load profiles/avatars and refresh member tiles.
  await load();
  await loadGroupProfiles();
  // Re-render just the team member grids now that display names + avatars are available.
  document.querySelectorAll('.ga-group').forEach(function(card){
    const team=card.getAttribute('data-team'); const g=GROUPS.find(x=>x.name===team); if(!g)return;
    const grid=card.querySelector('.ga-mem-grid');
    if(grid) grid.innerHTML=g.members.slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase())).map(memberCard).join('');
  });
  // Agent cells: swap in display names + photos now that profiles are known.
  try{ if(GW_DATA){ gwRenderIap(); aaRenderKpis(); } if(GA_DATA) gaRenderIap(); }catch(e){}
})();
// Keyboard: sortable headers respond to Enter/Space; Escape closes the bucket popup.
document.addEventListener('keydown',function(ev){
  const t=ev.target;
  if((ev.key==='Enter'||ev.key===' ')&&t&&t.matches&&t.matches('th.iap-sort')){
    ev.preventDefault();
    const tbl=t.closest('table'), idx=Array.prototype.indexOf.call(t.parentNode.children,t), host=tbl&&tbl.closest('[id]');
    t.click();
    // The table re-renders; put focus back on the same column header.
    const box=host&&document.getElementById(host.id); const nt=box&&box.querySelectorAll('thead th')[idx]; if(nt) try{ nt.focus(); }catch(e){}
    return;
  }
  if(ev.key==='Escape'){ const m=document.getElementById('bucketModal'); if(m&&m.style.display==='flex') closeBucket(); }
});
</script>
