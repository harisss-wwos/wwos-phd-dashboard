<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shimmer.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252;--yl:#fbbf24;--pu:#a78bfa;--tl:#44b9d6;--a1:#7dd3fc;--a2:#fbbf24;--b:#4ade80;--s:#000}
.spinner{width:44px;height:44px;border:4px solid var(--bd);border-top-color:var(--o);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#000;border-radius:6px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.wrap{width:95%;max-width:none;margin:0 auto;padding:32px 20px}
@media(max-width:768px){.wrap{width:95%}}
h1{color:#fff;font-size:1.6em;margin-bottom:6px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:24px}
.section{margin-bottom:30px}
.section h2{color:var(--o);font-size:1.05em;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tbl-card{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1000px}
thead th{background:#000;color:var(--tm);font-size:.68em;text-transform:uppercase;letter-spacing:.4px;font-weight:600;text-align:center;padding:10px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
thead th.l{text-align:left}
tbody td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-size:.86em;text-align:center;white-space:nowrap}
tbody td.l{text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,153,0,.03)}
.uname{color:#fff;font-weight:600}
.role{color:var(--o);text-transform:uppercase;font-size:.68em;font-weight:700;margin-left:6px;background:rgba(255,153,0,.14);padding:1px 7px;border-radius:20px}
.big{font-weight:700;color:#fff}
.colors{display:inline-flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dot{display:inline-flex;align-items:center;gap:3px;font-size:.8em;font-weight:600}
.dot i{width:9px;height:9px;border-radius:2px;display:inline-block}
.d-green i{background:#4ade80}.d-yellow i{background:#fbbf24}.d-red i{background:#ff5252}.d-black i{background:#888}.d-purple i{background:#a78bfa}
.gate{text-align:center;padding:50px 0}.gate p{color:var(--tm);margin-bottom:18px}
.btn.mini{padding:5px 12px;font-size:.78em}
/* Bucket popup */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;max-width:820px;width:100%;max-height:88vh;overflow:auto;padding:24px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:12px}
.modal-head h2{color:var(--o);font-size:1.1em;font-weight:700;text-transform:none;letter-spacing:0}
.modal-close{background:transparent;border:none;color:var(--tm);font-size:1.6em;line-height:1;cursor:pointer;padding:0 4px}
.modal-close:hover{color:#fff}
.bk-sub{color:var(--tm);font-size:.85em;margin-bottom:16px}
.bk-tk{background:#000;border:1px solid var(--bd);border-left:3px solid var(--o);border-radius:10px;padding:14px 16px;margin-bottom:14px;text-align:left}
.bk-tk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.bk-id{color:#44b9d6;font-weight:700;text-decoration:none}.bk-id:hover{text-decoration:underline}
.bk-title{color:var(--t);font-size:.9em;margin-bottom:10px;line-height:1.5}
.bk-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.82em;color:var(--tm);margin-bottom:10px}
.bk-meta b{color:#fff;font-weight:600}
.bk-rem{font-weight:700}.bk-rem.ok{color:var(--gl)}.bk-rem.warn{color:var(--yl)}.bk-rem.over{color:var(--rl)}
.bk-cmts{border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.bk-cmts-t{color:var(--tm);font-size:.72em;text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:8px}
.bk-cmt{background:#0a0a0a;border:1px solid var(--bd);border-radius:8px;padding:8px 11px;margin-bottom:7px}
.bk-cmt-meta{display:flex;justify-content:space-between;gap:10px;font-size:.72em;color:#5f6b6c;margin-bottom:3px}
.bk-cmt-meta b{color:#d5dbdb}
.bk-cmt-text{color:var(--t);font-size:.85em;white-space:pre-wrap;line-height:1.5}
.bk-nocmt{color:#5f6b6c;font-size:.82em;font-style:italic}
.bk-empty{text-align:center;color:var(--tm);padding:30px;border:1px dashed var(--bd);border-radius:10px}
/* ---- Teams (Alpha/Beta/Gamma) group cards with large avatars ---- */
.ga-page-head{margin-bottom:22px}
.ga-page-head h1{margin-bottom:4px}
.ga-page-sub{color:var(--tm);font-size:.9em}
.ga-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.ga-group{position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 13%,#0a0a0a),#0a0a0a 62%);border:1px solid var(--bd);border-radius:16px;padding:20px 18px 22px;overflow:hidden}
.ga-group::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gc)}
.ga-group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ga-group-name{display:flex;align-items:center;gap:9px;font-size:1.2em;font-weight:800;letter-spacing:.4px;color:#fff}
.ga-dot{width:11px;height:11px;border-radius:50%;background:var(--gc);box-shadow:0 0 0 4px color-mix(in srgb,var(--gc) 25%,transparent)}
.ga-group-count{color:var(--gc);background:color-mix(in srgb,var(--gc) 15%,transparent);border:1px solid color-mix(in srgb,var(--gc) 35%,transparent);font-size:.74em;font-weight:700;border-radius:20px;padding:3px 11px}
/* Team KPI strip (Resolved / Open totals). */
.ga-team-kpis{display:flex;gap:10px;margin-bottom:16px}
.ga-kpi{flex:1;background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;text-align:center}
.ga-kpi-v{display:block;font-size:1.5em;font-weight:800;color:var(--gc);line-height:1}
.ga-kpi-l{color:var(--tm);font-size:.68em;text-transform:uppercase;letter-spacing:.4px;margin-top:4px;display:block}
.ga-mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ga-mem{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:14px 8px 12px;border:1px solid var(--bd);border-radius:12px;text-decoration:none;background:rgba(0,0,0,.25);transition:transform .14s,background .14s,border-color .14s}
.ga-mem:hover{transform:translateY(-3px);background:rgba(255,255,255,.04);border-color:color-mix(in srgb,var(--gc) 55%,var(--bd))}
.ga-mem-av{width:60px;height:60px;display:inline-flex;border-radius:50%;box-shadow:0 0 0 2px color-mix(in srgb,var(--gc) 55%,transparent),0 4px 12px rgba(0,0,0,.4);transition:box-shadow .14s}
.ga-mem:hover .ga-mem-av{box-shadow:0 0 0 3px var(--gc),0 6px 16px rgba(0,0,0,.5)}
.ga-mem-av .phd-avatar,.ga-mem-av img,.ga-mem-av .avatar-initial{width:60px!important;height:60px!important;font-size:24px!important}
.ga-mem-name{color:#fff;font-size:.86em;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.ga-mem:hover .ga-mem-name{color:var(--gc)}
.ga-mem-id{color:var(--tm);font-size:.72em}
.ga-mem-stats{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.ga-chip{font-size:.66em;color:var(--tm);background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:20px;padding:2px 8px;display:inline-flex;gap:4px;align-items:center}
.ga-chip b{color:#fff;font-weight:800}
.ga-chip-r b{color:#4ade80}
.ga-chip-o b{color:var(--o)}
@media(max-width:600px){
  .ga-mem-grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
  .ga-mem-av{width:54px;height:54px}
  .ga-mem-av .phd-avatar,.ga-mem-av img,.ga-mem-av .avatar-initial{width:54px!important;height:54px!important;font-size:22px!important}
}
/* Stat tiles (shared look with the agent profile) — used by the 1st Pet incidents totals. */
.ac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ac-tile{background:#000;border:1px solid var(--bd);border-top:3px solid var(--o);border-radius:8px;padding:16px 12px;text-align:center}
.ac-num{font-size:1.9em;font-weight:800;color:#fff;line-height:1}
.ac-lbl{color:var(--tm);font-size:.8em;margin-top:6px}
/* ---- Ported Groups view (KPIs, charts, tables) ---- */
.gv-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.gv-kpi{background:var(--s);border-radius:8px;padding:20px;text-align:center;border:1px solid var(--bd);border-top:3px solid var(--o)}
.gv-kpi .value{font-size:2em;font-weight:700;color:#fff;margin-bottom:4px}
.gv-kpi .label{font-size:.78em;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.gv-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:20px;margin-bottom:24px}
.gv-chart{background:var(--s);border-radius:8px;padding:20px;border:1px solid var(--bd)}
.gv-chart h3{color:#fff;margin-bottom:16px;text-align:center;font-size:.95em;font-weight:600}
.gv-wrap{position:relative;height:300px}
.gv-sec{background:var(--s);border-radius:8px;padding:24px;margin-bottom:24px;border:1px solid var(--bd)}
.gv-sec h2{color:#fff;margin-bottom:18px;font-size:1.2em;font-weight:600;display:flex;align-items:center;gap:8px}
.gv-sec h2::before{content:'';display:inline-block;width:4px;height:20px;background:var(--o);border-radius:2px}
.gv-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gv-scroll table{min-width:760px}
.gv-sec table{width:100%;border-collapse:collapse;margin-top:12px}
.gv-sec th,.gv-sec td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--bd);font-size:.88em}
.gv-sec th{background:#0a0a0a;color:var(--tm);font-weight:600;text-transform:uppercase;font-size:.75em;letter-spacing:.5px}
.gv-sec tr:hover{background:rgba(255,153,0,.03)}
.gv-badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:.78em;font-weight:700;background:rgba(62,207,74,.2);color:#3ecf4a}
.gv-tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:.72em;font-weight:600}
.gv-tag.a1{background:rgba(125,211,252,.15);color:var(--a1)}
.gv-tag.a2{background:rgba(251,191,36,.15);color:var(--a2)}
.gv-tag.b{background:rgba(74,222,128,.15);color:var(--b)}
/* Individual Agent Performance: Excel-sheet style — gridlines on every cell, no group borders. */
.iap-hint{color:#879596;font-size:.8em;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.iap-hint svg{color:var(--o);flex-shrink:0}
/* Explanatory note shown under Gamma tables about the Assigned vs Resolved (Total) gap. */
.gamma-note{color:#9aa7a8;font-size:.8em;line-height:1.5;margin:10px 0 0;padding:10px 12px;border-left:3px solid var(--g,#4ade80);background:rgba(74,222,128,.06);border-radius:0 6px 6px 0}
.gamma-note b{color:#c9d3d4}
/* Consolidated filter bar (Group Analytics + Windows). Segmented-pill controls, no harsh borders. */
.ga-filters{display:flex;flex-wrap:wrap;gap:14px 30px;align-items:flex-start;background:linear-gradient(180deg,#111a23,#0d141b);border:1px solid #223040;border-radius:14px;padding:16px 18px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
/* Justification modifiers: spread pushes groups to left/center/right corners; center centers a single group. */
.ga-filters.ga-spread{justify-content:space-between}
.ga-filters.ga-center{justify-content:center}
.ga-fgroup{display:flex;flex-direction:column;gap:9px;min-width:0}
/* Inline variant: label + options on one line (used by Agent Queue Groups). */
.ga-fgroup.ga-inline{flex-direction:row;align-items:center;gap:12px}
.ga-fgroup.ga-inline>.ga-flabel{margin:0}
.ga-fgroup>.ga-flabel{color:#8a98a0;font-size:.68em;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
/* Segmented control: options sit in a single rounded track. */
.ga-fopts{display:inline-flex;flex-wrap:wrap;gap:4px;background:#0b1219;border:1px solid #1e2b38;border-radius:10px;padding:4px}
.ga-opt{position:relative;display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;border-radius:8px;padding:7px 13px;font-size:.85em;font-weight:500;color:#9fb0b8;transition:color .18s,background .18s,box-shadow .18s,opacity .18s;white-space:nowrap}
.ga-opt input{position:absolute;opacity:0;width:0;height:0;margin:0;pointer-events:none}
.ga-opt:hover{color:#e6edf0;background:rgba(255,255,255,.04)}
/* Selected radio = solid accent chip. Selected checkbox (group) = tinted chip with a dot. */
.ga-opt.checked{color:#fff;background:linear-gradient(180deg,#2a3a48,#20303d);box-shadow:inset 0 0 0 1px #3d566a,0 1px 4px rgba(0,0,0,.3)}
.ga-fopts.ga-radio .ga-opt.checked{background:linear-gradient(180deg,#ff9f2e,#f07d0a);color:#141414;box-shadow:0 1px 6px rgba(240,125,10,.4)}
.ga-fopts.ga-checks .ga-opt{padding-left:11px}
.ga-fopts.ga-checks .ga-opt::before{content:'';width:9px;height:9px;border-radius:3px;border:1.5px solid #4a5c6a;transition:background .18s,border-color .18s}
.ga-fopts.ga-checks .ga-opt.checked::before{background:var(--o);border-color:var(--o);box-shadow:0 0 0 2px rgba(255,153,0,.2)}
.ga-opt.disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.ga-fgroup.ga-months.disabled .ga-flabel{opacity:.35}
.ga-scope-note{color:#879596;font-size:.8em;margin:0 0 14px;display:flex;align-items:center;gap:7px}
.ga-scope-note::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--o);flex-shrink:0}
.ga-tables{display:flex;flex-direction:column;gap:26px}
.ga-tbl-title{color:#fff;font-size:1.02em;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.ga-tbl-title::before{content:'';display:inline-block;width:3px;height:16px;background:var(--o);border-radius:2px}
/* Small in-cell spinner shown while a table's numbers load (header + names paint instantly). */
.cell-spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bd);border-top-color:var(--o);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
.iap-table.xls td.loading{color:#4a5560}
.gv-scroll .iap-table{min-width:1000px}
.iap-table.xls{border-collapse:collapse;border:1px solid #2f3a45}
.iap-table.xls th,.iap-table.xls td{white-space:nowrap;border:1px solid #2f3a45;padding:8px 12px}
.iap-table.xls thead th{background:#111820}
.iap-table.xls tbody tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.iap-table.xls tbody tr:hover td{background:rgba(255,153,0,.06)}
/* "Successful" is the key column — subtle highlight so it stands out. */
.iap-table.xls .col-key{background:rgba(74,222,128,.1)!important;font-weight:700;color:#eafff0}
.iap-table.xls thead th.col-key{background:rgba(74,222,128,.16)!important;color:#4ade80}
/* Sortable headers */
.iap-table.xls th.iap-sort{cursor:pointer;user-select:none}
.iap-table.xls th.iap-sort:hover{background:#18222c}
.iap-table.xls th.iap-sort.sorted{color:var(--o)}
.iap-table.xls th.iap-sort.col-key.sorted{color:#4ade80}
/* Zero values are greyed out so non-zero numbers stand out. */
.iap-table.xls td.zero{color:#4a5560}
.iap-table.xls td.zero .zero,.iap-table.xls .zero{color:#4a5560}
.iap-table.xls td.col-key.zero{color:#4a5560;font-weight:400}
/* Total column — subtle highlight. */
.iap-table.xls .col-total{background:rgba(68,185,214,.1)!important;color:#cfeffb}
.iap-table.xls td.col-total.zero{color:#4a5560}
/* Header labels: full by default, short/abbreviated forms on narrow screens. Truncate if still tight. */
.iap-table.xls th .th-full{display:inline-block;overflow:hidden;text-overflow:ellipsis;max-width:130px;vertical-align:middle}
.iap-table.xls th .th-short{display:none;overflow:hidden;text-overflow:ellipsis;max-width:90px;vertical-align:middle}
.iap-table.xls th .th-arrow{white-space:nowrap}
@media(max-width:900px){
  .iap-table.xls th .th-full{display:none}
  .iap-table.xls th .th-short{display:inline-block}
  .iap-table.xls th,.iap-table.xls td{padding:6px 8px;font-size:.82em}
}
.gv-legend{display:flex;gap:24px;flex-wrap:wrap;background:var(--s);border:1px solid var(--bd);border-radius:8px;padding:16px 20px;margin-bottom:24px;font-size:.9em}
.gv-legend span{display:flex;align-items:center;gap:8px}
.gv-legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
@media(max-width:1024px){.gv-charts{grid-template-columns:1fr}}
@media(max-width:768px){.gv-kpi-grid{grid-template-columns:repeat(2,1fr)}.gv-wrap{height:260px}}
@media(max-width:480px){.gv-kpi-grid{grid-template-columns:1fr}}
.gv-wrap.tall{height:400px}
/* Collapsible Group Analytics sections (collapsed by default; fetch on first expand). */
.gv-list{display:flex;flex-direction:column;gap:14px}
.gv-card{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#0a0a0a;display:grid;grid-template-rows:auto 0fr;transition:grid-template-rows .3s ease}
.gv-card.open{grid-template-rows:auto 1fr}
.gv-card-head{display:flex;align-items:center;gap:12px;width:100%;padding:16px 20px;background:transparent;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.gv-card-head:hover{background:rgba(255,255,255,.04)}
.gv-card-title{color:#fff;font-weight:700;font-size:1em}
.gv-caret{margin-left:auto;color:var(--tm);transition:transform .3s ease;flex-shrink:0}
.gv-card.open .gv-caret{transform:rotate(180deg)}
.gv-card-body{overflow:hidden;min-height:0}
.gv-card-body>div{padding:0 20px 20px}
/* Inside a collapsible card the charts/tables shouldn't add their own card chrome or bottom gap. */
.gv-card-body .gv-chart,.gv-card-body .gv-sec{border:none;background:transparent;padding:0;margin:0}
.gv-card-body .gv-charts{margin-bottom:0}
/* Nested collapsible hierarchy (By Quarters -> quarter -> Complete/months; window cards). */
.gv-nested{margin-top:2px}
.gv-mid>.gv-card-head .gv-card-title{color:#e5eaea}
.gv-leaf{background:#0c1218}
.gv-leaf>.gv-card-head .gv-card-title{font-weight:600;font-size:.94em;color:#cfd6d6}
.gv-sub-range{color:var(--tm);font-weight:400;font-size:.82em;margin-left:6px}
/* Two always-open blocks (Individual Agent Performance + Group Totals Summary) inside a scope card. */
.gv-blocks{display:flex;flex-direction:column;gap:22px}
.gv-block-title{color:#cfd6d6;font-size:.82em;text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.gv-block-title::before{content:'';width:3px;height:.95em;background:var(--o);border-radius:2px;flex-shrink:0}
/* ---- Page layout: title + evenly spaced, clearly labelled sections ---- */
.an-head{margin-bottom:28px}
.an-head h1{font-size:1.7em;margin-bottom:6px}
.an-sub{color:var(--tm);font-size:.92em}
.an-sec{margin:0 0 34px}
.an-sec:last-child{margin-bottom:0}

<script>
const A=window.PHDAuth;
const isAdminPlus=()=>A.atLeast&&A.atLeast('admin');
const ic=(n,s)=>window.icon?window.icon(n,s||14):'';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gate(msg){document.getElementById('wrap').innerHTML='<div class="gate"><h1>Analytics</h1><p>'+msg+'</p><a class="btn" href="app.html">Go to Live Dashboard</a></div>';}
let MY_TZ='IST';const TZ_ZONE={IST:'Asia/Kolkata',MST:'America/Denver'};
function fmtTZ(iso){if(!iso)return '—';try{return new Date(iso).toLocaleString('en-US',{timeZone:TZ_ZONE[MY_TZ]||TZ_ZONE.IST,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true})+' '+MY_TZ;}catch(e){return iso;}}

function colorsCell(c){
  return '<div class="colors">'
    +'<span class="dot d-green"><i></i>'+c.green+'</span>'
    +'<span class="dot d-yellow"><i></i>'+c.yellow+'</span>'
    +'<span class="dot d-red"><i></i>'+c.red+'</span>'
    +'<span class="dot d-black"><i></i>'+c.black+'</span>'
    +'<span class="dot d-purple"><i></i>'+c.purple+'</span>'
  +'</div>';
}

function tableFor(rows,isEditor){
  const head=`<thead><tr>
    <th class="l">Agent</th>
    <th>Resolved (quarter)</th>
    <th>Working on (open)</th>
    <th>Successful</th>
    <th>Immediate / Auto</th>
    <th>Resolved 12h</th>
    <th>Resolved 24h</th>
    <th>Open by color (G Y R B P)</th>
    ${isEditor?'<th>Tickets w/ comment</th>':''}
    ${isEditor&&isAdminPlus()?'<th></th>':''}
  </tr></thead>`;
  const body=rows.map(r=>`<tr>
    <td class="l"><span class="uname">${esc(r.username)}</span></td>
    <td class="big">${r.resolvedInQuarter}</td>
    <td>${r.open}</td>
    <td>${r.resolvedSuccessful}</td>
    <td>${r.immediateAuto}</td>
    <td>${r.resolved12}</td>
    <td>${r.resolved24}</td>
    <td>${colorsCell(r.colors)}</td>
    ${isEditor?('<td class="big">'+r.touched+'</td>'):''}
    ${isEditor&&isAdminPlus()?('<td><button class="btn sec mini" onclick="openBucket(\''+esc(r.username)+'\')">Check bucket</button></td>'):''}
  </tr>`).join('');
  return `<div class="tbl-card"><table>${head}<tbody>${body}</tbody></table></div>`;
}

// Time remaining vs the 240h SLA from creation (for open tickets).
function slaRem(deadlineIso){
  if(!deadlineIso)return {cls:'',txt:'—'};
  const ms=new Date(deadlineIso)-new Date();
  const over=ms<=0;const abs=Math.abs(ms);
  const d=Math.floor(abs/86400000),h=Math.floor((abs%86400000)/3600000);
  const span=(d>0?d+'d ':'')+h+'h';
  if(over)return {cls:'over',txt:'Overdue by '+span};
  return {cls:(ms<=48*3600000?'warn':'ok'),txt:span+' left'};
}
function ageText(ageHours){
  if(ageHours==null)return '—';
  const d=Math.floor(ageHours/24),h=Math.floor(ageHours%24);
  return (d>0?d+'d ':'')+h+'h';
}

async function openBucket(username){
  document.getElementById('bucketTitle').textContent="Bucket · "+username;
  document.getElementById('bucketSub').textContent='Open (live) tickets assigned to '+username+'. Times in '+MY_TZ+'.';
  document.getElementById('bucketBody').innerHTML='<div style="display:flex;justify-content:center;padding:30px"><div class="spinner"></div></div>';
  document.getElementById('bucketModal').style.display='flex';
  const r=await A.api('GET','/api/agent-bucket?username='+encodeURIComponent(username));
  const body=document.getElementById('bucketBody');
  if(!r.ok){body.innerHTML='<p style="color:var(--rl)">Could not load bucket (HTTP '+r.status+').</p>';return;}
  const tix=(r.data&&r.data.tickets)||[];
  if(!tix.length){body.innerHTML='<div class="bk-empty">No open tickets assigned to '+esc(username)+' right now. 🎉</div>';return;}
  body.innerHTML=tix.map(t=>{
    const rem=slaRem(t.deadline);
    const cmts=(t.comments||[]);
    const cmtHtml=cmts.length
      ? cmts.map(c=>'<div class="bk-cmt"><div class="bk-cmt-meta"><span>by <b>'+esc(c.user)+'</b></span><span>'+fmtTZ(c.at)+'</span></div><div class="bk-cmt-text">'+esc(c.text)+'</div></div>').join('')
      : '<div class="bk-nocmt">No comments on this ticket yet.</div>';
    return '<div class="bk-tk">'+
      '<div class="bk-tk-head"><a class="bk-id" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.shortId)+'</a>'+
        '<span class="bk-rem '+rem.cls+'">'+rem.txt+'</span></div>'+
      (t.title?('<div class="bk-title">'+esc(t.title)+'</div>'):'')+
      '<div class="bk-meta"><span>Created: <b>'+fmtTZ(t.createDate)+'</b></span><span>Age: <b>'+ageText(t.ageHours)+'</b></span><span>Status: <b>'+esc(t.status||'')+'</b></span></div>'+
      '<div class="bk-cmts"><div class="bk-cmts-t">Comments ('+cmts.length+')</div>'+cmtHtml+'</div>'+
    '</div>';
  }).join('');
}
function closeBucket(){document.getElementById('bucketModal').style.display='none';}

async function load(){
  if(!A.getUser()||!A.getToken()){gate('This page is for logged-in users. Log in from the Live Dashboard first.');return;}
  // Paint the full layout IMMEDIATELY (hardcoded labels + shimmer for the data bits) — no full-page spinner.
  render();
  try{MY_TZ=await A.myTimezone();}catch(e){}
  try{
    const version=await A.liveVersion();
    const res=await A.swrLoad({
      key:'agent-analytics',
      version:version,
      fetch:()=>A.api('GET','/api/agent-analytics'),
      onData:(d)=>applyStats(d)
    });
    if(!res.painted && res.status===403){ /* still shows the static team layout */ }
  }catch(e){}
}
// login -> per-agent stats from /api/agent-analytics.
let AGENT_STATS={};
function applyStats(d){
  AGENT_STATS={};
  [].concat(d&&d.leads||[], d&&d.editors||[]).forEach(function(s){ AGENT_STATS[(s.username||'').toLowerCase()]=s; });
  fillTeamStats();
}
// ---- Group membership (Alpha / Beta / Gamma). Login IDs; display names/avatars fetched below. ----
const GROUPS=[
  {name:'BLR',color:'#7dd3fc',members:['harisss','punithsd','arunkzn','flofalgu']},
  {name:'AZA', color:'#4ade80',members:['mbozied','nobregak','mellanej']},
  {name:'WFH',color:'#fbbf24',members:['tanviroo','urmahala','obalasut','shaavhad','chousoud','dbiswamb']},
];
let GROUP_PROFILES={}; // lowercased login -> { username, displayName, avatar }

// Fetch display names (/api/user-roles) + avatars (/api/user-avatars) once, then render groups.
async function loadGroupProfiles(){
  try{
    const r=await A.api('GET','/api/user-roles');
    if(r.ok&&Array.isArray(r.data)) r.data.forEach(u=>{GROUP_PROFILES[(u.username||'').toLowerCase()]={username:u.username,displayName:u.displayName||''};});
  }catch(e){}
  try{
    const r=await A.api('GET','/api/user-avatars');
    if(r.ok&&r.data&&typeof r.data==='object') Object.keys(r.data).forEach(un=>{const k=un.toLowerCase();if(!GROUP_PROFILES[k])GROUP_PROFILES[k]={username:un};GROUP_PROFILES[k].avatar=r.data[un];});
  }catch(e){}
}

function memberCard(login){
  const key=String(login).toLowerCase();
  const p=GROUP_PROFILES[key]||{username:login};
  const avatar=(A.avatarHtml)?A.avatarHtml(Object.assign({username:login},p),60):'';
  const dn=p.displayName||login;
  // Agent profile page is retired — render the member card as a non-navigating span.
  return '<span class="ga-mem" title="'+esc(dn)+'">'+
    '<span class="ga-mem-av">'+avatar+'</span>'+
    '<span class="ga-mem-name">'+esc(dn)+'</span>'+
    '<span class="ga-mem-id">@'+esc(login)+'</span>'+
  '</span>';
}
function groupsSectionHtml(){
  return '<div class="ga-groups">'+GROUPS.map(g=>
      '<div class="ga-group" data-team="'+esc(g.name)+'" style="--gc:'+g.color+'">'+
        '<div class="ga-group-head">'+
          '<span class="ga-group-name"><span class="ga-dot"></span>'+esc(g.name)+'</span>'+
          '<span class="ga-group-count">'+g.members.length+' member'+(g.members.length===1?'':'s')+'</span>'+
        '</div>'+
        '<div class="ga-team-kpis">'+
          '<div class="ga-kpi"><span class="ga-kpi-v tally-ph" data-team-stat="resolved" data-team="'+esc(g.name)+'">\u2014</span><span class="ga-kpi-l">Resolved this quarter</span></div>'+
          '<div class="ga-kpi"><span class="ga-kpi-v tally-ph" data-team-stat="open" data-team="'+esc(g.name)+'">\u2014</span><span class="ga-kpi-l">Open now</span></div>'+
        '</div>'+
        '<div class="ga-mem-grid">'+g.members.slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase())).map(memberCard).join('')+'</div>'+
      '</div>').join('')+
    '</div>';
}
// Fill per-member + per-team resolved/open numbers (tally) once AGENT_STATS is loaded.
function fillTeamStats(){
  // Per-team totals (sum of members).
  GROUPS.forEach(function(g){
    let r=0,o=0;
    g.members.forEach(function(m){ const s=AGENT_STATS[m.toLowerCase()]; if(s){ r+=s.resolvedInQuarter||0; o+=s.open||0; } });
    const rv=document.querySelector('.ga-kpi-v[data-team-stat="resolved"][data-team="'+g.name+'"]');
    const ov=document.querySelector('.ga-kpi-v[data-team-stat="open"][data-team="'+g.name+'"]');
    if(rv) A.tally(rv, r);
    if(ov) A.tally(ov, o);
  });
}

// Quarter-wide "1st Pet incident" totals: PHD-handled vs AUTO-SIM (tally-animated).
function petTotalsSectionHtml(){

// ============================================================================
// Ported "Groups" view (charts + tables), same output as app.html?view=groups.
// Loads the full live-quarter tickets via /api/live-quarter, computes metrics locally,
// and renders KPIs + 6 charts + the two tables into #groupsView.
// ============================================================================
const PHD_AGENTS=['harisss','shaavhad','flofalgu','punithsd','dbiswamb','arunkzn','tanviroo','obalasut','mellanej','chousoud','mbozied','urmahala','nobregak'];
const GA1=['harisss','punithsd','arunkzn','flofalgu'];
const GA2=['tanviroo','urmahala','chousoud','obalasut','shaavhad','dbiswamb'];
const GB=['mbozied','nobregak','mellanej'];
function getGroup(n){ if(GA1.includes(n))return 'A1'; if(GA2.includes(n))return 'A2'; if(GB.includes(n))return 'B'; return null; }
function gvAvg(a){ return a.length?a.reduce((s,v)=>s+v,0)/a.length:0; }
const GV_CHARTS=[];
function gvMakeChart(id,config){ const ctx=document.getElementById(id); if(ctx){ GV_CHARTS.push(new Chart(ctx,config)); } }
function gvDestroyCharts(){ GV_CHARTS.forEach(c=>{try{c.destroy();}catch(e){}}); GV_CHARTS.length=0; }

// Compute just the group/agent metrics renderGroupsView needs (subset of app.js computeMetrics).
function gvComputeMetrics(data){
  const allDates=data.map(r=>new Date(r.CreateDate)).filter(d=>!isNaN(d));
  const maxDate=allDates.length?new Date(Math.max(...allDates)):new Date();
  // Per-agent maps
  const aRes={},aTm={},aOpen={},aAsgn={};
  data.forEach(r=>{ if((r.Status==='Resolved'||r.Status==='Closed')&&r.ResolvedByIdentity&&!r.ResolvedByIdentity.includes('AutoSIM')){ const x=r.ResolvedByIdentity; aRes[x]=(aRes[x]||0)+1; if(r.CreateDate&&r.ResolvedDate){const h=(new Date(r.ResolvedDate)-new Date(r.CreateDate))/36e5; if(h>=0){(aTm[x]=aTm[x]||[]).push(h);}} } });
  data.filter(r=>r.Status!=='Resolved'&&r.Status!=='Closed').forEach(r=>{ if(r.AssigneeIdentity&&PHD_AGENTS.includes(r.AssigneeIdentity))aOpen[r.AssigneeIdentity]=(aOpen[r.AssigneeIdentity]||0)+1; });
  data.forEach(r=>{ if(r.AssigneeIdentity&&PHD_AGENTS.includes(r.AssigneeIdentity))aAsgn[r.AssigneeIdentity]=(aAsgn[r.AssigneeIdentity]||0)+1; });
  const aStatus={}; PHD_AGENTS.forEach(n=>{aStatus[n]={Assigned:0,'Work In Progress':0,Researching:0,Pending:0,Resolved:0,Closed:0};});
  data.forEach(r=>{ if(r.AssigneeIdentity&&PHD_AGENTS.includes(r.AssigneeIdentity)&&aStatus[r.AssigneeIdentity][r.Status]!==undefined){ aStatus[r.AssigneeIdentity][r.Status]++; } });
  // Per-agent ClosureCode tally for the resolver (Immediately Resolved / Automatically Closed).
  const aClosure={}; PHD_AGENTS.forEach(n=>{aClosure[n]={'Immediately Resolved':0,'Automatically Closed':0};});
  data.forEach(r=>{ const rby=r.ResolvedByIdentity; if(rby&&PHD_AGENTS.includes(rby)&&aClosure[rby]){ const cc=String(r.ClosureCode||'').trim(); if(aClosure[rby][cc]!==undefined) aClosure[rby][cc]++; } });
  const agents=PHD_AGENTS.map(n=>({name:n,assigned:aAsgn[n]||0,resolved:aRes[n]||0,open:aOpen[n]||0,avgTime:aTm[n]?gvAvg(aTm[n]):0,group:getGroup(n),statuses:aStatus[n],closure:aClosure[n]}));
  // Group tallies
  let a1R=0,a2R=0,bR=0,a1O=0,a2O=0,bO=0;
  data.forEach(r=>{ if(r.Status==='Resolved'){const g=getGroup(r.ResolvedByIdentity); if(g==='A1')a1R++;else if(g==='A2')a2R++;else if(g==='B')bR++;} if(r.Status!=='Resolved'){const g=getGroup(r.AssigneeIdentity); if(g==='A1')a1O++;else if(g==='A2')a2O++;else if(g==='B')bO++;} });
  const a1T=[],a2T=[],bT=[];
  data.forEach(r=>{ if(r.Status==='Resolved'&&r.ResolvedByIdentity&&r.CreateDate&&r.ResolvedDate){const g=getGroup(r.ResolvedByIdentity);const h=(new Date(r.ResolvedDate)-new Date(r.CreateDate))/36e5; if(h>=0){ if(g==='A1')a1T.push(h);else if(g==='A2')a2T.push(h);else if(g==='B')bT.push(h);}} });
  let a1As=0,a2As=0,bAs=0;
  data.forEach(r=>{ const g=getGroup(r.AssigneeIdentity); if(g==='A1')a1As++;else if(g==='A2')a2As++;else if(g==='B')bAs++; });
  const dL=[],dgA1=[],dgA2=[],dgB=[];
  for(let i=6;i>=0;i--){ const ds=new Date(maxDate);ds.setDate(ds.getDate()-i);ds.setHours(0,0,0,0);const de=new Date(ds);de.setDate(de.getDate()+1); dL.push(ds.toLocaleDateString('en-US',{month:'short',day:'numeric'})); let x=0,y=0,z=0; data.forEach(r=>{ if(r.ResolvedDate){const rd=new Date(r.ResolvedDate); if(rd>=ds&&rd<de){const g=getGroup(r.ResolvedByIdentity); if(g==='A1')x++;else if(g==='A2')y++;else if(g==='B')z++;}} }); dgA1.push(x);dgA2.push(y);dgB.push(z); }
  return { agents, a1R,a2R,bR,a1O,a2O,bO, a1Avg:gvAvg(a1T),a2Avg:gvAvg(a2T),bAvg:gvAvg(bT), a1As,a2As,bAs, dL,dgA1,dgA2,dgB };
}

// Group Analytics is split into collapsible sections that each fetch ONLY when first expanded.
// They all share ONE /api/live-quarter fetch (the heavy ~8k-ticket blob) — loaded lazily on the
// first expand and cached, so nothing loads on page open and later sections reuse the same data.
const GN={A1:'BLR',A2:'WFH',B:'AZA'}, GC={A1:'#7dd3fc',A2:'#fbbf24',B:'#4ade80'}, GTC={A1:'a1',A2:'a2',B:'b'};
// Short codes for the inline tag next to an agent name: BLR / WFH / AZA.
const GN_SHORT={A1:'BLR',A2:'WFH',B:'AZA'};
function gtag(grp){ return '<span class="gv-tag '+(GTC[grp]||'')+'" style="font-size:.7em" title="'+(GN[grp]||grp||'')+'">('+(GN_SHORT[grp]||grp||'')+')</span>'; }

// ---- Group Analytics: By Quarters (Q3/Q2/Q1 -> Complete + 3 months) + Overall Performance ----
// Each leaf is a "scope" with a unique id + a data source (an /api endpoint). Both iap & gts tables
// render from one fetch. Nested collapsible cards; each leaf lazy-loads on first expand.
// Quarter months (index within the quarter -> label). Q1=Jan/Feb/Mar, Q2=Apr/May/Jun, Q3=Jul/Aug/Sep.
const GV_QUARTERS=[
  {qid:'2026-Q3', title:'Quarter Q3 (Live) — July 1st to September', months:['July','August','September']},
  {qid:'2026-Q2', title:'Quarter Q2 — April 1st to June 30th',       months:['April','May','June']},
  {qid:'2026-Q1', title:'Quarter Q1 — January 1st to March 31st',    months:['January','February','March']},
];
// Build one API url for a given quarter id + optional month index (0..2). null qid -> Overall.
function gaUrlFor(qid, mi){
  if(!qid) return '/api/group-overall';
  return '/api/group-quarter/'+qid + (mi!=null ? ('?month='+mi) : '');
}
// Consolidated Group Analytics: a single filter bar + ONE Individual Agent Performance table and
// ONE Group Totals Summary table. Filters: Scope (radio: Overall + each quarter), Months (checkbox,
// refine a quarter; multiple summed client-side), Groups (checkbox: Alpha/Beta/Gamma) applied to BOTH.
function groupsSectionsHtml(){
  var scopeOpts='<label class="ga-opt checked"><input type="radio" name="gaScope" value="overall" checked onchange="gaOnScopeChange()"> Overall (complete database)</label>'+

// Accordion: collapse every OTHER open .gv-card that is a direct sibling of `card` (same .gv-list),
// so only one section at each nesting level is open at a time.
function gvAccordion(card){
  const list=card.parentElement; if(!list)return;
  Array.prototype.forEach.call(list.children, function(sib){
    if(sib!==card && sib.classList && sib.classList.contains('gv-card') && sib.classList.contains('open')){
      sib.classList.remove('open');
      var h=sib.querySelector(':scope > .gv-card-head'); if(h) h.setAttribute('aria-expanded','false');
    }
  });
}

// Radio changed -> reset months, toggle the Months control enabled/disabled, reload.
function gaOnScopeChange(){
  var el=document.querySelector('input[name="gaScope"]:checked'); GA_FILTER.scope=el?el.value:'overall';
  GA_FILTER.months=[];
  var isQuarter=(GA_FILTER.scope!=='overall');
  var grp=document.getElementById('gaMonthsGroup'); if(grp) grp.classList.toggle('disabled', !isQuarter);
  var labels=isQuarter?GA_MONTHS_FOR(GA_FILTER.scope):['Month 1','Month 2','Month 3'];
  [0,1,2].forEach(function(mi){
    var opt=document.getElementById('gaMonthOpt'+mi), lbl=document.getElementById('gaMonthLbl'+mi), inp=opt&&opt.querySelector('input');
    if(lbl) lbl.textContent=labels[mi]||('Month '+(mi+1));
    if(inp){ inp.checked=false; inp.disabled=!isQuarter; }
    if(opt) opt.classList.toggle('disabled', !isQuarter);
    if(opt) opt.classList.remove('checked');
  });
  gaSyncOptChecked();
  gaLoad();
}
window.gaOnScopeChange=gaOnScopeChange;
function gaOnMonthChange(){
  var checked=[]; [0,1,2].forEach(function(mi){ var opt=document.getElementById('gaMonthOpt'+mi), inp=opt&&opt.querySelector('input'); if(inp&&inp.checked) checked.push(mi); if(opt) opt.classList.toggle('checked', !!(inp&&inp.checked)); });
  GA_FILTER.months=checked;
  gaLoad();
}
window.gaOnMonthChange=gaOnMonthChange;
function gaOnGroupChange(){
  var g=[]; document.querySelectorAll('input[name="gaGroup"]').forEach(function(inp){ var opt=inp.closest('.ga-opt'); if(opt) opt.classList.toggle('checked', inp.checked); if(inp.checked) g.push(inp.value); });
  GA_FILTER.groups=g;

// Keep the .checked highlight class in sync with radios.

// Sum a list of scope datasets (for multi-month) into one {agents, groups} shape.
function gaSumData(list){
  if(list.length===1) return list[0];
  const codes=IAP_CC_ORDER, byName={}, gClo={A1:{},A2:{},B:{}}, gAsg={A1:0,A2:0,B:0}, gSlaE={A1:0,A2:0,B:0}, gSlaW={A1:0,A2:0,B:0};
  ['A1','A2','B'].forEach(function(g){ codes.forEach(function(c){ gClo[g][c]=0; }); });
  list.forEach(function(d){
    (d.agents||[]).forEach(function(a){
      var e=byName[a.name]||(byName[a.name]={name:a.name,group:a.group,assigned:0,closure:{},_rtSum:0,_rtN:0,_slaE:0,_slaW:0});
      e.assigned+=a.assigned||0;
      codes.forEach(function(c){ e.closure[c]=(e.closure[c]||0)+((a.closure&&a.closure[c])||0); });
      var tot=0; codes.forEach(function(c){ tot+=(a.closure&&a.closure[c])||0; });
      e._rtSum+=(a.avgTime||0)*tot; e._rtN+=tot;   // volume-weighted avg approximation
      if(a.sla){ e._slaE+=a.sla.eligible||0; e._slaW+=a.sla.within||0; }
    });
    var G=d.groups||{};
    ['A1','A2','B'].forEach(function(g){ codes.forEach(function(c){ gClo[g][c]+=((G.closure&&G.closure[g]&&G.closure[g][c])||0); }); if(G.assigned) gAsg[g]+=G.assigned[g]||0; });
  });
  const agents=Object.keys(byName).map(function(n){ var e=byName[n]; return {name:e.name,group:e.group,assigned:e.assigned,closure:e.closure,avgTime:e._rtN?e._rtSum/e._rtN:0,sla:{eligible:e._slaE,within:e._slaW,pct:e._slaE?Math.round((e._slaW/e._slaE)*1000)/10:null}}; });
  // group SLA from summed agents
  agents.forEach(function(a){ if(a.group){ gSlaE[a.group]+=a.sla.eligible||0; gSlaW[a.group]+=a.sla.within||0; } });
  const groups={ closure:gClo, assigned:gAsg, sla:{ A1:{pct:gSlaE.A1?Math.round((gSlaW.A1/gSlaE.A1)*1000)/10:null}, A2:{pct:gSlaE.A2?Math.round((gSlaW.A2/gSlaE.A2)*1000)/10:null}, B:{pct:gSlaE.B?Math.round((gSlaW.B/gSlaE.B)*1000)/10:null} } };
  return { agents, groups };
}
async function gaFetch(url){
  if(GA_CACHE[url]) return GA_CACHE[url];
  const r=await A.api('GET', url);
  if(r.ok&&r.data){ GA_CACHE[url]=r.data; return r.data; }
  return null;
}
// Load the current filter's dataset (scope + optional summed months), then render both tables.
async function gaLoad(){
  const seq=++GA_LOADSEQ;
  var ib=document.getElementById('gaIapBody'), gb=document.getElementById('gaGtsBody');
  if(ib) ib.innerHTML=tableSkeleton('iap'); if(gb) gb.innerHTML=tableSkeleton('gts');
  gaSetScopeNote();
  let urls;
  if(GA_FILTER.scope==='overall') urls=[gaUrlFor(null,null)];
  else if(GA_FILTER.months.length) urls=GA_FILTER.months.map(function(mi){ return gaUrlFor(GA_FILTER.scope, mi); });
  else urls=[gaUrlFor(GA_FILTER.scope, null)];
  let datasets;
  try{ datasets=await Promise.all(urls.map(gaFetch)); }catch(e){ datasets=null; }
  if(seq!==GA_LOADSEQ) return;   // a newer selection superseded this load
  if(!datasets || datasets.some(function(d){return !d;})){
    if(ib) ib.innerHTML='<div class="ov-none" style="margin:0"><span class="dot"></span>Could not load this selection. Try again.</div>';
    if(gb) gb.innerHTML=''; return;
  }
  GA_DATA=gaSumData(datasets);
  gaRenderIap(); gaRenderGts();
}
function gaSetScopeNote(){
  var el=document.getElementById('gaScopeNote'); if(!el)return;
  var txt;
  if(GA_FILTER.scope==='overall') txt='Showing: Overall — all quarters combined (complete database).';
  else { var ms=GA_FILTER.months; var ml=GA_MONTHS_FOR(GA_FILTER.scope); txt='Showing: '+GA_FILTER.scope+(ms.length?(' — '+ms.map(function(mi){return ml[mi];}).join(', ')):' — complete quarter')+'.'; }
  el.textContent=txt;
}
// Alphabetical agent + group name lists (for instant skeletons before data arrives).
const AGENTS_ALPHA=[...PHD_AGENTS].sort(function(a,b){return a.localeCompare(b);});
const GROUP_ROWS_ALPHA=[['A1','a1'],['B','b'],['A2','a2']];   // Alpha, Beta, Gamma (already alphabetical by name)
// Paint a table skeleton: hardcoded header row + first column (names, alphabetical) + spinner cells.
// `kind` = 'iap' (agent rows) or 'gts' (group rows). Header uses IAP_COLS/GTS-style labels.
function tableSkeleton(kind){
  const isGts=(kind==='gts');
  const cols=isGts
    ? [{label:'Group',short:'Group',key:'name'}].concat(IAP_CC_ORDER.map(function(c){return {label:GV_CC_SHORT[c]||c,short:IAP_CC_ABBR[c]||c};})).concat([{label:'Total',short:'Total'},{label:'SLA',short:'SLA'}])
    : IAP_COLS.map(function(c){return {label:c.label,short:c.short,succ:(c.key==='Successful')};});
  // For gts we don't have the .succ flag; add manually for the Successful column.
  const head='<tr>'+cols.map(function(c,i){ const kc=(c.succ||(isGts&&c.label==='Successful'))?' col-key':''; return '<th class="iap-sort'+kc+'"><span class="th-full">'+esc(c.label)+'</span><span class="th-short">'+esc(c.short||c.label)+'</span></th>'; }).join('')+'</tr>';
  const ncols=cols.length;
  var bodyRows;
  if(isGts){
    bodyRows=GROUP_ROWS_ALPHA.map(function(r){
      var cells='<td><span class="gv-tag '+r[1]+'">'+(GN[r[0]]||r[0])+'</span></td>';
      for(var i=1;i<ncols;i++) cells+='<td class="loading"><span class="cell-spin"></span></td>';
      return '<tr>'+cells+'</tr>';
    }).join('');
  } else {
    bodyRows=AGENTS_ALPHA.map(function(n){
      var grp=(GA1.indexOf(n)>=0?'A1':(GA2.indexOf(n)>=0?'A2':(GB.indexOf(n)>=0?'B':null)));
      var cells='<td><span style="color:#44b9d6;font-weight:700">'+esc(n)+'</span> '+gtag(grp)+'</td>';
      for(var i=1;i<ncols;i++) cells+='<td class="loading"><span class="cell-spin"></span></td>';
      return '<tr>'+cells+'</tr>';
    }).join('');
  }
  return '<div class="gv-scroll"><table class="iap-table xls"><thead>'+head+'</thead><tbody>'+bodyRows+'</tbody></table></div>';
}
// ---- Consolidated Group Analytics renderers (single IAP + single GTS table) ----
// Both read GA_DATA + GA_FILTER.groups. Sort state in GA_SORT. Gamma note only when Gamma is shown.
function gaSort(which,key){
  const s=GA_SORT[which]; if(!s)return;
  if(s.key===key){ s.dir=(s.dir==='desc')?'asc':'desc'; } else { GA_SORT[which]={key:key,dir:(key==='name'?'asc':'desc')}; }
  if(which==='iap') gaRenderIap(); else gaRenderGts();
}
window.gaSort=gaSort;
function gaRenderIap(){
  const body=document.getElementById('gaIapBody'); if(!GA_DATA||!body)return;
  const cols=IAP_COLS, sort=GA_SORT.iap;
  const col=cols.find(function(c){return c.key===sort.key;})||cols[1];
  const dir=(sort.dir==='asc')?1:-1;
  const agents=(GA_DATA.agents||[]).filter(function(a){ return GA_FILTER.groups.indexOf(a.group)>=0; });
  const sorted=[...agents].sort(function(a,b){ let r=(col.type==='str')?String(col.val(a)).localeCompare(String(col.val(b))):(col.val(a)-col.val(b)); return (r*dir)||a.name.localeCompare(b.name); });
  const head='<tr>'+cols.map(function(c){ const kc=(c.key==='Successful')?' col-key':''; const ac=(sort.key===c.key)?' sorted':''; return '<th class="iap-sort'+kc+ac+'" title="'+esc(c.key.indexOf('__')===0?c.label:c.key)+'" onclick="gaSort(\'iap\',\''+esc(c.key)+'\')"><span class="th-full">'+esc(c.label)+'</span><span class="th-short">'+esc(c.short||c.label)+'</span><span class="th-arrow">'+(sort.key===c.key?(sort.dir==='desc'?' \u25be':' \u25b4'):'')+'</span></th>'; }).join('')+'</tr>';
  const rows=sorted.length?sorted.map(function(a){
    const clo=a.closure||{}; const sla=(a.sla&&a.sla.pct!=null)?(a.sla.pct+'%'):'\u2014'; const avg=(a.avgTime||0);
    const cell=function(n,extra){return '<td class="'+(extra||'')+((n===0)?' zero':'')+'">'+n+'</td>';};
    return '<tr><td><span style="color:#44b9d6;font-weight:700">'+esc(a.name)+'</span> '+gtag(a.group)+'</td>'+
      cell(a.assigned||0)+
      IAP_CC_ORDER.map(function(c){return cell(clo[c]||0,c==='Successful'?'col-key':'');}).join('')+
      '<td class="col-total'+(iapTotal(clo)===0?' zero':'')+'"><b>'+iapTotal(clo)+'</b></td>'+
      '<td>'+(sla==='\u2014'?'<span class="zero">\u2014</span>':'<b>'+sla+'</b>')+'</td>'+
      '<td'+(avg===0?' class="zero"':'')+'>'+avg.toFixed(1)+'</td></tr>';
  }).join(''):('<tr><td colspan="'+cols.length+'" style="text-align:center;color:#7f8c8d">No groups selected.</td></tr>');
  const note=(GA_FILTER.groups.indexOf('A2')>=0)?GAMMA_NOTE:'';
  body.innerHTML='<div class="gv-scroll"><table class="iap-table xls"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>'+note;
}
function gaRenderGts(){
  const body=document.getElementById('gaGtsBody'); if(!GA_DATA||!body)return;
  const groups=GA_DATA.groups||{closure:{},sla:{}}; const sort=GA_SORT.gts;
  const allRows=[['A1','a1'],['B','b'],['A2','a2']];
  const rows0=allRows.filter(function(r){ return GA_FILTER.groups.indexOf(r[0])>=0; });
  const cloOf=function(r){return (groups.closure&&groups.closure[r[0]])||{};};
  const slaOf=function(r){return (groups.sla&&groups.sla[r[0]])||null;};
  const asgOf=function(r){return (groups.assigned&&groups.assigned[r[0]])||0;};
  const cols=[{key:'name',label:'Group',short:'Group',type:'str',val:function(r){return GN[r[0]]||r[0];}},
    {key:'__assigned',label:'Assigned',short:'Asg',type:'num',val:function(r){return asgOf(r);}}]
    .concat(IAP_CC_ORDER.map(function(c){return {key:c,label:GV_CC_SHORT[c]||c,short:IAP_CC_ABBR[c]||c,type:'num',val:function(r){return cloOf(r)[c]||0;}};}))
    .concat([{key:'__total',label:'Total',short:'Total',type:'num',val:function(r){return iapTotal(cloOf(r));}},
             {key:'__sla',label:'SLA',short:'SLA',type:'num',val:function(r){var s=slaOf(r);return (s&&s.pct!=null)?s.pct:-1;}}]);
  const col=cols.find(function(c){return c.key===sort.key;})||cols[1];
  const dir=(sort.dir==='asc')?1:-1;
  const rows=[...rows0].sort(function(a,b){ let r=(col.type==='str')?String(col.val(a)).localeCompare(String(col.val(b))):(col.val(a)-col.val(b)); return (r*dir)||(GN[a[0]]||'').localeCompare(GN[b[0]]||''); });
  const head='<tr>'+cols.map(function(c){ const kc=(c.key==='Successful')?' col-key':''; const ac=(sort.key===c.key)?' sorted':''; return '<th class="iap-sort'+kc+ac+'" title="'+esc(c.key.indexOf('__')===0?c.label:c.key)+'" onclick="gaSort(\'gts\',\''+esc(c.key)+'\')"><span class="th-full">'+esc(c.label)+'</span><span class="th-short">'+esc(c.short||c.label)+'</span><span class="th-arrow">'+(sort.key===c.key?(sort.dir==='desc'?' \u25be':' \u25b4'):'')+'</span></th>'; }).join('')+'</tr>';
  const trs=rows.length?rows.map(function(r){ const clo=cloOf(r); const s=slaOf(r); const sla=(s&&s.pct!=null)?(s.pct+'%'):'\u2014'; const asg=asgOf(r);
    return '<tr><td><span class="gv-tag '+r[1]+'">'+(GN[r[0]]||r[0])+'</span></td>'+
      '<td'+(asg===0?' class="zero"':'')+'>'+asg+'</td>'+
      IAP_CC_ORDER.map(function(c){var n=clo[c]||0;return '<td class="'+(c==='Successful'?'col-key':'')+(n===0?' zero':'')+'">'+n+'</td>';}).join('')+
      '<td class="col-total'+(iapTotal(clo)===0?' zero':'')+'"><b>'+iapTotal(clo)+'</b></td>'+
      '<td>'+(sla==='\u2014'?'<span class="zero">\u2014</span>':'<b>'+sla+'</b>')+'</td></tr>';
  }).join(''):('<tr><td colspan="'+cols.length+'" style="text-align:center;color:#7f8c8d">No groups selected.</td></tr>');
  const note=(GA_FILTER.groups.indexOf('A2')>=0)?GAMMA_NOTE:'';
  body.innerHTML='<div class="gv-scroll"><table class="iap-table xls"><thead>'+head+'</thead><tbody>'+trs+'</tbody></table></div>'+note;
}

  const cols=[{key:'name',label:'Group',short:'Group',type:'str',val:function(r){return GN[r[0]]||r[0];}},
    {key:'__assigned',label:'Assigned',short:'Asg',type:'num',val:function(r){return asgOf(r);}}]
    .concat(IAP_CC_ORDER.map(function(c){return {key:c,label:GV_CC_SHORT[c]||c,short:IAP_CC_ABBR[c]||c,type:'num',val:function(r){return cloOf(r)[c]||0;}};}))
    .concat([{key:'__total',label:'Total',short:'Total',type:'num',val:function(r){return iapTotal(cloOf(r));}},
             {key:'__sla',label:'SLA',short:'SLA',type:'num',val:function(r){var s=slaOf(r);return (s&&s.pct!=null)?s.pct:-1;}}]);
  const col=cols.find(function(c){return c.key===sort.key;})||cols[1];
  const dir=(sort.dir==='asc')?1:-1;
  const rows=[...rows0].sort(function(a,b){ let r=(col.type==='str')?String(col.val(a)).localeCompare(String(col.val(b))):(col.val(a)-col.val(b)); return (r*dir)||(GN[a[0]]||'').localeCompare(GN[b[0]]||''); });
  const head='<tr>'+cols.map(function(c){ const kc=(c.key==='Successful')?' col-key':''; const ac=(sort.key===c.key)?' sorted':''; return '<th class="iap-sort'+kc+ac+'" title="'+esc(c.key.indexOf('__')===0?c.label:c.key)+'" onclick="gwSort(\'gts\',\''+esc(c.key)+'\')"><span class="th-full">'+esc(c.label)+'</span><span class="th-short">'+esc(c.short||c.label)+'</span><span class="th-arrow">'+(sort.key===c.key?(sort.dir==='desc'?' \u25be':' \u25b4'):'')+'</span></th>'; }).join('')+'</tr>';
  const trs=rows.length?rows.map(function(r){ const clo=cloOf(r); const s=slaOf(r); const sla=(s&&s.pct!=null)?(s.pct+'%'):'\u2014'; const asg=asgOf(r);
    return '<tr><td><span class="gv-tag '+r[1]+'">'+(GN[r[0]]||r[0])+'</span></td>'+
      '<td'+(asg===0?' class="zero"':'')+'>'+asg+'</td>'+
      IAP_CC_ORDER.map(function(c){var n=clo[c]||0;return '<td class="'+(c==='Successful'?'col-key':'')+(n===0?' zero':'')+'">'+n+'</td>';}).join('')+
      '<td class="col-total'+(iapTotal(clo)===0?' zero':'')+'"><b>'+iapTotal(clo)+'</b></td>'+
      '<td>'+(sla==='\u2014'?'<span class="zero">\u2014</span>':'<b>'+sla+'</b>')+'</td></tr>';
  }).join(''):('<tr><td colspan="'+cols.length+'" style="text-align:center;color:#7f8c8d">No groups selected.</td></tr>');
  const note=(GW_FILTER.groups.indexOf('A2')>=0)?GAMMA_NOTE:'';
  body.innerHTML='<div class="gv-scroll"><table class="iap-table xls"><thead>'+head+'</thead><tbody>'+trs+'</tbody></table></div>'+note;
}
function toggleQueueCard(btn){
  const card=btn.closest('.gv-card'); if(!card)return;
  const willOpen=!card.classList.contains('open');
  if(willOpen) gvAccordion(card);
  card.classList.toggle('open', willOpen);
  btn.setAttribute('aria-expanded',willOpen?'true':'false');
}
window.toggleQueueCard=toggleQueueCard;

// Group Totals Summary: same column arrangement + sortable headers (no Avg Res — not computed per group).
let GTS_M=null, GTS_BODY=null, GTS_SORT=null;
const GTS_ROWS=[['A1','a1'],['B','b'],['A2','a2']];   // Alpha, Beta, Gamma
const GTS_COLS=[{key:'name',label:'Group',short:'Group',type:'str',val:function(r){return GN[r[0]]||r[0];}},
  {key:'__assigned',label:'Assigned',short:'Asg',type:'num',val:function(r){return GTS_ASG(r);}}]
  .concat(IAP_CC_ORDER.map(function(c){return {key:c,label:GV_CC_SHORT[c]||c,short:IAP_CC_ABBR[c]||c,type:'num',val:function(r){return (GTS_CLO(r)[c])||0;}};}))
  .concat([
    {key:'__total',label:'Total',short:'Total',type:'num',val:function(r){return iapTotal(GTS_CLO(r));}},
    {key:'__sla',label:'SLA',short:'SLA',type:'num',val:function(r){var s=GTS_SLA(r);return (s&&s.pct!=null)?s.pct:-1;}}
  ]);
function GTS_CLO(r){ return (GTS_M&&GTS_M.groups&&GTS_M.groups.closure&&GTS_M.groups.closure[r[0]])||{}; }
function GTS_SLA(r){ return (GTS_M&&GTS_M.groups&&GTS_M.groups.sla&&GTS_M.groups.sla[r[0]])||null; }
function GTS_ASG(r){ return (GTS_M&&GTS_M.groups&&GTS_M.groups.assigned&&GTS_M.groups.assigned[r[0]])||0; }
function gtsSort(key){
  if(GTS_SORT&&GTS_SORT.key===key){ GTS_SORT.dir=(GTS_SORT.dir==='desc')?'asc':'desc'; }
  else { GTS_SORT={key:key, dir:(key==='name'?'asc':'desc')}; }
  gtsRenderTable();
}
window.gtsSort=gtsSort;
function gtsArrow(key){ return (GTS_SORT&&GTS_SORT.key===key)?(GTS_SORT.dir==='desc'?' \u25be':' \u25b4'):''; }
function gtsRenderTable(){
  const m=GTS_M, body=GTS_BODY; if(!m||!body)return;
  const col=GTS_COLS.find(function(c){return c.key===(GTS_SORT&&GTS_SORT.key);})||GTS_COLS[1];
  const dir=(GTS_SORT&&GTS_SORT.dir==='asc')?1:-1;
  const rows=[...GTS_ROWS].sort(function(a,b){
    let r; if(col.type==='str') r=String(col.val(a)).localeCompare(String(col.val(b)));
    else r=(col.val(a)-col.val(b));
    return (r*dir) || (GN[a[0]]||'').localeCompare(GN[b[0]]||'');
  });
  const head='<tr>'+GTS_COLS.map(function(c){
    const keyCls=(c.key==='Successful')?' col-key':'';
    const activeCls=(GTS_SORT&&GTS_SORT.key===c.key)?' sorted':'';
    return '<th class="iap-sort'+keyCls+activeCls+'" title="'+esc(c.key.indexOf('__')===0?c.label:c.key)+'" onclick="gtsSort(\''+esc(c.key)+'\')">'+
      '<span class="th-full">'+esc(c.label)+'</span><span class="th-short">'+esc(c.short||c.label)+'</span>'+
      '<span class="th-arrow">'+gtsArrow(c.key)+'</span></th>';
  }).join('')+'</tr>';
  const trs=rows.map(function(r){
    const g=r[0], tag=r[1], clo=GTS_CLO(r), s=GTS_SLA(r);
    const sla=(s&&s.pct!=null)?(s.pct+'%'):'\u2014';
    const asg=GTS_ASG(r);
    return '<tr><td><span class="gv-tag '+tag+'">'+(GN[g]||g)+'</span></td>'+
      '<td'+(asg===0?' class="zero"':'')+'>'+asg+'</td>'+
      IAP_CC_ORDER.map(function(c){var n=clo[c]||0;return '<td class="'+(c==='Successful'?'col-key':'')+(n===0?' zero':'')+'">'+n+'</td>';}).join('')+
      '<td class="col-total'+(iapTotal(clo)===0?' zero':'')+'"><b>'+iapTotal(clo)+'</b></td>'+
      '<td>'+(sla==='\u2014'?'<span class="zero">\u2014</span>':'<b>'+sla+'</b>')+'</td></tr>';
  }).join('');
  body.innerHTML='<p class="iap-hint">'+ic('bar-chart',13)+' Tip: click any column header to sort \u2014 click again to switch between lowest\u2194highest.</p>'+
    '<div class="gv-scroll"><table class="iap-table xls"><thead>'+head+'</thead><tbody>'+trs+'</tbody></table></div>'+GAMMA_NOTE;
}
function gvSortedByGroup(m){
  return [...m.agents.filter(a=>a.group==='A1').sort((a,b)=>b.resolved-a.resolved),...m.agents.filter(a=>a.group==='A2').sort((a,b)=>b.resolved-a.resolved),...m.agents.filter(a=>a.group==='B').sort((a,b)=>b.resolved-a.resolved)];
}

(async function init(){
  // Paint the layout first (initials for avatars), then load profiles/avatars and refresh member tiles.
  await load();
  await loadGroupProfiles();
  // Re-render just the team member grids now that display names + avatars are available.
  document.querySelectorAll('.ga-group').forEach(function(card){
    const team=card.getAttribute('data-team'); const g=GROUPS.find(x=>x.name===team); if(!g)return;
    const grid=card.querySelector('.ga-mem-grid');
    if(grid) grid.innerHTML=g.members.slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase())).map(memberCard).join('');
  });
})();
</script>
