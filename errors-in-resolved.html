<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Anti-FOUC: hide the body until topbar-auth.js injects its CSS + builds the chrome. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<!-- Keep the section hidden until the shared chrome (title bar + menu column) has wrapped it. -->
<style>#wrap{visibility:hidden}#tbHomeChrome #wrap,html.tb-wrap-timeout #wrap{visibility:visible}</style>
<script>setTimeout(function(){document.documentElement.classList.add('tb-wrap-timeout');},8000);</script>
<noscript><style>#wrap{visibility:visible!important}</style></noscript>
<title>Errors in Resolved · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.wrap{padding:32px 24px;width:auto;max-width:none;margin:0}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
<style id="re-light">
/* Errors in Resolved (the 7 BLR / AZA team members): the Sanitization Tracker's design - navy hero with
   an orange rule, KPI cards overlapping it, one card per resolver (+ Others), then the picked card's
   tickets with errors (score below 11/11). Data: GET /api/resolved-errors. Scoped under .st. */
#wrap.wrap{padding-top:0!important;padding-bottom:28px!important}
.st{--ink:#1b2026;--mut:#5c6773;--line:#e2e6ea;--soft:#f5f6f8;--acc:#ec7211;--acc-bg:#fff3e8;--acc-ink:#9a4100;
  --red:#b42318;--red-bg:#fdecec;--grn:#1a7a43;--grn-bg:#e5f5ec;--blue:#1f5fbf;--blue-bg:#e9f0fb;--focus:#f0a35a;container-type:inline-size;color:var(--ink)}
.st button{font-family:inherit;line-height:inherit;text-transform:none}
.st :is(button,a,[tabindex],summary):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.st-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.st-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 78px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.st-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.st-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.st-hero.is-gate{padding-bottom:28px}
.st-hero-in{position:relative;display:flex;gap:20px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.st-hero-main{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1 1 360px}
.st-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.st-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.st-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.05}
.st-hero-sub{margin-top:9px;max-width:64ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.8)}
@media (min-width:1100px){.st-hero-sub{max-width:none;white-space:nowrap}}
.st-meta-k{font-size:.62em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:rgba(233,237,243,.62)}
.st-meta-v{display:inline-flex;align-items:center;gap:7px;font-size:.86em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.st-meta-v svg{color:#ffb26b;flex-shrink:0}
.st-hero-asof{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;min-height:40px;padding:9px 16px;border-radius:10px;margin-left:auto;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18)}
@container (max-width:560px){
  .st-hero{padding:20px 18px 72px 22px}
  .st-hero h1{font-size:1.65em}
  .st-hero-ic{width:40px;height:40px}
  .st-hero-main{flex-basis:100%}
  .st-hero-asof{margin-left:0}
}

/* ---- KPI row (overlaps the hero) ---- */
.st-kpis{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:-56px 18px 16px;padding:0;list-style:none}
@container (min-width:420px){.st-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.st-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container (max-width:560px){.st-kpis{margin:-54px 10px 14px}}
.st-kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.st-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#c4ccd4)}
.st-kpi-l{display:flex;align-items:center;gap:9px;font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.st-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:#3a4552}
.st-kpi-v{margin-top:12px;font-size:2.4em;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.st-kpi-s{margin-top:7px;font-size:.82em;font-weight:600;color:var(--mut)}
.st-kpi.is-base{--k:#1f2a40}.st-kpi.is-base .st-kpi-ic{background:var(--blue-bg);color:var(--blue)}
.st-kpi.is-ok{--k:#22a35a}.st-kpi.is-ok .st-kpi-v{color:var(--grn)}.st-kpi.is-ok .st-kpi-ic{background:var(--grn-bg);color:var(--grn)}
.st-kpi.is-bad{--k:#d92d20}.st-kpi.is-bad .st-kpi-v{color:var(--red)}.st-kpi.is-bad .st-kpi-ic{background:var(--red-bg);color:var(--red)}
.st-kpi.is-acc{--k:var(--acc)}.st-kpi.is-acc .st-kpi-ic{background:var(--acc-bg);color:#b5530a}
.st-kpi.is-na .st-kpi-v{color:#a0a8b1}

/* ---- Section cards ---- */
.st-sec{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18);margin-bottom:16px;overflow:hidden}
.st-sec-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.st-sec-ic{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--acc-bg);color:#b5530a}
.st-sec-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.st-sec-t{font-size:1.12em;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:var(--ink)!important}
.st-sec-d{font-size:.82em;font-weight:500;color:var(--mut);line-height:1.4}
.st-sec-b{padding:16px 20px 18px}
@container (max-width:640px){.st-sec-h{padding:14px}.st-sec-b{padding:14px}}
.st-empty{padding:18px;text-align:center;color:var(--mut);font-size:.9em;border:1px dashed #d4dade;border-radius:10px}
.st-err{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px;border-radius:10px;background:var(--red-bg);border:1px solid #f5c2c2;color:#8a1c12;font-weight:700;font-size:.9em}
.st-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid #161d2d;border-radius:8px;background:#161d2d;color:#f4f3ef;font-size:.84em;font-weight:800;cursor:pointer;text-decoration:none}
.st-btn:hover{background:#0f1420}
.st-btn.is-ghost{background:#fff;border-color:#d4dade;color:#2a3340}
.st-btn.is-ghost:hover{border-color:var(--acc);color:var(--acc-ink)}

/* ---- Resolver cards: 8 equal cards in one row; 4 / 2 / 1 columns on narrower widths ---- */
.st-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--n,8),minmax(0,1fr));gap:10px}
@container (max-width:1180px){.st-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container (max-width:720px){.st-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:440px){.st-grid{grid-template-columns:minmax(0,1fr)}}
.st-card{width:100%;height:100%;display:flex;flex-direction:column;gap:9px;padding:12px 12px;min-width:0;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s,background .15s}
.st-card:hover{border-color:var(--acc);box-shadow:0 0 0 3px rgba(236,114,17,.12)}
.st-card[aria-pressed="true"]{border-color:var(--acc);background:#fff8f1;box-shadow:0 0 0 3px rgba(236,114,17,.24)}
/* The login never shrinks to nothing: on narrow cards the 'Selected' pill wraps under it instead. */
.st-card-top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;width:100%;min-width:0}
.st-card-who{flex:0 1 auto;max-width:100%;min-width:0;font-size:1.02em;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-card-grp{flex-shrink:0;padding:1px 7px;border-radius:99px;background:var(--blue-bg);color:#1f4f99;font-size:.66em;font-weight:800;letter-spacing:.6px}
.st-card-sel{display:none;flex-shrink:0;align-items:center;gap:4px;margin-left:auto;padding:2px 8px;border-radius:99px;background:var(--acc);color:#fff;font-size:.68em;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
.st-card[aria-pressed="true"] .st-card-sel{display:inline-flex}
.st-card-cnt{display:block;width:100%;white-space:normal;font-size:.74em;font-weight:700;line-height:1.5;color:#2a3340;font-variant-numeric:tabular-nums;letter-spacing:-.1px}
.st-card-cnt>span{white-space:nowrap}
.st-card-cnt b{font-weight:800}
.st-card-cnt .is-bad{color:#a61b1b}
.st-card-cnt i{font-style:normal;color:#a0a8b1}
.st-card-rate{display:flex;align-items:center;gap:8px;width:100%}
.st-bar{flex:1 1 auto;height:8px;border-radius:99px;background:#eef1f4;overflow:hidden}
.st-bar span{display:block;height:100%;border-radius:99px;background:hsl(var(--sc-h),68%,46%)}
.st-card-rate b{flex-shrink:0;text-align:right;font-size:.82em;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- Selected card's tickets with errors (one line per ticket; .tb-asg-card / .tb-san-card base styles come from topbar-auth.js) ---- */
.st-view.tb-asg-card .tb-asg-scroll{max-height:70vh}
.st-view[aria-busy="true"]{opacity:.6}
.st-view .tb-san-sum p{font-size:.92em}
.st-view table.stv-tbl td{vertical-align:middle}
.st-view table.stv-tbl tbody tr:hover td{background:#fafbfc}
.st-view .stv-fit{width:1%;white-space:nowrap}
.st-view table.stv-tbl .stv-ttl,.st-view table.stv-tbl .stv-mc{width:49%}
.st-view td.stv-clip{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4}
.st-view td.stv-mc{color:#5c6773}
@media (max-width:899px){.st-view td.stv-clip.stv-mc{white-space:normal;overflow-wrap:anywhere}}
.st-view .stv-id,.st-view .stv-sc{white-space:nowrap}
.st-view .stv-by{color:#2a3340;font-weight:700}
.st-view .stv-sort{display:inline-flex;align-items:center;gap:6px;margin:0;padding:2px 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:inherit;font:inherit;font-weight:800;cursor:pointer}
.st-view .stv-sort:hover{border-color:#d4dade;background:#fff}
.st-view .stv-sort:focus-visible{outline:3px solid #f0a35a;outline-offset:2px}
.st-view .stv-sort-ic{font-size:.8em;color:#b5530a}
/* Small ClosureCode tag per row (sanitization-view.js codeTag). */
.st-view .stv-cc{display:inline-block;padding:1px 7px;border-radius:99px;background:#eef1f4;color:#2a3340;font-size:.8em;font-weight:700;white-space:nowrap}
/* Closure-code defect messages (sanitization-view.js missDef), red, before the missing checks. */
.st-view .stv-def{color:#b42318;font-weight:700}
</style>
</head>
<body data-nav-active="errors-in-resolved" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap"></div>
<!-- One persistent polite live region (outside #wrap, so re-renders never replace it). -->
<div id="stLive" class="st-sr" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)"></div>

<script src="icons.js?v=3"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=233"></script>
<script src="sanitization-view.js?v=12"></script>
<script>
// Errors in Resolved: the 7 BLR / AZA team members' Resolved / Closed tickets (created since 1 Jan 2026),
// checked with the closure-code rule (server: sanitization-score.js closureRule; Successful = all 11 (RCD Issue covers a missing title type),
// eligible Immediately Resolved = the 3 title checks, anything else a defect); one card per resolver +
// Others; the picked card lists only its tickets with errors (a defect or a failing required check:
// defects in red, then the missing checks), score = passed / required. GET /api/resolved-errors[?who=] (read-only).
var A=window.PHDAuth, S=window.PHDSan, V=window.PHDSanView, RE=window.PHDResErr;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ic(n,s){return window.icon?window.icon(n,s||14):'';}
function $(id){return document.getElementById(id);}
function num(n){return (Number(n)||0).toLocaleString('en-US');}
function pct(a,b){return b?Math.round((Number(a)||0)/b*100):0;}
function maxS(){ var m=Number(ST.max)||0; return m>0?m:11; }
function full(){ return maxS()+'/'+maxS(); }
function when(iso){ return S&&S.when?S.when(iso):(iso?String(iso).slice(0,10):''); }
function announce(msg){ var l=$('stLive'); if(l){ l.textContent=''; setTimeout(function(){ l.textContent=msg; },30); } }

// ---- State ----
var PAGE_SIZE=100;
var ME=String(((A&&A.getUser&&A.getUser())||{}).username||'').trim().toLowerCase();   // viewer login
var ST={state:'loading', err:'', cards:[], asOf:null, max:11};
var SEL=null;      // picked card key (login | 'others')
var VIEWS={};      // key -> {loading, data, error}
var PG=0;          // page of the shown list
var SORT='asc';    // score order ('asc' = lowest first)
var SEQ=0;         // guards against out-of-order responses

function findC(key){ for(var i=0;i<ST.cards.length;i++) if(ST.cards[i].key===key) return ST.cards[i]; return null; }
function team(){ return ST.cards.filter(function(c){ return c.key!=='others'; }); }
function totals(){ var t={resolved:0,withErrors:0,perfect:0}; team().forEach(function(c){ t.resolved+=Number(c.resolved)||0; t.withErrors+=Number(c.withErrors)||0; t.perfect+=Number(c.perfect)||0; }); return t; }

// ---- Hero / gate ----
function heroHtml(gate){
  var asOf=ST.state==='done'?(ST.asOf?esc(when(ST.asOf)):'Unknown'):(ST.state==='error'?'Not loaded':'Loading\u2026');
  return '<header class="st-hero'+(gate?' is-gate':'')+'"><div class="st-hero-in"><div class="st-hero-main"><span class="st-hero-ic" aria-hidden="true">'+ic('alert-triangle',24)+'</span><div>'+
    '<p class="st-eyebrow">Quality \u00b7 Resolved tickets</p><h1>Errors in Resolved</h1>'+
    '<p class="st-hero-sub">Tickets resolved since 1 Jan 2026, checked by closure code: Successful needs all 11 checks (a valid RCD Issue covers a missing title issue type); Immediately Resolved or Automatically Closed is allowed only for an Out of Scope of PHD or unsecured pet issue type with Sev 3\u20135 in the title (then the 3 title checks); any other code is a defect. Only tickets with errors are listed.</p>'+
    '</div></div>'+(gate?'':'<div class="st-hero-asof" aria-label="Data as of"><span class="st-meta-k">Data as of</span><span class="st-meta-v" id="stAsOf">'+ic('clock',14)+asOf+'</span></div>')+
    '</div></header>';
}
function gate(kind){
  var body, head='BLR and AZA team only';
  if(kind==='login'){ head='Login required'; body='<p class="st-empty">Please log in from the Live Dashboard to use this page.</p><p style="margin-top:12px"><a class="st-btn" href="app.html">Go to the live dashboard</a></p>'; }
  else body='<p class="st-empty">This page is for the BLR and AZA team.</p>';
  $('wrap').innerHTML='<div class="st">'+heroHtml(true)+'<section class="st-sec" aria-labelledby="stGateH" style="margin-top:16px"><div class="st-sec-h"><div class="st-sec-txt"><h2 class="st-sec-t" id="stGateH">'+head+'</h2></div></div><div class="st-sec-b">'+body+'</div></section></div>';
}

// ---- KPIs (the 7 team cards; Others is left out) ----
function kpisHtml(){
  var done=ST.state==='done', t=done?totals():null, oth=done?findC('others'):null;
  function k(cls,icon,label,val,sub){
    return '<li class="st-kpi '+cls+(done?'':' is-na')+'"><span class="st-kpi-l"><span class="st-kpi-ic" aria-hidden="true">'+ic(icon,15)+'</span>'+label+'</span>'+
      '<span class="st-kpi-v" style="display:block">'+(done?val:'\u2014')+'</span><span class="st-kpi-s" style="display:block">'+sub+'</span></li>';
  }
  return '<ul class="st-kpis" id="stKpis" aria-label="Team totals"'+(done?'':' aria-busy="true"')+'>'+
    k('is-base','users','Team resolved',done?num(t.resolved):'',done?('BLR + AZA \u00b7 Others '+num(oth?oth.resolved:0)):'BLR + AZA')+
    k('is-bad','alert-triangle','With errors',done?num(t.withErrors):'','A defect or a missing check')+
    k('is-ok','check-circle','Perfect',done?num(t.perfect):'','Allowed closure code, every check it needs passes')+
    k('is-acc','bar-chart','Pass rate',done?(pct(t.perfect,t.resolved)+'%'):'','Perfect of resolved')+
    '</ul>';
}

// ---- Resolver cards ----
function cardHtml(c){
  var on=c.key===SEL, r=Number(c.resolved)||0, e=Number(c.withErrors)||0, p=Number(c.passPct)||0;
  var sep=' <i aria-hidden="true">|</i> ';
  return '<li><button type="button" class="st-card" data-who="'+esc(c.key)+'" aria-pressed="'+(on?'true':'false')+'" aria-controls="stViewSec">'+
    '<span class="st-card-top"><span class="st-card-who">'+esc(c.label)+'</span>'+(c.group?'<span class="st-card-grp">'+esc(c.group)+'</span>':'')+
      '<span class="st-card-sel">'+ic('check',12)+'Selected</span></span>'+
    '<span class="st-card-cnt"><span>Resolved <b>'+num(r)+'</b></span>'+sep+'<span class="is-bad">With errors <b>'+num(e)+'</b></span></span>'+
    '<span class="st-card-rate" style="--sc-h:'+V.hue(p/100*maxS())+'"><span class="st-bar" aria-hidden="true"><span style="width:'+p+'%"></span></span><b>'+p+'% perfect</b></span>'+
    '</button></li>';
}
function cardsBody(){
  if(ST.state==='loading') return '<p class="st-empty" role="status">Loading\u2026</p>';
  if(ST.state==='error') return '<div class="st-err" role="alert">'+esc(ST.err)+'<button type="button" class="st-btn is-ghost" id="stRetry">Try again</button></div>';
  return '<ul class="st-grid" aria-label="Resolvers" style="--n:'+ST.cards.length+'">'+ST.cards.map(cardHtml).join('')+'</ul>';
}

// ---- Shown card: tickets with errors ----
function viewHead(){
  if(!SEL) return 'Tickets with errors';
  if(SEL==='others') return 'Others: tickets with errors';
  if(SEL===ME) return 'My resolved tickets with errors';
  return SEL+'\u2019s resolved tickets with errors';
}
// Score order: server order is score ascending, then oldest resolved first; 'desc' flips only the
// score (ties keep oldest resolved first).
function sortRows(list,dir){
  var d=dir==='desc'?-1:1;
  // score = passed required checks out of t.required (passed / required ratio first, then fewer passed).
  var r=function(t){ return t.required>0?t.score/t.required:t.score/maxS(); };
  return list.map(function(t,i){ return {t:t,i:i}; }).sort(function(a,b){ return ((r(a.t)-r(b.t))*d)||((a.t.score-b.t.score)*d)||(a.i-b.i); }).map(function(x){ return x.t; });
}
function tableHtml(rows,others){
  var dir=SORT, sortLbl=dir==='asc'?'lowest first':'highest first';
  return '<div class="tb-asg-scroll stv-scroll" role="region" aria-label="Tickets with errors" tabindex="0"><table class="stv-tbl">'+
    '<caption class="tb-asg-sr">Resolved tickets with errors, score '+sortLbl+'.</caption>'+
    '<thead><tr><th scope="col" class="stv-fit" aria-sort="'+(dir==='asc'?'ascending':'descending')+'"><button type="button" class="stv-sort" data-stvsort="1">Score'+
      '<span class="stv-sort-ic" aria-hidden="true">'+(dir==='asc'?'\u25b2':'\u25bc')+'</span>'+
      '<span class="tb-asg-sr">, sorted '+sortLbl+'. Activate to sort '+(dir==='asc'?'highest':'lowest')+' first.</span></button></th>'+
    '<th scope="col" class="stv-fit">Ticket ID</th><th scope="col" class="stv-fit">Closure code</th><th scope="col" class="stv-ttl">Title</th><th scope="col" class="stv-mc">Missing / Defect</th>'+
    (others?'<th scope="col" class="stv-fit">Resolved by</th>':'')+'</tr></thead><tbody>'+
    rows.map(function(t){
      var miss=V.missDef(t.defects,t.missing), u=t.url||(S&&S.url?S.url(t):'');
      return '<tr><td class="stv-sc stv-fit">'+(t.required>0?V.ratioHtml(t.score,t.required):V.scoreHtml(t.score))+'</td>'+
        '<td class="stv-id stv-fit"><span class="tb-asg-id"><a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(t.shortId)+'<span class="tb-asg-sr"> (opens in a new tab)</span></a></span></td>'+
        '<td class="stv-fit">'+V.codeTag(t.closureCode)+'</td>'+
        '<td class="stv-clip stv-ttl" title="'+esc(t.title||'No title')+'">'+esc(t.title||'No title')+'</td>'+
        '<td class="stv-clip stv-mc" title="'+esc(miss.text)+'">'+miss.html+'</td>'+
        (others?'<td class="stv-by stv-fit">'+esc(t.resolvedBy||'\u2014')+'</td>':'')+'</tr>';
    }).join('')+'</tbody></table></div>';
}
function viewBody(){
  if(ST.state!=='done'||!SEL) return '';
  var v=VIEWS[SEL]||{};
  if(v.loading&&!v.data) return '<p class="tb-asg-empty">Loading tickets\u2026</p>';
  if(v.error) return '<div class="st-err" role="alert">'+esc(v.error)+'<button type="button" class="st-btn is-ghost" id="stViewRetry">Try again</button></div>';
  if(!v.data) return '';
  var list=v.data.tickets||[], c=findC(SEL)||v.data.card||{};
  var sum='<div class="tb-san-sum"><p>Resolved '+num(c.resolved)+' \u00b7 With errors '+num(c.withErrors)+' \u00b7 Perfect '+num(c.perfect)+'</p>'+
    '<div class="tb-san-prog" aria-hidden="true"><span style="width:'+(Number(c.passPct)||0)+'%"></span></div></div>';
  if(!list.length) return sum+'<p class="tb-asg-empty">No tickets with errors \ud83c\udf89</p>';
  var all=sortRows(list,SORT), last=Math.ceil(all.length/PAGE_SIZE)-1;
  PG=Math.max(0,Math.min(PG,last));
  return sum+tableHtml(all.slice(PG*PAGE_SIZE,(PG+1)*PAGE_SIZE),SEL==='others')+V.pager('re',PG,PAGE_SIZE,all.length,'Tickets with errors');
}
function renderView(focusSel){
  var h=$('stViewH'), b=$('stViewBody'); if(!b) return;
  var v=SEL&&VIEWS[SEL];
  if(h) h.textContent=viewHead();
  b.setAttribute('aria-busy',v&&v.loading?'true':'false');
  b.innerHTML=viewBody();
  if(focusSel){ var f=b.querySelector(focusSel)||document.querySelector(focusSel); if(f) try{ f.focus(); }catch(e){} }
}
function renderCards(focusKey){
  var b=$('stCardsBody'); if(!b) return;
  b.innerHTML=cardsBody();
  if(focusKey){ var f=b.querySelector('[data-who="'+String(focusKey).replace(/["\\]/g,'')+'"]'); if(f) try{ f.focus(); }catch(e){} }
}
function render(){
  $('wrap').innerHTML='<div class="st">'+heroHtml(false)+kpisHtml()+
    '<section class="st-sec" aria-labelledby="stCardsH"><div class="st-sec-h"><span class="st-sec-ic" aria-hidden="true">'+ic('users',18)+'</span>'+
      '<div class="st-sec-txt"><h2 class="st-sec-t" id="stCardsH">Resolvers</h2><p class="st-sec-d">Team BLR and AZA, plus Others (resolved by anyone else). Pick a card to see its tickets with errors below.</p></div></div>'+
      '<div class="st-sec-b" id="stCardsBody"></div></section>'+
    '<section class="st-sec" id="stViewSec" aria-labelledby="stViewH"><div class="st-sec-h"><span class="st-sec-ic" aria-hidden="true">'+ic('alert-triangle',18)+'</span>'+
      '<div class="st-sec-txt"><h2 class="st-sec-t" id="stViewH" tabindex="-1"></h2><p class="st-sec-d">Tickets with a closure-code defect (in red) or a failing required check, scored passed / required checks, lowest first (use the Score header to flip it), then oldest resolved. Ticket links open in a new tab.</p></div></div>'+
      '<div class="st-sec-b"><div class="st-view tb-asg-card tb-san-card" id="stViewBody"></div></div></section></div>';
  renderCards(); renderView();
}

// ---- Data ----
function setUrl(key){
  try{ var u=new URL(location.href); if(key) u.searchParams.set('who',key); else u.searchParams.delete('who'); history.replaceState(history.state,'',u.pathname+u.search+u.hash); }catch(e){}
}
function errMsg(r,what){ return (r&&r.status===401)?'Your session has expired. Please log in again.':((r&&r.data&&r.data.error)||('Could not load '+what+'.')); }
function loadView(key,force){
  var v=VIEWS[key];
  if(v&&v.data&&!force){ renderView(); return; }
  var seq=++SEQ;
  VIEWS[key]={loading:true}; renderView();
  A.api('GET','/api/resolved-errors?who='+encodeURIComponent(key)).then(function(r){
    VIEWS[key]=(r&&r.ok&&r.data&&Array.isArray(r.data.tickets))?{data:r.data}:{error:errMsg(r,'the tickets')};
  },function(){ VIEWS[key]={error:'Could not load the tickets.'}; }).then(function(){
    if(seq!==SEQ||SEL!==key) return;
    var x=VIEWS[key]; renderView();
    announce(x.error?x.error:(viewHead()+': '+num(x.data.tickets.length)+'.'));
  });
}
function select(key,focusCard){
  if(!findC(key)) return;
  var same=key===SEL;
  SEL=key; setUrl(key);
  if(!same){ PG=0; SORT='asc'; }
  renderCards(focusCard?key:null);
  loadView(key,false);
}
function applyCards(d){
  if(d&&Array.isArray(d.cards)) ST={state:'done',err:'',cards:d.cards,asOf:d.asOf||null,max:Number(d.maxScore)||11};
  else ST={state:'error',err:'Could not load the resolved tickets.',cards:[],asOf:null,max:11};
  if(V&&V.setMax) V.setMax(ST.max);
  render();
  if(ST.state!=='done'){ announce(ST.err); return; }
  // ?who= deep link first, else the viewer's own card.
  var want=String(new URLSearchParams(location.search).get('who')||'').trim().toLowerCase();
  var pick=findC(want)?want:(findC(ME)?ME:(ST.cards[0]&&ST.cards[0].key));
  if(pick) select(pick,false);
}
function fetchCards(){
  A.api('GET','/api/resolved-errors').then(function(r){
    if(r&&r.status===403){ gate('none'); return; }
    if(!(r&&r.ok)){ ST={state:'error',err:errMsg(r,'the resolved tickets'),cards:[],asOf:null,max:11}; render(); announce(ST.err); return; }
    applyCards(r.data);
  },function(){ applyCards(null); });
}
function loadCards(retry){
  ST={state:'loading',err:'',cards:[],asOf:null,max:11}; render();
  // First load reuses the top bar's request (same endpoint); Try again asks the server afresh.
  if(retry||!RE||!RE.ready){ fetchCards(); return; }
  RE.ready().then(function(d){ if(d&&Array.isArray(d.cards)) applyCards(d); else fetchCards(); },fetchCards);
}

// ---- Events ----
document.addEventListener('click',function(e){
  var t=e.target; if(!t||!t.closest||!t.closest('#wrap')) return;
  var card=t.closest('.st-card[data-who]');
  if(card){ select(card.getAttribute('data-who'),true); return; }
  if(t.closest('#stRetry')){ loadCards(true); return; }
  if(t.closest('#stViewRetry')){ if(SEL) loadView(SEL,true); return; }
  if(t.closest('[data-stvsort]')){
    SORT=SORT==='asc'?'desc':'asc'; PG=0; renderView('[data-stvsort]');
    announce('Sorted by score, '+(SORT==='asc'?'lowest':'highest')+' first.'); return;
  }
  var pg=t.closest('[data-sanpage]');
  if(pg&&!pg.disabled){
    var np=Math.max(0,Number(pg.getAttribute('data-sanpage').split(':')[1])||0), dir=np>PG?'next':'prev';
    PG=np; renderView();
    var bs=document.querySelectorAll('#stViewBody [data-sanpage]'), f=dir==='next'?bs[bs.length-1]:bs[0];
    if(f&&f.disabled) f=dir==='next'?bs[0]:bs[bs.length-1];
    if(f) try{ f.focus(); }catch(err){}
    var sc=document.querySelector('#stViewBody .tb-asg-scroll'); if(sc) sc.scrollTop=0;
    announce('Tickets with errors: page '+(PG+1));
  }
});

// ---- Start ----
(function(){
  if(!(A&&A.getUser&&A.getUser())){ gate('login'); return; }
  if(!V||!RE||!RE.mayAsk()){ gate('none'); return; }
  // Times in the account timezone (IST / MST), like the rest of the app.
  if(S&&A.myTimezone) A.myTimezone().then(function(tz){ if(tz==='MST'){ S.setTz('MST'); var h=$('stAsOf'); if(h&&ST.state==='done') h.innerHTML=ic('clock',14)+(ST.asOf?esc(when(ST.asOf)):'Unknown'); } }).catch(function(){});
  loadCards(false);
})();
</script>
</body>
</html>
