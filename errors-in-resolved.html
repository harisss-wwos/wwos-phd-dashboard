<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Anti-FOUC: hide the body until topbar-auth.js injects its CSS + builds the chrome. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<!-- Keep the section hidden until the shared chrome (title bar + menu column) has wrapped it. -->
<style>#wrap{visibility:hidden}#tbHomeChrome #wrap,html.tb-wrap-timeout #wrap{visibility:visible}</style>
<script>setTimeout(function(){document.documentElement.classList.add('tb-wrap-timeout');},8000);</script>
<noscript><style>#wrap{visibility:visible!important}</style></noscript>
<title>Errors in Resolved · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.wrap{padding:32px 24px;width:auto;max-width:none;margin:0}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
<style id="eir-light">
/* Errors in Resolved — "audit ledger": dark slate hero with an orange rule, KPI cards that overlap it,
   then white ledger cards. Everything is scoped under .eir (a size container for the responsive grids). */
#wrap.wrap{padding-top:0!important;padding-bottom:28px!important}
.eir{--ink:#1b2026;--mut:#5c6773;--line:#e2e6ea;--soft:#f5f6f8;--acc:#ec7211;--acc-bg:#fff3e8;--acc-ink:#9a4100;
  --red:#b42318;--red-bg:#fdecec;--grn:#1a7a43;--grn-bg:#e5f5ec;--focus:#f0a35a;container-type:inline-size;color:var(--ink)}
.eir button{font:inherit;text-transform:none}
.eir :is(button,a,input):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.eir-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.eir-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 78px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.eir-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.eir-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.eir-hero-in{position:relative;display:flex;gap:20px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.eir-hero-main{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1 1 360px}
.eir-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.eir-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.eir-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.05}
.eir-hero-sub{margin-top:9px;max-width:62ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.8)}
.eir-meta{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:10px 26px;margin:0;padding:13px 16px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);max-width:100%}
.eir-meta dt{font-size:.64em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:rgba(233,237,243,.62)}
.eir-meta dd{margin:3px 0 0;font-size:.86em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.eir-meta .eir-meta-file,.eir-meta .eir-meta-wide{grid-column:1/-1}
.eir-meta-box{max-width:100%;display:flex;flex-direction:column;gap:8px}
.eir-meta-file dd{display:flex;gap:8px;align-items:center;font-size:.92em}
.eir-meta-file dd svg{flex-shrink:0;color:#ffb26b}
.eir-meta-none{font-size:.86em;font-weight:700;color:rgba(233,237,243,.85);padding:12px 16px;border-radius:10px;border:1px dashed rgba(255,255,255,.25)}
.eir-hero-warn{max-width:46ch;padding:7px 10px;border-radius:7px;background:rgba(245,166,35,.16);border:1px solid rgba(245,166,35,.45);color:#ffd59a;font-size:.8em;font-weight:700;line-height:1.45}

/* ---- KPI row (overlaps the hero) ---- */
.eir-kpis{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:-56px 18px 16px}
@container (min-width:520px){.eir-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.eir-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.eir-kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.eir-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#c4ccd4)}
.eir-kpi-l{display:flex;align-items:center;gap:9px;font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.eir-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:#3a4552}
.eir-kpi-v{margin-top:12px;font-size:2.4em;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.eir-kpi-s{margin-top:7px;font-size:.82em;font-weight:600;color:var(--mut)}
.eir-kpi-s b{color:var(--ink);font-weight:800}
.eir-kpi-bar{margin-top:12px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.eir-kpi-bar i{display:block;height:100%;border-radius:inherit;background:var(--k)}
.eir-kpi.is-base{--k:#1f2a40}
.eir-kpi.is-bad{--k:#d92d20}.eir-kpi.is-bad .eir-kpi-v{color:var(--red)}.eir-kpi.is-bad .eir-kpi-ic{background:var(--red-bg);color:var(--red)}
.eir-kpi.is-warn{--k:var(--acc)}.eir-kpi.is-warn .eir-kpi-ic{background:var(--acc-bg);color:#b5530a}
.eir-kpi.is-good{--k:#1f9d57}.eir-kpi.is-good .eir-kpi-v{color:var(--grn)}.eir-kpi.is-good .eir-kpi-ic{background:var(--grn-bg);color:var(--grn)}

/* ---- Scope strip ---- */
.eir-scope{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:14px 18px;margin-bottom:16px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18)}
.eir-scope-lead{display:flex;gap:12px;align-items:flex-start;flex:1 1 360px;min-width:0}
.eir-scope-ic{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:#e9f0fb;color:#1f4f9a}
.eir-scope-h{font-size:.68em!important;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)!important;margin-bottom:3px}
.eir-scope-p{font-size:.92em;font-weight:600;line-height:1.5;color:#2a3340}
.eir-scope-p b{color:var(--ink);font-weight:800}
.eir-ign{display:flex;flex-wrap:wrap;align-items:center;gap:6px;list-style:none;margin:0;padding:0}
.eir-ign-k{font-size:.68em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);margin-right:4px}
.eir-ign-c{display:inline-flex;align-items:center;gap:7px;padding:4px 5px 4px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.8em;font-weight:700;color:#3a4552;white-space:nowrap}
.eir-ign-c b{min-width:24px;text-align:center;padding:1px 7px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- Generic card ---- */
.eir-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18);padding:20px 22px;margin-bottom:16px}
.eir-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;margin-bottom:16px}
.eir-card-head h2{font-size:1.2em;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.eir-help{margin-top:5px;font-size:.86em;color:var(--mut);line-height:1.5;max-width:72ch}
.eir-mode{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;font-size:.72em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  background:var(--acc-bg);color:var(--acc-ink);border:1px solid #f7c99c;white-space:nowrap}
.eir-mode.is-view{background:#eef1f4;color:#3a4552;border-color:#d4dade}
.eir-err{color:var(--red);font-size:.86em;font-weight:700;margin-top:12px}
.eir-err:empty{display:none}

/* ---- Checks ---- */
.eir-chk-head{flex-wrap:nowrap;align-items:center;gap:8px 14px}
.eir-chk-head.is-shut{margin-bottom:0}
.eir-chk-head h2{flex:0 0 auto;margin:0}
.eir-chk-exp{display:inline-flex;align-items:center;gap:10px;margin:-4px -6px;padding:4px 8px 4px 6px;border:none;border-radius:8px;background:none;color:var(--ink);cursor:pointer;white-space:nowrap}
.eir-chk-exp:hover{background:#fafbfc}
.eir-chk-exp:hover .eir-chev{background:#e6f0fc;color:#2b66c1}
.eir-chk-exp[aria-expanded="true"] .eir-chev svg{transform:rotate(90deg)}
.eir-chk-sum{font-size:.66em;font-weight:700;letter-spacing:0;color:var(--mut);font-variant-numeric:tabular-nums}
.eir-chk-sum b{color:var(--ink);font-weight:800}
.eir-chk-sum .is-e{color:var(--red)}
.eir-help-1{flex:1 1 auto;min-width:0;margin:0;font-size:.84em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eir-chk-head .eir-fchip,.eir-chk-head .eir-mode{flex-shrink:0}
@container (max-width:700px){.eir-chk-head{flex-wrap:wrap}.eir-help-1{order:5;flex-basis:100%}}
.eir-grp+.eir-grp{margin-top:18px}
.eir-grp-h{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:.7em!important;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)!important}
.eir-grp-h::after{content:'';flex:1 1 auto;height:1px;background:var(--line)}
.eir-grp-h span{font-weight:700;letter-spacing:.4px;text-transform:none;color:#8793a0}
.eir-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@container (min-width:560px){.eir-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:980px){.eir-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.eir-chk{position:relative;display:flex;flex-direction:column;gap:11px;padding:14px 14px 13px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;
  transition:border-color .15s,box-shadow .15s}
.eir-chk::before{content:'';position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.eir-chk:hover{border-color:#cfd6dd;box-shadow:0 10px 22px -18px rgba(20,30,50,.55)}
.eir-chk.is-filter{border-color:var(--c);box-shadow:0 0 0 3px rgba(236,114,17,.14)}
.eir-chk-top{position:relative;display:flex;align-items:flex-start;gap:11px;cursor:pointer}
.eir-sw-in{position:absolute;left:0;top:0;width:36px;height:20px;margin:0;opacity:0;cursor:pointer}
.eir-sw{position:relative;flex-shrink:0;width:36px;height:20px;margin-top:1px;border-radius:99px;background:#c9d0d8;transition:background .15s}
.eir-sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .15s}
.eir-sw-in:checked+.eir-sw{background:var(--acc)}
.eir-sw-in:checked+.eir-sw::after{transform:translateX(16px)}
.eir-sw-in:focus-visible+.eir-sw{outline:3px solid var(--focus);outline-offset:2px}
.eir-sw-in:disabled+.eir-sw{opacity:.5}
.eir-chk-txt{flex:1 1 auto;min-width:0}
.eir-chk-lbl{display:block;font-size:.95em;font-weight:800;line-height:1.25;color:var(--ink)}
.eir-chk-desc{display:block;margin-top:3px;font-size:.78em;line-height:1.4;color:var(--mut)}
.eir-code{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:5px;background:var(--soft);border:1px solid var(--line);
  font-size:.7em;font-weight:800;letter-spacing:.4px;color:#3a4552;font-variant-numeric:tabular-nums}
.eir-code::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.eir-chk-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto}
.eir-cnt{display:inline-flex;align-items:baseline;gap:6px;margin:-3px -7px;padding:3px 7px;border:none;border-radius:7px;background:none;color:var(--red);cursor:pointer;transition:background .15s}
.eir-cnt b{font-size:1.65em;font-weight:800;letter-spacing:-.6px;line-height:1;font-variant-numeric:tabular-nums}
.eir-cnt span{font-size:.76em;font-weight:700;color:var(--mut)}
.eir-cnt:hover:not(:disabled){background:var(--red-bg)}
.eir-cnt[aria-pressed="true"]{background:var(--red-bg);box-shadow:inset 0 0 0 1px #f2b8b1}
.eir-cnt:disabled{cursor:default}
.eir-cnt.is-zero,.eir-cnt.is-off{color:#8793a0}
.eir-chk-pct{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:.76em;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.eir-chk-foot>.eir-cnt{flex-shrink:0}
.eir-bar{height:4px;border-radius:99px;background:#eef1f4;overflow:hidden}
.eir-bar i{display:block;height:100%;border-radius:inherit;background:var(--c);transition:width .5s ease}
.eir-chk-note{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:2px 8px;border-radius:99px;background:#eef1f4;font-size:.72em;font-weight:800;color:#5c6773}
.eir-chk.is-off{background:#f8f9fa}
.eir-chk.is-off::before,.eir-chk.is-hidden::before{background:#c9d0d8}
.eir-chk.is-off .eir-chk-lbl,.eir-chk.is-off .eir-chk-desc{color:#8793a0}
.eir-chk.is-locked .eir-chk-top,.eir-chk.is-locked .eir-sw-in{cursor:not-allowed}
.eir-chk.is-hidden .eir-chk-lbl,.eir-chk.is-hidden .eir-cnt b{text-decoration:line-through;color:#8793a0}
.eir-chk.is-hidden .eir-bar i{background:#c9d0d8}

/* ---- Resolver list + filters ---- */
.eir-list-head{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:14px}
.eir-list-head h2{font-size:1.2em;font-weight:800;letter-spacing:-.3px}
.eir-count{font-size:.84em;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.eir-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;padding:10px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.eir-search{position:relative;flex:1 1 260px;max-width:440px}
.eir-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8793a0;pointer-events:none}
.eir-search input{width:100%;font:inherit;font-size:.9em;padding:8px 12px 8px 36px;border-radius:8px}
.eir-tog{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid #d4dade;border-radius:99px;background:#fff;font-size:.84em;font-weight:700;color:#3a4552;cursor:pointer;user-select:none}
.eir-tog input{width:15px;height:15px;margin:0;accent-color:var(--acc);cursor:pointer}
.eir-tog:has(input:checked){background:var(--acc-bg);border-color:#f7c99c;color:var(--acc-ink)}
.eir-fchip{display:inline-flex;align-items:center;gap:7px;padding:6px 8px 6px 11px;border-radius:99px;border:1px solid #f2b8b1;background:var(--red-bg);color:var(--red);font-size:.82em;font-weight:800;cursor:pointer}
.eir-fchip svg{flex-shrink:0}
.eir-view{margin-left:auto;display:inline-flex;padding:3px;border-radius:9px;background:#e7eaee}
.eir-view button{padding:6px 14px;border:none;border-radius:7px;background:none;font-size:.84em;font-weight:700;color:#5c6773;cursor:pointer}
.eir-view button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,50,.18)}
.eir-res{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.eir-res.is-open{border-color:#cfd6dd;box-shadow:0 12px 26px -22px rgba(20,30,50,.6)}
.eir-res-h{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;border:none;background:#fff;color:var(--ink);text-align:left;cursor:pointer}
.eir-res-h:hover{background:#fafbfc}
.eir-res.is-open .eir-res-h{background:#f7f8fa;border-bottom:1px solid var(--line)}
.eir .eir-res-h:focus-visible{outline-offset:-3px}
.eir-chev{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;color:#818284}
.eir-chev svg{transition:transform .15s}
.eir-res-h[aria-expanded="true"] .eir-chev svg{transform:rotate(90deg)}
.eir-res-h:hover .eir-chev{background:#e6f0fc;color:#2b66c1}
.eir-av{flex-shrink:0;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.86em;font-weight:800;
  background:hsl(var(--h) 60% 92%);color:hsl(var(--h) 55% 28%);border:1px solid hsl(var(--h) 45% 82%)}
.eir-res-id{flex:1 1 auto;min-width:0;display:flex;align-items:center}
.eir-res-name{font-size:.96em;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eir-phd-tag{display:inline-flex;align-items:center;margin-left:8px;padding:2px 8px;border-radius:5px;font-size:.66em;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:#136b67;background:#d2f0ee;border:1px solid #9fd9d4;vertical-align:middle;cursor:default;flex-shrink:0}
.eir-res-bar{flex:0 0 170px}
.eir-res-track{display:block;height:8px;border-radius:99px;background:#eef1f4;overflow:hidden}
.eir-res-fill{display:flex;height:100%;border-radius:inherit;overflow:hidden}
.eir-res-fill i{display:block;height:100%;background:var(--c)}
.eir-res-stats{flex:0 0 auto;min-width:180px;display:flex;justify-content:flex-end;gap:16px;font-size:.82em;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.eir-res-stats b{font-size:1.15em;font-weight:800;color:var(--ink)}
.eir-res-stats .is-e b{color:var(--red)}
@container (max-width:700px){.eir-res-bar{display:none}.eir-res-stats{min-width:0;flex-direction:column;align-items:flex-end;gap:0}}
.eir-res-body{padding:12px 14px 14px}

/* ---- Ticket table ---- */
.eir-scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
.eir-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.86em}
.eir-tbl th,.eir-tbl td{padding:9px 12px;border-bottom:1px solid #eef1f4;text-align:left;vertical-align:middle}
.eir-tbl thead th{position:sticky;top:0;z-index:1;background:#f5f6f8;border-bottom:1px solid var(--line);font-size:.72em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap}
.eir-tbl tbody tr:last-child td{border-bottom:none}
.eir-tbl th.c,.eir-tbl td.c{width:46px;padding-left:6px;padding-right:6px;text-align:center;white-space:nowrap}
.eir-tbl abbr{text-decoration:none;cursor:help}
.eir-th-dot{display:block;width:14px;height:3px;margin:4px auto 0;border-radius:2px;background:var(--c)}
.eir-tbl a{color:#2b66c1;font-weight:800;text-decoration:none;white-space:nowrap}
.eir-tbl a:hover{text-decoration:underline}
.eir-title{display:block;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2a3340}
@container (max-width:900px){.eir-title{max-width:220px}}
.eir-who{display:inline-flex;align-items:center;white-space:nowrap;font-weight:700}
.eir-ic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-weight:800}
.eir-ic.ok{background:var(--grn-bg);color:var(--grn)}
.eir-ic.x{background:var(--red-bg);color:#c0261a}
.eir-ic.x.eir-struck{background:#f1f3f5;color:#a0a8b1}
.eir-ic.na{width:auto;border-radius:0;color:#8793a0;font-weight:700;font-size:.9em}
.eir-msgs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px;min-width:300px}
.eir-msg{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;border-radius:6px;background:#fdf1f0;border:1px solid #f6d3cf;color:#8f1d14;font-size:.92em;font-weight:600;line-height:1.35}
.eir-msg b{padding:1px 5px;border-radius:4px;background:#fff;border:1px solid #f0d7d4;color:#3a4552;font-size:.84em;font-weight:800}
.eir-from{color:var(--red);font-weight:700}
.eir-to{color:var(--grn);font-weight:800}
.eir-msg.eir-struck{background:#f4f5f7;border-color:var(--line);color:#a0a8b1;text-decoration:line-through}
.eir-msg.eir-struck b,.eir-msg.eir-struck .eir-from,.eir-msg.eir-struck .eir-to{color:#a0a8b1}
.eir-tbl tr.eir-row-muted td{opacity:.55}
.eir-tbl tr.eir-row-muted .eir-title{text-decoration:line-through}

/* ---- States ---- */
.eir-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:38px 20px;text-align:center;color:var(--mut)}
.eir-empty-ic{width:58px;height:58px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--grn-bg);color:var(--grn);margin-bottom:4px}
.eir-empty-ic.is-err{background:var(--red-bg);color:var(--red)}
.eir-empty-ic.is-mute{background:#eef1f4;color:#5c6773}
.eir-empty-t{font-size:1.08em!important;font-weight:800;color:var(--ink)!important}
.eir-empty p{font-size:.9em;max-width:52ch;line-height:1.5}
.eir-btn{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:9px 16px;border:none;border-radius:6px;background:#161d2d;color:#f4f3ef;font-size:.86em;font-weight:800;cursor:pointer;transition:background .15s}
.eir-btn:hover{background:#0f1420}
.eir-skel{display:block;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:eirShim 1.4s ease infinite}
.eir-skel-d{background:linear-gradient(90deg,rgba(255,255,255,.08) 25%,rgba(255,255,255,.16) 40%,rgba(255,255,255,.08) 60%);background-size:400% 100%}
@keyframes eirShim{0%{background-position:100% 0}100%{background-position:0 0}}

/* One orchestrated entrance on first paint: hero, KPI cards (staggered), then the sections. */
@keyframes eirUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eir.is-anim .eir-hero{animation:eirUp .45s ease both}
.eir.is-anim .eir-kpi{animation:eirUp .5s ease both}
.eir.is-anim .eir-kpi:nth-child(1){animation-delay:.08s}
.eir.is-anim .eir-kpi:nth-child(2){animation-delay:.14s}
.eir.is-anim .eir-kpi:nth-child(3){animation-delay:.2s}
.eir.is-anim .eir-kpi:nth-child(4){animation-delay:.26s}
.eir.is-anim .eir-scope,.eir.is-anim .eir-card{animation:eirUp .5s ease .3s both}
@media (prefers-reduced-motion:reduce){
  .eir *,.eir *::before,.eir *::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body data-nav-active="errors-in-resolved" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap"></div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=214"></script>
<script>
(function(){
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var ic=function(n,s){ return window.icon?window.icon(n,s||18):''; };
var A=window.PHDAuth;
function $(id){ return document.getElementById(id); }
function num(n){ return (Number(n)||0).toLocaleString('en-US'); }
// Percentage text: one decimal below 10% (so 0.4% does not read as 0%), whole numbers above.
function pct(n,d){ if(!d) return '0%'; var p=n/d*100; return (p>0&&p<10?p.toFixed(1).replace(/\.0$/,''):String(Math.round(p)))+'%'; }
function safeUrl(u){ u=String(u||''); return /^https?:\/\//i.test(u)?u:''; }
function idLink(id,url){ var s=safeUrl(url); return s?'<a href="'+esc(s)+'" target="_blank" rel="noopener noreferrer">'+esc(id)+'</a>':esc(id); }
function fmtTz(iso,tz){
  var d=new Date(iso); if(!iso||isNaN(d)) return '\u2014';
  try{ return new Intl.DateTimeFormat('en-US',{timeZone:tz,month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d); }catch(e){ return '\u2014'; }
}
function fmtWhen(iso){ return fmtTz(iso,'America/Phoenix')+' MST \u00b7 '+fmtTz(iso,'Asia/Kolkata')+' IST'; }
var CHEV='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var TICK='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS='<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 2l6 6M8 2L2 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
var XSM='<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 2l6 6M8 2L2 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

// Presentation-only details per check (the API supplies code/label/enabled/count).
var META={
  A1:{desc:'Title names one of the 28 issue types, spelled exactly',color:'#ec7211'},
  A2:{desc:'Title has a severity tag, #1 to #5',color:'#f5a54a'},
  B1:{desc:'Issue: line is one of the 28 issue types',color:'#1f5fbf'},
  B2:{desc:'Issue: is the same type as the title',color:'#5b8fe6'},
  B3:{desc:'Date: line is filled in',color:'#13827c'},
  B4:{desc:'Res: is on the PHD resolutions list',color:'#4cb3aa'},
  C1:{desc:'Closure code is Successful',color:'#b42318'}
};
var GROUPS=[{k:'A',name:'Title'},{k:'B',name:'SIM Root Cause Details'},{k:'C',name:'Closure'}];
function meta(code){ return META[code]||{desc:'',color:'#8793a0'}; }

// Per-user, view-only "scratched out" checks (non-admin users). The admin's toggles are global (server).
var LS_KEY='phd_eir_hidden_checks';
function loadHidden(){ try{ var v=JSON.parse(localStorage.getItem(LS_KEY)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function saveHidden(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(Object.keys(HIDDEN).filter(function(k){ return HIDDEN[k]; }))); }catch(e){} }

var D=null, LOADING=true, LOAD_ERR='', SAVE_ERR='', SAVING=false, VIEW='res', FIRST=true;
var HIDDEN={}; loadHidden().forEach(function(c){ HIDDEN[c]=true; });
var OPEN={};    // resolver login -> expanded (no search active; collapsed by default)
var SHUT={};    // resolver login -> collapsed while a search is active (search results open by default)
var Q='', FCHK='', PHD_ONLY=false;   // quick filters: search text, check code, PHD agents only
// Checks section expanded/collapsed (collapsed by default; remembered in this browser).
var LS_OPEN='phd_eir_checks_open';
var CHK_OPEN=false; try{ CHK_OPEN=localStorage.getItem(LS_OPEN)==='1'; }catch(e){}

function canEdit(){ return !!(D&&D.canEdit); }
function checkOf(code){ return D?D.checks.filter(function(c){ return c.code===code; })[0]:null; }
function enabledCodes(){ return D?D.checks.filter(function(c){ return c.enabled; }).map(function(c){ return c.code; }):[]; }
// A check is "scratched" for this viewer when it is enabled but unticked locally (non-admin only).
function isScratched(code){ return !canEdit() && !!HIDDEN[code]; }
// Visible (un-scratched) failures of a ticket.
function liveFails(t){ return enabledCodes().filter(function(c){ var r=t.results[c]; return r&&r.pass===false&&!isScratched(c); }); }
// Drop a check filter that can no longer match (check turned off or scratched out).
function fixFilter(){ if(FCHK){ var c=checkOf(FCHK); if(!c||!c.enabled||isScratched(FCHK)) FCHK=''; } }

function query(){ return Q.trim().toLowerCase(); }
function anyFilter(){ return !!(query()||FCHK||PHD_ONLY); }
function filtered(){
  var q=query();
  return D.tickets.filter(function(t){
    if(PHD_ONLY&&!t.resolverPhd) return false;
    if(FCHK&&liveFails(t).indexOf(FCHK)<0) return false;
    if(q&&(String(t.id)+' '+(t.title||'')+' '+(t.resolver||'')).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function isOpen(login){ return query()?!SHUT[login]:!!OPEN[login]; }

// ---------- Hero ----------
function metaHtml(){
  if(LOADING) return '<dl class="eir-meta" aria-hidden="true"><div class="eir-meta-file"><dt>Source file</dt><dd><span class="eir-skel eir-skel-d" style="width:220px;height:14px"></span></dd></div>'+
    '<div><dt>MST</dt><dd><span class="eir-skel eir-skel-d" style="width:130px;height:12px"></span></dd></div><div><dt>IST</dt><dd><span class="eir-skel eir-skel-d" style="width:130px;height:12px"></span></dd></div></dl>';
  if(!D) return '';
  var s=D.source;
  if(!s) return '<p class="eir-meta-none">No uploaded file is stored yet.</p>';
  return '<div class="eir-meta-box"><dl class="eir-meta"><div class="eir-meta-file"><dt>Source file</dt><dd>'+ic('upload',15)+'<span>'+esc(s.file||'(unnamed)')+'</span></dd></div>'+
    (s.uploadedBy?'<div class="eir-meta-wide"><dt>Uploaded by</dt><dd>'+esc(s.uploadedBy)+'</dd></div>':'')+
    '<div><dt>Uploaded (MST)</dt><dd>'+esc(fmtTz(s.uploadedAt,'America/Phoenix'))+'</dd></div>'+
    '<div><dt>Uploaded (IST)</dt><dd>'+esc(fmtTz(s.uploadedAt,'Asia/Kolkata'))+'</dd></div>'+
    '</dl>'+(s.isLatest?'':'<p class="eir-hero-warn" role="note">The latest upload ('+esc(fmtWhen(s.latestUploadAt))+') has no stored file, so the newest stored one is shown.</p>')+
    '</div>';
}
function heroHtml(){
  return '<div class="eir-hero"><div class="eir-hero-in"><div class="eir-hero-main"><span class="eir-hero-ic">'+ic('alert-triangle',24)+'</span><div>'+
    '<p class="eir-eyebrow">Quality audit \u00b7 Resolved tickets</p><h1>Errors in Resolved</h1>'+
    '<p class="eir-hero-sub">Agent-resolved tickets from the latest upload, checked against the title, SIM root cause details and closure rules. Only tickets with at least one error are listed.</p>'+
    '</div></div>'+metaHtml()+'</div></div>';
}

// ---------- KPIs ----------
function kpiCard(cls,icon,label,value,sub,ratio){
  return '<div class="eir-kpi '+cls+'"><p class="eir-kpi-l"><span class="eir-kpi-ic">'+ic(icon,15)+'</span>'+label+'</p>'+
    '<p class="eir-kpi-v">'+value+'</p><p class="eir-kpi-s">'+sub+'</p>'+
    (ratio==null?'':'<div class="eir-kpi-bar" aria-hidden="true"><i style="width:'+Math.max(0,Math.min(100,ratio*100)).toFixed(1)+'%"></i></div>')+'</div>';
}
function kpiHtml(){
  var checked=Number(D.inScope)||0, withErr=0, total=0;
  D.tickets.forEach(function(t){ var n=liveFails(t).length; if(n){ withErr++; total+=n; } });
  var clean=Math.max(0,checked-withErr);
  return '<div class="eir-kpis">'+
    kpiCard('is-base','clipboard','Tickets checked',num(checked),'In scope in the latest upload',null)+
    kpiCard('is-bad','alert','Tickets with errors',num(withErr),'<b>'+pct(withErr,checked)+'</b> of tickets checked',checked?withErr/checked:0)+
    kpiCard('is-warn','flame','Total errors',num(total),withErr?'<b>'+(total/withErr).toFixed(1)+'</b> per ticket with errors':'No errors to count',null)+
    kpiCard('is-good','check-circle','Clean tickets',pct(clean,checked),'<b>'+num(clean)+'</b> pass every check',checked?clean/checked:0)+
    '</div>';
}

// ---------- Scope ----------
function scopeHtml(){
  var x=(D&&D.excluded)||{};
  var chip=function(txt,n){ return '<li class="eir-ign-c">'+txt+'<b>'+num(n)+'</b></li>'; };
  return '<section class="eir-scope" aria-labelledby="eirScopeH"><div class="eir-scope-lead"><span class="eir-scope-ic">'+ic('info',17)+'</span><div>'+
    '<h2 class="eir-scope-h" id="eirScopeH">What\u2019s checked</h2>'+
    '<p class="eir-scope-p">Only tickets <b>resolved by agents</b>. The closure code must be <b>Successful</b>; any other closure code is flagged by <span class="eir-code" style="--c:'+meta('C1').color+'">C1</span>.</p>'+
    '</div></div><ul class="eir-ign" aria-label="Ignored tickets"><li class="eir-ign-k" aria-hidden="true">Ignored</li>'+
    chip('Immediately / Automatically closed',(Number(x.immediatelyResolved)||0)+(Number(x.automaticallyClosed)||0))+
    chip('Duplicate',x.duplicate)+
    chip('Appeal',x.appeal)+
    chip('AUTO-SIM',x.autosim)+
    '</ul></section>';
}

// ---------- Checks ----------
function chkCard(c,editor){
  var m=meta(c.code), off=!c.enabled, hid=c.enabled&&isScratched(c.code);
  var checked=editor?c.enabled:(c.enabled&&!HIDDEN[c.code]);
  var locked=!editor&&off, dis=locked||SAVING;
  var note=off?(editor?'Off for everyone':'Disabled by admin'):(hid?'Hidden for you only':'');
  var cnt=Number(c.count)||0, live=c.enabled&&!hid, active=FCHK===c.code;
  var ratio=(c.enabled&&D.inScope)?Math.min(100,cnt/D.inScope*100):0;
  var noteId='eirChkN'+c.code, descId='eirChkD'+c.code;
  var foot=c.enabled
    ?'<button type="button" class="eir-cnt'+(cnt?'':' is-zero')+'" data-filter="'+c.code+'" aria-pressed="'+active+'"'+(live&&cnt?'':' disabled')+
       ' aria-label="'+num(cnt)+' ticket'+(cnt===1?'':'s')+' failing '+c.code+(live&&cnt?(active?'. Showing only these; press to clear':'. Press to show only these'):'')+'"'+
       ' title="'+(live&&cnt?(active?'Clear this filter':'Show only tickets failing '+c.code):'')+'"><b>'+num(cnt)+'</b><span>ticket'+(cnt===1?'':'s')+'</span></button>'+
       (function(t){return '<span class="eir-chk-pct" title="'+t+'">'+t+'</span>';})(pct(cnt,D.inScope)+' of checked tickets failed '+c.code)
    :'<span class="eir-cnt is-off"><b>\u2014</b><span>not checked</span></span>';
  return '<li class="eir-chk'+(off?' is-off':'')+(hid?' is-hidden':'')+(locked?' is-locked':'')+(active?' is-filter':'')+'" style="--c:'+m.color+'">'+
    '<label class="eir-chk-top" for="eirChk'+c.code+'">'+
      '<input type="checkbox" class="eir-sw-in" id="eirChk'+c.code+'" data-code="'+c.code+'"'+(checked?' checked':'')+(dis?' disabled':'')+
        ' aria-describedby="'+descId+(note?' '+noteId:'')+'">'+
      '<span class="eir-sw" aria-hidden="true"></span>'+
      '<span class="eir-chk-txt"><span class="eir-chk-lbl">'+esc(c.label)+'</span><span class="eir-chk-desc" id="'+descId+'">'+esc(m.desc)+'</span></span>'+
      '<span class="eir-code">'+c.code+'</span></label>'+
    (note?'<span class="eir-chk-note" id="'+noteId+'">'+(off?ic('no-entry',12):ic('eye-off',12))+note+'</span>':'')+
    '<div class="eir-chk-foot">'+foot+'</div>'+
    '<div class="eir-bar" aria-hidden="true"><i style="width:'+ratio.toFixed(1)+'%"></i></div></li>';
}
function checksHtml(){
  var editor=canEdit();
  var groups=GROUPS.map(function(g){
    var list=D.checks.filter(function(c){ return String(c.code).charAt(0)===g.k; });
    if(!list.length) return '';
    var codes=list.map(function(c){ return c.code; });
    return '<div class="eir-grp" role="group" aria-labelledby="eirGrp'+g.k+'"><h3 class="eir-grp-h" id="eirGrp'+g.k+'">'+esc(g.name)+
      ' <span>'+codes[0]+(codes.length>1?'\u2013'+codes[codes.length-1]:'')+'</span></h3>'+
      '<ul class="eir-grid">'+list.map(function(c){ return chkCard(c,editor); }).join('')+'</ul></div>';
  }).join('');
  // Any check whose code does not start with A/B/C still gets shown (future-proof).
  var other=D.checks.filter(function(c){ return 'ABC'.indexOf(String(c.code).charAt(0))<0; });
  if(other.length) groups+='<div class="eir-grp"><h3 class="eir-grp-h">Other</h3><ul class="eir-grid">'+other.map(function(c){ return chkCard(c,editor); }).join('')+'</ul></div>';
  // Compact one-line summary, always visible in the header (reflects admin toggles and this viewer's unticks).
  var nAll=D.checks.length, nAct=D.checks.filter(function(c){ return c.enabled&&!isScratched(c.code); }).length, nErr=0;
  D.tickets.forEach(function(t){ nErr+=liveFails(t).length; });
  var sum='<span class="eir-chk-sum">'+num(nAll)+' check'+(nAll===1?'':'s')+' \u00b7 <b>'+num(nAct)+'</b> active \u00b7 <b class="is-e">'+num(nErr)+'</b> error'+(nErr===1?'':'s')+'</span>';
  var full=editor
    ?'Unticking turns it off for everyone: the check is no longer evaluated or counted. Click a count to filter the list below.'
    :'Untick a check to scratch out its errors on your screen only (saved in this browser). Checks disabled by the admin are greyed out. Click a count to filter the list below.';
  var short=editor
    ?'Unticking turns a check off for everyone. Click a count to filter the list.'
    :'Untick to scratch out a check on your screen only. Click a count to filter the list.';
  var fchk=!CHK_OPEN&&FCHK&&checkOf(FCHK);
  return '<section class="eir-card" aria-labelledby="eirChecksH"><div class="eir-card-head eir-chk-head'+(CHK_OPEN?'':' is-shut')+'">'+
    '<h2 id="eirChecksH"><button type="button" class="eir-chk-exp" id="eirChecksBtn" aria-expanded="'+(CHK_OPEN?'true':'false')+'" aria-controls="eirChecksBody">'+
      '<span class="eir-chev">'+CHEV+'</span>Checks'+sum+'</button></h2>'+
    '<p class="eir-help-1" title="'+esc(full)+'">'+esc(short)+'</p>'+
    (fchk?'<button type="button" class="eir-fchip" data-clear-filter aria-label="Remove filter: failing '+FCHK+' '+esc(fchk.label)+'">Filtered: '+esc(fchk.label)+XSM+'</button>':'')+
    (editor?'<span class="eir-mode">'+ic('users',13)+'Applies to everyone</span>':'<span class="eir-mode is-view">'+ic('eye',13)+'View only \u00b7 this browser</span>')+
    '</div><div id="eirChecksBody"'+(CHK_OPEN?'':' hidden')+'>'+groups+'</div>'+
    '<p class="eir-err" id="eirSaveErr" role="alert">'+esc(SAVE_ERR)+'</p>'+
    '<span class="eir-sr" id="eirLive" aria-live="polite"></span></section>';
}

// ---------- Resolver list ----------
// Small PHD tag next to a resolver login that is a registered agent in the database.
function phdTag(on){ return on?'<span class="eir-phd-tag" role="img" title="PHD agent" aria-label="PHD agent">PHD</span>':''; }
function hueOf(s){ var h=0; s=String(s||''); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return [24,205,165,265,335,45,190,120][h%8]; }
function msgHtml(msg){
  var m=/^Spelling: "([\s\S]*)" \u2192 "([\s\S]*)"$/.exec(String(msg||''));
  if(m) return 'Spelling: <span class="eir-from">\u201c'+esc(m[1])+'\u201d</span> \u2192 <span class="eir-to">\u201c'+esc(m[2])+'\u201d</span>';
  return esc(msg);
}
function cell(t,c){
  var r=t.results[c]||{}, lbl=(checkOf(c)||{}).label||c, nm=esc(c+' '+lbl);
  if(r.disabled) return '<td class="c"><span class="eir-ic na" role="img" aria-label="'+nm+': disabled by admin" title="Disabled by admin">\u2014</span></td>';
  if(r.na) return '<td class="c"><span class="eir-ic na" role="img" aria-label="'+nm+': not evaluated" title="Not evaluated (title or Issue: type not identified)">n/a</span></td>';
  if(r.pass) return '<td class="c"><span class="eir-ic ok" role="img" aria-label="'+nm+': pass" title="Pass">'+TICK+'</span></td>';
  var s=isScratched(c);
  return '<td class="c"><span class="eir-ic x'+(s?' eir-struck':'')+'" role="img" aria-label="'+nm+': fail'+(s?' (hidden by you)':'')+' \u2014 '+esc(r.msg)+'" title="'+esc(r.msg)+'">'+CROSS+'</span></td>';
}
function ticketTable(list,showResolver){
  var codes=D.checks.map(function(c){ return c.code; });
  var head='<tr><th scope="col">Ticket</th>'+(showResolver?'<th scope="col">Resolver</th>':'')+'<th scope="col">Title</th>'+
    D.checks.map(function(c){ return '<th scope="col" class="c" style="--c:'+meta(c.code).color+'"><abbr title="'+esc(c.label)+'">'+c.code+'</abbr><span class="eir-th-dot" aria-hidden="true"></span></th>'; }).join('')+
    '<th scope="col">Errors</th></tr>';
  var rows=list.map(function(t){
    var muted=!liveFails(t).length;
    var msgs=codes.filter(function(c){ var r=t.results[c]; return r&&r.pass===false; }).map(function(c){
      var s=isScratched(c);
      return '<li class="eir-msg'+(s?' eir-struck':'')+'">'+(s?'<span class="eir-sr">Hidden by you: </span>':'')+'<b>'+c+'</b><span>'+msgHtml(t.results[c].msg)+'</span></li>';
    }).join('');
    return '<tr'+(muted?' class="eir-row-muted"':'')+'><td>'+idLink(t.id,t.url)+'</td>'+
      (showResolver?'<td><span class="eir-who">'+esc(t.resolver)+phdTag(t.resolverPhd)+'</span></td>':'')+
      '<td><span class="eir-title" title="'+esc(t.title)+'">'+esc(t.title||'\u2014')+'</span></td>'+
      codes.map(function(c){ return cell(t,c); }).join('')+
      '<td><ul class="eir-msgs">'+msgs+'</ul></td></tr>';
  }).join('');
  return '<div class="eir-scroll" tabindex="0" role="region" aria-label="Tickets with errors"><table class="eir-tbl"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>';
}
function groupsOf(list){
  var map={};
  list.forEach(function(t){
    var g=map[t.resolver]||(map[t.resolver]={login:t.resolver,phd:!!t.resolverPhd,tickets:0,errors:0,by:{},list:[]});
    g.list.push(t);
    var f=liveFails(t); if(f.length){ g.tickets++; g.errors+=f.length; f.forEach(function(c){ g.by[c]=(g.by[c]||0)+1; }); }
  });
  return Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a,b){ return (b.errors-a.errors)||(b.tickets-a.tickets)||a.login.localeCompare(b.login); });
}
function resolverHtml(g,i,maxErr){
  var open=isOpen(g.login), rid='eirRes'+i;
  var segs=D.checks.filter(function(c){ return g.by[c.code]; }).map(function(c){
    return '<i style="--c:'+meta(c.code).color+';flex:'+g.by[c.code]+' 1 0"></i>';
  }).join('');
  var brk=D.checks.filter(function(c){ return g.by[c.code]; }).map(function(c){ return c.code+' '+g.by[c.code]; }).join(', ');
  var w=maxErr?Math.max(4,g.errors/maxErr*100):0;
  return '<div class="eir-res'+(open?' is-open':'')+'">'+
    '<button type="button" class="eir-exp eir-res-h" data-login="'+esc(g.login)+'" aria-expanded="'+(open?'true':'false')+'" aria-controls="'+rid+'">'+
      '<span class="eir-chev">'+CHEV+'</span>'+
      '<span class="eir-av" style="--h:'+hueOf(g.login)+'" aria-hidden="true">'+esc(String(g.login||'?').charAt(0).toUpperCase())+'</span>'+
      '<span class="eir-res-id"><span class="eir-res-name">'+esc(g.login)+'</span>'+phdTag(g.phd)+'</span>'+
      '<span class="eir-res-bar" title="'+esc(brk||'No visible errors')+'" aria-hidden="true"><span class="eir-res-track"><span class="eir-res-fill" style="width:'+(g.errors?w.toFixed(1):0)+'%">'+segs+'</span></span></span>'+
      '<span class="eir-res-stats"><span><b>'+num(g.tickets)+'</b> ticket'+(g.tickets===1?'':'s')+'</span><span class="is-e"><b>'+num(g.errors)+'</b> error'+(g.errors===1?'':'s')+'</span></span>'+
      (brk?'<span class="eir-sr">. By check: '+esc(brk)+'</span>':'')+
    '</button>'+
    '<div class="eir-res-body" id="'+rid+'"'+(open?'':' hidden')+'>'+(open?ticketTable(g.list,false):'')+'</div></div>';
}
function listShell(){
  return '<section class="eir-card" aria-labelledby="eirListH"><div class="eir-list-head"><h2 id="eirListH">Errors by resolver</h2><span class="eir-count" id="eirCount" aria-live="polite"></span></div>'+
    '<div class="eir-tools" role="search" aria-label="Filter tickets">'+
      '<div class="eir-search"><label for="eirQ" class="eir-sr">Search ticket ID, title or resolver</label>'+ic('search',15)+
        '<input type="search" id="eirQ" placeholder="Search ticket ID, title or resolver" autocomplete="off" value="'+esc(Q)+'"></div>'+
      '<label class="eir-tog" for="eirPhd"><input type="checkbox" id="eirPhd"'+(PHD_ONLY?' checked':'')+'>PHD agents only</label>'+
      '<span id="eirFchk"></span>'+
      '<div class="eir-view" role="group" aria-label="View">'+
        '<button type="button" data-view="res" aria-pressed="'+(VIEW==='res')+'">By resolver</button>'+
        '<button type="button" data-view="all" aria-pressed="'+(VIEW==='all')+'">All tickets</button></div>'+
    '</div><div id="eirList"></div></section>';
}
function emptyHtml(icCls,icon,title,text,btn){
  return '<div class="eir-empty"><span class="eir-empty-ic '+icCls+'">'+ic(icon,26)+'</span><h3 class="eir-empty-t">'+title+'</h3>'+(text?'<p>'+text+'</p>':'')+(btn||'')+'</div>';
}
function renderList(){
  var box=$('eirList'); if(!box||!D) return;
  var list=filtered(), body;
  var groups=VIEW==='res'?groupsOf(list):null;
  if(!D.tickets.length) body=emptyHtml('','check-circle','No errors in the latest upload','Every ticket in scope passes all enabled checks.');
  else if(!list.length) body=emptyHtml('is-mute','search','No tickets match these filters','Try a different search, or clear the filters to see every ticket with errors.',
    '<button type="button" class="eir-btn" data-clear-all>Clear filters</button>');
  else if(VIEW==='all') body=ticketTable(list,true);
  else { var mx=groups.reduce(function(m,g){ return Math.max(m,g.errors); },0); body=groups.map(function(g,i){ return resolverHtml(g,i,mx); }).join(''); }
  box.innerHTML=body;
  var h=$('eirListH'); if(h) h.textContent=VIEW==='all'?'All tickets with errors':'Errors by resolver';
  var n=list.length, tot=D.tickets.length;
  var cnt=anyFilter()?num(n)+' of '+num(tot)+' ticket'+(tot===1?'':'s')+' match'
    :(VIEW==='res'?num(groups.length)+' resolver'+(groups.length===1?'':'s')+' \u00b7 ':'')+num(n)+' ticket'+(n===1?'':'s');
  var ce=$('eirCount'); if(ce) ce.textContent=tot?cnt:'';
  var fc=$('eirFchk'), fchk=FCHK&&checkOf(FCHK);
  if(fc) fc.innerHTML=fchk?'<button type="button" class="eir-fchip" data-clear-filter aria-label="Remove filter: failing '+FCHK+' '+esc(fchk.label)+'">Failing '+FCHK+' \u00b7 '+esc(fchk.label)+XSM+'</button>':'';
  document.querySelectorAll('[data-view]').forEach(function(b){ b.setAttribute('aria-pressed',String(b.getAttribute('data-view')===VIEW)); });
}

// ---------- Page ----------
function skeletonHtml(){
  var k='<div class="eir-kpi" aria-hidden="true"><span class="eir-skel" style="width:55%;height:11px"></span><span class="eir-skel" style="width:40%;height:30px;margin-top:14px"></span><span class="eir-skel" style="width:70%;height:10px;margin-top:10px"></span></div>';
  return '<div class="eir-kpis">'+k+k+k+k+'</div>'+
    '<section class="eir-card"><div class="phd-load" role="status"><span class="phd-spin"></span> Loading the latest upload\u2026</div></section>';
}
function render(){
  var w=$('wrap');
  if(LOADING){ w.innerHTML='<div class="eir">'+heroHtml()+skeletonHtml()+'</div>'; return; }
  if(!D){
    w.innerHTML='<div class="eir">'+heroHtml()+'<div class="eir-kpis" aria-hidden="true"></div><section class="eir-card">'+
      emptyHtml('is-err','alert-triangle','Couldn\u2019t load the report','<span role="alert">'+esc(LOAD_ERR||'Could not load the report.')+'</span>',
        '<button type="button" class="eir-btn" id="eirRetry">'+ic('refresh',14)+'Retry</button>')+'</section></div>';
    var rb=$('eirRetry'); if(rb) rb.addEventListener('click',function(){ load(false); });
    return;
  }
  fixFilter();
  w.innerHTML='<div class="eir'+(FIRST?' is-anim':'')+'">'+heroHtml()+kpiHtml()+scopeHtml()+checksHtml()+listShell()+'</div>';
  FIRST=false;
  renderList();
}
function announce(msg){ var l=$('eirLive'); if(l){ l.textContent=''; setTimeout(function(){ l.textContent=msg; },30); } }
function focusSel(sel){ var n=document.querySelector(sel); if(n) n.focus(); }

document.addEventListener('click',function(ev){
  var t=ev.target; if(!t||!t.closest) return;
  var v=t.closest('[data-view]');
  if(v){ VIEW=v.getAttribute('data-view'); renderList(); return; }
  var f=t.closest('[data-filter]');
  if(f){ var code=f.getAttribute('data-filter'); FCHK=FCHK===code?'':code; render(); focusSel('[data-filter="'+code+'"]');
    announce(FCHK?'Showing only tickets failing '+code+'.':'Check filter cleared.'); return; }
  if(t.closest('[data-clear-filter]')){ var was=FCHK; FCHK=''; render(); focusSel(t.closest('.eir-chk-head')?'#eirChecksBtn':(CHK_OPEN&&was?'[data-filter="'+was+'"]':'#eirQ')); announce('Check filter cleared.'); return; }
  if(t.closest('#eirChecksBtn')){ CHK_OPEN=!CHK_OPEN; try{ localStorage.setItem(LS_OPEN,CHK_OPEN?'1':'0'); }catch(e){} render(); focusSel('#eirChecksBtn'); return; }
  if(t.closest('[data-clear-all]')){ Q=''; FCHK=''; PHD_ONLY=false; SHUT={}; render(); focusSel('#eirQ'); return; }
  var x=t.closest('.eir-exp');
  if(x){
    var login=x.getAttribute('data-login');
    if(query()) SHUT[login]=!SHUT[login]; else OPEN[login]=!OPEN[login];
    renderList();
    var btn=Array.prototype.filter.call(document.querySelectorAll('.eir-exp'),function(e){ return e.getAttribute('data-login')===login; })[0];
    if(btn) btn.focus();
  }
});
document.addEventListener('input',function(ev){
  var el=ev.target; if(!el||el.id!=='eirQ') return;
  Q=el.value; SHUT={}; renderList();
});
document.addEventListener('change',function(ev){
  var el=ev.target; if(!el||!el.matches) return;
  if(el.id==='eirPhd'){ PHD_ONLY=el.checked; renderList(); return; }
  if(!el.matches('.eir-chk input[data-code]')) return;
  var code=el.getAttribute('data-code');
  if(canEdit()){ saveGlobal(code,el.checked); return; }
  HIDDEN[code]=!el.checked; saveHidden(); render();
  focusSel('#eirChk'+code);
  announce(code+(el.checked?' errors shown.':' errors scratched out on your screen.'));
});

// Admin (harisss): turn a check on/off for everyone, then reload the report.
async function saveGlobal(code,on){
  var dis=D.checks.filter(function(c){ return c.code===code?!on:!c.enabled; }).map(function(c){ return c.code; });
  var chk=checkOf(code), was=chk?chk.enabled:!on;
  if(chk) chk.enabled=on;   // show the new state while saving
  SAVING=true; SAVE_ERR=''; render();
  var r=null; try{ r=await A.api('PUT','/api/errors-in-resolved/settings',{disabledChecks:dis}); }catch(e){}
  SAVING=false;
  if(!(r&&r.ok)){ if(chk) chk.enabled=was; SAVE_ERR=(r&&r.data&&r.data.error)||'Could not save the setting.'; render(); focusSel('#eirChk'+code); return; }
  await load(true);
  focusSel('#eirChk'+code);
  announce(code+(on?' turned on for everyone.':' turned off for everyone.'));
}

async function load(keep){
  if(!keep){ LOADING=true; render(); }
  var r=null; try{ r=await A.api('GET','/api/errors-in-resolved'); }catch(e){}
  LOADING=false;
  if(r&&r.ok&&r.data&&Array.isArray(r.data.checks)){ D=r.data; LOAD_ERR=''; }
  else if(!keep){ D=null; LOAD_ERR=(r&&r.status===401)?'Your session has expired. Please log in again.':((r&&r.data&&r.data.error)||'Could not load the report.'); }
  else SAVE_ERR=(r&&r.data&&r.data.error)||'Could not reload the report.';
  render();
}

(async function init(){
  if(!A||!A.getUser||!A.getUser()||!A.getToken()){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  try{ if(A.loadMyProfile) await A.loadMyProfile(); }catch(e){}
  load(false);
})();
})();
</script>
</body>
</html>
