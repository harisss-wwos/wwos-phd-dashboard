<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Data Log · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shimmer.css">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252}
.spinner{width:44px;height:44px;border:4px solid var(--bd);border-top-color:var(--o);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;padding:8px 16px;background:var(--o);color:#000;border-radius:5px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.btn.mini{padding:5px 11px;font-size:.76em}
.btn.danger{background:transparent;border:1px solid rgba(255,82,82,.5);color:var(--rl)}
.btn.danger:hover{background:rgba(255,82,82,.12)}
.wrap{max-width:1100px;margin:0 auto;padding:40px 24px}
h1{color:#fff;font-size:1.6em;margin-bottom:6px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:26px}
.log-entry{background:#0a0a0a;border:1px solid var(--bd);border-radius:5px;margin-bottom:16px;overflow:hidden}
.log-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd)}
.log-user{color:#fff;font-weight:700}
.log-role{color:var(--o);text-transform:uppercase;font-size:.72em;font-weight:700;background:rgba(255,153,0,.14);padding:2px 9px;border-radius:5px;margin-left:6px}
.log-when{margin-left:auto;text-align:right;font-size:.82em;color:var(--tm);line-height:1.5}
.log-when b{color:#d5dbdb;font-weight:600}
.log-body{padding:14px 20px}
.log-quarter{font-size:.8em;color:var(--tm);margin-bottom:12px}
.log-quarter b{color:var(--gl)}
/* One upload session = one collapsible card; header is a button, body holds quarter blocks. */
.log-session{background:#0a0a0a;border:1px solid var(--bd);border-radius:5px;margin-bottom:16px;overflow:hidden;display:grid;grid-template-rows:auto 0fr;transition:grid-template-rows .3s ease}
.log-session.open{grid-template-rows:auto 1fr}
.log-session>.log-head{background:#050505;width:100%;border:none;border-bottom:1px solid transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .12s}
.log-session>.log-head:hover{background:#0d0d0d}
.log-session.open>.log-head{border-bottom-color:var(--bd)}
.log-caret{margin-left:14px;color:var(--tm);transition:transform .3s ease;flex-shrink:0}
.log-session.open .log-caret{transform:rotate(180deg)}
.log-session-body{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:14px;padding:0 20px;transition:padding .3s ease}
.log-session.open>.log-session-body{padding:16px 20px}
/* ---- Date sections: each upload day is one collapsible section with a full gradient bg ---- */
.log-date-section{border:1px solid var(--bd);border-radius:5px;margin-bottom:16px;overflow:hidden;display:grid;grid-template-rows:auto 0fr;transition:grid-template-rows .3s ease}
.log-date-section.open{grid-template-rows:auto 1fr}
.log-date-section.log-day-0{border-left:4px solid #4ade80;background:linear-gradient(135deg,rgba(74,222,128,.20),rgba(74,222,128,.04) 75%)}
.log-date-section.log-day-1{border-left:4px solid #60a5fa;background:linear-gradient(135deg,rgba(96,165,250,.20),rgba(96,165,250,.04) 75%)}
.log-date-section.log-day-2{border-left:4px solid #f472b6;background:linear-gradient(135deg,rgba(244,114,182,.20),rgba(244,114,182,.04) 75%)}
.log-date-section.log-day-3{border-left:4px solid #fbbf24;background:linear-gradient(135deg,rgba(251,191,36,.20),rgba(251,191,36,.04) 75%)}
.log-date-section.log-day-4{border-left:4px solid #a78bfa;background:linear-gradient(135deg,rgba(167,139,250,.20),rgba(167,139,250,.04) 75%)}
.log-date-section.log-day-5{border-left:4px solid #22d3ee;background:linear-gradient(135deg,rgba(34,211,238,.20),rgba(34,211,238,.04) 75%)}
.log-date-head{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;background:transparent;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.log-date-head:hover{background:rgba(255,255,255,.05)}
.log-date-title{color:#fff;font-weight:700;font-size:1.05em}
.log-today-badge{color:#4ade80;background:rgba(74,222,128,.15);font-size:.62em;font-weight:700;padding:2px 8px;border-radius:5px;margin-left:8px;vertical-align:middle;letter-spacing:.5px}
.log-date-meta{margin-left:auto;color:var(--tm);font-size:.82em}
.log-date-section>.log-date-head .log-caret{transition:transform .3s ease}
.log-date-section.open>.log-date-head .log-caret{transform:rotate(180deg)}
.log-date-body{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 20px;transition:padding .3s ease}
.log-date-section.open>.log-date-body{padding:4px 20px 18px}
/* Sessions inside a date section: plain cards (the section already carries the day colour) */
.log-date-body .log-session{background:rgba(0,0,0,.35)}
/* Load-more button block */
.log-more{text-align:center;margin:22px 0 4px}
.log-more-note{color:var(--tm);font-size:.8em;margin-top:8px}
/* Loading skeleton: shimmer rows shaped like collapsed date-section headers */
.log-skeleton{display:flex;flex-direction:column;gap:16px}
.sk-date-row{height:58px;border-radius:5px}
/* Uploaded-file details row */
.log-file{display:flex;align-items:center;gap:10px;background:#000;border:1px solid var(--bd);border-radius:5px;padding:10px 14px}
.log-file-icon{font-size:1.1em;flex-shrink:0}
.log-file-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.lf-name{color:#d5dbdb;font-weight:600;font-size:.86em;word-break:break-all}
.lf-sub{color:var(--tm);font-size:.76em}
.log-quarter-block{background:#000;border:1px solid var(--bd);border-radius:5px;padding:14px 16px}
.log-quarter-block.live{border-left:3px solid #4ade80}
.log-quarter-block.past{border-left:3px solid #fbbf24}
.log-quarter-block .log-quarter.live b{color:#4ade80}
.log-quarter-block .log-quarter.past b{color:#fbbf24}
.change-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chg{background:#000;border:1px solid var(--bd);border-radius:5px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:.85em}
.chg .k{color:var(--tm)}
.chg .v{font-weight:700}
.chg .v.added{color:var(--gl)}.chg .v.updated{color:#fbbf24}.chg .v.reopened{color:#a78bfa}
.chg .v.autoClosed{color:#44b9d6}.chg .v.unchanged{color:var(--tm)}.chg .v.missing{color:var(--rl)}
.nochg{color:var(--tm);font-size:.85em;font-style:italic}
/* Exact ShortIds changed (2026-Q2 only) */
.tk-changes{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.tk-group-title{font-size:.75em;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.tk-group-title.added{color:var(--gl)}.tk-group-title.updated{color:#fbbf24}
.tk-chips{display:flex;flex-wrap:wrap;gap:8px}
.tk-chip{background:#000;border:1px solid var(--bd);border-radius:5px;padding:4px 10px;font-size:.82em}
.tk-chip a{color:#44b9d6;text-decoration:none;font-weight:600}
.tk-chip a:hover{text-decoration:underline}
.gate{text-align:center;padding:50px 0}.gate p{color:var(--tm);margin-bottom:18px}
.empty{text-align:center;color:var(--tm);padding:40px;border:1px dashed var(--bd);border-radius:5px}

/* Global: main content spans 90% of the viewport at all sizes. */
.wrap,.content{width:auto!important;max-width:none!important;margin-left:15px!important;margin-right:15px!important}
</style>
<link rel="stylesheet" href="theme.css">

<!-- ===== Light-theme page override (loaded last, wins the cascade) ===== -->
<style id="dl-light">
/* Text colours — the main gap the user flagged. */
h1{color:#1b2026!important}
.sub{color:#5c6773!important}
.log-user{color:#1b2026!important}
.log-role{color:#b5560c!important;background:#fff4e8!important}
.log-when{color:#5c6773!important}
.log-when b{color:#1b2026!important}
.log-quarter{color:#5c6773!important}
.log-date-title{color:#1b2026!important}
.log-date-meta{color:#5c6773!important}
.lf-name{color:#1b2026!important;font-weight:600;font-size:.86em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lf-sub{color:#5c6773!important;margin-left:auto;flex:0 0 auto;white-space:nowrap;font-size:.78em}
.chg .k{color:#5c6773!important}

.tk-group-title.added{color:#1f9d57!important}

.log-session>.log-head{background:#f7f9fb!important}

.log-session.open>.log-head{border-bottom-color:#eef1f4!important}
.log-caret{color:#9aa5b1!important}
.log-date-head:hover{background:rgba(20,40,70,.04)!important}
.log-file,.log-quarter-block,.chg,.tk-chip{background:#f7f9fb!important;border:1px solid #e6eaee!important}
.log-quarter-block.live{border-left:3px solid #1f9d57!important}
.log-quarter-block.past{border-left:3px solid #e08a1e!important}
.log-quarter-block .log-quarter.live b{color:#1f9d57!important}
.log-quarter-block .log-quarter.past b{color:#b5680c!important}
.log-quarter b{color:#1f9d57!important}
.log-date-body .log-session{background:rgba(255,255,255,.75)!important}
.tk-chip a{color:#1577a0!important}
/* Day-section gradient tints — lighten so they read as soft pastel bands on white. */
.log-date-section{border:1px solid #e2e6ea!important}
.log-date-section.log-day-0{border-left:4px solid #1f9d57!important;background:linear-gradient(135deg,rgba(31,157,87,.10),rgba(31,157,87,.02) 75%)!important}
.log-date-section.log-day-1{border-left:4px solid #3b82f6!important;background:linear-gradient(135deg,rgba(59,130,246,.10),rgba(59,130,246,.02) 75%)!important}
.log-date-section.log-day-2{border-left:4px solid #db2777!important;background:linear-gradient(135deg,rgba(219,39,119,.09),rgba(219,39,119,.02) 75%)!important}
.log-date-section.log-day-3{border-left:4px solid #e08a1e!important;background:linear-gradient(135deg,rgba(224,138,30,.10),rgba(224,138,30,.02) 75%)!important}
.log-date-section.log-day-4{border-left:4px solid #7c5cff!important;background:linear-gradient(135deg,rgba(124,92,255,.09),rgba(124,92,255,.02) 75%)!important}
.log-date-section.log-day-5{border-left:4px solid #0891b2!important;background:linear-gradient(135deg,rgba(8,145,178,.10),rgba(8,145,178,.02) 75%)!important}
.log-today-badge{color:#1f9d57!important;background:#eafaf0!important}
/* Buttons. */
.btn{background:linear-gradient(180deg,#ff9f2e,#f07d0a)!important;color:#fff!important;border:none!important}
.btn.sec{background:#fff!important;border:1px solid #e2e6ea!important;color:#b5560c!important}
.btn.sec:hover{border-color:#ec7211!important;color:#ec7211!important;background:#fff4e8!important}
.btn.danger{background:#fff!important;border:1px solid rgba(220,38,38,.4)!important;color:#dc2626!important}
.btn.danger:hover{background:#fef2f2!important}
.log-more-note{color:#5c6773!important}
.empty{border-color:#d4dce4!important;color:#8793a0!important}
/* New upload change summary (no quarter ref): two stat tiles — added + updated. */
.ul-change-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ul-chg{background:#f7f9fb!important;border:1px solid #e6eaee;border-radius:5px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.ul-chg .ul-chg-n{font-size:1.5em;font-weight:800;line-height:1;color:#1b2026}
.ul-chg .ul-chg-l{font-size:.78em;font-weight:600;color:#5c6773}
.ul-chg.added{border-left:3px solid #1f9d57}
.ul-chg.added .ul-chg-n{color:#1f9d57}
.ul-chg.updated{border-left:3px solid #b5680c}
.ul-chg.updated .ul-chg-n{color:#b5680c}
@media(max-width:480px){.ul-change-grid{grid-template-columns:1fr}}
/* Embed-only extras (avatar, day icon tile, second-timezone chip, skeleton) stay hidden on the full page. */
.log-av,.log-date-ic,.log-when-alt,.dl-sk{display:none}
.log-role:empty{display:none}
.log-spin{display:inline-block;width:14px;height:14px;margin-right:8px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;vertical-align:-2px}
/* ===== Embedded ("Update Data Log" modal) — matches the .tbl-/.tbu- dialog language ===== */
/* Hide the page title + description — the modal has its own navy hero header. */
body.dl-embed{background:#fff!important;color:#1b2026;min-height:100vh;display:flex;flex-direction:column}
html:has(body.dl-embed){background:#fff!important;scrollbar-gutter:auto}
body.dl-embed .top-bar{display:none!important}
/* Grid cards: let the single column shrink so long rows wrap instead of overflowing on phones. */
body.dl-embed .log-date-section,body.dl-embed .log-session{grid-template-columns:minmax(0,1fr)}
body.dl-embed .log-head,body.dl-embed .log-date-head{min-width:0}

body.dl-embed .wrap{flex:1 0 auto;display:flex;flex-direction:column;width:auto!important;margin:0!important;padding:18px 22px 0!important;max-width:none!important}
body.dl-embed :is(button,a):focus-visible{outline:3px solid #f0a35a!important;outline-offset:2px}
/* Loading skeleton (replaces the spinner line in the modal). */
body.dl-embed .phd-load{display:none!important}
body.dl-embed .dl-sk{display:flex;gap:12px;padding-left:24px}

/* Vertical timeline of day cards. */

body.dl-embed .log-date-section.open::before{background:var(--day)}
body.dl-embed .log-date-section.log-day-1{--day:#3b82f6;--day-soft:rgba(59,130,246,.09)}
body.dl-embed .log-date-section.log-day-2{--day:#db2777;--day-soft:rgba(219,39,119,.08)}
body.dl-embed .log-date-section.log-day-3{--day:#d97706;--day-soft:rgba(217,119,6,.09)}
body.dl-embed .log-date-section.log-day-4{--day:#7c3aed;--day-soft:rgba(124,58,237,.08)}
body.dl-embed .log-date-section.log-day-5{--day:#0891b2;--day-soft:rgba(8,145,178,.09)}
body.dl-embed .log-date-head{gap:12px;min-height:60px;padding:12px 14px 12px 14px;border-radius:0 11px 11px 0}
body.dl-embed .log-date-head:hover{background:var(--day-soft)!important}
body.dl-embed .log-date-ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:34px;height:34px;border-radius:10px;background:var(--day-soft);color:var(--day)}
body.dl-embed .log-date-title{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0;font-size:.98em;font-weight:800;color:#1b2026!important}
body.dl-embed .log-today-badge{margin:0!important;padding:3px 8px;border-radius:999px;font-size:.6em;font-weight:800;letter-spacing:.8px;color:#15803d!important;background:#ecfdf3!important;border:1px solid #bbe7cc}
body.dl-embed .log-today-badge.log-yday-badge{color:#3d4753!important;background:#f2f4f7!important;border-color:#e2e7eb}
body.dl-embed .log-date-meta{margin-left:auto;flex-shrink:0;display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:#f2f4f7;border:1px solid #e2e7eb;color:#3d4753!important;font-size:.76em;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
body.dl-embed .log-caret{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:30px;height:30px;margin-left:2px;border-radius:50%;background:#f2f4f7;color:#5c6773!important}
body.dl-embed .log-date-body{gap:8px;padding:0 14px}

/* Expanded upload details: file row + stat tiles (added green, updated amber) + ticket chips. */

body.dl-embed .log-quarter-block{padding:0!important;background:transparent!important;border:none!important}
body.dl-embed .ul-change-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
body.dl-embed .ul-chg{flex-direction:row;align-items:baseline;gap:10px;padding:10px 14px;border-radius:10px;background:#fff!important;border:1px solid #e6eaee!important;border-top:3px solid #98a2b3!important;box-shadow:0 1px 2px rgba(16,24,40,.05)}
body.dl-embed .ul-chg .ul-chg-n{font-size:1.45em;font-variant-numeric:tabular-nums}
body.dl-embed .ul-chg.added{border-top-color:#16a34a!important;background:linear-gradient(180deg,#f0fdf4,#fff 75%)!important}
body.dl-embed .ul-chg.added .ul-chg-n{color:#15803d}
body.dl-embed .ul-chg.updated{border-top-color:#f59e0b!important;background:linear-gradient(180deg,#fffbeb,#fff 75%)!important}
body.dl-embed .ul-chg.updated .ul-chg-n{color:#b45309}
body.dl-embed .tk-chips{gap:6px}
body.dl-embed .tk-chip{padding:3px 10px;border-radius:999px;background:#fff!important}
body.dl-embed .tk-chip a{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95em}
/* Footer: pinned to the bottom of the modal body; muted note + primary orange action. */
body.dl-embed .log-more{position:sticky;bottom:0;z-index:2;display:flex;flex-direction:row-reverse;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:auto -22px 0!important;padding:12px 22px;text-align:left;background:rgba(255,255,255,.96);border-top:1px solid #e6eaee;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.dl-embed .log-more-note{margin:0!important;color:#5c6773!important;font-size:.8em}
body.dl-embed #wrap .log-more .btn{height:40px;padding:0 18px;gap:8px;border-radius:10px!important;font-family:inherit;font-size:.88em;font-weight:700;background:linear-gradient(180deg,#c2570a,#a94a05)!important;color:#fff!important;border:1px solid #9a4100!important;box-shadow:0 10px 22px -12px rgba(236,114,17,.9),inset 0 1px 0 rgba(255,255,255,.18)!important;transition:filter .15s,transform .1s}
body.dl-embed #wrap .log-more .btn:hover:not(:disabled){filter:brightness(1.08)}
body.dl-embed #wrap .log-more .btn:active:not(:disabled){transform:translateY(1px)}
body.dl-embed #wrap .log-more .btn svg{color:#fff!important}
body.dl-embed #wrap .log-more .btn[aria-busy="true"]{cursor:progress;opacity:.9}
body.dl-embed #wrap .log-more .btn:disabled:not([aria-busy="true"]){cursor:default;background:#f2f4f7!important;color:#667085!important;border-color:#e2e7eb!important;box-shadow:none!important}
body.dl-embed #wrap .log-more .btn:disabled:not([aria-busy="true"]) svg{color:#16a34a!important}
/* Empty + error states. */
body.dl-embed .empty{margin-bottom:18px;border-radius:12px}
body.dl-embed .gate{padding:40px 16px}
body.dl-embed .gate h1{font-size:1.15em;margin-bottom:6px}
body.dl-embed .log-err-ic{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-bottom:12px;border-radius:12px;background:#fef3f2;border:1px solid #fecdca;color:#b42318}
body.dl-embed #wrap .gate .btn{color:#fff!important;height:40px;padding:0 18px;gap:8px;border-radius:10px!important;font-weight:700;background:linear-gradient(180deg,#c2570a,#a94a05)!important;border:1px solid #9a4100!important}
@media(max-width:560px){
  body.dl-embed .wrap{padding:14px 12px 0!important}
  body.dl-embed .log-more{margin:auto -12px 0!important;padding:10px 12px;flex-direction:column;align-items:stretch;text-align:center}
  body.dl-embed #wrap .log-more .btn{justify-content:center}
  body.dl-embed .log-timeline,body.dl-embed .dl-sk{padding-left:20px}
  body.dl-embed .log-timeline::before{left:5px}
  body.dl-embed .log-date-section::before{left:-23px}
  body.dl-embed .log-date-ic{display:none}
  body.dl-embed .log-date-head{padding:10px 10px 10px 12px;gap:8px}
  body.dl-embed .log-when,body.dl-embed .log-when.log-when-alt{margin-left:40px}
  body.dl-embed .ul-change-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  body.dl-embed *{transition:none!important}
  body.dl-embed .shimmer::after{animation:none}
  .log-spin{animation-duration:1.6s}
}
</style>

<body data-nav-active="data-log" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>

<div class="wrap" id="wrap"><h1>Update Data Log</h1><p class="sub" style="font-size:.9em;margin:4px 0 24px">History of data uploads to the live dashboard — who uploaded, when (IST), and what changed. Latest first.</p><div class="phd-load"><span class="phd-spin"></span> Loading upload history…</div><div class="log-skeleton dl-sk" role="status" aria-label="Loading upload history"><div class="shimmer sk-date-row"></div><div class="shimmer sk-date-row"></div><div class="shimmer sk-date-row"></div></div></div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=217"></script>
<script>
const A=window.PHDAuth;
// Inline SVG icon helper (icons.js exposes window.icon).
const ic=(n,s)=>(typeof window.icon==='function'?window.icon(n,s||15):'');
// Embedded in the index.html "View upload log" modal? Tag the body so embed-only CSS applies
// (hide the page title/description, restyle the load-more button).
try{ if(/[?&]embed=1\b/.test(location.search) || window.self!==window.top) document.body.classList.add('dl-embed'); }catch(e){ document.body.classList.add('dl-embed'); }
// Embedded: report the loaded window to the parent modal's header chips, and let Esc close it.
function dlMeta(m){ try{ if(window.parent!==window && window.parent.PHDUploadLogMeta) window.parent.PHDUploadLogMeta(m); }catch(e){} }
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  try{ if(window.parent!==window && window.parent.PHDCloseUploadLog) window.parent.PHDCloseUploadLog(); }catch(_){}
});

// Format an ISO timestamp into a timezone label. Uses Intl with the IANA zone.
function fmtTZ(iso,zone){
  try{
    return new Date(iso).toLocaleString('en-US',{timeZone:zone,day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
  }catch(e){ return iso; }
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function gate(msg){document.getElementById('wrap').innerHTML='<div class="gate"><h1>Update Data Log</h1><p>'+msg+'</p><a class="btn" href="app.html">Go to Live Dashboard</a></div>';}
// Fetch failure: error state with a Retry that re-requests the same day window.
function failState(msg){
  dlMeta({error:true});
  document.getElementById('wrap').innerHTML='<div class="gate log-err" role="alert">'+
    '<span class="log-err-ic" aria-hidden="true">'+(typeof ic==='function'?ic('alert-triangle',22):'!')+'</span>'+
    '<h1>Couldn\u2019t load the data log</h1><p>'+esc(msg)+'</p>'+
    '<button type="button" class="btn" id="logRetry" onclick="this.disabled=true;this.setAttribute(\'aria-busy\',\'true\');load(DAYS_LOADED)">'+(typeof ic==='function'?ic('refresh',15)+' ':'')+'Retry</button></div>';
}

function changeCells(cs){
  if(!cs)return '<div class="nochg">No change summary recorded for this upload.</div>';
  const items=[
    ['Added','added'],['Updated','updated'],['Reopened','reopened'],
    ['Auto-closed','autoClosed'],['Unchanged','unchanged'],['Not in file','missing']
  ];
  return '<div class="change-grid">'+items.map(([label,key])=>{
    const v=cs[key];
    if(v==null)return '';
    return '<div class="chg"><span class="k">'+label+'</span><span class="v '+key+'">'+v+'</span></div>';
  }).join('')+'</div>';
}

// Human-readable byte size.
function fmtBytes(b){
  b=Number(b);
  if(!isFinite(b)||b<=0)return '';
  const u=['B','KB','MB','GB'];let i=0;
  while(b>=1024&&i<u.length-1){b/=1024;i++;}
  return (i===0?b:b.toFixed(b>=10?0:1))+' '+u[i];
}

// The uploaded-file details (name / size / type) captured at upload time, if present.
// Reads from whichever item in the session carries them (they're the same for the whole upload).
function fileMetaHtml(items){
  const it=(items||[]).find(x=>x&&(x.fileName||x.fileSize||x.fileType))||{};
  if(!it.fileName&&!it.fileSize&&!it.fileType)return '';
  const size=fmtBytes(it.fileSize);
  const right=[size,esc(it.fileType||'')].filter(Boolean).join(' · ');
  return '<div class="log-file">'+
    '<span class="log-file-icon" aria-hidden="true">📄</span>'+
    '<span class="lf-name">'+esc(it.fileName||'Uploaded file')+'</span>'+
    (right?'<span class="lf-sub">'+right+'</span>':'')+
  '</div>';
}

// Chips listing the exact ShortIds added/updated (only recorded for 2026-Q2 merges).
function ticketChips(ids){
  return (ids||[]).map(id=>'<span class="tk-chip"><a href="https://t.corp.amazon.com/issues/'+encodeURIComponent(id)+'" target="_blank" rel="noopener">'+esc(id)+'</a></span>').join('');
}
function changedTicketsBlock(ct){
  if(!ct)return ''; // only present for 2026-Q2
  const added=(ct.added||[]),updated=(ct.updated||[]);
  if(!added.length&&!updated.length)return '';
  let h='<div class="tk-changes">';
  if(added.length)h+='<div class="tk-group"><div class="tk-group-title added">Added tickets ('+added.length+')</div><div class="tk-chips">'+ticketChips(added)+'</div></div>';
  if(updated.length)h+='<div class="tk-group"><div class="tk-group-title updated">Updated tickets ('+updated.length+')</div><div class="tk-chips">'+ticketChips(updated)+'</div></div>';
  h+='</div>';
  return h;
}

// Delete access opened to admins and above (was owner-only). Name kept for existing callers.
const isOwner=()=>A.atLeast&&A.atLeast('admin');
function render(entries){
  const wrap=document.getElementById('wrap');
  const owner=isOwner();
  const qid=new URLSearchParams(location.search).get('qid');
  if(qid)entries=entries.filter(e=>e.liveQuarter===qid);
  const heading=qid?('Update Data Log — '+esc(qid)):'Update Data Log';
  const subText=qid
    ?('History of data uploads/merges into <b>'+esc(qid)+'</b> — who, when ('+esc(MY_TZ)+'), and what changed. Latest first.')
    :'History of data uploads to the live dashboard — who uploaded, when ('+esc(MY_TZ)+'), and what changed. Latest first.';
  let html='<h1>'+heading+'</h1><p class="sub">'+subText+'</p>';
  if(!entries.length){
    html+='<div class="empty">No '+(qid?('uploads recorded for '+esc(qid)+' yet.'):'uploads recorded yet.')+'</div>';
    wrap.innerHTML=html;dlMeta({days:DAYS_LOADED,uploads:0,tz:MY_TZ,hasMore:HAS_MORE});return;
  }
  // Group entries that belong to the SAME upload (same user + same timestamp) into one section.
  // A single upload can write both the live quarter and one or more past quarters — each is its
  // own log entry, but they share e.at, so we cluster them together.
  const groups=[];const byKey={};
  entries.forEach(e=>{
    const key=(e.user||'')+'|'+(e.at||'');
    if(!byKey[key]){byKey[key]={at:e.at,user:e.user,role:e.role,items:[]};byKey[key]._i=groups.length;groups.push(byKey[key]);}
    byKey[key].items.push(e);
  });
  // Newest first (entries already arrive sorted desc, so groups are in that order).

  // One upload's change block within a session. No quarter reference — just what the uploaded file
  // brought in: newly added tickets + tickets with updated fields.
  function quarterBlock(e){
    const cs=e.changeSummary||{};
    const added=Number(cs.added||0), updated=Number(cs.updated||0);
    const summary='<div class="ul-change-grid">'+
      '<div class="ul-chg added"><span class="ul-chg-n">'+added+'</span><span class="ul-chg-l">Newly added tickets</span></div>'+
      '<div class="ul-chg updated"><span class="ul-chg-n">'+updated+'</span><span class="ul-chg-l">Tickets with updated fields</span></div>'+
    '</div>';
    return '<div class="log-quarter-block live">'+
      summary+
      changedTicketsBlock(e.changedTickets)+
    '</div>';
  }

  // Group sessions by upload DAY (in the user's timezone). Each day becomes a collapsible SECTION.
  const zone=TZ_ZONE[MY_TZ]||TZ_ZONE.IST;
  const altTz=MY_TZ==='MST'?'IST':'MST'; // second-zone chip (shown in the modal only)
  const dayKey=(iso)=>{try{return new Date(iso).toLocaleDateString('en-CA',{timeZone:zone});}catch(e){return 'x';}};
  const todayKey=(()=>{try{return new Date().toLocaleDateString('en-CA',{timeZone:zone});}catch(e){return '';}})();
  // Calendar day before todayKey (YYYY-MM-DD), for the YESTERDAY pill.
  const ydayKey=(()=>{try{const d=new Date(todayKey+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10);}catch(e){return '';}})();
  const icn=(n,s)=>(typeof ic==='function'?ic(n,s):'');
  const caret='<span class="log-caret" aria-hidden="true">'+(typeof ic==='function'?ic('chevron-down',16):'▾')+'</span>';
  // Pretty day label, e.g. "11th Sep 2026".
  const ord=(n)=>{const s=['th','st','nd','rd'];const v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
  const dayLabel=(iso)=>{try{const d=new Date(iso);const parts=new Intl.DateTimeFormat('en-US',{timeZone:zone,day:'numeric',month:'short',year:'numeric'}).formatToParts(d);const get=(t)=>{const p=parts.find(x=>x.type===t);return p?p.value:'';};return ord(parseInt(get('day'),10))+' '+get('month')+' '+get('year');}catch(e){return iso;}};

  // Order days newest-first, preserving the (already newest-first) group order.
  const dayOrder=[]; const dayGroups={};
  groups.forEach(g=>{const k=dayKey(g.at);if(!dayGroups[k]){dayGroups[k]=[];dayOrder.push(k);}dayGroups[k].push(g);});
  // Colour index per day (rotates) — used for the gradient background on the whole date section.
  const dayColorIdx={}; dayOrder.forEach((k,i)=>{dayColorIdx[k]=i%6;});

  // One upload session card (inside a date section).
  function sessionCard(g){
    const items=g.items.slice().sort((a,b)=>(a.pastQuarterMerge?1:0)-(b.pastQuarterMerge?1:0));
    const fileMeta=fileMetaHtml(items);
    return ''+
    '<div class="log-session">'+
      '<button type="button" class="log-head" aria-expanded="false" onclick="toggleSession(this)">'+
        '<span class="log-av" aria-hidden="true">'+esc((String(g.user||'?').trim().charAt(0)||'?').toUpperCase())+'</span>'+
        '<span class="log-user">'+esc(g.user)+'<span class="log-role">'+esc(g.role||'')+'</span></span>'+
        '<span class="log-when"><b class="log-tz">'+esc(MY_TZ)+'<span class="log-tz-c">:</span></b> <span class="log-tm">'+fmtTZ(g.at,zone)+'</span></span>'+
        '<span class="log-when log-when-alt"><b class="log-tz">'+altTz+'</b> <span class="log-tm">'+fmtTZ(g.at,TZ_ZONE[altTz])+'</span></span>'+
        caret+
      '</button>'+
      '<div class="log-session-body">'+fileMeta+items.map(quarterBlock).join('')+'</div>'+
    '</div>';
  }

  html+='<div class="log-timeline">'+dayOrder.map(k=>{
    const dGroups=dayGroups[k];
    const isToday=(k===todayKey);
    const cnt=dGroups.length;
    const colorCls=' log-day-'+dayColorIdx[k];
    // All date sections start COLLAPSED (including today); today keeps its badge.
    return ''+
    '<div class="log-date-section'+colorCls+'">'+
      '<button type="button" class="log-date-head" aria-expanded="false" onclick="toggleDateSection(this)">'+
        '<span class="log-date-ic" aria-hidden="true">'+icn('calendar',17)+'</span>'+
        '<span class="log-date-title">'+esc(dayLabel(dGroups[0].at))+(isToday?' <span class="log-today-badge">TODAY</span>':(k===ydayKey?' <span class="log-today-badge log-yday-badge">YESTERDAY</span>':''))+'</span>'+
        '<span class="log-date-meta">'+cnt+' upload'+(cnt===1?'':'s')+'</span>'+
        caret+
      '</button>'+
      '<div class="log-date-body">'+dGroups.map(sessionCard).join('')+'</div>'+
    '</div>';
  }).join('')+'</div>';
  // "Load more" — enabled only when the server signalled there are older days beyond the current
  // window; otherwise the footer keeps a disabled "All uploads loaded" button.
  if(!qid){
    html+='<div class="log-more">'+(HAS_MORE
      ?'<button type="button" id="logLoadMore" class="btn" onclick="loadMoreDays()">'+icn('history',15)+' Load 2 More Days</button>'
      :'<button type="button" id="logLoadMore" class="btn" disabled>'+icn('check',15)+' All uploads loaded</button>')+
      '<p class="log-more-note">Showing the last '+DAYS_LOADED+' day'+(DAYS_LOADED===1?'':'s')+' of uploads.</p></div>';
  }
  wrap.innerHTML=html;
  dlMeta({days:DAYS_LOADED,uploads:groups.length,tz:MY_TZ,hasMore:HAS_MORE});
}

// Owner-only: delete all log entries in a session (they share user+timestamp).
async function delSession(idsJson){
  let ids;try{ids=JSON.parse(idsJson);}catch(e){ids=[];}
  if(!ids.length)return;
  if(!await window.PHDConfirm({title:'Delete data-log entry',body:'Delete this data-log entry? This cannot be undone.',okLabel:'Delete',danger:true}))return;
  for(const id of ids){ try{await A.api('DELETE','/api/data-log/'+id);}catch(e){} }
  load(DAYS_LOADED); // reload the same window
}

// Expand/collapse a session card.
function toggleSession(btn){
  const card=btn.closest('.log-session');
  if(!card)return;
  const isOpen=card.classList.toggle('open');
  btn.setAttribute('aria-expanded',isOpen?'true':'false');
}
// Expand/collapse a whole date section. Accordion: opening one collapses the others (only one day
// expanded at a time).
function toggleDateSection(btn){
  const sec=btn.closest('.log-date-section');
  if(!sec)return;
  const willOpen=!sec.classList.contains('open');
  if(willOpen){
    document.querySelectorAll('.log-date-section.open').forEach(function(s){
      if(s!==sec){ s.classList.remove('open'); var b=s.querySelector('.log-date-head'); if(b) b.setAttribute('aria-expanded','false'); }
    });
  }
  sec.classList.toggle('open',willOpen);
  btn.setAttribute('aria-expanded',willOpen?'true':'false');
}

let MY_TZ='IST'; // logged-in user's preferred timezone (IST|MST)
const TZ_ZONE={IST:'Asia/Kolkata',MST:'America/Denver'};
let DAYS_LOADED=3;   // how many distinct upload-days we're currently showing (starts at 3)
let HAS_MORE=false;  // does the server have older days beyond what we've loaded?
let _tzFetched=false;

// Load the most-recent `days` distinct upload-days. "Load more" bumps this by 2.
async function load(days){
  DAYS_LOADED=days||3;
  if(!A.getUser()||!A.getToken()){gate('This page is for logged-in users. Log in from the Live Dashboard first.');return;}
  if(!_tzFetched){ try{MY_TZ=await A.myTimezone();}catch(e){} _tzFetched=true; }
  let r;
  try{ r=await A.api('GET','/api/data-log?days='+DAYS_LOADED); }
  catch(e){ failState('The server could not be reached. Check your connection and try again.'); return; }
  if(r.status===401){gate('Session expired. Please log in again from the Live Dashboard.');return;}
  if(!r.ok){failState('Could not load the data log (HTTP '+r.status+').');return;}
  // New paginated shape { days, hasMore, entries }. (Tolerate the old bare-array shape too.)
  const data=r.data||{};
  const entries=Array.isArray(data)?data:(data.entries||[]);
  HAS_MORE=Array.isArray(data)?false:!!data.hasMore;
  render(entries);
}
// "Load more" — pull 2 additional days.
function loadMoreDays(){
  const btn=document.getElementById('logLoadMore');
  if(btn){ btn.disabled=true; btn.setAttribute('aria-busy','true'); btn.innerHTML='<span class="log-spin" aria-hidden="true"></span>Loading…'; }
  load(DAYS_LOADED+2);
}
load(3);
</script>
