<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Data Log · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shimmer.css">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252}
.spinner{width:44px;height:44px;border:4px solid var(--bd);border-top-color:var(--o);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;padding:8px 16px;background:var(--o);color:#000;border-radius:6px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.btn.mini{padding:5px 11px;font-size:.76em}
.btn.danger{background:transparent;border:1px solid rgba(255,82,82,.5);color:var(--rl)}
.btn.danger:hover{background:rgba(255,82,82,.12)}
.wrap{max-width:1100px;margin:0 auto;padding:40px 24px}
h1{color:#fff;font-size:1.6em;margin-bottom:6px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:26px}
.log-entry{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;margin-bottom:16px;overflow:hidden}
.log-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd)}
.log-user{color:#fff;font-weight:700}
.log-role{color:var(--o);text-transform:uppercase;font-size:.72em;font-weight:700;background:rgba(255,153,0,.14);padding:2px 9px;border-radius:20px;margin-left:6px}
.log-when{margin-left:auto;text-align:right;font-size:.82em;color:var(--tm);line-height:1.5}
.log-when b{color:#d5dbdb;font-weight:600}
.log-body{padding:14px 20px}
.log-quarter{font-size:.8em;color:var(--tm);margin-bottom:12px}
.log-quarter b{color:var(--gl)}
/* One upload session = one collapsible card; header is a button, body holds quarter blocks. */
.log-session{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;margin-bottom:16px;overflow:hidden}
.log-session>.log-head{background:#050505;width:100%;border:none;border-bottom:1px solid transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .12s}
.log-session>.log-head:hover{background:#0d0d0d}
.log-session.open>.log-head{border-bottom-color:var(--bd)}
.log-caret{margin-left:14px;color:var(--tm);transition:transform .18s;flex-shrink:0}
.log-session.open .log-caret{transform:rotate(180deg)}
.log-session-body{padding:16px 20px;display:none;flex-direction:column;gap:14px}
.log-session.open .log-session-body{display:flex}
/* ---- Date sections: each upload day is one collapsible section with a full gradient bg ---- */
.log-date-section{border:1px solid var(--bd);border-radius:12px;margin-bottom:16px;overflow:hidden}
.log-date-section.log-day-0{border-left:4px solid #4ade80;background:linear-gradient(135deg,rgba(74,222,128,.20),rgba(74,222,128,.04) 75%)}
.log-date-section.log-day-1{border-left:4px solid #60a5fa;background:linear-gradient(135deg,rgba(96,165,250,.20),rgba(96,165,250,.04) 75%)}
.log-date-section.log-day-2{border-left:4px solid #f472b6;background:linear-gradient(135deg,rgba(244,114,182,.20),rgba(244,114,182,.04) 75%)}
.log-date-section.log-day-3{border-left:4px solid #fbbf24;background:linear-gradient(135deg,rgba(251,191,36,.20),rgba(251,191,36,.04) 75%)}
.log-date-section.log-day-4{border-left:4px solid #a78bfa;background:linear-gradient(135deg,rgba(167,139,250,.20),rgba(167,139,250,.04) 75%)}
.log-date-section.log-day-5{border-left:4px solid #22d3ee;background:linear-gradient(135deg,rgba(34,211,238,.20),rgba(34,211,238,.04) 75%)}
.log-date-head{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;background:transparent;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.log-date-head:hover{background:rgba(255,255,255,.05)}
.log-date-title{color:#fff;font-weight:700;font-size:1.05em}
.log-today-badge{color:#4ade80;background:rgba(74,222,128,.15);font-size:.62em;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle;letter-spacing:.5px}
.log-date-meta{margin-left:auto;color:var(--tm);font-size:.82em}
.log-date-section>.log-date-head .log-caret{transition:transform .18s}
.log-date-section.open>.log-date-head .log-caret{transform:rotate(180deg)}
.log-date-body{display:none;flex-direction:column;gap:12px;padding:0 20px 18px}
.log-date-section.open>.log-date-body{display:flex}
/* Sessions inside a date section: plain cards (the section already carries the day colour) */
.log-date-body .log-session{background:rgba(0,0,0,.35)}
/* Load-more button block */
.log-more{text-align:center;margin:22px 0 4px}
.log-more-note{color:var(--tm);font-size:.8em;margin-top:8px}
/* Loading skeleton: shimmer rows shaped like collapsed date-section headers */
.log-skeleton{display:flex;flex-direction:column;gap:16px}
.sk-date-row{height:58px;border-radius:12px}
/* Uploaded-file details row */
.log-file{display:flex;align-items:center;gap:10px;background:#000;border:1px solid var(--bd);border-radius:8px;padding:10px 14px}
.log-file-icon{font-size:1.1em;flex-shrink:0}
.log-file-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.lf-name{color:#d5dbdb;font-weight:600;font-size:.86em;word-break:break-all}
.lf-sub{color:var(--tm);font-size:.76em}
.log-quarter-block{background:#000;border:1px solid var(--bd);border-radius:8px;padding:14px 16px}
.log-quarter-block.live{border-left:3px solid #4ade80}
.log-quarter-block.past{border-left:3px solid #fbbf24}
.log-quarter-block .log-quarter.live b{color:#4ade80}
.log-quarter-block .log-quarter.past b{color:#fbbf24}
.change-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chg{background:#000;border:1px solid var(--bd);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:.85em}
.chg .k{color:var(--tm)}
.chg .v{font-weight:700}
.chg .v.added{color:var(--gl)}.chg .v.updated{color:#fbbf24}.chg .v.reopened{color:#a78bfa}
.chg .v.autoClosed{color:#44b9d6}.chg .v.unchanged{color:var(--tm)}.chg .v.missing{color:var(--rl)}
.nochg{color:var(--tm);font-size:.85em;font-style:italic}
/* Exact ShortIds changed (2026-Q2 only) */
.tk-changes{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.tk-group-title{font-size:.75em;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.tk-group-title.added{color:var(--gl)}.tk-group-title.updated{color:#fbbf24}
.tk-chips{display:flex;flex-wrap:wrap;gap:8px}
.tk-chip{background:#000;border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-size:.82em}
.tk-chip a{color:#44b9d6;text-decoration:none;font-weight:600}
.tk-chip a:hover{text-decoration:underline}
.gate{text-align:center;padding:50px 0}.gate p{color:var(--tm);margin-bottom:18px}
.empty{text-align:center;color:var(--tm);padding:40px;border:1px dashed var(--bd);border-radius:12px}
</style>
</head>
<body data-nav-active="data-log" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>

<div class="wrap" id="wrap"><h1>Update Data Log</h1><p class="sub" style="color:#879596;font-size:.9em;margin:4px 0 24px">History of data uploads to the live dashboard — who uploaded, when (IST), and what changed. Latest first.</p><div class="log-skeleton"><div class="shimmer sk-date-row"></div><div class="shimmer sk-date-row"></div><div class="shimmer sk-date-row"></div></div></div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js"></script>
<script>
const A=window.PHDAuth;

// Format an ISO timestamp into a timezone label. Uses Intl with the IANA zone.
function fmtTZ(iso,zone){
  try{
    return new Date(iso).toLocaleString('en-US',{timeZone:zone,day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
  }catch(e){ return iso; }
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function gate(msg){document.getElementById('wrap').innerHTML='<div class="gate"><h1>Update Data Log</h1><p>'+msg+'</p><a class="btn" href="app.html">Go to Live Dashboard</a></div>';}

function changeCells(cs){
  if(!cs)return '<div class="nochg">No change summary recorded for this upload.</div>';
  const items=[
    ['Added','added'],['Updated','updated'],['Reopened','reopened'],
    ['Auto-closed','autoClosed'],['Unchanged','unchanged'],['Not in file','missing']
  ];
  return '<div class="change-grid">'+items.map(([label,key])=>{
    const v=cs[key];
    if(v==null)return '';
    return '<div class="chg"><span class="k">'+label+'</span><span class="v '+key+'">'+v+'</span></div>';
  }).join('')+'</div>';
}

// Human-readable byte size.
function fmtBytes(b){
  b=Number(b);
  if(!isFinite(b)||b<=0)return '';
  const u=['B','KB','MB','GB'];let i=0;
  while(b>=1024&&i<u.length-1){b/=1024;i++;}
  return (i===0?b:b.toFixed(b>=10?0:1))+' '+u[i];
}

// The uploaded-file details (name / size / type) captured at upload time, if present.
// Reads from whichever item in the session carries them (they're the same for the whole upload).
function fileMetaHtml(items){
  const it=(items||[]).find(x=>x&&(x.fileName||x.fileSize||x.fileType))||{};
  if(!it.fileName&&!it.fileSize&&!it.fileType)return '';
  const size=fmtBytes(it.fileSize);
  return '<div class="log-file">'+
    '<span class="log-file-icon" aria-hidden="true">📄</span>'+
    '<span class="log-file-meta">'+
      '<span class="lf-name">'+esc(it.fileName||'Uploaded file')+'</span>'+
      (size||it.fileType?'<span class="lf-sub">'+[size,esc(it.fileType||'')].filter(Boolean).join(' · ')+'</span>':'')+
    '</span>'+
  '</div>';
}

// Chips listing the exact ShortIds added/updated (only recorded for 2026-Q2 merges).
function ticketChips(ids){
  return (ids||[]).map(id=>'<span class="tk-chip"><a href="https://t.corp.amazon.com/issues/'+encodeURIComponent(id)+'" target="_blank" rel="noopener">'+esc(id)+'</a></span>').join('');
}
function changedTicketsBlock(ct){
  if(!ct)return ''; // only present for 2026-Q2
  const added=(ct.added||[]),updated=(ct.updated||[]);
  if(!added.length&&!updated.length)return '';
  let h='<div class="tk-changes">';
  if(added.length)h+='<div class="tk-group"><div class="tk-group-title added">Added tickets ('+added.length+')</div><div class="tk-chips">'+ticketChips(added)+'</div></div>';
  if(updated.length)h+='<div class="tk-group"><div class="tk-group-title updated">Updated tickets ('+updated.length+')</div><div class="tk-chips">'+ticketChips(updated)+'</div></div>';
  h+='</div>';
  return h;
}

const isOwner=()=>A.role&&A.role()==='owner';
function render(entries){
  const wrap=document.getElementById('wrap');
  const owner=isOwner();
  const qid=new URLSearchParams(location.search).get('qid');
  if(qid)entries=entries.filter(e=>e.liveQuarter===qid);
  const heading=qid?('Update Data Log — '+esc(qid)):'Update Data Log';
  const subText=qid
    ?('History of data uploads/merges into <b>'+esc(qid)+'</b> — who, when ('+esc(MY_TZ)+'), and what changed. Latest first.')
    :'History of data uploads to the live dashboard — who uploaded, when ('+esc(MY_TZ)+'), and what changed. Latest first.';
  let html='<h1>'+heading+'</h1><p class="sub">'+subText+'</p>';
  if(!entries.length){
    html+='<div class="empty">No '+(qid?('uploads recorded for '+esc(qid)+' yet.'):'uploads recorded yet.')+'</div>';
    wrap.innerHTML=html;return;
  }
  // Group entries that belong to the SAME upload (same user + same timestamp) into one section.
  // A single upload can write both the live quarter and one or more past quarters — each is its
  // own log entry, but they share e.at, so we cluster them together.
  const groups=[];const byKey={};
  entries.forEach(e=>{
    const key=(e.user||'')+'|'+(e.at||'');
    if(!byKey[key]){byKey[key]={at:e.at,user:e.user,role:e.role,items:[]};byKey[key]._i=groups.length;groups.push(byKey[key]);}
    byKey[key].items.push(e);
  });
  // Newest first (entries already arrive sorted desc, so groups are in that order).

  // One quarter's change block within a section.
  function quarterBlock(e){
    const liveWritten=(e.written||[]).find(w=>w.isLive);
    const liveCount=liveWritten?liveWritten.count:(e.totalTickets!=null?e.totalTickets:'');
    const heading=(e.pastQuarterMerge?'Merged into past quarter ':'Published to ')+'<b>'+esc(e.liveQuarter||'')+'</b>'+
      (liveCount!==''?(' · '+liveCount+(e.pastQuarterMerge?' tickets in quarter':' tickets in live quarter')):'');
    return '<div class="log-quarter-block '+(e.pastQuarterMerge?'past':'live')+'">'+
      '<div class="log-quarter '+(e.pastQuarterMerge?'past':'live')+'">'+heading+'</div>'+
      changeCells(e.changeSummary)+
      changedTicketsBlock(e.changedTickets)+
    '</div>';
  }

  // Group sessions by upload DAY (in the user's timezone). Each day becomes a collapsible SECTION.
  const zone=TZ_ZONE[MY_TZ]||TZ_ZONE.IST;
  const dayKey=(iso)=>{try{return new Date(iso).toLocaleDateString('en-CA',{timeZone:zone});}catch(e){return 'x';}};
  const todayKey=(()=>{try{return new Date().toLocaleDateString('en-CA',{timeZone:zone});}catch(e){return '';}})();
  // Pretty day label, e.g. "11th Sep 2026".
  const ord=(n)=>{const s=['th','st','nd','rd'];const v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
  const dayLabel=(iso)=>{try{const d=new Date(iso);const parts=new Intl.DateTimeFormat('en-US',{timeZone:zone,day:'numeric',month:'short',year:'numeric'}).formatToParts(d);const get=(t)=>{const p=parts.find(x=>x.type===t);return p?p.value:'';};return ord(parseInt(get('day'),10))+' '+get('month')+' '+get('year');}catch(e){return iso;}};

  // Order days newest-first, preserving the (already newest-first) group order.
  const dayOrder=[]; const dayGroups={};
  groups.forEach(g=>{const k=dayKey(g.at);if(!dayGroups[k]){dayGroups[k]=[];dayOrder.push(k);}dayGroups[k].push(g);});
  // Colour index per day (rotates) — used for the gradient background on the whole date section.
  const dayColorIdx={}; dayOrder.forEach((k,i)=>{dayColorIdx[k]=i%6;});

  // One upload session card (inside a date section).
  function sessionCard(g){
    const items=g.items.slice().sort((a,b)=>(a.pastQuarterMerge?1:0)-(b.pastQuarterMerge?1:0));
    const fileMeta=fileMetaHtml(items);
    return ''+
    '<div class="log-session">'+
      '<button type="button" class="log-head" aria-expanded="false" onclick="toggleSession(this)">'+
        '<span class="log-user">'+esc(g.user)+'<span class="log-role">'+esc(g.role||'')+'</span></span>'+
        '<span class="log-when"><b>'+esc(MY_TZ)+':</b> '+fmtTZ(g.at,zone)+'</span>'+
        '<span class="log-caret" aria-hidden="true">▾</span>'+
      '</button>'+
      '<div class="log-session-body">'+fileMeta+items.map(quarterBlock).join('')+'</div>'+
    '</div>';
  }

  html+=dayOrder.map(k=>{
    const dGroups=dayGroups[k];
    const isToday=(k===todayKey);
    const cnt=dGroups.length;
    const colorCls=' log-day-'+dayColorIdx[k];
    // All date sections start COLLAPSED (including today); today keeps its badge.
    return ''+
    '<div class="log-date-section'+colorCls+'">'+
      '<button type="button" class="log-date-head" aria-expanded="false" onclick="toggleDateSection(this)">'+
        '<span class="log-date-title">'+esc(dayLabel(dGroups[0].at))+(isToday?' <span class="log-today-badge">TODAY</span>':'')+'</span>'+
        '<span class="log-date-meta">'+cnt+' upload'+(cnt===1?'':'s')+'</span>'+
        '<span class="log-caret" aria-hidden="true">▾</span>'+
      '</button>'+
      '<div class="log-date-body">'+dGroups.map(sessionCard).join('')+'</div>'+
    '</div>';
  }).join('');
  // "Load more" — only when the server signalled there are older days beyond the current window.
  if(HAS_MORE && !qid){
    html+='<div class="log-more"><button type="button" id="logLoadMore" class="btn" onclick="loadMoreDays()">'+
      (typeof ic==='function'?ic('history',15)+' ':'')+'Load 2 more days</button>'+
      '<p class="log-more-note">Showing the last '+DAYS_LOADED+' day'+(DAYS_LOADED===1?'':'s')+' of uploads.</p></div>';
  }
  wrap.innerHTML=html;
}

// Owner-only: delete all log entries in a session (they share user+timestamp).
async function delSession(idsJson){
  let ids;try{ids=JSON.parse(idsJson);}catch(e){ids=[];}
  if(!ids.length)return;
  if(!confirm('Delete this data-log entry? This cannot be undone.'))return;
  for(const id of ids){ try{await A.api('DELETE','/api/data-log/'+id);}catch(e){} }
  load(DAYS_LOADED); // reload the same window
}

// Expand/collapse a session card.
function toggleSession(btn){
  const card=btn.closest('.log-session');
  if(!card)return;
  const isOpen=card.classList.toggle('open');
  btn.setAttribute('aria-expanded',isOpen?'true':'false');
}
// Expand/collapse a whole date section.
function toggleDateSection(btn){
  const sec=btn.closest('.log-date-section');
  if(!sec)return;
  const isOpen=sec.classList.toggle('open');
  btn.setAttribute('aria-expanded',isOpen?'true':'false');
}

let MY_TZ='IST'; // logged-in user's preferred timezone (IST|MST)
const TZ_ZONE={IST:'Asia/Kolkata',MST:'America/Denver'};
let DAYS_LOADED=3;   // how many distinct upload-days we're currently showing (starts at 3)
let HAS_MORE=false;  // does the server have older days beyond what we've loaded?
let _tzFetched=false;

// Load the most-recent `days` distinct upload-days. "Load more" bumps this by 2.
async function load(days){
  DAYS_LOADED=days||3;
  if(!A.getUser()||!A.getToken()){gate('This page is for logged-in users. Log in from the Live Dashboard first.');return;}
  if(!_tzFetched){ try{MY_TZ=await A.myTimezone();}catch(e){} _tzFetched=true; }
  const r=await A.api('GET','/api/data-log?days='+DAYS_LOADED);
  if(r.status===401){gate('Session expired. Please log in again from the Live Dashboard.');return;}
  if(!r.ok){gate('Could not load the data log (HTTP '+r.status+').');return;}
  // New paginated shape { days, hasMore, entries }. (Tolerate the old bare-array shape too.)
  const data=r.data||{};
  const entries=Array.isArray(data)?data:(data.entries||[]);
  HAS_MORE=Array.isArray(data)?false:!!data.hasMore;
  render(entries);
}
// "Load more" — pull 2 additional days.
function loadMoreDays(){
  const btn=document.getElementById('logLoadMore');
  if(btn){ btn.disabled=true; btn.textContent='Loading…'; }
  load(DAYS_LOADED+2);
}
load(3);
</script>
</body>
</html>
