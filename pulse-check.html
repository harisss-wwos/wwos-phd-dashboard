<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Check (24h) · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: keep the page hidden until topbar-auth.js has injected its chrome. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --o:#ff6100; --o-l:#fe9046; --page:#f4f3ef; --card:#ffffff; --ink:#151d28; --ink2:#161d2d;
  --mut:#5c6773; --mut2:#818284; --line:#e2e6ea; --blue:#2b66c1; --blue-bg:#e6f0fc; --blue-ic:#c4def6;
  --green:#1f9d57; --green-bg:#eafaf0; --red:#dc2626; --red-bg:#fdeaea; --amber:#b5680c; --amber-bg:#fff3e0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--page);color:var(--ink);min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:var(--ink);line-height:1}
.wrap{width:auto!important;max-width:none!important;margin:0 15px!important;padding:0 0 28px!important}
#wrap.wrap{padding-top:0!important}

/* ---- Hero ---- */
.pc-hero{position:relative;overflow:hidden;border-radius:10px;padding:22px 26px;margin-bottom:14px;
  background:linear-gradient(120deg,#1f49a8,#2b66c1 48%,#4f8cf0);box-shadow:0 14px 34px -22px rgba(20,40,70,.6);color:#fff}
.pc-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pc-hero h1{color:#fff;font-size:1.55em;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:12px;line-height:1.15}
.pc-hero h1 svg{flex-shrink:0}
.pc-hero-when{margin-top:6px;font-size:.98em;font-weight:700;color:rgba(255,255,255,.95)}
.pc-hero-sub{text-align:right;font-weight:800;font-size:.95em;color:#fff}
.pc-hero-sub small{display:block;font-weight:600;font-size:.86em;color:rgba(255,255,255,.88);margin-top:4px}
.pc-hero-meta{margin-top:12px;font-size:.84em;line-height:1.6;color:rgba(255,255,255,.92);font-weight:600}
.pc-hero-meta.pc-hero-line{margin-top:3px}
.pc-hero-line b{font-weight:800;color:#fff}
.pc-countdown{font-variant-numeric:tabular-nums;font-weight:800;color:#fff}
/* Export button in the hero's right block (black background, white text). */
.pc-export{display:inline-flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer;font:inherit;font-size:.86em;font-weight:800;
  color:#fff;background:#000;border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:9px 16px;transition:background .15s,transform .12s}
.pc-export:hover{background:#1a1a1a}
.pc-export:active{transform:translateY(1px)}
.pc-export:disabled{opacity:.5;cursor:default;transform:none}
.pc-export.ok{background:#1f9d57;border-color:#1f9d57}
.pc-export:focus-visible{outline:3px solid #f0a35a;outline-offset:2px}
.pc-export svg{flex-shrink:0}

/* ---- Toolbar ---- */
.pc-btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:inherit;font-size:.86em;font-weight:800;
  color:#f4f3ef;background:#161d2d;border:none;border-radius:5px;padding:10px 16px;transition:background .15s}
.pc-btn:hover{background:#0f1420}
.pc-btn:disabled{opacity:.55;cursor:default}
.pc-btn:focus-visible,.pc-card a:focus-visible{outline:3px solid #f0a35a;outline-offset:2px}

/* ---- Cards ---- */
.pc-card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 10px -6px rgba(20,40,70,.22)}
.pc-card-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#f7f9fc,#fff)}
.pc-card-no{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;flex-shrink:0;background:var(--blue-bg);color:var(--blue);font-weight:800;font-size:.9em}
.pc-card-head h2{font-size:1.02em;font-weight:800;color:var(--ink)}
.pc-card-head{flex-wrap:wrap}
.pc-head-aside{margin-left:auto;font-size:.8em;font-weight:600;color:var(--mut)}
.pc-note{margin:-4px 0 14px;font-size:.82em;font-weight:600;color:var(--mut)}
.pc-inline{font-size:.82em;font-weight:700;color:var(--red);text-align:right;margin:4px 0 14px}
.pc-inline:empty{display:none}
.pc-card-body{padding:16px 20px;font-size:.92em;line-height:1.65;color:#2a3340}
.pc-card-body p+p,.pc-card-body p+.pc-scroll,.pc-card-body .pc-scroll+p,.pc-card-body .pc-scroll+ul,.pc-card-body p+ul,.pc-card-body ul+p{margin-top:12px}
.pc-card-body b{color:var(--ink);font-weight:800}
.pc-card a{color:var(--blue);font-weight:700}
.pc-line{font-weight:700;color:var(--ink)}
.pc-muted{color:var(--mut)}
.pc-warn{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--amber-bg);border:1px solid #f3d3a6;border-left:4px solid var(--amber);color:#6b3d05;font-weight:700}
.pc-banner{margin-bottom:14px;padding:12px 16px;border-radius:9px;background:var(--blue-bg);border:1px solid var(--blue-ic);color:#1d4a8f;font-weight:700;font-size:.9em}
.pc-bullets{padding-left:20px}
.pc-bullets li+li{margin-top:4px}

/* ---- Tables ---- */
.pc-scroll{overflow-x:auto}
.pc-tbl{width:100%;border-collapse:collapse;font-size:.95em}
.pc-tbl th,.pc-tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.pc-tbl thead th{background:#f3f5f8;font-size:.82em;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:#3a4552;white-space:nowrap}
.pc-tbl td.n,.pc-tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-tbl tbody tr:nth-child(even) td{background:#fafbfc}
.pc-tbl tfoot th,.pc-tbl tfoot td{font-weight:800;background:#f3f5f8;color:var(--ink)}
.pc-tbl .pc-wrap{display:block;min-width:140px;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.pc-tbl .pc-empty td{color:var(--mut);text-align:center;font-style:italic}
.pc-tbl .pc-peak{font-weight:800;color:var(--ink)}
.pc-tbl .pc-grp{border-left:2px solid #d5dbe2}
.pc-kv th[scope=row]{font-weight:700;color:#2a3340;background:transparent}
.pc-row-risk th,.pc-row-risk td{background:var(--amber-bg)!important}
.pc-row-breach th,.pc-row-breach td{background:var(--red-bg)!important}

/* ---- Action items ---- */
.pc-actions{display:flex;flex-direction:column;gap:10px}
.pc-act{padding:12px 14px;border-radius:9px;border:1px solid var(--line);background:#fafbfc;border-left:5px solid #c4ccd4}
.pc-act h3{font-size:1em;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pc-act p{margin-top:6px}
.pc-badge{font-size:.72em;font-weight:800;letter-spacing:.6px;border-radius:999px;padding:3px 10px;flex-shrink:0}
.pc-act.sev-CRITICAL{border-left-color:#c81e1e}.pc-act.sev-CRITICAL .pc-badge{background:#fdeaea;color:#a51616}
.pc-act.sev-HIGH{border-left-color:#e86a10}.pc-act.sev-HIGH .pc-badge{background:#ffeedd;color:#9a4100}
.pc-act.sev-MEDIUM{border-left-color:#e0b000}.pc-act.sev-MEDIUM .pc-badge{background:#fff6cc;color:#6e5600}
.pc-act.sev-INFO{border-left-color:#2b66c1}.pc-act.sev-INFO .pc-badge{background:var(--blue-bg);color:#1d4a8f}

.pc-gate{text-align:center;padding:60px 20px;color:var(--mut)}
.pc-gate h1{color:var(--ink);font-size:1.4em;margin-bottom:10px}
.pc-error{text-align:center;padding:40px 20px}
.pc-error p{color:var(--red);font-weight:700;margin-bottom:14px}

/* ===== Phased loader (ported from performance-summary.html) ===== */
.gw-loader{min-height:52vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gw-loader-in{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:680px}
.gw-orb{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.gw-orb::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(#2b66c1,#c4def6,#fe9046,#ff6100,#2b66c1);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  animation:gwSpin 1.1s linear infinite}
.gw-orb-ic{position:relative;width:62px;height:62px;border-radius:50%;background:#e6f0fc;color:#2b66c1;
  display:flex;align-items:center;justify-content:center;animation:gwPulse 1.6s ease-in-out infinite;box-shadow:0 6px 18px -8px rgba(43,102,193,.5)}
.gw-orb-ic svg{width:30px;height:30px}
@keyframes gwSpin{100%{transform:rotate(360deg)}}
@keyframes gwPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.gw-loader-msg{font-size:1.18em;font-weight:800;color:#151d28;line-height:1.4;min-height:1.5em}
.gw-loader-msg.gw-msg-in{animation:gwMsgIn .5s cubic-bezier(.22,1,.36,1)}
@keyframes gwMsgIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.gw-dots{display:flex;gap:7px}
.gw-dots span{width:9px;height:9px;border-radius:50%;background:#ff6100;animation:gwDot 1.2s ease-in-out infinite}
.gw-dots span:nth-child(2){background:#fe9046;animation-delay:.18s}
.gw-dots span:nth-child(3){background:#2b66c1;animation-delay:.36s}
@keyframes gwDot{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
.gw-loader-sub{font-size:.72em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#2b66c1;background:#e6f0fc;border:1px solid #c4def6;border-radius:999px;padding:4px 14px}
.gw-loader.gw-done .gw-orb::before{animation:none;background:#1f9d57}
.gw-loader.gw-done .gw-orb-ic{background:#e7f7ee;color:#1f9d57;animation:gwPop .4s ease}
.gw-loader.gw-done .gw-loader-msg{color:#1f9d57}
.gw-loader.gw-done .gw-dots{visibility:hidden}
@keyframes gwPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.gw-orb::before,.gw-orb-ic,.gw-dots span,.gw-loader-msg.gw-msg-in{animation:none}}
</style>
</head>

<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>

<div class="wrap" id="wrap">
  <div class="pc-gate"><h1>Pulse Check (24h)</h1><p>Loading…</p></div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=203"></script>
<script>
const A=window.PHDAuth;
const ic=(n,s)=>window.icon?window.icon(n,s||14):'';
const DASH='\u2014';

// ---- Formatting helpers (every dynamic string goes through esc) ----
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function num(n){ return (Number(n)||0).toLocaleString('en-US'); }
function pct1(p){ return (p==null||!isFinite(p))?DASH:(Number(p).toFixed(1)+'%'); }
function hrs1(h){ return (h==null||!isFinite(h))?DASH:Number(h).toFixed(1); }
function pad2(n){ return String(n).padStart(2,'0'); }
function hourRange(h){ return pad2(h)+':00\u2013'+pad2((h+1)%24)+':00'; }
function safeUrl(u){ u=String(u||''); return /^https?:\/\//i.test(u)?u:''; }
function idLink(id,url){ var s=safeUrl(url); return s?'<a href="'+esc(s)+'" target="_blank" rel="noopener noreferrer">'+esc(id)+'</a>':esc(id); }
function shortStatus(s){ return s==='Work In Progress'?'WIP':s; }
// Singular/plural: tix(1)='1 ticket', tix(2)='2 tickets', tix(2,'breach','breaches')='2 breaches'.
function tix(n,one,many){ one=one||'ticket'; return num(n)+' '+(Number(n)===1?one:(many||one+'s')); }
// "2026-10-25 11:00" from an ISO timestamp (UTC).
function utcStamp(iso){ return (typeof iso==='string'&&iso.length>=16)?(iso.slice(0,10)+' '+iso.slice(11,16)):DASH; }

// America/Denver date parts; labelled "MST" per the repo convention (D9).
function denParts(iso){
  var o={}; if(!iso) return o;
  try{
    new Intl.DateTimeFormat('en-US',{timeZone:'America/Denver',weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
      .formatToParts(new Date(iso)).forEach(function(p){ o[p.type]=p.value; });
  }catch(e){}
  return o;
}
// Clock time "HH:MM" in a zone (24h).
function hm(iso,tz){ try{ return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(iso)); }catch(e){ return DASH; } }
var TZ_MST='America/Denver', TZ_IST='Asia/Kolkata';
// ISO instant -> "10/24 14:05" in America/Denver (MST per the repo convention); DASH if invalid.
function mstStamp(iso){
  var o={}; try{
    new Intl.DateTimeFormat('en-US',{timeZone:TZ_MST,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
      .formatToParts(new Date(iso)).forEach(function(p){ o[p.type]=p.value; });
  }catch(e){ return DASH; }
  return (o.month&&o.day&&o.hour)?(o.month+'/'+o.day+' '+o.hour+':'+o.minute):DASH;
}
// "Sunday, October 25, 2026 — 07:04 MST · 18:34 IST" (the date is the MST date).
function fmtLong(iso){ var p=denParts(iso); return p.weekday?(p.weekday+', '+p.month+' '+p.day+', '+p.year+' \u2014 '+hm(iso,TZ_MST)+' MST \u00b7 '+hm(iso,TZ_IST)+' IST'):DASH; }
// Report date 'YYYY-MM-DD' -> "Saturday, October 24, 2026" (a calendar date; formatted at UTC noon).
function reportDayLong(ymd){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd||'')); if(!m) return DASH;
  try{ return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date(Date.UTC(+m[1],+m[2]-1,+m[3],12))); }catch(e){ return DASH; }
}
// 1 -> "1st", 2 -> "2nd", 3 -> "3rd", 4 -> "4th", 11..13 -> "11th".."13th", 21 -> "21st".
function ordinal(n){
  var v=n%100, s=(v>=11&&v<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th');
  return n+s;
}
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
// 'YYYY-MM-DD' (+ addDays calendar days) -> "25th October"; DASH when the date is invalid.
function ordinalDayMonth(ymd,addDays){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd||'')); if(!m) return DASH;
  var d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]+(addDays||0)));
  return ordinal(d.getUTCDate())+' '+MONTHS[d.getUTCMonth()];
}
// ISO instant -> "11:30 AM IST 26th October" (Asia/Kolkata).
function istWhen(iso){
  var o={}; try{
    new Intl.DateTimeFormat('en-US',{timeZone:TZ_IST,hour:'numeric',minute:'2-digit',hour12:true,month:'numeric',day:'numeric'})
      .formatToParts(new Date(iso)).forEach(function(p){ o[p.type]=p.value; });
  }catch(e){ return DASH; }
  if(!o.hour||!o.month) return DASH;
  return o.hour+':'+o.minute+' '+String(o.dayPeriod||'').toUpperCase()+' IST '+ordinal(+o.day)+' '+MONTHS[+o.month-1];
}
// Milliseconds -> "1d 02h 15m 09s" (days omitted when 0), zero-padded; null once the time has run out.
function fmtCountdown(ms){
  if(!(ms>0)) return null;
  var t=Math.floor(ms/1000), d=Math.floor(t/86400), h=Math.floor(t%86400/3600), m=Math.floor(t%3600/60), s=t%60;
  var p=function(n){ return String(n).padStart(2,'0'); };
  return (d>0?d+'d ':'')+p(h)+'h '+p(m)+'m '+p(s)+'s';
}

// ---- User ----
function me(){ var u=(A.getUser&&A.getUser())||{}; var p=(A.myProfile&&A.myProfile())||u; return { username:u.username||p.username||'', name:(p&&p.displayName)||(p&&p.username)||u.username||'' }; }

// ---- Building blocks ----
// aside (optional, already-escaped HTML) renders as a muted note next to the heading.
function card(no,title,body,aside){
  return '<section class="pc-card" aria-labelledby="pcH'+no+'"><div class="pc-card-head"><span class="pc-card-no" aria-hidden="true">'+no+'</span>'+
    '<h2 id="pcH'+no+'">'+no+'. '+title+'</h2>'+(aside?'<span class="pc-head-aside">'+aside+'</span>':'')+'</div><div class="pc-card-body">'+body+'</div></section>';
}
// cols: [{h:'Label', n:true}] ; rows: array of arrays of already-escaped cell HTML.
function table(cols,rows,foot,cap){
  var h='<div class="pc-scroll"><table class="pc-tbl">'+(cap?'<caption class="pc-muted" style="text-align:left;padding-bottom:6px">'+cap+'</caption>':'')+'<thead><tr>'+
    cols.map(function(c){ return '<th scope="col"'+(c.n?' class="n"':'')+'>'+c.h+'</th>'; }).join('')+'</tr></thead><tbody>';
  if(!rows.length) h+='<tr class="pc-empty"><td colspan="'+cols.length+'">None in this window</td></tr>';
  rows.forEach(function(r){
    var cls=r.cls?' class="'+r.cls+'"':''; var cells=r.cells||r;
    h+='<tr'+cls+'>'+cells.map(function(v,i){ return i===0?'<th scope="row"'+(cols[0].n?' class="n"':'')+'>'+v+'</th>':'<td'+(cols[i].n?' class="n"':'')+'>'+v+'</td>'; }).join('')+'</tr>';
  });
  h+='</tbody>'+(foot||'')+'</table></div>';
  return h;
}
function bullets(arr){ return arr.length?'<ul class="pc-bullets">'+arr.map(function(b){ return '<li>'+b+'</li>'; }).join('')+'</ul>':''; }

// ---- Section 1: Executive Summary (template per design §6; built as plain text, set via textContent) ----
function execText(D){
  var k=D.kpis, s=D.summary, al=D.agents.autosimLine, br=D.breaches.total, atRisk=D.sla.atRisk;
  var out=[];
  out.push('The PHD team processed '+tix(k.created)+' created and '+tix(k.resolved)+' resolved during the reporting day '+reportDayLong(D.reportDate)+' (MST).');
  out.push('The total open ticket backlog stands at '+tix(k.openTotal)+'.');
  if(atRisk>0||br>0) out.push('SLA health is under pressure with '+tix(atRisk)+' at risk (7\u201310 days old, approaching the 240-hour SLA limit) and '+tix(br,'historical SLA breach','historical SLA breaches')+(br>0?(br===1?' (now resolved)':' (all now resolved)'):'')+'.');
  else out.push('SLA health is stable: no tickets at risk and no breaches in this window.');
  if(s.resolutionRatePct!=null) out.push('Resolution rate: '+Number(s.resolutionRatePct).toFixed(1)+'% ('+num(k.resolved)+'/'+num(k.created)+').');
  if(s.autosimSharePct!=null) out.push('AutoSIM handled '+s.autosimSharePct+'% of all resolutions ('+num(al.n)+'/'+num(al.d)+')'+(s.autosimSharePct>0?', demonstrating effective automation.':'.'));
  if(s.peakHourMst!=null) out.push('Peak ticket creation occurred at '+hourRange(s.peakHourMst)+' MST.');
  if(k.openBreached>0) out.push(k.openBreached===1?'1 currently open ticket has breached the 240-hour SLA.':(num(k.openBreached)+' currently open tickets have breached the 240-hour SLA.'));
  else out.push('No currently open tickets have breached the 240-hour SLA.');
  return out.join(' ');
}
function secExec(D){
  var k=D.kpis;
  var warn=(k.created>0&&k.hashtagsCreated===0)?'<p class="pc-warn" role="note">\u26a0 Warning: Tagging compliance gap identified \u2014 0 hashtags applied to '+tix(k.created,'newly created ticket','newly created tickets')+'.</p>':'';
  return card(1,'Executive Summary',
    '<p id="pcExec"></p>'+warn);
}

// ---- Section 2: Key metrics ----
function secKpis(D){
  var k=D.kpis;
  var pairs=[
    ['Tickets Created (24h)',k.created,'Successful Resolved',k.successful],
    ['Assigned',k.openAssigned,'Immediately Resolved',k.immediate],
    ['Work In Progress',k.openWip,'Repeat Incidents Resolved',k.repeatResolved],
    ['Pending',k.openPending,'Total Resolves',k.resolved],
    ['Researching',k.openResearching,'SLA At Risk (7\u201310 days)',k.slaAtRisk],
    ['Total Open Tickets',k.openTotal,'Station Requests Received',k.stationRequests]
  ];
  // A value missing from the payload (e.g. an older cached report) shows the dash, never NaN/0.
  var kv=function(v){ return (v==null||v===''||!isFinite(Number(v)))?DASH:num(v); };
  var rows=pairs.map(function(p){ return '<tr><th scope="row">'+esc(p[0])+'</th><td class="n"><b>'+kv(p[1])+'</b></td><th scope="row" class="pc-grp">'+esc(p[2])+'</th><td class="n"><b>'+kv(p[3])+'</b></td></tr>'; }).join('');
  return card(2,'Key Metrics at a Glance','<div class="pc-scroll"><table class="pc-tbl pc-kv"><thead><tr><th scope="col">Metric</th><th scope="col" class="n">Value</th><th scope="col" class="pc-grp">Metric</th><th scope="col" class="n">Value</th></tr></thead><tbody>'+rows+'</tbody></table></div>');

// ---- Section 8: the day's hours split into three 8-hour blocks of the MST day ----
// One row per real hour of the MST day (24, or 23/25 on DST days). Rows are assigned to a block by their
// Denver hour (0-7 / 8-15 / 16-23), so a DST day just makes block a 9 or 7 rows long.
var HOURLY_BLOCKS=[
  {key:'a',name:'IST hours',from:0,to:8},
  {key:'b',name:'IST + MST hours',from:8,to:16},
  {key:'c',name:'MST hours',from:16,to:24}
];
// "HH:MM" in a zone; a midnight END time reads "24:00" (end of the day), not "00:00".
function hmEnd(iso,tz){ var s=hm(iso,tz); return s==='00:00'?'24:00':s; }
// Block rows' first start .. last end (start+1h) in a zone, e.g. "11:30\u201319:30".
function blockSpan(rows,tz){
  if(!rows.length) return '';
  var a=rows[0].start, z=rows[rows.length-1].start, t=Date.parse(z);
  if(!isFinite(Date.parse(a))||!isFinite(t)) return '';
  return hm(a,tz)+'\u2013'+hmEnd(new Date(t+3600000).toISOString(),tz);
}
// Splits the hourly rows into the three blocks with their sums and MST/IST ranges.
function hourlyBlocks(rows){
  return HOURLY_BLOCKS.map(function(b){
    var rs=rows.filter(function(r){ return r.hour>=b.from&&r.hour<b.to; }), c=0, s=0;
    rs.forEach(function(r){ c+=Number(r.created)||0; s+=Number(r.resolved)||0; });
    return {key:b.key,name:b.name,label:b.key+') '+b.name,created:c,resolved:s,
      mst:blockSpan(rs,TZ_MST)||(pad2(b.from)+':00\u2013'+pad2(b.to)+':00'), ist:blockSpan(rs,TZ_IST)||DASH};
  });
}
function secHourly(D){
  var H=D&&D.hourly;
  var note='<p class="pc-muted">Report day split into three 8-hour blocks of the MST day; times shown in MST and IST.</p>';
  if(!H||!Array.isArray(H.rows)) return card(8,'Ticket Flow by 8-Hour Block \u2014 Created vs. Resolved',note+'<p class="pc-muted">No hourly data in this window.</p>');
  var blocks=hourlyBlocks(H.rows), top=null;
  blocks.forEach(function(b){ if(b.created>0&&(!top||b.created>top.created)) top=b; });   // ties -> earliest block
  var line=top?('Busiest block: <b>'+esc(top.label)+'</b> \u2014 '+tix(top.created)+' created.'):'No tickets created in this window.';
  var rows=blocks.map(function(b){ return [esc(b.label),esc(b.mst),esc(b.ist),num(b.created),num(b.resolved)]; });
  var foot='<tfoot><tr><th scope="row" colspan="3">TOTAL</th><td class="n">'+num(H.totalCreated)+'</td><td class="n">'+num(H.totalResolved)+'</td></tr></tfoot>';
  return card(8,'Ticket Flow by 8-Hour Block \u2014 Created vs. Resolved',
    note+'<p class="pc-line">'+line+'</p>'+
    table([{h:'Block'},{h:'MST'},{h:'IST'},{h:'Created',n:true},{h:'Resolved',n:true}],rows,foot));
}

// ---- Export: the rendered report as plain text (tables tab-separated) -> clipboard ----
function pcCellsText(tr){ return Array.prototype.map.call(tr.children,function(c){ return c.textContent.replace(/\s+/g,' ').trim(); }).join('\t'); }
// Export only: prose is copied as bullets. Splits a paragraph into sentences at '. ' + uppercase letter/digit,
// except inside parentheses or after an abbreviation (e.g., vs., dotted initials); decimals like 7.5 and 'w/o' never match.
var PC_ABBR=/^(?:e\.g|i\.e|vs|approx|incl|dr|mr|mrs|ms|inc|ltd|(?:[a-z]\.)+[a-z])$/i;
function pcSentences(text){
  var s=String(text==null?'':text).replace(/\s+/g,' ').trim(), out=[], depth=0, start=0;
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i);
    if(ch==='(') depth++;
    else if(ch===')'){ if(depth>0) depth--; }
    else if(ch==='.'&&depth===0&&s.charAt(i+1)===' '&&/[A-Z0-9]/.test(s.charAt(i+2))){
      var m=/(\S+)$/.exec(s.slice(start,i)), w=m?m[1].replace(/^[("'\u201c]+/,''):'';
      if(PC_ABBR.test(w)) continue;
      out.push(s.slice(start,i+1)); start=i+2;
    }
  }
  var rest=s.slice(start).trim(); if(rest) out.push(rest);
  return out;
}
// A .pc-line that labels the table below it (stays a heading, not a bullet): "Resolved Tickets (N)" or "Label:".
function pcIsSubHead(el){
  var c=el.classList, t=(el.textContent||'').replace(/\s+/g,' ').trim();
  return /^H[1-6]$/.test(String(el.tagName).toUpperCase())||(!!c&&c.contains('pc-line')&&/^(?:Resolved Tickets \([\d,]+\)|.*:)$/.test(t));
}
function pcBlockText(el,out){
  var tx=function(n){ return (n?n.textContent:'').replace(/\s+/g,' ').trim(); };
  if(el.classList&&el.classList.contains('pc-actions')){
    el.querySelectorAll('.pc-act').forEach(function(a){
      var b=a.querySelector('.pc-badge'), h=a.querySelector('h3'), p=a.querySelector('p');
      var title=tx(h).replace(tx(b),'').trim();
      out.push('\u25cf '+tx(b)+' \u2014 '+title); if(tx(p)) out.push('  '+tx(p));
    });
    return;
  }
  var tbl=(el.tagName==='TABLE')?el:(el.querySelector&&el.querySelector('table'));
  if(tbl&&(el.classList.contains('pc-scroll')||el.tagName==='TABLE')){
    tbl.querySelectorAll('tr').forEach(function(tr){ var line=pcCellsText(tr); if(line.replace(/\t/g,'')) out.push(line); });
    return;
  }
  if(el.tagName==='UL'){ el.querySelectorAll('li').forEach(function(li){ out.push('\u25cf '+tx(li)); }); return; }
  var t=tx(el); if(!t) return;
  if(pcIsSubHead(el)){ out.push(t); return; }
  if(el.id==='pcExec') pcSentences(t).forEach(function(s){ out.push('\u25cf '+s); });
  else out.push('\u25cf '+t);
}
function pcExportText(){
  var D=PC.data; if(!D) return '';
  var L=heroLines(D);
  var out=['PHD Operational Pulse Check',L.report,'Potential Harm to Driver \u2014 GSOC'];
  var w=wrap();
  w.querySelectorAll(':scope > .pc-banner, :scope > .pc-note').forEach(function(n){ out.push(''); pcBlockText(n,out); });
  w.querySelectorAll('section.pc-card').forEach(function(sec){
    out.push('');
    var h=sec.querySelector('.pc-card-head h2'), aside=sec.querySelector('.pc-head-aside');
    out.push(h?h.textContent.trim():'');
    if(aside&&aside.textContent.trim()) out.push('\u25cf '+aside.textContent.replace(/\s+/g,' ').trim());
    var body=sec.querySelector('.pc-card-body');
    if(body) Array.prototype.forEach.call(body.children,function(c){ pcBlockText(c,out); });
  });
  return out.join('\n');
}
// ---- Export: the rendered report as email-safe rich HTML (inline styles only; tables become images, see below) ----
// Built by walking a clone of the rendered report. Only whitelisted tags are emitted, no attributes are copied
// (except a validated absolute href and colspan/rowspan numbers), and every text node goes through esc().
var PC_FONT='font-family:Segoe UI,Arial,sans-serif;';
var PC_TBL='border-collapse:collapse;border:1px solid #c8d0dc;'+PC_FONT+'font-size:13px';
var PC_CELL='border:1px solid #c8d0dc;padding:4px;vertical-align:top;';
var PC_P='margin:6px 0;'+PC_FONT+'font-size:13px;line-height:1.5;color:#2a3340;';
var PC_H3='margin:12px 0 4px;'+PC_FONT+'font-size:14px;font-weight:bold;color:#1a2230;';
var PC_GAP='<div style="height:8px;line-height:8px;font-size:8px">&nbsp;</div>';
// Left indent of copied tables (matches the bullet lists' 20px + a little breathing room).
var PC_TBL_INDENT='margin:4px 0 10px 28px;padding:0;';
// Never exported: controls, icons, hidden / aria-only content, the inline status line and the live countdown.
function pcSkip(el){
  var t=String(el.tagName||'').toUpperCase();
  if(/^(BUTTON|SVG|SCRIPT|STYLE|NOSCRIPT|IMG|INPUT|SELECT|TEXTAREA|NAV)$/.test(t)) return true;
  if(el.hidden||el.getAttribute('aria-hidden')==='true') return true;
  if(el.style&&(el.style.display==='none'||el.style.visibility==='hidden')) return true;
  var c=el.classList;
  if(c&&(c.contains('pc-inline')||c.contains('pc-countdown')||c.contains('sr-only')||c.contains('visually-hidden'))) return true;
  return el.id==='pcStatus'||el.id==='pcNextLine'||el.id==='pcCountdown';

    if(!w) return;
    var t=cur?cur+' '+w:w;
    if(measure(t,bold)<=maxW){ cur=t; return; }
    if(cur){ lines.push(cur); cur=''; }
    if(measure(w,bold)<=maxW){ cur=w; return; }
    var piece='';
    Array.prototype.forEach.call(w,function(ch){
      if(piece&&measure(piece+ch,bold)>maxW){ lines.push(piece); piece=ch; } else piece+=ch;

// model: {caption:'', rows:[{kind:'head'|'body'|'foot', empty:bool, cells:[{text,n,bold,link,grp,span}]}]}
function pcTblLayout(model,measure){

    var k=0; r.cells.forEach(function(c){ c.span=Math.max(1,c.span||1); k+=c.span; });

    var ci=0; r.cells.forEach(function(c){

    var ci=0, maxL=1, cells=[];
    r.cells.forEach(function(c){
      var w=0; for(var j=ci;j<ci+c.span&&j<ncols;j++) w+=colW[j];
      var cx=0; for(var m=0;m<ci;m++) cx+=colW[m];
      var bold=isBold(r,c);
      var lines=pcWrapText(c.text,Math.max(1,w-2*P.padX),measure,bold);
      if(lines.length>maxL) maxL=lines.length;

// pc-img-layout:end

function pcCellWalk(node,acc,inLink,inBold){
  Array.prototype.forEach.call(node.childNodes,function(n){
    if(n.nodeType===3){
      var t=n.textContent.replace(/\s+/g,' '), k=t.replace(/\s/g,'').length;
      acc.t+=t; acc.c+=k; if(inLink) acc.l+=k; if(inBold) acc.b+=k;
      return;
    }
    if(n.nodeType!==1||pcSkip(n)) return;
    var tg=n.tagName.toUpperCase();
    if(tg==='BR'){ acc.t+=' '; return; }
    pcCellWalk(n,acc,inLink||(tg==='A'&&!!pcAbsUrl(n.getAttribute('href'))),inBold||tg==='B'||tg==='STRONG');
  });
}
// Reads a rendered <table> (thead / tbody / tfoot / caption, colspan honoured) into the layout model.
function pcTblModel(tbl){
  var model={caption:'',rows:[]};
  var addRows=function(sec,kind){
    Array.prototype.forEach.call(sec.children,function(tr){
      if(String(tr.tagName).toUpperCase()!=='TR'||pcSkip(tr)) return;
      var cells=[];
      Array.prototype.forEach.call(tr.children,function(cell){
        if(pcSkip(cell)) return;
        var acc={t:'',c:0,l:0,b:0}; pcCellWalk(cell,acc,false,false);
        var k=cell.classList, th=cell.tagName.toUpperCase()==='TH';
        cells.push({text:acc.t.replace(/\s+/g,' ').trim(),n:k.contains('n'),grp:k.contains('pc-grp'),
          bold:th||k.contains('pc-peak')||(acc.c>0&&acc.b===acc.c),link:acc.c>0&&acc.l===acc.c,
          span:parseInt(cell.getAttribute('colspan'),10)||1});
      });
      if(cells.length) model.rows.push({kind:kind,empty:tr.classList.contains('pc-empty'),cells:cells});
    });
  };
  Array.prototype.forEach.call(tbl.children,function(sec){
    if(pcSkip(sec)) return;
    var t=String(sec.tagName).toUpperCase();
    if(t==='CAPTION') model.caption=sec.textContent.replace(/\s+/g,' ').trim();
    else if(t==='THEAD') addRows(sec,'head');
    else if(t==='TBODY') addRows(sec,'body');
    else if(t==='TFOOT') addRows(sec,'foot');
  });
  return model;
}
function pcImgFont(bold,italic){ return (italic?'italic ':'')+(bold?'bold ':'')+PC_IMG.fs+"px 'Segoe UI', Arial, sans-serif"; }
function pcMeasurer(){
  var ctx=document.createElement('canvas').getContext('2d');

}
function pcDrawPart(L,part){

    ctx.font=pcImgFont(false,false); ctx.fillStyle='#5b6676'; ctx.textAlign='left';
    L.caption.lines.forEach(function(s,i){ ctx.fillText(s,0,y+i*P.lh+P.lh/2); });
    y+=L.caption.h;
  }
  var drawRow=function(r){
    var bg=r.kind==='head'?'#1f3a68':(r.kind==='foot'||r.total?'#e6ecf5':(r.zebra?'#f4f7fb':'#ffffff'));

// One <img> per part (a table taller than ~8000 logical px is split, header row repeated).
function pcTableImages(tbl,title,measure){

// Replaces the queued table placeholders with images (a table that fails to render falls back to the HTML table). Never rejects.

// Fallback 1: select the HTML in an off-screen contenteditable div and run the browser's copy command.

    }
  }
  // 2) Select + execCommand('copy') on an off-screen contenteditable copy of the same HTML (with images).
  if(!ok&&htmlP) ok=pcCopyViaSelection(await htmlP,txt);
  // 3) Plain text only.
  if(!ok){
    try{ await navigator.clipboard.writeText(txt); ok=true; }
    catch(e){ ok=pcCopyTextarea(txt); }
  }
  if(lbl){ lbl.textContent=ok?'Copied!':'Copy failed'; }
  if(btn) btn.classList.toggle('ok',ok);
  setTimeout(function(){ if(lbl) lbl.textContent=pcExportLabel(PC.data); if(btn) btn.classList.remove('ok'); },1600);
}
window.pcExport=pcExport;
// Inline error line (hidden while empty) for a failed background reload.
function toolbar(){
  return '<div class="pc-inline" id="pcStatus" role="alert"></div>';
}

// ---- Phased loader (trimmed copy of performance-summary.html) ----
function pcFirstName(){ var n=me().username||me().name||''; return String(n).split(/[@\s]/)[0]||'there'; }
function pcPhase1(){ var m=pcFirstName(); return [
  ['clock','Pulling the last 24 hours for you, '+m+' \u2728'],
  ['inbox','Counting tickets created in the window\u2026'],
  ['check-circle','Tallying resolutions and closure codes\u2026'],
  ['users','Crediting agents and AutoSIM\u2026'],
  ['hash','Counting hashtags on resolved tickets\u2026'],
  ['bar-chart','Building the hourly flow\u2026'],
  ['target','Ageing the open backlog (240-hour rule)\u2026'],
  ['check-circle','Almost there \u2014 assembling the pulse check\u2026']
]; }
function pcPhase2(){ var m=pcFirstName(); return [
  ['clock','Still working on it \u2014 thanks for your patience, '+m+'\u2026'],
  ['inbox','The server is taking a little longer than usual\u2026'],
  ['target','Re-checking the at-risk tickets\u2026'],
  ['bar-chart','Nearly ready \u2014 wrapping up the totals\u2026']
]; }
var _pcTimer=null;
function _pcSet(t){
  var e=document.getElementById('pcLoaderMsg'), i=document.getElementById('pcLoaderIc');
  if(i) i.innerHTML=ic(t[0]||'clock',30);
  if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent=t[1]; e.classList.add('gw-msg-in'); }
}
function _pcStop(){ if(_pcTimer){ clearInterval(_pcTimer); clearTimeout(_pcTimer); _pcTimer=null; } }
function _pcStart(){
  _pcStop();
  var p1=pcPhase1(), i=0; _pcSet(p1[0]);
  _pcTimer=setInterval(function(){
    i++;
    if(i<p1.length){ _pcSet(p1[i]); return; }
    _pcStop();
    _pcSet(['alert','Sorry for the delay \u2014 still crunching the numbers\u2026']);
    _pcTimer=setTimeout(function(){
      var p2=pcPhase2(), j=0; _pcSet(p2[0]);
      _pcTimer=setInterval(function(){ j=(j+1)%p2.length; _pcSet(p2[j]); },3000);
    },3000);
  },2000);
}
function _pcSuccess(){
  _pcStop();
  var l=document.getElementById('pcLoader'); if(l) l.classList.add('gw-done');
  var i=document.getElementById('pcLoaderIc'); if(i) i.innerHTML=ic('check-circle',30);
  var e=document.getElementById('pcLoaderMsg'); if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent='Data fetched successfully'; e.classList.add('gw-msg-in'); }
}
function _pcDelay(ms){ return new Promise(function(res){ setTimeout(res,ms); }); }
function loaderHtml(){
  return '<div id="pcLoader" class="gw-loader" role="status" aria-live="polite"><div class="gw-loader-in">'+
    '<div class="gw-orb"><span class="gw-orb-ic" id="pcLoaderIc">'+ic('clock',30)+'</span></div>'+
    '<div class="gw-loader-msg gw-msg-in" id="pcLoaderMsg">Getting the numbers ready\u2026</div>'+
    '<div class="gw-dots" aria-hidden="true"><span></span><span></span><span></span></div>'+
    '<div class="gw-loader-sub">Pulse check \u00b7 24h</div></div></div>';
}

// ---- State + flow ----
// autoRetried: the one automatic 429 retry is used.
var PC={ data:null, loading:false, autoRetried:false, retryTimer:null };
function wrap(){ return document.getElementById('wrap'); }
function setText(id,t){ var e=document.getElementById(id); if(e) e.textContent=t||''; }
// One muted line when the server dropped documents (missing IDs / unparseable or after-window dates).
function excludedNote(D){
  var x=D.excluded||{}, n0=function(v){ return Number(v)||0; };
  var c=n0(x.createdNoId)+n0(x.createdNoDate), r=n0(x.resolvedNoId)+n0(x.resolvedNoDate), o=n0(x.openNoId)+n0(x.openNoDate), n=c+r+o;
  if(!n) return '';
  return '<p class="pc-note" role="note">Note: '+tix(n)+' skipped (unparseable dates / missing IDs) \u2014 created '+num(c)+', resolved '+num(r)+', open '+num(o)+'.</p>';
}
function renderReport(D){
  var k=D.kpis;
  var banner=(k.created===0&&k.resolved===0)?'<div class="pc-banner" role="note">No tickets created or resolved in this window.'+(D.latestCreateDate?' Latest ticket in the dataset was created '+esc(fmtLong(D.latestCreateDate))+'.':'')+'</div>':'';
  wrap().innerHTML=hero(D)+toolbar()+excludedNote(D)+banner+
    secExec(D)+secKpis(D)+secTypes(D)+secRootCauses(D)+secResolutions(D)+secAgents(D)+
    secHashtags(D)+secHourly(D)+secSla(D)+secBreaches(D)+secActions(D);
  document.getElementById('pcExec').textContent=execText(D);
}
function renderError(msg){
  wrap().innerHTML=hero(PC.data)+toolbar()+
    '<div class="pc-card"><div class="pc-error" role="alert"><p>'+esc(msg)+'</p>'+
    '<button type="button" class="pc-btn" onclick="pcRetry()">'+ic('refresh',15)+'Retry</button></div></div>';
}
// With a report already on screen (background reload) the report stays in place and any error shows inline. Without one, the phased loader runs and a failure shows the error card.
async function load(fresh){
  if(PC.loading) return;
  PC.loading=true;
  if(PC.retryTimer){ clearTimeout(PC.retryTimer); PC.retryTimer=null; }
  var keep=!!PC.data;
  if(keep){ setText('pcStatus',''); }
  else { wrap().innerHTML=hero(null)+toolbar()+loaderHtml(); _pcStart(); }
  var t0=Date.now(), r=null;
  try{ r=await A.api('GET','/api/pulse-check'+(fresh?'?fresh=1':'')); }catch(e){ r=null; }
  if(r&&r.ok&&r.data&&r.data.kpis){
    if(!keep){ var wait=800-(Date.now()-t0); if(wait>0) await _pcDelay(wait); _pcSuccess(); await _pcDelay(500); }
    PC.data=r.data; PC.loading=false;
    renderReport(r.data);
    return;
  }
  _pcStop(); PC.loading=false;
  if(r&&r.status===401){
    // A.api already cleared the session and showed the expired-session modal; drop the loader.
    if(keep){ setText('pcStatus','Your session has expired. Please log in again.'); }
    else wrap().innerHTML='<div class="pc-gate"><h1>Pulse Check (24h)</h1><p>Your session has expired. Please log in again.</p></div>';
    return;
  }
  var msg=(r&&(r.status===429||r.status===503)&&r.data&&r.data.error)?r.data.error:'Could not load the pulse check report.';
  // 429: one automatic retry after Retry-After (the body mirrors the header as retryAfter, seconds).
  if(r&&r.status===429&&!PC.autoRetried){
    var ra=Math.min(60,Math.max(1,Number(r.data&&r.data.retryAfter)||5));
    PC.autoRetried=true;
    msg+=' Retrying in '+ra+'s\u2026';
    PC.retryTimer=setTimeout(function(){ PC.retryTimer=null; load(fresh); },ra*1000);
  }
  if(keep){ setText('pcStatus',msg); }
  else renderError(msg);
}
function pcRetry(){ PC.autoRetried=false; load(false); }
window.pcRetry=pcRetry;

// Live countdown (every second) to the next report. Once it runs out, show "is generating…"; once the next
// MST day has completed while the page is open (+60s), pull the new day's report (once per boundary).
var _pcAutoDayFor='';
setInterval(function(){
  var D=PC.data; if(!D||!D.nextUpdateAt) return;
  var cd=document.getElementById('pcCountdown');
  if(cd){
    var txt=fmtCountdown(Date.parse(D.nextUpdateAt)-Date.now());
    if(txt!==null) cd.textContent=txt;
    else { var ln=document.getElementById('pcNextLine'); if(ln) ln.textContent=pcNextDoneText(D); }
  }
  if(!PC.loading&&_pcAutoDayFor!==D.nextUpdateAt&&Date.now()>=Date.parse(D.nextUpdateAt)+60000){
    _pcAutoDayFor=D.nextUpdateAt; load(true);
  }
},1000);

(async function init(){
  if(!A||!A.getUser||!A.getUser()||!A.getToken()){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  try{ if(A.loadMyProfile) await A.loadMyProfile(); }catch(e){}
  load(false);
})();
</script>
