// Polite screen-reader announcement.
function pcAnnounce(msg){ var l=document.getElementById('pcLive'); if(!l) return; l.textContent=''; setTimeout(function(){ l.textContent=msg; },60); }
// ---- Export: the rendered report as plain text (tables tab-separated) -> clipboard ----
function pcCellsText(tr){ return Array.prototype.map.call(tr.children,function(c){ return c.textContent.replace(/\s+/g,' ').trim(); }).join('\t'); }
// Export only: prose is copied as bullets. Splits a paragraph into sentences at '. ' + uppercase letter/digit,
// except inside parentheses or after an abbreviation (e.g., vs., dotted initials); decimals like 7.5 and 'w/o' never match.
var PC_ABBR=/^(?:e\.g|i\.e|vs|approx|incl|dr|mr|mrs|ms|inc|ltd|(?:[a-z]\.)+[a-z])$/i;
// Executive Summary sentences that stay on the page but are left out of the Export.
var PC_EXEC_NOEXPORT=[/^Resolution rate:/i];
function pcExecExportSentences(text){
  return pcSentences(text).filter(function(s){ return !PC_EXEC_NOEXPORT.some(function(re){ return re.test(s); }); });
}
function pcSentences(text){
  var s=String(text==null?'':text).replace(/\s+/g,' ').trim(), out=[], depth=0, start=0;
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i);
    if(ch==='(') depth++;
    else if(ch===')'){ if(depth>0) depth--; }
    else if(ch==='.'&&depth===0&&s.charAt(i+1)===' '&&/[A-Z0-9]/.test(s.charAt(i+2))){
      var m=/(\S+)$/.exec(s.slice(start,i)), w=m?m[1].replace(/^[("'\u201c]+/,''):'';
      if(PC_ABBR.test(w)) continue;
      out.push(s.slice(start,i+1)); start=i+2;
    }
  }
  var rest=s.slice(start).trim(); if(rest) out.push(rest);
  return out;
}
// A .pc-line that labels the table below it (stays a heading, not a bullet): "Resolved Tickets (N)" or "Label:".
function pcIsSubHead(el){
  var c=el.classList, t=(el.textContent||'').replace(/\s+/g,' ').trim();
  return /^H[1-6]$/.test(String(el.tagName).toUpperCase())||(!!c&&c.contains('pc-line')&&/^(?:Resolved Tickets \([\d,]+\)|.*:)$/.test(t));
}
function pcBlockText(el,out){
  var tx=function(n){ return (n?n.textContent:'').replace(/\s+/g,' ').trim(); };
  if(el.classList&&el.classList.contains('pc-noexport')) return;   // on-page only
  if(el.classList&&el.classList.contains('pc-actions')){
    el.querySelectorAll('.pc-act').forEach(function(a){
      var b=a.querySelector('.pc-badge'), h=a.querySelector('h3'), p=a.querySelector('p');
      var title=tx(h).replace(tx(b),'').trim();
      out.push('\u25cf '+tx(b)+' \u2014 '+title); if(tx(p)) out.push('  '+tx(p));
    });
    return;
  }
  var tbl=(el.tagName==='TABLE')?el:(el.querySelector&&el.querySelector('table'));
  if(tbl&&(el.classList.contains('pc-scroll')||el.tagName==='TABLE')){
    tbl.querySelectorAll('tr').forEach(function(tr){ var line=pcCellsText(tr); if(line.replace(/\t/g,'')) out.push(line); });
    return;
  }
  if(el.tagName==='UL'){ el.querySelectorAll('li').forEach(function(li){ out.push('\u25cf '+tx(li)); }); return; }
  var t=tx(el); if(!t) return;
  if(pcIsSubHead(el)){ out.push(t); return; }
  if(el.id==='pcExec') pcExecExportSentences(t).forEach(function(s){ out.push('\u25cf '+s); });
  else out.push('\u25cf '+t);
}
function pcExportText(){
  var D=PC.data; if(!D) return '';
  var L=heroLines(D);
  var out=['WWOS GSOC PHD Operational Pulse Check',L.report];
  var w=wrap();
  w.querySelectorAll(':scope > .pc-banner, :scope > .pc-note').forEach(function(n){ out.push(''); pcBlockText(n,out); });
  w.querySelectorAll('section.pc-card').forEach(function(sec){
    if(sec.classList.contains('pc-noexport')) return;   // on-page only section (e.g. 7. Hashtag Analytics)
    sec=pcExportSec(sec);
    out.push('');
    var h=sec.querySelector('.pc-card-head .pc-card-title'), aside=sec.querySelector('.pc-head-aside');
    out.push(h?h.textContent.replace(/\s+/g,' ').trim():'');
    if(aside&&!aside.classList.contains('pc-noexport')&&aside.textContent.trim()) out.push('\u25cf '+aside.textContent.replace(/\s+/g,' ').trim());
    var body=sec.querySelector('.pc-card-body');
    if(body) Array.prototype.forEach.call(body.children,function(c){ pcBlockText(c,out); });
  });
  return out.join('\n');
}
// ---- Export: the rendered report as email-safe rich HTML (inline styles only; tables become images, see below) ----
// Built by walking a clone of the rendered report. Only whitelisted tags are emitted, no attributes are copied
// (except a validated absolute href and colspan/rowspan numbers), and every text node goes through esc().
var PC_FONT='font-family:Segoe UI,Arial,sans-serif;';
var PC_TBL='border-collapse:collapse;border:1px solid #c8d0dc;'+PC_FONT+'font-size:13px';
var PC_CELL='border:1px solid #c8d0dc;padding:4px;vertical-align:top;';
var PC_P='margin:6px 0;'+PC_FONT+'font-size:13px;line-height:1.5;color:#2a3340;';
var PC_H3='margin:12px 0 4px;'+PC_FONT+'font-size:14px;font-weight:bold;color:#1a2230;';
var PC_GAP='<div style="height:8px;line-height:8px;font-size:8px">&nbsp;</div>';
// Left indent of copied tables (matches the bullet lists' 20px + a little breathing room).
var PC_TBL_INDENT='margin:4px 0 10px 28px;padding:0;';
// Email-safe left padding for copied tables / table images. Outlook ignores margins on <div>/<img>, so the
// indent is a fixed-width spacer cell in a layout table (works in Outlook, Gmail and the browser).
var PC_TBL_PAD=32;
function pcIndentWrap(body){
  return '<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;border:0;margin:4px 0 10px 0">'+
    '<tr><td width="'+PC_TBL_PAD+'" style="width:'+PC_TBL_PAD+'px;min-width:'+PC_TBL_PAD+'px;padding:0;border:0;font-size:1px;line-height:1px">&nbsp;</td>'+
    '<td style="padding:0;border:0;vertical-align:top">'+body+'</td></tr></table>';
}
// Never exported: controls, icons, hidden / aria-only content, the inline status line and the live countdown.
function pcSkip(el){
  var t=String(el.tagName||'').toUpperCase();
  if(/^(BUTTON|SVG|SCRIPT|STYLE|NOSCRIPT|IMG|INPUT|SELECT|TEXTAREA|NAV)$/.test(t)) return true;
  if(el.hidden||el.getAttribute('aria-hidden')==='true') return true;
  if(el.style&&(el.style.display==='none'||el.style.visibility==='hidden')) return true;
  var c=el.classList;
  if(c&&(c.contains('pc-inline')||c.contains('pc-countdown')||c.contains('pc-noexport')||c.contains('sr-only')||c.contains('visually-hidden'))) return true;
  return el.id==='pcStatus'||el.id==='pcNextLine'||el.id==='pcCountdown';
}
function pcAbsUrl(u){
  var s=safeUrl(u); if(!s) return '';
  try{ return new URL(s,location.href).href; }catch(e){ return s; }
}
// Inline content: text, <b>, <a href>, <br>; everything else contributes only its (escaped) text.
function pcInline(node){
  var h='';
  Array.prototype.forEach.call(node.childNodes,function(n){
    if(n.nodeType===3){ h+=esc(n.textContent.replace(/\s+/g,' ')); return; }
    if(n.nodeType!==1||pcSkip(n)) return;
    var t=n.tagName.toUpperCase(), inner=pcInline(n);
    if(t==='B'||t==='STRONG') h+='<b>'+inner+'</b>';
    else if(t==='A'){ var u=pcAbsUrl(n.getAttribute('href')); h+=u?'<a href="'+esc(u)+'" style="color:#1f5fbf;font-weight:bold">'+inner+'</a>':inner; }
    else if(t==='BR') h+='<br>';
    else h+=inner;
  });
  return h;
}
function pcCellHtml(cell,sect,rowBg){
  var c=cell.classList, head=(sect==='thead'), foot=(sect==='tfoot'), th=(cell.tagName.toUpperCase()==='TH');
  var empty=!!(cell.parentNode&&cell.parentNode.classList&&cell.parentNode.classList.contains('pc-empty'));
  var st=PC_CELL+'text-align:'+(empty?'center':(c.contains('n')?'right':'left'))+';';
  if(c.contains('n')) st+='white-space:nowrap;';
  if(head) st+='font-weight:bold;background:#eef2f8;';
  else if(foot) st+='font-weight:bold;background:'+(rowBg||'#f6f8fb')+';';
  else { if(th||c.contains('pc-peak')) st+='font-weight:bold;'; if(rowBg) st+='background:'+rowBg+';'; }
  if(empty) st+='font-style:italic;color:#5b6676;';
  if(c.contains('pc-grp')) st+='border-left:2px solid #9aa7b8;';
  var span='', cs=parseInt(cell.getAttribute('colspan'),10), rs=parseInt(cell.getAttribute('rowspan'),10);
  if(cs>1) span+=' colspan="'+cs+'"';
  if(rs>1) span+=' rowspan="'+rs+'"';
  var inner=pcInline(cell).trim();
  var tag=head?'th':'td';
  return '<'+tag+span+' style="'+st+'">'+(inner||'&nbsp;')+'</'+tag+'>';
}
function pcTable(tbl){
  var h='<table border="1" cellpadding="4" cellspacing="0" style="'+PC_TBL+'">';
  var rowsOf=function(sec,name){
    return Array.prototype.map.call(sec.children,function(tr){
      if(String(tr.tagName).toUpperCase()!=='TR'||pcSkip(tr)) return '';
      var k=tr.classList, bg=k.contains('pc-row-risk')?'#fff4e0':(k.contains('pc-row-breach')?'#fdeaea':'');
      return '<tr>'+Array.prototype.map.call(tr.children,function(cell){ return pcSkip(cell)?'':pcCellHtml(cell,name,bg); }).join('')+'</tr>';
    }).join('');
  };
  Array.prototype.forEach.call(tbl.children,function(sec){
    if(pcSkip(sec)) return;
    var t=String(sec.tagName).toUpperCase();
    if(t==='CAPTION') h+='<caption style="text-align:left;padding-bottom:4px;color:#5b6676">'+pcInline(sec).trim()+'</caption>';
    else if(t==='THEAD'||t==='TBODY'||t==='TFOOT') h+=rowsOf(sec,t.toLowerCase());
    else if(t==='TR') h+=rowsOf({children:[sec]},'tbody');
  });
  return h+'</table>';
}
// Table output for the export: a queued placeholder (rendered as an image later) or the real HTML table.
var pcTblQ=null, pcCurTitle='';
function pcTableOut(tbl){
  if(pcTblQ){ pcTblQ.push({tbl:tbl,title:pcCurTitle}); return '<!--PCTBL'+(pcTblQ.length-1)+'-->'; }
  return pcIndentWrap(pcTable(tbl)+PC_GAP);
}
function pcParaStyle(el){
  var c=el.classList, st=PC_P;
  if(c.contains('pc-muted')||c.contains('pc-note')) st+='color:#5b6676;';
  if(c.contains('pc-note')) st+='font-size:12px;font-weight:bold;';
  if(c.contains('pc-warn')) st+='font-weight:bold;color:#6b3d05;background:#fff4e0;border-left:4px solid #e08a00;padding:6px 10px;';
  if(c.contains('pc-banner')) st+='font-weight:bold;color:#1d4a8f;background:#eaf2fd;border:1px solid #9bbbe8;padding:8px 12px;';
  return st;
}
// Action items: the severity badge becomes bold text, e.g. "CRITICAL \u2014 title", followed by the body paragraph.
// Bullets: every prose block is emitted as a marked <li>; pcMergeBullets wraps each run of consecutive items in one <ul>.
var PC_LI='<li style="margin:2px 0">', PC_UL='<ul style="margin:4px 0 10px 20px;padding:0;'+PC_FONT+'font-size:13px;line-height:1.5;color:#2a3340">';
function pcLi(inner){ return '\u0001'+PC_LI+inner+'</li>'; }
function pcMergeBullets(h){
  var re=new RegExp('(?:\\u0001'+PC_LI.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[\\s\\S]*?</li>)+','g');
  return h.replace(re,function(m){ return PC_UL+m.replace(/\u0001/g,'')+'</ul>'; });
}
// Action items: one bullet each: bold "CRITICAL \u2014 title", then the body after a line break.
function pcActionsHtml(el){
  var h='';
  Array.prototype.forEach.call(el.querySelectorAll('.pc-act'),function(a){
    var b=a.querySelector('.pc-badge'), hh=a.querySelector('h3'), p=a.querySelector('p');
    var sev=b?b.textContent.trim():'', title='';
    if(hh) Array.prototype.forEach.call(hh.childNodes,function(x){ if(x!==b) title+=x.textContent; });
    title=title.replace(/\s+/g,' ').trim();
    h+=pcLi('<b>'+esc((sev?sev+' \u2014 ':'')+title)+'</b>'+((p&&p.textContent.trim())?'<br>'+pcInline(p).trim():''));
  });
  return h;
}
function pcBlockHtml(n){
  if(n.nodeType===3){ var tx=n.textContent.replace(/\s+/g,' ').trim(); return tx?pcLi(esc(tx)):''; }
  if(n.nodeType!==1||pcSkip(n)) return '';
  var t=n.tagName.toUpperCase(), c=n.classList;
  if(t==='TABLE') return pcTableOut(n);
  if(c.contains('pc-scroll')) return Array.prototype.map.call(n.querySelectorAll('table'),pcTableOut).join('');
  if(c.contains('pc-actions')) return pcActionsHtml(n);
  if(t==='UL'||t==='OL'){
    var isUl=(t==='UL');
    var items=Array.prototype.map.call(n.children,function(li){
      if(String(li.tagName).toUpperCase()!=='LI'||pcSkip(li)) return '';
      return isUl?pcLi(pcInline(li).trim()):('<li style="margin:2px 0">'+pcInline(li).trim()+'</li>');
    }).join('');
    return (items&&!isUl)?'<ol style="margin:6px 0 6px 20px;padding:0;'+PC_FONT+'font-size:13px;line-height:1.5;color:#2a3340">'+items+'</ol>':items;
  }
  if((t==='DIV'||t==='SECTION')&&n.querySelector('p,ul,ol,table,div,h1,h2,h3,h4,h5,h6'))
    return Array.prototype.map.call(n.childNodes,pcBlockHtml).join('');
  if(!n.textContent.trim()) return '';
  var inner=pcInline(n).trim();
  if(pcIsSubHead(n)) return '<h3 style="'+PC_H3+'">'+inner+'</h3>';
  if(n.id==='pcExec') return pcExecExportSentences(n.textContent).map(function(s){ return pcLi(esc(s)); }).join('');
  return pcLi(inner);
}
function pcSectionHtml(sec){
  var head=sec.querySelector('.pc-card-head'), h2=head&&head.querySelector('.pc-card-title'), aside=head&&head.querySelector('.pc-head-aside'), body=sec.querySelector('.pc-card-body');
  pcCurTitle=h2?h2.textContent.replace(/\s+/g,' ').trim():'';
  var h='<h2 style="margin:20px 0 6px;'+PC_FONT+'font-size:16px;font-weight:bold;color:#1a2230">'+esc(pcCurTitle)+'</h2>';
  if(aside&&!pcSkip(aside)&&aside.textContent.trim()) h+=pcLi(pcInline(aside).trim());
  if(body) h+=Array.prototype.map.call(body.childNodes,pcBlockHtml).join('');
  return h;
}
// The whole report as one HTML fragment ('' when no report is loaded).
// With a queue array, every table is replaced by a <!--PCTBLn--> placeholder (queued for pcImagesHtml); without one, real <table>s are emitted.
function pcExportHtml(queue){
  pcTblQ=queue||null; pcCurTitle='';
  try{ return pcExportHtmlBuild(); } finally { pcTblQ=null; }
}
function pcExportHtmlBuild(){
  var D=PC.data, w=wrap(); if(!D||!w) return '';
  var root=w.cloneNode(true), L=heroLines(D);
  var h='<div style="'+PC_FONT+'font-size:13px;color:#2a3340">'+
    '<h1 style="margin:0 0 4px;'+PC_FONT+'font-size:20px;font-weight:bold;color:#1a2230">WWOS GSOC PHD Operational Pulse Check</h1>'+
    '<p style="margin:0 0 12px;'+PC_FONT+'font-size:14px;font-weight:bold;color:#2a3340">'+esc(L.report)+'</p>';
  Array.prototype.forEach.call(root.children,function(el){
    if(pcSkip(el)) return;
    var c=el.classList;
    if(String(el.tagName).toUpperCase()==='SECTION'&&c.contains('pc-card')) h+=pcSectionHtml(pcExportSec(el));
    else if(c.contains('pc-banner')||c.contains('pc-note')) h+=pcBlockHtml(el);
  });
  return pcMergeBullets(h)+'</div>';
}
// ---- Export: tables drawn as styled PNG images (canvas 2D, no libraries) ----
// pc-img-layout:start (pure layout; `measure(text,bold)` returns the text width in logical px)
var PC_IMG={padX:10,padY:6,lh:17,maxCol:420,minCol:30,maxH:8000,dpr:2,fs:13};
function pcIsNum(s){ return /^[-+]?\d[\d,]*(\.\d+)?%?$/.test(String(s).trim()); }
function pcWrapText(text,maxW,measure,bold){
  var lines=[], cur='';
  String(text).split(' ').forEach(function(w){
    if(!w) return;
    var t=cur?cur+' '+w:w;
    if(measure(t,bold)<=maxW){ cur=t; return; }
    if(cur){ lines.push(cur); cur=''; }
    if(measure(w,bold)<=maxW){ cur=w; return; }
    var piece='';
    Array.prototype.forEach.call(w,function(ch){
      if(piece&&measure(piece+ch,bold)>maxW){ lines.push(piece); piece=ch; } else piece+=ch;
    });
    cur=piece;
  });
  if(cur||!lines.length) lines.push(cur);
  return lines;
}
// model: {caption:'', rows:[{kind:'head'|'body'|'foot', empty:bool, cells:[{text,n,bold,link,grp,span}]}]}
function pcTblLayout(model,measure){
  var P=PC_IMG, rows=model.rows, ncols=0;
  var isBold=function(r,c){ return r.kind==='head'||r.total||c.bold; };
  rows.forEach(function(r){
    var k=0; r.cells.forEach(function(c){ c.span=Math.max(1,c.span||1); k+=c.span; });
    if(k>ncols) ncols=k;
    var f=r.cells[0]; r.total=r.kind==='foot'||!!(f&&/^(sub\s*)?total\b/i.test(f.text));
  });
  var colW=[]; for(var i=0;i<ncols;i++) colW.push(P.minCol);
  var natural=function(r,c){ return Math.ceil(measure(c.text,isBold(r,c)))+2*P.padX; };
  rows.forEach(function(r){ var ci=0; r.cells.forEach(function(c){ if(c.span===1&&!r.empty) colW[ci]=Math.max(colW[ci],Math.min(P.maxCol,natural(r,c))); ci+=c.span; }); });
  rows.forEach(function(r){
    var ci=0; r.cells.forEach(function(c){
      if(c.span>1&&!r.empty){
        var need=Math.min(P.maxCol*c.span,natural(r,c)), have=0, j;
        for(j=ci;j<ci+c.span;j++) have+=colW[j];
        if(need>have) for(j=ci;j<ci+c.span;j++) colW[j]+=Math.ceil((need-have)/c.span);
      }
      ci+=c.span;
    });
  });
  var width=colW.reduce(function(a,b){ return a+b; },0);
  var out={ncols:ncols,colW:colW,width:width,caption:null,head:[],body:[],foot:[],parts:[]};
  var bodyIdx=0;
  rows.forEach(function(r){
    var ci=0, maxL=1, cells=[];
    r.cells.forEach(function(c){
      var w=0; for(var j=ci;j<ci+c.span&&j<ncols;j++) w+=colW[j];
      var cx=0; for(var m=0;m<ci;m++) cx+=colW[m];
      var bold=isBold(r,c);
      var lines=pcWrapText(c.text,Math.max(1,w-2*P.padX),measure,bold);
      if(lines.length>maxL) maxL=lines.length;
      cells.push({x:cx,w:w,lines:lines,bold:bold,link:!!c.link&&r.kind!=='head',grp:!!c.grp,
        align:r.empty?'center':((c.n||pcIsNum(c.text))?'right':'left')});
      ci+=c.span;
    });
    var row={kind:r.kind,empty:!!r.empty,total:!!r.total,cells:cells,h:maxL*P.lh+2*P.padY,zebra:0};
    if(r.kind==='head') out.head.push(row);
    else if(r.kind==='foot') out.foot.push(row);
    else { row.zebra=bodyIdx++%2; out.body.push(row); }
  });
  if(model.caption){
    var cl=pcWrapText(model.caption,Math.max(1,width),measure,false);
    out.caption={lines:cl,h:cl.length*P.lh+6};
  }
  var sum=function(a){ return a.reduce(function(s,r){ return s+r.h; },0); };
  var headH=sum(out.head), footH=sum(out.foot), capH=out.caption?out.caption.h:0;
  var limit=P.maxH-1, part=null, cur=0;
  var open=function(first){ part={cap:first&&!!out.caption,body:[],foot:[],height:0}; cur=(part.cap?capH:0)+headH+1; out.parts.push(part); };
  open(true);
  out.body.forEach(function(r){
    if(part.body.length&&cur+r.h>limit) open(false);
    part.body.push(r); cur+=r.h;
  });
  if(out.foot.length){
    if(part.body.length&&cur+footH>limit) open(false);
    part.foot=out.foot.slice(); cur+=footH;
  }
  out.parts.forEach(function(p){
    p.height=(p.cap?capH:0)+headH+sum(p.body)+sum(p.foot)+1;
  });
  return out;
}
// pc-img-layout:end

function pcCellWalk(node,acc,inLink,inBold){
  Array.prototype.forEach.call(node.childNodes,function(n){
    if(n.nodeType===3){
      var t=n.textContent.replace(/\s+/g,' '), k=t.replace(/\s/g,'').length;
      acc.t+=t; acc.c+=k; if(inLink) acc.l+=k; if(inBold) acc.b+=k;
      return;
    }
    if(n.nodeType!==1||pcSkip(n)) return;
    var tg=n.tagName.toUpperCase();
    if(tg==='BR'){ acc.t+=' '; return; }
    pcCellWalk(n,acc,inLink||(tg==='A'&&!!pcAbsUrl(n.getAttribute('href'))),inBold||tg==='B'||tg==='STRONG');
  });
}
// Reads a rendered <table> (thead / tbody / tfoot / caption, colspan honoured) into the layout model.
function pcTblModel(tbl){
  var model={caption:'',rows:[]};
  var addRows=function(sec,kind){
    Array.prototype.forEach.call(sec.children,function(tr){
      if(String(tr.tagName).toUpperCase()!=='TR'||pcSkip(tr)) return;
      var cells=[];
      Array.prototype.forEach.call(tr.children,function(cell){
        if(pcSkip(cell)) return;
        var acc={t:'',c:0,l:0,b:0}; pcCellWalk(cell,acc,false,false);
        var k=cell.classList, th=cell.tagName.toUpperCase()==='TH';
        cells.push({text:acc.t.replace(/\s+/g,' ').trim(),n:k.contains('n'),grp:k.contains('pc-grp'),
          bold:th||k.contains('pc-peak')||(acc.c>0&&acc.b===acc.c),link:acc.c>0&&acc.l===acc.c,
          span:parseInt(cell.getAttribute('colspan'),10)||1});
      });
      if(cells.length) model.rows.push({kind:kind,empty:tr.classList.contains('pc-empty'),cells:cells});
    });
  };
  Array.prototype.forEach.call(tbl.children,function(sec){
    if(pcSkip(sec)) return;
    var t=String(sec.tagName).toUpperCase();
    if(t==='CAPTION') model.caption=sec.textContent.replace(/\s+/g,' ').trim();
    else if(t==='THEAD') addRows(sec,'head');
    else if(t==='TBODY') addRows(sec,'body');
    else if(t==='TFOOT') addRows(sec,'foot');
  });
  return model;
}
function pcImgFont(bold,italic){ return (italic?'italic ':'')+(bold?'bold ':'')+PC_IMG.fs+"px 'Segoe UI', Arial, sans-serif"; }
function pcMeasurer(){
  var ctx=document.createElement('canvas').getContext('2d');
  return function(t,bold){ ctx.font=pcImgFont(bold,false); return ctx.measureText(t).width; };
}
function pcDrawPart(L,part){
  var P=PC_IMG, W=L.width+1, H=part.height, cv=document.createElement('canvas');
  cv.width=W*P.dpr; cv.height=H*P.dpr;
  var ctx=cv.getContext('2d'); ctx.scale(P.dpr,P.dpr);
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.textBaseline='middle'; ctx.lineWidth=1;
  var y=0;
  if(part.cap){
    ctx.font=pcImgFont(false,false); ctx.fillStyle='#5b6676'; ctx.textAlign='left';
    L.caption.lines.forEach(function(s,i){ ctx.fillText(s,0,y+i*P.lh+P.lh/2); });
    y+=L.caption.h;
  }
  var drawRow=function(r){
    var bg=r.kind==='head'?'#1f3a68':(r.kind==='foot'||r.total?'#e6ecf5':(r.zebra?'#f4f7fb':'#ffffff'));
    r.cells.forEach(function(c){
      ctx.fillStyle=bg; ctx.fillRect(c.x,y,c.w+1,r.h+1);
      ctx.strokeStyle='#c8d0dc'; ctx.strokeRect(c.x+0.5,y+0.5,c.w,r.h);
      if(c.grp){ ctx.fillStyle=r.kind==='head'?'#6f86b3':'#9aa7b8'; ctx.fillRect(c.x,y,2,r.h+1); }
      ctx.font=pcImgFont(c.bold,r.empty);
      ctx.fillStyle=r.kind==='head'?'#ffffff':(r.empty?'#5b6676':(c.link?'#1a56db':'#2a3340'));
      var tx=c.align==='right'?c.x+c.w-P.padX:(c.align==='center'?c.x+c.w/2:c.x+P.padX);
      ctx.textAlign=c.align;
      c.lines.forEach(function(s,i){ ctx.fillText(s,tx,y+P.padY+i*P.lh+P.lh/2); });
    });
    y+=r.h;
  };
  L.head.forEach(drawRow); part.body.forEach(drawRow); part.foot.forEach(drawRow);
  return cv;
}
// One <img> per part (a table taller than ~8000 logical px is split, header row repeated).
function pcTableImages(tbl,title,measure){
  if(!measure) throw new Error('no canvas');
  var model=pcTblModel(tbl);
  if(!model.rows.length) throw new Error('empty table');
  var L=pcTblLayout(model,measure);
  return L.parts.map(function(part){
    var cv=pcDrawPart(L,part);
    // Pixels are drawn at PC_IMG.dpr (2x) for sharpness; BOTH width and height (attributes + inline px) pin the
    // display size to the logical size. With only a width, Outlook/Word take the 2x natural height -> stretched.
    // No max-width:100%: shrinking the width alone while the height stays fixed distorts the image.
    var w=L.width+1, h=part.height;
    return '<img src="'+cv.toDataURL('image/png')+'" width="'+w+'" height="'+h+'" alt="'+esc((title||'Report')+' table')+'" style="display:block;width:'+w+'px;height:'+h+'px;margin:6px 0 12px;border:0">';
  }).join('');
}
// Replaces the queued table placeholders with images (a table that fails to render falls back to the HTML table). Never rejects.
async function pcImagesHtml(html,queue){
  if(!queue.length) return html;
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(_){}
  var measure=null; try{ measure=pcMeasurer(); }catch(_){}
  return html.replace(/<!--PCTBL(\d+)-->/g,function(m,i){
    var it=queue[+i];
    // Every copied table (image, or the HTML-table fallback) sits in an indented block so it lines up with
    // the bullet text. A block-level div's margin-left is honoured by Outlook/Word, Teams and OneNote.
    var body;
    try{ body=pcTableImages(it.tbl,it.title,measure); }
    catch(e){ body=pcTable(it.tbl)+PC_GAP; }
    return pcIndentWrap(body);
  });
}
// Fallback 1: select the HTML in an off-screen contenteditable div and run the browser's copy command.
// A temporary copy listener keeps the tab-separated text as text/plain.
function pcCopyViaSelection(html,plain){
  var d=document.createElement('div'), sel=window.getSelection&&window.getSelection(), ok=false;
  d.contentEditable='true'; d.setAttribute('aria-hidden','true');
  d.style.cssText='position:fixed;left:-10000px;top:0;width:800px;height:1px;overflow:hidden;';
  d.innerHTML=html;
  var onCopy=function(e){
    try{ if(e.clipboardData){ e.clipboardData.setData('text/html',html); e.clipboardData.setData('text/plain',plain); e.preventDefault(); } }catch(_){}
  };
  document.body.appendChild(d); document.addEventListener('copy',onCopy);
  try{
    var r=document.createRange(); r.selectNodeContents(d);
    sel.removeAllRanges(); sel.addRange(r);
    ok=document.execCommand('copy');
  }catch(e){ ok=false; }
  document.removeEventListener('copy',onCopy);
  try{ sel.removeAllRanges(); }catch(_){}
  document.body.removeChild(d);
  return ok;
}
// Fallback 3 (as before): plain text through a hidden textarea, for contexts without the async clipboard.
function pcCopyTextarea(txt){
  var ok=false, ta=document.createElement('textarea');
  ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ ok=document.execCommand('copy'); }catch(_){ ok=false; }
  document.body.removeChild(ta);
  return ok;
}
async function pcExport(){
  var txt=pcExportText(); if(!txt) return;
  var html='', q=[]; try{ html=pcExportHtml(q); }catch(e){ html=''; }
  var btn=document.getElementById('pcExport'), lbl=document.getElementById('pcExportLbl');
  if(btn&&btn.getAttribute('aria-busy')==='true') return;   // a copy is already running
  var ok=false;
  // Busy state while the table images are drawn and the clipboard is written.
  if(btn){ btn.setAttribute('aria-busy','true'); btn.classList.remove('ok','bad'); }
  if(lbl) lbl.textContent='Preparing copy\u2026';
  // Text sections stay rich text; tables become PNG images (built after fonts are ready; the Promise never rejects).
  var htmlP=html?pcImagesHtml(html,q):null;
  var mk=function(s){ return new Blob(['<html><head><meta charset="utf-8"></head><body>'+s+'</body></html>'],{type:'text/html'}); };
  var plain=new Blob([txt],{type:'text/plain'});
  // 1) Rich copy: text/html (images for tables) + text/plain (tab-separated). The ClipboardItem is created inside the
  //    click (before any await) with a Promise for text/html; if the browser rejects that, retry after awaiting the HTML.
  if(htmlP&&window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
    try{
      await navigator.clipboard.write([new ClipboardItem({'text/html':htmlP.then(mk),'text/plain':plain})]);
      ok=true;
    }catch(e){
      try{
        await navigator.clipboard.write([new ClipboardItem({'text/html':mk(await htmlP),'text/plain':plain})]);
        ok=true;
      }catch(e2){ ok=false; }
    }
  }
  // 2) Select + execCommand('copy') on an off-screen contenteditable copy of the same HTML (with images).
  if(!ok&&htmlP) ok=pcCopyViaSelection(await htmlP,txt);
  // 3) Plain text only.
  if(!ok){
    try{ await navigator.clipboard.writeText(txt); ok=true; }
    catch(e){ ok=pcCopyTextarea(txt); }
  }
  if(lbl){ lbl.textContent=ok?'Copied!':'Copy failed'; }
  if(btn){ btn.removeAttribute('aria-busy'); btn.classList.toggle('ok',ok); btn.classList.toggle('bad',!ok); }
  pcAnnounce(ok?'Pulse report copied to the clipboard':'Could not copy the pulse report');
  setTimeout(function(){ if(lbl) lbl.textContent=pcExportLabel(PC.data); if(btn) btn.classList.remove('ok','bad'); },1600);
}
window.pcExport=pcExport;
// Inline error line (hidden while empty) for a failed background reload.
function toolbar(){
  return '<div class="pc-inline" id="pcStatus" role="alert"></div>';
}

// ---- Phased loader (trimmed copy of performance-summary.html) ----
function pcFirstName(){ var n=me().username||me().name||''; return String(n).split(/[@\s]/)[0]||'there'; }
function pcPhase1(){ var m=pcFirstName(); return [
  ['clock','Pulling the last 24 hours for you, '+m+' \u2728'],
  ['inbox','Counting tickets created in the window\u2026'],
  ['check-circle','Tallying resolutions and closure codes\u2026'],
  ['users','Crediting agents and AutoSIM\u2026'],
  ['hash','Counting hashtags on resolved tickets\u2026'],
  ['bar-chart','Building the hourly flow\u2026'],
  ['target','Ageing the open backlog (240-hour rule)\u2026'],
  ['check-circle','Almost there \u2014 assembling the pulse check\u2026']
]; }
function pcPhase2(){ var m=pcFirstName(); return [
  ['clock','Still working on it \u2014 thanks for your patience, '+m+'\u2026'],
  ['inbox','The server is taking a little longer than usual\u2026'],
  ['target','Re-checking the at-risk tickets\u2026'],
  ['bar-chart','Nearly ready \u2014 wrapping up the totals\u2026']
]; }
var _pcTimer=null;
function _pcSet(t){
  var e=document.getElementById('pcLoaderMsg'), i=document.getElementById('pcLoaderIc');
  if(i) i.innerHTML=ic(t[0]||'clock',15);
  if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent=t[1]; e.classList.add('gw-msg-in'); }
}
function _pcStop(){ if(_pcTimer){ clearInterval(_pcTimer); clearTimeout(_pcTimer); _pcTimer=null; } }
function _pcStart(){
  _pcStop();
  var p1=pcPhase1(), i=0; _pcSet(p1[0]);
  _pcTimer=setInterval(function(){
    i++;
    if(i<p1.length){ _pcSet(p1[i]); return; }
    _pcStop();
    _pcSet(['alert','Sorry for the delay \u2014 still crunching the numbers\u2026']);
    _pcTimer=setTimeout(function(){
      var p2=pcPhase2(), j=0; _pcSet(p2[0]);
      _pcTimer=setInterval(function(){ j=(j+1)%p2.length; _pcSet(p2[j]); },3000);
    },3000);
  },2000);
}
function _pcSuccess(){
  _pcStop();
  var l=document.getElementById('pcLoader'); if(l) l.classList.add('gw-done');
  var i=document.getElementById('pcLoaderIc'); if(i) i.innerHTML=ic('check-circle',15);
  var e=document.getElementById('pcLoaderMsg'); if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent='Data fetched successfully'; e.classList.add('gw-msg-in'); }
}
function _pcDelay(ms){ return new Promise(function(res){ setTimeout(res,ms); }); }
// Skeleton placeholders that mirror the final layout (KPI row, summary card, key-metrics table, distribution
// tables) + a rotating status line. Visual only (aria-hidden); #wrap carries aria-busy and #pcLive announces.
function loaderHtml(){
  var sk=function(w,h,extra){ return '<span class="pc-sk" style="width:'+w+';height:'+h+'px'+(extra?';'+extra:'')+'"></span>'; };
  var kpiSk='<div class="pc-kpi is-sk">'+sk('58%',11)+sk('44%',34,'margin-top:14px')+sk('72%',14,'margin-top:11px')+'</div>';
  var head='<div class="pc-card-head"><div class="pc-card-h">'+sk('22px',22,'border-radius:5px')+sk('34px',34,'border-radius:9px')+
    '<span style="display:flex;flex-direction:column;gap:7px">'+sk('200px',14,'max-width:46vw')+sk('260px',10,'max-width:52vw')+'</span></div></div>';
  var lines=function(ws){ return ws.map(function(w){ return sk(w,12,'margin-top:10px'); }).join(''); };
  var tbl=function(n,ws){ var r='<div class="pc-sk-row">'+sk('22%',9)+sk('14%',9)+'</div>'; for(var i=0;i<n;i++) r+='<div class="pc-sk-row">'+sk(ws[i%ws.length],12)+sk('92px',8,'border-radius:99px;margin-left:auto')+sk('44px',12)+'</div>'; return '<div class="pc-sk-tbl">'+r+'</div>'; };
  var cardSk=function(body){ return '<div class="pc-card">'+head+'<div class="pc-card-body">'+body+'</div></div>'; };
  return '<div id="pcLoader" class="pc-load" aria-hidden="true">'+
      '<div class="pc-kpis">'+kpiSk+kpiSk+kpiSk+kpiSk+'</div>'+
      '<div class="pc-loadnote"><span class="pc-loadnote-ic" id="pcLoaderIc">'+ic('clock',15)+'</span>'+
        '<span class="pc-loadnote-msg gw-msg-in" id="pcLoaderMsg">Getting the numbers ready\u2026</span></div>'+
      cardSk(lines(['96%','92%','84%','60%']))+
      cardSk(tbl(6,['48%','36%','42%','30%','40%','34%']))+
      cardSk(tbl(5,['58%','44%','50%','38%','30%']))+
      cardSk(tbl(4,['52%','40%','46%','32%']))+
    '</div>';
}

// ---- State + flow ----
// autoRetried: the one automatic 429 retry is used.
var PC={ data:null, loading:false, autoRetried:false, retryTimer:null };
function wrap(){ return document.getElementById('wrap'); }
function setText(id,t){ var e=document.getElementById(id); if(e) e.textContent=t||''; }
// One muted line when the server dropped documents (missing IDs / unparseable or after-window dates).
function excludedNote(D){
  var x=D.excluded||{}, n0=function(v){ return Number(v)||0; };
  var c=n0(x.createdNoId)+n0(x.createdNoDate), r=n0(x.resolvedNoId)+n0(x.resolvedNoDate), o=n0(x.openNoId)+n0(x.openNoDate), n=c+r+o;
  if(!n) return '';
  return '<p class="pc-note" role="note">Note: '+tix(n)+' skipped (unparseable dates / missing IDs) \u2014 created '+num(c)+', resolved '+num(r)+', open '+num(o)+'.</p>';
}
function renderReport(D){
  var k=D.kpis;
  var banner=(k.created===0&&k.resolved===0)?'<div class="pc-banner" role="note">No tickets created or resolved in this window.'+(D.latestCreateDate?' Latest ticket in the dataset was created '+esc(fmtLong(D.latestCreateDate))+'.':'')+'</div>':'';
  // The skipped-documents note (excludedNote) is no longer shown on the page or in the Export.
  wrap().innerHTML=hero(D)+kpiStrip(D)+toolbar()+banner+
    secExec(D)+secKpis(D)+secTypes(D)+secRootCauses(D)+secResolutions(D)+secAgents(D)+
    secHashtags(D)+secHourly(D)+secSla(D)+secBreaches(D)+secActions(D);
  document.getElementById('pcExec').textContent=execText(D);
}
// Friendly error state (overlaps the hero) with a Retry that re-runs the same fetch.
function renderError(msg){
  wrap().innerHTML=hero(PC.data,true)+
    '<div class="pc-state" role="alert">'+
      '<span class="pc-state-ic" aria-hidden="true">'+ic('alert',26)+'</span>'+
      '<h2>We couldn\u2019t load the pulse check</h2>'+
      '<p>'+esc(msg)+'</p><p>Check your connection, then select Retry.</p>'+
      '<button type="button" class="pc-btn" onclick="pcRetry()">'+ic('refresh',15)+'Retry</button>'+
    '</div>'+toolbar();
}
// With a report already on screen (background reload) the report stays in place and any error shows inline. Without one, the phased loader runs and a failure shows the error card.
async function load(fresh){
  if(PC.loading) return;
  PC.loading=true;
  if(PC.retryTimer){ clearTimeout(PC.retryTimer); PC.retryTimer=null; }
  var keep=!!PC.data;
  if(keep){ setText('pcStatus',''); }
  else {
    var w0=wrap(); w0.classList.remove('is-anim'); w0.setAttribute('aria-busy','true');
    w0.innerHTML=hero(null)+loaderHtml()+toolbar(); _pcStart();
    pcAnnounce('Loading the pulse check report\u2026');
  }
  var t0=Date.now(), r=null;
  try{ r=await A.api('GET','/api/pulse-check'+(fresh?'?fresh=1':'')); }catch(e){ r=null; }
  if(r&&r.ok&&r.data&&r.data.kpis){
    if(!keep){ var wait=800-(Date.now()-t0); if(wait>0) await _pcDelay(wait); _pcSuccess(); await _pcDelay(500); }
    PC.data=r.data; PC.loading=false;
    renderReport(r.data);
    var w1=wrap(); w1.removeAttribute('aria-busy'); w1.classList.toggle('is-anim',!keep);
    pcAnnounce('Pulse check report loaded \u2014 '+heroLines(r.data).report+'.');
    return;
  }
  _pcStop(); PC.loading=false;
  wrap().removeAttribute('aria-busy');
  if(r&&r.status===401){
    // A.api already cleared the session and showed the expired-session modal; drop the loader.
    if(keep){ setText('pcStatus','Your session has expired. Please log in again.'); }
    else wrap().innerHTML='<div class="pc-gate"><h1>Pulse Check (24h)</h1><p>Your session has expired. Please log in again.</p></div>';
    return;
  }
  var msg=(r&&(r.status===429||r.status===503)&&r.data&&r.data.error)?r.data.error:'Could not load the pulse check report.';
  // 429: one automatic retry after Retry-After (the body mirrors the header as retryAfter, seconds).
  if(r&&r.status===429&&!PC.autoRetried){
    var ra=Math.min(60,Math.max(1,Number(r.data&&r.data.retryAfter)||5));
    PC.autoRetried=true;
    msg+=' Retrying in '+ra+'s\u2026';
    PC.retryTimer=setTimeout(function(){ PC.retryTimer=null; load(fresh); },ra*1000);
  }
  if(keep){ setText('pcStatus',msg); }
  else renderError(msg);
  pcAnnounce('Could not load the pulse check report.');
}
// Retry: re-run the same fetch; keep keyboard focus inside the report area (the button is replaced by the skeleton).
function pcRetry(){ PC.autoRetried=false; load(false); var w=wrap(); if(w) w.focus({preventScroll:true}); }
window.pcRetry=pcRetry;

// Live countdown (every second) to the next report. Once it runs out, show "is generating…"; once the next
// MST day has completed while the page is open (+60s), pull the new day's report (once per boundary).
var _pcAutoDayFor='';
setInterval(function(){
  var D=PC.data; if(!D||!D.nextUpdateAt) return;
  var cd=document.getElementById('pcCountdown');
  if(cd){
    var txt=fmtCountdown(Date.parse(D.nextUpdateAt)-Date.now());
    if(txt!==null) cd.textContent=txt;
    else { var ln=document.getElementById('pcNextLine'); if(ln) ln.textContent=pcNextDoneText(D); }
  }
  if(!PC.loading&&_pcAutoDayFor!==D.nextUpdateAt&&Date.now()>=Date.parse(D.nextUpdateAt)+60000){
    _pcAutoDayFor=D.nextUpdateAt; load(true);
  }
},1000);

(async function init(){
  if(!A||!A.getUser||!A.getUser()||!A.getToken()){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  try{ if(A.loadMyProfile) await A.loadMyProfile(); }catch(e){}
  load(false);
})();
</script>
