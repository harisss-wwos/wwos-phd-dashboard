<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Check (24h) · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: keep the page hidden until topbar-auth.js has injected its chrome. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --o:#ff6100; --o-l:#fe9046; --page:#f4f3ef; --card:#ffffff; --ink:#1b2026; --ink2:#161d2d;
  --mut:#5c6773; --mut2:#818284; --line:#e2e6ea; --soft:#f5f6f8; --blue:#2b66c1; --blue-bg:#e6f0fc; --blue-ic:#c4def6;
  --green:#1a7a43; --green-bg:#e5f5ec; --red:#b42318; --red-bg:#fdecec; --amber:#b5530a; --amber-bg:#fff3e8;
  --acc:#ec7211; --acc-ink:#9a4100; --focus:#f0a35a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--page);color:var(--ink);min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:var(--ink);line-height:1}
.wrap{width:auto!important;max-width:none!important;margin:0 15px!important;padding:0 0 28px!important}
#wrap.wrap{padding-top:0!important}

/* =====================================================================================
   Pulse Check — same visual language as performance-summary.html / errors-in-resolved.html:
   dark navy hero (grid texture + orange glow + orange left rule), KPI cards overlapping it,
   then white collapsible section cards. Scoped under #wrap.pc (a size container).
   The report sections stay DIRECT children of #wrap (the Export walks them).
   ===================================================================================== */
.pc{container-type:inline-size;color:var(--ink)}
.pc:focus{outline:none}
.pc button{font:inherit;text-transform:none}
.pc :is(button,a,input,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pc-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.pc-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 80px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.pc-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.pc-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.pc-hero-in{position:relative;display:flex;gap:20px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.pc-hero-main{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1 1 380px}
.pc-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.pc-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.pc-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.08}
.pc-hero-sub{margin-top:9px;max-width:64ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.8)}
.pc-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;list-style:none;padding:0}
.pc-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  font-size:.8em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;max-width:100%;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pc-chip svg{flex-shrink:0;color:#ffb26b}
.pc-chip-l{color:rgba(233,237,243,.62);font-weight:800;font-size:.86em;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.pc-chip b{font-weight:700;min-width:0;overflow-wrap:anywhere}
.pc-chip .pc-sk{background:linear-gradient(90deg,rgba(255,255,255,.12) 25%,rgba(255,255,255,.26) 40%,rgba(255,255,255,.12) 60%);background-size:400% 100%}
.pc-hero-next{margin-top:12px;font-size:.84em;line-height:1.55;font-weight:600;color:rgba(233,237,243,.78)}
.pc-countdown{font-variant-numeric:tabular-nums;font-weight:800;color:#fff;background:rgba(236,114,17,.22);border:1px solid rgba(236,114,17,.45);border-radius:6px;padding:1px 7px;white-space:nowrap}
.pc-hero-tools{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:0 0 auto}

/* Export (copy) — primary orange button on the hero, with busy / done states. */
.pc-export{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.86em;font-weight:800;
  color:#fff;background:var(--acc);border:none;border-radius:8px;padding:10px 16px;box-shadow:0 8px 18px -10px rgba(236,114,17,.9);
  transition:background .15s,transform .12s,opacity .15s}
.pc-export:hover{background:#d4620b}
.pc-export:active{transform:translateY(1px)}
.pc-export:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.pc-export[aria-busy="true"]{opacity:.85;cursor:progress}
.pc-export[aria-busy="true"] svg{animation:pcSpin .9s linear infinite}
.pc-export.ok{background:#1f9d57;box-shadow:none}
.pc-export.bad{background:var(--red)}
.pc-export svg{flex-shrink:0}
@keyframes pcSpin{100%{transform:rotate(360deg)}}

/* Primary (navy) button — Retry. */
.pc-btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.86em;font-weight:800;
  color:#f4f3ef;background:#161d2d;border:none;border-radius:8px;padding:10px 16px;transition:background .15s}
.pc-btn:hover{background:#0f1420}
.pc-btn:disabled{opacity:.55;cursor:default}

/* ---- KPI row (overlaps the hero) ---- */
.pc-kpis{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:-58px 18px 16px}
@container (min-width:520px){.pc-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.pc-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pc-kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.pc-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#1f2a40)}
.pc-kpi-l{display:flex;align-items:center;gap:9px;font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.pc-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--kb,var(--soft));color:var(--ki,#3a4552)}
.pc-kpi-n{margin-top:12px;font-size:2.4em;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.pc-kpi-sub{margin-top:9px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:.8em;font-weight:600;color:var(--mut)}
.pc-kpi-sub b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.pc-kpi-bar{margin-top:12px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.pc-kpi-bar i{display:block;height:100%;border-radius:inherit;background:var(--k)}
.pc-kpi.k-base{--k:#1f2a40}
.pc-kpi.k-good{--k:#1f9d57;--kb:var(--green-bg);--ki:var(--green)}
.pc-kpi.k-warn{--k:var(--acc);--kb:var(--amber-bg);--ki:var(--amber)}
.pc-kpi.k-blue{--k:#2b66c1;--kb:var(--blue-bg);--ki:var(--blue)}
.pc-pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.92em;font-weight:800;color:#3a4552;white-space:nowrap;font-variant-numeric:tabular-nums}
.pc-pill.good{color:var(--green);background:var(--green-bg);border-color:#bfe6cf}
.pc-pill.bad{color:var(--red);background:var(--red-bg);border-color:#f2c3bd}
.pc-pill.warn{color:var(--amber);background:var(--amber-bg);border-color:#f7d3b0}

/* ---- Inline status / notes / banner (direct children of #wrap) ---- */
.pc-inline{margin:0 18px 14px;padding:10px 14px;border-radius:10px;background:var(--red-bg);border:1px solid #f2c3bd;color:var(--red);font-size:.86em;font-weight:700}
.pc-inline:empty{display:none}
.pc-note{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:.82em;font-weight:600;color:var(--mut)}
.pc-banner{margin-bottom:16px;padding:12px 16px;border-radius:10px;background:var(--blue-bg);border:1px solid var(--blue-ic);border-left:4px solid var(--blue);color:#1d4a8f;font-weight:700;font-size:.9em}

/* ---- Section cards (chevron expander, as on errors-in-resolved) ---- */
.pc-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18);margin-bottom:16px;overflow:hidden}
.pc-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.pc-card.is-shut .pc-card-head{border-bottom-color:transparent}
.pc-card-h{display:flex;align-items:center;gap:12px;min-width:0;font-size:1em;font-weight:inherit}
.pc-card-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;flex-shrink:0;background:var(--cb,var(--blue-bg));color:var(--ci,var(--blue))}
.pc-card.t-green{--cb:var(--green-bg);--ci:var(--green)}
.pc-card.t-amber{--cb:var(--amber-bg);--ci:var(--amber)}
.pc-card.t-rose{--cb:var(--red-bg);--ci:var(--red)}
.pc-card-tt{display:flex;flex-direction:column;min-width:0;text-align:left}
.pc-card-title{font-size:1.12em;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:var(--ink)}
.pc-card-no{color:var(--acc);font-variant-numeric:tabular-nums}
.pc-card-sub{margin-top:3px;font-size:.8em;font-weight:500;color:var(--mut);line-height:1.4}
.pc-exp{display:inline-flex;align-items:center;gap:12px;margin:-5px -8px;padding:5px 10px 5px 6px;border:none;border-radius:9px;background:none;color:var(--ink);cursor:pointer;min-width:0}
.pc-exp:hover{background:#fafbfc}
.pc-chev{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;color:#818284}
.pc-chev svg{transition:transform .15s}
.pc-exp[aria-expanded="true"] .pc-chev svg{transform:rotate(90deg)}
.pc-exp:hover .pc-chev{background:#e6f0fc;color:#2b66c1}
.pc-head-aside{display:inline-flex;align-items:center;padding:5px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.76em;font-weight:700;color:#3a4552;line-height:1.4;max-width:100%}
.pc-card-body{padding:16px 20px 18px;font-size:.92em;line-height:1.65;color:#2a3340}
.pc-card-body[hidden]{display:none}
.pc-card-body>*+*{margin-top:12px}
.pc-card-body b{color:var(--ink);font-weight:800}
.pc-card a{color:var(--blue);font-weight:700;text-decoration:none}
.pc-card a:hover{text-decoration:underline}
#pcExec{font-size:1.04em;line-height:1.7;color:#2a3340;max-width:110ch}
.pc-line{font-weight:800;color:var(--ink)}
/* Sub-heading lines that label the table below (e.g. "Resolved Tickets (N)"). */
.pc-card-body>.pc-line{display:flex;align-items:center;gap:10px;font-size:.78em;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-top:18px}
.pc-card-body>.pc-line::after{content:'';flex:1 1 auto;height:1px;background:var(--line)}
.pc-card-body>.pc-line:first-child{margin-top:0}
/* ...but a whole-sentence summary line stays a normal sentence. */
.pc-card-body>.pc-line.pc-say{font-size:.98em;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:700}
.pc-card-body>.pc-line.pc-say::after{display:none}
.pc-muted{color:var(--mut)}
/* Section 7 hashtag summary: stat tiles + one chip per hashtag (replaces the long sentence). */
.pc-hs{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.pc-hs-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pc-hs-stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-top:3px solid #c8d0dc;border-radius:10px;background:#fff}
.pc-hs-stat.t-blue{border-top-color:#3b6fe0}
.pc-hs-stat.t-amber{border-top-color:var(--acc)}
.pc-hs-stat.t-green{border-top-color:#1f9d57}
.pc-hs-l{font-size:.72em;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.pc-hs-n{font-size:1.6em;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
.pc-hs-s{font-size:.8em;color:var(--mut)}
.pc-hs-cap{margin:0;font-size:.86em;font-weight:700;color:var(--ink)}
.pc-hs-chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.pc-hs-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:999px;background:#f7f9fc;font-size:.86em}
.pc-hs-chip.is-top{border-color:#f7c99e;background:#fff4e9}
.pc-hs-tag{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#1b2026;font-weight:600}
.pc-hs-c{min-width:26px;padding:2px 8px;border-radius:999px;background:#1b2a3d;color:#fff;font-weight:800;font-size:.9em;text-align:center;font-variant-numeric:tabular-nums}
.pc-hs-chip.is-top .pc-hs-c{background:var(--acc)}
@media (max-width:600px){.pc-hs-stats{grid-template-columns:1fr}}
.pc-warn{padding:10px 14px;border-radius:10px;background:var(--amber-bg);border:1px solid #f7d3b0;border-left:4px solid var(--acc);color:#6b3d05;font-weight:700}
.pc-bullets{padding-left:20px}
.pc-bullets li::marker{color:var(--acc)}
.pc-bullets li+li{margin-top:4px}

/* ---- Tables (sticky header, subtle separators, hover rows, inline bars) ---- */
.pc-scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.pc-tbl{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:.95em}
.pc-tbl caption{caption-side:top;text-align:left;padding:8px 14px 6px}
.pc-tbl th,.pc-tbl td{padding:9px 14px;border-bottom:1px solid #eef1f4;text-align:left;vertical-align:top;color:#2a3340}
.pc-tbl thead th{position:sticky;top:0;z-index:1;background:#f5f6f8;border-bottom:1px solid var(--line);font-size:.74em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.pc-tbl tbody th{font-weight:700;color:var(--ink)}
.pc-tbl td.n,.pc-tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-tbl tbody tr{transition:background .12s}
.pc-tbl tbody tr:hover>*{background:#fafbfc}
.pc-tbl tbody tr:last-child>*{border-bottom:none}
.pc-tbl tfoot th,.pc-tbl tfoot td{font-weight:800;background:#f5f6f8;color:var(--ink);border-top:1px solid var(--line);border-bottom:none}
.pc-tbl .pc-wrap{display:block;min-width:140px;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.pc-tbl .pc-empty td{color:var(--mut);text-align:center;font-style:italic}
.pc-tbl .pc-peak{font-weight:800;color:var(--ink)}
.pc-tbl .pc-grp{border-left:1px solid var(--line)}
.pc-kv{min-width:560px}
.pc-kv tbody th[scope=row]{font-weight:600;color:#3a4552}
.pc-kv td.n b{font-size:1.08em}
.pc-row-risk>*{background:#fff6ec!important}
.pc-row-risk>:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.pc-row-breach>*{background:#fdf0ef!important}
.pc-row-breach>:first-child{box-shadow:inset 3px 0 0 var(--red)}
/* Section 3 (Issue Type Distribution): full-height table (no inner scroll bar), red "missing RCD" row,
   slate-tinted "closed without agent work" group at the bottom under a thin labelled divider. */
.pc-scroll.pc-full{max-height:none;overflow-y:visible}
.pc-issue-tbl thead th{position:static}
.pc-row-ic{display:inline-flex;align-items:center;flex-shrink:0}
.pc-row-lbl{display:inline-flex;align-items:center;gap:8px}
.pc-row-auto>*{background:#eef3fa!important}
.pc-row-auto>:first-child{box-shadow:inset 3px 0 0 #7a93b8}
.pc-row-auto .pc-row-ic{color:#4a6a9a}
.pc-tbl tr.pc-grp-div>th{padding:7px 14px 5px;background:#fff!important;border-top:1px solid #cfd8e6;border-bottom:1px solid #e3e9f2;font-size:.72em;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.pc-tbl tr.pc-grp-div .pc-row-ic{display:inline-flex;vertical-align:-2px;margin-right:6px;color:#4a6a9a}
.pc-tbl tbody tr.pc-grp-div:hover>*{background:#fff!important}
.pc-row-miss{cursor:pointer}
.pc-row-miss>*{background:var(--red-bg)!important}
.pc-row-miss:hover>*{background:#fbdcdc!important}
.pc-row-miss>:first-child{box-shadow:inset 3px 0 0 var(--red)}
.pc-miss-btn{display:inline-flex;align-items:center;gap:8px;margin:-3px -6px;padding:3px 6px;border:none;border-radius:6px;background:none;color:var(--red);font-weight:800;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.pc-miss-btn:hover{background:rgba(180,35,24,.08)}
/* Pager (10 per page) */
.pc-pgbox>*+*{margin-top:10px}
.pc-pager{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 14px}
.pc-pager-info{font-size:.84em;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.pc-pager-btns{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.pc-pg-b{min-width:34px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#2a3340;font-size:.84em;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.pc-pg-b:hover:not(:disabled){border-color:#b9c3cf;background:#f5f6f8}
.pc-pg-b.is-cur{background:#161d2d;border-color:#161d2d;color:#fff}
.pc-pg-b:disabled{opacity:.45;cursor:not-allowed}
.pc-pg-b:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pc-pg-gap{padding:0 4px;color:var(--mut);font-weight:700}
/* Missing Root Cause Details dialog: extends the shared .tbl-* shell (topbar-auth.js); 90vw, 96vw under 720px. */
div.tbl-bg.pc-miss-bg{padding:2vw;background:rgba(9,14,26,.78)!important}
.tbl-bg.pc-miss-bg .tbl-card.pc-miss-card{width:90vw!important;min-width:320px!important;max-width:none!important;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;border-radius:12px!important;font-family:'Inter',-apple-system,sans-serif}
.tbl-card.pc-miss-card:focus{outline:none}
.tbl-card.pc-miss-card .tbl-head.pc-miss-head{flex:0 0 auto;padding:20px 24px 18px 28px;border-bottom:0;box-shadow:inset 0 -3px 0 #ec7211}
.tbl-card.pc-miss-card button.pc-miss-x{flex:0 0 auto;align-self:flex-start;width:36px;height:36px;margin:0;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.3);color:#e9edf3;cursor:pointer}
.tbl-card.pc-miss-card button.pc-miss-x:hover{background:rgba(255,255,255,.14)}
.pc-miss-body{flex:1 1 auto;min-height:0;overflow:auto;padding:18px 24px 14px;background:#fff;color:#1b2026}
.pc-miss-body>*+*{margin-top:12px}
.pc-miss-tblwrap{border:1px solid #e2e7eb;border-radius:10px;overflow:auto}
.pc-miss-tbl{width:100%;min-width:640px;border-collapse:separate;border-spacing:0;font-size:.88em}
.pc-miss-tbl thead th{position:sticky;top:0;z-index:1;padding:10px 14px;background:#f3f5f8;color:#4a5562;border-bottom:1px solid #e2e7eb;font-size:.74em;font-weight:800;letter-spacing:.6px;text-transform:uppercase;text-align:left;white-space:nowrap}
.pc-miss-tbl tbody th,.pc-miss-tbl td{padding:10px 14px;border-top:1px solid #eef1f4;text-align:left;vertical-align:top;color:#2a3340;font-weight:500}
.pc-miss-tbl tbody tr:first-child>*{border-top:0}
.pc-miss-tbl tbody tr:hover>*{background:#fff7f0}
.pc-miss-tbl tbody th{white-space:nowrap}
.pc-miss-tbl a{color:#0b6aa2;font-weight:700;text-decoration:none}
.pc-miss-tbl a:hover{text-decoration:underline}
.pc-miss-tbl .pc-nw{white-space:nowrap;font-variant-numeric:tabular-nums}
.pc-miss-title{overflow-wrap:anywhere}
.pc-miss-empty{padding:36px 12px;text-align:center;color:#5c6773}
.pc-miss-foot{flex:0 0 auto;display:flex;justify-content:flex-end;padding:12px 24px 16px;border-top:1px solid #eef1f4;background:#fff}
.tbl-card.pc-miss-card button.tbl-cancel.pc-miss-close{width:auto;min-width:110px}
.pc-miss-body .pc-pg-b{font-family:inherit}
@media(max-width:719px){
  .tbl-bg.pc-miss-bg .tbl-card.pc-miss-card{width:96vw!important}
  .tbl-card.pc-miss-card .tbl-head.pc-miss-head{padding:16px 16px 14px 20px}
  .pc-miss-body{padding:12px}
}
/* Proportional inline bar next to a number (aria-hidden; the number is the content). */
.pc-barcell{display:inline-flex;align-items:center;justify-content:flex-end;gap:10px}
.pc-bar{display:inline-block;width:92px;height:7px;border-radius:99px;background:#eef1f4;overflow:hidden;flex-shrink:0}
.pc-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f5a54a,var(--acc))}
.pc-bar.blue i{background:linear-gradient(90deg,#78a6e6,var(--blue))}
.pc-bar.green i{background:linear-gradient(90deg,#6cc896,#1f9d57)}
.pc-bar.red i{background:linear-gradient(90deg,#ee8a80,var(--red))}

/* ---- Action items ---- */
.pc-actions{display:flex;flex-direction:column;gap:10px}
.pc-act{position:relative;padding:13px 16px 13px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;transition:border-color .15s,box-shadow .15s}
.pc-act::before{content:'';position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--d,#c4ccd4)}
.pc-act:hover{border-color:#cfd6dd;box-shadow:0 10px 22px -18px rgba(20,30,50,.55)}
.pc-act h3{font-size:1em;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pc-act p{margin-top:6px;color:#3a4552}
.pc-badge{font-size:.72em;font-weight:800;letter-spacing:.8px;border-radius:99px;padding:3px 10px;flex-shrink:0}
.pc-act.sev-CRITICAL{--d:#c81e1e}.pc-act.sev-CRITICAL .pc-badge{background:var(--red-bg);color:#a51616}
.pc-act.sev-HIGH{--d:var(--acc)}.pc-act.sev-HIGH .pc-badge{background:var(--amber-bg);color:var(--acc-ink)}
.pc-act.sev-MEDIUM{--d:#e0b000}.pc-act.sev-MEDIUM .pc-badge{background:#fff6cc;color:#6e5600}
.pc-act.sev-INFO{--d:var(--blue)}.pc-act.sev-INFO .pc-badge{background:var(--blue-bg);color:#1d4a8f}

/* ---- Loading skeleton ---- */
.pc-sk{display:block;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:pcShim 1.4s ease infinite}
.pc-chip .pc-sk{display:inline-block}
@keyframes pcShim{0%{background-position:100% 0}100%{background-position:0 0}}
.pc-kpi.is-sk::before{background:#e2e6ea}
.pc-sk-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-bottom:1px solid #eef1f4}
.pc-sk-row:last-child{border-bottom:none}
.pc-sk-tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pc-sk-tbl .pc-sk-row:first-child{background:#f5f6f8}
.pc-loadnote{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 16px;font-size:.86em;font-weight:700;color:var(--mut);min-height:28px;text-align:center}
.pc-loadnote-ic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--amber-bg);color:var(--amber);animation:pcPulse 1.6s ease-in-out infinite}
.pc-loadnote-msg.gw-msg-in{animation:pcMsgIn .45s cubic-bezier(.22,1,.36,1)}
.pc-load.gw-done .pc-loadnote-ic{background:var(--green-bg);color:var(--green);animation:none}
.pc-load.gw-done .pc-loadnote-msg{color:var(--green)}
@keyframes pcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes pcMsgIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}

/* ---- Error state (overlaps the hero like the KPI row) ---- */
.pc-state{position:relative;z-index:1;margin:-58px 18px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 32px -24px rgba(20,30,50,.6);
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:38px 20px;text-align:center;color:var(--mut)}
.pc-state-ic{width:58px;height:58px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--red-bg);color:var(--red);margin-bottom:4px}
.pc-state h2{font-size:1.08em;font-weight:800;color:var(--ink)}
.pc-state p{font-size:.9em;max-width:56ch;line-height:1.5}
.pc-state .pc-btn{margin-top:6px}

.pc-gate{text-align:center;padding:60px 20px;color:var(--mut)}
.pc-gate h1{color:var(--ink);font-size:1.4em;margin-bottom:10px}

/* One orchestrated entrance: KPI cards stagger in, then the sections. */
@keyframes pcUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pc-hero{animation:pcUp .45s ease both}
.pc.is-anim .pc-kpi{animation:pcUp .5s ease both}
.pc.is-anim .pc-kpi:nth-child(2){animation-delay:.06s}
.pc.is-anim .pc-kpi:nth-child(3){animation-delay:.12s}
.pc.is-anim .pc-kpi:nth-child(4){animation-delay:.18s}
.pc.is-anim>.pc-card{animation:pcUp .5s ease .2s both}
.pc.is-anim .pc-hero{animation:none}

/* Small screens */
@container (max-width:700px){
  .pc-hero{padding:22px 18px 76px 22px}
  .pc-hero h1{font-size:1.6em;letter-spacing:-.6px}
  .pc-hero-ic{display:none}
  .pc-hero-tools{align-items:stretch;width:100%}
  .pc-export{justify-content:center}
  .pc-kpis,.pc-state,.pc-inline{margin-left:10px;margin-right:10px}
  .pc-card-head,.pc-card-body{padding-left:14px;padding-right:14px}
  .pc-kpi-n{font-size:2.1em}
  .pc-bar{width:56px}
}

@media (prefers-reduced-motion:reduce){
  .pc *,.pc *::before,.pc *::after,.pc{animation:none!important;transition:none!important}
}
</style>

<body data-nav-active="pulse-check" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>

<div class="wrap pc" id="wrap" tabindex="-1">
  <div class="pc-gate"><h1>Pulse Check (24h)</h1><p>Loading…</p></div>
</div>
<!-- Polite announcements (loading / loaded / failed / copied); outside #wrap so re-renders keep it. -->
<div id="pcLive" class="pc-sr" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="icons.js?v=2"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=221"></script>
<script>
const A=window.PHDAuth;
const ic=(n,s)=>window.icon?window.icon(n,s||14):'';
const DASH='\u2014';

// ---- Formatting helpers (every dynamic string goes through esc) ----
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function num(n){ return (Number(n)||0).toLocaleString('en-US'); }
function pct1(p){ return (p==null||!isFinite(p))?DASH:(Number(p).toFixed(1)+'%'); }
function hrs1(h){ return (h==null||!isFinite(h))?DASH:Number(h).toFixed(1); }
function pad2(n){ return String(n).padStart(2,'0'); }
function hourRange(h){ return pad2(h)+':00\u2013'+pad2((h+1)%24)+':00'; }
function safeUrl(u){ u=String(u||''); return /^https?:\/\//i.test(u)?u:''; }
function idLink(id,url){ var s=safeUrl(url); return s?'<a href="'+esc(s)+'" target="_blank" rel="noopener noreferrer">'+esc(id)+'</a>':esc(id); }
function shortStatus(s){ return s==='Work In Progress'?'WIP':s; }
// Singular/plural: tix(1)='1 ticket', tix(2)='2 tickets', tix(2,'breach','breaches')='2 breaches'.
function tix(n,one,many){ one=one||'ticket'; return num(n)+' '+(Number(n)===1?one:(many||one+'s')); }
// "2026-10-25 11:00" from an ISO timestamp (UTC).
function utcStamp(iso){ return (typeof iso==='string'&&iso.length>=16)?(iso.slice(0,10)+' '+iso.slice(11,16)):DASH; }

// America/Denver date parts; labelled "MST" per the repo convention (D9).
function denParts(iso){
  var o={}; if(!iso) return o;
  try{
    new Intl.DateTimeFormat('en-US',{timeZone:'America/Denver',weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
      .formatToParts(new Date(iso)).forEach(function(p){ o[p.type]=p.value; });
  }catch(e){}
  return o;
}
// Clock time "HH:MM" in a zone (24h).
function hm(iso,tz){ try{ return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(iso)); }catch(e){ return DASH; } }
var TZ_MST='America/Denver', TZ_IST='Asia/Kolkata';
// ISO instant -> "10/24 14:05" in America/Denver (MST per the repo convention); DASH if invalid.
function mstStamp(iso){
  var o={}; try{
    new Intl.DateTimeFormat('en-US',{timeZone:TZ_MST,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
      .formatToParts(new Date(iso)).forEach(function(p){ o[p.type]=p.value; });
  }catch(e){ return DASH; }
  return (o.month&&o.day&&o.hour)?(o.month+'/'+o.day+' '+o.hour+':'+o.minute):DASH;
}
// "Sunday, October 25, 2026 — 07:04 MST · 18:34 IST" (the date is the MST date).
function fmtLong(iso){ var p=denParts(iso); return p.weekday?(p.weekday+', '+p.month+' '+p.day+', '+p.year+' \u2014 '+hm(iso,TZ_MST)+' MST \u00b7 '+hm(iso,TZ_IST)+' IST'):DASH; }
// Report date 'YYYY-MM-DD' -> "Saturday, October 24, 2026" (a calendar date; formatted at UTC noon).
function reportDayLong(ymd){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd||'')); if(!m) return DASH;
  try{ return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date(Date.UTC(+m[1],+m[2]-1,+m[3],12))); }catch(e){ return DASH; }
}
// 1 -> "1st", 2 -> "2nd", 3 -> "3rd", 4 -> "4th", 11..13 -> "11th".."13th", 21 -> "21st".
function ordinal(n){
  var v=n%100, s=(v>=11&&v<=13)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th');
  return n+s;
}
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
// 'YYYY-MM-DD' (+ addDays calendar days) -> "25th October"; DASH when the date is invalid.
function ordinalDayMonth(ymd,addDays){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd||'')); if(!m) return DASH;
  var d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]+(addDays||0)));
  return ordinal(d.getUTCDate())+' '+MONTHS[d.getUTCMonth()];
}
// ISO instant -> "11:30 AM IST 26th October" (Asia/Kolkata).
function istWhen(iso){
  var o={}; try{
    new Intl.DateTimeFormat('en-US',{timeZone:TZ_IST,hour:'numeric',minute:'2-digit',hour12:true,month:'numeric',day:'numeric'})
      .formatToParts(new Date(iso)).forEach(function(p){ o[p.type]=p.value; });
  }catch(e){ return DASH; }
  if(!o.hour||!o.month) return DASH;
  return o.hour+':'+o.minute+' '+String(o.dayPeriod||'').toUpperCase()+' IST '+ordinal(+o.day)+' '+MONTHS[+o.month-1];
}
// Milliseconds -> "1d 02h 15m 09s" (days omitted when 0), zero-padded; null once the time has run out.
function fmtCountdown(ms){
  if(!(ms>0)) return null;
  var t=Math.floor(ms/1000), d=Math.floor(t/86400), h=Math.floor(t%86400/3600), m=Math.floor(t%3600/60), s=t%60;
  var p=function(n){ return String(n).padStart(2,'0'); };
  return (d>0?d+'d ':'')+p(h)+'h '+p(m)+'m '+p(s)+'s';
}

// ---- User ----
function me(){ var u=(A.getUser&&A.getUser())||{}; var p=(A.myProfile&&A.myProfile())||u; return { username:u.username||p.username||'', name:(p&&p.displayName)||(p&&p.username)||u.username||'' }; }

// ---- Building blocks ----
// Per-section icon, tone and one-line description (the description is UI only; the Export reads .pc-card-title).
var PC_SEC={
  1:['clipboard','blue','Plain-language summary of the reporting day'],
  2:['grid','blue','Created, resolved and the open backlog by status'],
  3:['alert','amber','Issues of the tickets resolved in the window'],
  4:['search','blue','Root cause of every ticket resolved in the window'],
  5:['check-circle','green','\u201cRes:\u201d value of every ticket resolved in the window'],
  6:['users','blue','Immediate vs successful resolutions per agent'],
  7:['hash','amber','Tags carried by the tickets resolved in the window'],
  8:['clock','blue','Created vs resolved across the reporting day'],
  9:['hourglass','amber','Open ticket aging against the 240-hour SLA'],
  10:['flame','rose','Resolved tickets that took longer than 240 hours'],
  11:['bolt','rose','Follow-ups generated from the day\u2019s numbers']
};
// Open / collapsed state per section number; survives re-renders (background reloads).
var PC_OPEN={};
var CHEV='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// Collapsible section card with a chevron expander. The title span (.pc-card-title) holds exactly
// "N. Title" so the Export text stays unchanged. aside (optional, already-escaped HTML) renders as a pill.
// Sections shown on the page but left out of the Export (both the plain-text and the rich copy).
var PC_NOEXPORT={7:true,8:true,10:true,11:true};
// Sections whose header chip (aside, e.g. Section 9's 'As of ... UTC') stays on the page but not in the Export.
var PC_ASIDE_NOEXPORT={9:true};
function card(no,title,body,aside){
  var m=PC_SEC[no]||['info','blue',''], open=PC_OPEN[no]!==false, bid='pcB'+no;
  return '<section class="pc-card t-'+m[1]+(open?'':' is-shut')+(PC_NOEXPORT[no]?' pc-noexport':'')+'" aria-labelledby="pcH'+no+'"><div class="pc-card-head">'+
    '<h2 class="pc-card-h"><button type="button" class="pc-exp" aria-expanded="'+open+'" aria-controls="'+bid+'" data-pc-exp="'+no+'">'+
      '<span class="pc-chev">'+CHEV+'</span><span class="pc-card-ic" aria-hidden="true">'+ic(m[0],18)+'</span>'+
      '<span class="pc-card-tt"><span class="pc-card-title" id="pcH'+no+'"><span class="pc-card-no">'+no+'.</span> '+title+'</span>'+
      (m[2]?'<span class="pc-card-sub">'+m[2]+'</span>':'')+'</span>'+
    '</button></h2>'+(aside?'<span class="pc-head-aside'+(PC_ASIDE_NOEXPORT[no]?' pc-noexport':'')+'">'+aside+'</span>':'')+'</div>'+
    '<div class="pc-card-body" id="'+bid+'"'+(open?'':' hidden')+'>'+body+'</div></section>';
}
function pcToggle(btn){
  var no=btn.getAttribute('data-pc-exp'), open=btn.getAttribute('aria-expanded')!=='true';
  PC_OPEN[no]=open;
  btn.setAttribute('aria-expanded',String(open));
  var body=document.getElementById(btn.getAttribute('aria-controls')); if(body) body.hidden=!open;
  var c=btn.closest('.pc-card'); if(c) c.classList.toggle('is-shut',!open);
}
document.addEventListener('click',function(ev){
  var t=ev.target&&ev.target.closest?ev.target.closest('[data-pc-exp]'):null; if(t) pcToggle(t);
});
// Proportional inline bar + number for a table cell. The bar is aria-hidden and has no text, so the
// cell's text (and the Export) is just the number.
function barNum(txt,frac,tone){
  var w=Math.max(0,Math.min(1,Number(frac)||0))*100;
  return '<span class="pc-barcell"><span class="pc-bar'+(tone?' '+tone:'')+'" aria-hidden="true"><i style="width:'+w.toFixed(1)+'%"></i></span><span>'+txt+'</span></span>';
}
function maxOf(arr,f){ return arr.reduce(function(m,x){ return Math.max(m,Number(f(x))||0); },0)||1; }
// cols: [{h:'Label', n:true}] ; rows: array of arrays of already-escaped cell HTML.
// The scroll box is a focusable region (keyboard scrolling) with a sticky header row.
function table(cols,rows,foot,cap){
  var lbl=cols.map(function(c){ return String(c.h).replace(/<[^>]*>/g,''); }).join(', ');
  var h='<div class="pc-scroll" tabindex="0" role="region" aria-label="'+esc(lbl)+' table"><table class="pc-tbl">'+(cap?'<caption class="pc-muted">'+cap+'</caption>':'')+'<thead><tr>'+
    cols.map(function(c){ return '<th scope="col"'+(c.n?' class="n"':'')+'>'+c.h+'</th>'; }).join('')+'</tr></thead><tbody>';
  if(!rows.length) h+='<tr class="pc-empty"><td colspan="'+cols.length+'">None in this window</td></tr>';
  rows.forEach(function(r){
    var cls=r.cls?' class="'+r.cls+'"':''; var cells=r.cells||r;
    h+='<tr'+cls+'>'+cells.map(function(v,i){ return i===0?'<th scope="row"'+(cols[0].n?' class="n"':'')+'>'+v+'</th>':'<td'+(cols[i].n?' class="n"':'')+'>'+v+'</td>'; }).join('')+'</tr>';
  });
  h+='</tbody>'+(foot||'')+'</table></div>';
  return h;
}
function bullets(arr){ return arr.length?'<ul class="pc-bullets">'+arr.map(function(b){ return '<li>'+b+'</li>'; }).join('')+'</ul>':''; }

// ---- Section 1: Executive Summary (template per design §6; built as plain text, set via textContent) ----
function execText(D){
  var k=D.kpis, s=D.summary, al=D.agents.autosimLine, br=D.breaches.total, atRisk=D.sla.atRisk;
  var out=[];
  out.push('The PHD team processed '+tix(k.created)+' created and '+tix(k.resolved)+' resolved during the reporting day '+reportDayLong(D.reportDate)+' (MST).');
  out.push('The total open ticket backlog stands at '+tix(k.openTotal)+'.');
  if(atRisk>0||br>0) out.push('SLA health is under pressure with '+tix(atRisk)+' at risk (7\u201310 days old, approaching the 240-hour SLA limit) and '+tix(br,'historical SLA breach','historical SLA breaches')+(br>0?(br===1?' (now resolved)':' (all now resolved)'):'')+'.');
  else out.push('SLA health is stable: no tickets at risk and no breaches in this window.');
  if(s.resolutionRatePct!=null) out.push('Resolution rate: '+Number(s.resolutionRatePct).toFixed(1)+'% ('+num(k.resolved)+'/'+num(k.created)+').');
  if(s.autosimSharePct!=null) out.push('AutoSIM handled '+s.autosimSharePct+'% of all resolutions ('+num(al.n)+'/'+num(al.d)+')'+(s.autosimSharePct>0?', demonstrating effective automation.':'.'));
  if(s.peakHourMst!=null) out.push('Peak ticket creation occurred at '+hourRange(s.peakHourMst)+' MST.');
  if(k.openBreached>0) out.push(k.openBreached===1?'1 currently open ticket has breached the 240-hour SLA.':(num(k.openBreached)+' currently open tickets have breached the 240-hour SLA.'));
  else out.push('No currently open tickets have breached the 240-hour SLA.');
  return out.join(' ');
}
function secExec(D){
  var k=D.kpis;
  var warn=(k.created>0&&k.hashtagsCreated===0)?'<p class="pc-warn" role="note">\u26a0 Warning: Tagging compliance gap identified \u2014 0 hashtags applied to '+tix(k.created,'newly created ticket','newly created tickets')+'.</p>':'';
  return card(1,'Executive Summary',
    '<p id="pcExec"></p>'+warn);
}

// A value missing from the payload (e.g. an older cached report) shows the dash, never NaN/0.
function kvNum(v){ return (v==null||v===''||!isFinite(Number(v)))?DASH:num(v); }

// ---- Headline KPI cards (overlap the hero). UI only: not part of the Export (Section 2 carries the numbers). ----
function kpi(icon,label,n,sub,tone,extra){
  return '<div class="pc-kpi k-'+(tone||'base')+'"><div class="pc-kpi-l"><span class="pc-kpi-ic" aria-hidden="true">'+ic(icon,15)+'</span>'+label+'</div>'+
    '<div class="pc-kpi-n">'+n+'</div><div class="pc-kpi-sub">'+sub+'</div>'+(extra||'')+'</div>';
}
function kpiStrip(D){
  var k=D.kpis||{}, s=D.summary||{}, rate=(s.resolutionRatePct!=null&&isFinite(s.resolutionRatePct))?Number(s.resolutionRatePct):null;
  var risk=Number(k.slaAtRisk)||0, br=Number(k.openBreached)||0;
  return '<div class="pc-kpis" role="group" aria-label="Headline numbers">'+
    kpi('inbox','Created (24h)',kvNum(k.created),'Station requests <b>'+kvNum(k.stationRequests)+'</b>','base')+
    kpi('check-circle','Resolved',kvNum(k.resolved),
      (rate!=null?'<span class="pc-pill good">'+rate.toFixed(1)+'% rate</span>':'')+'Imm <b>'+kvNum(k.immediate)+'</b> \u00b7 Successful <b>'+kvNum(k.successful)+'</b>','good',

// ---- Pagination (10 per page): Section 3 ticket list and the missing-RCD dialog ----
var PC_PER=10;
var PC_PG={};    // list id -> {page, sig}
var PC_PGR={};   // list id -> function() returning the list's inner HTML for the current page
function pcPageNums(cur,total){
  if(total<=7){ var a=[]; for(var i=1;i<=total;i++) a.push(i); return a; }
  var out=[1], lo=Math.max(2,cur-1), hi=Math.min(total-1,cur+1);
  if(cur<=3){ lo=2; hi=4; } else if(cur>=total-2){ lo=total-3; hi=total-1; }
  if(lo>2) out.push(0);
  for(var j=lo;j<=hi;j++) out.push(j);
  if(hi<total-1) out.push(0);
  out.push(total);
  return out;
}
// Current page for list `id`; resets to 1 when `sig` (the selection) changes or the page is out of range.
function pcPageOf(id,sig,n){
  var st=PC_PG[id], pages=Math.max(1,Math.ceil(n/PC_PER));
  if(!st||st.sig!==sig){ st=PC_PG[id]={page:1,sig:sig}; }
  if(st.page>pages) st.page=pages;
  if(st.page<1) st.page=1;
  return st.page;
}
function pcPager(id,page,n,label){
  var pages=Math.max(1,Math.ceil(n/PC_PER)), from=n?(page-1)*PC_PER+1:0, to=Math.min(n,page*PC_PER);
  var b=function(pg,txt,aria,dis,cur){
    return '<button type="button" class="pc-pg-b'+(cur?' is-cur':'')+'" data-pg="'+pg+'" aria-label="'+esc(aria)+'"'+(cur?' aria-current="page"':'')+(dis?' disabled':'')+'>'+txt+'</button>';
  };
  var h='<nav class="pc-pager" aria-label="'+esc(label)+' pages" data-pg-for="'+esc(id)+'">'+
    '<p class="pc-pager-info">Showing '+num(from)+'\u2013'+num(to)+' of '+num(n)+'</p>';
  if(pages>1){
    h+='<div class="pc-pager-btns">'+b('prev','Prev','Previous page',page<=1,false);
    pcPageNums(page,pages).forEach(function(p){ h+=p?b(p,num(p),'Page '+p,false,p===page):'<span class="pc-pg-gap" aria-hidden="true">\u2026</span>'; });
    h+=b('next','Next','Next page',page>=pages,false)+'</div>';
  }
  return h+'</nav>';
}
function pcRenderList(id){ var el=document.getElementById(id), f=PC_PGR[id]; if(el&&f) el.innerHTML=f(); }
document.addEventListener('click',function(ev){
  var t=ev.target&&ev.target.closest?ev.target.closest('.pc-pager [data-pg]'):null; if(!t||t.disabled) return;
  var nav=t.closest('.pc-pager'), id=nav.getAttribute('data-pg-for'), st=PC_PG[id]; if(!st) return;
  var v=t.getAttribute('data-pg');
  st.page=v==='prev'?st.page-1:(v==='next'?st.page+1:(+v||1));
  pcRenderList(id);
  // Keep keyboard focus in the pager: the same control, or the current page when Prev/Next became disabled.
  var box=document.getElementById(id), nb=box&&box.querySelector('.pc-pager [data-pg="'+v+'"]');
  if(!nb||nb.disabled) nb=box&&box.querySelector('.pc-pager [aria-current="page"]');

function pcMissKey(e){

  if(!f.length){ e.preventDefault(); return; }

// Export only: the Resolution Distribution with the TOP 5 normal rows (count desc) in the same 3-column plain

function secResolutionsExport(D){

// Section 5, below the distribution: EVERY ticket resolved in the window with its resolution row, 10 per page,
// in table row order (the 'First Pet Incident (Out of Scope)' tickets last), then resolved time, ID.
// Hidden for viewers without SLA access (the distribution table above stays).
function resolvedResolutionTickets(D){
  var src=Array.isArray(D.resolvedList)?D.resolvedList:null;
  if(D.resolvedDetailHidden) return '<p class="pc-muted">Ticket details require SLA access.</p>';
  if(!src||!src.length) return '';
  var rk=function(t){ var k=t.resolutionKind||'res'; return k==='res'?'res:'+String(t.resolutionRow||t.resolution||'').toLowerCase():k; };
  var ord={}; resRowsOf(D).forEach(function(c,i){ ord[c.kind==='res'?'res:'+String(c.resolution).toLowerCase():c.kind]=i; });
  var at=function(t){ var v=ord[rk(t)]; return v===undefined?1e9:v; };
  var list=src.slice().sort(function(a,b){ return at(a)-at(b)||String(a.resolvedAt).localeCompare(String(b.resolvedAt))||String(a.shortId).localeCompare(String(b.shortId)); });
  var id='pcResTix', sig=String(D.reportDate||'')+'|'+list.length;
  PC_PGR[id]=function(){
    var page=pcPageOf(id,sig,list.length), s=(page-1)*PC_PER;
    return table([{h:'#',n:true},{h:'Ticket ID'},{h:'Resolution'},{h:'Closure Code'},{h:'Resolved (MST)'}],
      list.slice(s,s+PC_PER).map(function(t,i){ return [num(s+i+1),idLink(t.shortId,t.url),'<span class="pc-wrap">'+esc(t.resolutionRow||t.resolution||DASH)+'</span>',esc(t.closureCode||DASH),esc(mstStamp(t.resolvedAt))]; }))+
      pcPager(id,page,list.length,'Resolution resolved tickets');
  };
  return '<p class="pc-line">Resolved Tickets ('+num(list.length)+')</p><div class="pc-pgbox" id="'+id+'">'+PC_PGR[id]()+'</div>';
}

// ---- Section 6 ----
function secAgents(D){
  var a=D.agents, al=a.autosimLine, b=[];
  var amx=maxOf(a.rows,function(r){ return r.total; });
  var rows=a.rows.map(function(r){ return [esc(r.agent),num(r.immediate),num(r.successful),barNum('<b>'+num(r.total)+'</b>',(Number(r.total)||0)/amx,'blue')]; });
  if(al.d>0) b.push('AutoSIM handled '+esc(al.pct)+'% of all resolutions ('+num(al.n)+'/'+num(al.d)+')'+(al.allImmediate&&al.n>0?' \u2014 all Immediately Resolved':'')+'.');
  if(a.topHuman){ var t=a.topHuman; b.push(esc(t.agent)+' was the top human resolver with '+tix(t.total)+' ('+num(t.immediate)+' Imm + '+num(t.successful)+' Successful).'); }
  var nh=a.nextHumans||[];
  if(nh.length){
    var tot=nh.map(function(x){ return x.total; }), lo=Math.min.apply(null,tot), hi=Math.max.apply(null,tot);
    var names=nh.map(function(x){ return esc(x.agent); });
    var line;
    if(nh.length===1) line=names[0]+' resolved '+tix(lo);
    else if(lo===hi) line=names.join(' and ')+' each resolved '+tix(lo);
    else line=names.join(' and ')+' resolved '+num(lo)+'\u2013'+num(hi)+' tickets';
    if(nh.every(function(x){ return x.successful===x.total; })) line+=', all Successful';
    else if(nh.every(function(x){ return x.immediate===x.total; })) line+=', all Immediately Resolved';
    b.push(line+'.');
  }
  return card(6,'Agent Performance \u2014 Resolved Tickets (Total: '+num(a.total)+')',
    // Full-height table (no inner scroll bar).
    table([{h:'Agent'},{h:'Imm. Resolved',n:true},{h:'Successful',n:true},{h:'Total',n:true}],rows).replace('class="pc-scroll"','class="pc-scroll pc-full"')+

    bullets(b).replace('<ul class="pc-bullets">','<ul class="pc-bullets pc-noexport">'));
}

// ---- Section 7 ----
// Plain-language summary of every hashtag on the resolved tickets. A ticket can carry several tags,
// so the per-tag counts can add up to more than the resolved total.
function hashtagSummary(D){
  var n=Number(D.kpis&&D.kpis.resolved)||0, rows=(D.hashtags&&D.hashtags.rows)||[];
  if(n<=0) return '';
  var u=D.hashtags.resolvedUntagged, hasU=(typeof u==='number');
  var tagged=hasU?Math.max(0,n-u):null;
  // Summary strip: resolved / tagged / no hashtag, then one chip per hashtag (count desc, as the rows come).
  var stat=function(lbl,v,tone,sub){
    return '<div class="pc-hs-stat t-'+tone+'"><span class="pc-hs-l">'+lbl+'</span><span class="pc-hs-n">'+v+'</span>'+(sub?'<span class="pc-hs-s">'+sub+'</span>':'')+'</div>';
  };
  var pctOfN=function(x){ return n>0?pct1(x/n*100):''; };
  var h='<div class="pc-hs" role="group" aria-label="Hashtag summary">'+
    '<div class="pc-hs-stats">'+
      stat('Tickets resolved',num(n),'base','')+
      (hasU?stat('With a hashtag',num(tagged),'blue',pctOfN(tagged)+' of resolved'):'')+
      (hasU?stat('No hashtag',num(u),u>0?'amber':'green',pctOfN(u)+' of resolved'):'')+
    '</div>';
  if(rows.length){
    h+='<p class="pc-hs-cap">Hashtags on the resolved tickets <span class="pc-muted">\u00b7 a ticket can carry more than one, so counts can add up to more than the total</span></p>'+
      '<ul class="pc-hs-chips">'+rows.map(function(r,i){
        var c=Number(r.count)||0;
        return '<li class="pc-hs-chip'+(i===0?' is-top':'')+'" title="'+esc(r.tag)+': '+num(c)+(c===1?' ticket':' tickets')+' ('+pctOfN(c)+' of resolved)">'+
          '<span class="pc-hs-tag">'+esc(r.tag)+'</span><span class="pc-hs-c">'+num(c)+'</span></li>';
      }).join('')+'</ul>';
  } else h+='<p class="pc-hs-cap">None of the resolved tickets have a hashtag.</p>';

}
function secHashtags(D){

// ---- Section 8: the day's hours split into three 8-hour blocks of the MST day ----
// One row per real hour of the MST day (24, or 23/25 on DST days). Rows are assigned to a block by their
// Denver hour (0-7 / 8-15 / 16-23), so a DST day just makes block a 9 or 7 rows long.
var HOURLY_BLOCKS=[
  {key:'a',name:'IST hours',from:0,to:8},
  {key:'b',name:'IST + MST hours',from:8,to:16},
  {key:'c',name:'MST hours',from:16,to:24}
];
// "HH:MM" in a zone; a midnight END time reads "24:00" (end of the day), not "00:00".
function hmEnd(iso,tz){ var s=hm(iso,tz); return s==='00:00'?'24:00':s; }
// Block rows' first start .. last end (start+1h) in a zone, e.g. "11:30\u201319:30".
function blockSpan(rows,tz){
  if(!rows.length) return '';
  var a=rows[0].start, z=rows[rows.length-1].start, t=Date.parse(z);
  if(!isFinite(Date.parse(a))||!isFinite(t)) return '';
  return hm(a,tz)+'\u2013'+hmEnd(new Date(t+3600000).toISOString(),tz);
}
// Splits the hourly rows into the three blocks with their sums and MST/IST ranges.
function hourlyBlocks(rows){
  return HOURLY_BLOCKS.map(function(b){
    var rs=rows.filter(function(r){ return r.hour>=b.from&&r.hour<b.to; }), c=0, s=0;
    rs.forEach(function(r){ c+=Number(r.created)||0; s+=Number(r.resolved)||0; });
    return {key:b.key,name:b.name,label:b.key+') '+b.name,created:c,resolved:s,
      mst:blockSpan(rs,TZ_MST)||(pad2(b.from)+':00\u2013'+pad2(b.to)+':00'), ist:blockSpan(rs,TZ_IST)||DASH};
  });
}
function secHourly(D){
  var H=D&&D.hourly;
  var note='<p class="pc-muted">Report day split into three 8-hour blocks of the MST day; times shown in MST and IST.</p>';
  if(!H||!Array.isArray(H.rows)) return card(8,'Ticket Flow by 8-Hour Block \u2014 Created vs. Resolved',note+'<p class="pc-muted">No hourly data in this window.</p>');
  var blocks=hourlyBlocks(H.rows), top=null;
  blocks.forEach(function(b){ if(b.created>0&&(!top||b.created>top.created)) top=b; });   // ties -> earliest block
  var line=top?('Busiest block: <b>'+esc(top.label)+'</b> \u2014 '+tix(top.created)+' created.'):'No tickets created in this window.';
  var bmx=Math.max(maxOf(blocks,function(b){ return b.created; }),maxOf(blocks,function(b){ return b.resolved; }));
  var rows=blocks.map(function(b){ return [esc(b.label),esc(b.mst),esc(b.ist),barNum(num(b.created),b.created/bmx),barNum(num(b.resolved),b.resolved/bmx,'green')]; });
  var foot='<tfoot><tr><th scope="row" colspan="3">TOTAL</th><td class="n">'+num(H.totalCreated)+'</td><td class="n">'+num(H.totalResolved)+'</td></tr></tfoot>';
  return card(8,'Ticket Flow by 8-Hour Block \u2014 Created vs. Resolved',
    note+'<p class="pc-line pc-say">'+line+'</p>'+
    table([{h:'Block'},{h:'MST'},{h:'IST'},{h:'Created',n:true},{h:'Resolved',n:true}],rows,foot));
}

  // At-risk tickets: ALL of them (oldest first, as the server sends them), 10 per page, no Title column.
