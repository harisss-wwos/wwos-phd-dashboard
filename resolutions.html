<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resolutions · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: keep the page hidden until topbar-auth.js has injected its styles AND built the
     nav-rail + profile column, so the chrome is present on the FIRST paint (no flash-in). The class
     is cleared by topbar-auth after the chrome builds; a failsafe timer clears it if the script
     never runs (offline) so the page can never stay hidden. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<!-- Keep the page section hidden until the shared chrome (title bar + menu column) has wrapped it, so the
     loaders never show on a bare page while topbar-auth.js is still downloading. Safety net: shown
     anyway after 8s (html.tb-wrap-timeout) or without JS. -->
<style>#wrap{visibility:hidden}#tbHomeChrome #wrap,html.tb-wrap-timeout #wrap{visibility:visible}</style>
<script>setTimeout(function(){document.documentElement.classList.add('tb-wrap-timeout');},8000);</script>
<noscript><style>#wrap{visibility:visible!important}</style></noscript>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --o:#ff6100; --o-l:#fe9046; --page:#f4f3ef; --card:#ffffff; --ink:#151d28; --ink2:#161d2d;
  --mut:#5c6773; --mut2:#818284; --line:#e2e6ea; --blue:#2b66c1; --blue-bg:#e6f0fc; --blue-ic:#c4def6;
  --green:#1f9d57; --green-bg:#eafaf0; --red:#dc2626; --red-bg:#fdeaea; --amber:#b5680c; --amber-bg:#fff3e0;
  --violet:#7c3aed; --violet-bg:#f1ecfe;
  /* Chart series (Created matches the SLA Breaches chart; Resolved = green; SLA % = dotted purple). */
  --s1:#44b9d6; --s1-ink:#1f8fb0; --s2:#1f9d57; --s2-ink:#17804a; --s3:#7c3aed; --s3-ink:#6d28d9;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--page);color:var(--ink);min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:var(--ink);line-height:1}
.wrap{width:auto!important;max-width:none!important;margin:0 15px!important;padding:0 0 28px!important}
#wrap.wrap{padding-top:0!important;padding-bottom:20px!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---- Title bar (same flat white 60px banner as the SLA Breaches page) ---- */
.rs-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;height:60px;padding:0 22px;margin:0 0 10px;
  background:#fff;border:1px solid var(--line);border-radius:5px;box-shadow:0 1px 3px rgba(20,30,50,.06)}
.rs-banner h1{display:inline-flex;align-items:center;gap:11px;font-size:1.15em;font-weight:800;letter-spacing:-.3px;color:#1b2026}
.rs-banner h1 .rs-hic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--violet);color:#fff}
.rs-ytd{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:.9em;letter-spacing:.3px;color:#ec7211;background:#fff4ea;border:1px solid #f3c99e;border-radius:999px;padding:6px 14px;white-space:nowrap}

/* ---- Section cards ---- */
/* Collapsible cards (same banner as the Recent Activity / Performance Overview accordions):
   56px bar, EXPANDED = #1878eb, COLLAPSED = #38bdf8, white icon/title/caret; body animates its height. */
.rs-card{background:var(--card);border:1px solid var(--line);border-radius:5px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.06);
  display:grid;grid-template-rows:auto 0fr;transition:grid-template-rows .3s ease}
.rs-card.open{grid-template-rows:auto 1fr}
.rs-card-h{margin:0;font-size:1em}
.rs-card-head{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 20px;background:#38bdf8;color:#fff;
  border:none;font:inherit;text-align:left;cursor:pointer;transition:background .15s}
.rs-card.open .rs-card-head{background:#1878eb}
.rs-card-head:focus-visible{outline:3px solid #ffb27a;outline-offset:-3px}
.rs-card-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.22);color:#fff}
.rs-card-title{font-size:1.02em;font-weight:800;margin:0}
.rs-caret{margin-left:auto;display:inline-flex;flex-shrink:0;transition:transform .3s ease}
.rs-card.open .rs-caret{transform:rotate(180deg)}
.rs-caret svg{width:18px;height:18px}
/* Collapsed content is hidden from keyboard/AT too (visibility flips after the close animation). */
.rs-card-region{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s linear .3s}
.rs-card.open .rs-card-region{visibility:visible;transition:visibility 0s}
@media (prefers-reduced-motion:reduce){.rs-card,.rs-caret,.rs-card-region{transition:none!important}}
.rs-card-body{padding:16px 20px}

/* ---- Compact phased loader (same orb/messages as the SLA page, sized to sit inside a card) ---- */
.gw-loader{min-height:260px;display:flex;align-items:center;justify-content:center;padding:18px}
.gw-loader-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:620px}
.gw-orb{position:relative;width:78px;height:78px;display:flex;align-items:center;justify-content:center}
.gw-orb::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(#2b66c1,#c4def6,#fe9046,#ff6100,#2b66c1);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  animation:gwSpin 1.1s linear infinite}
.gw-orb-ic{position:relative;width:50px;height:50px;border-radius:50%;background:#e6f0fc;color:#2b66c1;
  display:flex;align-items:center;justify-content:center;animation:gwPulse 1.6s ease-in-out infinite;box-shadow:0 6px 18px -8px rgba(43,102,193,.5)}
.gw-orb-ic svg{width:24px;height:24px}
@keyframes gwSpin{100%{transform:rotate(360deg)}}
@keyframes gwPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.gw-loader-msg{font-size:1.05em;font-weight:800;color:#151d28;line-height:1.4;min-height:1.5em}
.gw-loader-msg.gw-msg-in{animation:gwMsgIn .5s cubic-bezier(.22,1,.36,1)}
@keyframes gwMsgIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.gw-dots{display:flex;gap:7px}
.gw-dots span{width:8px;height:8px;border-radius:50%;background:#ff6100;animation:gwDot 1.2s ease-in-out infinite}
.gw-dots span:nth-child(2){background:#fe9046;animation-delay:.18s}
.gw-dots span:nth-child(3){background:#2b66c1;animation-delay:.36s}
@keyframes gwDot{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
.gw-loader-sub{font-size:.7em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#2b66c1;background:#e6f0fc;border:1px solid #c4def6;border-radius:999px;padding:4px 14px}
.gw-loader.gw-done .gw-orb::before{animation:none;background:#1f9d57}
.gw-loader.gw-done .gw-orb-ic{background:#e7f7ee;color:#1f9d57;animation:gwPop .4s ease}
.gw-loader.gw-done .gw-loader-msg{color:#1f9d57}
.gw-loader.gw-done .gw-dots{visibility:hidden}
@keyframes gwPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.gw-orb::before,.gw-orb-ic,.gw-dots span,.gw-loader-msg.gw-msg-in{animation:none!important}}

/* Error / empty states. */
.rs-msg{padding:34px 12px;text-align:center;color:var(--mut);font-size:.92em}
.rs-msg.err{color:#b02a2a}
.rs-retry{margin-top:12px;font:inherit;font-size:.86em;font-weight:800;color:#f4f3ef;background:#161d2d;border:none;border-radius:5px;padding:8px 16px;cursor:pointer}
.rs-retry:hover{background:#0f1420}
.rs-retry:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- Section 1: monthly chart (SVG, same style as the SLA Breaches monthly chart) ---- */
.rs-chart-top{display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.rs-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:.82em;font-weight:700;color:var(--mut)}
.rs-lg{display:inline-flex;align-items:center;gap:6px}
.rs-lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.rs-lg.s1 i{background:var(--s1)}.rs-lg.s2 i{background:var(--s2)}
.rs-lg.s3 i{width:18px;background:repeating-linear-gradient(90deg,var(--s3) 0 4px,transparent 4px 7px)}
.rs-chart-wrap{position:relative;width:100%;overflow:visible}
.rs-chart-svg{width:100%;height:auto;max-height:320px;display:block;overflow:visible}
.rs-chart-svg .grid{stroke:#eef1f4;stroke-width:1}
.rs-chart-svg .axis{stroke:#d4dce4;stroke-width:1}
.rs-chart-svg .axlbl{fill:#8793a0;font-size:11px;font-weight:600}
.rs-chart-svg .axlbl.cur{fill:#1b2026;font-weight:800}
.rs-chart-svg .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.rs-chart-svg .ln.s1{stroke:var(--s1)}.rs-chart-svg .ln.s2{stroke:var(--s2)}.rs-chart-svg .ln.s3{stroke:var(--s3);stroke-dasharray:4 4;stroke-linecap:butt}
.rs-chart-svg .axlbl.pct{fill:var(--s3-ink)}
.rs-chart-svg .pt{stroke:#fff;stroke-width:2}
.rs-chart-svg .pt.s1{fill:var(--s1)}.rs-chart-svg .pt.s2{fill:var(--s2)}.rs-chart-svg .pt.s3{fill:var(--s3)}
.rs-chart-svg .ptlbl{font-size:11px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.rs-chart-svg .ptlbl.s1{fill:var(--s1-ink)}.rs-chart-svg .ptlbl.s2{fill:var(--s2-ink)}.rs-chart-svg .ptlbl.s3{fill:var(--s3-ink)}
.rs-chart-svg .ptlbl.last{font-size:12.5px}
.rs-chart-svg .hit{fill:transparent;cursor:default}
.rs-chart-svg .vline{stroke:rgba(20,40,70,.22);stroke-width:1;stroke-dasharray:3 3;visibility:hidden}
.rs-tip{position:absolute;top:8px;pointer-events:none;z-index:5;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px 12px;
  box-shadow:0 14px 34px -16px rgba(20,40,70,.35);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-size:.82em}
.rs-tip.show{opacity:1;transform:none}
.rs-tip .tt-m{font-weight:800;color:#1b2026;margin-bottom:6px}
.rs-tip .tt-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:2px 0;color:var(--mut)}
.rs-tip .tt-row .k{display:inline-flex;align-items:center;gap:6px}
.rs-tip .tt-row .k i{width:9px;height:9px;border-radius:50%;display:inline-block}
.rs-tip .tt-row .v{font-weight:800;color:#1b2026}
/* Stats row under the chart. */
.rs-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.rs-stat{min-width:0;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;background:#fff;border:1px solid var(--line)}
.rs-stat-ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;flex-shrink:0;background:#eaf4fb;color:#1577a0}
.rs-stat-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.rs-stat-n{font-size:1.15em;font-weight:800;line-height:1.05;color:#1b2026;letter-spacing:-.3px;white-space:nowrap}
.rs-stat-l{font-size:.7em;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:#8795a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-stat.res .rs-stat-ic{background:var(--green-bg);color:var(--green)}
.rs-stat.sla .rs-stat-ic{background:var(--red-bg);color:var(--red)}
.rs-stat.sla .rs-stat-n{color:var(--red)}
.rs-stat.pct .rs-stat-ic{background:var(--violet-bg);color:var(--violet)}
.rs-stat.pct .rs-stat-n{color:var(--violet)}
@media(max-width:820px){.rs-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---- Section 2: period selector (same pill track as the Team Analytics period chips) ---- */
.rs-toolbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid #eef1f4;background:#fafbfc}
.perf-chips{display:inline-flex;flex:0 0 auto;background:#f0efe9;border:1px solid #e7e4dc;border-radius:999px;padding:3px;gap:2px}
.perf-chip{font-family:inherit;font-size:.76em;font-weight:700;letter-spacing:.1px;color:var(--mut2);background:transparent;border:none;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.perf-chip:hover{color:var(--ink)}
.perf-chip.on{background:linear-gradient(120deg,var(--o-l),var(--o));color:#fff;box-shadow:0 2px 8px -2px rgba(255,97,0,.6)}
.perf-chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.rs-step{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid #d4dade;border-radius:999px;padding:3px}
.rs-step-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;font:inherit}
.rs-step-btn:hover:not(:disabled){background:#fff4ea;color:#ec7211}
.rs-step-btn:disabled{opacity:.35;cursor:not-allowed}
.rs-step-btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.rs-step-btn svg{width:15px;height:15px}
.rs-step-lbl{min-width:170px;text-align:center;font-size:.82em;font-weight:800;color:var(--ink);padding:0 4px;white-space:nowrap}
.rs-period{font-size:.82em;font-weight:700;color:var(--mut)}

/* Resolution Types table (same table as Performance Summary's Resolution Distribution + a bar). */
.ps-res-sum{font-size:.92em;color:#2a3340;margin-bottom:12px}
.ps-res-sum b{color:var(--ink);font-weight:800}
.ps-res-sum .rs-sum-per{color:var(--mut);font-weight:600}
.ps-res-wrap{border:1px solid var(--line);border-radius:9px;overflow:auto}
.ps-res-tbl{width:100%;border-collapse:collapse;font-size:.9em}
.ps-res-tbl th{text-align:left;font-size:.78em;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--mut2);background:#fafbfc;padding:10px 14px;border-bottom:1px solid var(--line)}
.ps-res-tbl td{padding:9px 14px;border-bottom:1px solid var(--line);color:#2a3340}
.ps-res-tbl tbody tr:last-child td,.ps-res-tbl tbody tr:last-child th{border-bottom:none}
.ps-res-tbl tbody th{font-size:1em;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);background:transparent;padding:9px 14px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.ps-res-tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ps-res-tbl .rs-pct{width:42%;min-width:200px}
.rs-pct-wrap{display:flex;align-items:center;gap:10px}
.rs-bar{flex:1 1 auto;height:9px;border-radius:999px;background:#eef1f4;overflow:hidden}
.rs-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4f8cf0,#2b66c1)}
.rs-pct-n{flex:0 0 52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:#2a3340}
.ps-res-empty{color:#8793a0;font-size:.88em;padding:6px 2px}
.ps-res-cnt{font:inherit;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue);background:none;border:none;border-radius:4px;padding:2px 6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ps-res-cnt:hover{background:var(--blue-bg)}
.ps-res-cnt:focus-visible,.psm button:focus-visible,.psm a:focus-visible,.psm-tblwrap:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Resolution tickets pop-up (shared resolution-tickets-modal.js; same CSS as performance-summary.html). */
.ps-export{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:inherit;font-size:.86em;font-weight:800;
  color:#f4f3ef;background:#161d2d;border:none;border-radius:5px;padding:10px 16px;transition:background .15s,transform .12s}
.ps-export:hover{background:#0f1420}
.ps-export svg{flex-shrink:0}
.psm-bg{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,30,45,.55)}
.psm-bg.open{display:flex}
.psm{background:#fff;border-radius:10px;width:min(1040px,96vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 28px 70px -24px rgba(20,30,45,.55)}
.psm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.psm-hd-t{min-width:0;flex:1 1 260px}
.psm-title{font-size:1.05em;font-weight:800;color:var(--ink);overflow-wrap:anywhere}
.psm-sub{font-size:.8em;color:var(--mut);margin-top:3px}
.psm-hd-a{display:flex;align-items:center;gap:8px;flex-shrink:0}
.psm-extract{padding:8px 14px}
.psm-extract:disabled{opacity:.45;cursor:not-allowed}
.psm-x{background:transparent;border:none;color:#8793a0;font-size:1.6em;line-height:1;cursor:pointer;padding:0 6px;border-radius:5px}
.psm-x:hover{color:var(--ink);background:#f1f3f6}
.psm-body{padding:14px 20px;overflow:auto;min-height:0;flex:1 1 auto}
.psm-msg{padding:28px 12px;text-align:center;color:var(--mut);font-size:.92em}
.psm-msg.err{color:#b02a2a}
.psm-retry{margin-top:12px;font:inherit;font-size:.86em;font-weight:800;color:#f4f3ef;background:#161d2d;border:none;border-radius:5px;padding:8px 16px;cursor:pointer}
.psm-retry:hover{background:#0f1420}
.psm-tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
.psm-tbl{width:100%;border-collapse:collapse;font-size:.85em}
.psm-tbl th{position:sticky;top:0;background:#fafbfc;color:var(--mut2);font-size:.78em;font-weight:800;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.psm-tbl td{padding:9px 12px;border-bottom:1px solid #eef1f4;color:var(--ink);vertical-align:top}
.psm-tbl tbody tr:last-child td{border-bottom:none}
.psm-tbl .c-cty,.psm-tbl .c-id,.psm-tbl .c-dt{white-space:nowrap}
.psm-tbl .c-title{min-width:240px;white-space:normal;overflow-wrap:anywhere}
.psm-tbl a{color:var(--blue);font-weight:700;text-decoration:none}
.psm-tbl a:hover{text-decoration:underline}
.psm-cc{display:inline-block;padding:1px 8px;border-radius:5px;font-size:.9em;font-weight:800;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-ic)}
.psm-foot{display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:#fafbfc}
.psm-foot.on{display:flex}
.psm-showing{font-size:.82em;font-weight:600;color:var(--mut)}
.psm-pager{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.psm-pg{font:inherit;font-size:.82em;font-weight:700;min-width:34px;height:34px;padding:0 10px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:5px;cursor:pointer}
.psm-pg:hover:not(:disabled):not([aria-current]){background:var(--blue-bg);border-color:var(--blue-ic)}
.psm-pg[aria-current]{background:#161d2d;border-color:#161d2d;color:#f4f3ef;cursor:default}
.psm-pg:disabled{opacity:.45;cursor:not-allowed}
.psm-gap{min-width:24px;text-align:center;color:var(--mut2);font-weight:700}
.rs-gate{text-align:center;padding:60px 20px;color:var(--mut)}
</style>
</head>
<body data-nav-active="resolutions" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>

<div class="wrap" id="wrap">
  <div class="rs-gate"><p>Loading…</p></div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=209"></script>
<script src="resolution-tickets-modal.js?v=1"></script>
<script>
const A=window.PHDAuth;
function ic(n,s){ return window.icon?window.icon(n,s||14):''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
function num(n){ return (Number(n)||0).toLocaleString('en-US'); }
var RS_YEAR=2026;
var RS_MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
var RS_MON3=RS_MON.map(function(m){ return m.slice(0,3); });
var PURE=(window.PHDResTickets&&window.PHDResTickets.pure)||{};
var CHEV_L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>';
var CHEV_R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';

// ---- Calendar days (UTC, the project convention) ----
// A UTC calendar day is held as a LOCAL-midnight Date naming that Y/M/D, so the shared label / ymd
// helpers (which read getFullYear/getMonth/getDate) print the UTC day and send it as YYYY-MM-DD.
function rsCal(y,m,d){ return new Date(y,m,d); }
function rsTodayUtc(){ var n=new Date(); return rsCal(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()); }
function rsAddDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function rsYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rsSunday(d){ return rsAddDays(d,-d.getDay()); }   // Sun–Sat weeks (performance-summary)
// Latest selectable day: today (UTC), capped to 31 Dec of the page year.
function rsMaxDay(){ var t=rsTodayUtc(), last=rsCal(RS_YEAR,11,31); return t>last?last:t; }
function rsMinWeek(){ return rsSunday(rsCal(RS_YEAR,0,1)); }   // week containing 1 Jan
function rsMaxWeek(){ return rsSunday(rsMaxDay()); }
function rsMaxMonth(){ var d=rsMaxDay(); return d.getFullYear()<RS_YEAR?0:d.getMonth(); }

// =============== Phased loader (same orb + message phases as the SLA Breaches page) ===============
function ldHtml(pfx,sub){
  return '<div id="'+pfx+'Loader" class="gw-loader" role="status" aria-live="polite">'+
    '<div class="gw-loader-in">'+
      '<div class="gw-orb" aria-hidden="true"><span class="gw-orb-ic" id="'+pfx+'LoaderIc">'+ic('clock',24)+'</span></div>'+
      '<div class="gw-loader-msg gw-msg-in" id="'+pfx+'LoaderMsg">Getting things ready\u2026</div>'+
      '<div class="gw-dots" aria-hidden="true"><span></span><span></span><span></span></div>'+
      '<div class="gw-loader-sub">'+esc(sub||'Loading')+'</div>'+
    '</div>'+
  '</div>';
}
function gwFirstName(){ try{ var u=A.getUser&&A.getUser(); var n=(u&&(u.username||u.displayName||u.name))||''; return String(n).split(/[@\s]/)[0]||'there'; }catch(e){ return 'there'; } }
function gwShuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function rsPhase1(what){
  var me=gwFirstName();
  return gwShuffle([
    ['clock',       'Pulling the '+what+' for you, '+me+' \u2728'],
    ['inbox',       'Counting tickets created each month\u2026'],
    ['check-circle','Tallying tickets resolved\u2026'],
    ['target',      'Checking the 240-hour SLA rule\u2026'],
    ['calendar',    'Walking month by month through 2026\u2026'],
    ['bar-chart',   'Grouping tickets by resolution type\u2026'],
    ['check-circle','Reading the Res: value from root cause details\u2026'],
    ['inbox',       'Reconciling created vs resolved\u2026'],
    ['target',      'Re-checking the SLA window\u2026'],
    ['bar-chart',   'Sorting resolutions by count\u2026'],
    ['calendar',    'Lining up the Sun\u2013Sat weeks\u2026'],
    ['clock',       'Warming up the numbers, '+me+'\u2026'],
    ['check-circle','Almost there \u2014 building the '+what+'\u2026'],
  ]);
}
function rsPhase2(what){
  var me=gwFirstName();
  return gwShuffle([
    ['clock',       'Still working on it \u2014 thanks for your patience, '+me+'\u2026'],
    ['inbox',       'The server is taking a little longer than usual\u2026'],
    ['bar-chart',   'Re-checking the '+what+' to be sure\u2026'],
    ['target',      'Hang tight \u2014 re-verifying the SLA figures\u2026'],
    ['check-circle','Polishing the last few numbers\u2026'],
    ['clock',       'Appreciate the wait \u2014 almost done\u2026'],
  ]);
}
var _ldTimers={};
function _ldSetMsg(pfx,t){
  var e=document.getElementById(pfx+'LoaderMsg'), i=document.getElementById(pfx+'LoaderIc');
  if(i) i.innerHTML=ic(t[0]||'clock',24);
  if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent=t[1]; e.classList.add('gw-msg-in'); }
}
function _ldStop(pfx){ if(_ldTimers[pfx]){ clearInterval(_ldTimers[pfx]); clearTimeout(_ldTimers[pfx]); _ldTimers[pfx]=null; } }
// Phase 1 (2s per line) -> apology -> Phase 2 (3s per line, loops). Never blank.
function _ldStart(pfx,what){
  _ldStop(pfx);
  var p1=rsPhase1(what), i=0; _ldSetMsg(pfx,p1[0]);
  _ldTimers[pfx]=setInterval(function(){
    i++;
    if(i<p1.length){ _ldSetMsg(pfx,p1[i]); return; }
    _ldStop(pfx);
    _ldSetMsg(pfx,['alert','Sorry for the delay \u2014 still fetching your data\u2026']);
    _ldTimers[pfx]=setTimeout(function(){
      var p2=rsPhase2(what), j=0; _ldSetMsg(pfx,p2[0]);
      _ldTimers[pfx]=setInterval(function(){ j=(j+1)%p2.length; _ldSetMsg(pfx,p2[j]); },3000);
    },3000);
  },2000);
}
function _ldSuccess(pfx){
  _ldStop(pfx);
  var l=document.getElementById(pfx+'Loader'); if(l) l.classList.add('gw-done');
  var i=document.getElementById(pfx+'LoaderIc'); if(i) i.innerHTML=ic('check-circle',24);
  var e=document.getElementById(pfx+'LoaderMsg'); if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent='Data fetched successfully'; e.classList.add('gw-msg-in'); }
}
var _delay=function(ms){ return new Promise(function(res){ setTimeout(res,ms); }); };
function rsErrHtml(msg,retryId){
  return '<div class="rs-msg err" role="alert">'+esc(msg)+(retryId?'<br><button type="button" class="rs-retry" id="'+retryId+'">Retry</button>':'')+'</div>';
}

// =============== SECTION 1: Monthly Created vs Resolved vs SLA (2026) ===============
var RS_MONTHLY=null, RS_M_STATE='idle';
var RS_SERIES=[
  { k:'created',    cls:'s1', name:'Created',              color:'#44b9d6' },
  { k:'resolved',   cls:'s2', name:'Resolved',             color:'#1f9d57' },
  // SLA compliance % (created-in-month tickets that are resolved: share resolved within 240h).
  // Dotted line on the RIGHT 40–100% axis.
  { k:'slaPct',     cls:'s3', name:'SLA % (resolved within 240h)', color:'#7c3aed', pct:true }
];
function rsFmtPct(v){ return v==null?'\u2014':(Math.round(Number(v)*10)/10).toFixed(1)+'%'; }
function rsFmtVal(s,v){ return s.pct?rsFmtPct(v):(v==null?'\u2014':num(v)); }
async function rsLoadMonthly(){
  if(RS_M_STATE==='loading') return; RS_M_STATE='loading';
  var body=document.getElementById('rsMonthlyBody');
  body.innerHTML=ldHtml('rsm','Monthly trend \u00b7 '+RS_YEAR);
  _ldStart('rsm','monthly trend');
  var minHold=_delay(1500), r=null;
  try{ r=await A.api('GET','/api/resolutions/monthly?year='+RS_YEAR); }catch(e){}
  await minHold;
  if(!(r&&r.ok&&r.data&&Array.isArray(r.data.months))){
    _ldStop('rsm'); RS_M_STATE='idle';
    if(r&&r.status===403){ body.innerHTML='<div class="rs-msg" role="alert">This chart needs SLA access. Ask an admin to enable SLA Breaches for your account.</div>'; return; }
    body.innerHTML=rsErrHtml('Could not load the monthly trend'+(r&&r.status?(' (HTTP '+r.status+')'):'')+'.','rsMonthlyRetry');
    var b=document.getElementById('rsMonthlyRetry'); if(b) b.addEventListener('click',rsLoadMonthly);
    return;
  }
  RS_MONTHLY=r.data;
  _ldSuccess('rsm'); await _delay(800);
  body.innerHTML=rsMonthlyHtml();
  rsDrawChart();
  RS_M_STATE='done';
}
function rsDrawnMonths(){ var ms=(RS_MONTHLY&&RS_MONTHLY.months)||[], out=[]; for(var i=0;i<ms.length;i++){ if(ms[i].created==null) break; out.push(ms[i]); } return out; }
function rsMonthlyHtml(){
  var D=RS_MONTHLY, t=D.totals||{}, drawn=rsDrawnMonths();
  var lastLbl=drawn.length?RS_MON[drawn.length-1]:RS_MON[0];
  // Same compliance definition as the chart: within 240h ÷ resolved tickets of the created cohort.
  var pct=(t.slaEligible>0)?rsFmtPct(t.slaWithin/t.slaEligible*100):'\u2014';
  function tile(icn,cls,val,lbl,title){ return '<div class="rs-stat '+cls+'"'+(title?' title="'+esc(title)+'"':'')+'><span class="rs-stat-ic" aria-hidden="true">'+ic(icn,15)+'</span>'+
    '<span class="rs-stat-body"><span class="rs-stat-n">'+val+'</span><span class="rs-stat-l">'+esc(lbl)+'</span></span></div>'; }
  var rows=(D.months||[]).map(function(m,i){
    var f=function(v){ return v==null?'\u2014':num(v); };
    return '<tr><th scope="row">'+RS_MON[i]+' '+D.year+'</th><td>'+f(m.created)+'</td><td>'+f(m.resolved)+'</td><td>'+rsFmtPct(m.slaPct)+'</td></tr>';
  }).join('');
  return '<div class="rs-chart-top"><div class="rs-legend" aria-hidden="true">'+
      RS_SERIES.map(function(s){ return '<span class="rs-lg '+s.cls+'"><i></i>'+esc(s.name)+'</span>'; }).join('')+
    '</div></div>'+
    '<div class="rs-chart-wrap" id="rsChartWrap">'+
      '<svg class="rs-chart-svg" id="rsChartSvg" viewBox="0 0 920 320" preserveAspectRatio="xMidYMid meet" role="img" '+
        'aria-label="Line chart of tickets created and resolved per month in '+D.year+', January to '+esc(lastLbl)+', with SLA compliance percentage (resolved within 240 hours) as a dotted line on a right-hand 40 to 100 percent axis. The same numbers are in the table that follows." aria-describedby="rsMonthlyTblCap"></svg>'+
      '<div class="rs-tip" id="rsChartTip" aria-hidden="true"></div>'+
    '</div>'+
    '<table class="sr-only"><caption id="rsMonthlyTblCap">Monthly tickets created and resolved, and SLA % (share of the month\u2019s created tickets that are resolved, resolved within 240 hours), '+D.year+'. Months after the current month have no data yet.</caption>'+
      '<thead><tr><th scope="col">Month</th><th scope="col">Created</th><th scope="col">Resolved</th><th scope="col">SLA % (resolved within 240h)</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="rs-stats">'+
      tile('inbox','', num(t.created), 'YTD Created')+
      tile('check-circle','res', num(t.resolved), 'YTD Resolved')+
      tile('target','sla', num(t.slaCrossed), 'YTD SLA breached')+
      tile('bar-chart','pct', pct, 'SLA % (within 240h)','Resolved within 240h \u00f7 resolved, of tickets created '+D.year+' to date')+
    '</div>';
}
function rsNiceCeil(v){ if(v<=5) return 5; var e=Math.floor(Math.log10(v)),b=Math.pow(10,e),f=v/b; var nf=f<=1?1:f<=2?2:f<=5?5:10; return nf*b; }
function rsDrawChart(){
  var svg=document.getElementById('rsChartSvg'), wrap=document.getElementById('rsChartWrap'); if(!svg||!wrap||!RS_MONTHLY) return;
  var draw=rsDrawnMonths(), lastI=draw.length-1;
  // Fill the box's width at ~300px tall (same sizing approach as the SLA chart).
  var boxW=wrap.clientWidth||920, H=320, W=Math.max(600,Math.round(H*boxW/300));
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var padL=46,padR=48,padT=22,padB=36, plotW=W-padL-padR, plotH=H-padT-padB, axisY=padT+plotH;
  // LEFT axis = counts (Created / Resolved); RIGHT axis = SLA % fixed 40–100.
  var maxV=0; draw.forEach(function(m){ RS_SERIES.forEach(function(s){ if(!s.pct) maxV=Math.max(maxV,m[s.k]||0); }); });
  var niceMax=rsNiceCeil(Math.max(maxV,1));
  var PCT_MIN=40, PCT_MAX=100;
  var xAt=function(i){ return padL+plotW*(i/11); };
  var yCnt=function(v){ return padT+plotH-plotH*((v||0)/niceMax); };
  // Values below 40% are clamped to the axis floor visually; the point LABEL still shows the real value.
  var yPct=function(v){ var c=Math.min(PCT_MAX,Math.max(PCT_MIN,Number(v)||0)); return padT+plotH-plotH*((c-PCT_MIN)/(PCT_MAX-PCT_MIN)); };
  var yOf=function(s,v){ return s.pct?yPct(v):yCnt(v); };
  var has=function(s,m){ return m[s.k]!=null; };
  var g='';
  for(var b=0;b<=5;b++){ var v=Math.round(niceMax*b/5), y=yCnt(v);
    g+='<line class="grid" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>';
    g+='<text class="axlbl" x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end">'+num(v)+'</text>'; }
  // Right-hand % ticks every 10 (no grid lines for this axis, so they don't clash with the count grid).
  for(var p=PCT_MIN;p<=PCT_MAX;p+=10){ g+='<text class="axlbl pct" x="'+(W-padR+8)+'" y="'+(yPct(p)+4)+'" text-anchor="start">'+p+'%</text>'; }
  // All 12 month labels; the current (latest) month is bold.
  for(var i=0;i<12;i++) g+='<text class="axlbl'+(i===lastI?' cur':'')+'" x="'+xAt(i)+'" y="'+(H-padB+20)+'" text-anchor="middle">'+RS_MON3[i]+'</text>';
  g+='<line class="axis" x1="'+padL+'" y1="'+axisY+'" x2="'+(W-padR)+'" y2="'+axisY+'"/>';
  g+='<line class="vline" id="rsVLine" y1="'+padT+'" y2="'+axisY+'"/>';
  // Lines stop at the current month (later months are null and not drawn).
  // A null SLA % (no resolved tickets in that month's cohort) breaks the dotted line into segments.
  RS_SERIES.forEach(function(s){
    var seg=[], flush=function(){ if(seg.length>1) g+='<polyline class="ln '+s.cls+'" points="'+seg.join(' ')+'"/>'; seg=[]; };
    draw.forEach(function(m,i){ if(has(s,m)) seg.push(xAt(i)+','+yOf(s,m[s.k])); else flush(); });
    flush();
  });
  draw.forEach(function(m,i){
    RS_SERIES.forEach(function(s){ if(has(s,m)) g+='<circle class="pt '+s.cls+'" cx="'+xAt(i)+'" cy="'+yOf(s,m[s.k])+'" r="'+(i===lastI?5.5:4)+'"/>'; });
  });
  // Value labels on every point: each above its point; when it would collide with a label already
  // placed for that month (or leave the plot) it drops below its point, then nudges down.
  var GAP=12;
  draw.forEach(function(m,i){
    var x=xAt(i), placed=[];
    RS_SERIES.filter(function(s){ return has(s,m); }).map(function(s){ return { s:s, v:m[s.k], py:yOf(s,m[s.k]) }; })
      .sort(function(a,b){ return a.py-b.py; })
      .forEach(function(p){
        var ly=p.py-9; if(ly<padT+2) ly=p.py+16;
        var hit=function(y){ return placed.some(function(q){ return Math.abs(q-y)<GAP; }); };
        if(hit(ly)) ly=p.py+16;
        var guard=0; while(hit(ly)&&guard++<4) ly+=GAP;
        if(ly>axisY-3) ly=Math.max(padT+10,p.py-9);
        placed.push(ly);
        g+='<text class="ptlbl '+p.s.cls+(i===lastI?' last':'')+'" x="'+x+'" y="'+ly+'" text-anchor="middle">'+rsFmtVal(p.s,p.v)+'</text>';
      });
  });
  var colW=plotW/11;
  draw.forEach(function(m,i){ g+='<rect class="hit" data-i="'+i+'" x="'+(xAt(i)-colW/2)+'" y="'+padT+'" width="'+colW+'" height="'+plotH+'"/>'; });
  svg.innerHTML=g;
  // Hover checkpoint (visual only — the same numbers are in the visually-hidden table).
  var tip=document.getElementById('rsChartTip'), vline=document.getElementById('rsVLine');
  svg.querySelectorAll('.hit').forEach(function(rect){
    rect.addEventListener('mouseenter',function(){
      var i=+rect.getAttribute('data-i'), m=draw[i]; if(!m) return;
      tip.innerHTML='<div class="tt-m">'+RS_MON[i]+' '+RS_MONTHLY.year+'</div>'+RS_SERIES.map(function(s){
        return '<div class="tt-row"><span class="k"><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span><span class="v">'+rsFmtVal(s,m[s.k])+'</span></div>';
      }).join('');
      var cx=xAt(i); vline.setAttribute('x1',cx); vline.setAttribute('x2',cx); vline.style.visibility='visible';
      var box=svg.getBoundingClientRect(), px=(cx/W)*box.width; tip.classList.add('show');
      var tw=tip.offsetWidth||220, left=px+14; if(left+tw>box.width) left=px-tw-14; if(left<0) left=4;
      tip.style.left=left+'px';
    });
  });
  if(!wrap._rsLeave){ wrap._rsLeave=true; wrap.addEventListener('mouseleave',function(){ var t=document.getElementById('rsChartTip'), v=document.getElementById('rsVLine'); if(t) t.classList.remove('show'); if(v) v.style.visibility='hidden'; }); }
}
var _rsResizeT=null;
window.addEventListener('resize',function(){ clearTimeout(_rsResizeT); _rsResizeT=setTimeout(function(){ if(RS_M_STATE==='done') rsDrawChart(); },150); });

// =============== SECTION 2: Resolution Types (YTD 2026 | Monthly | Weekly) ===============
var RS_TYPES=[ { v:'ytd', l:'YTD '+RS_YEAR }, { v:'month', l:'Monthly' }, { v:'week', l:'Weekly' } ];
var RS={ type:'ytd', month:rsMaxMonth(), week:rsMaxWeek() };
var RS_CACHE={}, RS_CUR=null, RS_SEQ=0;
// The selected window: start/end are inclusive calendar days; the API gets [start, end+1).
function rsWindow(){
  if(RS.type==='month'){ var s=rsCal(RS_YEAR,RS.month,1); return { view:'month', start:s, end:rsCal(RS_YEAR,RS.month+1,0) }; }
  if(RS.type==='week'){ return { view:'week', start:RS.week, end:rsAddDays(RS.week,6) }; }
  return { view:'ytd', start:rsCal(RS_YEAR,0,1), end:rsMaxDay() };
}
function rsWinLabel(w){ return PURE.periodLabel ? PURE.periodLabel(w.view,w.start,w.end) : (rsYmd(w.start)+' \u2013 '+rsYmd(w.end)); }
function rsTypesShellHtml(){
  var tabs='<div class="perf-chips" role="tablist" aria-label="Resolution period">'+RS_TYPES.map(function(t){
    var on=RS.type===t.v;
    return '<button type="button" class="perf-chip'+(on?' on':'')+'" role="tab" id="rsTab-'+t.v+'" data-rs-type="'+t.v+'" aria-selected="'+on+'" aria-controls="rsTypesPanel" tabindex="'+(on?'0':'-1')+'">'+esc(t.l)+'</button>';
  }).join('')+'</div>';
  return '<div class="rs-toolbar">'+tabs+'<div id="rsStepper"></div></div>'+
    // Holds the (idle) compact loader until the section is first expanded — no request before then.
    '<div class="rs-card-body" id="rsTypesPanel" role="tabpanel" aria-labelledby="rsTab-'+RS.type+'">'+ldHtml('rst','Resolution types')+'</div>';
}
function rsStepperHtml(){
  var w=rsWindow();
  if(RS.type==='ytd') return '<span class="rs-period">'+esc(rsWinLabel(w))+'</span>';
  var isM=RS.type==='month', unit=isM?'month':'week';
  var prevOk=isM ? RS.month>0 : RS.week>rsMinWeek();
  var nextOk=isM ? RS.month<rsMaxMonth() : RS.week<rsMaxWeek();
  var lbl=isM ? (RS_MON[RS.month]+' '+RS_YEAR) : rsWinLabel(w);
  return '<div class="rs-step" role="group" aria-label="Choose '+unit+'">'+
    '<button type="button" class="rs-step-btn" data-rs-step="-1" aria-label="Previous '+unit+'"'+(prevOk?'':' disabled')+'>'+CHEV_L+'</button>'+
    '<span class="rs-step-lbl" aria-live="polite">'+esc(lbl)+'</span>'+
    '<button type="button" class="rs-step-btn" data-rs-step="1" aria-label="Next '+unit+'"'+(nextOk?'':' disabled')+'>'+CHEV_R+'</button>'+
  '</div>';
}
function rsSyncTabs(){
  RS_TYPES.forEach(function(t){
    var b=document.getElementById('rsTab-'+t.v); if(!b) return; var on=RS.type===t.v;
    b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on)); b.setAttribute('tabindex',on?'0':'-1');
  });
  var p=document.getElementById('rsTypesPanel'); if(p) p.setAttribute('aria-labelledby','rsTab-'+RS.type);
  var st=document.getElementById('rsStepper'); if(st) st.innerHTML=rsStepperHtml();
}
function rsSetType(v,focus){
  if(!RS_TYPES.some(function(t){ return t.v===v; })) return;
  RS.type=v; rsSyncTabs();
  if(focus){ var b=document.getElementById('rsTab-'+v); if(b) b.focus(); }
  rsLoadTypes();
}
function rsStep(dir){
  if(RS.type==='month'){ var m=RS.month+dir; if(m<0||m>rsMaxMonth()) return; RS.month=m; }
  else if(RS.type==='week'){ var w=rsAddDays(RS.week,7*dir); if(w<rsMinWeek()||w>rsMaxWeek()) return; RS.week=w; }
  else return;
  rsSyncTabs();
  var btn=document.querySelector('#rsStepper [data-rs-step="'+dir+'"]');
  if(btn&&!btn.disabled) btn.focus(); else { var other=document.querySelector('#rsStepper [data-rs-step="'+(-dir)+'"]'); if(other) other.focus(); }
  rsLoadTypes();
}
// Lazy: Section 2 makes NO request until it is expanded. RS_TYPES_KEY = the window currently shown
// (or loading) in the panel; re-expanding only fetches when the selection changed since then.
var RS_TYPES_KEY=null;
function rsTypesKey(w){ return w.view+':'+rsYmd(w.start)+'_'+rsYmd(w.end); }
function rsTypesOpen(){ var c=document.getElementById('rsTypesCard'); return !!(c&&c.classList.contains('open')); }
async function rsLoadTypes(){
  if(!rsTypesOpen()) return;   // collapsed: fetched on the next expand instead
  var seq=++RS_SEQ, w=rsWindow(), key=rsTypesKey(w);   // newest request wins (older ones bail on seq)
  var panel=document.getElementById('rsTypesPanel'); if(!panel) return;
  RS_TYPES_KEY=key;
  if(RS_CACHE[key]){ _ldStop('rst'); RS_CUR={ win:w, data:RS_CACHE[key] }; panel.innerHTML=rsTypesHtml(RS_CUR); panel.setAttribute('aria-busy','false'); return; }
  panel.setAttribute('aria-busy','true');
  panel.innerHTML=ldHtml('rst','Resolution types \u00b7 '+rsWinLabel(w));
  _ldStart('rst','resolution types');
  var minHold=_delay(1200), r=null;
  try{ r=await A.api('GET','/api/perf-summary?part=resolutions&from='+rsYmd(w.start)+'&to='+rsYmd(rsAddDays(w.end,1))); }catch(e){}
  await minHold;
  if(seq!==RS_SEQ) return;   // superseded by a newer selection
  panel.setAttribute('aria-busy','false');
  if(!(r&&r.ok&&r.data&&Array.isArray(r.data.resolutions))){
    _ldStop('rst'); RS_TYPES_KEY=null;   // let the next expand retry
    panel.innerHTML=rsErrHtml('Could not load the resolution types'+(r&&r.status?(' (HTTP '+r.status+')'):'')+'.','rsTypesRetry');
    var b=document.getElementById('rsTypesRetry'); if(b){ b.addEventListener('click',rsLoadTypes); }
    return;
  }
  RS_CACHE[key]=r.data;
  _ldSuccess('rst'); await _delay(600);
  if(seq!==RS_SEQ) return;
  RS_CUR={ win:w, data:r.data };
  panel.innerHTML=rsTypesHtml(RS_CUR);
}
function rsTypesHtml(cur){
  var D=cur.data, rows=D.resolutions||[], total=Number(D.resolvedTotal)||0, per=rsWinLabel(cur.win);
  if(!total||!rows.length) return '<div class="ps-res-empty">No tickets resolved in '+esc(per)+'</div>';
  var max=Math.max.apply(null,rows.map(function(r){ return Number(r.count)||0; }))||1;
  return '<div class="ps-res-sum"><b>'+num(total)+'</b> ticket'+(total===1?'':'s')+' resolved <span class="rs-sum-per">\u00b7 '+esc(per)+'</span></div>'+
    '<div class="ps-res-wrap"><table class="ps-res-tbl">'+
      '<caption class="sr-only">Resolution types of tickets resolved in '+esc(per)+'</caption>'+
      '<thead><tr><th scope="col">Resolution</th><th scope="col" class="n">Count</th><th scope="col">Percentage</th></tr></thead>'+
      '<tbody>'+rows.map(function(r,i){
        var n=Number(r.count)||0, pct=(Number(r.pct)||0).toFixed(1), w=Math.max(1,Math.round(n/max*100));
        return '<tr><th scope="row">'+esc(r.resolution)+'</th>'+
          '<td class="n"><button type="button" class="ps-res-cnt" data-rs-i="'+i+'" aria-label="View '+n+' ticket'+(n===1?'':'s')+' for '+esc(r.resolution)+'">'+num(n)+'</button></td>'+
          '<td class="rs-pct"><span class="rs-pct-wrap"><span class="rs-bar" aria-hidden="true"><i style="width:'+w+'%"></i></span><span class="rs-pct-n">'+esc(pct)+'%</span></span></td></tr>';
      }).join('')+'</tbody>'+
    '</table></div>';
}
// Delegated handlers: tabs (click + arrow keys), stepper, Count -> shared tickets pop-up.
document.addEventListener('click',function(ev){
  var t=ev.target.closest&&ev.target.closest('[data-rs-type]'); if(t){ if(t.getAttribute('data-rs-type')!==RS.type) rsSetType(t.getAttribute('data-rs-type'),false); return; }
  var s=ev.target.closest&&ev.target.closest('[data-rs-step]'); if(s){ if(!s.disabled) rsStep(parseInt(s.getAttribute('data-rs-step'),10)); return; }
  var c=ev.target.closest&&ev.target.closest('[data-rs-i]');
  if(c&&RS_CUR&&window.PHDResTickets){
    var r=(RS_CUR.data.resolutions||[])[parseInt(c.getAttribute('data-rs-i'),10)]; if(!r) return;
    window.PHDResTickets.open({ opener:c, resolution:r.resolution, count:r.count, view:RS_CUR.win.view, start:RS_CUR.win.start, end:RS_CUR.win.end });
  }
});
document.addEventListener('keydown',function(ev){
  var t=ev.target.closest&&ev.target.closest('[data-rs-type]'); if(!t) return;
  var i=RS_TYPES.findIndex(function(x){ return x.v===t.getAttribute('data-rs-type'); }), n=RS_TYPES.length, j=-1;
  if(ev.key==='ArrowRight'||ev.key==='ArrowDown') j=(i+1)%n;
  else if(ev.key==='ArrowLeft'||ev.key==='ArrowUp') j=(i-1+n)%n;
  else if(ev.key==='Home') j=0;
  else if(ev.key==='End') j=n-1;
  if(j<0) return;
  ev.preventDefault(); rsSetType(RS_TYPES[j].v,true);
});

// =============== Page shell ===============
var CARET='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>';
// Collapsible card: <h2><button aria-expanded aria-controls> header + a region that animates open/closed.
function rsCard(id,icon,title,inner,open){
  return '<section class="rs-card'+(open?' open':'')+'" id="'+id+'Card" aria-labelledby="'+id+'Title">'+
    '<h2 class="rs-card-h"><button type="button" class="rs-card-head" id="'+id+'Head" data-rs-toggle="'+id+'" aria-expanded="'+(open?'true':'false')+'" aria-controls="'+id+'Region">'+
      '<span class="rs-card-ic" aria-hidden="true">'+ic(icon,18)+'</span><span class="rs-card-title" id="'+id+'Title">'+esc(title)+'</span>'+
      '<span class="rs-caret" aria-hidden="true">'+CARET+'</span></button></h2>'+
    '<div class="rs-card-region" id="'+id+'Region"><div>'+inner+'</div></div></section>';
}
function rsToggleCard(id){
  var card=document.getElementById(id+'Card'), head=document.getElementById(id+'Head'); if(!card||!head) return;
  var open=!card.classList.contains('open');
  card.classList.toggle('open',open); head.setAttribute('aria-expanded',String(open));
  // Section 2: first expand (or an expand after the selection changed) fetches; otherwise reuse.
  if(open&&id==='rsTypes'&&RS_TYPES_KEY!==rsTypesKey(rsWindow())) rsLoadTypes();
}
document.addEventListener('click',function(ev){
  var h=ev.target.closest&&ev.target.closest('[data-rs-toggle]'); if(h) rsToggleCard(h.getAttribute('data-rs-toggle'));
});
function rsPaint(){
  document.getElementById('wrap').innerHTML=
    '<div class="rs-banner"><h1><span class="rs-hic" aria-hidden="true">'+ic('check-circle',18)+'</span>Resolutions</h1><span class="rs-ytd">'+ic('calendar',14)+'YTD '+RS_YEAR+'</span></div>'+
    rsCard('rsMonthly','line-chart','Monthly Created vs Resolved vs SLA ('+RS_YEAR+')','<div class="rs-card-body" id="rsMonthlyBody"></div>',true)+
    rsCard('rsTypes','check-circle','Resolution Types',rsTypesShellHtml(),false);
  rsSyncTabs();
}
(function init(){
  if(!A||!A.getUser||!A.getUser()||!A.getToken()){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  rsPaint();
  rsLoadMonthly();   // Section 1: expanded by default, loads now.
  // Section 2 (collapsed) loads on its first expand — see rsToggleCard.
})();
</script>
