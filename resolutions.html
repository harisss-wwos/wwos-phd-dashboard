<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resolutions · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: keep the page hidden until topbar-auth.js has injected its styles AND built the
     nav-rail + profile column, so the chrome is present on the FIRST paint (no flash-in). The class
     is cleared by topbar-auth after the chrome builds; a failsafe timer clears it if the script
     never runs (offline) so the page can never stay hidden. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<!-- Keep the page section hidden until the shared chrome (title bar + menu column) has wrapped it, so the
     loaders never show on a bare page while topbar-auth.js is still downloading. Safety net: shown
     anyway after 8s (html.tb-wrap-timeout) or without JS. -->
<style>#wrap{visibility:hidden}#tbHomeChrome #wrap,html.tb-wrap-timeout #wrap{visibility:visible}</style>
<script>setTimeout(function(){document.documentElement.classList.add('tb-wrap-timeout');},8000);</script>
<noscript><style>#wrap{visibility:visible!important}</style></noscript>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --o:#ff6100; --o-l:#fe9046; --page:#f4f3ef; --card:#ffffff; --ink:#1b2026; --ink2:#161d2d;
  --mut:#5c6773; --mut2:#818284; --line:#e2e6ea; --soft:#f5f6f8; --blue:#2b66c1; --blue-bg:#e6f0fc; --blue-ic:#c4def6;
  --green:#1a7a43; --green-bg:#e5f5ec; --red:#b42318; --red-bg:#fdecec; --amber:#b5530a; --amber-bg:#fff3e8;
  --violet:#7c3aed; --violet-bg:#f1ecfe; --acc:#ec7211; --acc-bg:#fff3e8; --acc-ink:#9a4100; --focus:#f0a35a;
  /* Chart series (Created matches the SLA Breaches chart; Resolved = green; SLA % = dotted purple). */
  --s1:#44b9d6; --s1-ink:#1f8fb0; --s2:#1f9d57; --s2-ink:#17804a; --s3:#7c3aed; --s3-ink:#6d28d9;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--page);color:var(--ink);min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:var(--ink);line-height:1}
.wrap{width:auto!important;max-width:none!important;margin:0 15px!important;padding:0 0 28px!important}
#wrap.wrap{padding-top:0!important;padding-bottom:20px!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* =====================================================================================
   Resolutions — same visual language as errors-in-resolved.html: dark navy hero (grid texture,
   orange glow, orange left rule), KPI cards overlapping it, then white section cards with chevron
   expanders. Scoped under .rsx (a size container for the responsive grids).
   ===================================================================================== */
.rsx{container-type:inline-size;color:var(--ink)}
:where(.rsx) button{font:inherit;text-transform:none}
.rsx :is(button,a,input,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---- Hero ---- */
.rsx-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 80px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.rsx-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.rsx-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.rsx-hero-in{position:relative;display:flex;gap:16px;align-items:flex-start;min-width:0}
.rsx-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.rsx-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.rsx-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.08}
.rsx-hero-sub{margin-top:9px;max-width:66ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.8)}
.rsx-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;list-style:none;padding:0}
.rsx-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  font-size:.8em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;max-width:100%;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.rsx-chip svg{flex-shrink:0;color:#ffb26b}
.rsx-chip span{color:rgba(233,237,243,.62);font-weight:800;font-size:.86em;letter-spacing:1px;text-transform:uppercase}

/* ---- KPI row (overlaps the hero): Section 1 year-to-date totals ---- */
.rsx-kpis{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:-58px 18px 16px}
@container (min-width:520px){.rsx-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.rsx-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rsx-kpi{position:relative;overflow:hidden;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.rsx-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#c4ccd4)}
.rsx-kpi-l{display:flex;align-items:center;gap:9px;font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.rsx-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:#3a4552}
.rsx-kpi-v{margin-top:12px;font-size:2.3em;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsx-kpi-s{margin-top:7px;font-size:.8em;font-weight:600;color:var(--mut);line-height:1.4}
.rsx-kpi-bar{margin-top:10px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.rsx-kpi-bar i{display:block;height:100%;border-radius:inherit;background:var(--k)}
.rsx-kpi.is-base{--k:#1f2a40}
.rsx-kpi.is-good{--k:#1f9d57}.rsx-kpi.is-good .rsx-kpi-v{color:var(--green)}.rsx-kpi.is-good .rsx-kpi-ic{background:var(--green-bg);color:var(--green)}
.rsx-kpi.is-bad{--k:#d92d20}.rsx-kpi.is-bad .rsx-kpi-v{color:var(--red)}.rsx-kpi.is-bad .rsx-kpi-ic{background:var(--red-bg);color:var(--red)}
.rsx-kpi.is-pct{--k:var(--violet)}.rsx-kpi.is-pct .rsx-kpi-v{color:var(--violet)}.rsx-kpi.is-pct .rsx-kpi-ic{background:var(--violet-bg);color:var(--violet)}
.rsx-kpi.is-sk::before{background:#e2e6ea}
.rsx-kpi.is-na .rsx-kpi-v{color:#8793a0}

/* ---- Section cards (accordion; chevron expander like errors-in-resolved's Checks / resolver rows) ---- */
.rs-card{--c:#2b66c1;--c-bg:#e6f0fc;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;
  box-shadow:0 2px 10px -6px rgba(20,30,50,.18);display:grid;grid-template-rows:auto 0fr;transition:grid-template-rows .3s ease,box-shadow .15s,border-color .15s}
.rs-card.open{grid-template-rows:auto 1fr;border-color:#d7dde3;box-shadow:0 14px 30px -24px rgba(20,30,50,.55)}
#rsTypesCard{--c:#7c3aed;--c-bg:#f1ecfe}
#rsPetCard{--c:#c2570c;--c-bg:#fff3e8}
.rs-card-h{margin:0;font-size:1em}
.rs-card-head{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:13px 20px 13px 16px;background:#fff;color:var(--ink);
  border:none;text-align:left;cursor:pointer;transition:background .15s}
.rs-card-head:hover{background:#fafbfc}
.rs-card.open .rs-card-head{background:#fbfcfd;box-shadow:inset 0 -1px 0 var(--line)}
.rsx .rs-card-head:focus-visible{outline-offset:-3px}
.rs-chev{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;color:#818284;transition:background .15s,color .15s}
.rs-chev svg{transition:transform .15s}
.rs-card-head[aria-expanded="true"] .rs-chev svg{transform:rotate(90deg)}
.rs-card-head:hover .rs-chev{background:#e6f0fc;color:#2b66c1}
.rs-card-ic{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;flex-shrink:0;background:var(--c-bg);color:var(--c)}
.rs-card-tt{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto}
.rs-card-title{font-size:1.1em;font-weight:800;letter-spacing:-.3px;line-height:1.25;margin:0;color:var(--ink)}
.rs-card-sub{font-size:.8em;font-weight:500;line-height:1.45;color:var(--mut)}
.rs-card-tag{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:.7em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  background:var(--acc-bg);color:var(--acc-ink);border:1px solid #f7c99c;white-space:nowrap}
@container (max-width:700px){.rs-card-tag{display:none}.rs-card-head{padding:12px 14px 12px 12px;gap:10px}.rs-card-ic{width:32px;height:32px}}
/* Collapsed content is hidden from keyboard/AT too (visibility flips after the close animation). */
.rs-card-region{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s linear .3s}
.rs-card.open .rs-card-region{visibility:visible;transition:visibility 0s}
@media (prefers-reduced-motion:reduce){.rs-card,.rs-chev svg,.rs-card-region{transition:none!important}}
.rs-card-body{padding:18px 20px 20px}
@container (max-width:700px){.rs-card-body{padding:14px 14px 16px}}

/* ---- Loading: skeletons that mirror the final layout + a rotating status line ---- */
.rs-sk{display:block;flex-shrink:0;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:rsShim 1.4s ease infinite}
@keyframes rsShim{0%{background-position:100% 0}100%{background-position:0 0}}
.rs-sk-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid #eef1f4}
.rs-sk-row:last-child{border-bottom:none}
.rs-sk-box{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.rs-sk-head{display:flex;align-items:center;gap:14px;padding:11px 14px;background:#f5f6f8;border-bottom:1px solid var(--line)}
.rs-sk-legend{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.rs-sk-chart{position:relative;height:280px;border-radius:10px;border:1px solid #eef1f4;background:repeating-linear-gradient(180deg,transparent 0 55px,#eef1f4 55px 56px);overflow:hidden}
.rs-sk-chart svg{position:absolute;inset:0;width:100%;height:100%}
.rs-sk-chart path{fill:none;stroke:#e2e6ea;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;animation:rsPulse 1.6s ease-in-out infinite}
.rs-sk-chart path+path{animation-delay:.25s}
@keyframes rsPulse{0%,100%{opacity:.55}50%{opacity:1}}
.rs-sk-card{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:#fff}
.rs-sk-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.rs-sk-tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:720px){.rs-sk-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rs-sk-tile{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.rs-loadnote{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 10px;margin:0 0 16px;font-size:.86em;font-weight:700;color:var(--mut);min-height:28px;text-align:center}
.rs-loadnote-ic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--amber-bg);color:var(--amber);animation:rsPop 1.6s ease-in-out infinite}
.rs-loadnote-sub{font-size:.8em;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#2b66c1;background:#e6f0fc;border:1px solid #c4def6;border-radius:99px;padding:3px 10px}
.rs-loadnote-msg.gw-msg-in{animation:rsMsgIn .45s cubic-bezier(.22,1,.36,1)}
.rs-load.gw-done .rs-loadnote-ic{background:var(--green-bg);color:var(--green);animation:none}
.rs-load.gw-done .rs-loadnote-msg{color:var(--green)}
@keyframes rsPop{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes rsMsgIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}

/* ---- Error / empty / no-access states ---- */
.rs-state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px 20px;text-align:center;color:var(--mut)}
.rs-state-ic{width:58px;height:58px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--red-bg);color:var(--red);margin-bottom:4px}
.rs-state-ic.is-mute{background:#eef1f4;color:#5c6773}
.rs-state-t{font-size:1.06em!important;font-weight:800;color:var(--ink)!important;margin:0}
.rs-state p{font-size:.9em;max-width:56ch;line-height:1.5}
.rs-retry{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:9px 16px;border:none;border-radius:8px;background:#161d2d;color:#f4f3ef;font-size:.86em;font-weight:800;cursor:pointer;transition:background .15s}
.rs-retry:hover{background:#0f1420}
.ps-res-empty{display:flex;align-items:center;justify-content:center;gap:8px;padding:22px 12px;border:1px dashed #d4dade;border-radius:10px;color:#8793a0;font-size:.88em;font-weight:600;text-align:center}

/* ---- Group headings inside a section ---- */
.rs-grp-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:.7em!important;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)!important}
.rs-grp-h::after{content:'';flex:1 1 auto;height:1px;background:var(--line)}
* + .rs-grp-h{margin-top:20px}

/* ---- Section 1: monthly chart (SVG) ---- */
.rs-chart-top{display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.rs-legend{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:.78em;font-weight:700;color:#3a4552}
.rs-lg{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
.rs-lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.rs-lg.s1 i{background:var(--s1)}.rs-lg.s2 i{background:var(--s2)}
.rs-lg.s3 i{width:18px;background:repeating-linear-gradient(90deg,var(--s3) 0 4px,transparent 4px 7px)}
.rs-chart-wrap{position:relative;width:100%;overflow:visible}
.rs-chart-svg{width:100%;height:auto;max-height:320px;display:block;overflow:visible}
.rs-chart-svg .grid{stroke:#eef1f4;stroke-width:1}
.rs-chart-svg .axis{stroke:#d4dce4;stroke-width:1}
.rs-chart-svg .axlbl{fill:#8793a0;font-size:11px;font-weight:600}
.rs-chart-svg .axlbl.cur{fill:#1b2026;font-weight:800}
.rs-chart-svg .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.rs-chart-svg .ln.s1{stroke:var(--s1)}.rs-chart-svg .ln.s2{stroke:var(--s2)}.rs-chart-svg .ln.s3{stroke:var(--s3);stroke-dasharray:4 4;stroke-linecap:butt}
.rs-chart-svg .axlbl.pct{fill:var(--s3-ink)}
.rs-chart-svg .pt{stroke:#fff;stroke-width:2}
.rs-chart-svg .pt.s1{fill:var(--s1)}.rs-chart-svg .pt.s2{fill:var(--s2)}.rs-chart-svg .pt.s3{fill:var(--s3)}
.rs-chart-svg .ptlbl{font-size:11px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.rs-chart-svg .ptlbl.s1{fill:var(--s1-ink)}.rs-chart-svg .ptlbl.s2{fill:var(--s2-ink)}.rs-chart-svg .ptlbl.s3{fill:var(--s3-ink)}
.rs-chart-svg .ptlbl.last{font-size:12.5px}
.rs-chart-svg .hit{fill:transparent;cursor:default}
.rs-chart-svg .vline{stroke:rgba(20,40,70,.22);stroke-width:1;stroke-dasharray:3 3;visibility:hidden}
.rs-tip{position:absolute;top:8px;pointer-events:none;z-index:5;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  box-shadow:0 14px 34px -16px rgba(20,40,70,.35);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-size:.82em}
.rs-tip.show{opacity:1;transform:none}
.rs-tip .tt-m{font-weight:800;color:#1b2026;margin-bottom:6px}
.rs-tip .tt-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:2px 0;color:var(--mut)}
.rs-tip .tt-row .k{display:inline-flex;align-items:center;gap:6px}
.rs-tip .tt-row .k i{width:9px;height:9px;border-radius:50%;display:inline-block}
.rs-tip .tt-row .v{font-weight:800;color:#1b2026}

/* ---- Section 2 toolbar: segmented time frame, stepper, totals, resolver chips ---- */
.rs-toolbar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin:18px 20px 0;padding:10px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
@container (max-width:700px){.rs-toolbar{margin:14px 14px 0}}
.perf-chips{display:inline-flex;flex:0 0 auto;padding:3px;border-radius:9px;background:#e7eaee;gap:2px}
.perf-chip{font-size:.84em;font-weight:700;color:#5c6773;background:none;border:none;border-radius:7px;padding:6px 14px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.perf-chip:hover{color:var(--ink)}
.perf-chip.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,50,.18)}
.rs-step{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1px solid #d4dade;border-radius:99px;padding:3px}
.rs-step-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:none;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer}
.rs-step-btn:hover:not(:disabled){background:var(--acc-bg);color:var(--acc)}
.rs-step-btn:disabled{opacity:.35;cursor:not-allowed}
.rs-step-btn svg{width:15px;height:15px}
.rs-step-lbl{min-width:170px;text-align:center;font-size:.82em;font-weight:800;color:var(--ink);padding:0 4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rs-period{display:inline-flex;align-items:center;padding:6px 12px;border-radius:99px;background:#fff;border:1px solid #d4dade;font-size:.82em;font-weight:800;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
/* Section totals (created / resolved): pill chips, LEFT of the resolver checkboxes. */
.rs-totals{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.rs-tot{display:inline-flex;align-items:center;gap:7px;padding:4px 5px 4px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:.8em;font-weight:700;color:#3a4552;white-space:nowrap}
.rs-tot b{display:inline-flex;align-items:center;justify-content:center;min-width:28px;min-height:20px;padding:1px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.rs-tot b .rs-sk{border-radius:99px}
.rs-totals+.rs-agents-wrap{margin-left:0}
/* Totals + resolver chips stay together at the right end (wrap as one group, totals first). */
.rs-tb-right{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 12px;margin-left:auto;min-width:0}
.rs-tb-right .rs-totals{margin-left:0}
/* Resolver group (PHD / Non-PHD): chip toggles; the native checkbox is kept (focusable, AT + change handlers). */
.rs-agents-wrap{display:inline-flex;align-items:center;gap:8px;margin-left:auto;flex:0 0 auto}
.rs-agents-lbl{font-size:.68em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)}
.rs-agents{display:inline-flex;align-items:center;gap:6px;margin:0;padding:0;min-width:0}
.rs-agent{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:.84em;font-weight:700;color:#3a4552;background:#fff;border:1px solid #d4dade;border-radius:99px;
  padding:6px 13px 6px 10px;cursor:pointer;user-select:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.rs-agent:hover{border-color:#b9c2cb}
.rs-agent:has(input:checked){background:var(--acc-bg);border-color:#f7c99c;color:var(--acc-ink)}
.rs-agent input{position:absolute;opacity:0;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rs-agent:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.rs-agent-ic{display:inline-flex;width:15px;height:15px;flex:0 0 15px}
.rs-agent-ic svg{width:15px;height:15px;display:block}
.rs-agent-ic .o{fill:none;stroke:#b3b9c0;stroke-width:1.5}
.rs-agent-ic .k{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.rs-agent:has(input:checked) .rs-agent-ic .o{fill:var(--acc);stroke:var(--acc)}
.rs-agent:has(input:checked) .rs-agent-ic .k{opacity:1}
.rs-agent.is-locked{cursor:not-allowed}
@container (max-width:700px){.rs-tb-right{margin-left:0;justify-content:flex-start}}

/* ---- Section 2 cards: AUTO-SIM, Appeals, Duplicate, Pet reopened (accent = --c) ---- */
.rs-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.rs-autosim{--c:#4f46e5;--c-bg:#eef0fe;position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(200px,38%);align-items:center;gap:8px 18px;
  padding:11px 16px 11px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;color:#2a3340;font-size:.9em;transition:border-color .15s,box-shadow .15s}
.rs-autosim::before{content:'';position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.rs-autosim:hover{border-color:#cfd6dd;box-shadow:0 10px 22px -18px rgba(20,30,50,.55)}
.rs-autosim.rs-appeals{--c:#0d9488;--c-bg:#e6f6f4}
.rs-autosim.rs-dups{--c:#b45309;--c-bg:#fdf3e7}
.rs-autosim.rs-petro{--c:#be123c;--c-bg:#fdecef}
.rs-autosim.rs-petro:has(.rs-exp[aria-expanded="true"]){border-color:#cfd6dd;box-shadow:0 12px 26px -22px rgba(20,30,50,.6)}
.rs-as-name{display:flex;align-items:center;gap:10px;min-width:0}
.rs-as-pad{flex:0 0 22px;width:22px}
.rs-as-ic{display:inline-flex;align-items:center;justify-content:center;flex:0 0 32px;width:32px;height:32px;border-radius:9px;background:var(--c-bg);color:var(--c)}
.rs-as-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.rs-as-lbl{font-size:1em;font-weight:800;color:var(--ink);line-height:1.3}
.rs-as-num{text-align:right}
.rs-as-cnt{font-size:1.18em;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue);background:none;border:none;border-radius:7px;padding:3px 8px;cursor:pointer;
  text-decoration:underline;text-decoration-color:rgba(43,102,193,.35);text-underline-offset:3px;transition:background .12s}
.rs-as-cnt:hover{background:var(--blue-bg);text-decoration-color:currentColor}
.rs-as-cnt.is-zero{cursor:default;text-decoration:none;color:#8793a0}
.rs-as-cnt.is-zero:hover{background:none}
.rs-autosim .rs-bar i{background:var(--c)}
.rs-petro-res{grid-column:1/-1;margin:6px 0 2px 32px}
.rs-petro-res .ps-res-tbl{font-size:.95em;min-width:0}
@container (max-width:700px){
  .rs-autosim{grid-template-columns:minmax(0,1fr) auto}
  .rs-as-bar{grid-column:1/-1}
  .rs-petro-res{margin-left:0}
}

/* ---- Tables (Resolution Types, Pet breakdown, Overrides by agent) ---- */
.ps-res-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:#fff}
.ps-res-wrap.rs-tbl-main{max-height:640px}
.ps-res-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.9em;min-width:520px}
/* The shared chrome turns bare tables into block scrollers on narrow screens; these already scroll in their wrappers. */
.rsx table.ps-res-tbl,.psm table.psm-tbl{display:table;max-width:none;overflow:visible}
.ps-res-tbl thead th{position:sticky;top:0;z-index:1;text-align:left;font-size:.72em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);
  background:#f5f6f8;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.ps-res-tbl td{padding:9px 14px;border-bottom:1px solid #eef1f4;color:#2a3340;vertical-align:middle}
.ps-res-tbl tbody th{font-size:1em;font-weight:700;letter-spacing:0;text-transform:none;text-align:left;color:var(--ink);background:transparent;padding:9px 14px;
  border-bottom:1px solid #eef1f4;overflow-wrap:break-word;line-height:1.35}
.ps-res-tbl tbody tr:last-child>*{border-bottom:none}
.ps-res-tbl tbody tr:hover>*{background:#fafbfc}
.ps-res-tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ps-res-tbl thead th.n{text-align:right}
.ps-res-tbl .rs-pct{width:42%;min-width:200px}
.rs-pct-wrap{display:flex;align-items:center;gap:10px}
.rs-bar{flex:1 1 auto;height:8px;border-radius:999px;background:#eef1f4;overflow:hidden}
.rs-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4f8cf0,#2b66c1);transition:width .5s ease}
.rs-pct-n{flex:0 0 52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:#2a3340}
/* Group rows: chevron (same as errors-in-resolved) reveals the raw values merged into a group. */
.rs-grp-name{display:inline-flex;align-items:center;gap:8px}
.rs-exp{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border:none;border-radius:5px;background:none;color:#818284;cursor:pointer;transition:background .15s,color .15s}
.rs-exp:hover{background:#e6f0fc;color:#2b66c1}
.rs-exp svg{transition:transform .15s}
.rs-exp[aria-expanded="true"] svg{transform:rotate(90deg)}
.rs-exp[aria-expanded="true"]{color:#2b66c1}
.ps-res-tbl tr.rs-sub>*{padding:6px 14px;font-size:.92em;color:var(--mut);background:#fbfcfd}
.ps-res-tbl tr.rs-sub .rs-sub-v{position:relative;padding-left:52px;overflow-wrap:anywhere}
.ps-res-tbl tr.rs-sub .rs-sub-v::before{content:'';position:absolute;left:31px;top:50%;width:10px;height:1px;background:#c9d0d8}
.ps-res-cnt{font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue);background:none;border:none;border-radius:6px;padding:3px 8px;margin:-3px -8px -3px 0;cursor:pointer;
  text-decoration:underline;text-decoration-color:rgba(43,102,193,.35);text-underline-offset:3px;transition:background .12s}
.ps-res-cnt:hover{background:var(--blue-bg);text-decoration-color:currentColor}
.psm button:focus-visible,.psm a:focus-visible,.psm-tblwrap:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.rs-bar i,.rs-exp svg{transition:none!important}}

/* Resolution tickets pop-up (shared resolution-tickets-modal.js; same CSS as performance-summary.html). */
.ps-export{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:inherit;font-size:.86em;font-weight:800;
  color:#f4f3ef;background:#161d2d;border:none;border-radius:8px;padding:10px 16px;transition:background .15s,transform .12s}
.ps-export:hover{background:#0f1420}
.ps-export svg{flex-shrink:0}
.psm-bg{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,30,45,.55)}
.psm-bg.open{display:flex}
.psm{background:#fff;border-radius:12px;width:min(1040px,96vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 28px 70px -24px rgba(20,30,45,.55)}
.psm-head{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 20px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.psm-head::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#ff9f2e,var(--acc))}
.psm-hd-t{min-width:0;flex:1 1 260px}
.psm-title{font-size:1.05em;font-weight:800;color:var(--ink);overflow-wrap:anywhere}
.psm-sub{font-size:.8em;color:var(--mut);margin-top:3px}
.psm-hd-a{display:flex;align-items:center;gap:8px;flex-shrink:0}
.psm-extract{padding:8px 14px}
.psm-extract:disabled{opacity:.45;cursor:not-allowed}
.psm-x{background:transparent;border:none;color:#8793a0;font-size:1.6em;line-height:1;cursor:pointer;padding:0 6px;border-radius:6px}
.psm-x:hover{color:var(--ink);background:#f1f3f6}
.psm-body{padding:14px 20px;overflow:auto;min-height:0;flex:1 1 auto}
.psm-msg{padding:28px 12px;text-align:center;color:var(--mut);font-size:.92em}
.psm-msg.err{color:#b02a2a}
/* Pop-up loading state: shimmer rows above the shared "Loading tickets…" status text. */
.psm-msg[role="status"]{padding:6px 0 18px;font-weight:700}
.psm-msg[role="status"]::before{content:'';display:block;height:236px;margin-bottom:14px;border:1px solid var(--line);border-radius:10px;
  background:linear-gradient(90deg,transparent 0,transparent 100%),
    repeating-linear-gradient(180deg,#f5f6f8 0 38px,#fff 38px 46px,#eceff2 46px 58px,#fff 58px 78px);
  -webkit-mask-image:linear-gradient(90deg,#000 0 92%,transparent);mask-image:linear-gradient(90deg,#000 0 92%,transparent);animation:rsPulse 1.6s ease-in-out infinite}
.psm-retry{margin-top:12px;font:inherit;font-size:.86em;font-weight:800;color:#f4f3ef;background:#161d2d;border:none;border-radius:8px;padding:8px 16px;cursor:pointer}
.psm-retry:hover{background:#0f1420}
.psm-tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.psm-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.85em}
.psm-tbl th{position:sticky;top:0;background:#f5f6f8;color:var(--mut);font-size:.74em;font-weight:800;text-transform:uppercase;letter-spacing:.7px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.psm-tbl td{padding:9px 12px;border-bottom:1px solid #eef1f4;color:var(--ink);vertical-align:top}
.psm-tbl tbody tr:last-child td{border-bottom:none}
.psm-tbl tbody tr:hover td{background:#fafbfc}
.psm-tbl .c-cty,.psm-tbl .c-id,.psm-tbl .c-dt{white-space:nowrap}
.psm-tbl .c-title{min-width:240px;white-space:normal;overflow-wrap:anywhere}
.psm-tbl a{color:var(--blue);font-weight:700;text-decoration:none}
.psm-tbl a:hover{text-decoration:underline}
.psm-cc{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.9em;font-weight:800;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-ic)}
.psm-foot{display:none;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:#fafbfc}
.psm-foot.on{display:flex}
.psm-showing{font-size:.82em;font-weight:600;color:var(--mut)}
.psm-pager{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.psm-pg{font:inherit;font-size:.82em;font-weight:700;min-width:34px;height:34px;padding:0 10px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.psm-pg:hover:not(:disabled):not([aria-current]){background:var(--blue-bg);border-color:var(--blue-ic)}
.psm-pg[aria-current]{background:#161d2d;border-color:#161d2d;color:#f4f3ef;cursor:default}
.psm-pg:disabled{opacity:.45;cursor:not-allowed}
.psm-gap{min-width:24px;text-align:center;color:var(--mut2);font-weight:700}
.rs-gate{text-align:center;padding:60px 20px;color:var(--mut)}

/* ---- Section 3: Pet auto-resolve (lines: created, resolved by AUTO-SIM [left axis]; reopened & resolved by agent [right axis]) ---- */
.rs-lg.p1 i{background:var(--s1)}
.rs-lg.p2 i{width:18px;background:repeating-linear-gradient(90deg,#4f46e5 0 7px,transparent 7px 10px)}
.rs-lg.p3 i{background:#ff6100}
.rs-chart-svg .ln.p1{stroke:var(--s1)}
.rs-chart-svg .ln.p2{stroke:#4f46e5;stroke-dasharray:7 4;stroke-linecap:butt}
.rs-chart-svg .ln.p3{stroke:#ff6100}
.rs-chart-svg .pt.p1{fill:var(--s1)}.rs-chart-svg .pt.p2{fill:#4f46e5}.rs-chart-svg .pt.p3{fill:#ff6100}
.rs-chart-svg .ptlbl.p1{fill:var(--s1-ink)}.rs-chart-svg .ptlbl.p2{fill:#4338ca}.rs-chart-svg .ptlbl.p3{fill:#c24a00}
.rs-chart-svg .axlbl.p3{fill:#c24a00}
.rs-chart-svg .axttl{fill:#5f6b78;font-size:11px;font-weight:700}
.rs-chart-svg .axttl.p3{fill:#c24a00}
.rs-chart-svg .bar{fill:#ff6100;cursor:pointer;transition:fill .12s}
.rs-chart-svg .bar:hover,.rs-chart-svg .bar.on{fill:#e55700}
.rs-chart-svg .bar:focus{outline:none}
.rs-chart-svg .bar:focus-visible{stroke:#1b2026;stroke-width:3}
.rs-chart-svg .hit.click{cursor:pointer}
/* KPI tiles: ONE row of five (two columns below 720px). Coloured top border = --k. */
.rs-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rs-po-stats{margin:0 0 18px}
.rs-po-stats.rs-po-5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:720px){.rs-po-stats.rs-po-5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rs-stat{--k:#1f2a40;--k-bg:var(--soft);--k-ink:#3a4552;position:relative;overflow:hidden;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:11px 9px;
  padding:15px 14px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:0 12px 26px -22px rgba(20,30,50,.6)}
.rs-stat::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k)}
.rs-stat-ic{grid-column:1;grid-row:1;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;flex-shrink:0;background:var(--k-bg);color:var(--k-ink)}
.rs-stat-body{display:contents}
.rs-stat-l{grid-column:2;grid-row:1;font-size:.66em;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);line-height:1.3;overflow-wrap:normal}
/* Narrow tiles: label gets its own full-width row under the icon so words never split. */
@container (max-width:1100px){.rs-stat .rs-stat-l{grid-column:1/-1;grid-row:2}.rs-stat .rs-stat-n{grid-row:3}}
.rs-stat-n{grid-column:1/-1;grid-row:2;font-size:clamp(1.35em,2.6cqi,1.9em);font-weight:800;letter-spacing:-.8px;line-height:1;color:var(--k-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.rs-stat.pcr{--k:var(--s1);--k-bg:#e6f6fa;--k-ink:var(--s1-ink)}
.rs-stat.asim{--k:#4f46e5;--k-bg:#eef0fe;--k-ink:#4338ca}
.rs-stat.ovr{--k:var(--acc);--k-bg:var(--acc-bg);--k-ink:#c2570c}
.rs-stat.pct{--k:var(--violet);--k-bg:var(--violet-bg);--k-ink:var(--violet)}
.rs-stat.reo{--k:#d97706;--k-bg:var(--amber-bg);--k-ink:var(--amber)}
.rs-po-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:.7em!important;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)!important}
.rs-po-h::after{content:'';flex:1 1 auto;height:1px;background:var(--line)}
.rs-po-note{display:flex;gap:10px;align-items:flex-start;font-size:.8em;color:var(--mut);margin:14px 0 0;padding:10px 12px;line-height:1.5;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.rs-po-note svg{flex-shrink:0;margin-top:1px;color:#2b66c1}

/* ---- Small screens ---- */
@container (max-width:700px){
  .rsx-hero{padding:22px 18px 76px 22px}
  .rsx-hero h1{font-size:1.6em;letter-spacing:-.6px}
  .rsx-hero-ic{display:none}
  .rsx-kpis{margin:-56px 10px 14px}
  .rsx-kpi-v{font-size:2em}
  .rs-step-lbl{min-width:0}
}

/* One orchestrated entrance on first paint: hero, KPI cards (staggered), then the sections. */
@keyframes rsUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rsx.is-anim .rsx-hero{animation:rsUp .45s ease both}
.rsx.is-anim .rsx-kpi{animation:rsUp .5s ease both}
.rsx.is-anim .rsx-kpi:nth-child(2){animation-delay:.06s}
.rsx.is-anim .rsx-kpi:nth-child(3){animation-delay:.12s}
.rsx.is-anim .rsx-kpi:nth-child(4){animation-delay:.18s}
.rsx.is-anim .rs-card{animation:rsUp .5s ease .2s both}
@media (prefers-reduced-motion:reduce){
  .rsx *,.rsx *::before,.rsx *::after,.psm-msg[role="status"]::before{animation:none!important;transition:none!important}
}
</style>

<script>
const A=window.PHDAuth;
function ic(n,s){ return window.icon?window.icon(n,s||14):''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
function num(n){ return (Number(n)||0).toLocaleString('en-US'); }
var RS_YEAR=2026;
var RS_MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
var RS_MON3=RS_MON.map(function(m){ return m.slice(0,3); });
var PURE=(window.PHDResTickets&&window.PHDResTickets.pure)||{};
var CHEV_L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>';
var CHEV_R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>';

// ---- Calendar days (UTC, the project convention) ----
// A UTC calendar day is held as a LOCAL-midnight Date naming that Y/M/D, so the shared label / ymd
// helpers (which read getFullYear/getMonth/getDate) print the UTC day and send it as YYYY-MM-DD.
function rsCal(y,m,d){ return new Date(y,m,d); }
function rsTodayUtc(){ var n=new Date(); return rsCal(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()); }
function rsAddDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function rsYmd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rsSunday(d){ return rsAddDays(d,-d.getDay()); }   // Sun–Sat weeks (performance-summary)
// Latest selectable day: today (UTC), capped to 31 Dec of the page year.
function rsMaxDay(){ var t=rsTodayUtc(), last=rsCal(RS_YEAR,11,31); return t>last?last:t; }
function rsMinWeek(){ return rsSunday(rsCal(RS_YEAR,0,1)); }   // week containing 1 Jan
function rsMaxWeek(){ return rsSunday(rsMaxDay()); }
function rsMaxMonth(){ var d=rsMaxDay(); return d.getFullYear()<RS_YEAR?0:d.getMonth(); }

// =============== Loading skeletons (mirror the final layout) + rotating status line ===============
// pfx: 'rsm' = Section 1 chart, 'rst' = Section 2 cards + table, 'rsp' = Section 3 tiles + chart + table.
// The status line is decorative (aria-hidden); screen readers get rsAnnounce() via the polite #rsLive region.
function rsSk(w,h,extra){ return '<span class="rs-sk" style="width:'+w+';height:'+h+'px'+(extra?';'+extra:'')+'"></span>'; }
function rsSkChart(){
  return '<div class="rs-sk-legend">'+rsSk('110px',24,'border-radius:99px')+rsSk('96px',24,'border-radius:99px')+rsSk('150px',24,'border-radius:99px')+'</div>'+
    '<div class="rs-sk-chart"><svg viewBox="0 0 600 280" preserveAspectRatio="none" focusable="false">'+
      '<path d="M30 190 L110 150 L190 165 L270 120 L350 135 L430 95 L510 110 L570 80"/>'+
      '<path d="M30 230 L110 205 L190 215 L270 180 L350 190 L430 160 L510 170 L570 150"/></svg></div>';

  if(RS.type==='ytd') return '<span class="rs-period">'+esc(rsWinLabel(w))+'</span>';
  var isM=RS.type==='month', unit=isM?'month':'week';
  var prevOk=isM ? RS.month>0 : RS.week>rsMinWeek();
  var nextOk=isM ? RS.month<rsMaxMonth() : RS.week<rsMaxWeek();
  var lbl=isM ? (RS_MON[RS.month]+' '+RS_YEAR) : rsWinLabel(w);
  return '<div class="rs-step" role="group" aria-label="Choose '+unit+'">'+
    '<button type="button" class="rs-step-btn" data-rs-step="-1" aria-label="Previous '+unit+'"'+(prevOk?'':' disabled')+'>'+CHEV_L+'</button>'+
    '<span class="rs-step-lbl" aria-live="polite">'+esc(lbl)+'</span>'+

function rsSyncTabs(){
  RS_TYPES.forEach(function(t){
    var b=document.getElementById('rsTab-'+t.v); if(!b) return; var on=RS.type===t.v;
    b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on)); b.setAttribute('tabindex',on?'0':'-1');
  });
  var p=document.getElementById('rsTypesPanel'); if(p) p.setAttribute('aria-labelledby','rsTab-'+RS.type);
  var st=document.getElementById('rsStepper'); if(st) st.innerHTML=rsStepperHtml();
  rsSyncAgents();
}
// Keep at least one resolver group checked: the last checked box is disabled (with a tooltip).
function rsSyncAgents(){
  var onlyOne=(RS.phd?1:0)+(RS.nonphd?1:0)===1;
  RS_AGENTS.forEach(function(a){
    var cb=document.getElementById('rsAgent-'+a.v), lb=document.getElementById('rsAgentLbl-'+a.v); if(!cb||!lb) return;
    var lock=onlyOne&&RS[a.v];
    cb.checked=!!RS[a.v]; cb.disabled=lock; lb.classList.toggle('is-locked',lock);
    if(lock){ lb.title='At least one must be selected'; cb.setAttribute('aria-describedby','rsAgentHint'); }
    else { lb.removeAttribute('title'); cb.removeAttribute('aria-describedby'); }
  });
  var hint=document.getElementById('rsAgentHint');
  if(!hint){ var g=document.querySelector('.rs-agents'); if(g){ hint=document.createElement('span'); hint.id='rsAgentHint'; hint.className='sr-only'; hint.textContent='At least one must be selected'; g.appendChild(hint); } }
}
function rsSetAgent(v,on){
  if(v!=='phd'&&v!=='nonphd') return;
  var other=v==='phd'?'nonphd':'phd';
  if(!on&&!RS[other]){ rsSyncAgents(); return; }   // never uncheck the last one
  RS[v]=!!on; rsSyncAgents();
  rsLoadTypes();
}
document.addEventListener('change',function(ev){
  var cb=ev.target&&ev.target.closest&&ev.target.closest('[data-rs-agent]'); if(!cb) return;
  rsSetAgent(cb.getAttribute('data-rs-agent'),cb.checked);
});
function rsSetType(v,focus){
  if(!RS_TYPES.some(function(t){ return t.v===v; })) return;
  RS.type=v; rsSyncTabs();
  if(focus){ var b=document.getElementById('rsTab-'+v); if(b) b.focus(); }
  rsLoadTypes();
}
function rsStep(dir){
  if(RS.type==='month'){ var m=RS.month+dir; if(m<0||m>rsMaxMonth()) return; RS.month=m; }
  else if(RS.type==='week'){ var w=rsAddDays(RS.week,7*dir); if(w<rsMinWeek()||w>rsMaxWeek()) return; RS.week=w; }
  else return;
  rsSyncTabs();
  var btn=document.querySelector('#rsStepper [data-rs-step="'+dir+'"]');
  if(btn&&!btn.disabled) btn.focus(); else { var other=document.querySelector('#rsStepper [data-rs-step="'+(-dir)+'"]'); if(other) other.focus(); }
  rsLoadTypes();
}
// Lazy: Section 2 makes NO request until it is expanded. RS_TYPES_KEY = the window currently shown
// (or loading) in the panel; re-expanding only fetches when the selection changed since then.
var RS_TYPES_KEY=null;
var RS_TYPES_V='v6';   // bump when the part=resolutions response shape changes (v3: Duplicate card; v4: Pet reopened card; v5: priority groups; v6: section totals + Pet reopened breakdown)
// Toolbar totals: D = the part=resolutions data (null while loading / on error -> '…').
// D === false (load failed) -> '—'.
function rsTotalsHtml(D){
  var pend=D?'\u2014':(D===false?'\u2014':'<span class="rs-sk" style="width:34px;height:9px" aria-hidden="true"></span><span class="sr-only">loading</span>');
  var c=D&&D.createdTotal!=null&&isFinite(Number(D.createdTotal)) ? num(Number(D.createdTotal)) : pend;
  var r=D&&D.sectionResolvedTotal!=null&&isFinite(Number(D.sectionResolvedTotal)) ? num(Number(D.sectionResolvedTotal)) : pend;
  return '<span class="rs-tot">Total tickets created: <b>'+c+'</b></span>'+
    '<span class="rs-tot">Total resolved: <b>'+r+'</b></span>';
}
function rsSetTotals(D){ var el=document.getElementById('rsTotals'); if(el) el.innerHTML=rsTotalsHtml(D); }
function rsTypesKey(w,agents){ return RS_TYPES_V+':'+w.view+':'+rsYmd(w.start)+'_'+rsYmd(w.end)+':'+agents; }
function rsTypesOpen(){ var c=document.getElementById('rsTypesCard'); return !!(c&&c.classList.contains('open')); }
async function rsLoadTypes(){
  if(!rsTypesOpen()) return;   // collapsed: fetched on the next expand instead
  var seq=++RS_SEQ, w=rsWindow(), ag=rsAgents(), key=rsTypesKey(w,ag);   // newest request wins (older ones bail on seq)
  var panel=document.getElementById('rsTypesPanel'); if(!panel) return;
  RS_TYPES_KEY=key;
  if(RS_CACHE[key]){ _ldStop('rst'); RS_CUR={ win:w, agents:ag, data:RS_CACHE[key] }; rsSetTotals(RS_CUR.data); panel.innerHTML=rsTypesHtml(RS_CUR); panel.setAttribute('aria-busy','false'); return; }
  rsSetTotals(null);
  panel.setAttribute('aria-busy','true');
  panel.innerHTML=ldHtml('rst','Resolution types \u00b7 '+rsAgentsLabel(ag)+' \u00b7 '+rsWinLabel(w));
  rsAnnounce('Loading resolution types for '+rsAgentsLabel(ag)+', '+rsWinLabel(w)+'\u2026');
  _ldStart('rst','resolution types');
  var minHold=_delay(1200), r=null;
  try{ r=await A.api('GET','/api/perf-summary?part=resolutions&splitNotSpecified=1&from='+rsYmd(w.start)+'&to='+rsYmd(rsAddDays(w.end,1))+'&agents='+ag); }catch(e){}
  await minHold;
  if(seq!==RS_SEQ) return;   // superseded by a newer selection
  panel.setAttribute('aria-busy','false');
  if(!(r&&r.ok&&r.data&&Array.isArray(r.data.resolutions))){
    _ldStop('rst'); RS_TYPES_KEY=null;   // let the next expand retry
    rsSetTotals(false);
    rsAnnounce('Could not load the resolution types.');
    panel.innerHTML=rsErrHtml('Could not load the resolution types'+(r&&r.status?(' (HTTP '+r.status+')'):'')+'.','rsTypesRetry');
    var b=document.getElementById('rsTypesRetry'); if(b){ b.addEventListener('click',rsLoadTypes); }
    return;
  }
  RS_CACHE[key]=r.data;
  _ldSuccess('rst'); await _delay(600);
  if(seq!==RS_SEQ) return;
  RS_CUR={ win:w, agents:ag, data:r.data };
  rsSetTotals(RS_CUR.data);
  panel.innerHTML=rsTypesHtml(RS_CUR);
  rsAnnounce('Resolution types loaded.');
}

// Resolutions provided for the Pet reopened tickets (server petReopenedResolutions: the table's grouped
// labels, sums to petReopenedTotal), highest count first. Spans the card's full width.
function rsPetReopenedResHtml(D,win){
  var rows=(Array.isArray(D.petReopenedResolutions)?D.petReopenedResolutions:[]).slice().sort(function(a,b){
    return (Number(b.count)||0)-(Number(a.count)||0) || String(a.resolution).localeCompare(String(b.resolution));
  });
  if(!rows.length) return '';
  return '<div class="ps-res-wrap rs-petro-res" id="rsPetroRes"'+(RS_PETRO_OPEN?'':' hidden')+'><table class="ps-res-tbl">'+
    '<caption class="sr-only">Resolutions provided for '+esc(RS_PETRO_LABEL)+' \u00b7 '+esc(rsWinLabel(win))+'</caption>'+

    '<tbody>'+rows.map(function(r){

    }).join('')+'</tbody></table></div>';

function rsTypesHtml(cur){
  // Highest count first (ties: group priority, then name). Sorted in place so the data-rs-i click
  // indexes below still point at the same rows.
  (cur.data.resolutions||[]).sort(function(a,b){
    var pa=(a.priority!=null&&isFinite(Number(a.priority)))?Number(a.priority):99, pb=(b.priority!=null&&isFinite(Number(b.priority)))?Number(b.priority):99;
    return (Number(b.count)||0)-(Number(a.count)||0) || pa-pb || String(a.resolution).localeCompare(String(b.resolution));
  });
  var D=cur.data, rows=D.resolutions||[], total=Number(D.resolvedTotal)||0, per=rsAgentsLabel(cur.agents)+' \u00b7 '+rsWinLabel(cur.win);
  // AUTO-SIM first; then Appeals, Pet reopened and Duplicate by resolved count for this period, largest
  // first (ties keep the order Appeals, Pet reopened, Duplicate). Rebuilt on every period change.
  var cards=[
    { n:Number(D.appealsTotal)||0, i:0, html:rsAppealsHtml(D,cur.win) },
    { n:Number(D.petReopenedTotal)||0, i:1, html:rsPetReopenedHtml(D,cur.win) },
    { n:Number(D.duplicatesTotal)||0, i:2, html:rsDuplicatesHtml(D,cur.win) }
  ].sort(function(a,b){ return (b.n-a.n)||(a.i-b.i); });
  var as='<h3 class="rs-grp-h">Tracked separately</h3><div class="rs-cards">'+rsAutosimHtml(D,cur.win)+cards.map(function(c){ return c.html; }).join('')+'</div>'+
    '<h3 class="rs-grp-h">By resolution type</h3>';
  if(!total||!rows.length) return as+'<div class="ps-res-empty">No tickets resolved in '+esc(per)+'</div>';
  var max=Math.max.apply(null,rows.map(function(r){ return Number(r.count)||0; }))||1;
  return as+'<div class="ps-res-wrap rs-tbl-main"><table class="ps-res-tbl">'+
      '<caption class="sr-only">Resolution types of tickets resolved in '+esc(per)+'</caption>'+
      '<thead><tr><th scope="col">Resolution</th><th scope="col" class="n">Count</th><th scope="col">Percentage</th></tr></thead>'+
      '<tbody>'+rows.map(function(r,i){
        var n=Number(r.count)||0, pct=(Number(r.pct)||0).toFixed(1), w=Math.max(1,Math.round(n/max*100));
        var vals=Array.isArray(r.values)?r.values:[], hasP=r.priority!=null&&isFinite(Number(r.priority));
        // Group rows: chevron button reveals the raw values merged into the group (rs-sub rows below).
        var exp=vals.length?'<button type="button" class="rs-exp" data-rs-exp="'+i+'" aria-expanded="false" aria-controls="'+vals.map(function(v,j){ return 'rsSub'+i+'_'+j; }).join(' ')+'" aria-label="Show the '+vals.length+' value'+(vals.length===1?'':'s')+' grouped as '+esc(r.resolution)+'">'+
          '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>':'<span class="rs-as-pad" aria-hidden="true"></span>';
        return '<tr>'+
          '<th scope="row"><span class="rs-grp-name">'+exp+'<span>'+esc(r.resolution)+'</span></span></th>'+
          '<td class="n"><button type="button" class="ps-res-cnt" data-rs-i="'+i+'" aria-label="View '+n+' ticket'+(n===1?'':'s')+' for '+esc(r.resolution)+'">'+num(n)+'</button></td>'+
          '<td class="rs-pct"><span class="rs-pct-wrap"><span class="rs-bar" aria-hidden="true"><i style="width:'+w+'%"></i></span><span class="rs-pct-n">'+esc(pct)+'%</span></span></td></tr>'+
          vals.map(function(v,j){
            return '<tr class="rs-sub" id="rsSub'+i+'_'+j+'" data-rs-sub="'+i+'" hidden>'+
              '<td class="rs-sub-v">'+esc(v.value)+'</td><td class="n">'+num(Number(v.count)||0)+'</td><td></td></tr>';
          }).join('');

    return;

      fileName:'appeals_'+aw.view+'_'+from+'_'+rsYmd(aw.end)+'.csv' });
    return;
  }
  var dq=ev.target.closest&&ev.target.closest('[data-rs-dups]');
  if(dq&&RS_CUR&&window.PHDResTickets){
    var dw=RS_CUR.win, dFrom=rsYmd(dw.start), dTo=rsYmd(rsAddDays(dw.end,1));   // to exclusive, like the counts
    window.PHDResTickets.open({ opener:dq, count:Number(RS_CUR.data.duplicatesTotal)||0,

      title:'Duplicate \u2014 '+rsWinLabel(dw), subtitle:'Closure code \u201cDuplicate\u201d \u00b7 '+rsWinLabel(dw),
      fileName:'duplicates_'+dw.view+'_'+dFrom+'_'+rsYmd(dw.end)+'.csv' });
    return;
  }
  var pq=ev.target.closest&&ev.target.closest('[data-rs-petro]');
  if(pq&&RS_CUR&&window.PHDResTickets){
    var pw=RS_CUR.win, pFrom=rsYmd(pw.start), pTo=rsYmd(rsAddDays(pw.end,1));   // to exclusive, like the counts

      fileName:'pet-reopened_'+pw.view+'_'+pFrom+'_'+rsYmd(pw.end)+'.csv' });
    return;
  }
  var px=ev.target.closest&&ev.target.closest('[data-rs-petro-exp]');
  if(px){

    rsCard('rsTypes','check-circle','Resolution Types','How tickets were resolved, by period and resolver group. Counts open the ticket list.','',rsTypesShellHtml(),false)+

  rsSyncTabs();

  setTimeout(function(){ var r=document.getElementById('rsx'); if(r) r.classList.remove('is-anim'); },1200);
}
