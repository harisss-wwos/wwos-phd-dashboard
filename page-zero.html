<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Anti-FOUC: hide the body until topbar-auth.js injects its CSS + builds the chrome. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<!-- Keep the section hidden until the shared chrome (title bar + menu column) has wrapped it. -->
<style>#wrap{visibility:hidden}#tbHomeChrome #wrap,html.tb-wrap-timeout #wrap{visibility:visible}</style>
<script>setTimeout(function(){document.documentElement.classList.add('tb-wrap-timeout');},8000);</script>
<noscript><style>#wrap{visibility:visible!important}</style></noscript>
<title>WWOS GSOC PHD Page "Zero" - 2026 · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================================
   Page ZERO — same visual language as performance-summary.html / errors-in-resolved.html:
   dark navy hero (grid texture + orange glow + orange left rule), KPI cards that overlap it,
   then white section cards with chevron expanders. Scoped under .pz (a size container).
   (theme.css / app-light.css are intentionally not loaded here, as on performance-summary.html,
   so their !important table/heading colours can't fight this layout.)
   ===================================================================================== */
:root{
  --o:#ff6100; --o-l:#fe9046; --page:#f4f3ef; --card:#ffffff; --ink:#1b2026; --ink2:#161d2d;
  --mut:#5c6773; --mut2:#818284; --line:#e2e6ea; --soft:#f5f6f8; --blue:#2b66c1; --blue-bg:#e6f0fc; --blue-ic:#c4def6;
  --green:#1a7a43; --green-bg:#e5f5ec; --red:#b42318; --red-bg:#fdecec; --amber:#b5530a; --amber-bg:#fff3e8;
  --acc:#ec7211; --acc-ink:#9a4100; --focus:#f0a35a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--page);color:var(--ink);min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:var(--ink);line-height:1}
.wrap{width:auto!important;max-width:none!important;margin:0 15px!important;padding:0 0 28px!important}
#wrap.wrap{padding-top:0!important}

.pz{container-type:inline-size;color:var(--ink)}
.pz button{font:inherit;text-transform:none}
.pz :is(button,a,input,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pz-sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.pz-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 80px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.pz-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.pz-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.pz-hero-in{position:relative;display:flex;gap:20px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.pz-hero-main{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1 1 380px}
.pz-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.pz-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.pz-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.08}
.pz-hero-sub{margin-top:9px;max-width:68ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.8)}
/* Desktop: the subtitle stays on one line (hero text column grows to fit it); below 1100px it wraps. */
@media (min-width:1100px){
  .pz-hero-in{flex-wrap:nowrap}
  .pz-hero-main{flex:1 1 auto}
  .pz-hero-tools{position:absolute;top:0;right:0}
  .pz-hero .pz-eyebrow,.pz-hero h1{margin-right:124px}   /* keep clear of the pinned Export button */
  /* Font tracks the .pz container so the one line always fits (never larger than the normal .92em). */
  .pz-hero-sub{max-width:none;white-space:nowrap;font-size:min(.92em,calc(1.459cqw - 1.9px))}
}
.pz-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;list-style:none;padding:0}
.pz-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  font-size:.8em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;max-width:100%;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pz-chip svg{flex-shrink:0;color:#ffb26b}
.pz-chip span{color:rgba(233,237,243,.62);font-weight:800;font-size:.86em;letter-spacing:1px;text-transform:uppercase}
.pz-chip .pz-sk{display:inline-block;width:150px;height:12px;background:linear-gradient(90deg,rgba(255,255,255,.10) 25%,rgba(255,255,255,.24) 40%,rgba(255,255,255,.10) 60%);background-size:400% 100%}
.pz-hero-tools{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:0 0 auto}
/* Export (copy as image) — orange on the hero. */
.pz-export{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.86em;font-weight:800;flex-shrink:0;
  color:#fff;background:var(--acc);border:none;border-radius:8px;padding:10px 16px;box-shadow:0 8px 18px -10px rgba(236,114,17,.9);transition:background .15s,transform .12s,opacity .15s}
.pz-export:hover{background:#d4620b}
.pz-export:active{transform:translateY(1px)}
.pz-export:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.pz-export.ok{background:#1f9d57}
.pz-export.err{background:var(--red)}

/* ---- KPI row (overlaps the hero) ---- */
.pz-kpis{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:-58px 18px 16px}
@container (min-width:520px){.pz-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.pz-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pz-kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.pz-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#1f2a40)}
.pz-kpi-l{display:flex;align-items:center;gap:9px;font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.pz-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--kb,var(--soft));color:var(--ki,#3a4552)}
.pz-kpi-n{margin-top:12px;font-size:2.4em;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.pz-kpi-n small{font-size:.42em;font-weight:800;letter-spacing:0;color:var(--mut);margin-left:4px}
.pz-kpi-sub{margin-top:9px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:.8em;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.pz-kpi-sub b{color:var(--ink);font-weight:800}
.pz-kpi-bar{margin-top:12px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.pz-kpi-bar i{display:block;height:100%;border-radius:inherit;background:var(--k)}
.pz-kpi.k-base{--k:#1f2a40}
.pz-kpi.k-good{--k:#1f9d57;--kb:var(--green-bg);--ki:var(--green)}
.pz-kpi.k-warn{--k:var(--acc);--kb:var(--amber-bg);--ki:var(--amber)}
.pz-kpi.k-blue{--k:#2b66c1;--kb:var(--blue-bg);--ki:var(--blue)}

/* ---- Section cards (chevron expanders as on errors-in-resolved) ---- */
.pz-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18);margin-bottom:16px;overflow:hidden}
.pz-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.pz-card.is-shut .pz-card-head{border-bottom-color:transparent}
.pz-card-h{display:flex;align-items:center;gap:12px;min-width:0;font-size:1em;font-weight:inherit;color:var(--ink)}
.pz-card-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;flex-shrink:0;background:var(--cb,var(--blue-bg));color:var(--ci,var(--blue))}
.pz-card.t-green{--cb:var(--green-bg);--ci:var(--green)}
.pz-card.t-amber{--cb:var(--amber-bg);--ci:var(--amber)}
.pz-card.t-rose{--cb:var(--red-bg);--ci:var(--red)}
.pz-card.t-navy{--cb:#e8ebf1;--ci:#1f2a40}
.pz-card.t-violet{--cb:#efeafd;--ci:#5b3fb5}
.pz-card-tt{display:flex;flex-direction:column;min-width:0;text-align:left}
.pz-card-title{font-size:1.12em;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:var(--ink)}
.pz-card-sub{margin-top:3px;font-size:.8em;font-weight:500;color:var(--mut);line-height:1.4}
.pz-card-body{padding:16px 20px 18px}
.pz-card-body[hidden]{display:none}
.pz-exp{display:inline-flex;align-items:center;gap:12px;margin:-5px -8px;padding:5px 10px 5px 6px;border:none;border-radius:9px;background:none;color:var(--ink);cursor:pointer;min-width:0}
.pz-exp:hover{background:#fafbfc}
.pz-chev{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;color:#818284}
.pz-chev svg{transition:transform .15s}
.pz-exp[aria-expanded="true"] .pz-chev svg{transform:rotate(90deg)}
.pz-exp:hover .pz-chev{background:#e6f0fc;color:#2b66c1}
.pz-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.78em;font-weight:700;color:#3a4552;white-space:nowrap;font-variant-numeric:tabular-nums}
.pz-pill b{color:var(--ink);font-weight:800}

/* ---- Metrics tables: every cell centred; # and Metric Name left-aligned (as on index.html's
   "Program metrics by year"), all vertically centred. Sticky header rows + sticky label columns. ---- */
.pz-tw{overflow:auto;max-height:min(74vh,820px);border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.pz-tbl{width:100%;min-width:max-content;border-collapse:separate;border-spacing:0;font-size:.86em;background:#fff}
.pz-tbl th,.pz-tbl td{padding:10px 12px;border-bottom:1px solid #eef1f4;text-align:center;vertical-align:middle;white-space:nowrap;font-variant-numeric:tabular-nums;color:#2a3340;line-height:1.3}
.pz-tbl thead th{position:sticky;z-index:2;background:var(--soft);border-bottom:1px solid var(--line);font-size:.72em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.pz-tbl thead tr.pz-hg th{top:0;height:34px}
.pz-tbl thead tr.pz-hm th{top:34px;height:34px}
.pz-tbl thead th.pz-q{color:var(--ink);font-size:.76em;letter-spacing:.4px;box-shadow:inset 0 -2px 0 #d5dbe3}
.pz-tbl .qs{border-left:1px solid var(--line)}
.pz-tbl thead th.pz-tot{background:#ffeedd;color:var(--acc-ink)}
.pz-tbl thead th.pz-ytd{background:#ffe2c6;color:var(--acc-ink);box-shadow:inset 0 3px 0 var(--acc)}
.pz-tbl .pz-n{position:sticky;left:0;z-index:1;width:48px;min-width:48px;text-align:left;color:#6b7684;font-weight:700;background:#fff}
/* Metric Name column = longest label (one line) + padding, measured in JS: the Core table uses its own
   width (--pz-metric-w-core); the other section tables share --pz-metric-w so they line up card to card. */
.pz-tbl .pz-name{position:sticky;left:48px;z-index:1;width:var(--pz-metric-w,1%);min-width:var(--pz-metric-w,0);max-width:var(--pz-metric-w,none);white-space:nowrap;text-align:left;font-weight:700;color:var(--ink);background:#fff;box-shadow:inset -1px 0 0 var(--line)}
.pz-tbl.pz-sortable .pz-name{width:var(--pz-metric-w-core,1%);min-width:var(--pz-metric-w-core,0);max-width:var(--pz-metric-w-core,none)}
.pz-tbl thead .pz-n,.pz-tbl thead .pz-name{z-index:3;background:var(--soft)}
.pz-tbl tbody tr:last-child>*{border-bottom:none}
.pz-tbl tbody tr>*{transition:background .12s}
.pz-tbl tbody td.pz-tot{background:#fffaf4;font-weight:700;color:var(--ink)}
.pz-tbl tbody td.pz-ytd{background:#fff3e6;font-weight:800;color:var(--ink);min-width:96px}
.pz-tbl tbody tr:hover>*{background:#fafbfc}
.pz-tbl tbody tr:hover>td.pz-tot{background:#fff1e3}
.pz-tbl tbody tr:hover>td.pz-ytd{background:#ffe9d3}
.pz-tbl td.pz-empty{color:#6b7684;font-weight:500}
/* Sortable period headers (Core Incident Metrics only). Cycle: highest first -> lowest first -> original order. */
.pz-tbl .pz-sort{display:inline-flex;align-items:center;justify-content:center;gap:4px;margin:-3px -6px;padding:3px 6px;border:none;border-radius:5px;background:none;cursor:pointer;
  color:inherit;font-size:1em;font-weight:inherit;letter-spacing:inherit;text-transform:inherit;white-space:nowrap}
.pz-tbl .pz-sort:hover{background:rgba(43,102,193,.08);color:var(--blue)}
.pz-si{display:inline-block;width:1em;text-align:center;font-size:.95em;line-height:1;opacity:0;transition:opacity .12s}
.pz-sort:hover .pz-si,.pz-sort:focus-visible .pz-si{opacity:.45}
.pz-tbl thead th.pz-sorted{color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}
.pz-tbl thead th.pz-sorted .pz-si{opacity:1}
.pz-tbl thead th.pz-ytd.pz-sorted{box-shadow:inset 0 3px 0 var(--acc),inset 0 -2px 0 var(--blue)}
/* Per-period CSV download (month / quarter headers of the Core table): a separate button beside the sort button. */
.pz-thc{display:inline-flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.pz-tbl .pz-dl{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:20px;height:20px;margin:-3px -6px -3px 2px;padding:0;
  border:1px solid transparent;border-radius:5px;background:none;color:#7a8597;cursor:pointer;transition:color .12s,background .12s,border-color .12s}
.pz-tbl .pz-dl:hover{color:var(--acc);background:#fff3e6;border-color:#f7c99c}
.pz-tbl .pz-dl:disabled{cursor:progress}
.pz-tbl .pz-dl.busy{color:var(--acc)}
.pz-dl-spin{display:block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:pzSpin .7s linear infinite}
@keyframes pzSpin{to{transform:rotate(360deg)}}
.pz-toast{position:fixed;left:50%;bottom:24px;z-index:50;transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:min(92vw,560px);
  padding:11px 14px 11px 16px;border-radius:10px;background:#1f2a40;color:#fff;font-size:.86em;font-weight:600;line-height:1.4;box-shadow:0 16px 32px -16px rgba(20,30,50,.7)}
.pz-toast.err{background:var(--red)}
.pz-toast[hidden]{display:none}
.pz-toast button{flex-shrink:0;border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:3px 9px;font-weight:800;cursor:pointer}
.pz-tbl.pz-sortable tbody tr>td.pz-sorted{background-image:linear-gradient(rgba(43,102,193,.07),rgba(43,102,193,.07))}
/* Fixed rows (#01 top, #12-13 bottom) stay put while sorting: light slate tint + lock cue. */
.pz-tbl.pz-sortable tbody tr.pz-fixed>:not(.pz-tot):not(.pz-ytd){background-color:#eef1f6}
.pz-tbl.pz-sortable tbody tr.pz-fixed:hover>:not(.pz-tot):not(.pz-ytd){background-color:#e6eaf1}
.pz-tbl.pz-sortable tbody tr.pz-fixed>td.pz-tot,.pz-tbl.pz-sortable tbody tr.pz-fixed>td.pz-ytd{background-image:linear-gradient(rgba(31,42,64,.06),rgba(31,42,64,.06))}
.pz-tbl.pz-sortable tbody tr.pz-fixed>td.pz-sorted{background-image:linear-gradient(rgba(43,102,193,.07),rgba(43,102,193,.07))}
/* Core table blocks (01 | 02-09 | 10-11 | 12-13), one <tbody> each, split by a slightly thicker divider. */
.pz-tbl tbody.pz-blk+tbody.pz-blk>tr:first-child>*{border-top:3px solid #d5dbe3}
/* Mitigation table: closing divider under its last block. */
.pz-tbl tbody.pz-blk-end>tr:last-child>*{border-bottom:3px solid #d5dbe3}
.pz-cap{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:.82em;font-weight:600;color:var(--mut);line-height:1.45}
.pz-cap svg{flex-shrink:0;color:var(--blue)}
.pz-tbl tbody tr.pz-fixed>td.pz-n{padding-right:4px;white-space:nowrap}
.pz-lock{display:inline-flex;vertical-align:-1px;margin-left:3px;color:#7a8597}
.pz-kind{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.74em;font-weight:800;color:var(--mut);vertical-align:1px;white-space:nowrap}
/* Proportional inline bar under the YTD value. */
.pz-mbar{display:block;width:64px;height:4px;margin:6px auto 0;border-radius:99px;background:#f1dcc7;overflow:hidden}
.pz-mbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f5a54a,var(--acc))}

/* ---- Indicative KRI ---- */
.pz-note{display:flex;gap:12px;align-items:flex-start;background:#f7f9fc;border:1px solid #d9e2ee;border-left:4px solid var(--blue);border-radius:10px;padding:12px 14px;font-size:.84em;color:#2a3340;line-height:1.55}
.pz-note-ic{flex-shrink:0;display:inline-flex;color:var(--blue);margin-top:2px}
.pz-note b{color:var(--ink)}
.pz-tag{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:99px;background:var(--amber-bg);border:1px solid #f7c99c;color:var(--acc-ink);font-size:.82em;font-weight:800;letter-spacing:.8px;text-transform:uppercase;vertical-align:1px}
.pz-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:14px 0;font-size:.78em;font-weight:700;color:var(--mut);list-style:none}
.pz-legend li{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.pz-legend i{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.pz-legend b{color:var(--ink)}
.pz-lvl{display:inline-block;padding:3px 11px;border-radius:99px;color:#fff;font-weight:800;font-size:.92em;white-space:nowrap}
.pz-chg{display:inline-flex;align-items:center;gap:3px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.pz-chg.up{color:var(--red)}
.pz-chg.dn{color:var(--green)}
.pz-cnt{display:block;margin-top:3px;font-size:.84em;font-weight:600;color:#6b7684}
/* Gauge: 0-100 track, fill coloured by KRI level; the value sits in white on the fill when it fits. */
.pz-gauge{position:relative;display:block;width:150px;height:22px;margin:0 auto;border-radius:99px;background:#eef1f4;overflow:hidden}
.pz-gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:var(--g,var(--acc));display:flex;align-items:center;justify-content:flex-end;padding-right:8px;
  font-style:normal;font-size:.86em;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.pz-gauge b{position:absolute;top:50%;transform:translateY(-50%);font-size:.86em;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.pz-none{padding:18px;text-align:center;color:var(--mut);font-style:italic}
.pz-tbl.pz-kri thead th{top:0;height:38px}
.pz-tbl.pz-kri th.l,.pz-tbl.pz-kri td.l{text-align:left}
.pz-tbl.pz-kri tbody th.l{font-weight:800;color:var(--ink)}
.pz-tbl.pz-kri td.pz-none{text-align:center}

/* Top-5 zipcodes: ranked list with bars. */
.pz-rank{list-style:none;display:flex;flex-direction:column}
.pz-rk{display:grid;grid-template-columns:36px minmax(140px,1.1fr) minmax(120px,2fr) auto;align-items:center;gap:6px 16px;padding:14px 4px;border-bottom:1px solid #eef1f4;transition:background .12s}
.pz-rk:first-child{padding-top:4px}
.pz-rk:last-child{border-bottom:none;padding-bottom:4px}
.pz-rk:hover{background:#fafbfc}
.pz-rk-n{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums;background:var(--soft);border:1px solid var(--line);color:#3a4552}
.pz-rk:first-child .pz-rk-n{background:var(--acc);border-color:var(--acc);color:#fff}
.pz-rk-id{display:flex;flex-direction:column;gap:4px;min-width:0}
.pz-rk-id strong{font-size:1.02em;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pz-cc{align-self:flex-start;display:inline-block;padding:1px 9px;border-radius:99px;font-size:.76em;font-weight:800;background:var(--soft);color:#3a4552;border:1px solid var(--line)}
.pz-rk-bar{display:block;height:10px;border-radius:99px;background:#eef1f4;overflow:hidden}
.pz-rk-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f5a54a,var(--acc))}
.pz-rk-v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pz-rk-v strong{display:block;font-size:1.35em;font-weight:800;letter-spacing:-.4px;color:var(--ink);line-height:1.05}
.pz-rk-v small{font-size:.76em;font-weight:700;color:#6b7684}
.pz-rk-stats{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:6px;list-style:none}
.pz-st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:.76em;font-weight:700;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.pz-st b{color:var(--ink);font-weight:800}
.pz-st .pz-chg{font-size:1em}

/* KRI sites + zipcodes side by side on wide screens. */
.pz-grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px}
@container (min-width:1500px){.pz-grid2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.pz-grid2 .pz-card{margin-bottom:0}

/* ---- Loading skeleton ---- */
.pz-sk{display:block;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:pzShim 1.4s ease infinite}
@keyframes pzShim{0%{background-position:100% 0}100%{background-position:0 0}}
.pz-kpi.is-sk::before{background:#e2e6ea}
.pz-sk-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid #eef1f4}
.pz-sk-row:last-child{border-bottom:none}
.pz-sk-row.hd{background:var(--soft);border-bottom:1px solid var(--line)}
.pz-loadnote{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 16px;font-size:.86em;font-weight:700;color:var(--mut);min-height:28px;text-align:center}
.pz-loadnote-ic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--amber-bg);color:var(--amber);animation:pzPulse 1.6s ease-in-out infinite}
.pz-loadnote-msg.gw-msg-in{animation:pzMsgIn .45s cubic-bezier(.22,1,.36,1)}
.pz-load.gw-done .pz-loadnote-ic{background:var(--green-bg);color:var(--green);animation:none}
.pz-load.gw-done .pz-loadnote-msg{color:var(--green)}
@keyframes pzPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes pzMsgIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}

/* ---- Error state ---- */
.pz-state{position:relative;z-index:1;margin:-58px 18px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 32px -24px rgba(20,30,50,.6);
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:38px 20px;text-align:center;color:var(--mut)}
.pz-state-ic{width:58px;height:58px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--red-bg);color:var(--red);margin-bottom:4px}
.pz-state h2{font-size:1.08em;font-weight:800;color:var(--ink)}
.pz-state p{font-size:.9em;max-width:52ch;line-height:1.5}
.pz-state code{font-size:.85em;color:#6b7684}
.pz-btn{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:9px 16px;border:none;border-radius:8px;background:#161d2d;color:#f4f3ef;font-size:.86em;font-weight:800;cursor:pointer;transition:background .15s}
.pz-btn:hover{background:#0f1420}

.pz-gate{max-width:560px;margin:60px auto;text-align:center;color:var(--mut)}
.pz-gate h1{color:var(--ink);font-size:1.5em;margin-bottom:10px}
.pz-gate p{line-height:1.55;margin-bottom:16px}
.pz-gate a{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;background:var(--acc);color:#fff;font-weight:800;text-decoration:none}
.pz-gate a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.pz-foot{font-size:.78em;color:var(--mut2);text-align:center;margin-top:18px}
.pz-foot b{color:var(--mut);font-weight:800}

/* One orchestrated entrance. */
@keyframes pzUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pz-hero{animation:pzUp .45s ease both}
.pz-body.is-anim .pz-kpi{animation:pzUp .5s ease both}
.pz-body.is-anim .pz-kpi:nth-child(2){animation-delay:.06s}
.pz-body.is-anim .pz-kpi:nth-child(3){animation-delay:.12s}
.pz-body.is-anim .pz-kpi:nth-child(4){animation-delay:.18s}
.pz-body.is-anim>.pz-card,.pz-body.is-anim>.pz-grid2{animation:pzUp .5s ease .2s both}

/* Small screens */
@container (max-width:700px){
  .pz-hero{padding:22px 18px 76px 22px}
  .pz-hero h1{font-size:1.6em;letter-spacing:-.6px}
  .pz-hero-ic{display:none}
  .pz-hero-tools{align-items:stretch;width:100%}
  .pz-export{justify-content:center}
  .pz-kpis,.pz-state{margin-left:10px;margin-right:10px}
  .pz-card-head,.pz-card-body{padding-left:14px;padding-right:14px}
  .pz-kpi-n{font-size:2.1em}
  /* Narrow: metric names stay on one line; the table scrolls horizontally with the name column sticky. */
  .pz-tbl .pz-n{position:static;width:36px;min-width:36px;padding-left:10px;padding-right:6px}
  .pz-tbl .pz-name{left:0;padding-left:10px}
  .pz-tbl thead .pz-n{position:sticky;left:auto}
  .pz-rk{grid-template-columns:32px minmax(0,1fr) auto}
  .pz-rk-bar{grid-column:2 / -1;grid-row:2}
  .pz-rk-stats{grid-column:1 / -1}
}

@media (prefers-reduced-motion:reduce){
  .pz *,.pz *::before,.pz *::after,.pz{animation:none!important;transition:none!important}
}

<body data-nav-active="page-zero" data-back-href="index.html" data-back-label="Home">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap"></div>

<script src="icons.js?v=2"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=222"></script>
<script>
(function(){
var A=window.PHDAuth;
var ic=function(n,s){ return window.icon?window.icon(n,s||18):''; };
var wrap=document.getElementById('wrap');
var YEAR=2026, TITLE='WWOS GSOC PHD Page "Zero" - '+YEAR;
document.title=TITLE+' \u00b7 WWOS-GSOC PHD Dashboard';
// Owner, admins and managers only. /api/page-zero enforces the same rule on the server (403 otherwise).
var role=(A&&A.getUser&&A.getUser()&&A.role)?A.role():'';
if(role!=='owner' && role!=='admin' && role!=='manager'){
  wrap.innerHTML='<div class="pz-gate"><h1>Page ZERO</h1><p>This page is available to the owner, admins and managers only.</p><a href="index.html">Go to Home</a></div>';
  return;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var DASH='\u2014';
// Cell text for one value: counts with thousands separators, % and days to 1 decimal, '—' when null.
function fmt(kind,v){
  if(v==null||!isFinite(v)) return DASH;
  if(kind==='pct') return Number(v).toFixed(1)+'%';
  if(kind==='days') return Number(v).toFixed(1);
  return Number(v).toLocaleString('en-US');
}
function fmtIst(iso){
  var d=new Date(iso); if(isNaN(d.getTime())) return '';
  try{ return d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})+' IST'; }
  catch(_){ return d.toISOString(); }
}

// Column layout: per quarter its three months then the quarter total, then the year-to-date column.
// Months that have not started yet are left out entirely (e.g. Nov / Dec), and a quarter with no
// elapsed month is dropped (its header + total). A partly elapsed quarter keeps its total column.
function quarters(D){
  var out=[];
  for(var q=0;q<4;q++){
    var ms=[]; for(var k=0;k<3;k++){ var m=D.months[q*3+k]; if(m && m.elapsed!==false) ms.push(m); }
    if(ms.length) out.push({ q:q, months:ms, span:ms.length+1 });
  }
  return out;
}
function columns(D){
  var cols=[];
  quarters(D).forEach(function(Q){
    Q.months.forEach(function(m){ cols.push({key:m.key,label:m.label,tot:false,q:Q.q}); });
    cols.push({key:'Q'+(Q.q+1),label:'Q'+(Q.q+1)+' '+D.year,tot:true,q:Q.q});
  });
  cols.push({key:'YTD',label:D.year+' YTD',tot:true,q:-1});
  return cols;
}
// Rows grouped by section, in server order.
function sections(D){
  var out=[], cur=null;
  D.rows.forEach(function(r){
    if(!cur||cur.name!==r.section){ cur={name:r.section,rows:[]}; out.push(cur); }
    cur.rows.push(r);
  });
  return out;
}

// ---- Hero: title, period + data-as-of chips, Export (rendered once; setHero() fills the live bits) ----
var PZ={ data:null, loading:false };
var CHEV='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function elapsedMonths(D){ return ((D&&D.months)||[]).filter(function(m){ return m&&m.elapsed!==false; }); }
function periodLabel(D){
  if(!D) return 'January '+YEAR+' \u2192 to date';
  var ms=elapsedMonths(D);
  if(!ms.length) return String(D.year);
  return (ms.length===1?ms[0].label:ms[0].label+' \u2013 '+ms[ms.length-1].label)+' \u00b7 UTC months';
}
function heroHtml(){
  return '<header class="pz-hero"><div class="pz-hero-in">'+
    '<div class="pz-hero-main"><span class="pz-hero-ic" aria-hidden="true">'+ic('grid',24)+'</span><div style="min-width:0">'+
      '<div class="pz-eyebrow">Page ZERO \u00b7 Owner, admin &amp; manager view</div>'+
      '<h1>'+esc(TITLE)+'</h1>'+
      '<p class="pz-hero-sub" id="pzSub">Created / resolved tickets for '+YEAR+' by UTC month, with quarter totals and the year to date, plus an indicative KRI for the top 5 sites and zipcodes.</p>'+
      '<ul class="pz-chips">'+
        '<li class="pz-chip">'+ic('calendar',14)+'<span>Period</span><b id="pzPeriod">'+esc(periodLabel(null))+'</b></li>'+
        '<li class="pz-chip">'+ic('clock',14)+'<span>Data as of</span><b id="pzAsOf"></b></li>'+
      '</ul>'+
    '</div></div>'+
    '<div class="pz-hero-tools"><button type="button" class="pz-export" id="pzExport" disabled title="Copy every table as an image">'+ic('copy',15)+'<span id="pzExportLbl">Export</span></button></div>'+
  '</div></header>';
}
function setHero(D,loading){
  var p=document.getElementById('pzPeriod'), a=document.getElementById('pzAsOf'), b=document.getElementById('pzExport');
  if(p) p.textContent=periodLabel(D);
  if(a) a.innerHTML=loading?'<span class="pz-sk" aria-hidden="true"></span><span class="pz-sr">Loading</span>':(D?esc(fmtIst(D.generatedAt)):DASH);
  if(b) b.disabled=!D;
}

// ---- KPI cards (YTD headline numbers from the same rows; sub line = latest elapsed month) ----
function rowBy(D,key){ for(var i=0;i<D.rows.length;i++) if(D.rows[i].key===key) return D.rows[i]; return null; }
function kpi(icon,label,n,sub,tone,extra){
  return '<div class="pz-kpi k-'+(tone||'base')+'"><div class="pz-kpi-l"><span class="pz-kpi-ic">'+ic(icon,15)+'</span>'+label+'</div>'+
    '<div class="pz-kpi-n">'+n+'</div><div class="pz-kpi-sub">'+(sub||'')+'</div>'+(extra||'')+'</div>';
}
function kpisHtml(D){
  var ms=elapsedMonths(D), lm=ms.length?ms[ms.length-1]:null;
  var ytd=function(r){ return r?r.values.YTD:null; };
  var sub=function(r,unit){ return (r&&lm)?('<span>'+esc(lm.label)+'</span><b>'+esc(fmt(r.kind,r.values[lm.key]))+'</b>'+(unit&&r.values[lm.key]!=null?'<span>'+unit+'</span>':'')):''; };
  var cr=rowBy(D,'created'), rs=rowBy(D,'resolved'), rp=rowBy(D,'resolutionPct'), ag=rowBy(D,'avgAge');
  var pct=ytd(rp), age=ytd(ag);
  var bar=(pct!=null&&isFinite(pct))?'<div class="pz-kpi-bar" aria-hidden="true"><i style="width:'+Math.max(0,Math.min(100,Number(pct)))+'%"></i></div>':'';
  return '<div class="pz-kpis">'+
    kpi('inbox',(cr?esc(cr.label):'PHD Incidents')+' \u00b7 YTD',fmt('count',ytd(cr)),sub(cr),'base')+
    kpi('check-circle','Resolved \u00b7 YTD',fmt('count',ytd(rs)),sub(rs),'good')+
    kpi('target','Incident resolution \u00b7 YTD',fmt('pct',pct),sub(rp),'blue',bar)+
    kpi('clock','Avg ticket age \u00b7 YTD',(age!=null&&isFinite(age))?fmt('days',age)+'<small>days</small>':DASH,sub(ag,'days'),'warn')+
  '</div>';
}

// ---- Collapsible section card (chevron expander, as on errors-in-resolved). Open state survives re-renders. ----
var PZ_OPEN={};
function card(o){
  var open=PZ_OPEN[o.key]!==false, id='pzSec-'+o.key;
  return '<section class="pz-card '+(o.tone||'')+(open?'':' is-shut')+'" aria-labelledby="'+id+'-h">'+
    '<div class="pz-card-head"><h2 class="pz-card-h" id="'+id+'-h"><button type="button" class="pz-exp" aria-expanded="'+open+'" aria-controls="'+id+'" data-pz-exp="'+o.key+'">'+
      '<span class="pz-chev">'+CHEV+'</span><span class="pz-card-ic">'+ic(o.icon,18)+'</span>'+
      '<span class="pz-card-tt"><span class="pz-card-title">'+o.title+'</span>'+(o.sub?'<span class="pz-card-sub">'+o.sub+'</span>':'')+'</span>'+
    '</button></h2>'+(o.aside||'')+'</div>'+
    '<div class="pz-card-body" id="'+id+'"'+(open?'':' hidden')+'>'+o.body+'</div></section>';
}
function pzToggle(btn){
  var key=btn.getAttribute('data-pz-exp'), open=btn.getAttribute('aria-expanded')!=='true';
  PZ_OPEN[key]=open;
  btn.setAttribute('aria-expanded',String(open));
  var body=document.getElementById(btn.getAttribute('aria-controls')); if(body) body.hidden=!open;
  var c=btn.closest('.pz-card'); if(c) c.classList.toggle('is-shut',!open);
}

// ---- Metrics: one card per section, each with its own table (months, quarter totals, YTD) ----
var SEC_META={
  'CORE INCIDENT METRICS':['alert','t-rose','Incident volume by type, plus repeat pet / non-pet incidents and rates'],
  'PERFORMANCE METRICS':['target','t-green','Resolved tickets, average ticket age and incident resolution'],
  'MITIGATION ACTIONS DEPLOYED':['shield','t-amber','Resolved tickets by resolution type, as on the Resolutions page'],
  'DUPLICATES & APPEALS':['copy','','Resolved tickets closed as Duplicate and appeal tickets'],
  'INCIDENTS BY DRIVER TYPE':['users','t-violet','Created tickets by driver type: DSP DA, Flex DP, Hub DA and others'],
  'SUPPLEMENTAL METRICS':['clock','t-navy','SLA compliance for dog and assault incidents (240-hour rule)']
};
function titleCase(s){ return String(s||'').toLowerCase().replace(/(^|\s)\S/g,function(c){ return c.toUpperCase(); }); }
// ---- Column sorting: Core Incident Metrics only. Rows sort only within their own block (CORE_BLOCKS, below):
// rows 02-09 among themselves, rows 10-11 between themselves; rows 01, 12 and 13 never move.
// One active sort {key, dir:'desc'|'asc'}; survives re-renders (Retry), not a reload. Nulls sink; ties keep order.
var SORT_SEC='CORE INCIDENT METRICS';
var PZ_SORT={key:null,dir:null};
var LOCK='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
function sortedGroup(list,cols){
  var key=PZ_SORT.key, dir=PZ_SORT.dir;
  if(!key||!dir||!cols.some(function(c){ return c.key===key; })) return list.slice();
  var num=function(r){ var v=r.values[key]; return (v==null||v===''||!isFinite(v))?null:Number(v); };
  return list.map(function(r,i){ return {r:r,i:i}; }).sort(function(a,b){
    var x=num(a.r), y=num(b.r);
    if(x===null||y===null){ if(x===y) return a.i-b.i; return x===null?1:-1; }
    if(x!==y) return dir==='desc'?y-x:x-y;
    return a.i-b.i;
  }).map(function(o){ return o.r; });
}
// Core table blocks (server/page-zero.js: every count is tickets created in the period). Rows 02-09 are
// mutually exclusive (each ticket counts in exactly one), so they add up to row 01. Each block is one
// <tbody> with a divider between blocks; 'fixed' blocks never move, the others sort among themselves.
var CORE_BLOCKS=[
  {ns:[1],fixed:true},
  {ns:[2,3,4,5,6,7,8,9]},
  {ns:[10,11]},
  {ns:[12,13],fixed:true}
];
function rowNo(n){ return String(n).length<2?'0'+n:String(n); }
// Header cell content for a sortable period column: a button with the label + direction indicator.
function sortTh(c,attrs,cls,canSort){
  if(!canSort) return '<th scope="col"'+attrs+(cls.length?' class="'+cls.join(' ')+'"':'')+'>'+esc(c.label)+'</th>';
  var on=PZ_SORT.key===c.key&&PZ_SORT.dir, dir=on?PZ_SORT.dir:null;
  if(on) cls=cls.concat('pz-sorted');
  var si=dir==='desc'?'\u25bc':(dir==='asc'?'\u25b2':'\u21c5');
  var tip=dir==='desc'?'Sorted highest first \u2014 click for lowest first':(dir==='asc'?'Sorted lowest first \u2014 click for original order':'Sort by '+c.label+', highest first');
  var sortBtn='<button type="button" class="pz-sort" data-pz-sort="'+esc(c.key)+'" title="'+esc(tip)+'">'+esc(c.label)+'<span class="pz-si" aria-hidden="true">'+si+'</span></button>';
  var dl=dlBtn(c);
  return '<th scope="col"'+attrs+(cls.length?' class="'+cls.join(' ')+'"':'')+' aria-sort="'+(dir==='desc'?'descending':(dir==='asc'?'ascending':'none'))+'">'+
    (dl?'<span class="pz-thc">'+sortBtn+dl+'</span>':sortBtn)+'</th>';
}
// ---- Per-period CSV download (Core table month / quarter headers; not YTD). Only for columns with data
// (row 01 has a value), i.e. elapsed periods. GET /api/page-zero/export -> Blob -> object-URL download.
var PZ_DL={};   // period key -> true while downloading (survives the re-render after a sort)
var DL_IC='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
var DL_SPIN='<span class="pz-dl-spin" aria-hidden="true"></span>';
function dlBtn(c){
  var D=PZ.data; if(!D||c.key==='YTD') return '';
  var cr=rowBy(D,'created'), v=cr?cr.values[c.key]:null;
  if(v==null||!isFinite(v)) return '';
  var busy=!!PZ_DL[c.key], lbl='Download '+c.label+' tickets (CSV)';
  return '<button type="button" class="pz-dl'+(busy?' busy':'')+'" data-pz-dl="'+esc(c.key)+'" data-pz-dl-label="'+esc(c.label)+'" aria-label="'+esc(lbl)+'" title="'+esc(lbl)+'"'+
    (busy?' disabled aria-busy="true"':'')+'>'+(busy?DL_SPIN:DL_IC)+'</button>';
}
function dlFileName(key){ return 'PHD_Page0_Core_'+(key.charAt(0)==='Q'?YEAR+'-'+key:key)+'.csv'; }
function setDlBusy(key,busy){
  document.querySelectorAll('[data-pz-dl="'+key+'"]').forEach(function(b){
    b.disabled=busy; b.classList.toggle('busy',busy);

  });
  // Indicative KRI: note lines, then each table as a section bar + its own header row + body rows.
  if(KT.length){
    rows.push({kind:'gap',cells:[{text:'',span:N,blank:true}]});
    kriNote(D).forEach(function(t,i){ rows.push({kind:'note',cells:[{text:t,span:N,align:'left',bold:i===0}]}); });
    var AL={c:'center',l:'left',v:'right'};
    KT.forEach(function(T){
      rows.push({kind:'gap',cells:[{text:'',span:N,blank:true}]});
      rows.push({kind:'sec',cells:[{text:T.title,span:N,align:'left'}]});
      // grp: KRI rows get their own column widths, stretched to the full grid width in pzLayout (no filler cell).
      rows.push({kind:'subhead',grp:T.id,cells:T.cols.map(function(c){ return {text:c.h,align:'center'}; })});
      if(!T.list.length){ rows.push({kind:'body',grp:T.id,zebra:0,cells:[{text:'Not enough data yet',span:T.cols.length,align:'center',muted:true}]}); return; }
      T.list.forEach(function(e,i){
        rows.push({kind:'body',grp:T.id,zebra:i%2,cells:T.cols.map(function(c){
          var x=c.get(e);
          return {text:x.text,align:AL[x.align],pill:x.pill||null,color:x.dir==='up'?KRI_UP:(x.dir==='dn'?KRI_DN:null),bold:!!x.dir||x.align==='l'};
        })});
      });
    });
  }
  return rows;
}
function pzLayout(rows,measure){
  var P=PZ_IMG, ncols=0;
  rows.forEach(function(r){ var k=0; r.cells.forEach(function(c){ c.span=Math.max(1,c.span||1); k+=c.span; }); if(!r.grp&&k>ncols) ncols=k; });
  var colW=[]; for(var i=0;i<ncols;i++) colW.push(P.minCol);
  var bold=function(r,c){ return (r.kind!=='body'&&r.kind!=='note')||!!c.bold; };
  var nat=function(r,c){ return Math.ceil(measure(c.text,bold(r,c)))+2*P.padX+(c.pill?12:0); };
  rows.forEach(function(r){ if(r.kind==='sec'||r.kind==='gap'||r.grp) return; var ci=0; r.cells.forEach(function(c){ if(c.span===1) colW[ci]=Math.max(colW[ci],nat(r,c)); ci+=c.span; }); });
  rows.forEach(function(r){
    if(r.kind==='sec'||r.kind==='gap'||r.grp) return;
    var ci=0; r.cells.forEach(function(c){
      if(c.span>1){ var have=0,j; for(j=ci;j<ci+c.span;j++) have+=colW[j]; var need=nat(r,c); if(need>have) for(j=ci;j<ci+c.span;j++) colW[j]+=Math.ceil((need-have)/c.span); }
      ci+=c.span;
    });
  });
  // KRI groups: natural column widths per table; if a table is wider than the grid, widen the grid evenly.
  var gW={};
  rows.forEach(function(r){
    if(!r.grp) return;
    var g=gW[r.grp]||(gW[r.grp]=[]), ci=0;
    r.cells.forEach(function(c){ for(var j=ci;j<ci+c.span;j++) if(g[j]==null) g[j]=P.minCol; if(c.span===1) g[ci]=Math.max(g[ci],nat(r,c)); ci+=c.span; });
  });
  var sum=function(a){ return a.reduce(function(s,b){ return s+b; },0); };
  Object.keys(gW).forEach(function(k){ var need=sum(gW[k])-sum(colW); if(need>0&&colW.length) for(var j=0;j<colW.length;j++) colW[j]+=Math.ceil(need/colW.length); });
  var width=sum(colW), rh=P.lh+2*P.padY;
  // Stretch each KRI table's columns proportionally to the full grid width (the last column absorbs rounding).
  Object.keys(gW).forEach(function(k){
    var g=gW[k], s=sum(g), acc=0;
    gW[k]=g.map(function(w,j){ if(j===g.length-1) return width-acc; var v=Math.floor(w*width/s); acc+=v; return v; });
  });
  var head=[], body=[];
  rows.forEach(function(r){
    var ci=0, cells=[], cw=r.grp?gW[r.grp]:colW;
    r.cells.forEach(function(c){
      var x=0,w=0,m; for(m=0;m<ci;m++) x+=cw[m]; for(m=ci;m<ci+c.span;m++) w+=cw[m];
      cells.push({x:x,w:w,text:c.text,bold:bold(r,c),tot:!!c.tot,q:!!c.q,muted:!!c.muted,align:c.align||'left',
        blank:!!c.blank,pill:c.pill||null,color:c.color||null});
      ci+=c.span;
    });
    var row={kind:r.kind,zebra:r.zebra||0,cells:cells,h:rh};
    (r.kind==='head'?head:body).push(row);
  });
  var headH=head.length*rh, parts=[], part=null, cur=0;
  var open=function(){ part={body:[],height:0}; cur=headH+1; parts.push(part); };
  open();
  body.forEach(function(r){ if(part.body.length&&cur+r.h>P.maxH-1) open(); part.body.push(r); cur+=r.h; });
  parts.forEach(function(p){ p.height=headH+p.body.length*rh+1; });
  return {width:width,head:head,parts:parts};
}
function pzDrawPart(L,part){
  var P=PZ_IMG, W=L.width+1, H=part.height, cv=document.createElement('canvas');
  cv.width=W*P.dpr; cv.height=H*P.dpr;
  var ctx=cv.getContext('2d'); ctx.scale(P.dpr,P.dpr);
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.textBaseline='middle'; ctx.lineWidth=1;
  var y=0;
  var drawRow=function(r){
    r.cells.forEach(function(c){
      var bg, fg;
      if(c.blank||r.kind==='gap'){ ctx.fillStyle='#ffffff'; ctx.fillRect(c.x,y,c.w+1,r.h+1); return; }
      if(r.kind==='head'||r.kind==='subhead'){ bg=c.tot?'#9a4a00':(c.q?'#163056':'#1f3a68'); fg='#ffffff'; }
      else if(r.kind==='sec'){ bg='#161d2d'; fg='#ffffff'; }
      else if(r.kind==='note'){ bg='#f4f7fb'; fg='#1b2026'; }
      else { bg=c.tot?'#fff4e8':(r.zebra?'#f4f7fb':'#ffffff'); fg=c.color||(c.muted?'#5b6676':(c.text===DASH?'#98a2ae':'#1b2026')); }
      ctx.fillStyle=bg; ctx.fillRect(c.x,y,c.w+1,r.h+1);
      ctx.strokeStyle=(r.kind==='body'||r.kind==='note')?'#d5dbe3':'#3b5584'; ctx.strokeRect(c.x+0.5,y+0.5,c.w,r.h);
      if(c.pill){   // KRI Level pill: coloured rounded box, white text
        ctx.fillStyle=c.pill; ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(c.x+5,y+4,c.w-10,r.h-8,(r.h-8)/2); else ctx.rect(c.x+5,y+4,c.w-10,r.h-8);
        ctx.fill(); fg='#ffffff';
      }
      ctx.font=pzFont(c.bold); ctx.fillStyle=fg; ctx.textAlign=c.align;
      var tx=c.align==='right'?c.x+c.w-P.padX:(c.align==='center'?c.x+c.w/2:c.x+P.padX);
      ctx.fillText(c.text,tx,y+r.h/2);
    });
    y+=r.h;
  };
  L.head.forEach(drawRow); part.body.forEach(drawRow);
  return cv;
}
// Tab-separated copy of the same table (text/plain).
function pzPlain(D){
  var cols=columns(D), out=[TITLE];
  var g=['','']; quarters(D).forEach(function(Q){ g.push('Q'+(Q.q+1)+' '+D.year); for(var i=1;i<Q.span;i++) g.push(''); }); g.push('');
  out.push(g.join('\t'));
  out.push(['#','Metric Name'].concat(cols.map(function(c){ return c.label; })).join('\t'));
  sections(D).forEach(function(s){
    out.push(s.name);
    s.rows.forEach(function(r){ out.push([rowNo(r.n),r.label].concat(cols.map(function(c){ return fmt(r.kind,r.values[c.key]); })).join('\t')); });
  });
  if(D.kri){
    out.push(''); kriNote(D).forEach(function(t){ out.push(t); });
    kriTables(D).forEach(function(T){
      out.push('', T.title, T.cols.map(function(c){ return c.h; }).join('\t'));
      if(!T.list.length) out.push('Not enough data yet');
      T.list.forEach(function(e){ out.push(T.cols.map(function(c){ return c.get(e).text; }).join('\t')); });
    });
  }
  return out.join('\n');
}
function pzToBlob(cv){ return new Promise(function(res,rej){ cv.toBlob(function(b){ b?res(b):rej(new Error('toBlob failed')); },'image/png'); }); }
function pzCopyViaSelection(html,plain){
  var d=document.createElement('div'), sel=window.getSelection&&window.getSelection(), ok=false;
  d.contentEditable='true'; d.setAttribute('aria-hidden','true');
  d.style.cssText='position:fixed;left:-10000px;top:0;width:800px;height:1px;overflow:hidden;';
  d.innerHTML=html;
  var onCopy=function(e){ try{ if(e.clipboardData){ e.clipboardData.setData('text/html',html); e.clipboardData.setData('text/plain',plain); e.preventDefault(); } }catch(_){} };
  document.body.appendChild(d); document.addEventListener('copy',onCopy);
  try{ var r=document.createRange(); r.selectNodeContents(d); sel.removeAllRanges(); sel.addRange(r); ok=document.execCommand('copy'); }catch(e){ ok=false; }
  document.removeEventListener('copy',onCopy);
  try{ sel.removeAllRanges(); }catch(_){}
  document.body.removeChild(d);
  return ok;
}
function pzDownload(blob,name){
  var u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u); },4000);
}
function pzFeedback(text,ok){
  var b=document.getElementById('pzExport'), l=document.getElementById('pzExportLbl');
  if(l) l.textContent=text;
  if(b){ b.classList.toggle('ok',!!ok); b.classList.toggle('err',!ok); }
  setTimeout(function(){ if(l) l.textContent='Export'; if(b){ b.classList.remove('ok'); b.classList.remove('err'); } },1800);
}
// Copies the table as a PNG (image/png + <img> html + tab-separated text). The canvas is drawn synchronously
// inside the click so the ClipboardItem is created before any await. Fallbacks: rich HTML with the <img>
// (async clipboard, then select+copy), else download the PNG.
async function pzExport(){
  var D=PZ.data; if(!D) return;
  var parts, L, plain=pzPlain(D);
  try{ L=pzLayout(pzModel(D),pzMeasurer()); parts=L.parts.map(function(p){ return pzDrawPart(L,p); }); }
  catch(e){ pzFeedback('Export failed',false); return; }
  var html=parts.map(function(cv,i){
    var w=L.width+1, h=L.parts[i].height;
    return '<img src="'+cv.toDataURL('image/png')+'" width="'+w+'" height="'+h+'" alt="'+esc(TITLE)+(parts.length>1?' (part '+(i+1)+' of '+parts.length+')':'')+'" style="display:block;width:'+w+'px;height:'+h+'px;margin:6px 0 12px;border:0">';
  }).join('');
  var mk=function(s){ return new Blob(['<html><head><meta charset="utf-8"></head><body>'+s+'</body></html>'],{type:'text/html'}); };
  var plainBlob=new Blob([plain],{type:'text/plain'});
  var canClip=!!(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write);
  var pngOk=canClip&&parts.length===1&&(typeof ClipboardItem.supports!=='function'||ClipboardItem.supports('image/png'));
  // 1) Image clipboard (single image only: the clipboard holds one image/png).
  if(pngOk){
    try{
      await navigator.clipboard.write([new ClipboardItem({'image/png':pzToBlob(parts[0]),'text/html':mk(html),'text/plain':plainBlob})]);
      pzFeedback('Copied',true); return;
    }catch(e){}
  }
  // 2) Rich HTML with the <img> (+ plain text).
  if(canClip){
    try{ await navigator.clipboard.write([new ClipboardItem({'text/html':mk(html),'text/plain':plainBlob})]); pzFeedback('Copied',true); return; }catch(e){}
  }
  if(pzCopyViaSelection(html,plain)){ pzFeedback('Copied',true); return; }
  // 3) Download the PNG(s).
  try{
    for(var i=0;i<parts.length;i++){
      var b=await pzToBlob(parts[i]);
      pzDownload(b,parts.length>1?('page-zero-'+YEAR+'-'+(i+1)+'.png'):('page-zero-'+YEAR+'.png'));
    }
    pzFeedback('Downloaded',true);
  }catch(e){ pzFeedback('Copy failed',false); }
}

// ---- Loading: skeleton placeholders mirroring the final layout + a rotating status line ----
var PHASES=[
  ['inbox','Counting tickets created in '+YEAR+'\u2026'],
  ['target','Classifying incidents by issue type\u2026'],
  ['check-circle','Tallying resolutions and mitigations\u2026'],
  ['clock','Checking SLA compliance (240-hour rule)\u2026'],
  ['bar-chart','Building the quarter and YTD totals\u2026']
];
var _t=null;
function _set(p){
  var e=document.getElementById('pzLoaderMsg'), i=document.getElementById('pzLoaderIc');
  if(i) i.innerHTML=ic(p[0]||'clock',15);
  if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent=p[1]; e.classList.add('gw-msg-in'); }
}
function _stop(){ if(_t){ clearInterval(_t); _t=null; } }
function _start(){
  _stop(); var i=0; _set(PHASES[0]);
  _t=setInterval(function(){ i++; if(i<PHASES.length) _set(PHASES[i]); else { _stop(); _set(['clock','Still working on it \u2014 thanks for your patience\u2026']); } },1800);
}
function _done(){
  _stop();
  var l=document.getElementById('pzLoader'); if(l) l.classList.add('gw-done');
  _set(['check-circle','Data fetched successfully']);
}
function _delay(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
// Polite screen-reader announcements (loading / loaded / failed).
function announce(msg){ var l=document.getElementById('pzLive'); if(!l) return; l.textContent=''; setTimeout(function(){ l.textContent=msg; },60); }
function skeletonHtml(){
  var sk=function(w,h,extra){ return '<span class="pz-sk" style="width:'+w+';height:'+h+'px'+(extra?';'+extra:'')+'"></span>'; };
  var kpiSk='<div class="pz-kpi is-sk">'+sk('58%',11)+sk('44%',34,'margin-top:14px')+sk('72%',14,'margin-top:11px')+'</div>';
  var head=function(){ return '<div class="pz-card-head"><div class="pz-card-h">'+sk('22px',22,'border-radius:5px')+sk('34px',34,'border-radius:9px')+
    '<span style="display:flex;flex-direction:column;gap:7px">'+sk('200px',14,'max-width:46vw')+sk('280px',10,'max-width:52vw')+'</span></div>'+sk('120px',26,'border-radius:99px')+'</div>'; };
  var trow=function(hd){
    var r='<div class="pz-sk-row'+(hd?' hd':'')+'">'+sk('24px',hd?10:12,'flex:0 0 24px')+sk('220px',hd?10:13,'flex:0 0 220px');
    for(var c=0;c<8;c++) r+=sk('52px',hd?10:13,'flex:0 0 52px');
    return r+'</div>';
  };
  var table=function(rows){ var t='<div class="pz-tw" style="overflow:hidden"><div style="min-width:820px">'+trow(true); for(var i=0;i<rows;i++) t+=trow(false); return t+'</div></div>'; };
  var card=function(body){ return '<div class="pz-card">'+head()+'<div class="pz-card-body">'+body+'</div></div>'; };
  var gaugeRows='', rankRows='';
  for(var g=0;g<5;g++) gaugeRows+='<div class="pz-sk-row">'+sk('28px',28,'flex:0 0 28px;border-radius:9px')+sk('30%',13)+sk('150px',22,'flex:0 0 150px;border-radius:99px;margin-left:auto')+'</div>';
  for(var k=0;k<5;k++) rankRows+='<div class="pz-sk-row">'+sk('32px',32,'flex:0 0 32px;border-radius:9px')+sk('22%',14)+sk('40%',10,'border-radius:99px')+sk('56px',20,'margin-left:auto')+'</div>';
  return '<div id="pzLoader" class="pz-load">'+
    '<div class="pz-kpis">'+kpiSk+kpiSk+kpiSk+kpiSk+'</div>'+
    '<div class="pz-loadnote" aria-hidden="true"><span class="pz-loadnote-ic" id="pzLoaderIc">'+ic('inbox',15)+'</span>'+
      '<span class="pz-loadnote-msg gw-msg-in" id="pzLoaderMsg">Getting the numbers ready\u2026</span></div>'+
    card(table(8))+card(table(3))+
    '<div class="pz-grid2">'+card(sk('100%',44,'border-radius:10px;margin-bottom:12px')+gaugeRows)+card(rankRows)+'</div>'+
  '</div>';
}
// Friendly error state with a Retry that re-runs the same fetch.
function errorHtml(msg){
  return '<div class="pz-state" role="alert">'+
    '<span class="pz-state-ic">'+ic('alert',26)+'</span>'+
    '<h2>We couldn\u2019t load Page ZERO</h2>'+
    '<p>The server didn\u2019t send the '+YEAR+' metrics. Check your connection, then try again.</p>'+
    (msg?'<code>'+esc(msg)+'</code>':'')+
    '<button type="button" class="pz-btn" id="pzRetry">'+ic('refresh',15)+'Retry</button>'+
  '</div>';
}

// ---- Flow ----
function bodyEl(){ return document.getElementById('pzBody'); }
function shell(){
  wrap.innerHTML='<div class="pz"><div id="pzLive" class="pz-sr" role="status" aria-live="polite" aria-atomic="true"></div>'+
    heroHtml()+'<div class="pz-body" id="pzBody" tabindex="-1"></div><div id="pzToast" class="pz-toast" hidden></div></div>';
  var b=document.getElementById('pzExport'); if(b) b.addEventListener('click',pzExport);
  wrap.addEventListener('click',function(ev){
    var t=ev.target&&ev.target.closest?ev.target:null; if(!t) return;
    var dl=t.closest('[data-pz-dl]'); if(dl){ ev.stopPropagation(); ev.preventDefault(); pzDownloadPeriod(dl); return; }
    if(t.closest('[data-pz-toast-x]')){ var ts=document.getElementById('pzToast'); if(ts) ts.hidden=true; return; }
    var x=t.closest('[data-pz-exp]'); if(x){ pzToggle(x); return; }
    var so=t.closest('[data-pz-sort]'); if(so){ pzSort(so); return; }
    if(t.closest('#pzRetry')){ load(); var bd=bodyEl(); if(bd) bd.focus(); }
  });
}
// Metric Name column width = widest label (header + rows, one line) incl. padding, in two groups:
// the Core table (.pz-sortable) hugs its own longest label (--pz-metric-w-core); the other section tables
// share the widest of their labels (--pz-metric-w) so they line up card to card.
// Measured in an off-screen probe table with the same classes, so collapsed (hidden) cards are counted too.
function pzMeasureNames(root,cells){
  if(!cells.length) return 0;
  var probe=document.createElement('table');
  probe.className='pz-tbl'; probe.setAttribute('aria-hidden','true');
  probe.style.cssText='position:absolute;left:-99999px;top:0;visibility:hidden;width:auto;min-width:0';
  var hh='', bh='';
  cells.forEach(function(c){
    var t='<th class="pz-name" style="width:auto;min-width:0;max-width:none;position:static">'+c.innerHTML+'</th>';
    if(c.closest('thead')) hh+='<tr>'+t+'</tr>'; else bh+='<tr>'+t+'</tr>';
  });
  probe.innerHTML='<thead>'+hh+'</thead><tbody>'+bh+'</tbody>';
  root.appendChild(probe);
  var w=0;
  probe.querySelectorAll('.pz-name').forEach(function(c){ var x=c.getBoundingClientRect().width; if(x>w) w=x; });
  probe.remove();
  return Math.ceil(w);
}
function fitMetricCol(){
  var root=wrap.querySelector('.pz'); if(!root) return;
  var wc=pzMeasureNames(root,root.querySelectorAll('.pz-tbl.pz-sortable .pz-name'));
  var wo=pzMeasureNames(root,root.querySelectorAll('.pz-tbl:not(.pz-kri):not(.pz-sortable) .pz-name'));
  if(wc>0){ root.style.setProperty('--pz-metric-w-core',wc+'px'); PZ.metricWCore=wc; }
  if(wo>0){ root.style.setProperty('--pz-metric-w',wo+'px'); PZ.metricW=wo; }
}
var _fitT=0;
window.addEventListener('resize',function(){ clearTimeout(_fitT); _fitT=setTimeout(fitMetricCol,120); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitMetricCol);
function render(D){
  setHero(D,false);
  var b=bodyEl(); if(!b) return;
  b.innerHTML=kpisHtml(D)+sectionsHtml(D)+kriHtml(D)+
    '<div class="pz-foot">WWOS-GSOC PHD \u00b7 Page ZERO \u00b7 use <b>Export</b> to copy every table as one image</div>';
  b.removeAttribute('aria-busy'); b.classList.add('is-anim');
  fitMetricCol();
  announce('Page ZERO loaded: '+D.rows.length+' metrics, '+periodLabel(D)+'.');
}
function renderError(msg){
  setHero(null,false);
  var b=bodyEl(); if(!b) return;
  b.innerHTML=errorHtml(msg); b.removeAttribute('aria-busy');
  announce('Could not load Page ZERO.');
}
function gate(msg,link){
  wrap.innerHTML='<div class="pz-gate"><h1>Page ZERO</h1><p>'+msg+'</p>'+(link?'<a href="index.html">Go to Home</a>':'')+'</div>';
}
async function load(){
  if(PZ.loading) return;
  PZ.loading=true; PZ.data=null;
  var b=bodyEl();
  if(b){ b.classList.remove('is-anim'); b.setAttribute('aria-busy','true'); b.innerHTML=skeletonHtml(); }
  setHero(null,true); announce('Loading Page ZERO\u2026'); _start();
  var t0=Date.now(), r=null;
  try{ r=await A.api('GET','/api/page-zero?year='+YEAR); }catch(e){ r=null; }
  if(r&&r.ok&&r.data&&Array.isArray(r.data.rows)&&Array.isArray(r.data.months)){
    var wait=700-(Date.now()-t0); if(wait>0) await _delay(wait);
    _done(); await _delay(400);
    PZ.data=r.data; PZ.loading=false; render(r.data);
    return;
  }
  _stop(); PZ.loading=false;
  if(r&&r.status===401){ gate('Your session has expired. Please log in again.',false); return; }
  if(r&&r.status===403){ gate('This page is available to the owner and managers only.',true); return; }
  renderError((r&&r.data&&r.data.error)?r.data.error:'Could not load Page ZERO.');
}
shell();
load();
})();
