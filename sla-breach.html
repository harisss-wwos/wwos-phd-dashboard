<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLA Breaches (>240h) · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: keep the page hidden until topbar-auth.js has injected its styles AND built the
     nav-rail + profile column, so the chrome is present on the FIRST paint (no flash-in). The class
     is cleared by topbar-auth after the chrome builds; a failsafe timer clears it if the script
     never runs (offline) so the page can never stay hidden. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shimmer.css">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252}
.spinner{width:44px;height:44px;border:4px solid var(--bd);border-top-color:var(--o);border-radius:50%;animation:spin .9s linear infinite;margin:40px auto}
@keyframes spin{100%{transform:rotate(360deg)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#000;border-radius:5px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.wrap{max-width:1200px;margin:0 auto;padding:36px 24px 80px}
h1{color:#fff;font-size:1.6em;margin-bottom:6px;display:inline-flex;align-items:center;gap:10px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:22px;line-height:1.6}
/* Summary chips + filter — all on ONE line. */
.hr-counts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:20px}
.hr-chip{display:inline-flex;align-items:center;gap:8px;background:#0b0f14;border:1px solid #23303c;border-radius:5px;padding:9px 14px}
.hr-chip .n{color:#fff;font-size:1.05em;font-weight:800;line-height:1}
.hr-chip .l{display:inline-flex;align-items:center;gap:6px;color:var(--tm);font-size:.78em;font-weight:600;white-space:nowrap}
.hr-chip .l svg{opacity:.85;flex-shrink:0}
.hr-chip.total{border-color:var(--rl)}
.hr-chip.total .n{color:var(--rl)}
.hr-chip.total .l svg{color:var(--rl)}
.hr-chip.pet .n{color:#a78bfa}
.hr-chip.pet .l svg{color:#a78bfa}
.hr-chip.nonpet .n{color:#ff9900}
.hr-chip.nonpet .l svg{color:#ff9900}
/* Inline agent filter, sits at the end of the same row. */
.hr-filter{display:inline-flex;align-items:center;gap:6px;background:#0b0f14;border:1px solid var(--bd);border-radius:5px;padding:5px 10px;flex:1;min-width:200px}
.hr-filter-ic{display:inline-flex;color:var(--tm);flex-shrink:0}
.hr-filter input{flex:1;min-width:0;background:transparent;border:none;color:#fff;font-size:.88em;font-family:inherit;padding:4px 2px}
.hr-filter input:focus{outline:none}
/* Date-range sections (top level, collapsible) — each header is an illustrated gradient banner. */
.hr-range{position:relative;border:1px solid #242a31;border-radius:5px;margin-bottom:16px;overflow:hidden;background:linear-gradient(180deg,#15181d,#0f1115);box-shadow:0 12px 30px -22px rgba(0,0,0,.75)}
.hr-range-head{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:0 20px;border:none;text-align:left;cursor:pointer;font:inherit;
  background:linear-gradient(90deg,var(--rc1),var(--rc2) 60%,var(--rc3));background-size:200% 100%;animation:hrBanner 10s ease infinite;transition:filter .12s}
.hr-range-head:hover{filter:brightness(1.04)}
/* Round icon chip on the banner — frosted white so the glyph pops on the bright gradient. */
.hr-range-ic{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.85);color:var(--rc-ink);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.hr-range-ic svg{width:18px;height:18px}
.hr-range-title{position:relative;z-index:1;color:var(--rc-ink);font-weight:800;font-size:1.12em;letter-spacing:-.2px}
/* Meta pill on the right (breaches · agents · pet). */
.hr-range-meta{position:relative;z-index:1;margin-left:auto;color:var(--rc-ink);font-size:.82em;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.72);border-radius:5px;padding:5px 12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.hr-range .hr-caret{position:relative;z-index:1;color:var(--rc-ink);flex-shrink:0;transition:transform .18s}
/* Illustration watermark on the banner (per-range image set below). */
.hr-range-head::after{content:"";position:absolute;top:0;bottom:0;right:210px;width:150px;background-repeat:no-repeat;background-position:center;background-size:auto 90%;opacity:.34;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
/* Per-range gradient + dark-ink color + illustration. */
.hr-range.rng-after{--rc1:#e5484d;--rc2:#ff6b6b;--rc3:#ff9d9d;--rc-ink:#4a0d0f}
.hr-range.rng-after .hr-range-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="40" cy="40" r="22"/><path d="M40 28v13l9 6"/><path d="M78 40a12 12 0 1 1 4 9"/><path d="M78 34v8h8"/></svg>')}
.hr-range.rng-mid{--rc1:#f0a020;--rc2:#ff9f2e;--rc3:#ffcf7a;--rc-ink:#3a2405}
.hr-range.rng-mid .hr-range-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M40 20v6a20 20 0 0 0 8 16 20 20 0 0 1-8 16v6M72 20v6a20 20 0 0 1-8 16 20 20 0 0 0 8 16v6"/><path d="M36 20h40M36 66h40"/></svg>')}
.hr-range.rng-before{--rc1:#7c5cff;--rc2:#a78bfa;--rc3:#cbb8ff;--rc-ink:#241354}
.hr-range.rng-before .hr-range-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="22" width="44" height="42" rx="5"/><path d="M30 34h44M42 16v10M62 16v10"/><path d="M84 34a13 13 0 1 1-4 22"/><path d="M84 30v8h8"/></svg>')}
.hr-range.rng-unknown{--rc1:#4a5560;--rc2:#6b7681;--rc3:#95a1ac;--rc-ink:#161c22}
.hr-range.rng-unknown .hr-range-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="52" cy="40" r="22"/><path d="M45 34a7 7 0 0 1 13 3c0 5-7 5-7 10M51 54h.01"/></svg>')}
@media(max-width:640px){.hr-range-head{min-height:auto;padding:14px 16px;flex-wrap:wrap}.hr-range-meta{margin-left:0}.hr-range-head::after{opacity:.2}}
/* Skeleton shimmer for the collapsed-card loading state. */
.sk-line{display:inline-block;border-radius:5px;background:#141a20;position:relative;overflow:hidden;vertical-align:middle}
/* On the bright gradient range-head banner, shimmer lines need a light base to be visible. */
.hr-range-head .sk-line{background:rgba(255,255,255,.5)}
.sk-line::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:sksh 1.2s infinite}

@keyframes sksh{100%{transform:translateX(100%)}}
.hr-range-body{display:none;padding:0 16px}
.hr-range.open .hr-range-body{display:block;padding:16px}
/* ===== Monthly trend chart ===== */
.hr-chart-legend{display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap;font-size:.82em;font-weight:700;margin-bottom:6px}
.sr-lg{display:inline-flex;align-items:center;gap:6px;color:#aab6c2}
.sr-lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.sr-lg.l1 i{background:#44b9d6}.sr-lg.l2 i{background:#e5484d}
.hr-chart-wrap{position:relative;width:100%;overflow:visible}
.hr-chart-svg{width:100%;height:auto;display:block;overflow:visible}
.hr-chart-svg .grid{stroke:rgba(255,255,255,.07);stroke-width:1}
.hr-chart-svg .axis{stroke:rgba(255,255,255,.18);stroke-width:1}
.hr-chart-svg .axlbl{fill:#8795a3;font-size:11px;font-weight:600}
.hr-chart-svg .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hr-chart-svg .ln.l1{stroke:#44b9d6}.hr-chart-svg .ln.l2{stroke:#e5484d}
.hr-chart-svg .pt{stroke:#0b0f14;stroke-width:2;cursor:pointer}
.hr-chart-svg .pt.l1{fill:#44b9d6}.hr-chart-svg .pt.l2{fill:#e5484d}
.hr-chart-svg .hit{fill:transparent;cursor:pointer}
/* Point value labels: bold, line-coloured, with a white halo so they read over gridlines/lines. */
.hr-chart-svg .ptlbl{font-size:11px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.hr-chart-svg .ptlbl.l1{fill:#1f8fb0}.hr-chart-svg .ptlbl.l2{fill:#d33b40}
.hr-chart-svg .vline{stroke:rgba(255,255,255,.22);stroke-width:1;stroke-dasharray:3 3;visibility:hidden}
.hr-chart-tip{position:absolute;pointer-events:none;z-index:5;min-width:200px;background:#0a0a0a;border:1px solid #2a323b;border-radius:7px;padding:11px 13px;box-shadow:0 14px 34px -16px rgba(0,0,0,.8);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-size:.82em}
.hr-chart-tip.show{opacity:1;transform:translateY(0)}
/* Pinned checkpoint (clicked month): clickable, agent list scrolls, close button in the header. */
/* Wider card. Height is capped in JS to the room left inside the section (which clips overflow);
   the pinned card scrolls inside that cap, the hover preview is short enough not to need it. */
.hr-chart-tip{min-width:340px;max-width:440px;overflow:hidden}
.hr-chart-tip.pinned{pointer-events:auto;overflow-y:auto;box-shadow:0 18px 40px -16px rgba(20,40,70,.45)!important;border-color:#cdd5dd!important}
.hr-chart-tip .tt-m{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hr-chart-tip .tt-x{background:transparent;border:none;color:#8793a0;font-size:1.3em;line-height:1;cursor:pointer;padding:0 2px;border-radius:4px;font-family:inherit}
.hr-chart-tip .tt-x:hover{color:#1b2026;background:#f1f3f6}
.hr-chart-tip .tt-sub{font-size:.78em;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:#8793a0;margin-bottom:4px}
/* Agents in ONE column, highest first. */
.hr-chart-tip .tt-agents{display:flex;flex-direction:column}
.hr-chart-tip .tt-agents .tt-row .k{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
/* The card is clickable only while visible (an invisible card must not block the chart hover). */
.hr-chart-tip.show{pointer-events:auto}
/* "View agents" + "Close" buttons inside the card. */
.hr-chart-tip .tt-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:4px;padding:7px 10px;border-radius:6px;font:inherit;font-size:.95em;font-weight:700;cursor:pointer;transition:background .12s,border-color .12s}
.hr-chart-tip .tt-viewbtn{background:#eaf4fb;border:1px solid #cfe6f5;color:#1577a0}
.hr-chart-tip .tt-viewbtn:hover{background:#dcedf9;border-color:#1577a0}
.hr-chart-tip .tt-closebtn{margin-top:10px;background:#fff;border:1px solid #d4dce4;color:#2a3340}
.hr-chart-tip .tt-closebtn:hover{border-color:#8793a0;color:#1b2026}
.hr-chart-tip .tt-agent{width:100%;background:transparent;border:none;border-radius:5px;font:inherit;text-align:left;cursor:pointer;padding:3px 6px}
.hr-chart-tip .tt-agent .k{color:#1577a0;font-weight:700;text-decoration:underline;text-decoration-color:rgba(21,119,160,.35);text-underline-offset:2px}
.hr-chart-tip .tt-agent:hover,.hr-chart-tip .tt-agent:focus-visible{background:#eef5fb;outline:none}
/* Tickets pop-up (one agent, one month). */
.sla-am-bg{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(20,30,45,.55)}
.sla-am-bg.open{display:flex}
.sla-am{background:#fff;border-radius:10px;width:min(960px,96vw);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 28px 70px -24px rgba(20,30,45,.55)}
.sla-am-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 20px;border-bottom:1px solid #e6eaee}
.sla-am-title{font-size:1.05em;font-weight:800;color:#1b2026}
.sla-am-sub{font-size:.8em;color:#5c6773;margin-top:3px}
.sla-am-x{background:transparent;border:none;color:#8793a0;font-size:1.6em;line-height:1;cursor:pointer;padding:0 4px;border-radius:5px}
.sla-am-x:hover{color:#1b2026;background:#f1f3f6}
.sla-am-body{padding:14px 20px 20px;overflow:auto;min-height:0}
.sla-am-msg{padding:24px;text-align:center;color:#5c6773;font-size:.9em}
.sla-am-msg.err{color:#b02a2a}
.sla-am-scroll{overflow-x:auto}
.sla-am-table{width:100%;border-collapse:collapse;font-size:.84em}
.sla-am-table th{position:sticky;top:0;background:#f7f9fb;color:#5c6773;font-size:.78em;font-weight:800;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:9px 10px;border-bottom:1px solid #e6eaee;white-space:nowrap}
.sla-am-table td{padding:9px 10px;border-bottom:1px solid #eef1f4;color:#1b2026;white-space:nowrap}
.sla-am-table tbody tr:hover td{background:#fbfcfd}
.sla-am-table a{color:#1577a0;font-weight:700;text-decoration:none}
.sla-am-table a:hover{text-decoration:underline}
.sla-am-cc{display:inline-block;padding:1px 8px;border-radius:5px;font-size:.9em;font-weight:800;background:#eef4f8;color:#1577a0;border:1px solid #d6e3ec}
.hr-chart-tip .tt-m{font-weight:800;color:#fff;margin-bottom:7px}
.hr-chart-tip .tt-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:2px 0;color:#c4ccd4}
.hr-chart-tip .tt-row .k{display:inline-flex;align-items:center;gap:6px}
.hr-chart-tip .tt-row .k i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hr-chart-tip .tt-row .v{font-weight:800;color:#fff}
.hr-chart-tip .tt-pct{color:#ff8a8a;font-weight:800}
.hr-chart-tip .tt-sep{height:1px;background:rgba(255,255,255,.08);margin:7px 0}
.hr-chart-sk-legend{display:flex;justify-content:flex-end;gap:14px;margin-bottom:14px}
.hr-chart-sk-plot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;height:240px;padding:0 6px}
.hr-chart-sk-bar{flex:1;border-radius:6px 6px 0 0;align-self:flex-end}
/* ===== Country grouping (section 2) ===== */
.np-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.08)}
.np-controls-lbl{display:inline-flex;align-items:center;gap:8px;font-size:.8em;font-weight:700;letter-spacing:.2px;color:#8795a3}
.np-controls-lbl svg{opacity:.85;flex-shrink:0}
/* Segmented filter: one pill group holding the analyst-type toggles, pushed to the right. */
.np-seg{display:inline-flex;align-items:center;gap:4px;margin-left:auto;padding:4px;border-radius:999px;background:#0b0f14;border:1px solid var(--bd)}
.np-seg-btn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font:inherit;font-size:.82em;font-weight:700;line-height:1;
  padding:8px 15px;border-radius:999px;border:1px solid transparent;background:transparent;color:#8795a3;transition:background .14s,color .14s,border-color .14s}
.np-seg-btn:hover{color:#cdd8e3;background:rgba(255,255,255,.04)}
.np-seg-check{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;flex-shrink:0;
  border:1.5px solid #5a6470;background:transparent;color:transparent;transition:background .14s,border-color .14s,color .14s}
.np-seg-check svg{width:11px;height:11px;stroke-width:3}
.np-seg-btn.on{background:#ec7211;border-color:#ec7211;color:#fff;box-shadow:0 2px 8px -3px rgba(236,114,17,.6)}
.np-seg-btn.on:hover{background:#d9660d;color:#fff}
.np-seg-btn.on .np-seg-check{background:#fff;border-color:#fff;color:#ec7211}
.hr-sub{border:1px solid #2f3a45;border-radius:5px;margin-bottom:10px;overflow:hidden;background:#0b0f14}
.hr-sub:last-child{margin-bottom:0}
.hr-sub-head{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 16px;border:none;cursor:pointer;font:inherit;text-align:left;background:#141a22;color:#e6edf3;transition:background .12s}
.hr-sub-head:hover{background:#17202a}
.hr-sub-ic{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.08);color:#9fb2c4}
.hr-sub-title{font-weight:700;font-size:.95em}
.hr-sub-meta{margin-left:auto;font-size:.78em;font-weight:700;color:#9fb2c4;background:rgba(255,255,255,.06);border-radius:5px;padding:4px 10px;white-space:nowrap}
.hr-sub .hr-caret{color:#9fb2c4;flex-shrink:0;transition:transform .18s}
.hr-sub-body{display:none;padding:0 14px}
.hr-sub.open>.hr-sub-body{display:block;padding:12px 14px}
.hr-sub.open>.hr-sub-head .hr-caret{transform:rotate(180deg)}
.np-tablewrap{overflow-x:auto}
.np-tbl{width:100%;border-collapse:collapse;font-size:.84em;table-layout:fixed}
.np-tbl th,.np-tbl td{text-align:center;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-tbl thead th{color:#8795a3;font-weight:700;text-transform:uppercase;font-size:.82em;letter-spacing:.4px;border-bottom:1px solid rgba(255,255,255,.14)}
.np-tbl tbody tr:last-child td{border-bottom:none}
.np-tbl td.np-c,.np-tbl th.np-c{font-weight:800}
.np-breach{color:#ff6b6b;font-weight:800;white-space:nowrap}
.np-sortable{cursor:pointer;user-select:none;white-space:nowrap}
.np-sortable:hover{color:#fff}
.np-sort-ar{color:#ff9f2e;font-size:.9em;margin-left:3px}
.np-id{color:#44b9d6;font-weight:700;text-decoration:none}
.np-id:hover{text-decoration:underline}
.np-title{color:#aab6c2}
.np-phd{color:#1577a0;background:rgba(68,185,214,.14);border:1px solid rgba(68,185,214,.35);border-radius:4px;font-size:.72em;font-weight:800;padding:1px 5px;margin-left:4px}
.np-sk-wrap{padding:4px 0}
.np-sk-row{display:flex;align-items:center;gap:14px;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.np-sk{height:12px;border-radius:5px;background:#141a20;position:relative;overflow:hidden}
.np-sk.b1{width:12%}.np-sk.b2{width:7%}.np-sk.b3{width:14%}.np-sk.b4{flex:1}.np-sk.b5{width:20%}
.np-sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:npShim 1.3s ease-in-out infinite}
@keyframes npShim{100%{transform:translateX(100%)}}
.hr-range.open>.hr-range-head .hr-caret{transform:rotate(180deg)}
/* Agent accordion */
.hr-agent{border:1px solid #2f3a45;border-radius:5px;margin-bottom:12px;overflow:hidden;background:#0b0f14}
.hr-agent-head{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;background:transparent;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .12s}
.hr-agent-head:hover{background:rgba(255,255,255,.03)}
.hr-agent-name{color:#fff;font-weight:700;font-size:1.1em}
.hr-agent-name .sub{color:var(--tm);font-weight:400;font-size:.85em;margin-left:8px}
/* "PHD" tag for agents whose login is a registered user. */

<style id="sb-loader">
/* ---- Fun phased section loader (ported from agent-analytics.html). Concrete brand colors since
   this page has no --an-* palette vars. Blue #2b66c1, blue-bg #e6f0fc, blue-ic #c4def6,
   orange #ff6100, orange-l #fe9046, ink #151d28. ---- */
.gw-loader{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gw-loader-in{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:680px}
.gw-orb{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.gw-orb::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(#2b66c1,#c4def6,#fe9046,#ff6100,#2b66c1);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  animation:gwSpin 1.1s linear infinite}
.gw-orb-ic{position:relative;width:62px;height:62px;border-radius:50%;background:#e6f0fc;color:#2b66c1;
  display:flex;align-items:center;justify-content:center;animation:gwPulse 1.6s ease-in-out infinite;box-shadow:0 6px 18px -8px rgba(43,102,193,.5)}
.gw-orb-ic svg{width:30px;height:30px}
@keyframes gwSpin{100%{transform:rotate(360deg)}}
@keyframes gwPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.gw-loader-msg{font-size:1.18em;font-weight:800;color:#151d28;line-height:1.4;min-height:1.5em}
.gw-loader-msg.gw-msg-in{animation:gwMsgIn .5s cubic-bezier(.22,1,.36,1)}
@keyframes gwMsgIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.gw-dots{display:flex;gap:7px}
.gw-dots span{width:9px;height:9px;border-radius:50%;background:#ff6100;animation:gwDot 1.2s ease-in-out infinite}
.gw-dots span:nth-child(2){background:#fe9046;animation-delay:.18s}
.gw-dots span:nth-child(3){background:#2b66c1;animation-delay:.36s}
@keyframes gwDot{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
.gw-loader-sub{font-size:.72em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#2b66c1;background:#e6f0fc;border:1px solid #c4def6;border-radius:999px;padding:4px 14px}
.gw-loader.gw-done .gw-orb::before{animation:none;background:#1f9d57}

.gw-loader.gw-done .gw-loader-msg{color:#1f9d57}
.gw-loader.gw-done .gw-dots{visibility:hidden}
@keyframes gwPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

<script>
const A=window.PHDAuth;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gate(msg){document.getElementById('wrap').innerHTML='<div class="gate"><h1>SLA Breaches (&gt;240h)</h1><p>'+msg+'</p><a class="btn" href="app.html">Go to Live Dashboard</a></div>';}
const statusColor=(s)=>({'Resolved':'#4ade80','Closed':'#4ade80','Assigned':'#44b9d6','Work In Progress':'#fbbf24','Pending':'#ff9900','Researching':'#a78bfa'})[s]||'#879596';
function fmtDate(iso){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return '—'; return d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
// Resolution time shown in DAYS (no hours). e.g. 40.2 days.
function fmtHrs(h){ if(h==null||isNaN(h))return '—'; return (h/24).toFixed(1)+' days'; }
// Status tag beside the ticket: C = Closed, R = Resolved, else first letter (fallback O for other).
function statusTag(s){
  const v=String(s||'').toLowerCase();
  if(v==='closed')return '<span class="hr-tag c" title="Closed">C</span>';
  if(v==='resolved')return '<span class="hr-tag r" title="Resolved">R</span>';

}
// Per-agent state: tickets by index; `shown` starts at 20 (+10 each); sortField/sortDir for
// the sortable Created / Resolution-time headers. Default: resolution time, worst breach first.
var HR_AGENTS=[]; var HR_PAGE0=20, HR_STEP=10;
// Sort-arrow indicator for a sortable header — bold, obvious up/down; dimmed double-arrow when idle.
function hrArrow(a,field){
  if(a.sortField!==field) return '<span class="hr-sort-ar idle">\u21c5</span>';

// Build the <tbody> rows + sortable header + the load-more/less footer for agent #idx.
function hrAgentTableHtml(idx){
  const a=HR_AGENTS[idx]; if(!a)return '';

    else { vx=+(x.resHrs||0); vy=+(y.resHrs||0); }

  });
  const total=tix.length;
  const shown=Math.min(a.shown||HR_PAGE0, total);
  const rows=tix.slice(0,shown).map(function(t){
    const sid=t.shortId||'';

      '<td class="hr-fit" style="text-align:center"><a class="hr-id" href="https://t.corp.amazon.com/issues/'+esc(sid)+'" target="_blank" rel="noopener">'+(window.icon?window.icon('ticket',13):'')+' '+esc(sid)+'</a></td>'+
      '<td style="white-space:nowrap;text-align:center">'+fmtDate(t.createDate)+'</td>'+

      '<td class="hr-rc"><span class="hr-rc-wrap">'+statusTag(t.status)+'<span class="hr-rc-txt" title="'+esc(t.rootCause||'Unknown')+'">'+esc(t.rootCause||'Unknown')+'</span></span></td>'+
    '</tr>';
  }).join('');

      '<th class="hr-sort" onclick="hrSort('+idx+',\'res\')" title="Sort by Resolution time" style="text-align:center;cursor:pointer">Resolution time'+hrArrow(a,'res')+'</th>'+
      '<th>Root cause</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'+footer;
}
// Re-render one agent's table body in place (after a show more/less/sort click).
function hrRenderAgent(idx){ const el=document.getElementById('hrAgentBody'+idx); if(el)el.innerHTML=hrAgentTableHtml(idx); }
function hrShowMore(idx){ const a=HR_AGENTS[idx]; if(!a)return; a.shown=(a.shown||HR_PAGE0)+HR_STEP; hrRenderAgent(idx); }

function hrSort(idx,field){

window.hrShowMore=hrShowMore; window.hrShowLess=hrShowLess; window.hrSort=hrSort;

function ic(n,s){return window.icon?window.icon(n,s||14):'';}
// Summary chips + the agent filter, all on ONE line. `key` wires the filter to this range's list.

// Registered PHD users (lowercase usernames) fetched from /api/user-roles. An agent whose login

function isPhdUser(name){ return !!(HR_USERS && HR_USERS.has(String(name||'').trim().toLowerCase())); }

function agentBlock(a){

        '<span class="hr-agent-count">'+a.count+'</span></span>'+
      '<span class="hr-caret" aria-hidden="true">\u25be</span>'+
    '</button>'+
    '<div class="hr-agent-body"><div id="hrAgentBody'+idx+'">'+hrAgentTableHtml(idx)+'</div></div>'+

// Per-range header icon.
const RANGE_ICON={after:'clock',mid:'clock-rewind',before:'calendar',unknown:'alert'};
// One date-range section: collapsible (closed by default), colorful border + icon, summary + agents.
function rangeSection(key,label,d){
  const agents=d.agents||[];
  const inner=agents.length?agents.map(function(a){return agentBlock(a,key);}).join(''):'<div class="empty">No SLA breaches in this range.</div>';

      '<span class="hr-caret" aria-hidden="true">\u25be</span>'+
    '</button>'+
    '<div class="hr-range-body">'+
      counts(d,key)+

function esc2(s){return esc(s);}
function truncate(s,n){ s=String(s||''); return s.length>n?(s.slice(0,n-1)+'\u2026'):s; }
function fmtCreated(iso){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return esc(String(iso)); return d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'}); }
function displayAgent(name){ return name||'—'; }
var SLA_COUNTRY_NAME={US:'United States',UK:'United Kingdom',CA:'Canada',IN:'India',AU:'Australia',MX:'Mexico',JP:'Japan',DE:'Germany',IT:'Italy',FR:'France',EG:'Egypt',ES:'Spain',SA:'Saudi Arabia',BR:'Brazil',NL:'Netherlands',ZA:'South Africa',PT:'Portugal',UAE:'United Arab Emirates',IE:'Ireland',SG:'Singapore',TR:'Turkey',PL:'Poland',SE:'Sweden',BE:'Belgium',AT:'Austria',CH:'Switzerland',DK:'Denmark',NO:'Norway',FI:'Finland',GR:'Greece',CZ:'Czechia'};

// ================= Fun phased loader (ported from agent-analytics.html) =================
// Loader markup for a section body: a hidden orb+message loader keyed by the id-prefix `pfx`.
function ldHtml(pfx){
  return '<div id="'+pfx+'Loader" class="gw-loader" style="display:none">'+
    '<div class="gw-loader-in">'+
      '<div class="gw-orb"><span class="gw-orb-ic" id="'+pfx+'LoaderIc">'+ic('clock',30)+'</span></div>'+
      '<div class="gw-loader-msg gw-msg-in" id="'+pfx+'LoaderMsg">Getting things ready\u2026</div>'+
      '<div class="gw-dots"><span></span><span></span><span></span></div>'+
      '<div class="gw-loader-sub" id="'+pfx+'LoaderSub">Loading</div>'+

}
function gwFirstName(){ try{ var u=A.getUser&&A.getUser(); var n=(u&&(u.username||u.displayName||u.name))||''; return String(n).split(/[@\s]/)[0]||'there'; }catch(e){ return 'there'; } }
function gwShuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
// PHASE 1 — 20 randomized, SLA-themed, general lines (no agent names). Personalized with first name.
function slaPhase1(what){
  var me=gwFirstName();
  var lines=[
    ['clock',       'Pulling the '+what+' for you, '+me+' \u2728'],
    ['target',      'Scanning tickets that crossed the 240-hour SLA\u2026'],
    ['bar-chart',   'Measuring how long each breach ran past SLA\u2026'],
    ['inbox',       'Collecting breached tickets across the team\u2026'],
    ['calendar',    'Walking month by month through 2026\u2026'],
    ['check-circle','Separating resolved from still-open breaches\u2026'],
    ['globe',       'Grouping breaches by country\u2026'],
    ['repeat',      'Reviewing repeat incidents and pet cases\u2026'],
    ['user',        'Tallying per-analyst breach counts\u2026'],
    ['bolt',        'Crunching created-vs-crossed totals\u2026'],
    ['clock',       'Computing average time past SLA\u2026'],
    ['target',      'Double-checking the 240-hour threshold\u2026'],
    ['bar-chart',   'Sorting the worst breaches to the top\u2026'],

    ['users',       'Rolling up PHD vs non-PHD analysts\u2026'],

  return gwShuffle(lines);
}
// PHASE 2 — after the apology, 10 general lines at 3s each (loops). No agent names.
function slaPhase2(what){
  var me=gwFirstName();
  var lines=[
    ['clock',       'Still working on it \u2014 thanks for your patience, '+me+'\u2026'],
    ['inbox',       'The server is taking a little longer than usual\u2026'],
    ['bar-chart',   'Re-checking the breach figures to be sure\u2026'],
    ['target',      'Hang tight \u2014 re-verifying the SLA window\u2026'],
    ['globe',       'Reconciling the country groupings\u2026'],
    ['bolt',        'Nearly ready \u2014 finalising the totals\u2026'],
    ['repeat',      'One more pass over repeat incidents\u2026'],
    ['check-circle','Polishing the last few numbers\u2026'],
    ['calendar',    'Tidying up the monthly view\u2026'],

var _ldMsgTimers={}, _ldWhat={};   // pfx -> interval id / window-words
function _ldSetMsg(pfx,tuple){
  var e=document.getElementById(pfx+'LoaderMsg'), i=document.getElementById(pfx+'LoaderIc');
  if(i){ i.innerHTML=ic(tuple[0]||'clock',30); }
  if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent=tuple[1]; e.classList.add('gw-msg-in'); }
}
function _ldStop(pfx){ if(_ldMsgTimers[pfx]){ clearInterval(_ldMsgTimers[pfx]); _ldMsgTimers[pfx]=null; } }
// Phase 1 (20 lines @2s) -> apology -> Phase 2 (10 lines @3s, loops). Never blank.
function _ldStart(pfx,subLabel){
  _ldStop(pfx);
  var sub=document.getElementById(pfx+'LoaderSub'); if(sub&&subLabel) sub.textContent=subLabel;
  var what=_ldWhat[pfx]||'data';
  var p1=slaPhase1(what), i=0; _ldSetMsg(pfx,p1[0]);
  _ldMsgTimers[pfx]=setInterval(function(){
    i++;
    if(i<p1.length){ _ldSetMsg(pfx,p1[i]); return; }
    _ldStop(pfx);
    _ldSetMsg(pfx,['alert','Sorry for the delay \u2014 still fetching your data\u2026']);
    setTimeout(function(){
      var p2=slaPhase2(what), j=0; _ldSetMsg(pfx,p2[0]);
      _ldMsgTimers[pfx]=setInterval(function(){ j=(j+1)%p2.length; _ldSetMsg(pfx,p2[j]); },3000);
    },3000);
  },2000);
}
function _ldShow(pfx,on,subLabel){
  var l=document.getElementById(pfx+'Loader'), c=document.getElementById(pfx+'Content');
  if(l){ l.style.display=on?'flex':'none'; if(on) l.classList.remove('gw-done'); }
  if(c) c.style.display=on?'none':'';
  if(on) _ldStart(pfx,subLabel); else _ldStop(pfx);
}
function _ldSuccess(pfx){
  _ldStop(pfx);
  var l=document.getElementById(pfx+'Loader'); if(l) l.classList.add('gw-done');
  var i=document.getElementById(pfx+'LoaderIc'); if(i) i.innerHTML=ic('check-circle',30);
  var e=document.getElementById(pfx+'LoaderMsg'); if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent='Data fetched successfully'; e.classList.add('gw-msg-in'); }
}
var _delay=function(ms){ return new Promise(function(res){ setTimeout(res,ms); }); };

// ---- Lazy-load orchestration: fetch each section's data the FIRST time it is expanded. ----
var SLA_CHART_STATE='idle', SLA_COUNTRY_STATE='idle';   // idle | loading | done
async function slaLoadChart(){
  if(SLA_CHART_STATE!=='idle') return; SLA_CHART_STATE='loading';
  _ldWhat['slc']='monthly trend';
  _ldShow('slc',true,'Monthly trend · 2026');
  var minDelay=_delay(4000);
  try{
    var mr=await A.api('GET','/api/sla-monthly');
    if(mr&&mr.ok&&mr.data&&Array.isArray(mr.data.months)) SLA_MONTHLY=mr.data;
  }catch(e){}
  await minDelay;
  _ldSuccess('slc'); await _delay(1000);
  _ldShow('slc',false);
  var b=document.getElementById('slaChartBody'); if(b){ b.innerHTML=slaChartInnerHtml(); }
  if(SLA_MONTHLY) drawSlaChart(SLA_MONTHLY);
  SLA_CHART_STATE='done';
}
async function slaLoadCountry(){
  if(SLA_COUNTRY_STATE!=='idle') return; SLA_COUNTRY_STATE='loading';
  _ldWhat['slb']='SLA breaches by country';
  _ldShow('slb',true,'SLA breaches · YTD 2026');
  var minDelay=_delay(4000);
  try{
    var fr=await A.api('GET','/api/sla-flat');
    if(fr&&fr.ok&&fr.data&&Array.isArray(fr.data.tickets)) SLA_FLAT=fr.data;
  }catch(e){}
  await minDelay;
  _ldSuccess('slb'); await _delay(1000);

  SLA_COUNTRY_STATE='done';
}
function slaSubToggle(btn){

window.slaSubToggle=slaSubToggle;
function slaSubToggle(btn){

  var scope=s.parentNode||document;
  Array.prototype.forEach.call(scope.children, function(o){ if(o!==s && o.classList && o.classList.contains('hr-sub')) o.classList.remove('open'); });
  s.classList.toggle('open', willOpen);

window.slaSubToggle=slaSubToggle;

// ================= SECTION 1: monthly trend chart (created vs SLA crossed) =================
var SLA_MONTHLY=null;
var SLA_MONTH_LBL=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Roll the monthly series up into headline numbers for the stat strip.
function slaChartStats(){
  var months=(SLA_MONTHLY&&SLA_MONTHLY.months)||[];
  var created=0, crossed=0, worst={lbl:'—',pct:0,n:0};
  months.forEach(function(m,i){
    var c=m.created||0, x=m.slaCrossed||0; created+=c; crossed+=x;
    var p=(c>0)?(x/c*100):0; if(p>worst.pct){ worst={lbl:SLA_MONTH_LBL[i]||('M'+(i+1)),pct:p,n:x}; }
  });
  var rate=(created>0)?(crossed/created*100):0;
  var activeMonths=months.filter(function(m){return (m.created||0)>0;}).length||1;
  return { created:created, crossed:crossed, rate:rate, worstLbl:worst.lbl, worstPct:worst.pct, avg:Math.round(crossed/activeMonths) };
}
function slaStatsHtml(){
  var s=slaChartStats();
  var fmt=function(n){ return (n||0).toLocaleString('en-US'); };
  function tile(ic0,cls,val,lbl){ return '<div class="sla-stat '+(cls||'')+'">'+
    '<span class="sla-stat-ic">'+ic(ic0,16)+'</span>'+
    '<span class="sla-stat-body"><span class="sla-stat-n">'+val+'</span><span class="sla-stat-l">'+lbl+'</span></span></div>'; }
  return '<div class="sla-stats">'+
    tile('inbox','',fmt(s.created),'Tickets created')+
    tile('target','breach',fmt(s.crossed),'SLA crossed')+
    tile('bar-chart','rate',s.rate.toFixed(1)+'%','Breach rate')+
    tile('calendar','',s.avg?fmt(s.avg):'—','Avg crossed / mo')+
    tile('alert','worst',s.worstLbl,'Worst month ('+s.worstPct.toFixed(0)+'%)')+
  '</div>';
}
function slaChartInnerHtml(){
  if(!SLA_MONTHLY){
    var hs=[55,40,70,50,85,60,78,45,66,52,38,72], bars='';
    for(var i=0;i<12;i++) bars+='<span class="sk-line hr-chart-sk-bar" style="height:'+hs[i]+'%"></span>';
    return '<div class="hr-chart-sk"><div class="hr-chart-sk-legend"><span class="sk-line" style="width:140px;height:12px"></span><span class="sk-line" style="width:150px;height:12px"></span></div><div class="hr-chart-sk-plot">'+bars+'</div></div>';
  }
  // One chart panel: a header line INSIDE the graph area — the 5 headline stats as compact chips on
  // the LEFT, the Created / SLA crossed legend on the RIGHT — with the line chart underneath.
  return '<div class="sla-chart-row">'+
    '<div class="sla-chart-col">'+
      '<div class="sla-chart-top">'+
        slaStatsHtml()+
        '<div class="hr-chart-legend">'+
          '<span class="sr-lg l1"><i></i>Created</span>'+
          '<span class="sr-lg l2"><i></i>SLA crossed</span>'+
        '</div>'+
      '</div>'+
      '<div class="hr-chart-wrap" id="slaChartWrap">'+
        '<svg class="hr-chart-svg" id="slaChartSvg" viewBox="0 0 920 320" preserveAspectRatio="xMidYMid meet"></svg>'+
        '<div class="hr-chart-tip" id="slaChartTip"></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}
function slaChartSectionHtml(){
  return '<div class="hr-range rng-chart open" data-range="chart">'+
    '<button type="button" class="hr-range-head" onclick="hrRangeToggle(this)">'+
      '<span class="hr-range-ic">'+ic('line-chart',18)+'</span>'+
      '<span class="hr-range-title">Tickets created vs SLA crossed · 2026</span>'+
      '<span class="hr-caret" aria-hidden="true">\u25be</span>'+
    '</button>'+
    '<div class="hr-range-body">'+ldHtml('slc')+'<div id="slcContent" style="display:none"><div id="slaChartBody">'+slaChartInnerHtml()+'</div></div></div>'+
  '</div>';
}
function slaNiceCeil(v){ if(v<=5)return 5; var e=Math.floor(Math.log10(v)),b=Math.pow(10,e),f=v/b; var nf=f<=1?1:f<=2?2:f<=5?5:10; return nf*b; }
// Index of the last month that actually has data (so the lines stop there instead of dropping to
// zero across empty future months). Returns a count for slice() — defaults to full length.
function slaLastMonth(months){
  var last=0;
  for(var i=0;i<months.length;i++){ var m=months[i]||{}; if((m.created||0)>0||(m.slaCrossed||0)>0) last=i+1; }
  return last||months.length;
}
function drawSlaChart(data){
  var svg=document.getElementById('slaChartSvg'); if(!svg)return;
  var months=(data&&data.months)||[];
  // Only draw lines/points/hover through the last month with data; keep all 12 x-axis labels.
  var draw=months.slice(0, slaLastMonth(months));
  // Size the drawing to the box it actually gets. A fixed 920x320 viewBox capped at 300px tall got
  // shrunk to fit (with blank space either side) whenever the box was wider than ~3:1. Instead keep
  // H=320 units for ~300px of height and widen W to match the box's real aspect, so the plot fills
  // the full width while text keeps the same on-screen size.
  var wrapEl=document.getElementById('slaChartWrap');
  var boxW=(wrapEl&&wrapEl.clientWidth)||920, TARGET_PX_H=300;
  var H=320, W=Math.max(600, Math.round(H*boxW/TARGET_PX_H));
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var padL=46,padR=20,padT=18,padB=36, plotW=W-padL-padR, plotH=H-padT-padB;
  var maxV=0; draw.forEach(function(m){ maxV=Math.max(maxV,m.created,m.slaCrossed); });
  var niceMax=slaNiceCeil(Math.max(maxV,1));
  var xAt=function(i){ return padL+(plotW*(i/11)); };
  var yAt=function(v){ return padT+plotH-(plotH*(v/niceMax)); };
  var g='';
  for(var b=0;b<=5;b++){ var v=Math.round(niceMax*b/5), y=yAt(v);
    g+='<line class="grid" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>';
    g+='<text class="axlbl" x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>'; }
  for(var i=0;i<12;i++){ g+='<text class="axlbl" x="'+xAt(i)+'" y="'+(H-padB+20)+'" text-anchor="middle">'+SLA_MONTH_LBL[i]+'</text>'; }
  g+='<line class="axis" x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'"/>';
  var pts=function(getter){ return draw.map(function(m,i){ return xAt(i)+','+yAt(getter(m)); }).join(' '); };
  g+='<polyline class="ln l1" points="'+pts(function(m){return m.created;})+'"/>';
  g+='<polyline class="ln l2" points="'+pts(function(m){return m.slaCrossed;})+'"/>';
  g+='<line class="vline" id="slaVLine" y1="'+padT+'" y2="'+(padT+plotH)+'"/>';
  draw.forEach(function(m,i){
    g+='<circle class="pt l1" cx="'+xAt(i)+'" cy="'+yAt(m.created)+'" r="4"/>';
    g+='<circle class="pt l2" cx="'+xAt(i)+'" cy="'+yAt(m.slaCrossed)+'" r="4"/>';
  });
  // Value labels on every point. Created sits ABOVE its point. SLA crossed also goes above unless the
  // Created point is close overhead (labels would collide) — then it drops BELOW. Each label flips
  // to the other side if it would leave the plot (top edge / x-axis + month labels).
  var axisY=padT+plotH, ABOVE=-10, BELOW=17, MIN_GAP=24;
  var fitY=function(py,off){
    var y=py+off;
    if(y<padT+4) y=py+BELOW;              // too close to the top -> below
    if(y>axisY-4) y=py+ABOVE;             // would hit the x-axis -> above
    return y;
  };
  var num=function(v){ return Number(v||0).toLocaleString('en-US'); };
  draw.forEach(function(m,i){
    var x=xAt(i), yc=yAt(m.created), ys=yAt(m.slaCrossed);
    var close=(ys-yc)<MIN_GAP;            // created is (nearly) on top of SLA crossed
    g+='<text class="ptlbl l1" x="'+x+'" y="'+fitY(yc,ABOVE)+'" text-anchor="middle">'+num(m.created)+'</text>';
    g+='<text class="ptlbl l2" x="'+x+'" y="'+fitY(ys,close?BELOW:ABOVE)+'" text-anchor="middle">'+num(m.slaCrossed)+'</text>';
  });
  var colW=plotW/11;
  draw.forEach(function(m,i){ g+='<rect class="hit" data-i="'+i+'" x="'+(xAt(i)-colW/2)+'" y="'+padT+'" width="'+colW+'" height="'+plotH+'"/>'; });
  svg.innerHTML=g;
  var tip=document.getElementById('slaChartTip'), vline=document.getElementById('slaVLine'), wrap=document.getElementById('slaChartWrap');
  // Show month i's checkpoint. pinned=true -> the tooltip stays put and becomes clickable (full agent
  // list, names open the tickets pop-up); pinned=false -> the normal hover preview.
  var showMonth=function(i,pinned){
    var m=months[i]; if(!m) return;
    tip.innerHTML=slaTipHtml(m,i,pinned);
    tip.classList.toggle('pinned',!!pinned);
    tip.scrollTop=0;
    var cx=xAt(i); vline.setAttribute('x1',cx); vline.setAttribute('x2',cx); vline.style.visibility='visible';
    var box=svg.getBoundingClientRect(), px=(cx/W)*box.width; tip.classList.add('show');
    var tw=tip.offsetWidth||340; var left=px+14; if(left+tw>box.width)left=px-tw-14; if(left<0)left=4;
    tip.style.left=left+'px'; tip.style.top='8px';
    // The section card clips overflow, so cap the card to the room left below its top edge (the
    // pinned card scrolls inside the cap; the short hover preview normally fits).
    var sec=wrap.closest('.hr-range');
    if(sec){
      var room=sec.getBoundingClientRect().bottom - wrap.getBoundingClientRect().top - 8 - 12;
      tip.style.maxHeight=Math.max(160, Math.floor(room))+'px';
    }
  };
  svg.querySelectorAll('.hit').forEach(function(rect){
    var i=+rect.getAttribute('data-i');
    rect.addEventListener('mouseenter', function(){ if(SLA_TIP_PIN==null) showMonth(i,false); });
    // Click a month to pin its checkpoint (click the same month again to unpin).
    rect.addEventListener('click', function(ev){
      ev.stopPropagation();
      if(SLA_TIP_PIN===i){ slaUnpinTip(); return; }
      SLA_TIP_PIN=i; showMonth(i,true);
    });
  });
  SLA_SHOW_MONTH=showMonth;
  // Re-drawn while pinned (window resize) -> keep the same month pinned.
  if(SLA_TIP_PIN!=null && months[SLA_TIP_PIN]) showMonth(SLA_TIP_PIN,true); else SLA_TIP_PIN=null;
  if(!wrap._slaLeave){   // bind once per wrap (drawSlaChart re-runs on resize)
    wrap._slaLeave=true;
    wrap.addEventListener('mouseleave', function(){
      if(SLA_TIP_PIN!=null) return;   // a pinned checkpoint stays open
      var t=document.getElementById('slaChartTip'), v=document.getElementById('slaVLine'); if(t)t.classList.remove('show'); if(v)v.style.visibility='hidden';
    });
    // Clicks inside the card: "View agents" -> pin with the list; agent name -> tickets pop-up;
    // × / Close -> unpin. Uses SLA_SHOW_MONTH (re-assigned on every draw) so it never holds the
    // stale geometry of an earlier draw.
    tip.addEventListener('click', function(ev){
      ev.stopPropagation();
      var v=ev.target.closest('[data-sla-view]');
      if(v){ var vi=+v.getAttribute('data-sla-view'); SLA_TIP_PIN=vi; if(SLA_SHOW_MONTH) SLA_SHOW_MONTH(vi,true); return; }
      var a=ev.target.closest('[data-sla-agent]');
      if(a){ slaOpenAgentTickets(+a.getAttribute('data-mi'), a.getAttribute('data-sla-agent')); return; }
      if(ev.target.closest('.tt-x')||ev.target.closest('.tt-closebtn')) slaUnpinTip();
    });
  }
}
// ---- Monthly chart: pinned checkpoint + "who was assigned" breakdown ----
var SLA_TIP_PIN=null;     // index of the pinned month, or null
var SLA_SHOW_MONTH=null;  // showMonth() from the latest draw (current geometry)
function slaAgentName(a){ return a?a:'(Unassigned)'; }
function slaTipHtml(m,i,pinned){
  var pct=(m.created>0)?(Math.round((m.slaCrossed/m.created)*1000)/10):0;
  var agents=m.agents||[];
  var h='<div class="tt-m">'+SLA_MONTH_LBL[i]+' 2026'+(pinned?'<button type="button" class="tt-x" aria-label="Close">\u00d7</button>':'')+'</div>'+
    '<div class="tt-row"><span class="k"><i style="background:#44b9d6"></i>Created</span><span class="v">'+(m.created||0)+'</span></div>'+
    '<div class="tt-row"><span class="k"><i style="background:#e5484d"></i>SLA crossed</span><span class="v">'+(m.slaCrossed||0)+' <b class="tt-pct">('+pct+'%)</b></span></div>'+
    '<div class="tt-sep"></div>'+
    '<div class="tt-row"><span class="k">Repeat</span><span class="v">'+(m.repeat||0)+'</span></div>'+
    '<div class="tt-row"><span class="k">Pet</span><span class="v">'+(m.pet||0)+'</span></div>'+
    '<div class="tt-row"><span class="k">Non-pet</span><span class="v">'+(m.nonPet||0)+'</span></div>';
  if(!agents.length) return h;
  // Hover card: just a "View agents" button — the list opens in the pinned card.
  if(!pinned){
    h+='<div class="tt-sep"></div><button type="button" class="tt-btn tt-viewbtn" data-sla-view="'+i+'">'+
      ic('users',13)+' View agents ('+agents.length+')</button>';
    return h;
  }
  // Pinned card: every assignee in ONE column, highest first; names open the tickets pop-up.
  h+='<div class="tt-sep"></div><div class="tt-sub">SLA crossed by assignee</div><div class="tt-agents">';
  agents.forEach(function(a){
    var nm=esc(slaAgentName(a.assignee));
    h+='<button type="button" class="tt-row tt-agent" data-mi="'+i+'" data-sla-agent="'+esc(a.assignee)+'" title="View '+nm+'\u2019s tickets"><span class="k">'+nm+'</span><span class="v">'+a.n+'</span></button>';
  });
  h+='</div><button type="button" class="tt-btn tt-closebtn">Close</button>';
  return h;
}
function slaUnpinTip(){
  SLA_TIP_PIN=null;
  var t=document.getElementById('slaChartTip'), v=document.getElementById('slaVLine');
  if(t){ t.classList.remove('show','pinned'); } if(v) v.style.visibility='hidden';
}
// Click anywhere outside the chart / Esc closes a pinned checkpoint (the pop-up handles Esc first).
document.addEventListener('click', function(ev){
  if(SLA_TIP_PIN==null) return;
  if(ev.target.closest('#slaChartWrap')||ev.target.closest('#slaAgentModal')) return;
  slaUnpinTip();
});
document.addEventListener('keydown', function(ev){
  if(ev.key!=='Escape') return;
  var md=document.getElementById('slaAgentModal');
  if(md && md.classList.contains('open')){ slaCloseAgentModal(); return; }
  if(SLA_TIP_PIN!=null) slaUnpinTip();
});
// ---- Tickets pop-up for one agent in one month ----
function slaEnsureAgentModal(){
  var md=document.getElementById('slaAgentModal'); if(md) return md;
  md=document.createElement('div'); md.id='slaAgentModal'; md.className='sla-am-bg';
  md.innerHTML='<div class="sla-am" role="dialog" aria-modal="true" aria-labelledby="slaAmTitle">'+
    '<div class="sla-am-head"><div><div class="sla-am-title" id="slaAmTitle"></div><div class="sla-am-sub" id="slaAmSub"></div></div>'+
    '<button type="button" class="sla-am-x" aria-label="Close" onclick="slaCloseAgentModal()">\u00d7</button></div>'+
    '<div class="sla-am-body" id="slaAmBody"></div></div>';
  md.addEventListener('click', function(ev){ if(ev.target===md) slaCloseAgentModal(); });
  document.body.appendChild(md);
  return md;
}
function slaCloseAgentModal(){ var md=document.getElementById('slaAgentModal'); if(md) md.classList.remove('open'); }
window.slaCloseAgentModal=slaCloseAgentModal;
var SLA_AM_SEQ=0;
async function slaOpenAgentTickets(mi, assignee){
  var md=slaEnsureAgentModal(), seq=++SLA_AM_SEQ;
  var mLbl=(SLA_MONTH_LBL[mi]||'')+' 2026';
  document.getElementById('slaAmTitle').textContent=slaAgentName(assignee);
  document.getElementById('slaAmSub').textContent='SLA crossed (>240h) \u00b7 tickets created in '+mLbl;
  var body=document.getElementById('slaAmBody');
  body.innerHTML='<div class="sla-am-msg">Loading tickets\u2026</div>';
  md.classList.add('open');
  var x=md.querySelector('.sla-am-x'); if(x) x.focus();
  var r=null;
  try{ r=await A.api('GET','/api/sla-monthly-tickets?month='+(mi+1)+'&assignee='+encodeURIComponent(assignee||'')); }catch(e){}
  if(seq!==SLA_AM_SEQ) return;   // a newer click superseded this one
  if(!(r&&r.ok&&r.data&&Array.isArray(r.data.tickets))){ body.innerHTML='<div class="sla-am-msg err">Could not load the tickets'+(r&&r.status?(' (HTTP '+r.status+')'):'')+'.</div>'; return; }
  var t=r.data.tickets;
  document.getElementById('slaAmSub').textContent=t.length+' ticket'+(t.length===1?'':'s')+' \u00b7 SLA crossed (>240h) \u00b7 created in '+mLbl;
  if(!t.length){ body.innerHTML='<div class="sla-am-msg">No tickets found.</div>'; return; }
  body.innerHTML='<div class="sla-am-scroll"><table class="sla-am-table"><thead><tr>'+
      '<th>Ticket ID</th><th>Country</th><th>Created</th><th>Resolved</th><th>AssigneeIdentity</th><th>ResolvedByIdentity</th>'+
    '</tr></thead><tbody>'+t.map(function(k){
      return '<tr><td>'+(k.url?'<a href="'+esc(k.url)+'" target="_blank" rel="noopener">'+esc(k.shortId)+'</a>':esc(k.shortId))+'</td>'+
        '<td><span class="sla-am-cc">'+esc(k.country||'Unknown')+'</span></td>'+
        '<td>'+fmtDate(k.createDate)+'</td><td>'+fmtDate(k.resolvedDate)+'</td>'+
        '<td>'+esc(slaAgentName(k.assignee))+'</td><td>'+esc(k.resolvedBy||'\u2014')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
// Redraw on resize so the chart keeps filling its box at the new width (debounced).
(function(){
  var tmr=null;
  window.addEventListener('resize', function(){
    clearTimeout(tmr);
    tmr=setTimeout(function(){ if(SLA_MONTHLY && document.getElementById('slaChartSvg')) drawSlaChart(SLA_MONTHLY); }, 150);

// ================= SECTION 2: SLA breaches by country =================
var SLA_FLAT=null, SLA_PHD=true, SLA_NONPHD=true;
var SLA_SORT_DIR='desc'; // SLA-breach-days column sort: desc (default, worst breach first) | asc
function slaFiltered(tickets){ return (tickets||[]).filter(function(t){ var p=isPhdUser(t.resolvedBy); return (p&&SLA_PHD)||(!p&&SLA_NONPHD); }); }
// Segmented filter toggle: flip this analyst-type on/off, update the button's pressed state, and
// re-render. Guard against turning BOTH off (keep at least one selected so the table isn't empty).
function slaToggleKind(which, btn){
  var next=(which==='phd')?!SLA_PHD:!SLA_NONPHD;
  if(!next && ((which==='phd' && !SLA_NONPHD) || (which==='nonphd' && !SLA_PHD))) return; // don't allow both off
  if(which==='phd')SLA_PHD=next; else SLA_NONPHD=next;
  if(btn){ btn.classList.toggle('on', next); btn.setAttribute('aria-pressed', next?'true':'false'); }
  renderSlaCountryView();
}
window.slaToggleKind=slaToggleKind;
// Toggle the SLA-breach-days sort direction and re-render all country tables.
function slaSortBreach(){ SLA_SORT_DIR=(SLA_SORT_DIR==='desc'?'asc':'desc'); renderSlaCountryView(); }
window.slaSortBreach=slaSortBreach;
// A country's ticket table. Columns: Ticket | SLA Breach (days, sortable) | Title | Assignee |
// Resolved By | HI | Resolution. Sorted by breach days (default highest -> lowest).
function slaTable(list){
  var dir=SLA_SORT_DIR;
  var sorted=list.slice().sort(function(a,b){
    var va=(a.breachDays==null?-1:a.breachDays), vb=(b.breachDays==null?-1:b.breachDays);
    return dir==='desc'?(vb-va):(va-vb);
  });
  var rows=sorted.map(function(t){
    var link=t.url?('<a class="np-id" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.shortId)+'</a>'):esc(t.shortId);
    var by=esc(displayAgent(t.resolvedBy))+(isPhdUser(t.resolvedBy)?' <span class="np-phd">PHD</span>':'');
    var bd=(t.breachDays==null?'—':(t.breachDays+'d'));
    return '<tr>'+
      '<td>'+link+'</td>'+
      '<td class="np-c np-breach">'+bd+'</td>'+
      '<td class="np-title" title="'+esc(t.title)+'">'+esc(t.title)+'</td>'+
      '<td title="'+esc(t.assignee)+'">'+esc(displayAgent(t.assignee))+'</td>'+
      '<td>'+by+'</td>'+
      '<td class="np-c">'+t.hi+'</td>'+
      '<td class="np-title" title="'+esc(t.resolution)+'">'+esc(t.resolution)+'</td>'+
    '</tr>';
  }).join('');
  var arrow=(dir==='desc'?'\u25bc':'\u25b2');
  return '<div class="np-tablewrap"><table class="np-tbl">'+
    '<colgroup><col style="width:11%"><col style="width:12%"><col style="width:25%"><col style="width:13%"><col style="width:13%"><col style="width:5%"><col style="width:21%"></colgroup>'+
    '<thead><tr><th>Ticket</th>'+
      '<th class="np-c np-sortable" onclick="slaSortBreach()" title="Sort by SLA breach length">SLA Breach <span class="np-sort-ar">'+arrow+'</span></th>'+
      '<th>Title</th><th>Assignee</th><th>Resolved By</th><th class="np-c">HI</th><th>Resolution</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}
function slaCountrySectionHtml(){
  var checks=
    '<div class="np-controls">'+
      '<div class="np-controls-lbl">'+ic('filter',15)+'<span>Filter by analyst</span></div>'+
      '<div class="np-seg" role="group" aria-label="Filter by analyst type">'+
        '<button type="button" class="np-seg-btn on" data-kind="phd" aria-pressed="true" onclick="slaToggleKind(\'phd\',this)">'+
          '<span class="np-seg-check">'+ic('check',13)+'</span><span class="np-seg-txt">PHD Analysts</span>'+
        '</button>'+
        '<button type="button" class="np-seg-btn on" data-kind="nonphd" aria-pressed="true" onclick="slaToggleKind(\'nonphd\',this)">'+
          '<span class="np-seg-check">'+ic('check',13)+'</span><span class="np-seg-txt">Non-PHD Analysts</span>'+
        '</button>'+
      '</div>'+
    '</div>';
  return '<div class="hr-range rng-country" data-range="country">'+
    '<button type="button" class="hr-range-head" onclick="hrRangeToggle(this)">'+
      '<span class="hr-range-ic">'+ic('globe',18)+'</span>'+
      '<span class="hr-range-title">SLA Breaches by Country</span>'+
      '<span class="hr-caret" aria-hidden="true">\u25be</span>'+
    '</button>'+
    '<div class="hr-range-body">'+ldHtml('slb')+'<div id="slbContent" style="display:none">'+checks+'<div id="slaCountryBody"></div></div></div>'+
  '</div>';
}
function renderSlaCountryView(){
  var box=document.getElementById('slaCountryBody'); if(!box) return;
  if(!SLA_FLAT){ box.innerHTML='<div class="np-sk-wrap">'+Array(6).join('<div class="np-sk-row"><span class="np-sk b1"></span><span class="np-sk b2"></span><span class="np-sk b3"></span><span class="np-sk b4"></span><span class="np-sk b5"></span></div>')+'</div>'; return; }
  var tickets=slaFiltered(SLA_FLAT.tickets||[]);
  if(!tickets.length){ box.innerHTML='<div class="empty">No SLA breaches for the selected analyst type.</div>'; return; }
  var byCountry={}; tickets.forEach(function(t){ (byCountry[t.country]=byCountry[t.country]||[]).push(t); });
  var codes=Object.keys(byCountry).sort(function(a,b){ return byCountry[b].length-byCountry[a].length; });
  box.innerHTML=codes.map(function(code){
    return '<div class="hr-sub">'+
      '<button type="button" class="hr-sub-head" onclick="slaSubToggle(this)">'+
        '<span class="hr-sub-ic">'+ic('globe',15)+'</span>'+
        '<span class="hr-sub-title">'+slaCountryLabel(code)+'</span>'+
        '<span class="hr-sub-meta">'+byCountry[code].length+' tickets</span>'+
        '<span class="hr-caret" aria-hidden="true">\u25be</span>'+
      '</button>'+
      '<div class="hr-sub-body">'+slaTable(byCountry[code])+'</div>'+
    '</div>';
  }).join('');
}
window.renderSlaCountryView=renderSlaCountryView;

function paintSlaShell(){
  document.getElementById('wrap').innerHTML=
    slaChartSectionHtml()+
    slaCountrySectionHtml();
  // No eager render: each section fetches + draws on its first expand (see slaLoadChart/Country).
}

(async function init(){
  if(!A||!A.getUser||!A.getUser()||!A.getToken()){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  if(!(A.canViewSLA&&A.canViewSLA())){ location.replace('index.html'); return; }
  paintSlaShell();
  // Resolve user roles up front so PHD/non-PHD classification is ready before a section fetches.
  try{ const ru=await A.api('GET','/api/user-roles'); if(ru&&ru.ok&&Array.isArray(ru.data)){ HR_USERS=new Set(ru.data.map(function(u){return String(u.username||'').trim().toLowerCase();})); } }catch(e){ HR_USERS=null; }
  // Chart section is expanded by default -> load it now. The Country section stays collapsed and
  // fetches only when it is expanded (lazy-load).
  slaLoadChart();
})();
