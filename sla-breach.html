<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLA Breaches (>240h) · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: hide the body until topbar-auth.js injects its CSS + builds the chrome. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<!-- Keep the section hidden until the shared chrome (title bar + menu column) has wrapped it. -->
<style>#wrap{visibility:hidden}#tbHomeChrome #wrap,html.tb-wrap-timeout #wrap{visibility:visible}</style>
<script>setTimeout(function(){document.documentElement.classList.add('tb-wrap-timeout');},8000);</script>
<noscript><style>#wrap{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.wrap{padding:32px 24px;width:auto;max-width:none;margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--oh);color:#fff;border-radius:6px;font-weight:700;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
<style id="sb-light">
/* SLA Breaches — "breach ledger": dark navy hero with an orange rule, KPI cards that overlap it, then
   white section cards (trend chart, country ledger). Everything is scoped under .sb (a size container). */
#wrap.wrap{padding-top:0!important;padding-bottom:28px!important}
.sb{--ink:#1b2026;--mut:#5c6773;--line:#e2e6ea;--soft:#f5f6f8;--acc:#ec7211;--acc-bg:#fff3e8;--acc-ink:#9a4100;
  --red:#b42318;--red-bg:#fdecec;--grn:#1a7a43;--grn-bg:#e5f5ec;--amb:#b5530a;--amb-bg:#fff4e5;--blue:#1f5fbf;--blue-bg:#e9f0fb;
  --c-created:#1f5fbf;--c-crossed:#d92d20;--focus:#f0a35a;container-type:inline-size;color:var(--ink)}
.sb button{font-family:inherit;font-weight:inherit;line-height:inherit;font-size:inherit;text-transform:none}
.sb .np-seg-btn{font-size:.84em;font-weight:700}
.sb .sb-btn{font-size:.86em;font-weight:800}
.sb :is(button,a,input,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sb-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.sb-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 78px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.sb-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.sb-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.sb-hero-in{position:relative;display:flex;gap:20px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.sb-hero-main{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1 1 360px}
.sb-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.sb-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.sb-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.05}
.sb-hero-sub{margin-top:9px;max-width:64ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.8)}
.sb-hero-sub b{color:#fff;font-weight:800}
.sb-meta{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;max-width:100%}
.sb-meta li{display:flex;flex-direction:column;gap:3px;padding:9px 14px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);min-width:0}
.sb-meta-k{font-size:.62em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:rgba(233,237,243,.62)}
.sb-meta-v{display:inline-flex;align-items:center;gap:7px;font-size:.86em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-meta-v svg{color:#ffb26b;flex-shrink:0}
@container (max-width:560px){
  .sb-hero{padding:20px 18px 72px 22px}
  .sb-hero h1{font-size:1.65em}
  .sb-hero-ic{width:40px;height:40px}
  .sb-hero-main{flex-basis:100%}
}

/* ---- KPI row (overlaps the hero) ---- */
.sb-kpis{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:-56px 18px 16px}
@container (min-width:520px){.sb-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.sb-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container (max-width:560px){.sb-kpis{margin:-54px 10px 14px}}
.sb-kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.sb-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#c4ccd4)}
.sb-kpi-l{display:flex;align-items:center;gap:9px;font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.sb-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:#3a4552}
.sb-kpi-v{margin-top:12px;font-size:2.4em;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.sb-kpi-v small{font-size:.42em;font-weight:700;letter-spacing:0;color:var(--mut)!important;margin-left:6px}
.sb-kpi-s{margin-top:7px;font-size:.82em;font-weight:600;color:var(--mut)}
.sb-kpi-s b{color:var(--ink);font-weight:800}
.sb-kpi-bar{margin-top:12px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.sb-kpi-bar i{display:block;height:100%;border-radius:inherit;background:var(--k)}
.sb-kpi.is-base{--k:#1f2a40}.sb-kpi.is-base .sb-kpi-ic{background:var(--blue-bg);color:var(--blue)}
.sb-kpi.is-bad{--k:#d92d20}.sb-kpi.is-bad .sb-kpi-v{color:var(--red)}.sb-kpi.is-bad .sb-kpi-ic{background:var(--red-bg);color:var(--red)}
.sb-kpi.is-warn{--k:#f59e0b}.sb-kpi.is-warn .sb-kpi-v{color:var(--amb)}.sb-kpi.is-warn .sb-kpi-ic{background:var(--amb-bg);color:var(--amb)}
.sb-kpi.is-good{--k:#1f9d57}.sb-kpi.is-good .sb-kpi-v{color:var(--grn)}.sb-kpi.is-good .sb-kpi-ic{background:var(--grn-bg);color:var(--grn)}
.sb-kpi.is-na .sb-kpi-v{color:#a0a8b1}

/* ---- Section cards with chevron expanders ---- */
.sb-sec{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18);margin-bottom:16px;overflow:hidden}
.sb-sec-h{width:100%;display:flex;align-items:center;gap:12px;padding:16px 20px;border:none;background:#fff;color:var(--ink);text-align:left;cursor:pointer}
.sb-sec-h:hover{background:#fafbfc}
.sb .sb-sec-h:focus-visible{outline-offset:-3px}
.sb-sec.is-open>.sb-sec-h{border-bottom:1px solid var(--line)}
.sb-sec-ic{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--acc-bg);color:#b5530a}
.sb-sec-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.sb-sec-t{font-size:1.12em;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.sb-sec-d{font-size:.82em;font-weight:500;color:var(--mut);line-height:1.4}
.sb-sec-sum{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);
  font-size:.78em;font-weight:700;color:#3a4552;white-space:nowrap;font-variant-numeric:tabular-nums}
.sb-sec-sum b{color:var(--red);font-weight:800}
.sb-chev{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;color:#818284}
.sb-chev svg{transition:transform .15s}
[aria-expanded="true"]>.sb-chev svg{transform:rotate(90deg)}
.sb-sec-h:hover .sb-chev,.sb-cc-h:hover .sb-chev{background:#e6f0fc;color:#2b66c1}
.sb-sec-b{padding:18px 20px 20px}
@container (max-width:640px){.sb-sec-h{flex-wrap:wrap;padding:14px 14px}.sb-sec-sum{margin-left:36px}.sb-sec-b{padding:14px}}

/* ---- Chart ---- */
.sb-chart-top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:10px}
.sb-chart-note{font-size:.8em;color:var(--mut);font-weight:600}
.sb-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;list-style:none}
.sb-legend li{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.78em;font-weight:700;color:#3a4552}
.sb-legend i{width:14px;height:3px;border-radius:2px;display:inline-block;background:var(--c)}
.hr-chart-wrap{position:relative;width:100%;max-height:300px}
.hr-chart-svg{width:100%;height:auto;max-height:300px;display:block;overflow:visible}
.hr-chart-svg .grid{stroke:#eef1f4;stroke-width:1}
.hr-chart-svg .axis{stroke:#d4dce4;stroke-width:1}
.hr-chart-svg .axlbl{fill:#8793a0;font-size:11px;font-weight:600}
.hr-chart-svg .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hr-chart-svg .ln.l1{stroke:var(--c-created)}.hr-chart-svg .ln.l2{stroke:var(--c-crossed)}
.hr-chart-svg .area.l1{fill:url(#sbGradCreated)}.hr-chart-svg .area.l2{fill:url(#sbGradCrossed)}
.hr-chart-svg .pt{stroke:#fff;stroke-width:2}
.hr-chart-svg .pt.l1{fill:var(--c-created)}.hr-chart-svg .pt.l2{fill:var(--c-crossed)}
.hr-chart-svg .hit{fill:transparent;cursor:pointer;outline:none}
.hr-chart-svg .hit:focus-visible{fill:rgba(236,114,17,.08);stroke:var(--focus);stroke-width:2}
.hr-chart-svg .ptlbl{font-size:11px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.hr-chart-svg .ptlbl.l1{fill:#1a4f9f}.hr-chart-svg .ptlbl.l2{fill:#b42318}
.hr-chart-svg .vline{stroke:rgba(20,40,70,.22);stroke-width:1;stroke-dasharray:3 3;visibility:hidden}
/* Checkpoint card (hover preview / pinned with the assignee list). */
.hr-chart-tip{position:absolute;pointer-events:none;z-index:5;min-width:300px;max-width:420px;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;box-shadow:0 18px 38px -18px rgba(20,40,70,.45);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-size:.82em;color:var(--ink)}
.hr-chart-tip.show{opacity:1;transform:translateY(0);pointer-events:auto}
.hr-chart-tip.pinned{overflow-y:auto;border-color:#cdd5dd;box-shadow:0 22px 44px -18px rgba(20,40,70,.5)}
.hr-chart-tip .tt-m{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:1.05em;margin-bottom:8px}
.hr-chart-tip .tt-x{background:transparent;border:none;color:#8793a0;font-size:1.3em;line-height:1;cursor:pointer;padding:0 5px;border-radius:5px}
.hr-chart-tip .tt-x:hover{color:var(--ink);background:#f1f3f6}
.hr-chart-tip .tt-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:3px 0;color:var(--mut)}
.hr-chart-tip .tt-row .k{display:inline-flex;align-items:center;gap:7px;min-width:0}
.hr-chart-tip .tt-row .k i{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.hr-chart-tip .tt-row .v{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.hr-chart-tip .tt-pct{color:var(--red);font-weight:800}
.hr-chart-tip .tt-sep{height:1px;background:#eef1f4;margin:8px 0}
.hr-chart-tip .tt-sub{font-size:.78em;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#8793a0;margin-bottom:4px}
.hr-chart-tip .tt-agents{display:flex;flex-direction:column}
.hr-chart-tip .tt-agent{width:100%;background:transparent;border:none;border-radius:6px;text-align:left;cursor:pointer;padding:4px 7px}
.hr-chart-tip .tt-agent .k{display:block;color:#2b66c1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr-chart-tip .tt-agent:hover{background:#eef5fb}
.hr-chart-tip .tt-agent:hover .k{text-decoration:underline}
.hr-chart-tip .tt-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:4px;padding:8px 10px;border-radius:8px;font-size:.95em;font-weight:700;cursor:pointer;transition:background .12s,border-color .12s}
.hr-chart-tip .tt-viewbtn{background:var(--blue-bg);border:1px solid #c9daf3;color:var(--blue)}
.hr-chart-tip .tt-viewbtn:hover{background:#dbe7f8;border-color:var(--blue)}
.hr-chart-tip .tt-closebtn{margin-top:10px;background:#fff;border:1px solid #d4dce4;color:#2a3340}
.hr-chart-tip .tt-closebtn:hover{border-color:#8793a0;color:var(--ink)}
@container (max-width:560px){.hr-chart-tip{min-width:0;width:calc(100% - 8px);max-width:none}}
.sb-chart-sk{position:relative;height:280px;display:flex;align-items:flex-end;gap:3%;padding:10px 6px 28px 40px;border-bottom:1px solid #eef1f4}
.sb-chart-sk .sb-skel{flex:1;border-radius:6px 6px 0 0}
.sb-chart-sk::before{content:'';position:absolute;inset:10px 0 28px 40px;background:repeating-linear-gradient(180deg,#eef1f4 0 1px,transparent 1px 25%)}

/* ---- Filter bar ---- */
.sb-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;padding:10px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.sb-search{position:relative;flex:1 1 260px;max-width:420px}
.sb-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8793a0;pointer-events:none}
.sb-search input{width:100%;font:inherit;font-size:.9em;padding:8px 12px 8px 36px;border-radius:8px}
.sb-chips{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.sb-chips-k{font-size:.68em;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin-right:2px}
.np-seg-btn{display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 9px;border:1px solid #d4dade;border-radius:99px;background:#fff;font-size:.84em;font-weight:700;color:#3a4552;cursor:pointer;user-select:none;transition:background .12s,border-color .12s}
.np-seg-btn:hover{border-color:#b9c2cb}
.np-seg-check{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1.5px solid #b9c2cb;color:transparent;flex-shrink:0}
.np-seg-check svg{width:10px;height:10px}
.np-seg-btn.on{background:var(--acc-bg);border-color:#f7c99c;color:var(--acc-ink)}
.np-seg-btn.on .np-seg-check{background:var(--acc);border-color:var(--acc);color:#fff}
.sb-tiers{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:auto;list-style:none}
.sb-count{flex-basis:100%;font-size:.82em;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;padding:0 2px}
@container (max-width:700px){.sb-tiers{margin-left:0}}

/* ---- Age / SLA badges ---- */
.sb-age{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:.86em;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;border:1px solid}
.sb-age::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.sb-age.t1{background:var(--amb-bg);border-color:#f6d3a6;color:#9a4a06}
.sb-age.t2{background:var(--red-bg);border-color:#f4c2bd;color:#b42318}
.sb-age.t3{background:#b42318;border-color:#b42318;color:#fff}
.sb-age.t0{background:#f1f3f5;border-color:var(--line);color:#5c6773}
.sb-tiers .sb-age{font-size:.74em;padding:2px 8px}

/* ---- Country ledger ---- */
.sb-cc{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.sb-cc.is-open{border-color:#cfd6dd;box-shadow:0 12px 26px -22px rgba(20,30,50,.6)}
.sb-cc-h{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;border:none;background:#fff;color:var(--ink);text-align:left;cursor:pointer}
.sb-cc-h:hover{background:#fafbfc}
.sb-cc.is-open .sb-cc-h{background:#f7f8fa;border-bottom:1px solid var(--line)}
.sb .sb-cc-h:focus-visible{outline-offset:-3px}
.sb-cc-code{flex-shrink:0;min-width:40px;height:30px;padding:0 7px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  background:#1f2a40;color:#fff;font-size:.78em;font-weight:800;letter-spacing:.6px}
.sb-cc-name{flex:1 1 auto;min-width:0;font-size:.96em;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-cc-bar{flex:0 0 170px}
.sb-cc-track{display:block;height:8px;border-radius:99px;background:#eef1f4;overflow:hidden}
.sb-cc-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f59e0b,#d92d20)}
.sb-cc-stats{flex:0 0 auto;min-width:200px;display:flex;justify-content:flex-end;gap:16px;font-size:.82em;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-cc-stats b{font-size:1.15em;font-weight:800;color:var(--ink)}
.sb-cc-stats .is-e b{color:var(--red)}
@container (max-width:700px){.sb-cc-bar{display:none}.sb-cc-stats{min-width:0;flex-direction:column;align-items:flex-end;gap:0}}
@container (max-width:480px){.sb-cc-h{gap:9px;padding:10px}.sb-cc-stats span+span{display:none}}
.sb-cc-b{padding:12px 14px 14px}

/* ---- Tables ---- */
.sb-scroll{overflow:auto;max-height:540px;border:1px solid var(--line);border-radius:8px}
.sb-tbl{width:100%;min-width:960px;border-collapse:separate;border-spacing:0;font-size:.86em}
.sb-tbl th,.sb-tbl td{padding:9px 12px;border-bottom:1px solid #eef1f4!important;text-align:left;vertical-align:middle}
.sb-tbl thead th{position:sticky;top:0;z-index:1;background:#f5f6f8!important;color:#5c6773!important;border-bottom:1px solid var(--line)!important;font-size:.72em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap}
.sb-tbl tbody tr td{background:#fff!important}
.sb-tbl tbody tr:hover td{background:#f6f9fd!important}
.sb-tbl tbody tr:last-child td{border-bottom:none!important}
.sb-tbl td.c,.sb-tbl th.c{text-align:center}
.sb-tbl a{color:#2b66c1;font-weight:800;text-decoration:none;white-space:nowrap}
.sb-tbl a:hover{text-decoration:underline}
.sb-trunc{display:block;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2a3340}
.sb-trunc.sm{max-width:240px}
.sb-who{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600}
.sb-mute{color:#8793a0!important}

<script>
const A=window.PHDAuth;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ic(n,s){return window.icon?window.icon(n,s||14):'';}
function $(id){return document.getElementById(id);}
function num(n){return (Number(n)||0).toLocaleString('en-US');}
function pct(n,d){ if(!d) return '0%'; var p=n/d*100; return (p>0&&p<10?p.toFixed(1).replace(/\.0$/,''):String(Math.round(p)))+'%'; }
function safeUrl(u){ u=String(u||''); return /^https?:\/\//i.test(u)?u:''; }
function fmtDate(iso){ if(!iso)return '\u2014'; var d=new Date(iso); if(isNaN(d))return '\u2014'; return d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function displayAgent(name){ return name||'\u2014'; }
function errMsg(r,fallback){ return (r&&r.status===401)?'Your session has expired. Please log in again.':((r&&r.data&&r.data.error)||fallback); }
var CHEV='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var SLA_HOURS=240, SLA_DAYS=10;
var SLA_COUNTRY_NAME={US:'United States',UK:'United Kingdom',CA:'Canada',IN:'India',AU:'Australia',MX:'Mexico',JP:'Japan',DE:'Germany',IT:'Italy',FR:'France',EG:'Egypt',ES:'Spain',SA:'Saudi Arabia',BR:'Brazil',NL:'Netherlands',ZA:'South Africa',PT:'Portugal',UAE:'United Arab Emirates',IE:'Ireland',SG:'Singapore',TR:'Turkey',PL:'Poland',SE:'Sweden',BE:'Belgium',AT:'Austria',CH:'Switzerland',DK:'Denmark',NO:'Norway',FI:'Finland',GR:'Greece',CZ:'Czechia'};
function countryName(code){ return SLA_COUNTRY_NAME[code]||code||'Unknown'; }

// Age badge for a breach length in days (create -> resolve). Tiers: just over SLA (amber), well over
// (red), severe (solid red). The text always carries the number so colour is never the only cue.
function ageTier(d){ return d==null?'t0':(d<=20?'t1':(d<=45?'t2':'t3')); }
function ageBadge(d){
  if(d==null) return '<span class="sb-age t0" title="Unknown resolution time">\u2014</span>';
  return '<span class="sb-age '+ageTier(d)+'" title="Took '+d+' days to resolve (SLA is '+SLA_DAYS+' days / '+SLA_HOURS+'h)">'+d+' days</span>';
}
function daysBetween(a,b){ var x=new Date(a), y=new Date(b); if(!a||!b||isNaN(x)||isNaN(y)) return null; return Math.round((y-x)/86400000); }

// Registered PHD users (lowercase usernames) from /api/user-roles -> "PHD" tag next to their name.
var HR_USERS=null;
function isPhdUser(name){ return !!(HR_USERS && HR_USERS.has(String(name||'').trim().toLowerCase())); }

// Polite live region for loading / loaded announcements.
function announce(msg){ var l=$('sbLive'); if(l){ l.textContent=''; setTimeout(function(){ l.textContent=msg; },30); } }
function emptyHtml(cls,icon,title,text,btn){
  return '<div class="sb-empty"><span class="sb-empty-ic '+cls+'">'+ic(icon,26)+'</span><h3 class="sb-empty-t">'+title+'</h3>'+(text?'<p>'+text+'</p>':'')+(btn||'')+'</div>';
}
function retryBtn(what){ return '<button type="button" class="sb-btn" data-retry="'+what+'">'+ic('refresh',14)+'Retry</button>'; }

// ================= State =================
var SLA_MONTHLY=null, CHART_STATE='loading', CHART_ERR='', LOADED_AT=null;
var SLA_FLAT=null, COUNTRY_STATE='idle', COUNTRY_ERR='';
var SLA_PHD=true, SLA_NONPHD=true, SLA_SORT_DIR='desc', SLA_Q='';
var SLA_OPEN_CC='', SLA_SHUT={};   // open country (no search) / countries collapsed while searching
var FIRST=true;
var SLA_MONTH_LBL=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ================= Hero + KPIs =================
function heroHtml(){
  var when=LOADED_AT?LOADED_AT.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):null;
  var refreshed=when?esc(when):(CHART_STATE==='error'?'Not loaded':'<span class="sb-skel sb-skel-d" style="width:64px;height:12px" aria-hidden="true"></span><span class="sb-sr">Loading</span>');
  return '<header class="sb-hero"><div class="sb-hero-in"><div class="sb-hero-main"><span class="sb-hero-ic">'+ic('hourglass',24)+'</span><div>'+
    '<p class="sb-eyebrow">Service levels \u00b7 Resolution SLA</p><h1>SLA Breaches</h1>'+
    '<p class="sb-hero-sub">Tickets created in 2026 that took longer than <b>'+SLA_HOURS+' hours ('+SLA_DAYS+' days)</b> from creation to resolution. Follow the monthly trend, then drill into each country\u2019s breached tickets.</p>'+
    '</div></div>'+
    '<ul class="sb-meta" aria-label="Report details">'+
      '<li><span class="sb-meta-k">Threshold</span><span class="sb-meta-v">'+ic('clock',14)+'&gt; '+SLA_HOURS+'h</span></li>'+
      '<li><span class="sb-meta-k">Period</span><span class="sb-meta-v">'+ic('calendar',14)+'YTD 2026</span></li>'+
      '<li><span class="sb-meta-k">Refreshed</span><span class="sb-meta-v">'+refreshed+'</span></li>'+
    '</ul></div></header>';
}
function slaLastMonth(months){
  var last=0;
  for(var i=0;i<months.length;i++){ var m=months[i]||{}; if((m.created||0)>0||(m.slaCrossed||0)>0) last=i+1; }
  return last||months.length;
}
// Roll the monthly series up into the headline numbers.
function slaChartStats(){
  var months=(SLA_MONTHLY&&SLA_MONTHLY.months)||[];
  var created=0, crossed=0, worst={lbl:'\u2014',pct:0,n:0,c:0};
  months.forEach(function(m,i){
    var c=m.created||0, x=m.slaCrossed||0; created+=c; crossed+=x;
    var p=(c>0)?(x/c*100):0; if(p>worst.pct){ worst={lbl:SLA_MONTH_LBL[i]||('M'+(i+1)),pct:p,n:x,c:c}; }
  });
  var rate=(created>0)?(crossed/created*100):0;
  var activeMonths=months.filter(function(m){return (m.created||0)>0;}).length||1;
  var last=slaLastMonth(months);
  return { created:created, crossed:crossed, rate:rate, worst:worst, avg:Math.round(crossed/activeMonths), lastLbl:SLA_MONTH_LBL[Math.max(0,last-1)] };
}
function kpiCard(cls,icon,label,value,sub,ratio){
  return '<div class="sb-kpi '+cls+'"><p class="sb-kpi-l"><span class="sb-kpi-ic">'+ic(icon,15)+'</span>'+label+'</p>'+
    '<p class="sb-kpi-v">'+value+'</p><p class="sb-kpi-s">'+sub+'</p>'+
    (ratio==null?'':'<div class="sb-kpi-bar" aria-hidden="true"><i style="width:'+Math.max(0,Math.min(100,ratio*100)).toFixed(1)+'%"></i></div>')+'</div>';
}
function kpisHtml(){
  if(CHART_STATE==='loading'){
    var k='<div class="sb-kpi" aria-hidden="true"><span class="sb-skel" style="width:55%;height:11px"></span><span class="sb-skel" style="width:40%;height:30px;margin-top:14px"></span><span class="sb-skel" style="width:70%;height:10px;margin-top:10px"></span><span class="sb-skel" style="width:100%;height:5px;margin-top:12px"></span></div>';
    return '<div class="sb-kpis" aria-busy="true" aria-label="Headline figures loading">'+k+k+k+k+'</div>';
  }
  if(CHART_STATE==='error'||!SLA_MONTHLY){
    var na='Unavailable';
    return '<div class="sb-kpis">'+
      kpiCard('is-base is-na','inbox','Tickets created','\u2014',na,null)+kpiCard('is-bad is-na','target','SLA crossed','\u2014',na,null)+
      kpiCard('is-warn is-na','flame','Worst month','\u2014',na,null)+kpiCard('is-good is-na','check-circle','Within SLA','\u2014',na,null)+'</div>';
  }
  var s=slaChartStats(), within=Math.max(0,s.created-s.crossed);
  return '<div class="sb-kpis">'+
    kpiCard('is-base','inbox','Tickets created',num(s.created),'Jan \u2013 '+esc(s.lastLbl)+' 2026 \u00b7 avg <b>'+(s.avg?num(s.avg):'\u2014')+'</b> crossed/mo',null)+
    kpiCard('is-bad','target','SLA crossed',num(s.crossed),'<b>'+s.rate.toFixed(1)+'%</b> breach rate of tickets created',s.created?s.crossed/s.created:0)+
    kpiCard('is-warn','flame','Worst month',esc(s.worst.lbl)+(s.worst.c?'<small>2026</small>':''),s.worst.c?'<b>'+s.worst.pct.toFixed(0)+'%</b> breached \u00b7 '+num(s.worst.n)+' of '+num(s.worst.c):'No breaches yet',s.worst.c?s.worst.pct/100:null)+
    kpiCard('is-good','check-circle','Within SLA',pct(within,s.created),'<b>'+num(within)+'</b> created tickets not over '+SLA_HOURS+'h',s.created?within/s.created:0)+
  '</div>';
}

// ================= Section shells (chevron expanders) =================
function secHead(key,icon,title,desc,sum,open){
  return '<button type="button" class="sb-sec-h" id="sbSecH-'+key+'" aria-expanded="'+(open?'true':'false')+'" aria-controls="sbSecB-'+key+'" onclick="hrRangeToggle(this)">'+
    '<span class="sb-chev">'+CHEV+'</span><span class="sb-sec-ic">'+ic(icon,18)+'</span>'+
    '<span class="sb-sec-txt"><span class="sb-sec-t">'+title+'</span><span class="sb-sec-d">'+desc+'</span></span>'+
    '<span class="sb-sec-sum" id="sbSecSum-'+key+'">'+(sum||'')+'</span></button>';
}
function chartSum(){
  if(CHART_STATE==='done'&&SLA_MONTHLY){ var s=slaChartStats(); return '<b>'+num(s.crossed)+'</b> crossed of '+num(s.created); }
  return CHART_STATE==='error'?'Not loaded':'Loading\u2026';
}
function countrySum(){
  if(COUNTRY_STATE==='done'&&SLA_FLAT){ var t=SLA_FLAT.tickets||[], cc={}; t.forEach(function(x){ cc[x.country]=1; }); return '<b>'+num(t.length)+'</b> breaches \u00b7 '+num(Object.keys(cc).length)+' countries'; }
  if(COUNTRY_STATE==='loading') return 'Loading\u2026';
  if(COUNTRY_STATE==='error') return 'Not loaded';
  return 'Loads on open';
}
function paintSlaShell(){
  $('wrap').innerHTML='<div class="sb'+(FIRST?' is-anim':'')+'">'+
    '<div id="sbHero">'+heroHtml()+'</div><div id="sbKpis">'+kpisHtml()+'</div>'+
    '<section class="sb-sec is-open" data-range="chart" aria-labelledby="sbSecH-chart">'+
      secHead('chart','line-chart','Tickets created vs SLA crossed \u00b7 2026','Hover or focus a month for its checkpoint; click to pin it and see who the breached tickets were assigned to.',chartSum(),true)+
      '<div class="sb-sec-b" id="sbSecB-chart" role="region" aria-labelledby="sbSecH-chart"><div id="slaChartBody"></div></div>'+
    '</section>'+
    '<section class="sb-sec" data-range="country" aria-labelledby="sbSecH-country">'+
      secHead('country','globe','SLA breaches by country','Every breached ticket in 2026, grouped by country. Filter by analyst type or search.',countrySum(),false)+
      '<div class="sb-sec-b" id="sbSecB-country" role="region" aria-labelledby="sbSecH-country" hidden><div id="slbContent"></div></div>'+
    '</section>'+
    '<p class="sb-sr" id="sbLive" aria-live="polite"></p>'+
  '</div>';
  FIRST=false;
  renderChartBody();
}
function refreshTop(){
  var h=$('sbHero'); if(h) h.innerHTML=heroHtml();
  var k=$('sbKpis'); if(k) k.innerHTML=kpisHtml();
  var a=$('sbSecSum-chart'); if(a) a.innerHTML=chartSum();
  var b=$('sbSecSum-country'); if(b) b.innerHTML=countrySum();
}

// Accordion: one section open at a time; a section's data loads the first time it is expanded.
function hrRangeToggle(btn){
  var s=btn.closest('.sb-sec'); if(!s)return;
  var willOpen=!s.classList.contains('is-open');
  document.querySelectorAll('.sb-sec.is-open').forEach(function(o){ if(o!==s) setSecOpen(o,false); });
  setSecOpen(s,willOpen);
  if(willOpen){ var r=s.getAttribute('data-range'); if(r==='chart'){ if(CHART_STATE==='done'&&SLA_MONTHLY) drawSlaChart(SLA_MONTHLY); } else if(r==='country') slaLoadCountry(); }
}
function setSecOpen(s,open){
  s.classList.toggle('is-open',open);
  var h=s.querySelector('.sb-sec-h'), b=s.querySelector('.sb-sec-b');
  if(h) h.setAttribute('aria-expanded',open?'true':'false');
  if(b) b.hidden=!open;
  if(!open && s.getAttribute('data-range')==='chart') slaUnpinTip();
}
window.hrRangeToggle=hrRangeToggle;

// ================= SECTION 1: monthly trend chart (created vs SLA crossed) =================
function chartSkeletonHtml(){
  var hs=[55,40,70,50,85,60,78,45,66,52,38,72], bars='';
  for(var i=0;i<12;i++) bars+='<span class="sb-skel" style="height:'+hs[i]+'%"></span>';
  return '<div aria-hidden="true"><div class="sb-chart-top"><span class="sb-skel" style="width:220px;height:12px"></span>'+
    '<span style="display:flex;gap:8px"><span class="sb-skel" style="width:96px;height:24px;border-radius:99px"></span><span class="sb-skel" style="width:118px;height:24px;border-radius:99px"></span></span></div>'+
    '<div class="sb-chart-sk">'+bars+'</div></div>';
}
function renderChartBody(){
  var b=$('slaChartBody'); if(!b) return;
  var reg=$('sbSecB-chart');
  if(reg) reg.setAttribute('aria-busy',CHART_STATE==='loading'?'true':'false');
  if(CHART_STATE==='loading'){ b.innerHTML=chartSkeletonHtml(); return; }
  if(CHART_STATE==='error'||!SLA_MONTHLY){
    b.innerHTML=emptyHtml('is-err','alert-triangle','Couldn\u2019t load the monthly trend','<span role="alert">'+esc(CHART_ERR||'Could not load the SLA monthly trend.')+'</span>',retryBtn('chart'));
    return;
  }
  var s=slaChartStats();
  if(!s.created){ b.innerHTML=emptyHtml('is-mute','line-chart','No tickets created in 2026 yet','The trend appears once tickets are created this year.'); return; }
  b.innerHTML='<div class="sb-chart-top"><p class="sb-chart-note">Monthly counts by creation month \u00b7 points labelled with values</p>'+
      '<ul class="sb-legend" aria-label="Legend"><li style="--c:var(--c-created)"><i></i>Created</li><li style="--c:var(--c-crossed)"><i></i>SLA crossed</li></ul></div>'+
    '<div class="hr-chart-wrap" id="slaChartWrap">'+
      '<svg class="hr-chart-svg" id="slaChartSvg" viewBox="0 0 920 320" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Line chart of tickets created and SLA crossed per month, 2026"></svg>'+
      '<div class="hr-chart-tip" id="slaChartTip"></div>'+
    '</div>';
  drawSlaChart(SLA_MONTHLY);
}
async function slaLoadChart(){
  CHART_STATE='loading'; CHART_ERR=''; refreshTop(); renderChartBody();
  announce('Loading the monthly SLA trend\u2026');
  var r=null; try{ r=await A.api('GET','/api/sla-monthly'); }catch(e){}
  if(r&&r.ok&&r.data&&Array.isArray(r.data.months)){ SLA_MONTHLY=r.data; CHART_STATE='done'; LOADED_AT=new Date(); }
  else { CHART_STATE='error'; CHART_ERR=errMsg(r,'Could not load the SLA monthly trend.'); }
  refreshTop(); renderChartBody();
  announce(CHART_STATE==='done'?'Monthly SLA trend loaded.':'The monthly SLA trend could not be loaded.');
}
function slaNiceCeil(v){ if(v<=5)return 5; var e=Math.floor(Math.log10(v)),b=Math.pow(10,e),f=v/b; var nf=f<=1?1:f<=2?2:f<=5?5:10; return nf*b; }
function drawSlaChart(data){
  var svg=$('slaChartSvg'); if(!svg)return;
  var months=(data&&data.months)||[];
  // Draw lines/points/hover only through the last month with data; keep all 12 x-axis labels.
  var draw=months.slice(0, slaLastMonth(months));
  // Size the drawing to the box it gets: H=320 units for ~300px of height, widen W to the box aspect.
  var wrapEl=$('slaChartWrap');
  var boxW=(wrapEl&&wrapEl.clientWidth)||920, TARGET_PX_H=300;
  if(!boxW) return;   // collapsed section: redrawn when it is opened again
  var H=320, W=Math.max(600, Math.round(H*boxW/TARGET_PX_H));
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var padL=46,padR=20,padT=18,padB=36, plotW=W-padL-padR, plotH=H-padT-padB;
  var maxV=0; draw.forEach(function(m){ maxV=Math.max(maxV,m.created,m.slaCrossed); });
  var niceMax=slaNiceCeil(Math.max(maxV,1));
  var xAt=function(i){ return padL+(plotW*(i/11)); };
  var yAt=function(v){ return padT+plotH-(plotH*(v/niceMax)); };
  var g='<defs><linearGradient id="sbGradCreated" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f5fbf" stop-opacity=".16"/><stop offset="1" stop-color="#1f5fbf" stop-opacity="0"/></linearGradient>'+
    '<linearGradient id="sbGradCrossed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d92d20" stop-opacity=".18"/><stop offset="1" stop-color="#d92d20" stop-opacity="0"/></linearGradient></defs>';
  for(var b=0;b<=5;b++){ var v=Math.round(niceMax*b/5), y=yAt(v);
    g+='<line class="grid" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>';
    g+='<text class="axlbl" x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>'; }
  for(var i=0;i<12;i++){ g+='<text class="axlbl" x="'+xAt(i)+'" y="'+(H-padB+20)+'" text-anchor="middle">'+SLA_MONTH_LBL[i]+'</text>'; }
  g+='<line class="axis" x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'"/>';
  var pts=function(getter){ return draw.map(function(m,i){ return xAt(i)+','+yAt(getter(m)); }).join(' '); };
  var area=function(getter){ if(!draw.length) return ''; return xAt(0)+','+(padT+plotH)+' '+pts(getter)+' '+xAt(draw.length-1)+','+(padT+plotH); };
  g+='<polygon class="area l1" points="'+area(function(m){return m.created;})+'"/>';
  g+='<polygon class="area l2" points="'+area(function(m){return m.slaCrossed;})+'"/>';
  g+='<polyline class="ln l1" points="'+pts(function(m){return m.created;})+'"/>';
  g+='<polyline class="ln l2" points="'+pts(function(m){return m.slaCrossed;})+'"/>';
  g+='<line class="vline" id="slaVLine" y1="'+padT+'" y2="'+(padT+plotH)+'"/>';
  draw.forEach(function(m,i){
    g+='<circle class="pt l1" cx="'+xAt(i)+'" cy="'+yAt(m.created)+'" r="4"/>';
    g+='<circle class="pt l2" cx="'+xAt(i)+'" cy="'+yAt(m.slaCrossed)+'" r="4"/>';
  });
  // Value labels: Created above its point; SLA crossed above too unless Created is close overhead
  // (then below). A label flips sides if it would leave the plot.
  var axisY=padT+plotH, ABOVE=-10, BELOW=17, MIN_GAP=24;
  var fitY=function(py,off){ var y=py+off; if(y<padT+4) y=py+BELOW; if(y>axisY-4) y=py+ABOVE; return y; };
  draw.forEach(function(m,i){
    var x=xAt(i), yc=yAt(m.created), ys=yAt(m.slaCrossed), close=(ys-yc)<MIN_GAP;
    g+='<text class="ptlbl l1" x="'+x+'" y="'+fitY(yc,ABOVE)+'" text-anchor="middle">'+num(m.created)+'</text>';
    g+='<text class="ptlbl l2" x="'+x+'" y="'+fitY(ys,close?BELOW:ABOVE)+'" text-anchor="middle">'+num(m.slaCrossed)+'</text>';
  });
  var colW=plotW/11;
  draw.forEach(function(m,i){
    var p=(m.created>0)?(Math.round((m.slaCrossed/m.created)*1000)/10):0;
    g+='<rect class="hit" data-i="'+i+'" tabindex="0" role="button" aria-label="'+SLA_MONTH_LBL[i]+' 2026: '+num(m.created)+' created, '+num(m.slaCrossed)+' SLA crossed ('+p+'%). Press Enter to pin the checkpoint." x="'+(xAt(i)-colW/2)+'" y="'+padT+'" width="'+colW+'" height="'+plotH+'"/>';
  });
  svg.innerHTML=g;
  var tip=$('slaChartTip'), vline=$('slaVLine'), wrap=$('slaChartWrap');
  // Show month i's checkpoint. pinned=true -> stays put, clickable (full assignee list).
  var showMonth=function(i,pinned){
    var m=months[i]; if(!m) return;
    tip.innerHTML=slaTipHtml(m,i,pinned);
    tip.classList.toggle('pinned',!!pinned);
    tip.scrollTop=0;
    var cx=xAt(i); vline.setAttribute('x1',cx); vline.setAttribute('x2',cx); vline.style.visibility='visible';
    var box=svg.getBoundingClientRect(), px=(cx/W)*box.width; tip.classList.add('show');
    var tw=tip.offsetWidth||320; var left=px+14; if(left+tw>box.width)left=px-tw-14; if(left<0)left=4;
    tip.style.left=left+'px'; tip.style.top='8px';
    // The section card clips overflow, so cap the card to the room left below its top edge.
    var sec=wrap.closest('.sb-sec');
    if(sec){ var room=sec.getBoundingClientRect().bottom - wrap.getBoundingClientRect().top - 8 - 12; tip.style.maxHeight=Math.max(160, Math.floor(room))+'px'; }
  };
  var pin=function(i,viaKey){
    if(SLA_TIP_PIN===i){ slaUnpinTip(); return; }
    SLA_TIP_PIN=i; showMonth(i,true);
    if(viaKey){ var f=tip.querySelector('button'); if(f) f.focus(); }
  };
  svg.querySelectorAll('.hit').forEach(function(rect){
    var i=+rect.getAttribute('data-i');
    rect.addEventListener('mouseenter', function(){ if(SLA_TIP_PIN==null) showMonth(i,false); });
    rect.addEventListener('focus', function(){ if(SLA_TIP_PIN==null) showMonth(i,false); });
    rect.addEventListener('click', function(ev){ ev.stopPropagation(); pin(i,false); });
    rect.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); ev.stopPropagation(); pin(i,true); } });
  });
  SLA_SHOW_MONTH=showMonth;
  if(SLA_TIP_PIN!=null && months[SLA_TIP_PIN]) showMonth(SLA_TIP_PIN,true); else SLA_TIP_PIN=null;
  if(!wrap._slaLeave){   // bind once per wrap (drawSlaChart re-runs on resize)
    wrap._slaLeave=true;
    var hidePreview=function(){ if(SLA_TIP_PIN!=null) return; var t=$('slaChartTip'), v=$('slaVLine'); if(t)t.classList.remove('show'); if(v)v.style.visibility='hidden'; };
    wrap.addEventListener('mouseleave', hidePreview);
    wrap.addEventListener('focusout', function(ev){ if(!wrap.contains(ev.relatedTarget)) hidePreview(); });
    // Clicks inside the card: "View agents" -> pin with the list; agent -> tickets pop-up; x / Close -> unpin.
    tip.addEventListener('click', function(ev){
      ev.stopPropagation();
      var v=ev.target.closest('[data-sla-view]');
      if(v){ var vi=+v.getAttribute('data-sla-view'); SLA_TIP_PIN=vi; if(SLA_SHOW_MONTH) SLA_SHOW_MONTH(vi,true); var f=tip.querySelector('.tt-agent'); if(f) f.focus(); return; }
      var a=ev.target.closest('[data-sla-agent]');
      if(a){ slaOpenAgentTickets(+a.getAttribute('data-mi'), a.getAttribute('data-sla-agent')); return; }
      if(ev.target.closest('.tt-x')||ev.target.closest('.tt-closebtn')) slaUnpinTip(true);
    });
  }
}

var SLA_TIP_PIN=null, SLA_SHOW_MONTH=null;

    '<div class="tt-row"><span class="k"><i style="background:#d92d20"></i>SLA crossed</span><span class="v">'+num(m.slaCrossed)+' <b class="tt-pct">('+p+'%)</b></span></div>'+
    '<div class="tt-sep"></div>'+
    '<div class="tt-row"><span class="k">Repeat</span><span class="v">'+num(m.repeat)+'</span></div>'+
    '<div class="tt-row"><span class="k">Pet</span><span class="v">'+num(m.pet)+'</span></div>'+
    '<div class="tt-row"><span class="k">Non-pet</span><span class="v">'+num(m.nonPet)+'</span></div>';

  }

function slaUnpinTip(refocus){

var SLA_AM_SEQ=0, SLA_AM_LAST=null, SLA_AM_OPENER=null;
function slaEnsureAgentModal(){
  var md=$('slaAgentModal'); if(md) return md;
  md=document.createElement('div'); md.id='slaAgentModal'; md.className='sla-am-bg';
  md.innerHTML='<div class="sla-am" role="dialog" aria-modal="true" aria-labelledby="slaAmTitle" aria-describedby="slaAmSub">'+
    '<div class="sla-am-head"><div><p class="sla-am-eb">SLA crossed \u00b7 &gt;'+SLA_HOURS+'h</p><h2 class="sla-am-title" id="slaAmTitle"></h2><p class="sla-am-sub" id="slaAmSub"></p></div>'+
    '<button type="button" class="sla-am-x" aria-label="Close" onclick="slaCloseAgentModal()">\u00d7</button></div>'+
    '<div class="sla-am-body" id="slaAmBody" aria-live="polite"></div></div>';
  md.addEventListener('click', function(ev){ if(ev.target===md) slaCloseAgentModal(); });
  md.addEventListener('click', function(ev){ var r=ev.target.closest('[data-retry="modal"]'); if(r&&SLA_AM_LAST) slaOpenAgentTickets(SLA_AM_LAST[0],SLA_AM_LAST[1]); });
  // Keep Tab inside the dialog.
  md.addEventListener('keydown', function(ev){
    if(ev.key!=='Tab') return;
    var f=md.querySelectorAll('button,a[href],[tabindex="0"]'); if(!f.length) return;

  });
  document.body.appendChild(md);

}

async function slaOpenAgentTickets(mi, assignee){
  var md=slaEnsureAgentModal(), seq=++SLA_AM_SEQ;

  SLA_AM_LAST=[mi,assignee];
  var mLbl=(SLA_MONTH_LBL[mi]||'')+' 2026';
  $('slaAmTitle').textContent=slaAgentName(assignee);
  $('slaAmSub').textContent='SLA crossed (>240h) \u00b7 tickets created in '+mLbl;
  var body=$('slaAmBody');
  body.innerHTML=modalSkeleton();
  md.classList.add('open');
  var x=md.querySelector('.sla-am-x'); if(x) x.focus();
  var r=null;
  try{ r=await A.api('GET','/api/sla-monthly-tickets?month='+(mi+1)+'&assignee='+encodeURIComponent(assignee||'')); }catch(e){}
  if(seq!==SLA_AM_SEQ) return;   // a newer click superseded this one
  if(!(r&&r.ok&&r.data&&Array.isArray(r.data.tickets))){
    body.innerHTML=emptyHtml('is-err','alert-triangle','Couldn\u2019t load the tickets','<span role="alert">'+esc(errMsg(r,'Could not load the tickets'+(r&&r.status?(' (HTTP '+r.status+')'):'')+'.'))+'</span>',retryBtn('modal'));

  $('slaAmSub').textContent=t.length+' ticket'+(t.length===1?'':'s')+' \u00b7 SLA crossed (>240h) \u00b7 created in '+mLbl;
  if(!t.length){ body.innerHTML=emptyHtml('is-mute','inbox','No tickets found',''); return; }
  body.innerHTML='<div class="sb-scroll" tabindex="0" role="region" aria-label="Tickets for '+esc(slaAgentName(assignee))+'"><table class="sb-tbl"><thead><tr>'+
      '<th scope="col">Ticket ID</th><th scope="col">Country</th><th scope="col">Created</th><th scope="col">Resolved</th><th scope="col">AssigneeIdentity</th><th scope="col">ResolvedByIdentity</th><th scope="col">Took</th>'+
    '</tr></thead><tbody>'+t.map(function(k){
      var u=safeUrl(k.url);

        '<td>'+ageBadge(daysBetween(k.createDate,k.resolvedDate))+'</td></tr>';
    }).join('')+'</tbody></table></div>';

async function slaLoadCountry(force){
  if(!force && COUNTRY_STATE!=='idle') return;
  COUNTRY_STATE='loading'; COUNTRY_ERR=''; refreshTop(); renderCountrySection();
  announce('Loading SLA breaches by country\u2026');
  var r=null; try{ r=await A.api('GET','/api/sla-flat'); }catch(e){}
  if(r&&r.ok&&r.data&&Array.isArray(r.data.tickets)){ SLA_FLAT=r.data; COUNTRY_STATE='done'; }
  else { COUNTRY_STATE='error'; COUNTRY_ERR=errMsg(r,'Could not load SLA-breach tickets.'); }

  announce(COUNTRY_STATE==='done'?'SLA breaches by country loaded.':'SLA breaches by country could not be loaded.');
}

// Segmented filter toggle: flip one analyst type; never allow both off (the table would be empty).

// A country's ticket table: Ticket | SLA Breach (days, sortable) | Title | Assignee | Resolved By | HI | Resolution.
function slaTable(list,label){

    var va=(a.breachDays==null?-1:a.breachDays), vb=(b.breachDays==null?-1:b.breachDays);

  });
  var rows=sorted.map(function(t){
    var u=safeUrl(t.url);
    var link=u?('<a class="np-id" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(t.shortId)+'</a>'):esc(t.shortId);
    var by='<span class="sb-who">'+esc(displayAgent(t.resolvedBy))+(isPhdUser(t.resolvedBy)?' <span class="np-phd" title="Registered PHD user">PHD</span>':'')+'</span>';
    var hi=Number(t.hi)||0;
    return '<tr>'+
      '<td>'+link+'</td>'+
      '<td>'+ageBadge(t.breachDays)+'</td>'+
      '<td><span class="sb-trunc" title="'+esc(t.title)+'">'+esc(t.title||'\u2014')+'</span></td>'+
      '<td><span class="sb-who'+(t.assignee?'':' sb-mute')+'" title="'+esc(t.assignee)+'">'+esc(displayAgent(t.assignee))+'</span></td>'+
      '<td>'+by+'</td>'+
      '<td class="c"><span class="sb-hi'+(hi?'':' is-zero')+'" title="Historical incidents">'+hi+'</span></td>'+
      '<td><span class="sb-trunc sm" title="'+esc(t.resolution)+'">'+esc(t.resolution)+'</span></td>'+
    '</tr>';
  }).join('');
  var arrow=(dir==='desc'?'\u25bc':'\u25b2');
  return '<div class="sb-scroll" tabindex="0" role="region" aria-label="SLA-breach tickets, '+esc(label)+'"><table class="sb-tbl">'+
    '<thead><tr><th scope="col">Ticket</th>'+
      '<th scope="col" class="np-sortable" aria-sort="'+(dir==='desc'?'descending':'ascending')+'"><button type="button" class="sb-sortbtn" onclick="slaSortBreach()" title="Sort by SLA breach length">SLA Breach <span class="np-sort-ar" aria-hidden="true">'+arrow+'</span></button></th>'+
      '<th scope="col">Title</th><th scope="col">Assignee</th><th scope="col">Resolved By</th><th scope="col" class="c"><abbr title="Historical incidents" style="text-decoration:none">HI</abbr></th><th scope="col">Resolution</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}
function ccOpen(code){ return slaQuery()?!SLA_SHUT[code]:(SLA_OPEN_CC===code); }
function renderSlaCountryView(){
  var box=$('slaCountryBody'); if(!box||!SLA_FLAT) return;
  var q=slaQuery(), all=SLA_FLAT.tickets||[];
  var byKind=slaFiltered(all);
  var tickets=byKind.filter(function(t){ return slaMatches(t,q); });
  var cnt=$('slaCount');
  if(!byKind.length){ box.innerHTML=emptyHtml('is-mute','users','No SLA breaches for the selected analyst type','Switch the analyst filter to see more tickets.'); if(cnt) cnt.textContent=''; return; }
  if(!tickets.length){
    box.innerHTML=emptyHtml('is-mute','search','No tickets match \u201c'+esc(SLA_Q.trim())+'\u201d','Try a different search, or clear it to see every breached ticket.','<button type="button" class="sb-btn" data-clear-q>Clear search</button>');
    if(cnt) cnt.textContent='0 of '+num(byKind.length)+' tickets match';
    return;
  }
  var byCountry={}; tickets.forEach(function(t){ (byCountry[t.country]=byCountry[t.country]||[]).push(t); });
  var codes=Object.keys(byCountry).sort(function(a,b){ return byCountry[b].length-byCountry[a].length; });
  var maxN=byCountry[codes[0]].length;
  if(cnt) cnt.textContent=(q?num(tickets.length)+' of '+num(byKind.length)+' tickets match':num(tickets.length)+' tickets')+' \u00b7 '+num(codes.length)+' countr'+(codes.length===1?'y':'ies');
  box.innerHTML=codes.map(function(code,i){
    var list=byCountry[code], open=ccOpen(code), id='sbCc'+i, name=countryName(code);
    var days=list.map(function(t){ return t.breachDays; }).filter(function(d){ return d!=null; });
    var longest=days.length?Math.max.apply(null,days):null;
    var avg=days.length?Math.round(days.reduce(function(s,d){ return s+d; },0)/days.length):null;
    var badge=String(code||'').length<=3&&code?esc(code):ic('globe',15);
    return '<div class="sb-cc'+(open?' is-open':'')+'">'+
      '<button type="button" class="sb-cc-h hr-sub-head" data-cc="'+esc(code)+'" aria-expanded="'+(open?'true':'false')+'" aria-controls="'+id+'">'+
        '<span class="sb-chev">'+CHEV+'</span><span class="sb-cc-code" aria-hidden="true">'+badge+'</span>'+
        '<span class="sb-cc-name">'+esc(name)+(name!==code&&code?'<span class="sb-sr"> ('+esc(code)+')</span>':'')+'</span>'+
        '<span class="sb-cc-bar" aria-hidden="true"><span class="sb-cc-track"><i style="width:'+Math.max(4,list.length/maxN*100).toFixed(1)+'%"></i></span></span>'+
        '<span class="sb-cc-stats"><span class="is-e"><b>'+num(list.length)+'</b> ticket'+(list.length===1?'':'s')+'</span>'+
          (longest!=null?'<span>longest <b>'+longest+'d</b> \u00b7 avg '+avg+'d</span>':'')+'</span>'+
      '</button>'+
      '<div class="sb-cc-b" id="'+id+'"'+(open?'':' hidden')+'>'+(open?slaTable(list,name):'')+'</div></div>';
  }).join('');
}
window.renderSlaCountryView=renderSlaCountryView;
// Country expander: one open at a time (no search); while searching every match is open unless collapsed.
function slaSubToggle(btn){
  var code=btn.getAttribute('data-cc');
  if(slaQuery()) SLA_SHUT[code]=!SLA_SHUT[code]; else SLA_OPEN_CC=(SLA_OPEN_CC===code?'':code);
  renderSlaCountryView();
  var b=Array.prototype.filter.call(document.querySelectorAll('.sb-cc-h'),function(e){ return e.getAttribute('data-cc')===code; })[0];
  if(b) b.focus();
}
window.slaSubToggle=slaSubToggle;

// ================= Delegated events =================
document.addEventListener('click', function(ev){
  var t=ev.target; if(!t||!t.closest) return;
  var r=t.closest('[data-retry]');
  if(r){ var w=r.getAttribute('data-retry'); if(w==='chart') slaLoadChart(); else if(w==='country') slaLoadCountry(true); return; }
  var cc=t.closest('.sb-cc-h'); if(cc){ slaSubToggle(cc); return; }
  if(t.closest('[data-clear-q]')){ SLA_Q=''; SLA_SHUT={}; var q=$('slaQ'); if(q){ q.value=''; q.focus(); } renderSlaCountryView(); }
});
document.addEventListener('input', function(ev){
  var el=ev.target; if(!el||el.id!=='slaQ') return;
  SLA_Q=el.value; SLA_SHUT={}; renderSlaCountryView();
});

(async function init(){
  if(!A||!A.getUser||!A.getUser()||!A.getToken()){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  if(!(A.canViewSLA&&A.canViewSLA())){ location.replace('index.html'); return; }
  paintSlaShell();
  // Resolve user roles up front so PHD/non-PHD classification is ready before the country section fetches.
  var rolesP=(async function(){ try{ const ru=await A.api('GET','/api/user-roles'); if(ru&&ru.ok&&Array.isArray(ru.data)){ HR_USERS=new Set(ru.data.map(function(u){return String(u.username||'').trim().toLowerCase();})); } }catch(e){ HR_USERS=null; } })();
  // The chart section is expanded by default -> load it now. The country section loads on first open.
  slaLoadChart();
  await rolesP;
  if(COUNTRY_STATE==='done') renderSlaCountryView();
})();
</script>
