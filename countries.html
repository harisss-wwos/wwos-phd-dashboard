<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countries · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252;--tl:#44b9d6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#000;border-radius:5px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.wrap{padding:32px 24px;width:auto;max-width:none;margin-left:15px;margin-right:15px}
/* ---- Shift Report-style ORANGE hero title bar (one-line banner, dark text, soft shadow) ---- */
.cx-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:nowrap;
  border-radius:5px;padding:0 22px;min-height:62px;margin-bottom:16px;border:none;
  background:linear-gradient(90deg,#f0820f,#ff9f2e 55%,#ffc06a);
  box-shadow:0 6px 18px -8px rgba(236,114,17,.45),0 2px 6px rgba(20,30,50,.12)}
.cx-hero-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto;color:#1b2026}
.cx-hero-ic{display:inline-flex;align-items:center;color:#1b2026;flex-shrink:0}
.cx-hero-title{font-size:1.3em;font-weight:800;letter-spacing:-.2px;color:#1b2026;white-space:nowrap;flex-shrink:0}
.cx-hero-sub{font-size:.72em;font-weight:800;letter-spacing:.5px;color:#5a3410;background:rgba(255,255,255,.5);border-radius:5px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cx-hero-badge{display:inline-flex;flex-direction:column;align-items:center;gap:1px;background:#fff;border-radius:5px;padding:6px 16px;box-shadow:0 2px 6px rgba(20,30,50,.14);color:#1b2026;flex-shrink:0}
.cx-hero-badge .n{font-size:1.3em;font-weight:900;line-height:1;color:#f0820f}
.cx-hero-badge .l{font-size:.6em;font-weight:800;letter-spacing:.5px;color:#5c6773;white-space:nowrap}
@media(max-width:640px){.cx-hero{flex-wrap:wrap;min-height:0;padding:12px 16px}.cx-hero-sub{flex-basis:100%}}
/* ---- (legacy) Illustrated gradient banner header (globe theme: blue/teal) ---- */
.cx-banner{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-radius:5px;padding:16px 22px;min-height:82px;margin-bottom:14px;
  border:1px solid #242a31;box-shadow:0 12px 30px -20px rgba(0,0,0,.75);
  background:linear-gradient(90deg,#0ea5b7,#38bdf8 55%,#a5e8ff);background-size:200% 100%;animation:cxBanner 9s ease infinite}
@keyframes cxBanner{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.cx-banner .hb-left{position:relative;z-index:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.cx-banner .hb-title{margin:0;display:inline-flex;align-items:center;gap:11px;font-size:1.5em;font-weight:800;letter-spacing:-.3px;line-height:1.1;color:#062a33}
.cx-banner .hb-title svg{flex-shrink:0;color:#062a33}
.cx-banner .hb-sub{font-size:.86em;font-weight:500;line-height:1.5;max-width:80ch;color:rgba(6,42,51,.82)}
.cx-banner .hb-sub b{color:#04202a;font-weight:800}
.cx-banner .hb-total{position:relative;z-index:1;display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.78);border-radius:5px;padding:9px 18px;box-shadow:0 2px 6px rgba(0,0,0,.12);color:#062a33}
.cx-banner .hb-total .n{font-size:1.5em;font-weight:900;line-height:1}
.cx-banner .hb-total .l{font-size:.66em;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.cx-banner::after{content:"";position:absolute;top:0;bottom:0;right:150px;width:210px;
  background-repeat:no-repeat;background-position:right center;background-size:auto 118%;opacity:.34;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="40" r="30"/><path d="M30 40h60M60 10c9 8 9 52 0 60M60 10c-9 8-9 52 0 60M36 22c14 8 34 8 48 0M36 58c14-8 34-8 48 0"/></svg>')}
@media(max-width:640px){.cx-banner .hb-title{font-size:1.25em}.cx-banner::after{opacity:.22}.cx-banner .hb-total{margin-left:0}}
/* Collapsible REGION block (NA / LATAM / APAC / MENA / Europe / Others), wrapping its country cards. */
.cx-region{margin-top:26px}
.cx-region:first-of-type{margin-top:6px}
.cx-region-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px;padding-bottom:8px;border-bottom:2px solid #e2e6ea;cursor:pointer;user-select:none}
.cx-region-head:hover .cx-region-label{color:#0f72a8}
.cx-region-head:focus-visible{outline:2px solid #38bdf8;outline-offset:3px;border-radius:3px}
.cx-region-label-wrap{display:flex;flex-direction:column;gap:2px;min-width:0}
.cx-region-label{font-size:1.02em;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:#0ea5b7}
.cx-region-sub{font-size:.72em;font-weight:600;color:#8a94a2}
.cx-region-head-right{display:inline-flex;align-items:center;gap:12px;flex-shrink:0}
.cx-region-meta{font-size:.74em;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8a94a2;white-space:nowrap}
.cx-region-caret{color:#0ea5b7;font-size:.9em;transition:transform .25s ease;display:inline-flex}
.cx-region.collapsed .cx-region-caret{transform:rotate(-90deg)}
/* Clean-ups EXPORT CSV button in the region head (orange, uppercase, 5px) — matches the Shift Report export buttons. */
.cx-exp{display:inline-flex;align-items:center;gap:6px;background:#f0820f;border:1px solid #f0820f;color:#fff;font-weight:800;font-size:.72em;letter-spacing:.4px;text-transform:uppercase;border-radius:5px;padding:6px 12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.cx-exp:hover{background:#d9730c;border-color:#d9730c}
.cx-exp svg{flex-shrink:0}
.cx-region-body{overflow:hidden;transition:max-height .34s ease,opacity .25s ease;max-height:200000px;opacity:1}
.cx-region.collapsed .cx-region-body{max-height:0;opacity:0}
/* Section card (collapsible accordion — one open at a time) */
.cx-sec{background:linear-gradient(180deg,#15181d,#0f1115);border:1px solid #242a31;border-top:3px solid #38bdf8;border-radius:5px;margin-bottom:16px;overflow:hidden}
.cx-sec-head{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;cursor:pointer;user-select:none;transition:background .15s}
.cx-sec-head:hover{background:rgba(255,255,255,.03)}
/* Globe illustration watermark behind the head, right side (mask-faded so text stays readable). */
.cx-sec-head::after{content:"";position:absolute;top:0;bottom:0;right:150px;width:120px;background-repeat:no-repeat;background-position:center;background-size:auto 76%;opacity:.10;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%2338bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="40" r="28"/><path d="M32 40h56M60 12c8 8 8 48 0 56M60 12c-8 8-8 48 0 56"/></svg>')}
.cx-sec-title{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;color:#fff;font-size:1.08em;font-weight:700;min-width:0;flex:1 1 auto}
.cx-code{font-family:'Inter',monospace;color:#7dd3fc;letter-spacing:.5px}
.cx-code-name{color:var(--tm);font-size:.8em;font-weight:400;line-height:1.4;width:100%;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-code-name.none{font-style:italic;opacity:.7}
.cx-sec-head-right{position:relative;z-index:1;display:flex;align-items:center;gap:12px;flex-shrink:0}
.cx-count{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:28px;padding:0 12px;border-radius:5px;font-weight:800;font-size:.88em;background:rgba(56,189,248,.16);color:#7dd3fc;border:1px solid rgba(56,189,248,.4)}
.cx-caret{color:var(--tm);display:inline-flex;transition:transform .2s ease}
.cx-sec.open .cx-caret{transform:rotate(180deg)}
.cx-sec-body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 22px}
.cx-sec.open .cx-sec-body{max-height:none;padding:8px 22px 14px}
/* Four summary stat tiles at the top of each open section. */
.cx-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 18px}
.cx-stat{background:#0b0d10;border:1px solid #1e242b;border-radius:5px;padding:14px 16px;border-top:3px solid #2a323b}
.cx-stat-n{font-size:1.7em;font-weight:900;line-height:1;letter-spacing:-.5px;color:#fff}
.cx-stat-l{margin-top:6px;font-size:.72em;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--tm)}
.cx-stat.total{border-top-color:#38bdf8}.cx-stat.total .cx-stat-n{color:#7dd3fc}
.cx-stat.pet{border-top-color:#a78bfa}.cx-stat.pet .cx-stat-n{color:#c4b5fd}
.cx-stat.nonpet{border-top-color:#ff9f2e}.cx-stat.nonpet .cx-stat-n{color:#ffc879}
.cx-stat.repeat{border-top-color:#4ade80}.cx-stat.repeat .cx-stat-n{color:#86efac}
@media(max-width:720px){.cx-stats{grid-template-columns:repeat(2,1fr)}}
/* Per-section chart */
.cx-chart-title{color:#d5dbdb;font-size:.85em;text-transform:uppercase;letter-spacing:.5px;margin:4px 0 4px}
.cx-chart-sub{color:var(--tm);font-size:.82em;line-height:1.5;margin:0 0 12px}
.chart-box{background:#0b0d10;border:1px solid #1e242b;border-radius:5px;padding:14px 14px 6px;margin-bottom:20px}
.chart-wrap{position:relative;height:200px}
.chart-wrap.tall{height:340px}
/* Table (clean, borderless) */
.cx-tbl-wrap{overflow-x:auto;margin-bottom:10px}
.cx-tbl{width:100%;border-collapse:collapse;font-size:.88em}
.cx-tbl th,.cx-tbl td{border:none;border-bottom:1px solid rgba(255,255,255,.06);padding:10px 14px;text-align:left;vertical-align:middle}
.cx-tbl thead th{background:transparent;color:var(--tm);text-transform:uppercase;font-size:.72em;letter-spacing:.5px;font-weight:700;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.12)}
.cx-tbl tbody tr:hover td{background:rgba(56,189,248,.05)}
.cx-tbl tbody tr:last-child td{border-bottom:none}
.cx-fit{width:1%;white-space:nowrap}
.cx-center{text-align:center}
.cx-tbl th.cx-center,.cx-tbl td.cx-center{text-align:center}
.cx-idlink{color:#44b9d6;text-decoration:none;font-weight:700;white-space:nowrap}
.cx-idlink:hover{text-decoration:underline}
.cx-num{color:#879596;font-weight:600;white-space:nowrap}
.cx-assignee{color:var(--t);white-space:nowrap}
.cx-tag-s{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;font-weight:800;font-size:.78em}
.cx-tag-s.c{background:rgba(74,222,128,.16);color:var(--gl)}
.cx-tag-s.r{background:rgba(68,185,214,.16);color:var(--tl)}
.cx-tag-s.o{background:rgba(255,153,0,.16);color:var(--o)}
.cx-title{max-width:1px;width:100%}
.cx-title-txt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t)}
.cx-sort{cursor:pointer;user-select:none}
.cx-sort:hover{color:#fff}
.cx-sort-ar{color:#38bdf8;font-weight:800;margin-left:4px}
.cx-sort-ar.idle{color:#4a5560;font-weight:400}
.cx-more{margin:2px 0 4px;display:flex;align-items:center;gap:12px}
.cx-more button{background:#1a2129;border:1px solid #2a3540;color:var(--t);border-radius:5px;padding:7px 14px;font-size:.82em;font-weight:600;cursor:pointer}
.cx-more button:hover{border-color:#38bdf8;color:#fff}
.cx-mcount{color:var(--tm);font-size:.8em}
.cx-empty{color:#5f6b6c;font-size:.86em;font-style:italic;padding:14px 4px}
/* Loading skeleton */
.cx-skel{margin-top:2px}
.sk-banner{position:relative;overflow:hidden;border-radius:5px;min-height:82px;margin-bottom:14px;border:1px solid #242a31;
  background:linear-gradient(90deg,#0b3a45,#0e5566 55%,#1a7d92);background-size:200% 100%;animation:cxBanner 9s ease infinite;
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px}
/* Orange hero skeleton (matches the loaded .cx-hero). */
.sk-hero{position:relative;overflow:hidden;border-radius:5px;min-height:62px;margin-bottom:16px;
  background:linear-gradient(90deg,#f0820f,#ff9f2e 55%,#ffc06a);
  box-shadow:0 6px 18px -8px rgba(236,114,17,.45),0 2px 6px rgba(20,30,50,.12);
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 22px}
.sk-hero .sk-line{background:rgba(255,255,255,.45)}
.sk-hero .sk-line::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent)}
/* Region-header skeleton row (mirrors .cx-region-head: flush, bottom divider, no card). */
.sk-region{display:flex;align-items:center;gap:12px;margin:26px 2px 12px;padding-bottom:8px;border-bottom:2px solid #e2e6ea}
.sk-region:first-of-type{margin-top:6px}
.sk-banner .sk-bl{display:flex;flex-direction:column;gap:9px}
.sk-sec{background:linear-gradient(180deg,#15181d,#0f1115);border:1px solid #242a31;border-top:3px solid #2a323b;border-radius:5px;margin-bottom:16px;overflow:hidden}
.sk-sec-head{display:flex;align-items:center;gap:12px;padding:18px 22px}
.sk-line{display:inline-block;border-radius:5px;background:#141a20;position:relative;overflow:hidden;vertical-align:middle}
.sk-banner .sk-line{background:rgba(255,255,255,.16)}
.sk-line::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);animation:cxSk 1.2s infinite}
.sk-banner .sk-line::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
@keyframes cxSk{100%{transform:translateX(100%)}}
/* gate */
.cx-gate{max-width:560px;margin:60px auto;text-align:center}
.cx-gate h1{color:#fff;font-size:1.5em;margin-bottom:10px}
.cx-gate p{color:var(--tm);line-height:1.55}
</style>

<!-- ===== Light-theme page override (loaded last, wins the cascade) ===== -->
<style id="cx-light">
/* Section cards white (keep the bright teal cx-banner + sec-head gradient top border). */
.cx-sec{background:#fff!important;border:1px solid #e2e6ea!important;border-top:3px solid #38bdf8!important;box-shadow:0 1px 3px rgba(20,30,50,.06)!important}
.cx-sec-head:hover{background:#f7f9fb!important}
.cx-sec-title{color:#1b2026!important}
.cx-code{color:#0f72a8!important}
.cx-code-name{color:#5c6773!important}
.cx-count{background:#eaf4fb!important;color:#1577a0!important;border:1px solid #bfe0ef!important}
.cx-caret{color:#9aa5b1!important}
/* Stat tiles. */
.cx-stat{background:#f7f9fb!important;border:1px solid #e6eaee!important;border-top:3px solid #cdd5dd!important}
.cx-stat-n{color:#1b2026!important}
.cx-stat-l{color:#5c6773!important}
.cx-stat.total{border-top-color:#38bdf8!important}.cx-stat.total .cx-stat-n{color:#1577a0!important}
.cx-stat.pet{border-top-color:#a78bfa!important}.cx-stat.pet .cx-stat-n{color:#7c5cff!important}
.cx-stat.nonpet{border-top-color:#ff9f2e!important}.cx-stat.nonpet .cx-stat-n{color:#b5680c!important}
.cx-stat.repeat{border-top-color:#4ade80!important}.cx-stat.repeat .cx-stat-n{color:#1f9d57!important}
/* Chart box. */
.cx-chart-title{color:#2a3340!important}
.cx-chart-sub{color:#5c6773!important}
/* Inline legend-colour words in the chart caption: darken the faint ones for contrast on white. */
.cx-chart-sub b[style*="#7dd3fc"]{color:#1577a0!important}
.cx-chart-sub b[style*="#a78bfa"]{color:#7c5cff!important}
.cx-chart-sub b[style*="#ff9f2e"]{color:#b5680c!important}
.cx-chart-sub b[style*="#4ade80"]{color:#1f9d57!important}
.chart-box{background:#fff!important;border:1px solid #e6eaee!important}
/* Table. */
.cx-tbl th,.cx-tbl td{border-bottom:1px solid #eef1f4!important}
.cx-tbl thead th{color:#5c6773!important;border-bottom:1px solid #e2e6ea!important}
.cx-tbl tbody tr:hover td{background:#eef7fc!important}
.cx-idlink{color:#1577a0!important}
.cx-num{color:#5c6773!important}
.cx-assignee{color:#2a3340!important}
.cx-title-txt{color:#2a3340!important}
.cx-sort:hover{color:#1b2026!important}
.cx-sort-ar{color:#1577a0!important}.cx-sort-ar.idle{color:#aab4bd!important}
.cx-tag-s.c{background:#eafaf0!important;color:#1f9d57!important}
.cx-tag-s.r{background:#eaf4fb!important;color:#1577a0!important}
.cx-tag-s.o{background:#fff4e8!important;color:#b5680c!important}
/* Show more/less. */
.cx-more button{background:#fff!important;border:1px solid #e2e6ea!important;color:#2a3340!important}
.cx-more button:hover{border-color:#38bdf8!important;color:#1b2026!important}
.cx-mcount{color:#8793a0!important}
.cx-empty{color:#8793a0!important}
/* Skeleton. */
.sk-sec{background:#fff!important;border:1px solid #e2e6ea!important;border-top:3px solid #cdd5dd!important}
.sk-line{background:#e8ebee!important}
.sk-banner .sk-line{background:rgba(255,255,255,.5)!important}
/* Gate. */
.cx-gate h1{color:#1b2026!important}
.cx-gate p{color:#5c6773!important}
.btn{background:linear-gradient(180deg,#ff9f2e,#f07d0a)!important;color:#fff!important;border:none!important}
/* Remove the outer page padding/margins around #wrap so content sits flush. Must match the shared
   app-light.css selector specificity (body[data-profile-panel] .wrap sets padding-left/right:12px)
   AND beat the inline .wrap padding — so target both selectors, all four sides, with !important. */
.wrap,
body[data-profile-panel] .wrap,
body[data-profile-panel] #wrap.wrap{
  padding:0!important;margin-left:0!important;margin-right:0!important;
  padding-left:0!important;padding-right:0!important;padding-top:0!important;padding-bottom:0!important;
}
</style>
</head>
<body data-nav-active="countries" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap">
  <div class="cx-skel">
    <div class="sk-hero">
      <div class="sk-bl"><span class="sk-line" style="width:220px;height:20px"></span></div>
      <span class="sk-line" style="width:84px;height:40px;border-radius:5px"></span>
    </div>
    <!-- Region-header shells (mirror the loaded collapsed region rows so there's no layout jump). -->
    <div class="sk-region"><span class="sk-line" style="width:70px;height:15px"></span><span class="sk-line" style="margin-left:auto;width:150px;height:11px"></span><span class="sk-line" style="width:12px;height:12px;border-radius:3px"></span></div>
    <div class="sk-region"><span class="sk-line" style="width:90px;height:15px"></span><span class="sk-line" style="margin-left:auto;width:140px;height:11px"></span><span class="sk-line" style="width:12px;height:12px;border-radius:3px"></span></div>

function fmtDate(iso){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return esc(String(iso)); return d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'}); }

function cxWeekStart(d){ var x=new Date(d.getTime()); var day=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-day); x.setUTCHours(0,0,0,0); return x; }
// Bucket a section's tickets by the week their CreateDate falls in, tracking FOUR weekly series:
//   created  = all tickets created that week (left axis)
//   repeat   = repeat incidents (t.hi) that week          (right axis) — combined
//   pet      = repeat incidents that are pet/animal (t.pet) (right axis)
//   nonpet   = repeat incidents that are NOT pet            (right axis)
function cxWeeklyBuckets(tickets){
  var created={}, repeat={}, pet={}, nonpet={}, min=null, max=null;
  (tickets||[]).forEach(function(t){
    var d=new Date(t.created); if(isNaN(d)) return;
    var k=cxWeekStart(d).getTime();
    created[k]=(created[k]||0)+1;
    if(t.hi){ repeat[k]=(repeat[k]||0)+1; if(t.pet){ pet[k]=(pet[k]||0)+1; } else { nonpet[k]=(nonpet[k]||0)+1; } }
    if(min===null||k<min)min=k; if(max===null||k>max)max=k;
  });
  var labels=[], cData=[], rData=[], pData=[], nData=[];
  if(min===null){ return {labels:labels,created:cData,repeat:rData,pet:pData,nonpet:nData}; }

  for(var k=min;k<=max;k+=WK){
    labels.push(new Date(k).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    cData.push(created[k]||0); rData.push(repeat[k]||0); pData.push(pet[k]||0); nData.push(nonpet[k]||0);
  }
  return {labels:labels,created:cData,repeat:rData,pet:pData,nonpet:nData};
}

// ---- CLEAN-UPS: one consolidated table across every clean-up code, with a leading CODE column ----
// Built from a flat list of {code, ...ticket} rows. Sortable (default: code asc, then created desc),
// paginated like the per-code tables, and exportable to CSV.
var CX_CLEAN={ rows:[], shown:CX_PAGE0, sortField:'code', sortDir:'asc' };
function cxCleanSortVal(t,field){
  if(field==='code') return String(t.code||'').toLowerCase();
  if(field==='created') return new Date(t.created).getTime()||0;
  if(field==='assignee') return cxAssignee(t.assignee).toLowerCase();
  if(field==='status') return String(t.status||'').toLowerCase();
  if(field==='ticket') return String(t.shortId||'').toLowerCase();
  return String(t.title||'').toLowerCase();
}
function cxCleanSorted(){
  var field=CX_CLEAN.sortField, dir=CX_CLEAN.sortDir;
  return CX_CLEAN.rows.slice().sort(function(x,y){
    var vx=cxCleanSortVal(x,field), vy=cxCleanSortVal(y,field);
    if(vx<vy) return dir==='desc'?1:-1;
    if(vx>vy) return dir==='desc'?-1:1;
    // tie-break: keep rows of the same code together, newest first
    var cx=String(x.code||'').toLowerCase(), cy=String(y.code||'').toLowerCase();
    if(cx!==cy) return cx<cy?-1:1;
    return (new Date(y.created).getTime()||0)-(new Date(x.created).getTime()||0);
  });
}
function cxCleanArrow(field){
  if(CX_CLEAN.sortField!==field) return '<span class="cx-sort-ar idle">\u21c5</span>';
  return CX_CLEAN.sortDir==='desc'?'<span class="cx-sort-ar">\u25bc</span>':'<span class="cx-sort-ar">\u25b2</span>';
}
function cxCleanTableHtml(){

  for(var i=0;i<shown;i++){

      +'<td class="cx-fit cx-center">'+link+'</td>'

      +'</tr>';

  var th=function(field,label,extra){
    return '<th class="cx-sort '+(extra||'')+'" onclick="cxCleanSort(\''+field+'\')">'+label+cxCleanArrow(field)+'</th>';
  };
  var head='<thead><tr>'
    +th('code','Code','cx-fit cx-center')
    +th('ticket','Ticket ID','cx-fit cx-center')
    +th('created','Created','cx-fit cx-center')
    +th('assignee','Assignee','cx-fit')
    +th('status','Status','cx-fit cx-center')
    +th('title','Title')

  var more='';
  if(tix.length>CX_PAGE0){

      +(canMore?'<button onclick="cxCleanMore()">Show more</button>':'')
      +(canLess?'<button onclick="cxCleanLess()">Show less</button>':'')
      +'<span class="cx-mcount">Showing '+shown+' of '+tix.length+'</span></div>';
  }
  return '<div class="cx-tbl-wrap"><table class="cx-tbl">'+head+'<tbody>'+rows+'</tbody></table></div>'+more;
}
function cxCleanRender(){ var b=document.getElementById('cxCleanBody'); if(b) b.innerHTML=cxCleanTableHtml(); }
function cxCleanSort(field){
  if(CX_CLEAN.sortField===field){ CX_CLEAN.sortDir=(CX_CLEAN.sortDir==='desc'?'asc':'desc'); }
  else { CX_CLEAN.sortField=field; CX_CLEAN.sortDir=(field==='created'?'desc':'asc'); }

}
function cxCleanMore(){ CX_CLEAN.shown=Math.min((CX_CLEAN.shown||CX_PAGE0)+CX_STEP, CX_CLEAN.rows.length); cxCleanRender(); }

// Download every clean-up row (all codes, current sort) as CSV: Code,Ticket ID,Created,Assignee,Status,Title.
function cxCleanExport(ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  var tix=cxCleanSorted(); if(!tix.length) return;
  var q=function(v){ var s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  var lines=[['Code','Ticket ID','Created','Assignee','Status','Title'].join(',')];
  tix.forEach(function(t){
    lines.push([t.code||'', t.shortId||'', fmtDate(t.created), cxAssignee(t.assignee), t.status||'', t.title||''].map(q).join(','));
  });
  var blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='clean-ups_tickets.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
// Accordion: only one section open at a time.
function cxToggle(idx){

function render(data){
  var secs=(data&&data.sections)||[];
  // Sections come pre-sorted by count desc from the API. Tag each with its region, then order by the
  // fixed region sequence (NA, LATAM, APAC, MENA, Europe, Others); within a region keep count desc.
  CX_SECS=secs.map(function(s){ return { tag:s.tag, region:cxRegionOf(s.tag), count:s.count, tickets:s.tickets||[], shown:CX_PAGE0, sortField:'created', sortDir:'desc' }; });
  // Total ticket count per region, so regions are ordered by VOLUME (highest first). Clean-ups
  // ('others') is always pinned LAST, ignored by the volume sort.
  var regionTotal={}; CX_SECS.forEach(function(x){ regionTotal[x.region]=(regionTotal[x.region]||0)+(Number(x.count)||0); });
  var regionRankByVol=function(r){ return r==='others' ? Infinity : -(regionTotal[r]||0); }; // smaller sorts first; others last
  CX_SECS.sort(function(a,b){
    var ra=regionRankByVol(a.region), rb=regionRankByVol(b.region);
    if(ra!==rb) return ra-rb;              // regions by total ticket count desc (Clean-ups last)
    if(a.region!==b.region) return a.region<b.region?-1:1;  // stable tie-break between equal-volume regions
    if(b.count!==a.count) return b.count-a.count;   // within a region, codes by count desc
    return String(a.tag).localeCompare(String(b.tag));
  });
  var from=(data&&data.from)||'2026-01-01';
  var totalTix=CX_SECS.reduce(function(s,x){ return s+(Number(x.count)||0); },0);
  var totalCodes=CX_SECS.length;
  // Pretty "1st Jan 2026" (ordinal day) from the ISO `from` date.
  var fromPretty=(function(iso){ var d=new Date(iso); if(isNaN(d)) return esc(iso);
    var day=d.getUTCDate(), mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()], yr=d.getUTCFullYear();
    var s=(day%10==1&&day!=11)?'st':(day%10==2&&day!=12)?'nd':(day%10==3&&day!=13)?'rd':'th';
    return day+s+' '+mon+' '+yr; })(from);
  var globeGlyph='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
  // Shift Report-style ORANGE hero title bar: icon + title left, a compact snapshot pill on the right.
  var html='<div class="cx-hero">'
    +'<div class="cx-hero-left">'
      +'<span class="cx-hero-ic">'+globeGlyph+'</span>'
      +'<span class="cx-hero-title">Incidents from each Country</span>'
      +'<span class="cx-hero-sub" title="Live \u2014 tickets created on/after '+esc(fromPretty)+'">FROM '+esc(fromPretty).toUpperCase()+'</span>'
    +'</div>'
    +'<div class="cx-hero-badge"><span class="n">'+totalTix+'</span><span class="l">'+totalCodes+' CODES</span></div>'
  +'</div>';
  if(!CX_SECS.length){ html+='<div class="cx-empty">No country codes found in ticket titles.</div>'; document.getElementById('wrap').innerHTML=html; return; }
  var lastRegion=null, regionSeq=-1;
  CX_SECS.forEach(function(a,idx){
    // Open a new collapsible REGION block whenever the region changes (sections are pre-ordered by
    // region). First region (NA) starts expanded; the rest start collapsed. Independent toggles.
    if(a.region!==lastRegion){
      if(lastRegion!==null){ html+='</div></div>'; }   // close previous region body + wrapper
      lastRegion=a.region; regionSeq++;
      var inRegion=CX_SECS.filter(function(x){ return x.region===a.region; });
      var rTix=inRegion.reduce(function(s,x){ return s+(Number(x.count)||0); },0);
      var collapsed=(regionSeq>0);
      var isClean=(a.region==='others');
      // Clean-ups region header gets an Export CSV button (stops the click from toggling the region).
      var exportBtn=isClean
        ? '<button type="button" class="cx-exp" onclick="cxCleanExport(event)" title="Download all Clean-ups tickets as CSV">'+ic('arrow-down',13)+' EXPORT CSV</button>'
        : '';
      html+='<div class="cx-region'+(collapsed?' collapsed':'')+'" id="cxRegion'+regionSeq+'">'
        +'<div class="cx-region-head" onclick="cxRegionToggle('+regionSeq+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();cxRegionToggle('+regionSeq+');}" role="button" tabindex="0">'
          +'<span class="cx-region-label-wrap"><span class="cx-region-label">'+esc(CX_REGION_LABEL[a.region]||a.region.toUpperCase())+'</span>'
            +'<span class="cx-region-sub">'+esc(CX_REGION_SUB[a.region]||'')+'</span></span>'
          +'<span class="cx-region-head-right"><span class="cx-region-meta">'+inRegion.length+' code'+(inRegion.length===1?'':'s')+' \u00b7 '+rTix+' tickets</span>'
          +exportBtn
          +'<span class="cx-region-caret">\u25be</span></span>'
        +'</div>'
        +'<div class="cx-region-body">';
      // CLEAN-UPS: render ONE consolidated table (CODE + the 5 columns) for every code in the region,
      // instead of a card per code. Build the flat row list (each ticket tagged with its code).
      if(isClean){
        CX_CLEAN.rows=[]; CX_CLEAN.shown=CX_PAGE0; CX_CLEAN.sortField='code'; CX_CLEAN.sortDir='asc';
        inRegion.forEach(function(sec){
          (sec.tickets||[]).forEach(function(t){
            CX_CLEAN.rows.push({ code:sec.tag, shortId:t.shortId, url:t.url, created:t.created, assignee:t.assignee, status:t.status, title:t.title });
          });
        });
        html+='<div id="cxCleanBody">'+cxCleanTableHtml()+'</div>';
      }
    }
    // CLEAN-UPS codes are already rendered in the single consolidated table above — skip per-code cards.
    if(a.region==='others'){ return; }
    var nm=cxNameOf(a.tag);
    var nameHtml=nm
      ? '<div class="cx-code-name" title="'+esc(nm)+'">'+esc(nm)+'</div>'
      : '<div class="cx-code-name none">Unrecognised code — shown as-is from the ticket title.</div>';
    html+='<div class="cx-sec" id="cxSec'+idx+'">'
      +'<div class="cx-sec-head" onclick="cxToggle('+idx+')">'
        +'<div class="cx-sec-title">'
          +'<span class="cx-code">'+esc(a.tag)+'</span>'+nameHtml
        +'</div>'
        +'<div class="cx-sec-head-right"><span class="cx-count">'+a.count+'</span><span class="cx-caret">\u25be</span></div>'
      +'</div>'
      +'<div class="cx-sec-body">'
        // CLEAN-UPS region: table only (no stat tiles, no "created per week" chart). Every other
        // region keeps the full stats + weekly chart + table.
        +(a.region==='others'
            ? ''
            : cxStatsHtml(a.tickets)
              +'<div class="cx-chart-title">'+esc(a.tag)+' \u2014 tickets created per week</div>'
              +'<div class="cx-chart-sub"><b style="color:#7dd3fc">'+esc(a.tag)+'</b> tickets created per week are the <b style="color:#7dd3fc">tall bars (left axis)</b>. <b style="color:#a78bfa">Pet</b> and <b style="color:#ff9f2e">non-pet</b> repeat incidents are bars, and <b style="color:#4ade80">combined repeat</b> is the line \u2014 all on the <b style="color:#4ade80">right axis</b>.</div>'
              +'<div class="chart-box"><div class="chart-wrap tall"><canvas id="cxCanvas'+idx+'"></canvas></div></div>')
        +'<div id="cxBody'+idx+'">'+cxSecTableHtml(idx)+'</div>'
      +'</div>'
    +'</div>';
  });
  if(lastRegion!==null){ html+='</div></div>'; }   // close the last region body + wrapper
  document.getElementById('wrap').innerHTML=html;
  // Country cards start collapsed (chart drawn on open via cxToggle); NA region open, rest collapsed.
}
// Expand/collapse a whole REGION block (NA / LATAM / APAC / MENA / Europe / Clean-ups). Accordion:
// only ONE region open at a time — opening one collapses all the others.
function cxRegionToggle(ri){
  var g=document.getElementById('cxRegion'+ri); if(!g) return;
  var willOpen=g.classList.contains('collapsed');
  // Collapse every region first, then open the clicked one if it was closed.
  document.querySelectorAll('.cx-region').forEach(function(r){ r.classList.add('collapsed'); });
  if(willOpen){ g.classList.remove('collapsed'); }
}

// Load from the live API. No static fallback file for this page — if the API is unreachable, show a gate.
(async function(){
  var live=null;
  try{
    var r=await A.api('GET','/api/countries-report');
    if(r&&r.ok&&r.data&&Array.isArray(r.data.sections)) live=r.data;
  }catch(e){ live=null; }
  if(live){ render(live); return; }
  gate('Could not load the countries report. The data service may be waking up — please try again in a moment.');
})();
</script>
