<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station Request Tickets · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252;--tl:#44b9d6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#000;border-radius:6px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.wrap{padding:32px 24px}
.sr-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sr-head h1{margin:0;color:#fff;font-size:1.7em;font-weight:700;display:inline-flex;align-items:center;gap:10px}
.sr-sub{color:var(--tm);font-size:.9em;line-height:1.55;margin:6px 0 26px;max-width:900px}
.sr-sub b{color:#fff}
/* Section card (collapsible accordion — only one open at a time) */
.sr-sec{background:#0a0a0a;border:1px solid var(--bd);border-radius:14px;margin-bottom:16px;overflow:hidden}
/* Clickable header row */
.sr-sec-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 22px;cursor:pointer;user-select:none;transition:background .15s}
.sr-sec-head:hover{background:rgba(255,255,255,.03)}
.sr-sec-head-left{display:flex;align-items:center;gap:10px;min-width:0}
.sr-sec-title{display:flex;align-items:center;gap:10px;color:#fff;font-size:1.12em;font-weight:700}
.sr-sec-title .num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:.8em;font-weight:800;flex-shrink:0}
.sr-sec-head-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.sr-caret{color:var(--tm);display:inline-flex;transition:transform .2s ease}
.sr-sec.open .sr-caret{transform:rotate(180deg)}
/* Collapsible body: animate max-height for a smooth open/close. */
.sr-sec-body{max-height:0;overflow:hidden;transition:max-height .28s ease;padding:0 22px}
.sr-sec.open .sr-sec-body{max-height:4000px;padding:0 22px 8px}
.sr-sec-desc{color:var(--tm);font-size:.82em;line-height:1.5;margin:2px 0 14px;max-width:820px}
.sr-count{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:30px;padding:0 12px;border-radius:20px;font-weight:800;font-size:.9em;flex-shrink:0}
/* Per-section accents */
.sr-sec.s1{border-top:3px solid var(--rl)}   .sr-sec.s1 .num{background:rgba(255,82,82,.16);color:var(--rl)}   .sr-sec.s1 .sr-count{background:rgba(255,82,82,.14);color:var(--rl);border:1px solid rgba(255,82,82,.35)}
.sr-sec.s2{border-top:3px solid var(--gl)}   .sr-sec.s2 .num{background:rgba(74,222,128,.16);color:var(--gl)} .sr-sec.s2 .sr-count{background:rgba(74,222,128,.14);color:var(--gl);border:1px solid rgba(74,222,128,.35)}
.sr-sec.s3{border-top:3px solid var(--tl)}   .sr-sec.s3 .num{background:rgba(68,185,214,.16);color:var(--tl)} .sr-sec.s3 .sr-count{background:rgba(68,185,214,.14);color:var(--tl);border:1px solid rgba(68,185,214,.35)}
/* Table */
.sr-tbl-wrap{overflow-x:auto;border-radius:8px;margin-bottom:14px}
.sr-tbl{width:100%;border-collapse:collapse;font-size:.86em;min-width:720px}
.sr-tbl th,.sr-tbl td{border:1px solid #223040;padding:9px 12px;text-align:left;vertical-align:top}
.sr-tbl thead th{background:#111820;color:var(--tm);text-transform:uppercase;font-size:.72em;letter-spacing:.5px;font-weight:700;white-space:nowrap}
.sr-tbl tbody tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.sr-tbl tbody tr:hover td{background:rgba(255,153,0,.05)}
.sr-idlink{color:#44b9d6;text-decoration:none;font-weight:700;white-space:nowrap}
.sr-idlink:hover{text-decoration:underline}
.sr-title{color:var(--t);max-width:520px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sr-status{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.82em;font-weight:700;background:rgba(255,153,0,.14);color:var(--o);white-space:nowrap}
.sr-num{color:#879596;font-weight:700;text-align:center;white-space:nowrap}
.sr-empty{color:#5f6b6c;font-size:.86em;font-style:italic;padding:14px 4px}
/* Skeleton shimmer (shown per-section until its request lands). */
.sk{position:relative;overflow:hidden;background:#141a20;border-radius:5px;display:inline-block;vertical-align:middle}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:sksh 1.2s infinite}
@keyframes sksh{100%{transform:translateX(100%)}}
.sr-count.sk{min-width:40px;height:30px;border-radius:20px}
.sr-sec-err{color:var(--rl);font-size:.85em;padding:12px 4px}
.sr-sec-err a{color:var(--o);cursor:pointer;text-decoration:underline}
.sr-gate,.sr-loading{background:#0a0a0a;border:1px solid var(--bd);border-radius:14px;padding:40px;text-align:center;color:var(--tm)}
.sr-gate h1{color:#fff;font-size:1.4em;margin-bottom:10px}
.spinner{width:34px;height:34px;border:3px solid #2a2a2a;border-top-color:var(--o);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{100%{transform:rotate(360deg)}}
.wrap,.content{width:auto!important;max-width:none!important;margin-left:15px!important;margin-right:15px!important}
</style>
</head>
<body data-nav-active="station-request" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap">
  <div class="sr-loading"><div class="spinner"></div>Loading station requests…</div>
</div>
<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js"></script>
<script>
const A=window.PHDAuth;
const ic=(n,s)=>window.icon?window.icon(n,s||14):'';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gate(msg){document.getElementById('wrap').innerHTML='<div class="sr-gate"><h1>Station Request Tickets</h1><p>'+esc(msg)+'</p><p style="margin-top:16px"><a class="btn" href="app.html">Back to the live dashboard</a></p></div>';}
function fmtDate(iso){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return esc(String(iso)); return d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'}); }

// The three sections: id = the ?section= value the server expects; sid = DOM id suffix.
const SECTIONS=[
  { id:'raised-not-fulfilled', cls:'s1', num:'1', title:'Raised but NOT fulfilled',
    desc:'Label has <b>"Station Request"</b> or <b>"Address Exclusion"</b>, but the root cause details do <b>not</b> contain the word "address".', open:true },
  { id:'raised-fulfilled', cls:'s2', num:'2', title:'Raised and fulfilled',
    desc:'Label has <b>"Station Request"</b> or <b>"Address Exclusion"</b>, and the root cause details <b>contain</b> the word "address".', open:false },
  { id:'not-raised-fulfilled', cls:'s3', num:'3', title:'Not raised, still fulfilled',
    desc:'Label does <b>not</b> have "Station Request" or "Address Exclusion", but the root cause details <b>contain</b> the word "address".', open:false },
];

// The full ticket table for a loaded section.
function sectionTable(rows){
  if(!rows||!rows.length) return '<div class="sr-empty">No tickets in this section.</div>';
  var body=rows.map(function(t,i){
    var sid=esc(t.shortId||'');
    var link=t.url?('<a class="sr-idlink" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+sid+'</a>'):sid;
    return '<tr>'+
      '<td class="sr-num">'+(i+1)+'</td>'+
      '<td>'+link+'</td>'+
      '<td class="sr-title" title="'+esc(t.title)+'">'+esc(t.title)+'</td>'+
      '<td><span class="sr-status">'+esc(t.status||'—')+'</span></td>'+
      '<td style="white-space:nowrap">'+fmtDate(t.createDate)+'</td>'+
      '<td>'+esc(t.assignee||'—')+'</td>'+
    '</tr>';
  }).join('');
  return '<div class="sr-tbl-wrap"><table class="sr-tbl"><thead><tr>'+
    '<th style="width:1%">#</th><th>Ticket</th><th>Title</th><th>Status</th><th>Created</th><th>Assignee</th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>';
}

// A skeleton table (fixed placeholder rows) shown until a section's own request lands.
function skeletonTable(){
  var w=[160,120,90,60,110];
  var rows='';
  for(var i=0;i<6;i++){
    rows+='<tr>'+
      '<td class="sr-num"><span class="sk" style="width:14px;height:12px"></span></td>'+
      '<td><span class="sk" style="width:96px;height:12px"></span></td>'+
      '<td><span class="sk" style="width:'+(360-i*30)+'px;max-width:60vw;height:12px"></span></td>'+
      '<td><span class="sk" style="width:70px;height:20px;border-radius:20px"></span></td>'+
      '<td><span class="sk" style="width:84px;height:12px"></span></td>'+
      '<td><span class="sk" style="width:'+w[i%w.length]+'px;max-width:40vw;height:12px"></span></td>'+
    '</tr>';
  }
  return '<div class="sr-tbl-wrap"><table class="sr-tbl"><thead><tr>'+
    '<th style="width:1%">#</th><th>Ticket</th><th>Title</th><th>Status</th><th>Created</th><th>Assignee</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

// The section SHELL — hardcoded skeleton painted instantly; count + body fill in when the request lands.
function sectionShell(s){
  return '<div class="sr-sec '+s.cls+(s.open?' open':'')+'" id="sec-'+s.id+'">'+
    '<div class="sr-sec-head" onclick="toggleSection(this)" role="button" tabindex="0" aria-expanded="'+(s.open?'true':'false')+'">'+
      '<div class="sr-sec-head-left"><div class="sr-sec-title"><span class="num">'+s.num+'</span> '+esc(s.title)+'</div></div>'+
      '<div class="sr-sec-head-right"><span class="sr-count sk" id="count-'+s.id+'">&nbsp;</span><span class="sr-caret">\u25be</span></div>'+
    '</div>'+
    '<div class="sr-sec-body">'+
      '<div class="sr-sec-desc">'+s.desc+'</div>'+
      '<div id="body-'+s.id+'">'+skeletonTable()+'</div>'+
    '</div>'+
  '</div>';
}

// Accordion: open the clicked section, collapse the others (only one open at a time).
function toggleSection(head){
  var sec=head.closest('.sr-sec'); if(!sec) return;
  var willOpen=!sec.classList.contains('open');
  document.querySelectorAll('.sr-sec').forEach(function(s){
    s.classList.remove('open');
    var h=s.querySelector('.sr-sec-head'); if(h) h.setAttribute('aria-expanded','false');
  });
  if(willOpen){ sec.classList.add('open'); head.setAttribute('aria-expanded','true'); }
}
window.toggleSection=toggleSection;

// Fetch ONE section and fill its count + body. Own request so the 3 load in parallel.
async function loadSection(s){
  var countEl=document.getElementById('count-'+s.id);
  var bodyEl=document.getElementById('body-'+s.id);
  var r;
  try{ r=await A.api('GET','/api/station-requests?section='+encodeURIComponent(s.id)); }catch(e){ r=null; }
  if(!r||!r.ok||!r.data){
    if(countEl){ countEl.classList.remove('sk'); countEl.textContent='—'; }
    if(bodyEl){ bodyEl.innerHTML='<div class="sr-sec-err">Could not load this section. <a onclick="reloadSection(\''+s.id+'\')">Retry</a></div>'; }
    return;
  }
  var tickets=r.data.tickets||[];
  if(countEl){ countEl.classList.remove('sk'); countEl.textContent=tickets.length; }
  if(bodyEl){ bodyEl.innerHTML=sectionTable(tickets); }
}
function reloadSection(id){
  var s=SECTIONS.find(function(x){return x.id===id;}); if(!s) return;
  var bodyEl=document.getElementById('body-'+id); if(bodyEl) bodyEl.innerHTML=skeletonTable();
  var countEl=document.getElementById('count-'+id); if(countEl){ countEl.classList.add('sk'); countEl.innerHTML='&nbsp;'; }
  loadSection(s);
}
window.reloadSection=reloadSection;

function load(){
  if(!A.getUser()||!A.getToken()){ gate('This page is for logged-in admins. Log in from the Live Dashboard first.'); return; }
  if(!(A.atLeast&&A.atLeast('admin'))){ gate('Admin access is required to view Station Request analysis.'); return; }
  // 1) Paint the hardcoded skeleton (header + 3 section shells) INSTANTLY.
  var html='<div class="sr-head"><h1>'+ic('map-pin',22)+' Station Request Tickets</h1></div>'+
    '<p class="sr-sub">Tickets <b>created on or after 2026-04-01</b>, grouped by whether a Station Request / Address Exclusion label was raised and whether the root cause details mention an <b>address</b>. Older tickets are ignored.</p>'+
    SECTIONS.map(sectionShell).join('');
  document.getElementById('wrap').innerHTML=html;
  // 2) Fire all 3 section requests IN PARALLEL — each fills its own section as it returns.
  SECTIONS.forEach(loadSection);
}

document.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
