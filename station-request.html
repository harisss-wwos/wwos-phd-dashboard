<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station Request Tickets · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: keep the page hidden until topbar-auth.js has injected its styles AND built the
     nav-rail + profile column, so the chrome is present on the FIRST paint (no flash-in). The class
     is cleared by topbar-auth after the chrome builds; a failsafe timer clears it if the script
     never runs (offline) so the page can never stay hidden. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<!-- Keep the section hidden until the shared chrome (title bar + menu column) has wrapped it. -->
<style>#wrap{visibility:hidden}#tbHomeChrome #wrap,html.tb-wrap-timeout #wrap{visibility:visible}</style>
<script>setTimeout(function(){document.documentElement.classList.add('tb-wrap-timeout');},8000);</script>
<noscript><style>#wrap{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.wrap{padding:32px 24px;width:auto;max-width:none;margin:0}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
<style id="srp-light">
/* Station Requests — same visual language as Errors in Resolved: dark navy hero with an orange rule,
   white KPI cards overlapping it, then white section cards with chevron expanders. Everything is
   scoped under .srp (a size container, so the grids respond to the content column, not the window). */
#wrap.wrap{padding-top:0!important;padding-bottom:28px!important}
.srp{--ink:#1b2026;--mut:#5c6773;--line:#e2e6ea;--soft:#f5f6f8;--acc:#ec7211;--acc-bg:#fff3e8;--acc-ink:#9a4100;
  --red:#b42318;--red-bg:#fdecec;--blue:#2f5fcc;--blue-bg:#eaf0fd;--teal:#0b7f75;--teal-bg:#e2f5f2;--focus:#b5530a;
  container-type:inline-size;color:var(--ink)}
.srp button{font:inherit;text-transform:none}
.srp :is(button,a,input,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.srp-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.srp-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 80px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.srp-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.srp-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.srp-hero-in{position:relative;display:flex;gap:20px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.srp-hero-main{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1 1 380px}
.srp-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.srp-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.srp-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.05}
.srp-hero-sub{margin-top:9px;max-width:64ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.82)}
.srp-chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:14px 0 0;padding:0}
.srp-chips li{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:.76em;font-weight:700;
  color:#e9edf3;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.srp-chips li svg{color:#ffb26b;flex-shrink:0}
.srp-meta{display:grid;grid-template-columns:repeat(3,minmax(0,auto));gap:10px 26px;margin:0;padding:13px 16px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);max-width:100%}
.srp-meta dt{font-size:.64em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:rgba(233,237,243,.66)}
.srp-meta dd{margin:4px 0 0;font-size:.9em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
@container (max-width:560px){
  .srp-hero{padding:20px 18px 74px 22px}
  .srp-hero h1{font-size:1.6em}
  .srp-hero-ic{width:40px;height:40px;border-radius:10px}
  .srp-meta{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
}

/* ---- KPI row (overlaps the hero) ---- */
.srp-kpis{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,168px),1fr));gap:12px;margin:-56px 18px 16px}
@container (max-width:560px){.srp-kpis{margin:-52px 10px 14px;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.srp-kpi:last-child{grid-column:1/-1}}
.srp-kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.srp-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#c4ccd4)}
.srp-kpi-l{display:flex;align-items:center;gap:9px;font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.srp-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--kb,var(--soft));color:var(--ki,#3a4552)}
.srp-kpi-v{margin-top:12px;font-size:2.3em;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--kv,var(--ink))}
.srp-kpi-s{margin-top:7px;font-size:.82em;font-weight:600;color:var(--mut)}
.srp-kpi-s b{color:var(--ink);font-weight:800}
.srp-kpi-bar{margin-top:10px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.srp-kpi-bar i{display:block;height:100%;border-radius:inherit;background:var(--k)}
@container (max-width:560px){.srp-kpi{padding:13px 14px}.srp-kpi-v{font-size:1.8em}.srp-kpi-l{font-size:.64em;letter-spacing:.8px}}
.srp-kpi.is-base{--k:#1f2a40}
.srp-kpi.is-bad{--k:#d92d20;--kb:var(--red-bg);--ki:var(--red);--kv:var(--red)}
.srp-kpi.is-blue{--k:#3b6fe0;--kb:var(--blue-bg);--ki:var(--blue);--kv:var(--blue)}
.srp-kpi.is-good{--k:#0d9488;--kb:var(--teal-bg);--ki:var(--teal);--kv:var(--teal)}
.srp-kpi.is-warn{--k:var(--acc);--kb:var(--acc-bg);--ki:#b5530a}

/* ---- Section cards (accordion: one open at a time) ---- */
.srp .sr-sec{background:#fff!important;border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:0 2px 10px -6px rgba(20,30,50,.18)!important;margin:0 0 16px}
.srp-sec-top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:14px 20px}
.srp .sr-sec.open .srp-sec-top{border-bottom:1px solid var(--line)}
.srp-sec-top h2{flex:1 1 320px;min-width:0;margin:0;font-size:1em}
.srp .sr-sec-head{display:flex;align-items:center;gap:12px;width:100%;margin:-4px -6px;padding:4px 6px;border:none;border-radius:9px;background:none;color:var(--ink);text-align:left;cursor:pointer}
.srp .sr-sec-head:hover{background:#fafbfc}
.srp .sr-sec-head:hover .srp-chev{background:#e6f0fc;color:#2b66c1}
.srp-chev{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;color:#6b7280}
.srp-chev svg{transition:transform .15s}
.srp .sr-sec-head[aria-expanded="true"] .srp-chev svg,.srp .hr-sub-head[aria-expanded="true"] .srp-chev svg{transform:rotate(90deg)}
.srp-sec-ic{flex-shrink:0;width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--si-bg,var(--soft));color:var(--si,#3a4552)}
.srp .s-chart{--si:var(--blue);--si-bg:var(--blue-bg)}
.srp .s-country{--si:var(--teal);--si-bg:var(--teal-bg)}
.srp-sec-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.srp-sec-name{font-size:1.14em;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.srp-sec-sub{font-size:.82em;font-weight:500;color:var(--mut);line-height:1.4}
.srp .sr-sec-body{padding:18px 20px 20px}
.srp .sr-sec:not(.open) .sr-sec-body{display:none}
@container (max-width:560px){.srp-sec-top{padding:12px 14px}.srp .sr-sec-body{padding:14px}}
.srp-legend{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.srp-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.78em;font-weight:700;color:#3a4552;white-space:nowrap}
.srp-pill i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.srp-pill b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.srp-hint{font-size:.82em;color:var(--mut);line-height:1.5;margin:0 0 10px}

/* ---- Chart ---- */
.srp-chart-scroll{overflow-x:auto;overflow-y:visible;padding-bottom:2px}
.srp .sr-chart-wrap{position:relative;width:100%;min-width:560px}
.srp .sr-chart-svg{width:100%;height:auto;max-height:300px;display:block;overflow:visible}
.sr-chart-svg .grid{stroke:#eef1f4;stroke-width:1}
.sr-chart-svg .axis{stroke:#d4dce4;stroke-width:1}
.sr-chart-svg .axlbl{fill:#5c6773;font-size:11px;font-weight:600}
.sr-chart-svg .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sr-chart-svg .ln.l1{stroke:#e5484d}.sr-chart-svg .ln.l2{stroke:#3b6fe0}.sr-chart-svg .ln.l3{stroke:#0d9488}
.sr-chart-svg .pt{stroke:#fff;stroke-width:2}
.sr-chart-svg .pt.l1{fill:#e5484d}.sr-chart-svg .pt.l2{fill:#3b6fe0}.sr-chart-svg .pt.l3{fill:#0d9488}
.sr-chart-svg .hit{fill:transparent;cursor:pointer;outline:none}
.sr-chart-svg .hit:focus-visible{fill:rgba(236,114,17,.07);stroke:#b5530a;stroke-width:2}
.sr-chart-svg .ptlbl{font-size:11px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.sr-chart-svg .ptlbl.l1{fill:#c4282d}.sr-chart-svg .ptlbl.l2{fill:#2f5fcc}.sr-chart-svg .ptlbl.l3{fill:#0b7f75}
.sr-chart-svg .vline{stroke:rgba(20,40,70,.22);stroke-width:1;stroke-dasharray:3 3;visibility:hidden}
.srp .sr-chart-tip{position:absolute;pointer-events:none;z-index:5;min-width:240px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  box-shadow:0 14px 34px -16px rgba(20,40,70,.4);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-size:.82em}
.srp .sr-chart-tip.show{opacity:1;transform:none}
.sr-chart-tip .tt-m{font-weight:800;color:var(--ink);margin-bottom:7px}
.sr-chart-tip .tt-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:2px 0;color:var(--mut)}
.sr-chart-tip .tt-row .k{display:inline-flex;align-items:center;gap:6px}
.sr-chart-tip .tt-row .k i{width:9px;height:9px;border-radius:50%;display:inline-block}
.sr-chart-tip .tt-row .v{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.sr-chart-tip .tt-pct{color:var(--mut);font-weight:800}
.sr-chart-tip .tt-sep{height:1px;background:#eef1f4;margin:7px 0}
.sr-chart-tip .tt-pct-lbl{color:var(--mut);font-size:.9em;font-weight:600;margin-bottom:3px}

/* ---- Country view controls ---- */
.srp .np-controls{display:flex;align-items:flex-end;gap:12px 22px;flex-wrap:wrap;margin-bottom:16px;padding:12px 14px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.srp-fs{border:0;margin:0;padding:0;min-width:0}
.srp-fs legend{padding:0;margin-bottom:6px;font-size:.66em;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
.srp .np-seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:10px;background:#e7eaee}
.srp .np-seg-opt{position:relative;display:inline-flex;cursor:pointer;user-select:none}
.srp .np-seg-opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.srp .np-seg-opt span{display:inline-flex;align-items:center;padding:7px 14px;border-radius:8px;font-size:.84em;font-weight:700;color:#3a4552;white-space:nowrap;transition:background .14s,color .14s}
.srp .np-seg-opt:hover span{color:var(--ink)}
.srp .np-seg-opt input:checked+span{background:#fff;color:var(--acc-ink);box-shadow:0 1px 3px rgba(20,30,50,.2),inset 0 -2px 0 var(--acc)}
.srp .np-seg-opt input:focus-visible+span{outline:3px solid var(--focus);outline-offset:1px}
.srp .np-checks{display:flex;flex-wrap:wrap;gap:8px}
.srp .np-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid #d4dade;border-radius:99px;background:#fff;font-size:.84em;font-weight:700;color:#3a4552;cursor:pointer;user-select:none}
.srp .np-chip input{appearance:none;-webkit-appearance:none;position:relative;flex-shrink:0;width:16px;height:16px;margin:0;border:1.5px solid #8793a0!important;border-radius:4px;background:#fff!important;box-shadow:none!important;cursor:pointer}
.srp .np-chip input:checked{background:var(--acc)!important;border-color:var(--acc)!important}
.srp .np-chip input:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.srp .np-chip:has(input:checked){background:var(--acc-bg);border-color:#f7c99c;color:var(--acc-ink)}
.srp-ctl-hint{flex:1 1 220px;margin:0;font-size:.8em;color:var(--mut);line-height:1.45;align-self:center}

/* ---- Country / State / Station expanders ---- */
.srp .hr-sub{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.srp .hr-sub:last-child{margin-bottom:0}
.srp .hr-sub.open{border-color:#cfd6dd;box-shadow:0 12px 26px -22px rgba(20,30,50,.6)}
.srp .hr-sub-head{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 14px;border:none;background:#fff;color:var(--ink);text-align:left;cursor:pointer}
.srp .hr-sub-head:hover{background:#fafbfc}
.srp .hr-sub-head:hover .srp-chev{background:#e6f0fc;color:#2b66c1}
.srp .hr-sub.open>.hr-sub-head{background:#f7f8fa;border-bottom:1px solid var(--line)}
.srp .hr-sub-head:focus-visible{outline-offset:-3px}
.srp .hr-sub-ic{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:#3a4552;border:1px solid var(--line)}
.srp .sr-country>.hr-sub-head .hr-sub-ic{background:var(--teal-bg);color:var(--teal);border-color:#b9e3dd}
.srp .hr-sub-title{flex:1 1 auto;min-width:0;font-size:.95em;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srp .hr-sub-meta{flex-shrink:0;margin-left:auto;padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.78em;font-weight:700;color:#3a4552;white-space:nowrap;font-variant-numeric:tabular-nums}
.srp .hr-sub-meta b{font-weight:800;color:var(--ink)}
.srp .hr-sub-body{display:none;padding:12px 14px 14px}
.srp .hr-sub.open>.hr-sub-body{display:block}
.srp .sr-sub2,.srp .sr-sub2>.hr-sub-head{background:#fbfcfd}
@container (max-width:560px){.srp .hr-sub-head{gap:9px;padding:8px 10px}.srp .hr-sub-body{padding:8px 6px}.srp .hr-sub-ic{display:none}}

/* ---- Search + pager ---- */
.srp .sr-search{display:flex;align-items:center;gap:9px;max-width:360px;height:38px;margin:0 0 12px;padding:0 12px;background:#fff;border:1px solid #d4dade;border-radius:8px;transition:border-color .15s,box-shadow .15s}
.srp .sr-search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px rgba(236,114,17,.2)}
.srp .sr-search-ic{display:inline-flex;color:#6b7280;flex-shrink:0}
.srp .sr-search input{flex:1;min-width:0;height:100%;padding:0;font:inherit;font-size:.88em;color:var(--ink)!important;background:transparent!important;border:0!important;box-shadow:none!important;outline:none}
.srp .sr-search input:focus-visible{outline:none}
.srp .sr-pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 4px 2px;flex-wrap:wrap}
.srp .sr-pg-info{color:var(--mut);font-size:.8em;font-weight:700;font-variant-numeric:tabular-nums}

/* ---- Buttons ---- */
.srp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border:1px solid transparent;border-radius:8px;background:#c4580b;color:#fff;
  font-size:.86em;font-weight:800;line-height:1.2;cursor:pointer;text-decoration:none;transition:background .15s,box-shadow .15s,transform .15s}
.srp-btn:hover{background:#a84a08;box-shadow:0 8px 18px -10px rgba(196,88,11,.8)}
.srp-btn:active{transform:translateY(1px)}
.srp-btn[aria-busy="true"]{cursor:progress;opacity:.85}
.srp-btn .phd-spin.sm{border-color:rgba(255,255,255,.4);border-top-color:#fff}
.srp-ghost{background:#fff;color:var(--ink);border-color:#d4dade}
.srp-ghost:hover:not(:disabled){background:#fff;border-color:var(--acc);color:var(--acc-ink);box-shadow:none}
.srp-ghost:disabled{opacity:.45;cursor:default}
.srp .sr-pg-btn{padding:7px 14px;font-size:.82em}

/* ---- Ticket tables (sticky headers, hover rows) ---- */
.srp .np-tablewrap{overflow:auto;max-height:440px;border:1px solid var(--line);border-radius:8px;background:#fff}
.srp .np-tbl{width:100%;min-width:680px;border-collapse:separate;border-spacing:0;font-size:.85em;table-layout:fixed}
.srp .np-tbl th,.srp .np-tbl td{padding:9px 12px;text-align:left;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0!important;border-bottom:1px solid #eef1f4!important}
.srp .np-tbl thead th{position:sticky;top:0;z-index:1;background:#f5f6f8!important;color:var(--mut)!important;font-size:.72em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;border-bottom:1px solid var(--line)!important}
.srp .np-tbl tbody tr:last-child td{border-bottom:0!important}
.srp .np-tbl tbody tr:hover td{background:#fff7ed!important}
.srp .np-tbl .np-c{text-align:center}
.srp .np-id{color:#2b66c1;font-weight:800;text-decoration:none}
.srp .np-id:hover{text-decoration:underline}
.srp .np-title{color:#2a3340!important}
.srp .np-hi{display:inline-flex;align-items:center;justify-content:center;min-width:30px;padding:2px 8px;border-radius:99px;background:var(--acc-bg);border:1px solid #f7c99c;color:var(--acc-ink);font-weight:800;font-variant-numeric:tabular-nums}
.srp .np-phd{display:inline-flex;margin-left:6px;padding:1px 6px;border-radius:5px;font-size:.72em;font-weight:800;letter-spacing:.4px;color:#136b67;background:#d2f0ee;border:1px solid #9fd9d4;vertical-align:middle}
.srp .sr-empty{padding:16px 4px;color:var(--mut);font-size:.88em}

/* Legacy agent-table styles (kept for the agent-grouped renderer). */
.srp .sr-agent{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:#fff}
.srp .sr-agent-head{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:none;background:#fff;color:var(--ink);text-align:left;cursor:pointer}
.srp .sr-agent-head:hover{background:#fafbfc}
.srp .sr-agent-name{font-weight:800}.srp .sr-agent-name .sub{margin-left:8px;color:var(--mut);font-weight:500;font-size:.85em}
.srp .sr-agent-meta{margin-left:auto;display:inline-flex;align-items:center;gap:10px}
.srp .sr-agent-count{padding:2px 11px;border-radius:99px;background:var(--acc-bg);border:1px solid #f7c99c;color:var(--acc-ink);font-weight:800}
.srp .sr-agent-body{display:none}.srp .sr-agent.open .sr-agent-body{display:block}
.srp .sr-agent.open .sr-a-caret{transform:rotate(180deg)}
.srp .sr-tbl-wrap{overflow-x:auto}
.srp .sr-tbl{width:100%;border-collapse:collapse;font-size:.86em}
.srp .sr-tbl th,.srp .sr-tbl td{padding:9px 12px;border-bottom:1px solid #eef1f4!important;text-align:left}
.srp .sr-tbl th.sr-sort{cursor:pointer;user-select:none}
.srp .sr-sort-ar{margin-left:7px;color:var(--acc)}.srp .sr-sort-ar.idle{color:#8793a0}
.srp .sr-idlink{color:#2b66c1;font-weight:800;text-decoration:none}
.srp .sr-title-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.srp .sr-title-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srp .sr-tag{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:99px;font-size:.72em;font-weight:800}
.srp .sr-tag.c{color:#1a7a43;background:#e5f5ec;border:1px solid #bfe6cf}
.srp .sr-tag.r{color:#0b7f75;background:#e2f5f2;border:1px solid #b9e3dd}
.srp .sr-tag.o{color:#5c6773;background:#f0f3f6;border:1px solid var(--line)}
.srp .sr-phd{display:inline-flex;margin-left:8px;padding:1px 7px;border-radius:5px;font-size:.66em;font-weight:800;color:#136b67;background:#d2f0ee;border:1px solid #9fd9d4}
.srp .sr-more{display:flex;justify-content:center;align-items:center;gap:10px;padding:12px}
.srp .sr-more button{padding:7px 14px;border:1px solid #d4dade;border-radius:8px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}
.srp .sr-more .sr-mcount{color:var(--mut);font-size:.8em}

/* ---- States: empty / error / gate ---- */
.srp-state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 20px;text-align:center;color:var(--mut)}
.srp-state-ic{width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:4px;background:#eef1f4;color:#5c6773}
.srp-state-ic.is-err{background:var(--red-bg);color:var(--red)}
.srp-state-t{font-size:1.06em!important;font-weight:800;color:var(--ink)!important}
.srp-state p{font-size:.9em;max-width:54ch;line-height:1.5}
.srp-state .srp-btn{margin-top:6px}
.srp-gate{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18)}

/* ---- Skeletons (shimmer; static under prefers-reduced-motion) ---- */
.srp-skel{display:block;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:srpShim 1.4s ease infinite}
.srp-skel-d{display:inline-block;vertical-align:middle;background:linear-gradient(90deg,rgba(255,255,255,.1) 25%,rgba(255,255,255,.2) 40%,rgba(255,255,255,.1) 60%);background-size:400% 100%}
@keyframes srpShim{0%{background-position:100% 0}100%{background-position:0 0}}
.srp-chart-sk{display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:250px 12px;gap:10px 10px;padding-top:6px}
.srp-sk-y{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding:2px 0}
.srp-sk-y span{width:20px;height:9px}
.srp-sk-plot{display:flex;align-items:flex-end;gap:clamp(6px,2.4cqi,22px);padding:0 6px;border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(to top,transparent 0 49px,#f0f2f5 49px 50px)}
.srp-sk-bar{flex:1;border-radius:6px 6px 0 0}
.srp-sk-x{grid-column:2;display:flex;gap:clamp(6px,2.4cqi,22px);padding:0 6px}
.srp-sk-x span{flex:1;height:9px}
.srp-sk-row{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:#fff}
.srp-sk-row:last-child{margin-bottom:0}

/* One orchestrated entrance on first paint: hero, KPI cards (staggered), then the sections. */
@keyframes srpUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.srp.is-anim .srp-hero{animation:srpUp .45s ease both}
.srp.is-anim .srp-kpi{animation:srpUp .5s ease both}
.srp.is-anim .srp-kpi:nth-child(1){animation-delay:.06s}
.srp.is-anim .srp-kpi:nth-child(2){animation-delay:.11s}
.srp.is-anim .srp-kpi:nth-child(3){animation-delay:.16s}
.srp.is-anim .srp-kpi:nth-child(4){animation-delay:.21s}
.srp.is-anim .srp-kpi:nth-child(5){animation-delay:.26s}
.srp.is-anim .sr-sec{animation:srpUp .5s ease .3s both}
@media (prefers-reduced-motion:reduce){
  .srp *,.srp *::before,.srp *::after{animation:none!important;transition:none!important}
}
</style>

<body data-nav-active="station-request" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap">
  <div class="srp" aria-busy="true"><div class="phd-load" role="status"><span class="phd-spin"></span> Loading station requests…</div></div>
</div>
<script src="icons.js?v=2"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=224"></script>
<script>
const A=window.PHDAuth;
const ic=(n,s)=>window.icon?window.icon(n,s||14):'';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
var CHEV='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function fmtN(n){ return (Number(n)||0).toLocaleString('en-US'); }
// Percentage text: one decimal below 10% (so 0.4% does not read as 0%), whole numbers above.
function pct(n,d){ if(!d) return '0%'; var p=n/d*100; return (p>0&&p<10?p.toFixed(1).replace(/\.0$/,''):String(Math.round(p)))+'%'; }
// Polite live region (lives in the page shell, outside every re-rendered area).
function srAnnounce(msg){ var l=document.getElementById('srpLive'); if(l){ l.textContent=''; setTimeout(function(){ l.textContent=msg; },30); } }
// Friendly message for a failed A.api() response.
function srErrMsg(r,fallback){
  if(r&&r.status===401) return 'Your session has expired. Please log in again.';
  return (r&&r.data&&r.data.error)||fallback;
}
// Empty / error / gate panel.
function stateHtml(icCls,icon,title,text,btn){
  return '<div class="srp-state"><span class="srp-state-ic '+icCls+'">'+ic(icon,26)+'</span><h3 class="srp-state-t">'+title+'</h3>'+(text?'<p>'+text+'</p>':'')+(btn||'')+'</div>';
}
function retryBtn(kind){ return '<button type="button" class="srp-btn" data-retry="'+kind+'">'+ic('refresh',14)+'<span>Retry</span></button>'; }
function gate(msg){document.getElementById('wrap').innerHTML='<div class="srp"><section class="srp-gate">'+stateHtml('','lock','Station Request Tickets',esc(msg),'<a class="srp-btn" href="app.html">Back to the live dashboard</a>')+'</section></div>';}
function fmtDate(iso){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return esc(String(iso)); return d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'}); }
// C/R tag: C = Closed, R = Resolved, else first letter.
function statusTag(s){
  var v=String(s||'').toLowerCase();
  if(v==='closed')return '<span class="sr-tag c" title="Closed">C</span>';
  if(v==='resolved')return '<span class="sr-tag r" title="Resolved">R</span>';
  return '<span class="sr-tag o" title="'+esc(s||'')+'">'+esc((s||'?').charAt(0).toUpperCase())+'</span>';
}
// Friendly display names for known service/identity IDs (raw GUIDs shown otherwise).
var AGENT_ALIASES={
  '2e149df1-1efd-4261-bca4-27184085f593':'PHD-IN-Support',
  '0d1616c8-bcb7-4450-8bc5-f0a296bc01d1':'lm-cap'
};
function displayAgent(name){ var k=String(name==null?'':name).trim().toLowerCase(); return AGENT_ALIASES[k]||name; }
// Registered PHD users (lowercase logins) from /api/user-roles — agents in this set get a PHD tag.
var SR_USERS=null;
var SR_ROSTER_STATE='idle', SR_ROSTER_P=null;
function isPhdUser(name){ return !!(SR_USERS && SR_USERS.has(String(name||'').trim().toLowerCase())); }
function phdTag(name){ return isPhdUser(name)?'<span class="sr-phd" title="Registered PHD user">PHD</span>':''; }
// Per-agent pagination + sort state, keyed by a global index. shown starts at 20 (+10 each).
var SR_AGENTS=[]; var SR_PAGE0=20, SR_STEP=10;
function srArrow(a,field){
  if(a.sortField!==field) return '<span class="sr-sort-ar idle">\u21c5</span>';
  return a.sortDir==='desc'?'<span class="sr-sort-ar">\u25bc</span>':'<span class="sr-sort-ar">\u25b2</span>';
}
// Build one agent's ticket table (sortable Created + Show more/less) for agent #idx.
function srAgentTableHtml(idx){
  var a=SR_AGENTS[idx]; if(!a) return '';
  var field=a.sortField||'created', dir=a.sortDir||'desc';
  var tix=(a.tickets||[]).slice().sort(function(x,y){
    var vx=new Date(x.createDate||0).getTime()||0, vy=new Date(y.createDate||0).getTime()||0;
    return dir==='desc'?(vy-vx):(vx-vy);
  });
  var total=tix.length;
  var shown=Math.min(a.shown||SR_PAGE0, total);
  var rows=tix.slice(0,shown).map(function(t){
    var sid=esc(t.shortId||'');
    var link=t.url?('<a class="sr-idlink" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+sid+'</a>'):sid;
    return '<tr>'+
      '<td class="sr-fit" style="text-align:center">'+link+'</td>'+
      '<td style="white-space:nowrap;text-align:center">'+fmtDate(t.createDate)+'</td>'+
      '<td class="sr-title"><span class="sr-title-wrap">'+statusTag(t.status)+'<span class="sr-title-txt" title="'+esc(t.title)+'">'+esc(t.title||'—')+'</span></span></td>'+
    '</tr>';
  }).join('');
  var remaining=total-shown;
  var footer='';
  if(total>SR_PAGE0){
    footer='<div class="sr-more">';
    if(remaining>0){ footer+='<button type="button" onclick="srShowMore('+idx+')">\u25be Show more <span class="sr-mcount">(+'+Math.min(SR_STEP,remaining)+', '+remaining+' left)</span></button>'; }
    if(shown>SR_PAGE0){ footer+='<button type="button" onclick="srShowLess('+idx+')">\u25b4 Show less</button>'; }
    footer+='<span class="sr-mcount">Showing '+shown+' of '+total+'</span></div>';
  }
  return '<div class="sr-tbl-wrap"><table class="sr-tbl" style="min-width:0"><thead><tr>'+
      '<th scope="col" class="sr-fit" style="text-align:center">Ticket</th>'+
      '<th scope="col" class="sr-sort" onclick="srSort('+idx+',\'created\')" title="Sort by Created" style="text-align:center">Created'+srArrow(a,'created')+'</th>'+
      '<th scope="col">Title</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'+footer;
}
function srRenderAgent(idx){ var el=document.getElementById('sr-agentbody-'+idx); if(el)el.innerHTML=srAgentTableHtml(idx); }
function srShowMore(idx){ var a=SR_AGENTS[idx]; if(!a)return; a.shown=(a.shown||SR_PAGE0)+SR_STEP; srRenderAgent(idx); }
function srShowLess(idx){ var a=SR_AGENTS[idx]; if(!a)return; a.shown=SR_PAGE0; srRenderAgent(idx); }
function srSort(idx,field){ var a=SR_AGENTS[idx]; if(!a)return; if(a.sortField===field){a.sortDir=(a.sortDir==='desc'?'asc':'desc');}else{a.sortField=field;a.sortDir='desc';} a.shown=SR_PAGE0; srRenderAgent(idx); }
window.srShowMore=srShowMore; window.srShowLess=srShowLess; window.srSort=srSort;
// Accordion for the agent list inside a section: only ONE agent open at a time within that section.
function srAgentToggle(btn){
  var s=btn.closest('.sr-agent'); if(!s)return;
  var willOpen=!s.classList.contains('open');
  var scope=s.closest('.sr-sec-body')||document;
  scope.querySelectorAll('.sr-agent.open').forEach(function(o){ if(o!==s)o.classList.remove('open'); });
  s.classList.toggle('open', willOpen);
}
window.srAgentToggle=srAgentToggle;
// Group a section's flat ticket list by assignee, register each agent for paginated rendering,
// and return the agent-accordion HTML (agents ordered by ticket count, highest first — like SLA).
function agentGroupedHtml(tickets){
  var byAgent={};
  (tickets||[]).forEach(function(t){
    var key=(t.assignee&&String(t.assignee).trim())||'Unassigned';
    if(!byAgent[key])byAgent[key]=[];
    byAgent[key].push(t);
  });
  var agents=Object.keys(byAgent).map(function(name){ return { agent:name, tickets:byAgent[name] }; })
    .sort(function(a,b){ return b.tickets.length-a.tickets.length; });
  if(!agents.length) return '<div class="sr-empty">No tickets in this section.</div>';
  return agents.map(function(a){
    var idx=SR_AGENTS.length;
    SR_AGENTS.push({ agent:a.agent, tickets:a.tickets, shown:SR_PAGE0, sortField:'created', sortDir:'desc' });
    return '<div class="sr-agent" data-agent="'+esc(String(a.agent).toLowerCase())+'">'+
      '<button type="button" class="sr-agent-head" onclick="srAgentToggle(this)">'+
        '<span class="sr-agent-name">'+esc(a.agent)+phdTag(a.agent)+'<span class="sub">@'+esc(a.agent)+'</span></span>'+
        '<span class="sr-agent-meta"><span class="sr-agent-count">'+a.tickets.length+'</span>'+
          '<span class="sr-a-caret" aria-hidden="true">\u25be</span></span>'+
      '</button>'+
      '<div class="sr-agent-body"><div id="sr-agentbody-'+idx+'">'+srAgentTableHtml(idx)+'</div></div>'+
    '</div>';
  }).join('');
}

function truncate(s,n){ s=String(s||''); return s.length>n?(s.slice(0,n-1)+'\u2026'):s; }
// Country-code and US-state-code -> full name, for friendly labels ("US · United States").
var SR_COUNTRY_NAME={US:'United States',UK:'United Kingdom',CA:'Canada',IN:'India',AU:'Australia',MX:'Mexico',JP:'Japan',DE:'Germany',IT:'Italy',FR:'France',EG:'Egypt',ES:'Spain',SA:'Saudi Arabia',BR:'Brazil',NL:'Netherlands',ZA:'South Africa',PT:'Portugal',UAE:'United Arab Emirates',IE:'Ireland',SG:'Singapore',TR:'Turkey',PL:'Poland',SE:'Sweden',BE:'Belgium',AT:'Austria',CH:'Switzerland',DK:'Denmark',NO:'Norway',FI:'Finland',GR:'Greece',CZ:'Czechia'};
var SR_STATE_NAME={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'Washington D.C.',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',PR:'Puerto Rico'};
function srCountryLabel(code){ var n=SR_COUNTRY_NAME[code]; return n?(esc(code)+' \u00b7 '+esc(n)):esc(code); }
function srStateLabel(code){ if(code==='Unknown')return 'Unknown'; var n=SR_STATE_NAME[code]; return n?(esc(code)+' \u00b7 '+esc(n)):esc(code); }

// ====== Section accordion (two top-level cards: Trend chart + Country grouping) ======
function toggleSection(head){
  var sec=head.closest('.sr-sec'); if(!sec) return;
  var willOpen=!sec.classList.contains('open');
  document.querySelectorAll('.sr-sec').forEach(function(s){
    s.classList.remove('open');
    var h=s.querySelector('.sr-sec-head'); if(h) h.setAttribute('aria-expanded','false');
  });
  if(willOpen){ sec.classList.add('open'); head.setAttribute('aria-expanded','true');
    // Lazy-load: fetch the section's data the FIRST time it is expanded (a failed load waits for Retry).
    if(sec.id==='sec-chart'){ if(SR_CHART_STATE==='done'&&SR_MONTHLY) drawSrChart(SR_MONTHLY); else if(SR_CHART_STATE==='idle') srLoadChart(); }
    else if(sec.id==='sec-country'){ if(SR_COUNTRY_STATE==='idle') srLoadCountry(); }
  }
}
window.toggleSection=toggleSection;

// ---- Fetch orchestration. Each section loads on its first expand; state drives skeleton / error / data. ----
var SR_CHART_STATE='idle', SR_CHART_ERR='';
var SR_COUNTRY_STATE='idle', SR_COUNTRY_ERR='';
function srBusy(st){ return st==='idle'||st==='loading'; }
async function srLoadChart(){
  if(SR_CHART_STATE==='loading'||SR_CHART_STATE==='done') return;
  SR_CHART_STATE='loading'; SR_CHART_ERR='';
  srPaintChart(); srPaintKpis(); srPaintMeta();
  srAnnounce('Loading the monthly trend\u2026');
  var mr=null; try{ mr=await A.api('GET','/api/station-monthly'); }catch(e){}
  if(mr&&mr.ok&&mr.data&&Array.isArray(mr.data.months)){ SR_MONTHLY=mr.data; SR_CHART_STATE='done'; }
  else { SR_CHART_STATE='error'; SR_CHART_ERR=srErrMsg(mr,'Could not load the monthly trend.'); }
  srPaintChart(); srPaintKpis(); srPaintMeta();
  srAnnounce(SR_CHART_STATE==='done'?'Monthly trend loaded.':'Couldn\u2019t load the monthly trend.');
}
async function srLoadCountry(){
  if(SR_COUNTRY_STATE==='loading'||SR_COUNTRY_STATE==='done') return;
  SR_COUNTRY_STATE='loading'; SR_COUNTRY_ERR='';
  renderCountryView();
  srAnnounce('Loading station requests by country\u2026');
  var fr=null; try{ fr=await A.api('GET','/api/station-flat'); }catch(e){}
  // The PHD/Non-PHD filter needs the roster; wait for it (it is fetched once at start-up).
  try{ if(SR_ROSTER_P) await SR_ROSTER_P; }catch(e){}
  if(fr&&fr.ok&&fr.data&&Array.isArray(fr.data.tickets)){ SR_FLAT=fr.data; SR_COUNTRY_STATE='done'; }
  else { SR_COUNTRY_STATE='error'; SR_COUNTRY_ERR=srErrMsg(fr,'Could not load station requests by country.'); }
  renderCountryView();
  srAnnounce(SR_COUNTRY_STATE==='done'?'Station requests by country loaded.':'Couldn\u2019t load station requests by country.');
}
async function srLoadRoster(){
  SR_ROSTER_STATE='loading'; srPaintMeta();
  try{ var ru=await A.api('GET','/api/user-roles'); if(ru&&ru.ok&&Array.isArray(ru.data)){ SR_USERS=new Set(ru.data.map(function(u){return String(u.username||'').trim().toLowerCase();})); } }catch(e){ SR_USERS=null; }
  SR_ROSTER_STATE=SR_USERS?'done':'error'; srPaintMeta();
}
// Retry buttons: show an inline busy state, then re-run the SAME fetch that failed.
document.addEventListener('click',function(ev){
  var b=ev.target&&ev.target.closest&&ev.target.closest('[data-retry]'); if(!b||b.disabled) return;
  b.disabled=true; b.setAttribute('aria-busy','true'); b.innerHTML='<span class="phd-spin sm" aria-hidden="true"></span><span>Retrying\u2026</span>';
  var kind=b.getAttribute('data-retry');
  if(kind==='chart') srLoadChart(); else if(kind==='country') srLoadCountry();
});

// ================= Hero meta + KPI row =================
var SR_MONTHLY=null; // { year, months:[{month,raisedNotFulfilled,notRaisedFulfilled,raisedFulfilled}] }
var SR_MONTH_LBL=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function srYear(){ return (SR_MONTHLY&&SR_MONTHLY.year)||2026; }
function srHasData(m){ return (m.raisedNotFulfilled||0)>0||(m.notRaisedFulfilled||0)>0||(m.raisedFulfilled||0)>0||(m.total||0)>0; }
function srMetaHtml(){
  var sk='<span class="srp-skel srp-skel-d" style="width:84px;height:13px"></span>';
  var through;
  if(srBusy(SR_CHART_STATE)) through=sk;
  else if(SR_CHART_STATE==='error'||!SR_MONTHLY) through='\u2014';
  else { var ms=SR_MONTHLY.months||[], any=ms.some(srHasData); through=any?(SR_MONTH_LBL[srLastMonth(ms)-1]+' '+srYear()):'No data yet'; }
  var roster=srBusy(SR_ROSTER_STATE)?sk:(SR_USERS?(fmtN(SR_USERS.size)+' registered'):'\u2014');
  return '<div><dt>Year</dt><dd>'+(srBusy(SR_CHART_STATE)?'2026':esc(String(srYear())))+'</dd></div>'+
    '<div><dt>Data through</dt><dd>'+through+'</dd></div>'+
    '<div><dt>PHD analysts</dt><dd>'+roster+'</dd></div>';
}

function srNiceCeil(v){ if(v<=5)return 5; var e=Math.floor(Math.log10(v)),b=Math.pow(10,e),f=v/b; var nf=f<=1?1:f<=2?2:f<=5?5:10; return nf*b; }
// Count through the last month that actually has data, so the lines stop there rather than
// dropping to zero across empty future months. Falls back to the full length.
function srLastMonth(months){
  var last=0;
  for(var i=0;i<months.length;i++){ var m=months[i]||{}; if(srHasData(m)) last=i+1; }
  return last||months.length;
}

function srMonthAria(m,i){

    (m.notRaisedFulfilled||0)+' not raised with exclusion applied, '+(m.raisedFulfilled||0)+' raised and aligned. Exclusion or depri resolution: '+
    (m.fulfilledNonPet||0)+' non-pet, '+(m.fulfilledPet||0)+' pet.';

function drawSrChart(data){
  var svg=document.getElementById('srChartSvg'); if(!svg)return;
  var months=(data&&data.months)||[];
  // Only draw lines/points/hover through the last month with data; keep all 12 x-axis labels.
  var draw=months.slice(0, srLastMonth(months));
  // Size the drawing to its box: keep H=320 units for ~300px of height and widen W to the box's
  // real aspect, so the plot fills 100% of the width at the same text size.
  var wrapEl=document.getElementById('srChartWrap');
  var boxW=(wrapEl&&wrapEl.clientWidth)||920, TARGET_PX_H=300;
  var H=320, W=Math.max(600, Math.round(H*boxW/TARGET_PX_H));
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var padL=46,padR=20,padT=18,padB=36, plotW=W-padL-padR, plotH=H-padT-padB;
  var maxV=0; draw.forEach(function(m){ maxV=Math.max(maxV,m.raisedNotFulfilled,m.notRaisedFulfilled,m.raisedFulfilled); });
  var niceMax=srNiceCeil(Math.max(maxV,1));
  var xAt=function(i){ return padL+(plotW*(i/11)); };
  var yAt=function(v){ return padT+plotH-(plotH*(v/niceMax)); };
  var g='';
  for(var b=0;b<=5;b++){ var v=Math.round(niceMax*b/5), y=yAt(v);
    g+='<line class="grid" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>';
    g+='<text class="axlbl" x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" aria-hidden="true">'+v+'</text>'; }
  for(var i=0;i<12;i++){ g+='<text class="axlbl" x="'+xAt(i)+'" y="'+(H-padB+20)+'" text-anchor="middle" aria-hidden="true">'+SR_MONTH_LBL[i]+'</text>'; }
  g+='<line class="axis" x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'"/>';
  var pts=function(getter){ return draw.map(function(m,i){ return xAt(i)+','+yAt(getter(m)); }).join(' '); };
  g+='<polyline class="ln l1" points="'+pts(function(m){return m.raisedNotFulfilled;})+'"/>';
  g+='<polyline class="ln l2" points="'+pts(function(m){return m.notRaisedFulfilled;})+'"/>';
  g+='<polyline class="ln l3" points="'+pts(function(m){return m.raisedFulfilled;})+'"/>';
  g+='<line class="vline" id="srVLine" y1="'+padT+'" y2="'+(padT+plotH)+'"/>';
  draw.forEach(function(m,i){
    g+='<circle class="pt l1" cx="'+xAt(i)+'" cy="'+yAt(m.raisedNotFulfilled)+'" r="4"/>';
    g+='<circle class="pt l2" cx="'+xAt(i)+'" cy="'+yAt(m.notRaisedFulfilled)+'" r="4"/>';
    g+='<circle class="pt l3" cx="'+xAt(i)+'" cy="'+yAt(m.raisedFulfilled)+'" r="4"/>';
  });
  // Value labels on every point. Three lines often sit close together, so per month the labels are
  // ordered top->bottom by point height and spaced at least GAP apart (each still sits just above
  // its point when there's room). If the stack runs into the x-axis it shifts up as a group.
  var axisY=padT+plotH, GAP=12, TOP_MIN=padT+8, BOT_MAX=axisY-3;
  var num=function(v){ return Number(v||0).toLocaleString('en-US'); };
  draw.forEach(function(m,i){
    var x=xAt(i);

      {cls:'l2', v:m.notRaisedFulfilled||0},
      {cls:'l3', v:m.raisedFulfilled||0},
    ].map(function(it){ it.py=yAt(it.v); return it; })
     .sort(function(a,b){ return a.py-b.py; });          // highest point first
    var prev=-Infinity;
    items.forEach(function(it){ it.y=Math.max(it.py-9, TOP_MIN, prev+GAP); prev=it.y; });
    var over=items[items.length-1].y-BOT_MAX;
    if(over>0) items.forEach(function(it){ it.y=Math.max(TOP_MIN, it.y-over); });
    items.forEach(function(it){
      g+='<text class="ptlbl '+it.cls+'" x="'+x+'" y="'+it.y+'" text-anchor="middle" aria-hidden="true">'+num(it.v)+'</text>';
    });
  });
  var colW=plotW/11;
  // Hit areas are focusable so keyboard users get the same tooltip (and screen readers a label).
  draw.forEach(function(m,i){ g+='<rect class="hit" data-i="'+i+'" tabindex="0" role="img" aria-label="'+esc(srMonthAria(m,i))+'" x="'+(xAt(i)-colW/2)+'" y="'+padT+'" width="'+colW+'" height="'+plotH+'"/>'; });
  svg.innerHTML=g;
  var tip=document.getElementById('srChartTip'), vline=document.getElementById('srVLine'), wrap=document.getElementById('srChartWrap');
  function showTip(i){

    var tot=m.total||0;
    var pct=function(n){ return tot>0?(' <b class="tt-pct">('+(Math.round((n/tot)*1000)/10)+'%)</b>'):''; };
    tip.innerHTML='<div class="tt-m">'+SR_MONTH_LBL[i]+' 2026 \u00b7 '+tot+' created</div>'+
      '<div class="tt-row"><span class="k"><i style="background:#e5484d"></i>Raised but refused</span><span class="v">'+(m.raisedNotFulfilled||0)+pct(m.raisedNotFulfilled||0)+'</span></div>'+
      '<div class="tt-row"><span class="k"><i style="background:#3b6fe0"></i>Not raised, exclusion applied</span><span class="v">'+(m.notRaisedFulfilled||0)+pct(m.notRaisedFulfilled||0)+'</span></div>'+
      '<div class="tt-row"><span class="k"><i style="background:#0d9488"></i>Raised and aligned</span><span class="v">'+(m.raisedFulfilled||0)+pct(m.raisedFulfilled||0)+'</span></div>'+
      '<div class="tt-sep"></div>'+
      '<div class="tt-pct-lbl">Address exclusion / depri resolution:</div>'+
      '<div class="tt-row"><span class="k">Non-pet</span><span class="v">'+(m.fulfilledNonPet||0)+'</span></div>'+
      '<div class="tt-row"><span class="k">Pet</span><span class="v">'+(m.fulfilledPet||0)+'</span></div>';
    var cx=xAt(i); vline.setAttribute('x1',cx); vline.setAttribute('x2',cx); vline.style.visibility='visible';
    var box=svg.getBoundingClientRect(), px=(cx/W)*box.width; tip.classList.add('show');
    var tw=tip.offsetWidth||220; var left=px+14; if(left+tw>box.width)left=px-tw-14; if(left<0)left=4;
    tip.style.left=left+'px'; tip.style.top='8px';
  }
  function hideTip(){ var t=document.getElementById('srChartTip'), v=document.getElementById('srVLine'); if(t)t.classList.remove('show'); if(v)v.style.visibility='hidden'; }
  svg.querySelectorAll('.hit').forEach(function(rect){
    var i=+rect.getAttribute('data-i');
    rect.addEventListener('mouseenter', function(){ showTip(i); });
    rect.addEventListener('focus', function(){ showTip(i); });

  if(!wrap._srLeave){   // bind once per wrap (drawSrChart re-runs on resize)

var SR_FLAT=null;              // { total, tickets:[...] }
var SR_PHD=true, SR_NONPHD=true; // By-agent checkboxes for section 2 (both on by default)
var SR_CAT='raised';          // active category radio: raised | declined | aligned (default c = raised)
var SR_PAGER={};               // id -> { keys:[...], groups:{key:[tickets]}, icon, page } for paginated bucket lists
var SR_PAGE_SIZE=10;           // show 10 states / 10 stations per page
// Filter the flat list by the category radio (raised/declined/aligned) AND the PHD/Non-PHD checkboxes.
function srFiltered(tickets){
  return (tickets||[]).filter(function(t){
    if(t.category!==SR_CAT) return false;
    var p=isPhdUser(t.resolvedBy); return (p&&SR_PHD)||(!p&&SR_NONPHD);
  });
}
// Category radio handler.
function srSetCat(c){ SR_CAT=c; renderCountryView(); }
window.srSetCat=srSetCat;
// A ticket table: Ticket | HI (desc) | Created | Resolved By | Title. Sticky header, scrolls inside its box.
function srTable(list){
  var rows=list.slice().sort(function(a,b){ return b.hi-a.hi; }).map(function(t){
    var link=t.url?('<a class="np-id" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.shortId)+'<span class="srp-sr"> (opens in a new tab)</span></a>'):esc(t.shortId);
    var by=esc(displayAgent(t.resolvedBy)||'—')+(isPhdUser(t.resolvedBy)?' <span class="np-phd">PHD</span>':'');

  return '<div class="np-tablewrap" tabindex="0" role="region" aria-label="Tickets ('+list.length+')"><table class="np-tbl">'+

    '<thead><tr><th scope="col">Ticket</th><th scope="col" class="np-c"><abbr title="Sorted by HI, highest first" style="text-decoration:none">HI \u2193</abbr></th><th scope="col">Created</th><th scope="col">Resolved By</th><th scope="col">Title</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}
function srMetaPill(n,word){ return '<span class="hr-sub-meta"><b>'+fmtN(n)+'</b> '+word+'</span>'; }
// A paginated "State Wise" / "Station Wise" bucket list. Buckets the filtered tickets by key
// (ordered by ticket count desc), registers them under `id`, and renders only SR_PAGE_SIZE (10)
// buckets at a time with a pager. Each bucket is a nested collapsible row with its ticket table.
function srBuckets(id, tickets, keyFn, iconName, emptyKey, labelFn, searchPlaceholder){
  var groups={};
  tickets.forEach(function(t){ var k=keyFn(t)||emptyKey; (groups[k]=groups[k]||[]).push(t); });
  var keys=Object.keys(groups).sort(function(a,b){ return groups[b].length-groups[a].length; });
  SR_PAGER[id]={ keys:keys, groups:groups, icon:iconName, page:0, query:'', labelFn:(labelFn||function(k){return esc(k);}) };
  // The search input stays OUTSIDE the re-rendered list so typing never loses focus; only #<id>-list
  // is repainted on each keystroke / page change.
  var ph=esc(searchPlaceholder||'Search…');
  return '<div class="sr-pagewrap" id="'+id+'">'+
    '<div class="sr-search"><span class="sr-search-ic" aria-hidden="true">'+ic('search',14)+'</span>'+
      '<label class="srp-sr" for="'+id+'-q">'+ph+'</label>'+
      '<input type="search" id="'+id+'-q" placeholder="'+ph+'" oninput="srBucketSearch(\''+id+'\',this.value)" autocomplete="off" aria-controls="'+id+'-list">'+
    '</div>'+
    '<div id="'+id+'-list">'+srBucketPageHtml(id)+'</div>'+
  '</div>';
}
// Keys that match the current query (by code OR full label), case-insensitive.
function srFilteredKeys(id){
  var p=SR_PAGER[id]; if(!p) return [];
  var q=String(p.query||'').trim().toLowerCase();
  if(!q) return p.keys;
  return p.keys.filter(function(k){
    var label=String(p.labelFn(k)||'').toLowerCase();
    return String(k).toLowerCase().indexOf(q)>=0 || label.indexOf(q)>=0;
  });
}
// Render the CURRENT page of (filtered) buckets for a registered group + the pager control.
function srBucketPageHtml(id){
  var p=SR_PAGER[id]; if(!p) return '';
  var keys=srFilteredKeys(id);
  if(!keys.length) return '<div class="sr-empty" role="status">No matches. Try a different search.</div>';
  var pages=Math.ceil(keys.length/SR_PAGE_SIZE);
  if(p.page>=pages) p.page=pages-1; if(p.page<0) p.page=0;
  var start=p.page*SR_PAGE_SIZE, end=Math.min(start+SR_PAGE_SIZE, keys.length);
  var rows=keys.slice(start,end).map(function(k){
    return '<div class="hr-sub">'+
      '<button type="button" class="hr-sub-head" onclick="srSubToggle(this)" aria-expanded="false">'+
        '<span class="srp-chev">'+CHEV+'</span>'+
        '<span class="hr-sub-ic" aria-hidden="true">'+ic(p.icon,15)+'</span>'+
        '<span class="hr-sub-title">'+p.labelFn(k)+'</span>'+
        srMetaPill(p.groups[k].length,p.groups[k].length===1?'ticket':'tickets')+
      '</button>'+
      '<div class="hr-sub-body">'+srTable(p.groups[k])+'</div>'+
    '</div>';
  }).join('');
  var pager='';
  if(pages>1){
    pager='<nav class="sr-pager" aria-label="Pages">'+
      '<button type="button" class="sr-pg-btn srp-btn srp-ghost" '+(p.page<=0?'disabled':'')+' onclick="srPage(\''+id+'\',-1)" aria-label="Previous page">\u2039 Prev</button>'+
      '<span class="sr-pg-info">'+(start+1)+'\u2013'+end+' of '+keys.length+'</span>'+
      '<button type="button" class="sr-pg-btn srp-btn srp-ghost" '+(p.page>=pages-1?'disabled':'')+' onclick="srPage(\''+id+'\',1)" aria-label="Next page">Next \u203a</button>'+
    '</nav>';
  }
  return rows+pager;
}
// Search handler: store query, reset to page 1, re-render only the list part (keeps input focus).
function srBucketSearch(id, val){
  var p=SR_PAGER[id]; if(!p) return;
  p.query=val; p.page=0;
  var el=document.getElementById(id+'-list'); if(el) el.innerHTML=srBucketPageHtml(id);
}
window.srBucketSearch=srBucketSearch;
// Flip a bucket group's page (dir = -1 / +1) and re-render just that group's container in place.
function srPage(id, dir){
  var p=SR_PAGER[id]; if(!p) return;
  p.page+=dir;
  var el=document.getElementById(id+'-list'); if(el) el.innerHTML=srBucketPageHtml(id);
  // Keep keyboard focus on the pager after the repaint.
  var btn=el&&el.querySelector('.sr-pg-btn:not([disabled])'+(dir>0?':last-of-type':''))||(el&&el.querySelector('.sr-pg-btn:not([disabled])'));
  if(btn) btn.focus();
}
window.srPage=srPage;
// Nested-accordion toggle (country card, and State/Station group inside it). One open per level.
function srSubToggle(btn){
  var s=btn.closest('.hr-sub'); if(!s)return;
  var willOpen=!s.classList.contains('open');
  var scope=s.parentNode||document;
  Array.prototype.forEach.call(scope.children, function(o){
    if(o!==s && o.classList && o.classList.contains('hr-sub')){ o.classList.remove('open'); var h=o.querySelector(':scope>.hr-sub-head'); if(h) h.setAttribute('aria-expanded','false'); }
  });
  s.classList.toggle('open', willOpen);
  btn.setAttribute('aria-expanded', willOpen?'true':'false');
}
window.srSubToggle=srSubToggle;
// Checkbox toggles for section 2.
function srToggleKind(which, cb){ if(which==='phd')SR_PHD=cb.checked; else SR_NONPHD=cb.checked; renderCountryView(); }
window.srToggleKind=srToggleKind;

function srCountrySectionHtml(){
  var ck=function(c){ return SR_CAT===c?' checked':''; };
  var checks=
    '<div class="np-controls">'+
      '<fieldset class="srp-fs"><legend>Category</legend><div class="np-seg">'+
        '<label class="np-seg-opt"><input type="radio" name="srCat" value="declined"'+ck('declined')+' onchange="srSetCat(\'declined\')"><span>PHD declined requests</span></label>'+
        '<label class="np-seg-opt"><input type="radio" name="srCat" value="aligned"'+ck('aligned')+' onchange="srSetCat(\'aligned\')"><span>PHD aligned requests</span></label>'+
        '<label class="np-seg-opt"><input type="radio" name="srCat" value="raised"'+ck('raised')+' onchange="srSetCat(\'raised\')"><span>PHD raised requests</span></label>'+
      '</div></fieldset>'+
      '<fieldset class="srp-fs"><legend>Analysts</legend><div class="np-checks">'+
        '<label class="np-chip"><input type="checkbox" checked onchange="srToggleKind(\'phd\',this)"><span>PHD Analysts</span></label>'+
        '<label class="np-chip"><input type="checkbox" checked onchange="srToggleKind(\'nonphd\',this)"><span>Non-PHD Analysts</span></label>'+
      '</div></fieldset>'+
      '<p class="srp-ctl-hint">Pick a category and analyst type, then open a country to drill into its states and stations.</p>'+
    '</div>';
  return '<section class="sr-sec s-country" id="sec-country" aria-labelledby="secCountryH">'+
    '<div class="srp-sec-top">'+
      '<h2 id="secCountryH"><button type="button" class="sr-sec-head" onclick="toggleSection(this)" aria-expanded="false" aria-controls="secCountryBody">'+
        '<span class="srp-chev">'+CHEV+'</span><span class="srp-sec-ic" aria-hidden="true">'+ic('globe',17)+'</span>'+
        '<span class="srp-sec-t"><span class="srp-sec-name">Station requests by country</span><span class="srp-sec-sub">YTD 2026 \u00b7 country \u2192 state / station \u2192 tickets</span></span>'+
      '</button></h2>'+
      '<span id="srCountrySum" aria-live="polite"></span>'+
    '</div>'+
    '<div class="sr-sec-body" id="secCountryBody"><div id="srCountryContent">'+checks+'<div id="srCountryBody" aria-busy="false"></div></div></div>'+
  '</section>';
}
// Skeleton rows shaped like the country expanders.
function srCountrySkelHtml(){
  var w=[34,26,40,22,30,28], r='';
  for(var i=0;i<6;i++){ r+='<div class="srp-sk-row"><span class="srp-skel" style="width:20px;height:20px;border-radius:5px"></span><span class="srp-skel" style="width:30px;height:30px;border-radius:50%"></span>'+
    '<span class="srp-skel" style="width:'+w[i]+'%;height:12px"></span><span class="srp-skel" style="width:84px;height:22px;border-radius:99px;margin-left:auto"></span></div>'; }
  return '<div aria-hidden="true">'+r+'</div><p class="srp-sr">Loading station requests by country\u2026</p>';
}
// Build the Country -> (State Wise / Station Wise) tree for the current checkbox filter.
function renderCountryView(){
  var box=document.getElementById('srCountryBody'); if(!box) return;
  var sum=document.getElementById('srCountrySum');
  box.setAttribute('aria-busy',srBusy(SR_COUNTRY_STATE)?'true':'false');
  if(srBusy(SR_COUNTRY_STATE)){ box.innerHTML=srCountrySkelHtml(); if(sum) sum.innerHTML=''; return; }
  if(SR_COUNTRY_STATE==='error'||!SR_FLAT){
    box.innerHTML=stateHtml('is-err','alert-triangle','Couldn\u2019t load station requests by country','<span role="alert">'+esc(SR_COUNTRY_ERR||'Could not load station requests by country.')+'</span>',retryBtn('country'));
    if(sum) sum.innerHTML=''; return;
  }
  var tickets=srFiltered(SR_FLAT.tickets||[]);
  if(!tickets.length){
    box.innerHTML=stateHtml('','search','No tickets for this filter','No station-request tickets for the selected category and analyst type. Try another category, or tick both analyst types.');
    if(sum) sum.innerHTML='<span class="srp-pill"><b>0</b> tickets</span>'; return;
  }
  var byCountry={}; tickets.forEach(function(t){ (byCountry[t.country]=byCountry[t.country]||[]).push(t); });
  var codes=Object.keys(byCountry).sort(function(a,b){ return byCountry[b].length-byCountry[a].length; });
  if(sum) sum.innerHTML='<span class="srp-pill"><b>'+fmtN(tickets.length)+'</b> '+(tickets.length===1?'ticket':'tickets')+' \u00b7 <b>'+fmtN(codes.length)+'</b> '+(codes.length===1?'country':'countries')+'</span>';
  SR_PAGER={}; // reset pagers each render (checkbox change rebuilds the tree)
  box.innerHTML=codes.map(function(code,ci){
    var list=byCountry[code];
    var stId='sr-state-'+ci, snId='sr-station-'+ci;
    var stateWise=srBuckets(stId, list, function(t){ return t.state; }, 'map-pin', 'Unknown', srStateLabel, 'Search a state…');
    var stationWise=srBuckets(snId, list, function(t){ return t.station; }, 'inbox', 'Unknown', null, 'Search a station…');
    var nStates=SR_PAGER[stId].keys.length, nStations=SR_PAGER[snId].keys.length;
    return '<div class="hr-sub sr-country">'+
      '<button type="button" class="hr-sub-head" onclick="srSubToggle(this)" aria-expanded="false">'+
        '<span class="srp-chev">'+CHEV+'</span>'+
        '<span class="hr-sub-ic" aria-hidden="true">'+ic('globe',15)+'</span>'+
        '<span class="hr-sub-title">'+srCountryLabel(code)+'</span>'+
        srMetaPill(list.length,list.length===1?'ticket':'tickets')+
      '</button>'+
      '<div class="hr-sub-body">'+
        '<div class="hr-sub sr-sub2"><button type="button" class="hr-sub-head" onclick="srSubToggle(this)" aria-expanded="false"><span class="srp-chev">'+CHEV+'</span><span class="hr-sub-ic" aria-hidden="true">'+ic('map-pin',15)+'</span><span class="hr-sub-title">State Wise</span>'+srMetaPill(nStates,nStates===1?'state':'states')+'</button><div class="hr-sub-body">'+stateWise+'</div></div>'+
        '<div class="hr-sub sr-sub2"><button type="button" class="hr-sub-head" onclick="srSubToggle(this)" aria-expanded="false"><span class="srp-chev">'+CHEV+'</span><span class="hr-sub-ic" aria-hidden="true">'+ic('inbox',15)+'</span><span class="hr-sub-title">Station Wise</span>'+srMetaPill(nStations,nStations===1?'station':'stations')+'</button><div class="hr-sub-body">'+stationWise+'</div></div>'+
      '</div>'+
    '</div>';
  }).join('');
}
window.renderCountryView=renderCountryView;

// Paint the full page shell (hero + KPI row + both sections). Every fetched region shows a skeleton
// in its final shape until its request lands, then the data or a friendly error with Retry.
function paintShell(){
  document.getElementById('wrap').innerHTML=
    '<div class="srp is-anim">'+
      srHeroHtml()+
      '<div class="srp-kpis" id="srpKpis" aria-busy="true" aria-label="Headline numbers" role="group">'+srKpisHtml()+'</div>'+
      srChartSectionHtml()+
      srCountrySectionHtml()+
      '<p class="srp-sr" id="srpLive" aria-live="polite"></p>'+
    '</div>';
  // Drop the entrance-animation class once it has played, so later repaints don't re-animate.
  setTimeout(function(){ var r=document.querySelector('.srp.is-anim'); if(r) r.classList.remove('is-anim'); },1200);
}

async function load(){
  if(!A.getUser()||!A.getToken()){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  if(!(A.canViewSR&&A.canViewSR())){ location.replace('index.html'); return; }
  // 1) Paint the shell IMMEDIATELY (chart section expanded, country collapsed).
  paintShell();
  // 2) Roster (for PHD tags / the PHD filter) loads alongside the chart; the country view waits for it.
  SR_ROSTER_P=srLoadRoster();
  // 3) Chart section is open by default -> load it now. Country section lazy-loads on first expand.
  srLoadChart();
}

document.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
