<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Station Request Tickets · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: keep the page hidden until topbar-auth.js has injected its styles AND built the
     nav-rail + profile column, so the chrome is present on the FIRST paint (no flash-in). The class
     is cleared by topbar-auth after the chrome builds; a failsafe timer clears it if the script
     never runs (offline) so the page can never stay hidden. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252;--tl:#44b9d6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#000;border-radius:5px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.wrap{padding:32px 24px}
.sr-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sr-head h1{margin:0;color:#fff;font-size:1.7em;font-weight:700;display:inline-flex;align-items:center;gap:10px}
.sr-sub{color:var(--tm);font-size:.9em;line-height:1.55;margin:6px 0 26px;max-width:900px}
.sr-sub b{color:#fff}
.sr-from{display:inline-flex;align-items:center;gap:7px;margin-top:8px;color:var(--tl);font-weight:600}
.sr-from svg{flex-shrink:0}
/* Section card (collapsible accordion — only one open at a time) */
.sr-sec{background:#0a0a0a;border:1px solid var(--bd);border-radius:5px;margin-bottom:16px;overflow:hidden}
/* Clickable header row */
.sr-sec-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 22px;cursor:pointer;user-select:none;transition:background .15s}
.sr-sec-head:hover{background:rgba(255,255,255,.03)}
.sr-sec-head-left{display:flex;align-items:center;gap:10px;min-width:0}
.sr-sec-title{display:flex;align-items:center;gap:10px;color:#fff;font-size:1.12em;font-weight:700}
.sr-sec-title .sec-ic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;flex-shrink:0}
.sr-sec-title .sec-ic svg{width:17px;height:17px}
.sr-sec-head-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.sr-caret{color:var(--tm);display:inline-flex;transition:transform .2s ease}
.sr-sec.open .sr-caret{transform:rotate(180deg)}
/* Collapsible body: animate max-height for a smooth open/close. */
.sr-sec-body{max-height:0;overflow:hidden;transition:max-height .28s ease;padding:0 22px}
.sr-sec.open .sr-sec-body{max-height:4000px;padding:14px 22px 10px}
.sr-sec-desc{color:var(--tm);font-size:.82em;line-height:1.5;margin:2px 0 14px;max-width:820px}
.sr-count{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:30px;padding:0 12px;border-radius:5px;font-weight:800;font-size:.9em;flex-shrink:0}
/* Per-section accents */
.sr-sec.s1{border-top:3px solid var(--rl)}   .sr-sec.s1 .sec-ic{background:rgba(255,82,82,.16);color:var(--rl)}   .sr-sec.s1 .sr-count{background:rgba(255,82,82,.14);color:var(--rl);border:1px solid rgba(255,82,82,.35)}
.sr-sec.s2{border-top:3px solid var(--gl)}   .sr-sec.s2 .sec-ic{background:rgba(74,222,128,.16);color:var(--gl)} .sr-sec.s2 .sr-count{background:rgba(74,222,128,.14);color:var(--gl);border:1px solid rgba(74,222,128,.35)}
.sr-sec.s3{border-top:3px solid var(--tl)}   .sr-sec.s3 .sec-ic{background:rgba(68,185,214,.16);color:var(--tl)} .sr-sec.s3 .sr-count{background:rgba(68,185,214,.14);color:var(--tl);border:1px solid rgba(68,185,214,.35)}
/* Table */
.sr-tbl-wrap{overflow-x:auto;border-radius:5px;margin-bottom:14px}
.sr-tbl{width:100%;border-collapse:collapse;font-size:.86em;min-width:720px}
.sr-tbl th,.sr-tbl td{border:1px solid #223040;padding:9px 12px;text-align:left;vertical-align:top}
.sr-tbl thead th{background:#111820;color:var(--tm);text-transform:uppercase;font-size:.72em;letter-spacing:.5px;font-weight:700;white-space:nowrap}
.sr-tbl tbody tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.sr-tbl tbody tr:hover td{background:rgba(255,153,0,.05)}
.sr-idlink{color:#44b9d6;text-decoration:none;font-weight:700;white-space:nowrap}
.sr-idlink:hover{text-decoration:underline}
.sr-title{color:var(--t)}
.sr-status{display:inline-block;padding:2px 9px;border-radius:5px;font-size:.82em;font-weight:700;background:rgba(255,153,0,.14);color:var(--o);white-space:nowrap}
.sr-num{color:#879596;font-weight:700;text-align:center;white-space:nowrap}
.sr-empty{color:#5f6b6c;font-size:.86em;font-style:italic;padding:14px 4px}
/* ===== Monthly trend chart (section 1) ===== */
.sr-sec-head-right .sr-count{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:30px;padding:0 12px;border-radius:5px;font-weight:800;font-size:.9em;background:rgba(255,255,255,.08);color:#cfd6dd}
.sr-chart-legend{display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap;font-size:.82em;font-weight:700;margin-bottom:6px}
.sr-lg{display:inline-flex;align-items:center;gap:6px;color:#aab6c2}
.sr-lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.sr-lg.l1 i{background:#e5484d}.sr-lg.l2 i{background:#3b6fe0}.sr-lg.l3 i{background:#0d9488}
.sr-chart-loading{display:flex;align-items:center;justify-content:center;gap:12px;min-height:220px;color:#8795a3;font-size:.9em;font-weight:600}
.sr-chart-loading .spinner{margin:0;width:30px;height:30px;border-width:3px}
/* Chart shimmer placeholder (shown until the monthly data lands). */
.sr-chart-sk-legend{display:flex;justify-content:flex-end;gap:14px;margin-bottom:14px}
.sr-chart-sk-plot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;height:240px;padding:0 6px}
.sr-chart-sk-bar{flex:1;border-radius:5px 5px 0 0;align-self:flex-end}
.sr-chart-wrap{position:relative;width:100%;overflow:visible}
.sr-chart-svg{width:100%;height:auto;display:block;overflow:visible}
.sr-chart-svg .grid{stroke:rgba(255,255,255,.07);stroke-width:1}
.sr-chart-svg .axis{stroke:rgba(255,255,255,.18);stroke-width:1}
.sr-chart-svg .axlbl{fill:#8795a3;font-size:11px;font-weight:600}
.sr-chart-svg .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sr-chart-svg .ln.l1{stroke:#e5484d}.sr-chart-svg .ln.l2{stroke:#3b6fe0}.sr-chart-svg .ln.l3{stroke:#0d9488}
.sr-chart-svg .pt{stroke:#0b0f14;stroke-width:2;cursor:pointer}
.sr-chart-svg .pt.l1{fill:#e5484d}.sr-chart-svg .pt.l2{fill:#3b6fe0}.sr-chart-svg .pt.l3{fill:#0d9488}
.sr-chart-svg .hit{fill:transparent;cursor:pointer}
/* Point value labels: bold, line-coloured, white halo so they read over gridlines/lines. */
.sr-chart-svg .ptlbl{font-size:11px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.sr-chart-svg .ptlbl.l1{fill:#d33b40}.sr-chart-svg .ptlbl.l2{fill:#2f5fcc}.sr-chart-svg .ptlbl.l3{fill:#0b7f75}
.sr-chart-svg .vline{stroke:rgba(255,255,255,.22);stroke-width:1;stroke-dasharray:3 3;visibility:hidden}
.sr-chart-tip{position:absolute;pointer-events:none;z-index:5;min-width:230px;background:#0a0a0a;border:1px solid #2a323b;border-radius:7px;padding:11px 13px;box-shadow:0 14px 34px -16px rgba(0,0,0,.8);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-size:.82em}
.sr-chart-tip.show{opacity:1;transform:translateY(0)}
.sr-chart-tip .tt-m{font-weight:800;color:#fff;margin-bottom:7px}
.sr-chart-tip .tt-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:2px 0;color:#c4ccd4}
.sr-chart-tip .tt-row .k{display:inline-flex;align-items:center;gap:6px}
.sr-chart-tip .tt-row .k i{width:9px;height:9px;border-radius:50%;display:inline-block}
.sr-chart-tip .tt-row .v{font-weight:800;color:#fff}
.sr-chart-tip .tt-pct{color:#9fb2c4;font-weight:800}
.sr-chart-tip .tt-sep{height:1px;background:rgba(255,255,255,.08);margin:7px 0}
.sr-chart-tip .tt-pct-lbl{color:#9aa6b1;font-size:.9em;font-weight:600;margin-bottom:3px}
/* ===== Country -> State/Station grouping (section 2) ===== */
.np-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.np-seg{display:inline-flex;align-items:center;background:#0b0f14;border:1px solid var(--bd);border-radius:999px;padding:3px;gap:2px}
.np-seg-opt{position:relative;display:inline-flex;align-items:center;cursor:pointer;user-select:none}
.np-seg-opt input{position:absolute;opacity:0;width:0;height:0}
.np-seg-opt span{display:inline-flex;align-items:center;padding:7px 15px;border-radius:999px;font-size:.84em;font-weight:700;color:#9fb2c4;white-space:nowrap;transition:background .14s,color .14s}
.np-seg-opt:hover span{color:#d7dee6}
.np-seg-opt input:checked+span{background:#ec7211;color:#fff;box-shadow:0 2px 8px -2px rgba(236,114,17,.6)}
.np-checks{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.np-chip{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:.82em;font-weight:700;padding:7px 13px;border-radius:999px;border:1px solid var(--bd);background:#0b0f14;color:#9fb2c4;transition:border-color .14s,color .14s,background .14s}
.np-chip input{appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1.5px solid #5a6470;border-radius:4px;cursor:pointer;position:relative;flex-shrink:0}
.np-chip input:checked{background:#ec7211;border-color:#ec7211}
.np-chip input:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.np-chip:has(input:checked){border-color:#ec7211;color:#fff;background:rgba(236,114,17,.1)}
.hr-sub{border:1px solid #2f3a45;border-radius:5px;margin-bottom:10px;overflow:hidden;background:#0b0f14}
.hr-sub:last-child{margin-bottom:0}
.hr-sub-head{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 16px;border:none;cursor:pointer;font:inherit;text-align:left;background:#141a22;color:#e6edf3;transition:background .12s}
.hr-sub-head:hover{background:#17202a}
.hr-sub-ic{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;flex-shrink:0;background:rgba(255,255,255,.08);color:#9fb2c4}
.hr-sub-title{font-weight:700;font-size:.95em}
.hr-sub-meta{margin-left:auto;font-size:.78em;font-weight:700;color:#9fb2c4;background:rgba(255,255,255,.06);border-radius:5px;padding:4px 10px;white-space:nowrap}
.hr-sub .hr-caret{color:#9fb2c4;flex-shrink:0;transition:transform .18s}
.hr-sub-body{display:none;padding:0 14px}
.hr-sub.open>.hr-sub-body{display:block;padding:12px 14px}
.hr-sub.open>.hr-sub-head .hr-caret{transform:rotate(180deg)}
.sr-sub2{background:#0e141b}
/* Search box above each state/station bucket list. */
.sr-search{display:flex;align-items:center;gap:9px;max-width:340px;background:#0e141b;border:1px solid #2a323b;border-radius:8px;padding:0 12px;height:38px;margin:2px 0 14px;transition:border-color .15s,box-shadow .15s}
.sr-search:focus-within{border-color:var(--o);box-shadow:0 0 0 3px rgba(255,153,0,.15)}
.sr-search-ic{display:inline-flex;align-items:center;color:#8795a3;flex-shrink:0}
.sr-search input{flex:1;min-width:0;background:transparent!important;border:0!important;outline:none!important;box-shadow:none!important;color:#fff;font-size:.88em;font-family:inherit;padding:0;height:100%;line-height:38px}
.sr-search input::placeholder{color:#6b7681}
/* Pager for the 10-at-a-time state/station lists. */
.sr-pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 4px 2px}
.sr-pg-btn{background:#141a22;border:1px solid var(--bd);color:#cfd6dd;border-radius:5px;padding:6px 14px;font-size:.82em;font-weight:700;cursor:pointer;font-family:inherit}
.sr-pg-btn:hover:not([disabled]){border-color:var(--o);color:#fff}
.sr-pg-btn[disabled]{opacity:.4;cursor:default}
.sr-pg-info{color:#8795a3;font-size:.8em;font-weight:600}
.np-tablewrap{overflow-x:auto}
.np-tbl{width:100%;border-collapse:collapse;font-size:.84em;table-layout:fixed}
.np-tbl th,.np-tbl td{text-align:center;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-tbl thead th{color:#8795a3;font-weight:700;text-transform:uppercase;font-size:.82em;letter-spacing:.4px;border-bottom:1px solid rgba(255,255,255,.14)}
.np-tbl tbody tr:last-child td{border-bottom:none}
.np-tbl td.np-c,.np-tbl th.np-c{font-weight:800}
.np-id{color:#44b9d6;font-weight:700;text-decoration:none}
.np-id:hover{text-decoration:underline}
.np-title{color:#aab6c2}
.np-phd{color:#1577a0;background:rgba(68,185,214,.14);border:1px solid rgba(68,185,214,.35);border-radius:4px;font-size:.72em;font-weight:800;padding:1px 5px;margin-left:4px}
.np-sk-wrap{padding:4px 0}
.np-sk-row{display:flex;align-items:center;gap:14px;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.np-sk{height:12px;border-radius:5px;background:#141a20;position:relative;overflow:hidden}
.np-sk.b1{width:12%}.np-sk.b2{width:7%}.np-sk.b3{width:14%}.np-sk.b4{flex:1}.np-sk.b5{width:20%}
.np-sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:npShim 1.3s ease-in-out infinite}
@keyframes npShim{100%{transform:translateX(100%)}}
/* Fit-to-content column (Ticket). */
.sr-tbl th.sr-fit,.sr-tbl td.sr-fit{width:1%;white-space:nowrap}
/* Sortable header: obvious hover + bold, clearly-visible sort arrow. */
.sr-tbl th.sr-sort{user-select:none;cursor:pointer}
.sr-tbl th.sr-sort:hover{color:#fff;background:#0d1319}
.sr-sort-ar{display:inline-block;margin-left:7px;font-size:1em;font-weight:900;color:#ff9f2e;vertical-align:middle}
.sr-sort-ar.idle{color:#7f8c96;opacity:.7;font-weight:700}
/* C/R tag leading the title: C = Closed (green), R = Resolved (teal). */
.sr-tag{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;font-size:.72em;font-weight:800;vertical-align:middle;line-height:1;flex-shrink:0}
.sr-tag.c{color:#4ade80;background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.4)}
.sr-tag.r{color:#2dd4bf;background:rgba(45,212,191,.15);border:1px solid rgba(45,212,191,.4)}
.sr-tag.o{color:#879596;background:rgba(135,149,150,.15);border:1px solid rgba(135,149,150,.4)}
/* Title cell: tag + truncated text on one line. */
.sr-tbl td.sr-title{max-width:1px;width:100%}
.sr-title-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.sr-title-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* Agent accordion (agents listed first; each expands to their tickets — like SLA Breaches). */
.sr-agent{border:1px solid #2f3a45;border-radius:5px;margin-bottom:10px;overflow:hidden;background:#0b0f14}
.sr-agent-head{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;background:transparent;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .12s}
.sr-agent-head:hover{background:rgba(255,255,255,.03)}
.sr-agent-name{color:#fff;font-weight:700;font-size:1.02em}
.sr-agent-name .sub{color:var(--tm);font-weight:400;font-size:.85em;margin-left:8px}
.sr-agent-meta{margin-left:auto;display:inline-flex;align-items:center;gap:10px}
.sr-agent-count{font-weight:800;background:rgba(255,153,0,.12);border:1px solid rgba(255,153,0,.35);color:var(--o);border-radius:5px;padding:3px 13px;font-size:.95em}
.sr-agent .sr-a-caret{color:var(--tm);transition:transform .22s ease;flex-shrink:0}
.sr-agent.open .sr-a-caret{transform:rotate(180deg)}
.sr-agent-body{display:none}
.sr-agent.open .sr-agent-body{display:block}
/* Skeleton agent block: inert (no hover/pointer) while its section loads. */
.sr-agent.sk-agent{pointer-events:none}
.sr-agent.sk-agent .sr-agent-head{cursor:default}
.sr-agent.sk-agent .sr-agent-head:hover{background:transparent}
/* "PHD" tag next to a registered agent's name. */
.sr-phd{display:inline-block;margin-left:9px;padding:2px 8px;border-radius:5px;font-size:.62em;font-weight:800;letter-spacing:.5px;vertical-align:middle;color:#5ecdec;background:rgba(94,205,236,.14);border:1px solid rgba(94,205,236,.45)}
/* Load more / less footer under an agent's ticket table. */
.sr-more{display:flex;justify-content:center;gap:10px;align-items:center;padding:12px 14px}
.sr-more button{background:#141a20;border:1px solid #2a323b;color:#d5dbdb;border-radius:5px;padding:7px 16px;font-size:.85em;font-weight:600;cursor:pointer}
.sr-more button:hover{background:#1c242d;border-color:#3a444f;color:#fff}
.sr-more .sr-mcount{color:#879596;font-size:.8em}
/* Skeleton shimmer (shown per-section until its request lands). */
.sk{position:relative;overflow:hidden;background:#141a20;border-radius:5px;display:inline-block;vertical-align:middle}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:sksh 1.2s infinite}
@keyframes sksh{100%{transform:translateX(100%)}}
.sr-count.sk{min-width:40px;height:30px;border-radius:5px}
.sr-sec-err{color:var(--rl);font-size:.85em;padding:12px 4px}
.sr-sec-err a{color:var(--o);cursor:pointer;text-decoration:underline}
.sr-gate,.sr-loading{background:#0a0a0a;border:1px solid var(--bd);border-radius:5px;padding:40px;text-align:center;color:var(--tm)}
.sr-gate h1{color:#fff;font-size:1.4em;margin-bottom:10px}
.spinner{width:34px;height:34px;border:3px solid #2a2a2a;border-top-color:var(--o);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{100%{transform:rotate(360deg)}}

/* ---- Illustrated gradient banner header (matches the live dashboard section banners) ---- */
@keyframes srBanner{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.sr-banner{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;
  border-radius:5px;padding:18px 24px;min-height:92px;justify-content:center;margin-bottom:22px;
  border:1px solid #242a31;box-shadow:0 12px 30px -20px rgba(0,0,0,.75);
  background:linear-gradient(90deg,#0d9488,#2dd4bf 55%,#8ef0e2);background-size:200% 100%;animation:srBanner 9s ease infinite}
.sr-banner .sb-title{position:relative;z-index:1;margin:0;display:inline-flex;align-items:center;gap:11px;font-size:1.55em;font-weight:800;letter-spacing:-.3px;line-height:1.1;color:#06322d}
.sr-banner .sb-title svg{flex-shrink:0;color:#06322d}
.sr-banner .sb-sub{position:relative;z-index:1;font-size:.88em;font-weight:500;line-height:1.55;max-width:900px;color:rgba(6,50,45,.82)}
.sr-banner .sb-sub b{color:#04241f;font-weight:800}
.sr-banner .sb-from{display:inline-flex;align-items:center;gap:7px;margin-top:6px;color:#065f52;font-weight:700}
.sr-banner .sb-from svg{flex-shrink:0}
/* "YTD 2026" badge pinned to the right of the title bar. */
.sr-banner .sb-left{position:relative;z-index:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.sr-banner .sb-right{position:relative;z-index:1;display:inline-flex;align-items:center;flex-shrink:0}

function isPhdUser(name){ return !!(SR_USERS && SR_USERS.has(String(name||'').trim().toLowerCase())); }

// Per-agent pagination + sort state, keyed by a global index. shown starts at 20 (+10 each).
var SR_AGENTS=[]; var SR_PAGE0=20, SR_STEP=10;
function srArrow(a,field){
  if(a.sortField!==field) return '<span class="sr-sort-ar idle">\u21c5</span>';
  return a.sortDir==='desc'?'<span class="sr-sort-ar">\u25bc</span>':'<span class="sr-sort-ar">\u25b2</span>';
}
// Build one agent's ticket table (sortable Created + Show more/less) for agent #idx.
function srAgentTableHtml(idx){
  var a=SR_AGENTS[idx]; if(!a) return '';
  var field=a.sortField||'created', dir=a.sortDir||'desc';
  var tix=(a.tickets||[]).slice().sort(function(x,y){
    var vx=new Date(x.createDate||0).getTime()||0, vy=new Date(y.createDate||0).getTime()||0;
    return dir==='desc'?(vy-vx):(vx-vy);
  });
  var total=tix.length;
  var shown=Math.min(a.shown||SR_PAGE0, total);
  var rows=tix.slice(0,shown).map(function(t){
    var sid=esc(t.shortId||'');
    var link=t.url?('<a class="sr-idlink" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+sid+'</a>'):sid;
    return '<tr>'+
      '<td class="sr-fit" style="text-align:center">'+link+'</td>'+
      '<td style="white-space:nowrap;text-align:center">'+fmtDate(t.createDate)+'</td>'+
      '<td class="sr-title"><span class="sr-title-wrap">'+statusTag(t.status)+'<span class="sr-title-txt" title="'+esc(t.title)+'">'+esc(t.title||'—')+'</span></span></td>'+
    '</tr>';
  }).join('');
  var remaining=total-shown;
  var footer='';
  if(total>SR_PAGE0){
    footer='<div class="sr-more">';
    if(remaining>0){ footer+='<button onclick="srShowMore('+idx+')">\u25be Show more <span class="sr-mcount">(+'+Math.min(SR_STEP,remaining)+', '+remaining+' left)</span></button>'; }
    if(shown>SR_PAGE0){ footer+='<button onclick="srShowLess('+idx+')">\u25b4 Show less</button>'; }
    footer+='<span class="sr-mcount">Showing '+shown+' of '+total+'</span></div>';
  }
  return '<div class="sr-tbl-wrap"><table class="sr-tbl" style="min-width:0"><thead><tr>'+
      '<th class="sr-fit" style="text-align:center">Ticket</th>'+
      '<th class="sr-sort" onclick="srSort('+idx+',\'created\')" title="Sort by Created" style="text-align:center">Created'+srArrow(a,'created')+'</th>'+
      '<th>Title</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'+footer;
}
function srRenderAgent(idx){ var el=document.getElementById('sr-agentbody-'+idx); if(el)el.innerHTML=srAgentTableHtml(idx); }
function srShowMore(idx){ var a=SR_AGENTS[idx]; if(!a)return; a.shown=(a.shown||SR_PAGE0)+SR_STEP; srRenderAgent(idx); }
function srShowLess(idx){ var a=SR_AGENTS[idx]; if(!a)return; a.shown=SR_PAGE0; srRenderAgent(idx); }
function srSort(idx,field){ var a=SR_AGENTS[idx]; if(!a)return; if(a.sortField===field){a.sortDir=(a.sortDir==='desc'?'asc':'desc');}else{a.sortField=field;a.sortDir='desc';} a.shown=SR_PAGE0; srRenderAgent(idx); }

// Accordion for the agent list inside a section: only ONE agent open at a time within that section.
function srAgentToggle(btn){
  var s=btn.closest('.sr-agent'); if(!s)return;
  var willOpen=!s.classList.contains('open');
  var scope=s.closest('.sr-sec-body')||document;
  scope.querySelectorAll('.sr-agent.open').forEach(function(o){ if(o!==s)o.classList.remove('open'); });
  s.classList.toggle('open', willOpen);
}
window.srAgentToggle=srAgentToggle;
// Group a section's flat ticket list by assignee, register each agent for paginated rendering,
// and return the agent-accordion HTML (agents ordered by ticket count, highest first — like SLA).
function agentGroupedHtml(tickets){
  var byAgent={};
  (tickets||[]).forEach(function(t){
    var key=(t.assignee&&String(t.assignee).trim())||'Unassigned';
    if(!byAgent[key])byAgent[key]=[];
    byAgent[key].push(t);
  });
  var agents=Object.keys(byAgent).map(function(name){ return { agent:name, tickets:byAgent[name] }; })
    .sort(function(a,b){ return b.tickets.length-a.tickets.length; });
  if(!agents.length) return '<div class="sr-empty">No tickets in this section.</div>';
  return agents.map(function(a){
    var idx=SR_AGENTS.length;
    SR_AGENTS.push({ agent:a.agent, tickets:a.tickets, shown:SR_PAGE0, sortField:'created', sortDir:'desc' });
    return '<div class="sr-agent" data-agent="'+esc(String(a.agent).toLowerCase())+'">'+
      '<button type="button" class="sr-agent-head" onclick="srAgentToggle(this)">'+
        '<span class="sr-agent-name">'+esc(a.agent)+phdTag(a.agent)+'<span class="sub">@'+esc(a.agent)+'</span></span>'+
        '<span class="sr-agent-meta"><span class="sr-agent-count">'+a.tickets.length+'</span>'+
          '<span class="sr-a-caret" aria-hidden="true">\u25be</span></span>'+
      '</button>'+
      '<div class="sr-agent-body"><div id="sr-agentbody-'+idx+'">'+srAgentTableHtml(idx)+'</div></div>'+
    '</div>';
  }).join('');
}

var _ldMsgTimers={}, _ldWhat={};
function _ldSetMsg(pfx,tuple){
  var e=document.getElementById(pfx+'LoaderMsg'), i=document.getElementById(pfx+'LoaderIc');
  if(i){ i.innerHTML=ic(tuple[0]||'clock',30); }
  if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent=tuple[1]; e.classList.add('gw-msg-in'); }
}
function _ldStop(pfx){ if(_ldMsgTimers[pfx]){ clearInterval(_ldMsgTimers[pfx]); _ldMsgTimers[pfx]=null; } }
function _ldStart(pfx,subLabel){
  _ldStop(pfx);
  var sub=document.getElementById(pfx+'LoaderSub'); if(sub&&subLabel) sub.textContent=subLabel;
  var what=_ldWhat[pfx]||'data';
  var p1=srPhase1(what), i=0; _ldSetMsg(pfx,p1[0]);
  _ldMsgTimers[pfx]=setInterval(function(){
    i++;
    if(i<p1.length){ _ldSetMsg(pfx,p1[i]); return; }
    _ldStop(pfx);
    _ldSetMsg(pfx,['alert','Sorry for the delay \u2014 still fetching your data\u2026']);
    setTimeout(function(){
      var p2=srPhase2(what), j=0; _ldSetMsg(pfx,p2[0]);
      _ldMsgTimers[pfx]=setInterval(function(){ j=(j+1)%p2.length; _ldSetMsg(pfx,p2[j]); },3000);
    },3000);
  },2000);
}
function _ldShow(pfx,on,subLabel){
  var l=document.getElementById(pfx+'Loader'), c=document.getElementById(pfx+'Content');
  if(l){ l.style.display=on?'flex':'none'; if(on) l.classList.remove('gw-done'); }
  if(c) c.style.display=on?'none':'';
  if(on) _ldStart(pfx,subLabel); else _ldStop(pfx);
}
function _ldSuccess(pfx){
  _ldStop(pfx);
  var l=document.getElementById(pfx+'Loader'); if(l) l.classList.add('gw-done');
  var i=document.getElementById(pfx+'LoaderIc'); if(i) i.innerHTML=ic('check-circle',30);
  var e=document.getElementById(pfx+'LoaderMsg'); if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent='Data fetched successfully'; e.classList.add('gw-msg-in'); }
}
var _delay=function(ms){ return new Promise(function(res){ setTimeout(res,ms); }); };

var SR_CHART_STATE='idle', SR_COUNTRY_STATE='idle';
async function srLoadChart(){
  if(SR_CHART_STATE!=='idle') return; SR_CHART_STATE='loading';
  _ldWhat['srChart']='monthly trend';
  _ldShow('srChart',true,'Station requests · 2026');
  var minDelay=_delay(4000);

  _ldSuccess('srChart'); await _delay(1000);
  _ldShow('srChart',false);

  if(SR_MONTHLY) drawSrChart(SR_MONTHLY);

var SR_MONTHLY=null; // { year, months:[{month,raisedNotFulfilled,notRaisedFulfilled,raisedFulfilled}] }
var SR_MONTH_LBL=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      '</div>'+
    '</div>'+
  '</div>';
}
// Roll the monthly series into headline numbers for the stat column.
function srChartStats(){
  var months=(SR_MONTHLY&&SR_MONTHLY.months)||[];
  var refused=0, excl=0, aligned=0, total=0;
  months.forEach(function(m){
    refused+=m.raisedNotFulfilled||0; excl+=m.notRaisedFulfilled||0; aligned+=m.raisedFulfilled||0;
    total+=(m.total!=null)?m.total:((m.raisedNotFulfilled||0)+(m.notRaisedFulfilled||0)+(m.raisedFulfilled||0));
  });
  var alignRate=(total>0)?(aligned/total*100):0;
  return { total:total, refused:refused, excl:excl, aligned:aligned, alignRate:alignRate };
}
function srStatsHtml(){
  var s=srChartStats();
  var fmt=function(n){ return (n||0).toLocaleString('en-US'); };

    '<span class="sr-stat-body"><span class="sr-stat-n">'+val+'</span><span class="sr-stat-l">'+lbl+'</span></span></div>'; }
  return '<div class="sr-stats">'+
    tile('inbox','',fmt(s.total),'Requests created')+
    tile('target','refused',fmt(s.refused),'Raised but refused')+
    tile('map-pin','excl',fmt(s.excl),'Exclusion applied')+
    tile('check-circle','aligned',fmt(s.aligned),'Raised & aligned')+

}

function srNiceCeil(v){ if(v<=5)return 5; var e=Math.floor(Math.log10(v)),b=Math.pow(10,e),f=v/b; var nf=f<=1?1:f<=2?2:f<=5?5:10; return nf*b; }
// Count through the last month that actually has data, so the lines stop there rather than
// dropping to zero across empty future months. Falls back to the full length.
function srLastMonth(months){
  var last=0;
  for(var i=0;i<months.length;i++){ var m=months[i]||{}; if((m.raisedNotFulfilled||0)>0||(m.notRaisedFulfilled||0)>0||(m.raisedFulfilled||0)>0||(m.total||0)>0) last=i+1; }
  return last||months.length;
}
function drawSrChart(data){
  var svg=document.getElementById('srChartSvg'); if(!svg)return;
  var months=(data&&data.months)||[];
  // Only draw lines/points/hover through the last month with data; keep all 12 x-axis labels.
  var draw=months.slice(0, srLastMonth(months));
  // Size the drawing to its box (same as the SLA chart): keep H=320 units for ~300px of height and
  // widen W to the box's real aspect, so the plot fills 100% of the width at the same text size.
  var wrapEl=document.getElementById('srChartWrap');
  var boxW=(wrapEl&&wrapEl.clientWidth)||920, TARGET_PX_H=300;
  var H=320, W=Math.max(600, Math.round(H*boxW/TARGET_PX_H));
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var padL=46,padR=20,padT=18,padB=36, plotW=W-padL-padR, plotH=H-padT-padB;
  var maxV=0; draw.forEach(function(m){ maxV=Math.max(maxV,m.raisedNotFulfilled,m.notRaisedFulfilled,m.raisedFulfilled); });
  var niceMax=srNiceCeil(Math.max(maxV,1));
  var xAt=function(i){ return padL+(plotW*(i/11)); };
  var yAt=function(v){ return padT+plotH-(plotH*(v/niceMax)); };
  var g='';
  for(var b=0;b<=5;b++){ var v=Math.round(niceMax*b/5), y=yAt(v);
    g+='<line class="grid" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>';
    g+='<text class="axlbl" x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>'; }
  for(var i=0;i<12;i++){ g+='<text class="axlbl" x="'+xAt(i)+'" y="'+(H-padB+20)+'" text-anchor="middle">'+SR_MONTH_LBL[i]+'</text>'; }
  g+='<line class="axis" x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'"/>';
  var pts=function(getter){ return draw.map(function(m,i){ return xAt(i)+','+yAt(getter(m)); }).join(' '); };
  g+='<polyline class="ln l1" points="'+pts(function(m){return m.raisedNotFulfilled;})+'"/>';
  g+='<polyline class="ln l2" points="'+pts(function(m){return m.notRaisedFulfilled;})+'"/>';
  g+='<polyline class="ln l3" points="'+pts(function(m){return m.raisedFulfilled;})+'"/>';
  g+='<line class="vline" id="srVLine" y1="'+padT+'" y2="'+(padT+plotH)+'"/>';
  draw.forEach(function(m,i){
    g+='<circle class="pt l1" cx="'+xAt(i)+'" cy="'+yAt(m.raisedNotFulfilled)+'" r="4"/>';
    g+='<circle class="pt l2" cx="'+xAt(i)+'" cy="'+yAt(m.notRaisedFulfilled)+'" r="4"/>';
    g+='<circle class="pt l3" cx="'+xAt(i)+'" cy="'+yAt(m.raisedFulfilled)+'" r="4"/>';
  });
  // Value labels on every point. Three lines often sit close together, so per month the labels are
  // ordered top->bottom by point height and spaced at least GAP apart (each still sits just above
  // its point when there's room). If the stack runs into the x-axis it shifts up as a group.
  var axisY=padT+plotH, GAP=12, TOP_MIN=padT+8, BOT_MAX=axisY-3;
  var num=function(v){ return Number(v||0).toLocaleString('en-US'); };
  draw.forEach(function(m,i){
    var x=xAt(i);
    var items=[
      {cls:'l1', v:m.raisedNotFulfilled||0},
      {cls:'l2', v:m.notRaisedFulfilled||0},
      {cls:'l3', v:m.raisedFulfilled||0},
    ].map(function(it){ it.py=yAt(it.v); return it; })
     .sort(function(a,b){ return a.py-b.py; });          // highest point first
    var prev=-Infinity;
    items.forEach(function(it){ it.y=Math.max(it.py-9, TOP_MIN, prev+GAP); prev=it.y; });
    var over=items[items.length-1].y-BOT_MAX;
    if(over>0) items.forEach(function(it){ it.y=Math.max(TOP_MIN, it.y-over); });
    items.forEach(function(it){
      g+='<text class="ptlbl '+it.cls+'" x="'+x+'" y="'+it.y+'" text-anchor="middle">'+num(it.v)+'</text>';
    });
  });
  var colW=plotW/11;
  draw.forEach(function(m,i){ g+='<rect class="hit" data-i="'+i+'" x="'+(xAt(i)-colW/2)+'" y="'+padT+'" width="'+colW+'" height="'+plotH+'"/>'; });
  svg.innerHTML=g;
  var tip=document.getElementById('srChartTip'), vline=document.getElementById('srVLine'), wrap=document.getElementById('srChartWrap');
  svg.querySelectorAll('.hit').forEach(function(rect){
    rect.addEventListener('mouseenter', function(){
      var i=+rect.getAttribute('data-i'), m=months[i]; if(!m)return;
      var tot=m.total||0;
      var pct=function(n){ return tot>0?(' <b class="tt-pct">('+(Math.round((n/tot)*1000)/10)+'%)</b>'):''; };
      tip.innerHTML='<div class="tt-m">'+SR_MONTH_LBL[i]+' 2026 \u00b7 '+tot+' created</div>'+
        '<div class="tt-row"><span class="k"><i style="background:#e5484d"></i>Raised but refused</span><span class="v">'+(m.raisedNotFulfilled||0)+pct(m.raisedNotFulfilled||0)+'</span></div>'+
        '<div class="tt-row"><span class="k"><i style="background:#3b6fe0"></i>Not raised, exclusion applied</span><span class="v">'+(m.notRaisedFulfilled||0)+pct(m.notRaisedFulfilled||0)+'</span></div>'+
        '<div class="tt-row"><span class="k"><i style="background:#0d9488"></i>Raised and aligned</span><span class="v">'+(m.raisedFulfilled||0)+pct(m.raisedFulfilled||0)+'</span></div>'+
        '<div class="tt-sep"></div>'+
        '<div class="tt-pct-lbl">Address exclusion / depri resolution:</div>'+
        '<div class="tt-row"><span class="k">Non-pet</span><span class="v">'+(m.fulfilledNonPet||0)+'</span></div>'+
        '<div class="tt-row"><span class="k">Pet</span><span class="v">'+(m.fulfilledPet||0)+'</span></div>';
      var cx=xAt(i); vline.setAttribute('x1',cx); vline.setAttribute('x2',cx); vline.style.visibility='visible';
      var box=svg.getBoundingClientRect(), px=(cx/W)*box.width; tip.classList.add('show');
      var tw=tip.offsetWidth||220; var left=px+14; if(left+tw>box.width)left=px-tw-14; if(left<0)left=4;
      tip.style.left=left+'px'; tip.style.top='8px';
    });
  });
  if(!wrap._srLeave){   // bind once per wrap (drawSrChart re-runs on resize)
    wrap._srLeave=true;
    wrap.addEventListener('mouseleave', function(){ var t=document.getElementById('srChartTip'), v=document.getElementById('srVLine'); if(t)t.classList.remove('show'); if(v)v.style.visibility='hidden'; });
  }
}
// Redraw on resize so the chart keeps filling 100% of its box at the new width (debounced).
(function(){
  var tmr=null;
  window.addEventListener('resize', function(){
    clearTimeout(tmr);
    tmr=setTimeout(function(){ if(SR_MONTHLY && document.getElementById('srChartSvg')) drawSrChart(SR_MONTHLY); }, 150);
  });
})();

// ================= SECTION 2: Country -> State / Station grouping =================
var SR_FLAT=null;              // { total, tickets:[...] }
var SR_PHD=true, SR_NONPHD=true; // By-agent checkboxes for section 2 (both on by default)
var SR_CAT='raised';          // active category radio: raised | declined | aligned (default c = raised)
var SR_PAGER={};               // id -> { keys:[...], groups:{key:[tickets]}, icon, page } for paginated bucket lists
var SR_PAGE_SIZE=10;           // show 10 states / 10 stations per page
// Filter the flat list by the category radio (raised/declined/aligned) AND the PHD/Non-PHD checkboxes.
function srFiltered(tickets){
  return (tickets||[]).filter(function(t){
    if(t.category!==SR_CAT) return false;
    var p=isPhdUser(t.resolvedBy); return (p&&SR_PHD)||(!p&&SR_NONPHD);
  });
}
// Category radio handler.
function srSetCat(c){ SR_CAT=c; renderCountryView(); }
window.srSetCat=srSetCat;
// A ticket table: Ticket | HI (desc) | Created | Resolved By | Title.
function srTable(list){
  var rows=list.slice().sort(function(a,b){ return b.hi-a.hi; }).map(function(t){
    var link=t.url?('<a class="np-id" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.shortId)+'</a>'):esc(t.shortId);
    var by=esc(displayAgent(t.resolvedBy)||'—')+(isPhdUser(t.resolvedBy)?' <span class="np-phd">PHD</span>':'');
    return '<tr>'+
      '<td>'+link+'</td>'+
      '<td class="np-c">'+t.hi+'</td>'+
      '<td>'+fmtDate(t.createDate)+'</td>'+
      '<td>'+by+'</td>'+
      '<td class="np-title" title="'+esc(t.title)+'">'+esc(t.title)+'</td>'+
    '</tr>';
  }).join('');
  return '<div class="np-tablewrap"><table class="np-tbl">'+
    '<colgroup><col style="width:13%"><col style="width:6%"><col style="width:13%"><col style="width:20%"><col style="width:48%"></colgroup>'+
    '<thead><tr><th>Ticket</th><th class="np-c">HI</th><th>Created</th><th>Resolved By</th><th>Title</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}
// A paginated "State Wise" / "Station Wise" bucket list. Buckets the filtered tickets by key
// (ordered by ticket count desc), registers them under `id`, and renders only SR_PAGE_SIZE (10)
// buckets at a time with a pager. Each bucket is a nested collapsible row with its ticket table.
function srBuckets(id, tickets, keyFn, iconName, emptyKey, labelFn, searchPlaceholder){
  var groups={};
  tickets.forEach(function(t){ var k=keyFn(t)||emptyKey; (groups[k]=groups[k]||[]).push(t); });
  var keys=Object.keys(groups).sort(function(a,b){ return groups[b].length-groups[a].length; });
  SR_PAGER[id]={ keys:keys, groups:groups, icon:iconName, page:0, query:'', labelFn:(labelFn||function(k){return esc(k);}) };
  // The search input stays OUTSIDE the re-rendered list so typing never loses focus; only #<id>-list
  // is repainted on each keystroke / page change.
  var ph=esc(searchPlaceholder||'Search…');
  return '<div class="sr-pagewrap" id="'+id+'">'+
    '<div class="sr-search"><span class="sr-search-ic">'+ic('search',14)+'</span>'+
      '<input type="text" placeholder="'+ph+'" oninput="srBucketSearch(\''+id+'\',this.value)" autocomplete="off">'+
    '</div>'+
    '<div id="'+id+'-list">'+srBucketPageHtml(id)+'</div>'+
  '</div>';
}
// Keys that match the current query (by code OR full label), case-insensitive.
function srFilteredKeys(id){
  var p=SR_PAGER[id]; if(!p) return [];
  var q=String(p.query||'').trim().toLowerCase();
  if(!q) return p.keys;
  return p.keys.filter(function(k){
    var label=String(p.labelFn(k)||'').toLowerCase();
    return String(k).toLowerCase().indexOf(q)>=0 || label.indexOf(q)>=0;
  });
}
// Render the CURRENT page of (filtered) buckets for a registered group + the pager control.
function srBucketPageHtml(id){
  var p=SR_PAGER[id]; if(!p) return '';
  var keys=srFilteredKeys(id);
  if(!keys.length) return '<div class="sr-empty">No matches.</div>';
  var pages=Math.ceil(keys.length/SR_PAGE_SIZE);
  if(p.page>=pages) p.page=pages-1; if(p.page<0) p.page=0;
  var start=p.page*SR_PAGE_SIZE, end=Math.min(start+SR_PAGE_SIZE, keys.length);
  var rows=keys.slice(start,end).map(function(k){
    return '<div class="hr-sub">'+
      '<button type="button" class="hr-sub-head" onclick="srSubToggle(this)">'+
        '<span class="hr-sub-ic">'+ic(p.icon,15)+'</span>'+
        '<span class="hr-sub-title">'+p.labelFn(k)+'</span>'+
        '<span class="hr-sub-meta">'+p.groups[k].length+' tickets</span>'+
        '<span class="hr-caret" aria-hidden="true">\u25be</span>'+
      '</button>'+
      '<div class="hr-sub-body">'+srTable(p.groups[k])+'</div>'+
    '</div>';
  }).join('');
  var pager='';
  if(pages>1){
    pager='<div class="sr-pager">'+
      '<button class="sr-pg-btn" '+(p.page<=0?'disabled':'')+' onclick="srPage(\''+id+'\',-1)">\u2039 Prev</button>'+
      '<span class="sr-pg-info">'+(start+1)+'\u2013'+end+' of '+keys.length+'</span>'+
      '<button class="sr-pg-btn" '+(p.page>=pages-1?'disabled':'')+' onclick="srPage(\''+id+'\',1)">Next \u203a</button>'+
    '</div>';
  }
  return rows+pager;
}
// Search handler: store query, reset to page 1, re-render only the list part (keeps input focus).
function srBucketSearch(id, val){
  var p=SR_PAGER[id]; if(!p) return;
  p.query=val; p.page=0;
  var el=document.getElementById(id+'-list'); if(el) el.innerHTML=srBucketPageHtml(id);
}
window.srBucketSearch=srBucketSearch;
// Flip a bucket group's page (dir = -1 / +1) and re-render just that group's container in place.
function srPage(id, dir){
  var p=SR_PAGER[id]; if(!p) return;
  p.page+=dir;
  var el=document.getElementById(id+'-list'); if(el) el.innerHTML=srBucketPageHtml(id);
}
window.srPage=srPage;
// Nested-accordion toggle (country card, and State/Station group inside it).
function srSubToggle(btn){
  var s=btn.closest('.hr-sub'); if(!s)return;
  var willOpen=!s.classList.contains('open');
  var scope=s.parentNode||document;
  Array.prototype.forEach.call(scope.children, function(o){ if(o!==s && o.classList && o.classList.contains('hr-sub')) o.classList.remove('open'); });
  s.classList.toggle('open', willOpen);
}
window.srSubToggle=srSubToggle;
// Checkbox toggles for section 2.
function srToggleKind(which, cb){ if(which==='phd')SR_PHD=cb.checked; else SR_NONPHD=cb.checked; renderCountryView(); }
window.srToggleKind=srToggleKind;

function srCountrySectionHtml(){
  var ck=function(c){ return SR_CAT===c?' checked':''; };
  var checks=
    '<div class="np-controls">'+
      '<div class="np-seg" role="radiogroup">'+
        '<label class="np-seg-opt"><input type="radio" name="srCat" value="declined"'+ck('declined')+' onchange="srSetCat(\'declined\')"><span>PHD declined requests</span></label>'+
        '<label class="np-seg-opt"><input type="radio" name="srCat" value="aligned"'+ck('aligned')+' onchange="srSetCat(\'aligned\')"><span>PHD aligned requests</span></label>'+
        '<label class="np-seg-opt"><input type="radio" name="srCat" value="raised"'+ck('raised')+' onchange="srSetCat(\'raised\')"><span>PHD raised requests</span></label>'+
      '</div>'+
      '<div style="flex:1"></div>'+
      '<div class="np-checks">'+
        '<label class="np-chip"><input type="checkbox" checked onchange="srToggleKind(\'phd\',this)"><span>PHD Analysts</span></label>'+
        '<label class="np-chip"><input type="checkbox" checked onchange="srToggleKind(\'nonphd\',this)"><span>Non-PHD Analysts</span></label>'+
      '</div>'+
    '</div>';
  return '<div class="sr-sec" id="sec-country">'+
    '<div class="sr-sec-head" onclick="toggleSection(this)" role="button" tabindex="0" aria-expanded="false">'+
      '<div class="sr-sec-head-left"><div class="sr-sec-title"><span class="sec-ic">'+ic('globe',18)+'</span> Station Requests by Country</div></div>'+
      '<div class="sr-sec-head-right"><span class="sr-caret">\u25be</span></div>'+
    '</div>'+
    '<div class="sr-sec-body">'+ldHtml('srCountry')+'<div id="srCountryContent" style="display:none">'+checks+'<div id="srCountryBody"></div></div></div>'+
  '</div>';
}
// Build the Country -> (State Wise / Station Wise) tree for the current checkbox filter.
function renderCountryView(){
  var box=document.getElementById('srCountryBody'); if(!box) return;
  if(!SR_FLAT){ box.innerHTML='<div class="np-sk-wrap">'+Array(6).join('<div class="np-sk-row"><span class="np-sk b1"></span><span class="np-sk b2"></span><span class="np-sk b3"></span><span class="np-sk b4"></span><span class="np-sk b5"></span></div>')+'</div>'; return; }
  var tickets=srFiltered(SR_FLAT.tickets||[]);
  if(!tickets.length){ box.innerHTML='<div class="sr-empty">No station-request tickets for the selected analyst type.</div>'; return; }
  var byCountry={}; tickets.forEach(function(t){ (byCountry[t.country]=byCountry[t.country]||[]).push(t); });
  var codes=Object.keys(byCountry).sort(function(a,b){ return byCountry[b].length-byCountry[a].length; });
  SR_PAGER={}; // reset pagers each render (checkbox change rebuilds the tree)
  box.innerHTML=codes.map(function(code,ci){
    var list=byCountry[code];
    var stId='sr-state-'+ci, snId='sr-station-'+ci;
    var stateWise=srBuckets(stId, list, function(t){ return t.state; }, 'map-pin', 'Unknown', srStateLabel, 'Search a state…');
    var stationWise=srBuckets(snId, list, function(t){ return t.station; }, 'inbox', 'Unknown', null, 'Search a station…');
    var nStates=SR_PAGER[stId].keys.length, nStations=SR_PAGER[snId].keys.length;
    return '<div class="hr-sub sr-country">'+
      '<button type="button" class="hr-sub-head" onclick="srSubToggle(this)">'+
        '<span class="hr-sub-ic">'+ic('globe',15)+'</span>'+
        '<span class="hr-sub-title">'+srCountryLabel(code)+'</span>'+
        '<span class="hr-sub-meta">'+list.length+' tickets</span>'+
        '<span class="hr-caret" aria-hidden="true">\u25be</span>'+
      '</button>'+
      '<div class="hr-sub-body">'+
        '<div class="hr-sub sr-sub2"><button type="button" class="hr-sub-head" onclick="srSubToggle(this)"><span class="hr-sub-ic">'+ic('map-pin',15)+'</span><span class="hr-sub-title">State Wise</span><span class="hr-sub-meta">'+nStates+' '+(nStates===1?'state':'states')+'</span><span class="hr-caret" aria-hidden="true">\u25be</span></button><div class="hr-sub-body">'+stateWise+'</div></div>'+
        '<div class="hr-sub sr-sub2"><button type="button" class="hr-sub-head" onclick="srSubToggle(this)"><span class="hr-sub-ic">'+ic('inbox',15)+'</span><span class="hr-sub-title">Station Wise</span><span class="hr-sub-meta">'+nStations+' '+(nStations===1?'station':'stations')+'</span><span class="hr-caret" aria-hidden="true">\u25be</span></button><div class="hr-sub-body">'+stationWise+'</div></div>'+
      '</div>'+
    '</div>';
  }).join('');
}
window.renderCountryView=renderCountryView;

// Paint the full page shell (banner + both sections). Sections show their own shimmer while
// SR_MONTHLY / SR_FLAT are still null, so the user sees the real layout immediately — not a spinner.
function paintShell(){
  document.getElementById('wrap').innerHTML=
    srChartSectionHtml()+
    srCountrySectionHtml();
  // No eager render: each section fetches + draws on its first expand (see srLoadChart/Country).
}

async function load(){
  if(!A.getUser()||!A.getToken()){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  if(!(A.canViewSR&&A.canViewSR())){ location.replace('index.html'); return; }
  // 1) Paint the shell IMMEDIATELY (chart section expanded, country collapsed).
  paintShell();
  // 2) Roster first (for PHD tags) so classification is ready before a section fetches.
  try{ var ru=await A.api('GET','/api/user-roles'); if(ru&&ru.ok&&Array.isArray(ru.data)){ SR_USERS=new Set(ru.data.map(function(u){return String(u.username||'').trim().toLowerCase();})); } }catch(e){ SR_USERS=null; }
  // 3) Chart section is open by default -> load it now. Country section lazy-loads on first expand.
  srLoadChart();
}

document.addEventListener('DOMContentLoaded',load);
</script>
