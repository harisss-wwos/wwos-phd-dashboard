<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hashtags · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252;--tl:#44b9d6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#000;border-radius:5px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.wrap{padding:32px 24px;width:auto;max-width:none;margin-left:15px;margin-right:15px}
/* Header */
.hx-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.hx-head h1{margin:0;color:#fff;font-size:1.7em;font-weight:700;display:inline-flex;align-items:center;gap:10px}
.hx-head h1 .hx-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:rgba(255,153,0,.16);color:var(--o);flex-shrink:0}
.hx-sub{color:var(--tm);font-size:.9em;line-height:1.55;margin:6px 0 12px;max-width:900px}
.hx-sub b{color:#fff}
.hx-from{display:inline-flex;align-items:center;gap:7px;margin:0 0 22px;color:var(--tl);font-weight:600;font-size:.85em}
.hx-from svg{flex-shrink:0}
/* ---- Illustrated gradient banner header (matches the SLA Breaches page banner) ---- */
.hx-banner{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-radius:5px;padding:16px 22px;min-height:82px;margin-bottom:14px;
  border:1px solid #242a31;box-shadow:0 12px 30px -20px rgba(0,0,0,.75);
  background:linear-gradient(90deg,#7c5cff,#a78bfa 55%,#cbb8ff);background-size:200% 100%;animation:hxBanner 9s ease infinite}
@keyframes hxBanner{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hx-banner .hb-left{position:relative;z-index:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.hx-banner .hb-title{margin:0;display:inline-flex;align-items:center;gap:11px;font-size:1.5em;font-weight:800;letter-spacing:-.3px;line-height:1.1;color:#241354}
.hx-banner .hb-title svg{flex-shrink:0;color:#241354}
.hx-banner .hb-sub{font-size:.86em;font-weight:500;line-height:1.5;max-width:80ch;color:rgba(36,19,84,.82)}
.hx-banner .hb-sub b{color:#180d3a;font-weight:800}
/* Total-count pill on the right side of the banner. */
.hx-banner .hb-total{position:relative;z-index:1;display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.72);border-radius:5px;padding:9px 18px;box-shadow:0 2px 6px rgba(0,0,0,.12);color:#241354}
.hx-banner .hb-total .n{font-size:1.5em;font-weight:900;line-height:1}
.hx-banner .hb-total .l{font-size:.66em;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.hx-banner::after{content:"";position:absolute;top:0;bottom:0;right:150px;width:210px;
  background-repeat:no-repeat;background-position:right center;background-size:auto 116%;opacity:.32;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M40 20L32 60M62 20L54 60M26 34h44M22 50h44"/><circle cx="92" cy="30" r="12"/><path d="M92 24v6l4 3"/></svg>')}
@media(max-width:640px){.hx-banner .hb-title{font-size:1.25em}.hx-banner::after{opacity:.2}.hx-banner .hb-total{margin-left:0}}
/* Hashtag definition ("Use When") shown under each section's tag in the head bar. */
.hx-sec-title-wrap{display:flex;flex-direction:column;gap:3px;min-width:0;width:100%}
.hx-def{color:var(--tm);font-size:.8em;font-weight:400;line-height:1.45;width:100%;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help}
.hx-def.none{font-style:italic;opacity:.7}
/* Zero-count section: dim the count pill so the "tracked but empty" tags read as secondary. */
.hx-count.zero{background:rgba(135,149,150,.12);color:var(--tm);border-color:rgba(135,149,150,.3)}
/* Empty-state shown inside a zero-count section body. */
.hx-none-yet{display:flex;align-items:flex-start;gap:12px;padding:22px;color:var(--tm);font-size:.9em;line-height:1.5;background:rgba(255,255,255,.02);border:1px dashed #2a323b;border-radius:5px;margin:6px 0 4px}
.hx-none-yet b{color:var(--t)}
.hx-none-yet .hx-tag{color:var(--o)}
.hx-none-yet svg{flex-shrink:0;margin-top:2px;color:var(--tm)}
/* Collapsible GROUP block (DEFECTS / PATTERNS), each wrapping a set of hashtag section cards. */
.hx-group{margin-top:26px}
.hx-group:first-of-type{margin-top:6px}
.hx-group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;padding:14px 18px;border-radius:5px;cursor:pointer;user-select:none}
.hx-group-head:focus-visible{outline:2px solid #7c5cff;outline-offset:3px;border-radius:5px}
.hx-group-label{display:inline-flex;align-items:center;gap:10px;font-size:1.02em;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#fff}
.hx-group-label svg{flex-shrink:0}
.hx-group-head-right{display:inline-flex;align-items:center;gap:12px}
.hx-group-meta{font-size:.74em;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:rgba(255,255,255,.9)}
.hx-group-caret{color:#fff;font-size:.9em;transition:transform .25s ease;display:inline-flex}
.hx-group.collapsed .hx-group-caret{transform:rotate(-90deg)}
/* Group body animates open/closed. Collapsed = height 0 + hidden. */
.hx-group-body{overflow:hidden;transition:max-height .34s ease,opacity .25s ease;max-height:200000px;opacity:1}
.hx-group.collapsed .hx-group-body{max-height:0;opacity:0}
/* Section card (collapsible accordion — one open at a time) */
.hx-sec{background:linear-gradient(180deg,#15181d,#0f1115);border:1px solid #242a31;border-top:3px solid var(--o);border-radius:5px;margin-bottom:16px;overflow:hidden}
.hx-sec-head{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;cursor:pointer;user-select:none;transition:background .15s}
.hx-sec-head:hover{background:rgba(255,255,255,.03)}
/* Hashtag illustration watermark behind the head, right side (mask-faded so text stays readable). */
.hx-sec-head::after{content:"";position:absolute;top:0;bottom:0;right:150px;width:120px;background-repeat:no-repeat;background-position:center;background-size:auto 74%;opacity:.10;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ff9900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M46 18L38 62M74 18L66 62M28 34h60M24 50h60"/></svg>')}
.hx-sec-title{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;color:#fff;font-size:1.08em;font-weight:700;min-width:0;flex:1 1 auto}
.hx-tag{font-family:'Inter',monospace;color:var(--o)}
.hx-sec-head-right{position:relative;z-index:1;display:flex;align-items:center;gap:12px;flex-shrink:0}
.hx-count{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:28px;padding:0 12px;border-radius:5px;font-weight:800;font-size:.88em;background:rgba(255,153,0,.14);color:var(--o);border:1px solid rgba(255,153,0,.35)}
.hx-caret{color:var(--tm);display:inline-flex;transition:transform .2s ease}
.hx-sec.open .hx-caret{transform:rotate(180deg)}
.hx-sec-body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 22px}
.hx-sec.open .hx-sec-body{max-height:none;padding:8px 22px 14px}
/* Per-section chart (styled like the Repeat Incident wave chart) */
.hx-chart-title{color:#d5dbdb;font-size:.85em;text-transform:uppercase;letter-spacing:.5px;margin:4px 0 4px}
.hx-chart-sub{color:var(--tm);font-size:.82em;line-height:1.5;margin:0 0 12px}
.chart-box{background:#0b0d10;border:1px solid #1e242b;border-radius:5px;padding:14px 14px 6px;margin-bottom:20px}
.chart-wrap{position:relative;height:200px}
.chart-wrap.tall{height:300px}
/* Table (clean, borderless — no spreadsheet grid) */
.hx-tbl-wrap{overflow-x:auto;margin-bottom:10px}
.hx-tbl{width:100%;border-collapse:collapse;font-size:.88em}
.hx-tbl th,.hx-tbl td{border:none;border-bottom:1px solid rgba(255,255,255,.06);padding:10px 14px;text-align:left;vertical-align:middle}
.hx-tbl thead th{background:transparent;color:var(--tm);text-transform:uppercase;font-size:.72em;letter-spacing:.5px;font-weight:700;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.12)}
.hx-tbl tbody tr:hover td{background:rgba(255,153,0,.04)}
.hx-tbl tbody tr:last-child td{border-bottom:none}
.hx-fit{width:1%;white-space:nowrap}
.hx-center{text-align:center}
.hx-tbl th.hx-center,.hx-tbl td.hx-center{text-align:center}
.hx-idlink{color:#44b9d6;text-decoration:none;font-weight:700;white-space:nowrap}
.hx-idlink:hover{text-decoration:underline}
.hx-num{color:#879596;font-weight:600;white-space:nowrap}
.hx-assignee{color:var(--t);white-space:nowrap}
/* C/R status tag */
.hx-tag-s{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;font-weight:800;font-size:.78em}
.hx-tag-s.c{background:rgba(74,222,128,.16);color:var(--gl)}
.hx-tag-s.r{background:rgba(68,185,214,.16);color:var(--tl)}
.hx-tag-s.o{background:rgba(255,153,0,.16);color:var(--o)}
/* Truncated title */
.hx-title{max-width:1px;width:100%}
.hx-title-txt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t)}
/* Sort */
.hx-sort{cursor:pointer;user-select:none}
.hx-sort:hover{color:#fff}
.hx-sort-ar{color:var(--o);font-weight:800;margin-left:4px}
.hx-sort-ar.idle{color:#4a5560;font-weight:400}
/* Show more/less */
.hx-more{margin:2px 0 4px;display:flex;align-items:center;gap:12px}
.hx-more button{background:#1a2129;border:1px solid #2a3540;color:var(--t);border-radius:5px;padding:7px 14px;font-size:.82em;font-weight:600;cursor:pointer}
.hx-more button:hover{border-color:var(--o);color:#fff}
.hx-mcount{color:var(--tm);font-size:.8em}
.hx-empty{color:#5f6b6c;font-size:.86em;font-style:italic;padding:14px 4px}
/* Loading skeleton — collapsed section-card shells with shimmer (no big spinner). */
.hx-skel{margin-top:2px}
.sk-sec{background:linear-gradient(180deg,#15181d,#0f1115);border:1px solid #242a31;border-top:3px solid #2a323b;border-radius:5px;margin-bottom:16px;overflow:hidden}
.sk-sec-head{display:flex;align-items:center;gap:12px;padding:18px 22px}
.sk-ic{width:30px;height:30px;border-radius:50%;flex-shrink:0}
.sk-line{display:inline-block;border-radius:5px;background:#141a20;position:relative;overflow:hidden;vertical-align:middle}
.sk-line::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:hxSk 1.1s infinite}
.sk-ic{background:#141a20;position:relative;overflow:hidden}
.sk-ic::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);animation:hxSk 1.1s infinite}
@keyframes hxSk{100%{transform:translateX(100%)}}
/* gate */
.hx-gate{max-width:560px;margin:60px auto;text-align:center}
.hx-gate h1{color:#fff;font-size:1.5em;margin-bottom:10px}
.hx-gate p{color:var(--tm);line-height:1.55}
</style>

<!-- ===== Light-theme page override (loaded last, wins the cascade) ===== -->
<style id="hx-light">

.hx-sub{color:#5c6773!important}.hx-sub b{color:#1b2026!important}
/* Content column: no top gutter (kill topbar-auth's injected .wrap{padding-top:14px}); 12px sides
   kept (app-light band gutter); bottom reduced to 20px. ID scope beats the shared !important rules. */
#wrap.wrap{padding-top:0!important;padding-bottom:20px!important}
/* ---- Title bar: white, 60px, black font (overrides the purple gradient banner). ---- */
.hx-banner{background:#fff!important;border:1px solid #e2e6ea!important;min-height:60px!important;height:60px!important;padding:0 16px!important;margin-bottom:14px!important;box-shadow:0 1px 3px rgba(20,30,50,.06)!important;animation:none!important;flex-wrap:nowrap!important}
.hx-banner .hb-title,.hx-banner .hb-title svg{color:#1b2026!important}
.hx-banner .hb-title{font-size:1.25em!important}
.hx-banner .hb-sub{display:none!important}            /* subtitle hidden to fit the 60px bar */
.hx-banner .hb-total{background:#fff4e8!important;color:#b5560c!important;box-shadow:none!important;border:1px solid #f3d4b0!important;padding:5px 14px!important}
.hx-banner .hb-total .n{font-size:1.1em!important}
.hx-banner::after{display:none!important}             /* drop the watermark illustration on the slim bar */
/* Section cards white (keep orange sec-head top border). */
.hx-sec{background:#fff!important;border:1px solid #e2e6ea!important;border-top:3px solid #ec7211!important;box-shadow:0 1px 3px rgba(20,30,50,.06)!important}
.hx-sec-head:hover{background:#f7f9fb!important}
/* ---- DEFECTS / PATTERNS / OTHER groups: each is a card (border + radius), with a FULL-WIDTH
   COLORED HEADER BAR (white icon + title + caret) like a dashboard section on app.html. The header
   is flush to the card edges (rounded top corners); the body holds the hashtag cards with padding. */
.hx-group{background:#fff!important;border:1px solid #e2e6ea!important;border-radius:5px!important;box-shadow:0 10px 26px -20px rgba(20,30,50,.5)!important;padding:0!important;margin-top:18px!important;overflow:hidden!important}
.hx-group:first-of-type{margin-top:6px!important}
.hx-group-head{margin:0!important;border-radius:0!important}
/* Per-group header colors (app.html palette): DEFECTS = blue, PATTERNS = purple, OTHER = sky-blue. */
.hx-group-defects .hx-group-head{background:linear-gradient(90deg,#2563eb,#4f8cf0 55%,#9fc2fb)!important}
.hx-group-patterns .hx-group-head{background:linear-gradient(90deg,#7c5cff,#a78bfa 55%,#c9b6ff)!important}
.hx-group-other .hx-group-head{background:linear-gradient(90deg,#38bdf8,#7dd3fc 55%,#bae6fd)!important}
.hx-group-oos .hx-group-head{background:linear-gradient(90deg,#e5484d,#ff6b6b 55%,#ff9d9d)!important}
/* OOS subsection cards: red left-accent top border + red tag text to match the group. */
.hx-oos-sec{border-top:3px solid #e5484d!important}
.hx-oos-sec .hx-tag{color:#c0323a!important;font-weight:800}
.hx-group-head:hover{filter:brightness(1.03)!important}
.hx-group-body{padding:14px 16px!important}
.hx-group.collapsed .hx-group-body{padding-top:0!important;padding-bottom:0!important}
.hx-group-body>.hx-sec:last-child{margin-bottom:0!important}
.hx-sec-title{color:#1b2026!important}
.hx-tag{color:#b5560c!important}
.hx-def{color:#5c6773!important}
.hx-count{background:#fff4e8!important;color:#b5560c!important;border:1px solid #f3d4b0!important}
.hx-count.zero{background:#f0f3f6!important;color:#8793a0!important;border:1px solid #e2e6ea!important}
.hx-caret{color:#9aa5b1!important}
.hx-none-yet{background:#f7f9fb!important;border:1px dashed #d4dce4!important;color:#5c6773!important}
.hx-none-yet b{color:#1b2026!important}
.hx-none-yet .hx-tag{color:#b5560c!important}
/* Chart box. */
.hx-chart-title{color:#2a3340!important}
.hx-chart-sub{color:#5c6773!important}
.hx-chart-sub b[style*="#a78bfa"]{color:#7c5cff!important}
.chart-box{background:#fff!important;border:1px solid #e6eaee!important}
/* Table. */
.hx-tbl th,.hx-tbl td{border-bottom:1px solid #eef1f4!important}
.hx-tbl thead th{color:#5c6773!important;border-bottom:1px solid #e2e6ea!important}
.hx-tbl tbody tr:hover td{background:#fff7ed!important}
.hx-idlink{color:#1577a0!important}
.hx-num{color:#5c6773!important}
.hx-assignee{color:#2a3340!important}
.hx-title-txt{color:#2a3340!important}
.hx-sort:hover{color:#1b2026!important}
.hx-sort-ar{color:#ec7211!important}.hx-sort-ar.idle{color:#aab4bd!important}
.hx-tag-s.c{background:#eafaf0!important;color:#1f9d57!important}
.hx-tag-s.r{background:#eaf4fb!important;color:#1577a0!important}
.hx-tag-s.o{background:#fff4e8!important;color:#b5680c!important}
/* Show more/less. */
.hx-more button{background:#fff!important;border:1px solid #e2e6ea!important;color:#2a3340!important}
.hx-more button:hover{border-color:#ec7211!important;color:#1b2026!important}
.hx-mcount{color:#8793a0!important}
.hx-empty{color:#8793a0!important}
/* Skeleton — mirrors the loaded layout: white 60px title bar + colored group bars + white cards. */
.sk-titlebar{height:60px;background:#fff;border:1px solid #e2e6ea;border-radius:5px;box-shadow:0 1px 3px rgba(20,30,50,.06);display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:14px}
.sk-group{background:#fff;border:1px solid #e2e6ea;border-radius:5px;box-shadow:0 10px 26px -20px rgba(20,30,50,.5);overflow:hidden;margin-top:18px}
.sk-group:first-of-type{margin-top:6px}
.sk-grouphead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px}
.sk-group-defects .sk-grouphead{background:linear-gradient(90deg,#2563eb,#4f8cf0 55%,#9fc2fb)}
.sk-group-patterns .sk-grouphead{background:linear-gradient(90deg,#7c5cff,#a78bfa 55%,#c9b6ff)}
.sk-group-oos .sk-grouphead{background:linear-gradient(90deg,#e5484d,#ff6b6b 55%,#ff9d9d)}
.sk-groupbody{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
/* Shimmer tones: a clearly visible light-grey fill on the white surfaces with a brighter moving
   highlight; a clearly visible translucent-white sweep on the colored group header bars. */
.sk-sec{background:#fff!important;border:1px solid #e2e6ea!important;border-top:3px solid #cdd5dd!important;margin-bottom:0!important}
.sk-line,.sk-ic{background:#e3e7ec!important}
.sk-line::after,.sk-ic::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent)!important}
.sk-glabel,.sk-gmeta{background:rgba(255,255,255,.5)!important}
.sk-glabel::after,.sk-gmeta::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent)!important}
/* Gate + button. */
.hx-gate h1{color:#1b2026!important}
.hx-gate p{color:#5c6773!important}
.btn{background:linear-gradient(180deg,#ff9f2e,#f07d0a)!important;color:#fff!important;border:none!important}
</style>
</head>
<body data-nav-active="hashtags" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="wrap" id="wrap">
  <div class="hx-skel">
    <!-- White 60px title-bar shell (matches .hx-banner). -->
    <div class="sk-titlebar">
      <span class="sk-line" style="width:150px;height:18px"></span>
      <span class="sk-line sk-pill" style="width:92px;height:34px;border-radius:5px"></span>
    </div>
    <!-- Group shell: a colored header bar + a few white section-card rows inside. ×2 (DEFECTS/PATTERNS). -->
    <div class="sk-group sk-group-defects">
      <div class="sk-grouphead"><span class="sk-line sk-glabel" style="width:120px;height:13px"></span><span class="sk-line sk-gmeta" style="width:150px;height:11px"></span></div>
      <div class="sk-groupbody">

<script>
const A=window.PHDAuth;

// Hashtag definitions ("Use When"), keyed by the tag WITHOUT the leading '#', lowercased.
// Spelling variants that appear in ticket Labels are aliased to the same definition so they resolve

var HX_DEFS={
  'out-of-scope':'No further action required by PHD Team due to the incident being outside PHD purview',
  'language-barrier':'Root cause of escalation likely involves a language barrier (ex. did not follow delivery instructions, Driver report is made in non-english language)',

  'mitigation-gap':'Used to document when a recommended mitigation is not currently available in this country/region; not an actionable resolution at this time',
  'mst-action':'When support teams fail to action (approve or deny) requested PHD action. This can include action items or PHD SIM communications',
  // --- Newly added tags (DEFECTS group). Definitions are provisional — update with official wording. ---
  'missing-auto-comms':'Expected automated communication to the customer/driver was not sent for the incident',
  'duplicate-report':'The incident is a duplicate of another report already in scope',
  'emt-defect':'A defect in the EMT (Escalation Management Tool) data or workflow for the incident',
  'no-phd-created':'No PHD case was created for an incident that should have had one',
  // --- Newly added tags (PATTERNS group). Definitions are provisional — update with official wording. ---
  'hi-handled-by-phd':'Historical Incident for the POI that was handled by the PHD team',

  'auto-resolve-defect':'A defect in the auto-resolve workflow caused an incident to be resolved incorrectly or without proper handling',
  'geo-c-d':'Geo country/domain discrepancy identified for the incident',

  'netradyne-audio-record-help':'Netradyne audio recording was requested/needed to assist the investigation',
  'netradyne-rear-camera-help':'Netradyne rear-camera footage was requested/needed to assist the investigation',
  'better-mitigation-needed':'The applied mitigation was insufficient; a stronger or more appropriate mitigation is needed'
};
// Canonical taxonomy split into TWO groups shown as separate sections on the page:
//   DEFECTS  — process/system defects (missing comms, duplicates, EMT/geopin/scope issues, etc.)
//   PATTERNS — behavioural / investigative patterns (misconduct, outreach, appeals, HI, etc.)
// Every tag renders even with 0 live tickets, so the full taxonomy stays visible. Order within each
// group is fixed (as listed) — groups are NOT re-sorted by ticket count.
var HX_GROUPS=[
  { key:'defects', label:'DEFECTS', tags:[
    '#no-emt-attached',
    '#api-emt-miss',
    '#missing-auto-comms',
    '#duplicate-report',
    '#incorrect-geopin',
    '#out-of-scope',
    '#emt-defect',
    '#no-phd-created',
    '#auto-resolve-defect',
    '#mst-action',
    '#geo-c-d',
    '#cx-acct-i-u'
  ]},
  { key:'patterns', label:'PATTERNS', tags:[
    '#cx-acct-l-u',
    '#appeal-review',
    '#contradictory-statement-no-proof',
    '#unsuccessful-outreach',
    '#language-barrier',
    '#hi-handled-by-phd',
    '#hi-not-handled-by-phd',
    '#dp-misconduct',
    '#hubda-misconduct',
    '#da-misconduct',
    '#cx-verification-rejection',
    '#support-p-b',
    '#address-employee',
    '#mitigation-gap',
    '#swa-order',
    '#netradyne-audio-record-help',
    '#netradyne-rear-camera-help',
    '#better-mitigation-needed'

];
// Flat ordered list derived from the two groups (defects first, then patterns). Used by the folding
// map + canonical-order tie-break below, keeping the rest of the page's logic unchanged.
var HX_ORDER=HX_GROUPS.reduce(function(acc,g){ return acc.concat(g.tags); },[]);
// Some tags appear in ticket Labels under a variant spelling. Map any variant -> the canonical tag
// in HX_ORDER, so live tickets land in the right (single) section regardless of how they were typed.
var HX_ALIAS={
  '#unsucessful-outreach':'#unsuccessful-outreach', // missing second 's'
  '#geopin':'#incorrect-geopin',                    // short form of the geopin tag
  '#support-f-r':'#support-p-b',                     // same definition, alt code
  '#s-req':'#out-of-scope'                           // (removed/low-yield) — fold defensively
};
// Normalize a raw "#tag" to its canonical form (lowercased, alias-resolved).
function hxCanon(tag){ var t='#'+String(tag||'').replace(/^#/,'').toLowerCase(); return HX_ALIAS[t]||t; }
// Look up a definition for a "#tag" (or bare tag). Returns '' if unknown.
function hxDefOf(tag){ var k=hxCanon(tag).replace(/^#/,''); return HX_DEFS[k]||''; }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gate(msg){document.getElementById('wrap').innerHTML='<div class="hx-gate"><h1>Hashtags</h1><p>'+esc(msg)+'</p><p style="margin-top:16px"><a class="btn" href="app.html">Back to the live dashboard</a></p></div>';}
function fmtDate(iso){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return esc(String(iso)); return d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'}); }
// C/R tag: C = Closed, R = Resolved, else first letter.
function statusTag(s){
  var v=String(s||'').toLowerCase();
  if(v==='closed')return '<span class="hx-tag-s c" title="Closed">C</span>';
  if(v==='resolved')return '<span class="hx-tag-s r" title="Resolved">R</span>';
  return '<span class="hx-tag-s o" title="'+esc(s||'')+'">'+esc((s||'?').charAt(0).toUpperCase())+'</span>';
}
// Display-only mapping for special assignee values. The underlying ticket data is untouched:
//   - the LM-CAP service account (a UUID) shows as "LM-CAP"
//   - a blank / missing assignee shows as "NO ASSIGNEE"
var HX_ASSIGNEE_MAP={ '0d1616c8-bcb7-4450-8bc5-f0a296bc01d1':'LM-CAP' };
function hxAssignee(a){
  var raw=String(a==null?'':a).trim();
  if(!raw) return 'NO ASSIGNEE';
  return HX_ASSIGNEE_MAP[raw.toLowerCase()]||raw;
}

// Per-section pagination + sort state, keyed by index. shown starts at 20 (+10 each).
var HX_SECS=[]; var HX_PAGE0=20, HX_STEP=10;
var HX_CHARTS={}; // idx -> Chart instance
var HX_OOS=null;  // /api/out-of-scope-report payload: { groups:[{key,label,count,tickets:[...]}] }
var HX_OOS_SHOWN={}; // oos group key -> number of rows currently shown (pagination)
var HX_OOS_CHARTS={}; // oos group key -> Chart instance

// ISO week key (Mon-anchored) + a readable label for a date.
function hxWeekStart(d){ var x=new Date(d.getTime()); var day=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-day); x.setUTCHours(0,0,0,0); return x; }
// Bucket a section's tickets by the week their CreateDate falls in (gaps filled with 0).
function hxWeeklyBuckets(tickets){
  var byKey={}, min=null, max=null;
  (tickets||[]).forEach(function(t){
    var d=new Date(t.created); if(isNaN(d)) return;
    var ws=hxWeekStart(d); var k=ws.getTime();
    byKey[k]=(byKey[k]||0)+1;
    if(min===null||k<min)min=k; if(max===null||k>max)max=k;
  });
  var labels=[], data=[];
  if(min===null){ return {labels:labels,data:data}; }
  var WK=7*24*3600*1000;
  for(var k=min;k<=max;k+=WK){
    var dt=new Date(k);
    labels.push(dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    data.push(byKey[k]||0);
  }
  return {labels:labels,data:data};
}
// A filled "wave" area dataset (matches the Repeat Incident chart's look).
function hxWave(label,data,color,rgbaPrefix){
  return {label:label,data:data,borderColor:color,pointBackgroundColor:color,pointRadius:3,
    borderWidth:2,tension:.45,fill:true,spanGaps:true,
    backgroundColor:function(ctx){var c=ctx.chart.ctx;var g=c.createLinearGradient(0,0,0,300);
      g.addColorStop(0,rgbaPrefix+'.32)');g.addColorStop(1,rgbaPrefix+'.02)');return g;}};
}
// Draw (or redraw) the per-section wave chart. Destroys any prior instance on the canvas.
function hxDrawChart(idx){
  if(typeof Chart==='undefined')return;
  var a=HX_SECS[idx]; if(!a)return;
  var cv=document.getElementById('hxCanvas'+idx); if(!cv)return;
  var b=hxWeeklyBuckets(a.tickets);
  if(HX_CHARTS[idx]){ try{HX_CHARTS[idx].destroy();}catch(e){} delete HX_CHARTS[idx]; }
  Chart.defaults.color='#5c6773'; Chart.defaults.borderColor='rgba(0,0,0,0.06)';
  HX_CHARTS[idx]=new Chart(cv,{type:'line',
    data:{labels:b.labels,datasets:[hxWave(a.tag+' tickets',b.data,'#7c5cff','rgba(124,92,255,')]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:true,position:'top',labels:{usePointStyle:true,boxWidth:8,font:{size:12}}}},
      scales:{y:{beginAtZero:true,grid:{color:'rgba(0,0,0,.05)'},title:{display:true,text:'Tickets created',color:'#2a3340',font:{size:12}},ticks:{font:{size:11},precision:0}},
        x:{grid:{display:false},ticks:{font:{size:11}}}}}});
}
function hxArrow(a,field){
  if(a.sortField!==field) return '<span class="hx-sort-ar idle">\u21c5</span>';
  return a.sortDir==='desc'?'<span class="hx-sort-ar">\u25bc</span>':'<span class="hx-sort-ar">\u25b2</span>';
}
function hxSortVal(t,field){
  if(field==='created') return new Date(t.created).getTime()||0;
  if(field==='assignee') return hxAssignee(t.assignee).toLowerCase();
  if(field==='status') return String(t.status||'').toLowerCase();
  if(field==='ticket') return String(t.shortId||'').toLowerCase();
  return String(t.title||'').toLowerCase();
}
function hxSecTableHtml(idx){
  var a=HX_SECS[idx]; if(!a) return '';
  var field=a.sortField||'created', dir=a.sortDir||'desc';
  var tix=(a.tickets||[]).slice().sort(function(x,y){
    var vx=hxSortVal(x,field), vy=hxSortVal(y,field);
    if(vx<vy) return dir==='desc'?1:-1;
    if(vx>vy) return dir==='desc'?-1:1;
    return 0;
  });
  var shown=Math.min(a.shown||HX_PAGE0, tix.length);
  var rows='';
  for(var i=0;i<shown;i++){
    var t=tix[i];
    var link=t.url?('<a class="hx-idlink" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.shortId||'—')+'</a>'):esc(t.shortId||'—');
    rows+='<tr>'
      +'<td class="hx-fit hx-center">'+link+'</td>'
      +'<td class="hx-fit hx-center hx-num">'+fmtDate(t.created)+'</td>'
      +'<td class="hx-fit hx-assignee">'+esc(hxAssignee(t.assignee))+'</td>'
      +'<td class="hx-fit hx-center">'+statusTag(t.status)+'</td>'
      +'<td class="hx-title"><span class="hx-title-txt" title="'+esc(t.title||'')+'">'+esc(t.title||'—')+'</span></td>'
      +'</tr>';
  }
  if(!tix.length) rows='<tr><td colspan="5" class="hx-empty">No tickets.</td></tr>';
  var th=function(field,label,extra){
    return '<th class="hx-sort '+(extra||'')+'" onclick="hxSort('+idx+',\''+field+'\')">'+label+hxArrow(a,field)+'</th>';
  };
  var head='<thead><tr>'
    +th('ticket','Ticket ID','hx-fit hx-center')
    +th('created','Created','hx-fit hx-center')
    +th('assignee','Assignee','hx-fit')
    +th('status','Status','hx-fit hx-center')
    +th('title','Title')
    +'</tr></thead>';
  var more='';
  if(tix.length>HX_PAGE0){
    var canMore=shown<tix.length, canLess=shown>HX_PAGE0;
    more='<div class="hx-more">'
      +(canMore?'<button onclick="hxMore('+idx+')">Show more</button>':'')
      +(canLess?'<button onclick="hxLess('+idx+')">Show less</button>':'')

}
function hxSort(idx,field){
  var a=HX_SECS[idx]; if(!a) return;
  if(a.sortField===field){ a.sortDir=(a.sortDir==='desc'?'asc':'desc'); }
  else { a.sortField=field; a.sortDir=(field==='created'?'desc':'asc'); }
  var body=document.getElementById('hxBody'+idx); if(body) body.innerHTML=hxSecTableHtml(idx);
}
function hxMore(idx){ var a=HX_SECS[idx]; if(!a)return; a.shown=Math.min((a.shown||HX_PAGE0)+HX_STEP,(a.tickets||[]).length); var b=document.getElementById('hxBody'+idx); if(b)b.innerHTML=hxSecTableHtml(idx); }
function hxLess(idx){ var a=HX_SECS[idx]; if(!a)return; a.shown=HX_PAGE0; var b=document.getElementById('hxBody'+idx); if(b)b.innerHTML=hxSecTableHtml(idx); }
// Accordion: only one section open at a time.
function hxToggle(idx){
  var sec=document.getElementById('hxSec'+idx); if(!sec) return;
  var wasOpen=sec.classList.contains('open');
  document.querySelectorAll('.hx-sec.open').forEach(function(s){ s.classList.remove('open'); });
  if(!wasOpen){ sec.classList.add('open'); setTimeout(function(){ hxDrawChart(idx); },60); }
}

function render(data){
  var secs=(data&&data.sections)||[];
  // Fold the live sections into a map keyed by CANONICAL tag (alias-resolved), merging tickets so a
  // variant spelling and its canonical tag collapse into one section (deduped by shortId).
  var byTag={};
  secs.forEach(function(s){
    var canon=hxCanon(s.tag);
    var cur=byTag[canon]||(byTag[canon]={ tag:canon, tickets:[], seen:{} });
    (s.tickets||[]).forEach(function(t){
      var id=String(t.shortId||'');
      if(id&&cur.seen[id]) return;
      if(id) cur.seen[id]=1;
      cur.tickets.push(t);
    });
  });
  // Which group a canonical tag belongs to (defects / patterns), from HX_GROUPS.
  var groupOf={}; HX_GROUPS.forEach(function(g){ g.tags.forEach(function(t){ groupOf[t]=g.key; }); });
  // EVERY defined hashtag appears, even with 0 tickets. Build in the fixed group order (defects, then
  // patterns), preserving each group's listed tag order — groups are NOT re-sorted by ticket count.
  var used={};
  HX_SECS=HX_ORDER.map(function(tag){
    used[tag]=1;
    var m=byTag[tag];
    return { tag:tag, group:(groupOf[tag]||'other'), count:m?m.tickets.length:0, tickets:m?m.tickets:[], shown:HX_PAGE0, sortField:'created', sortDir:'desc' };
  });
  // ...then append any live tags not in the canonical taxonomy (so nothing from the data is dropped);
  // these land in a trailing "OTHER" group.
  Object.keys(byTag).forEach(function(tag){
    if(used[tag]) return;
    HX_SECS.push({ tag:tag, group:'other', count:byTag[tag].tickets.length, tickets:byTag[tag].tickets, shown:HX_PAGE0, sortField:'created', sortDir:'desc' });
  });
  var rawSrc=(data&&data.generatedFrom)||'25th September 2026.csv';
  var isLive=/live/i.test(rawSrc);
  var src=isLive?('Live — all uploaded tickets (created on/after '+((data&&data.from)||'2026-04-01')+')'):rawSrc;
  // Total tagged tickets across all sections (deduped per section already; this is the sum of counts).
  var totalTagged=HX_SECS.reduce(function(s,x){ return s+(Number(x.count)||0); },0);
  var totalTags=HX_SECS.length;
  // Inline clock SVG for the "Hashtags" banner glyph.
  var hashGlyph='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>';
  var html='<div class="hx-banner">'
    +'<div class="hb-left">'
      +'<h1 class="hb-title">'+hashGlyph+'Hashtags</h1>'
      +'<div class="hb-sub">One section per hashtag found in the <b>Labels</b> column, with the definition of each. '
        +'Updates automatically as files are uploaded. <b>'+esc(src)+'</b></div>'
    +'</div>'
    +'<div class="hb-total"><span class="n">'+totalTagged+'</span><span class="l">'+totalTags+' hashtags</span></div>'
  +'</div>';
  if(!HX_SECS.length){ html+='<div class="hx-empty">No hashtags found in the Labels column.</div>'; document.getElementById('wrap').innerHTML=html; return; }
  // Group label + per-group tagged/tag counts for the group header rows.
  var GROUP_LABEL={ defects:'DEFECTS', patterns:'PATTERNS', other:'OTHER' };
  // ---- Build each TOP-LEVEL group's INNER HTML (head + body, minus the id/seq-dependent wiring),
  // along with its total ticket count, into a list of entries. We then sort the entries by total
  // DESCENDING and assign the sequential group ids / toggle wiring in FINAL display order, so the
  // accordion keeps working (unique seq per group, only one open). Section ids / canvas ids / body
  // ids keep using the ORIGINAL HX_SECS index — only the GROUP blocks are reordered, not sections.
  var entries=[];   // { kind:'hashtag'|'oos', order:number, total:number, build:function(seq,collapsed)->html }
  // --- Hashtag groups (defects / patterns / other), in their fixed listed order. ---
  var hashOrder={ defects:0, patterns:1, other:2 };
  var seenGroup={};
  HX_SECS.forEach(function(a){
    if(seenGroup[a.group]) return;
    seenGroup[a.group]=1;
    var gKey=a.group;
    var inGroup=[];   // [{a,idx}] preserving HX_SECS order
    HX_SECS.forEach(function(x,ix){ if(x.group===gKey) inGroup.push({a:x,idx:ix}); });
    var gTotal=inGroup.reduce(function(s,x){ return s+(Number(x.a.count)||0); },0);
    entries.push({
      kind:'hashtag',
      order:(hashOrder[gKey]!=null?hashOrder[gKey]:3),
      total:gTotal,
      build:function(seq,collapsed){
        var groupIcon={ defects:'alert-triangle', patterns:'bar-chart', other:'hash' }[gKey]||'hash';
        var h='<div class="hx-group'+(collapsed?' collapsed':'')+' hx-group-'+esc(gKey)+'" id="hxGroup'+seq+'">'
          +'<div class="hx-group-head" onclick="hxGroupToggle('+seq+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();hxGroupToggle('+seq+');}" role="button" tabindex="0">'
            +'<span class="hx-group-label">'+ic(groupIcon,16)+'<span>'+esc(GROUP_LABEL[gKey]||gKey.toUpperCase())+'</span></span>'
            +'<span class="hx-group-head-right"><span class="hx-group-meta">'+inGroup.length+' hashtags \u00b7 '+gTotal+' tagged</span>'
            +'<span class="hx-group-caret">\u25be</span></span>'
          +'</div>'
          +'<div class="hx-group-body">';
        inGroup.forEach(function(entry){
          var a=entry.a, idx=entry.idx;
          var def=hxDefOf(a.tag);
          var defHtml=def
            ? '<div class="hx-def" title="'+esc(def)+'">'+esc(def)+'</div>'
            : '<div class="hx-def none">No definition on file for this hashtag.</div>';
          h+='<div class="hx-sec" id="hxSec'+idx+'">'
            +'<div class="hx-sec-head" onclick="hxToggle('+idx+')">'
              +'<div class="hx-sec-title">'
                +'<div class="hx-sec-title-wrap"><span class="hx-tag">'+esc(a.tag)+'</span>'+defHtml+'</div>'
              +'</div>'
              +'<div class="hx-sec-head-right"><span class="hx-count'+(a.count>0?'':' zero')+'">'+a.count+'</span><span class="hx-caret">\u25be</span></div>'
            +'</div>'
            +'<div class="hx-sec-body">'
              +(a.count>0
                ? '<div class="hx-chart-title">'+esc(a.tag)+' \u2014 tickets created per week</div>'
                  +'<div class="hx-chart-sub">Tickets tagged <b style="color:#a78bfa">'+esc(a.tag)+'</b> bucketed by the week of their created date.</div>'
                  +'<div class="chart-box"><div class="chart-wrap tall"><canvas id="hxCanvas'+idx+'"></canvas></div></div>'
                  +'<div id="hxBody'+idx+'">'+hxSecTableHtml(idx)+'</div>'
                : '<div class="hx-none-yet">'+ic('hash',16)+'<div><b>No tickets tagged <span class="hx-tag">'+esc(a.tag)+'</span> yet.</b><br>This hashtag is tracked \u2014 tickets will appear here automatically once an uploaded file labels them with it.</div></div>')
            +'</div>'
          +'</div>';
        });
        h+='</div></div>';   // close group body + wrapper
        return h;
      }
    });
  });
  // --- The "#Out of Scope" group (if present), total = sum of its subsection counts. ---
  if(HX_OOS&&Array.isArray(HX_OOS.groups)){
    var oosTotal=HX_OOS.groups.reduce(function(s,g){ return s+(Number(g.count)||0); },0);
    entries.push({ kind:'oos', order:3, total:oosTotal, build:function(seq,collapsed){ return hxOosGroupHtml(seq,collapsed); } });
  }
  // Sort by total DESCENDING; stable tie-break on the fixed order (defects<patterns<other<oos).
  entries.sort(function(x,y){ return (y.total-x.total) || (x.order-y.order); });
  // Emit in final order, assigning sequential seq ids 0,1,2,…; first group starts expanded.
  entries.forEach(function(e,i){ html+=e.build(i, i>0); });
  document.getElementById('wrap').innerHTML=html;
  // Hashtag cards start collapsed (chart drawn on open via hxToggle); the FIRST group (by ticket
  // count) starts open, the rest closed.
}

// ---- "#Out of Scope" group (two subsections: AUTO-SIM, RULE) --------------------------------------
// Rendered from HX_OOS (/api/out-of-scope-report). Collapsed by default (part of the accordion).
function hxOosGroupHtml(seq,collapsed){
  if(!HX_OOS||!Array.isArray(HX_OOS.groups)) return '';
  if(collapsed===undefined) collapsed=true;
  var groups=HX_OOS.groups;
  var total=groups.reduce(function(s,g){ return s+(Number(g.count)||0); },0);
  var subs=groups.map(hxOosSubHtml).join('');
  return '<div class="hx-group'+(collapsed?' collapsed':'')+' hx-group-oos" id="hxGroup'+seq+'">'
    +'<div class="hx-group-head" onclick="hxGroupToggle('+seq+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();hxGroupToggle('+seq+');}" role="button" tabindex="0">'
      +'<span class="hx-group-label">'+ic('no-entry',16)+'<span>#OUT OF SCOPE</span></span>'
      +'<span class="hx-group-head-right"><span class="hx-group-meta">'+groups.length+' categories \u00b7 '+total+' tickets</span>'
      +'<span class="hx-group-caret">\u25be</span></span>'
    +'</div>'
    +'<div class="hx-group-body">'+subs+'</div>'
  +'</div>';
}
// One out-of-scope subsection card (AUTO-SIM or RULE): orange-topped card with a head (label + count)
// and a ticket table. Starts collapsed; expands on head click (hxOosToggle).
function hxOosSubHtml(g){
  var tix=g.tickets||[];
  var body = tix.length
    ? '<div class="hx-chart-title">'+esc(g.label)+' \u2014 tickets resolved per week</div>'
      +'<div class="hx-chart-sub">Tickets in this category bucketed by the week of their created date.</div>'
      +'<div class="chart-box"><div class="chart-wrap tall"><canvas id="hxOosCanvas-'+esc(g.key)+'"></canvas></div></div>'
      +'<div id="hxOosBody-'+esc(g.key)+'">'+hxOosTableHtml(g)+'</div>'
    : '<div class="hx-none-yet">'+ic('no-entry',16)+'<div><b>No tickets in this category yet.</b><br>Pet incidents matching this rule will appear here automatically after the next upload.</div></div>';
  return '<div class="hx-sec hx-oos-sec" id="hxOosSec-'+esc(g.key)+'">'
    +'<div class="hx-sec-head" onclick="hxOosToggle(\''+esc(g.key)+'\')">'
      +'<div class="hx-sec-title"><div class="hx-sec-title-wrap"><span class="hx-tag">'+esc(g.label)+'</span></div></div>'
      +'<div class="hx-sec-head-right"><span class="hx-count'+(g.count>0?'':' zero')+'">'+g.count+'</span><span class="hx-caret">\u25be</span></div>'
    +'</div>'
    +'<div class="hx-sec-body">'+body+'</div>'
  +'</div>';
}
// Table for an OOS subsection (Ticket | Created | Resolved by | Closure | Title). Paginated 20 +10.
function hxOosTableHtml(g){
  var tix=(g.tickets||[]).slice().sort(function(x,y){ return new Date(y.created)-new Date(x.created); });
  var shown=Math.min(HX_OOS_SHOWN[g.key]||HX_PAGE0, tix.length);
  var rows='';
  for(var i=0;i<shown;i++){
    var t=tix[i];
    var link=t.url?('<a class="hx-idlink" href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.shortId||'\u2014')+'</a>'):esc(t.shortId||'\u2014');
    rows+='<tr>'
      +'<td class="hx-fit hx-center">'+link+'</td>'
      +'<td class="hx-fit hx-center hx-num">'+fmtDate(t.created)+'</td>'
      +'<td class="hx-fit hx-assignee">'+esc(hxAssignee(t.resolvedBy))+'</td>'
      +'<td class="hx-fit hx-center hx-num">'+esc(t.closureCode||'\u2014')+'</td>'
      +'<td class="hx-title"><span class="hx-title-txt" title="'+esc(t.title||'')+'">'+esc(t.title||'\u2014')+'</span></td>'
      +'</tr>';
  }
  if(!tix.length) rows='<tr><td colspan="5" class="hx-empty">No tickets.</td></tr>';
  var more='';
  if(tix.length>shown){
    more='<div class="hx-more"><button onclick="hxOosMore(\''+esc(g.key)+'\')">Show more</button>'
      +'<span class="hx-mcount">Showing '+shown+' of '+tix.length+'</span></div>';
  } else if(tix.length>HX_PAGE0){
    more='<div class="hx-more"><span class="hx-mcount">Showing all '+tix.length+'</span></div>';
  }
  return '<div class="hx-tbl-wrap"><table class="hx-tbl"><thead><tr>'
    +'<th class="hx-center">Ticket</th><th class="hx-center">Created</th><th>Resolved by</th>'
    +'<th class="hx-center">Closure</th><th>Title</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+more;
}
// Draw (or redraw) an OOS subsection's per-week wave chart. Reuses hxWeeklyBuckets + hxWave; uses a
// distinct red line to match the OOS group. Destroys any prior instance on the canvas first.
function hxOosDrawChart(key){
  if(typeof Chart==='undefined')return;
  var g=(HX_OOS&&HX_OOS.groups||[]).filter(function(x){ return x.key===key; })[0];
  if(!g||!(g.tickets&&g.tickets.length)) return;
  var cv=document.getElementById('hxOosCanvas-'+key); if(!cv)return;
  var b=hxWeeklyBuckets(g.tickets);
  if(HX_OOS_CHARTS[key]){ try{HX_OOS_CHARTS[key].destroy();}catch(e){} delete HX_OOS_CHARTS[key]; }
  Chart.defaults.color='#5c6773'; Chart.defaults.borderColor='rgba(0,0,0,0.06)';
  HX_OOS_CHARTS[key]=new Chart(cv,{type:'line',
    data:{labels:b.labels,datasets:[hxWave(g.label+' tickets',b.data,'#e5484d','rgba(229,72,77,')]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:true,position:'top',labels:{usePointStyle:true,boxWidth:8,font:{size:12}}}},
      scales:{y:{beginAtZero:true,grid:{color:'rgba(0,0,0,.05)'},title:{display:true,text:'Tickets created',color:'#2a3340',font:{size:12}},ticks:{font:{size:11},precision:0}},
        x:{grid:{display:false},ticks:{font:{size:11}}}}}});
}
function hxOosToggle(key){
  var sec=document.getElementById('hxOosSec-'+key); if(!sec) return;
  var willOpen=!sec.classList.contains('open');
  sec.classList.toggle('open');
  if(willOpen){ setTimeout(function(){ hxOosDrawChart(key); },60); }
}
window.hxOosToggle=hxOosToggle;
function hxOosMore(key){
  HX_OOS_SHOWN[key]=(HX_OOS_SHOWN[key]||HX_PAGE0)+HX_STEP;
  var body=document.getElementById('hxOosBody-'+key); if(!body) return;
  var g=(HX_OOS&&HX_OOS.groups||[]).filter(function(x){ return x.key===key; })[0];
  if(g) body.innerHTML=hxOosTableHtml(g);
}
window.hxOosMore=hxOosMore;
// Expand/collapse a whole GROUP block (DEFECTS / PATTERNS / OTHER). ACCORDION — only one group open
// at a time: opening one collapses the others; clicking an open group closes it (all can be closed).
function hxGroupToggle(gi){
  var g=document.getElementById('hxGroup'+gi); if(!g) return;
  var willOpen=g.classList.contains('collapsed');
  // Collapse every group first…
  Array.prototype.forEach.call(document.querySelectorAll('.hx-group'),function(x){ x.classList.add('collapsed'); });
  // …then open the clicked one if it was closed (if it was open, it stays collapsed = toggled shut).
  if(willOpen) g.classList.remove('collapsed');
}

// Load order:
//   1) Live API (/api/hashtags-report) — aggregates ticket_docs by #tag from the Labels column, so
//      any uploaded file's hashtags show up automatically. This is the source of truth.
//   2) Fallback to the static hashtags-data.json (e.g. API asleep on Render, or offline) so the
//      page still renders something on GitHub Pages before the API wakes.
(async function(){
  var live=null;
  // Fetch the hashtags report, then the out-of-scope report (the latter is best-effort: if it fails
  // the page still renders the hashtag groups without the "#Out of Scope" group).
  try{
    // Staggered, not parallel: on a cold Render instance both requests would otherwise land in the
    // same instant and queue up behind one 30-90s boot, risking a gateway timeout (502) on whichever
    // one is served second. Firing out-of-scope-report ~1.5s after hashtags-report means it starts
    // its own timeout clock once the instance is already awake, instead of racing the cold boot too.
    var r=await A.api('GET','/api/hashtags-report');
    var oos=await new Promise(function(resolve){
      setTimeout(function(){
        A.api('GET','/api/out-of-scope-report').then(resolve).catch(function(){ resolve(null); });
      },1500);
    });
    if(r&&r.ok&&r.data&&Array.isArray(r.data.sections)) live=r.data;
    if(oos&&oos.ok&&oos.data&&Array.isArray(oos.data.groups)) HX_OOS=oos.data;
  }catch(e){ live=null; }
  if(live){ render(live); return; }
  // Fallback: static snapshot bundled with the site.
  try{
    var fr=await fetch('hashtags-data.json',{cache:'no-store'});
    if(fr.ok){ render(await fr.json()); return; }
  }catch(e){}
  gate('Could not load the hashtag data. Please try again.');
})();
</script>
