<title>Common Blurbs · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
:root{--o:#ec7211;--oh:#c85f0e;--t:#2a3340;--tm:#5c6773;--bd:#e2e7eb;--gl:#1f9d57;--rl:#dc2626;--tl:#2591ad;--card:#fff;--cardh:#faf7f2;--inp:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#f3f5f7;color:var(--t);min-height:100vh}
/* Keep the static fallback bar's box (no layout jump) but invisible, so the shared toolbar (with the
   hamburger, injected by topbar-auth.js) is the only bar the user sees — no hamburger-less flash. */
.top-bar{background:#fff;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#1b2026;line-height:1}
.nav-right{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#fff;border-radius:5px;font-weight:700;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.btn.sec{background:#fff;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.btn.mini{padding:5px 12px;font-size:.78em}
.tools-subnav{background:#fff;border-bottom:1px solid var(--bd);padding:0 24px;display:flex;gap:4px;flex-wrap:wrap}
.tools-subnav a{padding:12px 16px;color:var(--tm);text-decoration:none;font-size:.88em;font-weight:600;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tools-subnav a:hover{color:#1b2026}
.tools-subnav a.active{color:var(--o);border-bottom-color:var(--o)}
.btn.danger{background:#fff;border:1px solid rgba(220,38,38,.4);color:var(--rl)}
.btn.danger:hover{background:#fef2f2}
.wrap{width:90%;max-width:1400px;margin:0 auto;padding:40px 24px}
h1{color:#1b2026;font-size:1.7em;margin-bottom:6px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:26px}
/* Header row: title left, actions right */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.page-head h1{margin:0}
.page-head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Stacked list of expandable, click-to-copy blurb cards */
.blurb-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px;row-gap:14px;align-items:start}
@media(max-width:760px){.blurb-list{grid-template-columns:1fr}}
/* ============================================================================================
   Redesigned blurb card — a clean row: copy-count chip + title (whole header is the expand toggle)
   on the left, a single solid Copy button on the right; the body slides open below on expand.
   Palette: orange #ff6100 / #fe9046, ink #151d28, blue accent #2b66c1, soft surfaces.
   ============================================================================================ */
.blurb-card{position:relative;background:#fff;border:1px solid #e9e6df;border-radius:5px;overflow:hidden;
  box-shadow:0 1px 2px rgba(21,29,40,.05),0 8px 22px -16px rgba(21,29,40,.25);
  transition:border-color .16s,box-shadow .16s,transform .16s}
/* Left accent spine — grey at rest, orange when hovered/open. */
.blurb-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#e2ddd2;transition:background .16s}
.blurb-card:hover{border-color:#f3c7a4;box-shadow:0 2px 4px rgba(21,29,40,.06),0 14px 30px -16px rgba(255,97,0,.4);transform:translateY(-1px)}
.blurb-card:hover::before{background:#fe9046}
.blurb-card.show{border-color:#ff6100}
.blurb-card.show::before{background:#ff6100}

/* The header IS the expand toggle (a full-width button). */
.bc-head{display:flex;align-items:center;gap:12px;min-width:0;width:100%;padding:14px 16px 14px 18px;
  background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left}
.bc-head:hover{background:#fdf7f1}
/* Copy-count chip: circular badge with the icon + number. */
.bc-count{display:inline-flex;align-items:center;gap:5px;background:#fff2ea;color:#ff6100;border:1px solid #ffd9c2;
  border-radius:999px;padding:4px 10px 4px 8px;font-size:.74em;font-weight:900;flex-shrink:0;line-height:1}
.bc-count svg{width:13px;height:13px}
.bc-count-n{letter-spacing:.2px}
.bc-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:#151d28;font-weight:700;font-size:1.0em;line-height:1.35}
/* Expand chevron — rotates 180° when the card is open. */
.bc-expand{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:6px;background:#eef3fb;color:#2b66c1;transition:transform .22s ease,background .16s}
.bc-head:hover .bc-expand{background:#c4def6}
.blurb-card.show .bc-expand{transform:rotate(180deg);background:#2b66c1;color:#fff}

/* Copy button — sits in the header row, pinned right via absolute so it isn't part of the toggle. */
.bc-actions{position:absolute;top:10px;right:14px;display:flex;align-items:center;gap:8px;z-index:2}
.bc-copy{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:5px;font-family:inherit;
  font-size:.82em;font-weight:800;cursor:pointer;border:none;background:#ff6100;color:#fff;flex-shrink:0;
  box-shadow:0 2px 8px -2px rgba(255,97,0,.55);transition:background .14s,box-shadow .14s,transform .12s}
.bc-copy:hover{background:#e85800;transform:translateY(-1px)}
.bc-copy:active{transform:translateY(0)}
.bc-copy svg{display:block}
.bc-copy .bc-copy-done{display:none}
.bc-copy.copied{background:var(--gl);box-shadow:0 2px 8px -2px rgba(31,157,87,.55)}
.bc-copy.copied .bc-copy-ic{display:none}
.bc-copy.copied .bc-copy-done{display:inline-flex}
/* Reserve room on the header so the title never slides under the absolute Copy button. */
.bc-head{padding-right:112px}

/* Body — slides open below the header. */
.bc-content{max-height:0;overflow:hidden;opacity:0;transition:max-height .28s ease,opacity .2s ease,padding .28s ease;
  padding:0 16px 0 18px}
.blurb-card.show .bc-content{max-height:640px;opacity:1;padding:0 16px 16px 18px}
.bc-content .bc-text{white-space:pre-wrap;color:#2a3340;font-size:.9em;line-height:1.65;
  background:#f7f8fa;border:1px solid #eceef1;border-radius:5px;padding:14px 16px}
.bc-content .bc-hash{color:var(--tl);font-size:.85em;margin-top:8px}
.bc-admin{display:flex;gap:8px;margin-top:12px}
.bc-admin .btn.mini{flex:0 0 auto}
.blurb-text{white-space:pre-wrap;color:#2a3340;font-size:.9em;line-height:1.6;background:#f7f9fb;border:1px solid var(--bd);border-radius:5px;padding:14px 16px;max-height:56vh;overflow:auto}
.meta{color:#8b96a0;font-size:.75em;margin-top:8px}
.copied{color:var(--gl)!important;border-color:rgba(31,157,87,.5)!important}
/* editor */
.edit-area{margin-top:10px}
.edit-area input,.edit-area textarea{width:100%;background:var(--inp);border:1px solid var(--bd);border-radius:5px;color:#1b2026;font-size:.9em;padding:10px 12px;font-family:inherit}
.edit-area input:focus,.edit-area textarea:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(236,114,17,.14)}
.edit-area textarea{min-height:200px;line-height:1.6;resize:vertical}
.edit-area label{display:block;color:var(--tm);font-size:.8em;font-weight:700;margin:10px 0 6px}
.msg{font-size:.85em;margin-top:10px;display:none}.msg.err{color:var(--rl)}.msg.ok{color:var(--gl)}
/* Add-blurb modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,45,.55);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border:1px solid var(--bd);border-radius:5px;width:50vw;max-width:50vw;min-width:min(92vw,420px);max-height:88vh;overflow:auto;padding:24px;box-shadow:0 24px 60px -20px rgba(20,40,70,.5)}
.modal.modal-wide{width:50vw;max-width:50vw}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.modal-head h2{color:#1b2026;font-size:1.05em;font-weight:800}
.modal-close{background:transparent;border:none;color:var(--tm);font-size:1.6em;line-height:1;cursor:pointer;padding:0 4px}
.modal-close:hover{color:#1b2026}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1b2026;border:1px solid #1b2026;color:#fff;padding:10px 18px;border-radius:5px;font-size:.85em;z-index:2000;opacity:0;transition:opacity .2s;box-shadow:0 10px 30px -10px rgba(20,40,70,.5)}
.toast.show{opacity:1}

/* Global: main content spans the full width, flush with the title bar (no side margins). */
.wrap,.content{width:auto!important;max-width:none!important;margin-left:0!important;margin-right:0!important}

/* ---- Illustrated gradient banner header (matches the live dashboard section banners) ---- */
.tool-banner{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-radius:5px;padding:16px 22px;min-height:78px;margin-bottom:8px;
  border:1px solid #242a31;box-shadow:0 12px 30px -20px rgba(0,0,0,.75);
  background-size:200% 100%;animation:toolBanner 9s ease infinite}
@keyframes toolBanner{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.tool-banner .tb-left{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.tool-banner .tb-title{margin:0;display:inline-flex;align-items:center;gap:11px;font-size:1.5em;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.tool-banner .tb-title svg{flex-shrink:0}
.tool-banner .tb-sub{font-size:.86em;font-weight:500;line-height:1.4;max-width:60ch}
.tool-banner .page-head-actions{position:relative;z-index:1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Big faded line-art watermark on the right of the banner. */
.tool-banner::after{content:"";position:absolute;top:0;bottom:0;right:0;width:260px;
  background-repeat:no-repeat;background-position:right center;background-size:auto 118%;opacity:.32;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%)}
/* Buttons on the bright banner: solid dark-ink action + frosted secondary so both stay legible. */
.tool-banner .btn{background:rgba(10,12,15,.82);color:#fff;border:1px solid rgba(255,255,255,.14)}
.tool-banner .btn:hover{background:rgba(10,12,15,.92);border-color:rgba(255,255,255,.28)}
.tool-banner .btn.sec{background:rgba(255,255,255,.14);color:#0e1013;border:1px solid rgba(255,255,255,.35);font-weight:700}
.tool-banner .btn.sec:hover{background:rgba(255,255,255,.24);color:#0e1013}
/* Common Blurbs — amber gradient, dark-ink title, clipboard/quote illustration. */
.tool-banner.tb-blurbs{background:linear-gradient(90deg,#f07d0a,#ff9f2e 55%,#ffcf7a)}
.tool-banner.tb-blurbs .tb-title,.tool-banner.tb-blurbs .tb-title svg{color:#3a2405}
.tool-banner.tb-blurbs .tb-sub{color:rgba(58,36,5,.78)}
.tool-banner.tb-blurbs::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="16" width="52" height="52" rx="6"/><rect x="46" y="10" width="20" height="10" rx="3"/><path d="M40 34h32M40 44h32M40 54h20"/><path d="M92 24l14 0v14"/><path d="M96 46l10-10"/></svg>')}
@media(max-width:640px){.tool-banner .tb-title{font-size:1.25em}.tool-banner::after{opacity:.22}}
/* Embedded in tools.html: the parent's shared title bar provides the title + Add/Edit-log actions,
   so hide this page's own gradient banner to avoid a duplicate header. Also zero the content wrap's
   side gutters (and the stray 15px auto-margins) so the cards fill the iframe edge-to-edge: the 16px
   side gutter now lives on the parent's .tool-pad column, which wraps BOTH the title bar and this
   iframe, so the cards line up EXACTLY with the title bar at the same width. */
body[data-embedded="true"] .tool-banner{display:none!important}
/* Embedded: the iframe body renders ~10px narrower than the iframe viewport (a scrollbar-gutter
   reservation from theme.css's 10px scrollbar), which left the card band 10px short of the title bar
   on the right. Pull the content wrap 10px to the right so its right edge meets the title bar. */
body[data-embedded="true"] .wrap{width:100%!important;max-width:100%!important;padding-left:0!important;padding-right:0!important;margin-left:0!important;margin-right:0!important}
/* Root cause of the title-bar vs content width gap: theme.css gives the iframe a classic 10px
   vertical scrollbar; whenever the embedded doc momentarily overflows its JS-sized frame, that
   gutter reserves ~10px and shrinks the inner layout viewport, so width:100% content falls short of
   the parent title bar. The parent (tools.html) auto-sizes the frame to content and shows ONE page
   scrollbar, so the iframe never needs its own vertical bar — zero it out to remove the reservation. */
body[data-embedded="true"]{scrollbar-width:none!important;scrollbar-gutter:auto!important}
body[data-embedded="true"]::-webkit-scrollbar{width:0!important;height:0!important}
html[data-embedded] body[data-embedded="true"]{overflow-y:hidden!important}

</style>

<script>
const A=window.PHDAuth;
let BLURBS=[];
// Most-copied first (stable: ties keep the server's manual order). Applied whenever the list is
// loaded (cache paint + fresh fetch). Copying a blurb updates its count in place WITHOUT re-sorting,
// so cards don't jump under the cursor; the new order applies on the next load.
function sortBlurbs(arr){
  return arr.map(function(b,i){return {b:b,i:i};})
    .sort(function(x,y){ return ((y.b.copyCount||0)-(x.b.copyCount||0)) || (x.i-y.i); })
    .map(function(x){return x.b;});
}
const canEdit=()=>A.canEditTools&&A.canEditTools();
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// Browser cache (stale-while-revalidate) — this data changes rarely, so paint instantly from the
// last-known copy and refresh in the background.
const CACHE_KEY='phd_blurbs_cache';
function readCache(){try{const raw=localStorage.getItem(CACHE_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}}
function writeCache(arr){try{localStorage.setItem(CACHE_KEY,JSON.stringify(arr));}catch(e){}}

async function load(){
  if(canEdit()){var _ll=document.getElementById('logLink');if(_ll)_ll.style.display='';}
  // Instant paint from cache if present.
  let paintedFromCache=false;
  const cached=readCache();
  if(Array.isArray(cached)&&cached.length){BLURBS=sortBlurbs(cached);render();paintedFromCache=true;}
  // Background refresh.
  const r=await A.api('GET','/api/blurbs');
  if(!r.ok){ if(!paintedFromCache)document.getElementById('wrap').innerHTML='<h1>Common Blurbs</h1><p class="sub" style="color:#ff5252">Could not load blurbs (HTTP '+r.status+').</p>'; return; }
  const fresh=sortBlurbs(Array.isArray(r.data)?r.data:[]);
  writeCache(fresh);
  const changed=JSON.stringify(fresh)!==JSON.stringify(BLURBS);
  BLURBS=fresh;
  if(!paintedFromCache||changed)render();
}

function render(){
  const editor=canEdit();
  const copyIcon='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const chevIcon='<svg class="bc-chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  const checkIcon='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  // Header: title left, actions (Add + edit log) right.
  // Illustrated gradient banner header (title + sub on the left, actions on the right).
  let html='<div class="tool-banner tb-blurbs">'
    +'<div class="tb-left">'
      +'<h1 class="tb-title">'+(window.icon?window.icon('clipboard',24):'')+' Common Blurbs</h1>'
      +'<div class="tb-sub">Copy a blurb with one click.'+(editor?' As an admin you can edit any blurb or add a new one.':'')+'</div>'
    +'</div>'
    +'<div class="page-head-actions">'
      +(editor?'<button class="btn" onclick="openAddModal()">➕ Add New Blurb</button>':'')
      +'<a class="btn sec" href="blurb-log.html">'+(window.icon?window.icon('history',15):'')+' Blurb edit log</a>'
    +'</div>'
  +'</div>';
  // Expandable, click-to-copy cards — ALL blurbs, no pagination. BLURBS is already sorted most-copied
  // first (sortBlurbs on load); the grid fills row by row, so 2 columns read #1 #2 / #3 #4 … and the
  // single-column (narrow screen) layout is a straight highest-to-lowest list.
  html+=`<div class="blurb-list">`+BLURBS.map((b,i)=>`
    <div class="blurb-card" id="card-${i}">
      <button type="button" class="bc-head" id="viewCard-${i}" onclick="toggleView(${i},event)" title="Show / hide the blurb text" aria-expanded="false">
        <span class="bc-count" id="count-${i}" title="Times copied">${copyIcon}<span class="bc-count-n">${b.copyCount||0}</span></span>
        <span class="bc-name" title="${esc(b.title)}">${esc(b.title)}</span>
        <span class="bc-expand" aria-hidden="true">${chevIcon}</span>
      </button>
      <div class="bc-actions">
        <button class="bc-copy" id="copyCard-${i}" onclick="copyBlurb(${i},event)" title="Copy this blurb"><span class="bc-copy-ic">${copyIcon}</span><span class="bc-copy-done" aria-hidden="true">${checkIcon}</span><span class="bc-copy-lbl">Copy</span></button>
      </div>
      <div class="bc-content">
        <div class="bc-text">${esc(b.text)}</div>
        ${editor?`<div class="bc-admin"><button class="btn sec mini" onclick="event.stopPropagation();openViewModal(${i})">Edit</button></div>`:''}
      </div>
    </div>`).join('')+`</div>`;
  document.getElementById('wrap').innerHTML=html;
}

// Expand/collapse a card's content via the View button. Accordion: only one open at a time.
function toggleView(i,ev){
  if(ev)ev.stopPropagation();
  const card=document.getElementById('card-'+i);
  if(!card)return;
  const willOpen=!card.classList.contains('show');
  // Close every other open card first (accordion: one open at a time).
  document.querySelectorAll('.blurb-card.show').forEach(c=>{
    if(c!==card){c.classList.remove('show');const h=c.querySelector('.bc-head');if(h)h.setAttribute('aria-expanded','false');}
  });
  card.classList.toggle('show',willOpen);
  const head=card.querySelector('.bc-head');if(head)head.setAttribute('aria-expanded',willOpen?'true':'false');
}

// Copy a blurb (the Copy button). Stops the click from bubbling.
function copyBlurb(i,ev){
  if(ev)ev.stopPropagation();
  const text=BLURBS[i].text;
  const done=()=>{const btn=document.getElementById('copyCard-'+i);if(btn){const s=btn.querySelector('.bc-copy-lbl');const old=s?s.textContent:'Copy';btn.classList.add('copied');if(s)s.textContent='Copied';setTimeout(()=>{btn.classList.remove('copied');if(s)s.textContent=old;},1600);}toast('Blurb copied to clipboard');recordCopy(i);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));}
  else fallbackCopy(text,done);
}

// Record a copy on the server (logged-in only) and bump the on-screen count badge.
function recordCopy(i){
  const b=BLURBS[i];if(!b||!b.id)return;
  if(!(A.getUser&&A.getUser())||!(A.getToken&&A.getToken()))return; // only logged-in copies count
  A.api('POST','/api/blurbs/'+b.id+'/copy',{}).then(r=>{
    if(r&&r.ok&&r.data&&typeof r.data.copyCount==='number'){
      b.copyCount=r.data.copyCount;
      const el=document.querySelector('#count-'+i+' .bc-count-n');if(el)el.textContent=b.copyCount;
    }
  }).catch(()=>{});
}

let VIEW_INDEX=null;

// Open the view popup for blurb i (read mode). Admins get an Edit button here.
function openViewModal(i){
  VIEW_INDEX=i;
  const b=BLURBS[i];const editor=canEdit();
  document.getElementById('viewTitle').textContent=b.title;
  document.getElementById('viewText').textContent=b.text;
  document.getElementById('viewMeta').textContent=b.updatedBy?('Last updated by '+b.updatedBy):'';
  document.getElementById('viewEditBtn').style.display=editor?'':'none';
  document.getElementById('viewDeleteBtn').style.display=editor?'':'none';
  document.getElementById('viewRead').style.display='';
  document.getElementById('viewEdit').style.display='none';
  document.getElementById('copyBtnModal').textContent='📋 Copy';
  document.getElementById('copyBtnModal').classList.remove('copied');
  document.getElementById('viewModal').style.display='flex';
}
function closeViewModal(){document.getElementById('viewModal').style.display='none';VIEW_INDEX=null;}

function copyCurrent(){
  if(VIEW_INDEX==null)return;
  const text=BLURBS[VIEW_INDEX].text;
  const idx=VIEW_INDEX;
  const done=()=>{const btn=document.getElementById('copyBtnModal');btn.textContent='✓ Copied';btn.classList.add('copied');setTimeout(()=>{btn.textContent='📋 Copy';btn.classList.remove('copied');},1600);toast('Blurb copied to clipboard');recordCopy(idx);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));}
  else fallbackCopy(text,done);
}
function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();done();}

// Switch the view popup into edit mode (admins).
function startEdit(){
  if(VIEW_INDEX==null||!canEdit())return;
  const b=BLURBS[VIEW_INDEX];
  document.getElementById('editTitle').value=b.title;
  document.getElementById('editText').value=b.text;
  document.getElementById('editErr').style.display='none';
  document.getElementById('viewRead').style.display='none';
  document.getElementById('viewEdit').style.display='';
}
function cancelEdit(){document.getElementById('viewRead').style.display='';document.getElementById('viewEdit').style.display='none';}

async function saveEdit(){
  if(VIEW_INDEX==null)return;
  const b=BLURBS[VIEW_INDEX];
  const title=document.getElementById('editTitle').value.trim();
  const text=document.getElementById('editText').value;
  const err=document.getElementById('editErr');
  if(!title||!text.trim()){err.textContent='Title and blurb text are required.';err.style.display='block';return;}
  const r=await A.api('PUT','/api/blurbs/'+b.id,{title,text});
  if(r.ok){toast('Blurb updated');closeViewModal();await load();}
  else{err.textContent=(r.data&&r.data.error)||('Failed (HTTP '+r.status+')');err.style.display='block';}
}

// Delete with confirmation popup (admins).
function confirmDelete(){
  if(VIEW_INDEX==null||!canEdit())return;
  const b=BLURBS[VIEW_INDEX];
  document.getElementById('confirmText').innerHTML='Delete the blurb <b>"'+esc(b.title)+'"</b>? This cannot be undone.';
  document.getElementById('confirmModal').style.display='flex';
}
function closeConfirm(){document.getElementById('confirmModal').style.display='none';}
async function doDelete(){
  if(VIEW_INDEX==null)return;
  const b=BLURBS[VIEW_INDEX];
  const r=await A.api('DELETE','/api/blurbs/'+b.id);
  closeConfirm();
  if(r.ok){toast('Blurb deleted');closeViewModal();await load();}
  else{toast((r.data&&r.data.error)||('Delete failed (HTTP '+r.status+')'));}
}

function openAddModal(){document.getElementById('addModal').style.display='flex';document.getElementById('newTitle').value='';document.getElementById('newText').value='';document.getElementById('addErr').style.display='none';setTimeout(()=>document.getElementById('newTitle').focus(),40);}
function closeAddModal(){document.getElementById('addModal').style.display='none';}

async function addBlurb(){
  const title=document.getElementById('newTitle').value.trim();
  const text=document.getElementById('newText').value;
  const err=document.getElementById('addErr');
  if(!title||!text.trim()){err.textContent='Title and blurb text are required.';err.style.display='block';return;}
  const r=await A.api('POST','/api/blurbs',{title,text});
  if(r.ok){closeAddModal();toast('Blurb added');await load();}
  else{err.textContent=(r.data&&r.data.error)||('Failed (HTTP '+r.status+')');err.style.display='block';}
}

load();
</script>
</body>
</html>
