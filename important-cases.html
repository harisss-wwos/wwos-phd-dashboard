<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unique Cases · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: keep the page hidden until topbar-auth.js has injected its styles AND built the
     nav-rail + profile column, so the chrome is present on the FIRST paint (no flash-in). The class
     is cleared by topbar-auth after the chrome builds; a failsafe timer clears it if the script
     never runs (offline) so the page can never stay hidden. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<!-- Keep the page section hidden until the shared chrome (title bar + menu column) has wrapped it, so the
     loader never shows on a bare page while topbar-auth.js is still downloading. Safety net: shown
     anyway after 8s (html.tb-wrap-timeout) or without JS. -->
<style>#wrap{visibility:hidden}#tbHomeChrome #wrap,html.tb-wrap-timeout #wrap{visibility:visible}</style>
<script>setTimeout(function(){document.documentElement.classList.add('tb-wrap-timeout');},8000);</script>
<noscript><style>#wrap{visibility:visible!important}</style></noscript>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--yl:#fbbf24;--rl:#ff5252;--tl:#44b9d6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#000;border-radius:5px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.spinner{width:44px;height:44px;border:4px solid var(--bd);border-top-color:var(--o);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
.wrap{max-width:1000px;margin:0 auto;padding:40px 24px}
h1{color:#fff;font-size:1.6em;margin-bottom:6px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:26px}
/* Expand/collapse case cards */
.case{background:#0a0a0a;border:1px solid var(--bd);border-left:3px solid var(--o);border-radius:5px;margin-bottom:14px;overflow:hidden}
.case-head{display:flex;align-items:center;gap:14px;padding:16px 20px;width:100%;background:transparent;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .12s}
.case-head:hover{background:#0d0d0d}
.case-id{color:#44b9d6;font-weight:700;font-size:1.02em;flex-shrink:0}
.case-title{color:var(--t);font-size:.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.case-by{color:var(--tm);font-size:.78em;white-space:nowrap;flex-shrink:0}
.case-caret{color:var(--tm);transition:transform .18s;flex-shrink:0}
.case.open .case-caret{transform:rotate(180deg)}
.case-body{padding:0 20px;display:none;flex-direction:column;gap:14px}
.case.open .case-body{display:flex;padding:4px 20px 18px}
.case-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.82em;color:var(--tm)}
.case-meta b{color:#fff;font-weight:600}
/* ---- Loading shimmer: a few collapsed-case placeholders ---- */
.uc-skel .case.sk{pointer-events:none}
.uc-skel .sk-head{display:flex;align-items:center;gap:14px;padding:16px 20px}
.sk-bar{height:13px;border-radius:5px;background:#141a20;position:relative;overflow:hidden;flex-shrink:0}
.sk-bar.id{width:120px}
.sk-bar.title{flex:1;min-width:0;height:12px}
.sk-bar.by{width:70px;height:11px}
.sk-bar.caret{width:14px;height:14px;border-radius:50%}
.sk-bar::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);animation:ucShim 1.3s ease-in-out infinite}
@keyframes ucShim{100%{transform:translateX(100%)}}
.blk-t{color:var(--tm);font-size:.72em;text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:6px}
.case-info{white-space:pre-wrap;color:var(--t);font-size:.9em;line-height:1.6;background:#000;border:1px solid var(--bd);border-radius:5px;padding:12px 14px}
.links{display:flex;flex-direction:column;gap:6px}
.link-item{background:#000;border:1px solid var(--bd);border-radius:5px;padding:8px 12px}
.link-item a{color:#44b9d6;text-decoration:none;font-size:.85em;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.link-item a:hover{text-decoration:underline}
.none{color:#5f6b6c;font-size:.85em;font-style:italic}
.gate{text-align:center;padding:50px 0}.gate p{color:var(--tm);margin-bottom:18px}
.empty{text-align:center;color:var(--tm);padding:40px;border:1px dashed var(--bd);border-radius:5px}
.case-actions{margin-top:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:10px;flex-wrap:wrap}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.btn.danger{background:transparent;border:1px solid rgba(255,82,82,.5);color:var(--rl)}
.btn.danger:hover{background:rgba(255,82,82,.12)}
/* Edit popup */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:#0a0a0a;border:1px solid var(--bd);border-radius:5px;width:80vw;max-width:80vw;max-height:88vh;overflow:auto;padding:24px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h2{color:var(--o);font-size:1.1em;font-weight:700}
.modal-close{background:transparent;border:none;color:var(--tm);font-size:1.6em;line-height:1;cursor:pointer;padding:0 4px}
.modal-close:hover{color:#fff}
.edit-ticket{background:#000;border:1px solid var(--bd);border-radius:5px;padding:14px 16px;margin-bottom:16px}
.edit-ticket .mt-id{color:#44b9d6;font-weight:700;font-size:1.05em;margin-bottom:8px;display:block}
.edit-ticket .meta-line{color:var(--tm);font-size:.82em}.edit-ticket .meta-line b{color:#fff}
.fld-label{display:block;color:var(--tm);font-size:.82em;margin:12px 0 6px;font-weight:600}
#editInfo{width:100%;min-height:110px;background:#000;border:1px solid var(--bd);border-radius:5px;color:#fff;font-size:.9em;padding:10px 12px;font-family:inherit;line-height:1.5;resize:vertical}
#editInfo:focus{outline:none;border-color:var(--o)}
.link-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.link-row input{flex:1;min-width:0;background:#000;border:1px solid var(--bd);border-radius:5px;color:#fff;font-size:.88em;padding:9px 12px;font-family:inherit;text-overflow:ellipsis}
.link-row input:focus{outline:none;border-color:var(--o)}
.link-row .rm{background:transparent;border:1px solid rgba(255,82,82,.4);color:var(--rl);border-radius:5px;cursor:pointer;padding:8px 11px;font-size:.9em;line-height:1;flex-shrink:0}
.link-row .rm:hover{background:rgba(255,82,82,.12)}
.add-link{margin-top:2px;padding:7px 14px;font-size:.82em}
.msg-err{color:var(--rl);font-size:.85em;margin-top:10px;display:none}
.edit-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0a0a0a;border:1px solid var(--gl);color:var(--gl);padding:10px 18px;border-radius:5px;font-size:.85em;z-index:2200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---- Illustrated gradient banner header (matches the live dashboard section banners) ---- */
.uc-banner{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:flex-start;gap:14px;flex-wrap:wrap;
  border-radius:5px;padding:0 22px;height:60px;min-height:60px;margin-bottom:20px;
  border:1px solid #242a31;box-shadow:0 12px 30px -20px rgba(0,0,0,.75);
  background:#fff}
.uc-banner .ub-left{position:relative;z-index:1;display:flex;align-items:center;min-width:0}
.uc-banner .ub-title{margin:0;display:inline-flex;align-items:center;gap:11px;font-size:1.5em;font-weight:800;letter-spacing:-.3px;line-height:1.1;color:#241354}
.uc-banner .ub-title svg{flex-shrink:0;color:#241354}
.uc-banner .ub-sub{font-size:.86em;font-weight:500;line-height:1.5;max-width:78ch;color:rgba(36,19,84,.82)}
.uc-banner .ub-sub b{color:#180b40;font-weight:800}
.uc-banner .ub-actions{position:relative;z-index:1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.uc-banner::after{content:none;display:none;position:absolute;top:0;bottom:0;right:0;width:220px;
  background-repeat:no-repeat;background-position:right center;background-size:auto 116%;opacity:.3;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M60 16l9 18 20 3-14 14 3 20-18-9-18 9 3-20-14-14 20-3z"/><circle cx="98" cy="24" r="3"/><circle cx="30" cy="60" r="3"/></svg>')}
/* Banner buttons stay legible on the bright gradient. */
.uc-banner .btn{background:rgba(10,12,15,.82);color:#fff;border:1px solid rgba(255,255,255,.14)}
.uc-banner .btn:hover{background:rgba(10,12,15,.92);border-color:rgba(255,255,255,.28)}
.uc-banner .btn.sec{background:rgba(255,255,255,.18);color:#241354;border:1px solid rgba(255,255,255,.4);font-weight:700}
.uc-banner .btn.sec:hover{background:rgba(255,255,255,.3);color:#241354}
/* Redesigned primary "Search a ticket" action — a crisp frosted-white pill with purple ink. */
.uc-banner .uc-search-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;
  background:#fff;color:#4c2ea8;border:1px solid rgba(255,255,255,.9);font-weight:800;font-size:.9em;letter-spacing:.1px;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.4);transition:transform .14s,box-shadow .14s,background .14s}
.uc-banner .uc-search-btn svg{color:#7c5cff}
.uc-banner .uc-search-btn:hover{transform:translateY(-1px);background:#f3efff;box-shadow:0 10px 22px -8px rgba(0,0,0,.5)}
@media(max-width:640px){.uc-banner .ub-title{font-size:1.25em}.uc-banner::after{opacity:.2}}

/* ---- Inline ticket search (copied from unique-cases.html) ---- */
.search-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.search-row input{flex:1;min-width:220px;padding:11px 14px;background:#000;border:1px solid var(--bd);border-radius:5px;color:#fff;font-size:.95em}
.search-row input:focus{outline:none;border-color:var(--o)}
.search-row .btn.clear{background:transparent;border:1px solid var(--bd);color:var(--tm)}
.search-row .btn.clear:hover{border-color:var(--rl);color:var(--rl)}
#result:not(:empty){margin-bottom:28px}
.card{background:#0a0a0a;border:1px solid var(--bd);border-radius:5px;padding:24px}
.card.notfound{border-left:3px solid var(--rl)}
.tk-title{color:var(--t);font-size:.92em;margin-bottom:18px;line-height:1.5}
.detail{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.92em}
.detail:last-child{border-bottom:none}
.detail .k{color:var(--tm)}
.detail .v{color:#fff;font-weight:600;text-align:right}
.detail .v.open{color:var(--yl)}
.detail .v.over{color:var(--rl)}
.detail .v.resolved{color:var(--gl)}
.sp-sm{width:20px;height:20px;border:3px solid var(--bd);border-top-color:var(--o);border-radius:50%;animation:spin .9s linear infinite;display:inline-block;vertical-align:middle}
.hint{color:#5f6b6c;font-size:.82em;margin-top:8px}
.marked-badge{color:var(--yl);font-weight:700;font-size:.85em}

/* ===== Redesigned "ticket found" card ===== */
.card.found.fc{padding:0;overflow:hidden;border-left:1px solid var(--bd);position:relative}
.card.found.fc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#38bdf8,#1878eb)}
.card.found.fc.is-marked::before{background:linear-gradient(180deg,#fbbf24,#f59e0b)}
.fc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;
  padding:20px 24px 18px;background:linear-gradient(135deg,rgba(56,189,248,.10),rgba(24,120,235,.04));
  border-bottom:1px solid rgba(255,255,255,.07)}
.card.found.fc.is-marked .fc-head{background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(245,158,11,.03))}
.fc-head-main{min-width:0;flex:1}
.fc-id{display:inline-flex;align-items:center;gap:6px;color:#44b9d6;font-weight:800;font-size:1.5em;
  letter-spacing:.3px;text-decoration:none;line-height:1.1}
.fc-id:hover{text-decoration:underline}
.fc-ext{font-size:.6em;opacity:.65;transform:translateY(-2px)}
.fc-title{color:var(--t);font-size:.95em;line-height:1.5;margin-top:8px;max-width:62ch}
.fc-head-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.fc-q{color:var(--tm);font-size:.72em;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  background:rgba(255,255,255,.07);padding:3px 10px;border-radius:999px}
.fc-status{display:inline-flex;align-items:center;gap:7px;font-size:.78em;font-weight:700;
  padding:5px 12px;border-radius:999px;border:1px solid transparent}
.fc-status i{width:7px;height:7px;border-radius:50%;display:inline-block}
.fc-status.resolved{color:var(--gl);background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.3)}
.fc-status.resolved i{background:var(--gl)}
.fc-status.open{color:var(--yl);background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3)}
.fc-status.open i{background:var(--yl)}
.fc-status.over{color:var(--rl);background:rgba(255,82,82,.12);border-color:rgba(255,82,82,.3)}
.fc-status.over i{background:var(--rl);animation:fcpulse 1.4s ease-in-out infinite}
@keyframes fcpulse{0%,100%{opacity:1}50%{opacity:.35}}
.fc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 24px;
  border-bottom:1px solid rgba(255,255,255,.06)}
.fc-tile{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:#111;border:1px solid var(--bd);
  border-radius:9px;min-width:0}
.fc-tile:last-child:nth-child(odd){grid-column:1 / -1}
.fc-ic{flex-shrink:0;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:rgba(56,189,248,.1);color:#38bdf8}
.fc-ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fc-wrap{display:flex;flex-direction:column;gap:3px;min-width:0}
.fc-k{color:var(--tm);font-size:.72em;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.fc-v{color:#fff;font-weight:600;font-size:.95em;word-break:break-word}
.fc-v.resolved{color:var(--gl)}
.fc-v.open{color:var(--yl)}
.fc-v.over{color:var(--rl)}
.fc-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;letter-spacing:-.2px}
.fc-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 24px;flex-wrap:wrap}
.fc-foot-note{color:var(--tm);font-size:.82em;font-style:italic}
.fc-mark{box-shadow:0 4px 14px -4px rgba(255,153,0,.5)}
@media(max-width:640px){.fc-grid{grid-template-columns:1fr}.fc-tile:last-child:nth-child(odd){grid-column:auto}
  .fc-head-meta{align-items:flex-start}}
/* Mark important modal (search) */
.mark-ticket{background:#000;border:1px solid var(--bd);border-radius:5px;padding:14px 16px;margin-bottom:16px}
.mark-ticket .detail{padding:8px 0}
.mark-ticket .mt-id{color:#44b9d6;font-weight:700;font-size:1.05em;margin-bottom:8px;display:block}
#srchMarkInfo{width:100%;min-height:110px;background:#000;border:1px solid var(--bd);border-radius:5px;color:#fff;font-size:.9em;padding:10px 12px;font-family:inherit;line-height:1.5;resize:vertical}
#srchMarkInfo:focus{outline:none;border-color:var(--o)}
.mark-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* Global: main content spans 90% of the viewport at all sizes. */
.wrap,.content{width:auto!important;max-width:none!important;margin-left:15px!important;margin-right:15px!important}
/* Remove the top padding, keep a 20px bottom. Use #wrap (ID) so it beats the
   runtime .wrap{padding-top:14px} that topbar-auth.js injects into <head>. */
#wrap.wrap{padding-top:0!important;padding-bottom:20px!important}
</style>

<!-- ===== Light-theme page override (loaded last, wins the cascade) ===== -->
<style id="uc-light">
h1{color:#1b2026!important}
.sub{color:#5c6773!important}
/* Case cards. */
.case{background:#fff!important;border:1px solid #e2e6ea!important;border-left:3px solid #ec7211!important;box-shadow:0 1px 3px rgba(20,30,50,.06)!important}
.case-head:hover{background:#f7f9fb!important}
.case-id{color:#1577a0!important}
.case-title{color:#2a3340!important}
.case-by{color:#5c6773!important}
.case-caret{color:#9aa5b1!important}
.sk-bar{background:#e8ebee!important}
.sk-bar::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent)!important}
.case-meta{color:#5c6773!important}
.case-meta b{color:#1b2026!important}
.blk-t{color:#5c6773!important}
.case-info{background:#f7f9fb!important;border:1px solid #e6eaee!important;color:#2a3340!important}
.link-item{background:#f7f9fb!important;border:1px solid #e6eaee!important}
.link-item a,.case-meta b a{color:#1577a0!important}
.none{color:#8793a0!important}
.case-actions{border-top:1px solid #eef1f4!important}
/* Modals. */
.modal-bg{background:rgba(20,30,45,.55)!important}
.modal{background:#fff!important;border:1px solid #e2e6ea!important}
.modal-head h2{color:#b5560c!important}
.modal-close{color:#5c6773!important}.modal-close:hover{color:#1b2026!important}
.edit-ticket{background:#f7f9fb!important;border:1px solid #e6eaee!important}
.edit-ticket .mt-id{color:#1577a0!important}
.edit-ticket .meta-line{color:#5c6773!important}.edit-ticket .meta-line b{color:#1b2026!important}
.fld-label{color:#5c6773!important}
#editInfo,.link-row input{background:#fff!important;border:1px solid #d4dce4!important;color:#1b2026!important}
#editInfo:focus,.link-row input:focus{border-color:#ec7211!important}
.link-row .rm{background:#fff!important;border:1px solid rgba(220,38,38,.4)!important;color:#dc2626!important}
.link-row .rm:hover{background:#fef2f2!important}
.msg-err{color:#d33a3a!important}
#unmarkText{color:#2a3340!important}
#unmarkText b{color:#1b2026!important}
.modal-head h2[style*="--rl"],.modal h2[style*="var(--rl)"]{color:#dc2626!important}
/* Buttons (the banner's own buttons keep their on-gradient styling). */
.btn{background:linear-gradient(180deg,#ff9f2e,#f07d0a)!important;color:#fff!important;border:none!important}
.btn.sec{background:#fff!important;border:1px solid #e2e6ea!important;color:#b5560c!important}
.btn.sec:hover{border-color:#ec7211!important;color:#ec7211!important;background:#fff4e8!important}
.btn.danger{background:#fff!important;border:1px solid rgba(220,38,38,.4)!important;color:#dc2626!important}
.btn.danger:hover{background:#fef2f2!important}
/* Keep banner buttons as designed (dark pill / frosted) — re-assert over the generic .btn above. */
.uc-banner .btn{background:rgba(10,12,15,.82)!important;color:#fff!important;border:1px solid rgba(255,255,255,.14)!important}
.uc-banner .btn.sec{background:rgba(255,255,255,.18)!important;color:#241354!important;border:1px solid rgba(255,255,255,.4)!important}
.uc-banner .uc-search-btn{background:#fff!important;color:#4c2ea8!important;border:1px solid rgba(255,255,255,.9)!important}
/* White 60px title bar — light theme */
.uc-banner{background:#fff!important;border:1px solid #e2e6ea!important;box-shadow:0 1px 3px rgba(20,30,50,.06)!important}
.uc-banner .ub-title,.uc-banner .ub-title svg{color:#1b2026!important}
.empty{border-color:#d4dce4!important;color:#8793a0!important}
.empty b{color:#1b2026!important}

<style id="ic-loader">
/* ---- Fun phased section loader (same look as sla-breach.html / agent-analytics.html). Concrete brand
   colors: blue #2b66c1, blue-bg #e6f0fc, blue-ic #c4def6, orange #ff6100, orange-l #fe9046, ink #151d28. ---- */
.gw-loader{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gw-loader-in{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:680px}
.gw-orb{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.gw-orb::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(#2b66c1,#c4def6,#fe9046,#ff6100,#2b66c1);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  animation:gwSpin 1.1s linear infinite}
.gw-orb-ic{position:relative;width:62px;height:62px;border-radius:50%;background:#e6f0fc;color:#2b66c1;
  display:flex;align-items:center;justify-content:center;animation:gwPulse 1.6s ease-in-out infinite;box-shadow:0 6px 18px -8px rgba(43,102,193,.5)}
.gw-orb-ic svg{width:30px;height:30px}
@keyframes gwSpin{100%{transform:rotate(360deg)}}
@keyframes gwPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.gw-loader-msg{font-size:1.18em;font-weight:800;color:#151d28;line-height:1.4;min-height:1.5em}
.gw-loader-msg.gw-msg-in{animation:gwMsgIn .5s cubic-bezier(.22,1,.36,1)}
@keyframes gwMsgIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.gw-dots{display:flex;gap:7px}
.gw-dots span{width:9px;height:9px;border-radius:50%;background:#ff6100;animation:gwDot 1.2s ease-in-out infinite}
.gw-dots span:nth-child(2){background:#fe9046;animation-delay:.18s}
.gw-dots span:nth-child(3){background:#2b66c1;animation-delay:.36s}
@keyframes gwDot{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
.gw-loader-sub{font-size:.72em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#2b66c1;background:#e6f0fc;border:1px solid #c4def6;border-radius:999px;padding:4px 14px}
.gw-loader.gw-done .gw-orb::before{animation:none;background:#1f9d57}
.gw-loader.gw-done .gw-orb-ic{background:#e7f7ee;color:#1f9d57;animation:gwPop .4s ease}
.gw-loader.gw-done .gw-loader-msg{color:#1f9d57}
.gw-loader.gw-done .gw-dots{visibility:hidden}
@keyframes gwPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
/* Compact variants: ticket-search results area (sm) and inside the Log updates modal (xs). */
.gw-loader.gw-sm{min-height:220px;padding:20px}
.gw-loader.gw-sm .gw-loader-in{gap:14px}
.gw-loader.gw-sm .gw-loader-msg{font-size:1.05em}
.gw-loader.gw-xs{min-height:160px;padding:16px}
.gw-loader.gw-xs .gw-loader-in{gap:12px}
.gw-loader.gw-xs .gw-orb{width:72px;height:72px}
.gw-loader.gw-xs .gw-orb-ic{width:46px;height:46px}
.gw-loader.gw-xs .gw-orb-ic svg{width:22px;height:22px}
.gw-loader.gw-xs .gw-loader-msg{font-size:.98em}
.card.gw-card{padding:0}
@media (prefers-reduced-motion:reduce){
  .gw-orb::before,.gw-orb-ic,.gw-loader-msg.gw-msg-in,.gw-dots span,.gw-loader.gw-done .gw-orb-ic{animation:none!important}
  .gw-dots span{opacity:.8}
}
</style>

<script>
const A=window.PHDAuth;
// Shared structured incident-log editor (same modal + helpers as My Tickets).
if(window.IncidentLogEditor){ window.IncidentLogEditor.injectStyles(); window.IncidentLogEditor.mount('incidentModalMount'); }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gate(msg){document.getElementById('wrap').innerHTML='<div class="gate"><h1>Unique Cases</h1><p>'+msg+'</p><a class="btn" href="app.html">Go to Live Dashboard</a></div>';}
let MY_TZ='IST';const TZ_ZONE={IST:'Asia/Kolkata',MST:'America/Denver'};
function fmtTZ(iso){if(!iso)return '—';try{return new Date(iso).toLocaleString('en-US',{timeZone:TZ_ZONE[MY_TZ]||TZ_ZONE.IST,day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true})+' '+MY_TZ;}catch(e){return iso;}}

function linkRow(url){
  const u=esc(url);
  return '<div class="link-item"><a href="'+u+'" target="_blank" rel="noopener" title="'+u+'">'+u+'</a></div>';
}

function caseCard(c,i){
  const open=false; // all cards start collapsed (click a head to expand)
  const links=(c.links&&c.links.length)?('<div class="links">'+c.links.map(linkRow).join('')+'</div>'):'<div class="none">No links added.</div>';
  const when=c.updatedAt||c.at;
  // Only the person who marked it can edit/unmark.
  const mine=(A.getUser&&A.getUser()&&String(c.markedBy||'').toLowerCase()===String(A.getUser().username||'').toLowerCase());
  return '<div class="case'+(open?' open':'')+'">'+
    '<button type="button" class="case-head" onclick="toggleCase(this)">'+
      '<span class="case-id">'+esc(c.shortId)+'</span>'+
      '<span class="case-title">'+esc(c.title||'(no title)')+'</span>'+
      '<span class="case-by">'+esc(c.markedBy||'')+'</span>'+
      '<span class="case-caret">▾</span>'+
    '</button>'+
    '<div class="case-body">'+
      '<div class="case-meta">'+
        '<span>Ticket: <b><a href="'+esc(c.url)+'" target="_blank" rel="noopener" style="color:#44b9d6;text-decoration:none">'+esc(c.shortId)+'</a></b></span>'+
        (c.quarter?('<span>Quarter: <b>'+esc(c.quarter)+'</b></span>'):'')+
        (c.status?('<span>Status: <b>'+esc(c.status)+'</b></span>'):'')+
        '<span>Marked by: <b>'+esc(c.markedBy||'—')+'</b></span>'+
        '<span>When: <b>'+fmtTZ(when)+'</b></span>'+
      '</div>'+
      '<div><div class="blk-t">Information</div>'+(c.info?('<div class="case-info">'+esc(c.info)+'</div>'):'<div class="none">No notes added.</div>')+'</div>'+
      '<div><div class="blk-t">Links</div>'+links+'</div>'+
      // Edit stays restricted to the person who marked it; Remove importance (delete) is allowed
      // for any logged-in viewer.
      ('<div class="case-actions">'+
        (mine?('<button class="btn sec" onclick="openEdit('+i+')">'+(window.icon?window.icon('pencil',15):'')+' Edit</button>'):'')+
        '<button class="btn danger" onclick="askUnmark('+i+')">'+(window.icon?window.icon('trash',15):'')+' Remove importance</button>'+
      '</div>')+
    '</div>'+
  '</div>';
}

function toggleCase(btn){const card=btn.closest('.case');if(card)card.classList.toggle('open');}

// ---- Edit marking popup (same fields as the Mark important popup) ----
let CASES=[];let EDIT_SID=null;
function addLinkInput(val){
  const wrap=document.getElementById('editLinks');
  const row=document.createElement('div');
  row.className='link-row';
  const inp=document.createElement('input');
  inp.type='text';inp.placeholder='https://…';inp.value=val||'';inp.title=val||'';
  inp.addEventListener('input',()=>{inp.title=inp.value;});
  const rm=document.createElement('button');
  rm.type='button';rm.className='rm';rm.textContent='✕';rm.title='Remove this link';
  rm.onclick=()=>{row.remove();if(!document.querySelectorAll('#editLinks .link-row').length)addLinkInput('');};
  row.appendChild(inp);row.appendChild(rm);
  wrap.appendChild(row);
}
function openEdit(i){
  const c=CASES[i];if(!c)return;
  EDIT_SID=c.shortId;
  document.getElementById('editTitle').textContent='Edit marking · '+c.shortId;
  document.getElementById('editTicket').innerHTML=
    '<span class="mt-id">'+esc(c.shortId)+'</span>'+
    (c.title?('<div style="color:var(--t);font-size:.9em;margin-bottom:8px">'+esc(c.title)+'</div>'):'')+
    '<div class="meta-line">'+(c.quarter?('Quarter: <b>'+esc(c.quarter)+'</b>'):'')+(c.status?('  ·  Status: <b>'+esc(c.status)+'</b>'):'')+'</div>';
  document.getElementById('editInfo').value=c.info||'';
  const links=(c.links&&c.links.length)?c.links:[''];
  const box=document.getElementById('editLinks');box.innerHTML='';
  links.forEach(l=>addLinkInput(l));
  document.getElementById('editErr').style.display='none';
  document.getElementById('editModal').style.display='flex';
  setTimeout(()=>document.getElementById('editInfo').focus(),40);
}
function closeEdit(){document.getElementById('editModal').style.display='none';EDIT_SID=null;}
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
async function saveEdit(){
  if(!EDIT_SID)return;
  const c=CASES.find(x=>x.shortId===EDIT_SID)||{};
  const info=document.getElementById('editInfo').value.trim();
  const links=[...document.querySelectorAll('#editLinks .link-row input')].map(i=>i.value.trim()).filter(Boolean);
  const err=document.getElementById('editErr');
  if(!info && !links.length){err.textContent='Add some information or at least one link.';err.style.display='block';return;}
  err.style.display='none';
  const btn=document.getElementById('editBtn');btn.disabled=true;btn.textContent='Saving…';
  const r=await A.api('POST','/api/important-cases/'+encodeURIComponent(EDIT_SID),{quarter:c.quarter||'',info,links});
  btn.disabled=false;btn.textContent='Save changes';
  if(r.ok){closeEdit();toast('Updated '+EDIT_SID);load();}
  else{err.textContent=(r.data&&r.data.error)||('Failed (HTTP '+r.status+')');err.style.display='block';}
}

let UNMARK_SID=null;
function askUnmark(i){
  const c=CASES[i];if(!c)return;
  UNMARK_SID=c.shortId;

function gwShuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
// Keep the opening line first and the closing "Almost there" last; shuffle everything in between.

var _ldMsgTimers={};   // pfx -> {iv,to} for the running message rotation
function _ldSetMsg(pfx,tuple){
  var e=document.getElementById(pfx+'LoaderMsg'), i=document.getElementById(pfx+'LoaderIc');
  if(i){ i.innerHTML=ic(tuple[0]||'clock',30); }
  if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent=tuple[1]; e.classList.add('gw-msg-in'); }
}
function _ldStop(pfx){ var t=_ldMsgTimers[pfx]; if(t){ clearInterval(t.iv); clearTimeout(t.to); _ldMsgTimers[pfx]=null; } }
// Phase 1 (@2s) -> apology -> Phase 2 (@3s, loops). Never blank. Stops itself once the loader leaves the DOM.
function _ldStart(pfx,p1,p2){
  _ldStop(pfx);
  var t=_ldMsgTimers[pfx]={iv:null,to:null}, i=0;
  var alive=function(){
    if(_ldMsgTimers[pfx]===t && document.getElementById(pfx+'Loader')) return true;
    clearInterval(t.iv); clearTimeout(t.to); if(_ldMsgTimers[pfx]===t) _ldMsgTimers[pfx]=null;
    return false;
  };
  _ldSetMsg(pfx,p1[0]);
  t.iv=setInterval(function(){
    if(!alive()) return;
    i++;
    if(i<p1.length){ _ldSetMsg(pfx,p1[i]); return; }
    clearInterval(t.iv); t.iv=null;
    _ldSetMsg(pfx,['alert','Sorry for the delay \u2014 still fetching your data\u2026']);
    t.to=setTimeout(function(){
      if(!alive()) return;
      var j=0; _ldSetMsg(pfx,p2[0]);
      t.iv=setInterval(function(){ if(!alive()) return; j=(j+1)%p2.length; _ldSetMsg(pfx,p2[j]); },3000);
    },3000);
  },2000);
}
// Green "done" state shown briefly before the real content replaces the loader.
function _ldSuccess(pfx,msg){
  _ldStop(pfx);
  var l=document.getElementById(pfx+'Loader'); if(l) l.classList.add('gw-done');
  var i=document.getElementById(pfx+'LoaderIc'); if(i) i.innerHTML=ic('check-circle',30);
  var e=document.getElementById(pfx+'LoaderMsg'); if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent=msg||'Data fetched successfully'; e.classList.add('gw-msg-in'); }
}
var _delay=function(ms){ return new Promise(function(res){ setTimeout(res,ms); }); };
const LIST_MIN_MS=1200;   // cold load: keep the loader up long enough to read the first line
const LIST_DONE_MS=900;   // then show the green done state this long before revealing the list
const SEARCH_DONE_MS=600; // shorter done state for a found ticket

let LIST_SEQ=0; // newest load() wins; older in-flight loads are ignored
function listLoaderOn(){return !!document.getElementById('uclLoader');}
async function load(){
  if(!A.getUser()||!A.getToken()){gate('This page is for logged-in users. Log in from the Live Dashboard first.');return;}
  if(!(A.canViewUnique&&A.canViewUnique())){gate('You do not have access to Unique Cases.');return;}
  const seq=++LIST_SEQ;
  // Wait for the profile/timezone first (as before the loader was added): painting earlier ran
  // before the shared chrome (header + menu column) and the admin role were ready, so the page
  // showed a bare loader with no menu and no search bar.
  try{MY_TZ=await A.myTimezone();}catch(e){}
  if(seq!==LIST_SEQ)return;
  // First load: banner + (admin) search + a compact phased loader just below the search bar.
  // Refreshes (after edit / mark / unmark) keep the current page and just swap the list.
  if(!document.getElementById('ucList')) paintLoading();
  const t0=Date.now();
  // Cache (time-based): paint instantly from cache, then refresh in the background. A network
  // result that arrives while the loader is up is held so the done state can show first.
  let fresh=null;
  const res=await A.swrLoad({
    key:'unique-cases',
    fetch:()=>A.api('GET','/api/important-cases'),
    onData:(rows,fromCache)=>{
      if(seq!==LIST_SEQ)return;
      rows=Array.isArray(rows)?rows:[];
      if(listLoaderOn()&&!fromCache){fresh=rows;return;}
      render(rows);
    }
  });
  if(seq!==LIST_SEQ)return;
  if(fresh){
    const wait=LIST_MIN_MS-(Date.now()-t0);
    if(wait>0) await _delay(wait);
    if(seq!==LIST_SEQ)return;
    _ldSuccess('ucl','Unique cases loaded');
    await _delay(LIST_DONE_MS);
    if(seq!==LIST_SEQ)return;
    render(fresh);
    return;
  }
  if(!res.painted){_ldStop('ucl');gate('Could not load unique cases (HTTP '+res.status+').');}
}

function slaRemaining(createIso,slaHours){
  const cd=new Date(createIso);if(isNaN(cd))return null;
  const deadline=cd.getTime()+ (slaHours||240)*3600*1000;
  const ms=deadline-Date.now();
  const over=ms<=0; const abs=Math.abs(ms);
  const d=Math.floor(abs/86400000), h=Math.floor((abs%86400000)/3600000);
  return {over, txt:(d>0?d+'d ':'')+h+'h'};
}
let SEARCH_SEQ=0; // a newer search (or Clear) supersedes an in-flight one
function searchBusy(on){
  const btn=document.getElementById('searchBtn'), box=document.getElementById('result');
  if(btn){btn.disabled=on;if(on)btn.setAttribute('aria-busy','true');else btn.removeAttribute('aria-busy');}
  if(box){if(on)box.setAttribute('aria-busy','true');else box.removeAttribute('aria-busy');}
}
async function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(!q){
    ++SEARCH_SEQ;_ldStop('ucs');searchBusy(false);
    document.getElementById('result').innerHTML='<p class="hint">Enter a ticket ShortId first.</p>';return;
  }
  const seq=++SEARCH_SEQ;
  searchBusy(true);
  document.getElementById('result').innerHTML='<div class="card gw-card">'+ldHtml('ucs','gw-sm','Ticket search')+'</div>';
  _ldStart('ucs',ucSearchPhase1(q),ucSearchPhase2());
  let r;
  try{ r=await A.api('GET','/api/ticket-search?shortId='+encodeURIComponent(q)); }
  catch(e){ r={ok:false,status:0}; }
  if(seq!==SEARCH_SEQ)return; // superseded by a newer search or Clear
  const d=(r&&r.data)||{};
  if(r.ok&&d.found){
    _ldSuccess('ucs','Found '+(d.shortId||q));
    await _delay(SEARCH_DONE_MS);
    if(seq!==SEARCH_SEQ)return;
  }
  _ldStop('ucs');searchBusy(false);
  const box=document.getElementById('result');
  if(!box)return;
  if(!r.ok){box.innerHTML='<div class="card notfound"><b style="color:var(--rl)">Search failed ('+(r.status?('HTTP '+esc(r.status)):'network error')+').</b></div>';return;}
  if(!d.found){
    box.innerHTML='<div class="card notfound"><b style="color:var(--rl)">Ticket not found.</b><p class="hint">No ticket matching <b>'+esc(q)+'</b> exists in any quarter.</p></div>';
    return;
  }
  renderResult(d);
}

    // Wrapper carries the tooltip (disabled buttons don't show title in every browser).
    return '<span class="fc-logwrap" title="No log updates for this ticket">'+
      '<button type="button" class="fc-logbtn" disabled aria-label="No log updates for this ticket">'+clipIc(16)+'</button></span>';
  }
  const lbl='View log updates for '+esc(d.shortId);
  const aria=lbl+(n?(' ('+n+' entr'+(n===1?'y':'ies')+')'):'');
  return '<span class="fc-logwrap"><button type="button" class="fc-logbtn" id="fcLogBtn" onclick="openLogModal(this)" title="'+lbl+'" aria-label="'+aria+'">'+
    clipIc(16)+(n?('<span class="fc-logcount" aria-hidden="true">'+(n>99?'99+':n)+'</span>'):'')+'</button></span>';
}
function openLogModal(btn){
  if(!CURRENT)return;
  LOG_RETURN=btn||null;
  LOG_SID=CURRENT.shortId;
  document.getElementById('logModalIcon').innerHTML=clipIc(16);
  document.getElementById('logCopyBtn').innerHTML=ic('copy',12)||'⧉';
  document.getElementById('logCloseBtn').innerHTML=ic('close',12)||'\u2715';
  document.getElementById('logModalTitle').textContent='Log updates · '+LOG_SID;
  document.getElementById('logModal').style.display='flex';
  document.addEventListener('keydown',logKeydown,true);
  setTimeout(()=>document.getElementById('logCloseBtn').focus(),20);
  fetchLogUpdates();
}
window.openLogModal=openLogModal;
async function fetchLogUpdates(){
  const sid=LOG_SID;if(!sid)return;
  const box=document.getElementById('logList');
  const copyBtn=document.getElementById('logCopyBtn');
  const seq=++LOG_SEQ;
  LOG_ITEMS=[];copyBtn.style.display='none';
  box.setAttribute('aria-busy','true');
  box.innerHTML=ldHtml('ucg','gw-xs','Log updates');
  _ldStart('ucg',ucLogPhase1(sid),ucLogPhase2());
  let r;
  try{ r=await A.api('GET','/api/tickets/'+encodeURIComponent(sid)+'/incident-log'); }
  catch(e){ r={ok:false,status:0}; }
  if(LOG_SID!==sid||seq!==LOG_SEQ)return; // closed, switched or re-fetched while loading
  _ldStop('ucg');box.removeAttribute('aria-busy');
  if(!r.ok||!Array.isArray(r.data)){
    box.innerHTML='<div class="ilog-err">Could not load log updates'+(r.status?(' (HTTP '+esc(r.status)+')'):'')+'.<br>'+
      '<button type="button" class="btn sec" onclick="fetchLogUpdates()">'+ic('refresh',13)+' Retry</button></div>';
    return;
  }
  // Newest first.
  const items=r.data.slice().sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
  syncLogBadge(sid,items.length);
  if(!items.length){box.innerHTML='<div class="ilog-empty">No log updates for this ticket yet</div>';return;}
  LOG_ITEMS=items;copyBtn.style.display='';
  box.innerHTML=items.map(e=>{
    const when=e.at?fmtTZ(e.at):'';
    return '<div class="ilog-item" data-id="'+esc(e.id)+'">'+
      '<div class="ilog-head">'+
        '<div class="ilog-who">'+ic('users',13)+' by <b>'+esc(e.user||'—')+'</b>'+(when?('<span class="ilog-when">'+ic('clock',11)+' '+esc(when)+'</span>'):'')+'</div>'+
        logEditBtnHtml(e)+
      '</div>'+
      '<div class="ilog-text">'+esc(e.text)+'</div>'+
    '</div>';
  }).join('');
}
window.fetchLogUpdates=fetchLogUpdates;
// Copy every entry in the popup as plain text (exactly as authored, blank line between entries).
async function copyLogUpdates(){
  if(!LOG_ITEMS.length){toast('Nothing to copy');return;}
  const text=LOG_ITEMS.map(e=>e.text||'').join('\n\n');
  const n=LOG_ITEMS.length;
  try{
    await navigator.clipboard.writeText(text);
    toast('Copied '+n+' log entr'+(n===1?'y':'ies'));
  }catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied to clipboard');}catch(_){toast('Copy failed');}
    document.body.removeChild(ta);
  }
}
window.copyLogUpdates=copyLogUpdates;
function closeLogModal(){
  document.getElementById('logModal').style.display='none';
  document.removeEventListener('keydown',logKeydown,true);
  LOG_SID=null;LOG_ITEMS=[];_ldStop('ucg');
  const ll=document.getElementById('logList');if(ll)ll.removeAttribute('aria-busy');
  const back=(LOG_RETURN&&document.body.contains(LOG_RETURN))?LOG_RETURN:(document.getElementById('fcLogBtn')||document.getElementById('q'));
  LOG_RETURN=null;
  if(back)back.focus();
}
window.closeLogModal=closeLogModal;
// Esc closes; Tab / Shift+Tab stay inside the dialog.
function logKeydown(e){
  // A modal stacked on top (the entry editor, or a confirm/alert popup) owns the keyboard.
  if(ilEditorOpen()||document.querySelector('.tb-modal-bg'))return;
  if(e.key==='Escape'){e.preventDefault();closeLogModal();return;}
  if(e.key!=='Tab')return;
  const dlg=document.querySelector('#logModal .vil-modal');
  const f=[...dlg.querySelectorAll('button,a[href],[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&el.offsetParent!==null);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(!dlg.contains(document.activeElement)){e.preventDefault();first.focus();return;}
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}
// Keep the found-card's log button (count badge) in sync with the latest fetched entry count.
function syncLogBadge(sid,n){
  if(!CURRENT||String(CURRENT.shortId)!==String(sid)||CURRENT.logCount===n)return;
  CURRENT.logCount=n;
  const wrap=document.querySelector('#result .fc-logwrap');if(!wrap)return;
  const tmp=document.createElement('div');tmp.innerHTML=logBtnHtml(CURRENT);
  wrap.replaceWith(tmp.firstChild);
  if(LOG_SID)LOG_RETURN=document.getElementById('fcLogBtn')||null;
}

// ================= Edit a log entry (shared structured editor from incident-log-editor.js) =================
// Server rule (PUT/DELETE /api/incident-log/:id): only the entry's author may edit or delete it — no
// admin override. GET /incident-log returns `mine` using the same check, so it drives the button;
// the server still enforces it (403 is surfaced in the editor).
const PENCIL_SVG='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const NOT_AUTHOR_MSG='Only the author can edit this entry';
function logEditBtnHtml(e){
  const pic=ic('edit',14)||PENCIL_SVG;
  if(!e||!e.mine){
    return '<span class="ilog-editwrap" title="'+NOT_AUTHOR_MSG+'"><button type="button" class="ilog-editbtn" disabled aria-label="'+NOT_AUTHOR_MSG+'">'+pic+'</button></span>';
  }
  return '<button type="button" class="ilog-editbtn" data-id="'+esc(e.id)+'" onclick="openLogEntryEditor(this.getAttribute(\'data-id\'))" title="Edit this log entry" aria-label="Edit this log entry">'+pic+'</button>';
}
var IL_EDIT_ID=null;        // entry id open in the editor
var IL_EDIT_RETURN_ID=null; // entry whose Edit button gets focus back when the editor closes
function ilEditorOpen(){const m=document.getElementById('incidentModal');return !!(m&&m.style.display==='flex');}
function openLogEntryEditor(id){
  const e=LOG_ITEMS.find(x=>String(x.id)===String(id));
  if(!e||!LOG_SID||!window.IncidentLogEditor)return;
  if(!e.mine){toast(NOT_AUTHOR_MSG);return;}
  const sid=LOG_SID;
  const f=parseIncidentOutput(e.text||'');
  IL_EDIT_ID=String(e.id);IL_EDIT_RETURN_ID=IL_EDIT_ID;
  const hic=document.getElementById('ailHeadIc');if(hic)hic.innerHTML=clipIc(18);
  document.getElementById('incidentTitleText').textContent='Edit incident log · '+sid;
  ilSetTitleCopyId(sid);
  // Transporter Trace / Mark important head flags are My-Tickets-only (see report); left empty here.
  const flags=document.getElementById('ailHeadFlags');if(flags)flags.innerHTML='';
  const sb=document.getElementById('incidentBtn');if(sb){sb.textContent='Save';sb.disabled=false;}
  const db=document.getElementById('incidentDeleteBtn');if(db)db.style.display='';
  fillIncidentSelects();
  const set=(k,v)=>{const el=document.getElementById(k);if(el)el.value=v||'';};
  set('ilPhdFindings',f.findings);set('ilPhdInvestigation',f.invest);set('ilSimRcd',f.sim);
  set('ilRootCause',f.rootCause);set('ilPhdResolution',f.res);set('ilPhdNotes',f.notes);
  // Same as My Tickets: PHD Related Link is always the canonical ticket URL (read-only).
  const url=(CURRENT&&String(CURRENT.shortId)===sid&&CURRENT.url)?CURRENT.url:('https://t.corp.amazon.com/'+sid);
  set('ilRelatedLink',url);
  ilPaintFieldCopyIcons();
  ilWireTextareaAutosize();
  ilSetFieldLocks(true);   // filled text fields start read-only with a pencil to edit
  ilRefreshSelectUI();
  ilRefreshEmptyMarks();
  document.getElementById('incidentErr').style.display='none';
  document.getElementById('incidentModal').style.display='flex';
  document.addEventListener('keydown',ilEditorKeydown,true);
  setTimeout(()=>{ilAutosizeAll();const el=document.getElementById('ilPhdFindings');if(el)el.focus();},50);
}
window.openLogEntryEditor=openLogEntryEditor;
// Called by the shared modal's Close / × / backdrop.
function closeIncidentLog(){
  document.getElementById('incidentModal').style.display='none';
  document.removeEventListener('keydown',ilEditorKeydown,true);
  IL_EDIT_ID=null;
  const rid=IL_EDIT_RETURN_ID;IL_EDIT_RETURN_ID=null;
  let back=null;
  if(rid)back=[...document.querySelectorAll('#logList .ilog-editbtn[data-id]')].find(b=>b.getAttribute('data-id')===rid)||null;
  if(!back)back=document.getElementById('logCloseBtn');
  if(back&&ilVisible(back))back.focus();
}
window.closeIncidentLog=closeIncidentLog;
function ilVisible(el){return !!(el&&el.offsetParent!==null);}
function ilWriteErrMsg(r,verb){
  if(r.status===403)return 'Only the author of this entry can '+verb+' it. '+((r.data&&r.data.error)||'');
  if(r.status===401)return 'Your session has expired. Log in again and retry.';
  return (r.data&&r.data.error)||('Failed (HTTP '+(r.status||'network error')+')');
}
// Save = update the existing entry (same PUT as My Tickets). Like My Tickets, the editor stays open
// afterwards with filled fields re-locked; the Log updates list behind it refreshes.
async function submitIncidentLog(){
  if(!IL_EDIT_ID)return;
  const id=IL_EDIT_ID;
  const err=document.getElementById('incidentErr');err.style.display='none';
  const text=buildIncidentOutput();
  const btn=document.getElementById('incidentBtn');btn.disabled=true;btn.textContent='Saving…';
  let r;try{r=await A.api('PUT','/api/incident-log/'+encodeURIComponent(id),{text});}catch(e){r={ok:false,status:0};}
  btn.disabled=false;btn.textContent='Save';
  if(r.ok){
    if(IL_EDIT_ID===id){ilSetFieldLocks(true);ilRefreshSelectUI();ilRefreshEmptyMarks();}
    toast('Incident log updated');
    fetchLogUpdates();
  }else{err.textContent=ilWriteErrMsg(r,'edit');err.style.display='block';}
}
window.submitIncidentLog=submitIncidentLog;
async function deleteIncidentFromForm(){
  if(!IL_EDIT_ID)return;
  const id=IL_EDIT_ID;
  const db=document.getElementById('incidentDeleteBtn');
  const ok=await window.PHDConfirm({title:'Delete incident log',body:'Delete this incident log entry? This cannot be undone.',okLabel:'Delete',danger:true});
  if(!ok){if(db&&ilVisible(db))db.focus();return;}
  let r;try{r=await A.api('DELETE','/api/incident-log/'+encodeURIComponent(id));}catch(e){r={ok:false,status:0};}
  if(r.ok){
    IL_EDIT_RETURN_ID=null; // the entry is gone -> focus returns to the Log updates dialog
    closeIncidentLog();
    toast('Incident log deleted');
    fetchLogUpdates();
  }else{
    await window.PHDAlert({title:'Delete failed',body:ilWriteErrMsg(r,'delete')});
    if(db&&ilVisible(db))db.focus();
  }
}
window.deleteIncidentFromForm=deleteIncidentFromForm;
// Editor keyboard: Esc closes only the editor (or an open dropdown first); Tab is trapped inside.
function ilEditorKeydown(e){
  if(!ilEditorOpen()||document.querySelector('.tb-modal-bg'))return;
  if(e.key==='Escape'){
    e.preventDefault();e.stopPropagation();
    const ss=document.querySelector('#incidentModal .ss-wrap.open');
    if(ss){const fld=ss.querySelector('.ss-field');if(fld){fld.click();fld.focus();}return;}
    closeIncidentLog();return;
  }
  if(e.key!=='Tab')return;
  const dlg=document.querySelector('#incidentModal .ail-modal');
  const f=[...dlg.querySelectorAll('button,a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&ilVisible(el));
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(!dlg.contains(document.activeElement)){e.preventDefault();first.focus();return;}
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}

load();
