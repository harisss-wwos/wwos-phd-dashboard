<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resolved Repeat Incidents · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: keep the page hidden until topbar-auth.js has injected its styles AND built the
     nav-rail + profile column, so the chrome is present on the FIRST paint (no flash-in). The class
     is cleared by topbar-auth after the chrome builds; a failsafe timer clears it if the script
     never runs (offline) so the page can never stay hidden. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shimmer.css">
<!-- Keep the section hidden until the shared chrome (title bar + menu column) has wrapped it. -->
<style>#wrap{visibility:hidden}#tbHomeChrome #wrap,html.tb-wrap-timeout #wrap{visibility:visible}</style>
<script>setTimeout(function(){document.documentElement.classList.add('tb-wrap-timeout');},8000);</script>
<noscript><style>#wrap{visibility:visible!important}</style></noscript>
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.wrap{padding:32px 24px;width:auto;max-width:none;margin:0}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
<style id="hrx-light">
/* Resolved Repeat Incidents — same visual language as errors-in-resolved.html: dark navy hero with an
   orange rule, KPI cards overlapping it, then white collapsible section cards. Everything is scoped
   under .hrx (a size container, so the grids respond to the main column, not the viewport). */
#wrap.wrap{padding-top:0!important;padding-bottom:28px!important}
.gate{text-align:center;padding:50px 0}
.gate h1{font-size:1.6em;margin-bottom:8px}
.gate p{color:#5c6773;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;background:#ec7211;color:#fff;font-weight:700;font-size:.86em;text-decoration:none}
.btn:hover{background:#d4650c}

.hrx{--ink:#1b2026;--mut:#5c6773;--line:#e2e6ea;--soft:#f5f6f8;--acc:#ec7211;--acc-bg:#fff3e8;--acc-ink:#9a4100;
  --red:#b42318;--red-bg:#fdecec;--grn:#1a7a43;--grn-bg:#e5f5ec;--blu:#2b66c1;--blu-bg:#e9f0fb;--vio:#6a4bd8;--vio-bg:#f0ecfe;
  --c-all:#2b66c1;--c-np:#ec7211;--c-pet:#7c5cff;--focus:#f0a35a;container-type:inline-size;color:var(--ink)}
.hrx button,.hrx input{font:inherit;text-transform:none}
.hrx :is(button,a,input,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hrx-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.hrx-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 78px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.hrx-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.hrx-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.hrx-hero-in{position:relative;display:flex;gap:18px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.hrx-hero-main{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1 1 380px}
.hrx-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.hrx-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.hrx-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.05}
.hrx-hero-sub{margin-top:9px;max-width:64ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.8)}
.hrx-chips{list-style:none;display:flex;flex-wrap:wrap;gap:8px;max-width:100%}
.hrx-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;font-size:.8em;font-weight:700;color:#fff;white-space:nowrap;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.hrx-chip svg{flex-shrink:0;color:#ffb26b}
.hrx-chip.is-err{border-color:rgba(255,140,120,.5);color:#ffd1c8}
@container (max-width:560px){
  .hrx-hero{padding:20px 18px 70px 22px}
  .hrx-hero h1{font-size:1.6em;letter-spacing:-.5px}
  .hrx-hero-ic{width:40px;height:40px}
  .hrx-hero-main{flex-basis:100%}
}

/* ---- KPI row (overlaps the hero) ---- */
.hrx-kpis{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:-56px 18px 16px}
.hrx-kpis>:last-child{grid-column:1/-1}
@container (min-width:600px){.hrx-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.hrx-kpis>:last-child{grid-column:auto}.hrx-kpis>:nth-child(4){grid-column:span 2}}
@container (min-width:1060px){.hrx-kpis{grid-template-columns:repeat(5,minmax(0,1fr))}.hrx-kpis>:nth-child(4){grid-column:auto}}
@container (max-width:560px){.hrx-kpis{margin:-50px 10px 14px;gap:10px}}
.hrx-kpi{position:relative;overflow:hidden;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.hrx-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#c4ccd4)}
.hrx-kpi-l{display:flex;align-items:center;gap:9px;font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.hrx-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:#3a4552}
.hrx-kpi-v{margin-top:12px;font-size:2.3em;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.hrx-kpi-s{margin-top:7px;font-size:.82em;font-weight:600;color:var(--mut)}
.hrx-kpi-s b{color:var(--ink);font-weight:800}
.hrx-kpi-bar{margin-top:12px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.hrx-kpi-bar i{display:block;height:100%;border-radius:inherit;background:var(--k)}
@container (max-width:560px){.hrx-kpi{padding:13px 14px 12px}.hrx-kpi-v{font-size:1.8em}.hrx-kpi-l{letter-spacing:.6px}}
.hrx-kpi.is-base{--k:#1f2a40}
.hrx-kpi.is-all{--k:var(--c-all)}.hrx-kpi.is-all .hrx-kpi-ic{background:var(--blu-bg);color:var(--blu)}
.hrx-kpi.is-np{--k:var(--c-np)}.hrx-kpi.is-np .hrx-kpi-ic{background:var(--acc-bg);color:#b5530a}
.hrx-kpi.is-pet{--k:var(--c-pet)}.hrx-kpi.is-pet .hrx-kpi-ic{background:var(--vio-bg);color:var(--vio)}
.hrx-kpi.is-bad{--k:#d92d20}.hrx-kpi.is-bad .hrx-kpi-v{color:var(--red)}.hrx-kpi.is-bad .hrx-kpi-ic{background:var(--red-bg);color:var(--red)}
.hrx-kpi.is-rate{--k:#1f9d57}.hrx-kpi.is-rate .hrx-kpi-ic{background:var(--grn-bg);color:var(--grn)}

/* ---- Section cards (chart / non-pet / pet; one open at a time) ---- */
.hrx-sections{display:flex;flex-direction:column;gap:14px}
.hrx .hr-range{--sc:var(--c-all);--sc-bg:var(--blu-bg);position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 2px 10px -6px rgba(20,30,50,.18);transition:box-shadow .15s,border-color .15s}
.hrx .hr-range::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--sc);opacity:.85}
.hrx .hr-range.rng-nonpet{--sc:var(--c-np);--sc-bg:var(--acc-bg)}
.hrx .hr-range.rng-pet{--sc:var(--c-pet);--sc-bg:var(--vio-bg)}
.hrx .hr-range.open{border-color:#cfd6dd;box-shadow:0 14px 30px -24px rgba(20,30,50,.6)}
.hrx-sec-h{margin:0;font-size:1em}
.hrx .hr-range-head{width:100%;display:flex;align-items:center;gap:14px;padding:16px 20px 15px;border:none;background:#fff;color:var(--ink);text-align:left;cursor:pointer}
.hrx .hr-range-head:hover{background:#fafbfc}
.hrx .hr-range-head:focus-visible{outline-offset:-3px}
.hrx .hr-range.open>.hrx-sec-h .hr-range-head{border-bottom:1px solid var(--line)}
.hrx-chev{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:#818284}
.hrx-chev svg{transition:transform .15s}
.hrx [aria-expanded="true"] .hrx-chev svg{transform:rotate(90deg)}
.hrx :is(.hr-range-head,.hr-sub-head):hover .hrx-chev{background:#e6f0fc;color:#2b66c1}
.hrx .hr-range-ic{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--sc-bg);color:var(--sc)}
.hrx-sec-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.hrx .hr-range-title{font-size:1.12em;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.hrx-sec-desc{font-size:.84em;font-weight:500;color:var(--mut);line-height:1.45}
.hrx .hr-range-meta{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);
  font-size:.78em;font-weight:800;color:#3a4552;white-space:nowrap;font-variant-numeric:tabular-nums}
.hrx .hr-range-meta:empty{display:none}
.hrx .hr-range-meta.is-idle{font-weight:700;color:var(--mut);background:#fff;border-style:dashed}
.hrx .hr-range-meta.is-err{background:var(--red-bg);border-color:#f2b8b1;color:var(--red)}
@container (max-width:620px){.hrx .hr-range-head{flex-wrap:wrap;gap:10px 12px;padding:14px 14px 13px}.hrx-sec-txt{flex-basis:calc(100% - 90px)}.hrx .hr-range-meta{margin-left:34px}.hrx-sec-desc{display:none}}
.hrx .hr-range-body{padding:18px 20px 20px}
.hrx .hr-range-body[hidden]{display:none}
@container (max-width:620px){.hrx .hr-range-body{padding:14px 12px 16px}}

/* ---- Toolbar: segmented view control + search + analyst chips ---- */
.hrx .np-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;padding:10px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.hrx .np-seg{display:inline-flex;flex-wrap:wrap;padding:3px;border-radius:9px;background:#e7eaee;border:none;gap:2px}
.hrx .np-seg-opt{position:relative;display:inline-flex;cursor:pointer;user-select:none}
.hrx .np-seg-opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.hrx .np-seg-opt span{display:inline-flex;align-items:center;padding:6px 14px;border-radius:7px;font-size:.84em;font-weight:700;color:#5c6773;white-space:nowrap;transition:background .14s,color .14s}
.hrx .np-seg-opt:hover span{color:var(--ink)}
.hrx .np-seg-opt input:checked+span{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,50,.18)}
.hrx .np-seg-opt input:focus-visible+span{outline:3px solid var(--focus);outline-offset:1px}
.hrx-search{position:relative;flex:1 1 240px;max-width:420px}
.hrx-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8793a0;pointer-events:none}
.hrx-search input{width:100%;font-size:.9em;padding:8px 12px 8px 36px;border-radius:8px}
.hrx .np-checks{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hrx .np-checks[hidden]{display:none}
.hrx .np-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid #d4dade;border-radius:99px;background:#fff;font-size:.84em;font-weight:700;color:#3a4552;cursor:pointer;user-select:none}
.hrx .np-chip input{width:15px;height:15px;margin:0;accent-color:var(--acc);cursor:pointer}
.hrx .np-chip:has(input:checked){background:var(--acc-bg);border-color:#f7c99c;color:var(--acc-ink)}
.hrx-count{margin-left:auto;font-size:.82em;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
@container (max-width:620px){.hrx .np-seg{width:100%}.hrx .np-seg-opt{flex:1 1 auto}.hrx .np-seg-opt span{width:100%;justify-content:center;padding:6px 8px;font-size:.8em}.hrx-search{max-width:none;flex-basis:100%}.hrx-count{margin-left:0}}

/* ---- Groups (By Country / By Agents): avatar + chevron expanders ---- */
.hrx .hr-sub{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.hrx .hr-sub:last-child{margin-bottom:0}
.hrx .hr-sub.open{border-color:#cfd6dd;box-shadow:0 12px 26px -22px rgba(20,30,50,.6)}
.hrx .hr-sub-head{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;border:none;background:#fff;color:var(--ink);text-align:left;cursor:pointer;min-height:0}
.hrx .hr-sub-head:hover{background:#fafbfc}
.hrx .hr-sub.open .hr-sub-head{background:#f7f8fa;border-bottom:1px solid var(--line)}
.hrx .hr-sub-head:focus-visible{outline-offset:-3px}
.hrx-av{flex-shrink:0;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.86em;font-weight:800;
  background:hsl(var(--h) 60% 92%);color:hsl(var(--h) 55% 28%);border:1px solid hsl(var(--h) 45% 82%)}
.hrx-av.is-ctry{border-radius:9px;font-size:.7em;letter-spacing:.4px}
.hrx-g-id{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px}
.hrx .hr-sub-title{font-size:.95em;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrx-g-name2{font-weight:600;color:var(--mut)}
.hrx-g-bar{flex:0 0 160px;height:8px;border-radius:99px;background:#eef1f4;overflow:hidden}
.hrx-g-bar i{display:block;height:100%;border-radius:inherit;background:var(--gc,var(--acc))}
.hrx .hr-sub-meta{flex:0 0 auto;min-width:170px;display:flex;justify-content:flex-end;align-items:center;gap:14px;font-size:.82em;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.hrx .hr-sub-meta b{font-size:1.15em;font-weight:800;color:var(--ink)}
.hrx-g-top{display:inline-flex;align-items:center;gap:6px}
@container (max-width:700px){.hrx-g-bar{display:none}.hrx .hr-sub-meta{min-width:0;flex-direction:column;align-items:flex-end;gap:2px}}
.hrx .hr-sub-body{padding:12px 14px 14px}
.hrx .hr-sub-body[hidden]{display:none}
.hrx-phd{display:inline-flex;align-items:center;flex-shrink:0;padding:2px 7px;border-radius:5px;font-size:.66em;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:#136b67;background:#d2f0ee;border:1px solid #9fd9d4;vertical-align:middle;cursor:default}

/* ---- Tables ---- */
.hrx .np-tablewrap{overflow:auto;max-height:540px;border:1px solid var(--line);border-radius:8px;background:#fff}
.hrx .np-tbl{width:100%;min-width:780px;border-collapse:separate;border-spacing:0;font-size:.86em;table-layout:fixed}
.hrx .np-tbl th,.hrx .np-tbl td{padding:9px 12px;border-bottom:1px solid #eef1f4!important;text-align:left;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrx .np-tbl thead th{position:sticky;top:0;z-index:1;background:#f5f6f8!important;border-bottom:1px solid var(--line)!important;color:#5c6773!important;
  font-size:.72em;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.hrx .np-tbl tbody tr:last-child td{border-bottom:none!important}
.hrx .np-tbl .np-c{text-align:center}
.hrx .np-tbl tbody tr:hover td{background:#fff7ed!important}
.hrx .np-id{color:#2b66c1;font-weight:800;text-decoration:none;white-space:nowrap}
.hrx .np-id:hover{text-decoration:underline}
.hrx .np-title{color:#2a3340!important}
.hrx .np-rc{color:#5c6773!important}
.hrx-who{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-weight:700}
.hrx-who span{overflow:hidden;text-overflow:ellipsis}
.hrx-cc{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.86em;font-weight:800;color:#3a4552;letter-spacing:.3px}
.hrx-hi{display:inline-flex;align-items:center;justify-content:center;min-width:28px;padding:2px 8px;border-radius:99px;font-size:.9em;font-weight:800;font-variant-numeric:tabular-nums;
  background:#fff6e0;color:#8a5a00;border:1px solid #f3dca2}
.hrx-hi.is-high{background:var(--acc-bg);color:#a34700;border-color:#f7c99c}
.hrx-hi.is-crit{background:var(--red-bg);color:var(--red);border-color:#f2b8b1}

/* ---- Chart ---- */
.hrx .hr-chart-top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:10px}
.hrx-chart-note{font-size:.84em;font-weight:600;color:var(--mut)}
.hrx .hr-chart-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0;list-style:none}
.hrx .hr-lg{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.8em;font-weight:700;color:#3a4552}
.hrx .hr-lg i{width:14px;height:3px;border-radius:2px;display:inline-block}
.hrx .hr-lg.combined i{background:var(--c-all)}
.hrx .hr-lg.nonpet i{background:var(--c-np)}
.hrx .hr-lg.pet i{background:var(--c-pet)}
.hrx .hr-chart-wrap{position:relative;width:100%;overflow:visible}
.hrx .hr-chart-svg{width:100%;height:auto;max-height:300px;display:block;overflow:visible}
.hr-chart-svg .grid{stroke:#eef1f4;stroke-width:1}
.hr-chart-svg .axis{stroke:#d4dce4;stroke-width:1}
.hr-chart-svg .axlbl{fill:#8793a0;font-size:11px;font-weight:600}
.hr-chart-svg .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hr-chart-svg .ln.combined{stroke:#2b66c1}
.hr-chart-svg .ln.nonpet{stroke:#ec7211}
.hr-chart-svg .ln.pet{stroke:#7c5cff}
.hr-chart-svg .pt{stroke:#fff;stroke-width:2;cursor:pointer}
.hr-chart-svg .pt.combined{fill:#2b66c1}
.hr-chart-svg .pt.nonpet{fill:#ec7211}
.hr-chart-svg .pt.pet{fill:#7c5cff}
.hr-chart-svg .hit{fill:transparent;cursor:pointer;outline:none}
.hr-chart-svg .hit:focus-visible{fill:rgba(236,114,17,.08);stroke:#f0a35a;stroke-width:2}
.hr-chart-svg .ptlbl{font-size:11px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.hr-chart-svg .ptlbl.combined{fill:#1f4f9a}.hr-chart-svg .ptlbl.nonpet{fill:#a34700}.hr-chart-svg .ptlbl.pet{fill:#5b3fd6}
.hr-chart-svg .vline{stroke:rgba(20,40,70,.22);stroke-width:1;stroke-dasharray:3 3;visibility:hidden}
.hr-chart-tip{position:absolute;pointer-events:none;z-index:5;min-width:200px;background:#fff;border:1px solid var(--line,#e2e6ea);border-radius:10px;padding:11px 13px;
  box-shadow:0 16px 34px -16px rgba(20,40,70,.4);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;font-size:.82em}
.hr-chart-tip.show{opacity:1;transform:translateY(0)}
.hr-chart-tip .tt-m{font-weight:800;color:#1b2026;margin-bottom:7px;font-size:1.02em}
.hr-chart-tip .tt-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:2px 0;color:#5c6773}
.hr-chart-tip .tt-row .k{display:inline-flex;align-items:center;gap:6px}
.hr-chart-tip .tt-row .k i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hr-chart-tip .tt-row .v{font-weight:800;color:#1b2026;font-variant-numeric:tabular-nums}
.hr-chart-tip .tt-sep{height:1px;background:#eef1f4;margin:7px 0}
.hr-chart-tip .tt-pct{color:#5c6773;font-size:.95em}
.hr-chart-tip .tt-pct b{color:#1b2026}

/* ---- Loading skeletons, empty + error states ---- */
.hrx-skel{display:block;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:hrxShim 1.4s ease infinite}
.hrx-skel-d{background:linear-gradient(90deg,rgba(255,255,255,.10) 25%,rgba(255,255,255,.22) 40%,rgba(255,255,255,.10) 60%);background-size:400% 100%}
@keyframes hrxShim{0%{background-position:100% 0}100%{background-position:0 0}}
.hrx-sk-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;padding:10px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.hrx-sk-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.hrx-sk-row .grow{flex:1 1 auto}
@container (max-width:700px){.hrx-sk-row .bar{display:none}}
.hrx-sk-chart{display:flex;flex-direction:column;gap:12px}
.hrx-sk-legend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hrx-sk-legend>span{display:flex;gap:8px}
.hrx-sk-plot{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;height:240px;padding:0 6px 0 40px;
  background-image:linear-gradient(#eef1f4 1px,transparent 1px);background-size:100% 48px}
.hrx-sk-plot .hrx-skel{flex:1;border-radius:6px 6px 0 0;opacity:.75}
.hrx-state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 20px;text-align:center;color:var(--mut)}
.hrx-state-ic{width:58px;height:58px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#eef1f4;color:#5c6773;margin-bottom:4px}
.hrx-state-ic.is-err{background:var(--red-bg);color:var(--red)}
.hrx-state-t{font-size:1.08em!important;font-weight:800;color:var(--ink)!important}
.hrx-state p{font-size:.9em;max-width:52ch;line-height:1.5}
.hrx-btn{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:9px 16px;border:none;border-radius:8px;background:#161d2d;color:#f4f3ef;font-size:.86em;font-weight:800;cursor:pointer;transition:background .15s}
.hrx-btn:hover{background:#0f1420}

/* One orchestrated entrance on first paint: hero, KPI cards (staggered), then the sections. */
@keyframes hrxUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hrx.is-anim .hrx-hero{animation:hrxUp .45s ease both}
.hrx.is-anim .hrx-kpi{animation:hrxUp .5s ease both}
.hrx.is-anim .hrx-kpi:nth-child(2){animation-delay:.06s}
.hrx.is-anim .hrx-kpi:nth-child(3){animation-delay:.12s}
.hrx.is-anim .hrx-kpi:nth-child(4){animation-delay:.18s}
.hrx.is-anim .hrx-kpi:nth-child(5){animation-delay:.24s}
.hrx.is-anim .hr-range{animation:hrxUp .5s ease .2s both}
@media (prefers-reduced-motion:reduce){
  .hrx *,.hrx *::before,.hrx *::after{animation:none!important;transition:none!important}
}
</style>

</div>

<div class="wrap" id="wrap">
  <!-- Static first-paint placeholder (hero + KPI skeletons). render() replaces it with the live page. -->
  <div class="hrx" aria-busy="true">

      <p class="hrx-eyebrow">Repeat incidents · Resolved tickets</p><h1>Resolved Repeat Incidents</h1>
    </div></div></div></header>
    <div class="hrx-kpis" aria-hidden="true">
      <div class="hrx-kpi"><span class="hrx-skel" style="width:55%;height:11px"></span><span class="hrx-skel" style="width:45%;height:30px;margin-top:14px"></span></div>
      <div class="hrx-kpi"><span class="hrx-skel" style="width:55%;height:11px"></span><span class="hrx-skel" style="width:45%;height:30px;margin-top:14px"></span></div>
      <div class="hrx-kpi"><span class="hrx-skel" style="width:55%;height:11px"></span><span class="hrx-skel" style="width:45%;height:30px;margin-top:14px"></span></div>
      <div class="hrx-kpi"><span class="hrx-skel" style="width:55%;height:11px"></span><span class="hrx-skel" style="width:45%;height:30px;margin-top:14px"></span></div>
      <div class="hrx-kpi"><span class="hrx-skel" style="width:55%;height:11px"></span><span class="hrx-skel" style="width:45%;height:30px;margin-top:14px"></span></div>
    </div>
  </div>
</div>
<script src="icons.js?v=2"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=222"></script>
<script>
const A=window.PHDAuth;
let HR_DATA=null;
let HR_MONTHLY=null; // { year, months:[{month,total,pet,nonPet,repeatPet,repeatNonPet}, ...] }
let HR_NONPET=null;  // { total, tickets:[{shortId,url,country,resolvedBy,hi,title,rootCause}, ...] }
let NP_VIEW='country'; // active radio in the Non-Pet Repeat section: country | hi | agent
let NP_PHD=true, NP_NONPHD=true; // agent-view checkboxes (both on by default)
let HR_PET=null;     // same shape as HR_NONPET, for the Pet Repeat section
let PT_VIEW='country';
let PT_PHD=true, PT_NONPHD=true;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gate(msg){document.getElementById('wrap').innerHTML='<div class="gate"><h1>Resolved Repeat Incidents</h1><p>'+msg+'</p><a class="btn" href="app.html">Go to Live Dashboard</a></div>';}
const statusColor=(s)=>({'Resolved':'#4ade80','Closed':'#4ade80','Assigned':'#44b9d6','Work In Progress':'#fbbf24','Pending':'#ff9900','Researching':'#a78bfa'})[s]||'#879596';
function fmtDate(iso){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return '—'; return d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
// Resolution time shown in DAYS (no hours), matching SLA Breaches.
function fmtHrs(h){ if(h==null||isNaN(h))return '—'; return (h/24).toFixed(1)+' days'; }
// C/R tag: C = Closed, R = Resolved, else first letter.
function statusTag(s){
  var v=String(s||'').toLowerCase();
  if(v==='closed')return '<span class="hr-tag c" title="Closed">C</span>';
  if(v==='resolved')return '<span class="hr-tag r" title="Resolved">R</span>';
  return '<span class="hr-tag o" title="'+esc(s||'')+'">'+esc((s||'?').charAt(0).toUpperCase())+'</span>';
}
// Registered PHD users (lowercase logins) from /api/user-roles — agents in this set get a PHD tag.
var HR_USERS=null;
function isPhdUser(name){ return !!(HR_USERS && HR_USERS.has(String(name||'').trim().toLowerCase())); }
function phdTag(name){ return isPhdUser(name)?'<span class="hr-phd" title="Registered PHD user">PHD</span>':''; }
// Per-agent state: tickets by index; shown starts at 20 (+10 each); sortField/sortDir for the
// sortable HI Cnt / Resolved / Resolution-time headers. Default: resolution time, worst first.
var HR_AGENTS=[]; var HR_PAGE0=20, HR_STEP=10;
function hrArrow(a,field){
  if(a.sortField!==field) return '<span class="hr-sort-ar idle">\u21c5</span>';
  return a.sortDir==='desc'?'<span class="hr-sort-ar">\u25bc</span>':'<span class="hr-sort-ar">\u25b2</span>';
}
// Build one agent's ticket table (sortable + Show more/less) for agent #idx.
function hrAgentTableHtml(idx){
  var a=HR_AGENTS[idx]; if(!a) return '';
  var field=a.sortField||'res', dir=a.sortDir||'desc';
  var tix=(a.tickets||[]).slice().sort(function(x,y){
    var vx,vy;
    if(field==='hi'){ vx=+(x.hi||0); vy=+(y.hi||0); }
    else if(field==='resolved'){ vx=new Date(x.resolvedDate||0).getTime()||0; vy=new Date(y.resolvedDate||0).getTime()||0; }
    else { vx=+(x.resHrs||0); vy=+(y.resHrs||0); }
    return dir==='desc'?(vy-vx):(vx-vy);
  });
  var total=tix.length;
  var shown=Math.min(a.shown||HR_PAGE0, total);
  var rows=tix.slice(0,shown).map(function(t){
    var sid=t.shortId||'';
    return '<tr>'+
      '<td class="hr-fit" style="text-align:center"><a class="hr-id" href="https://t.corp.amazon.com/issues/'+esc(sid)+'" target="_blank" rel="noopener">'+(window.icon?window.icon('ticket',13):'')+' '+esc(sid)+'</a></td>'+
      '<td class="hr-cnt">'+(t.hi||0)+'</td>'+
      '<td style="white-space:nowrap;text-align:center">'+fmtDate(t.resolvedDate)+'</td>'+
      '<td style="white-space:nowrap;text-align:center">'+fmtHrs(t.resHrs)+'</td>'+
      '<td class="hr-rc"><span class="hr-rc-wrap">'+statusTag(t.status)+'<span class="hr-rc-txt" title="'+esc(t.rootCause||'Unknown')+'">'+esc(t.rootCause||'Unknown')+'</span></span></td>'+
    '</tr>';
  }).join('');
  var remaining=total-shown;
  var footer='';
  if(total>HR_PAGE0){
    footer='<div class="hr-more">';
    if(remaining>0){ footer+='<button onclick="hrShowMore('+idx+')">\u25be Show more <span class="hr-count">(+'+Math.min(HR_STEP,remaining)+', '+remaining+' left)</span></button>'; }
    if(shown>HR_PAGE0){ footer+='<button onclick="hrShowLess('+idx+')">\u25b4 Show less</button>'; }
    footer+='<span class="hr-count">Showing '+shown+' of '+total+'</span></div>';
  }
  return '<div class="hr-scroll"><table class="hr-tbl"><thead><tr>'+
      '<th class="hr-fit" style="text-align:center">Ticket</th>'+
      '<th class="hr-sort" onclick="hrSort('+idx+',\'hi\')" title="Sort by HI Cnt" style="text-align:center;cursor:pointer">HI Cnt'+hrArrow(a,'hi')+'</th>'+
      '<th class="hr-sort" onclick="hrSort('+idx+',\'resolved\')" title="Sort by Resolved" style="text-align:center;cursor:pointer">Resolved'+hrArrow(a,'resolved')+'</th>'+
      '<th class="hr-sort" onclick="hrSort('+idx+',\'res\')" title="Sort by Resolution time" style="text-align:center;cursor:pointer">Resolution time'+hrArrow(a,'res')+'</th>'+
      '<th>Root cause</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'+footer;
}
function hrRenderAgent(idx){ var el=document.getElementById('hrAgentBody'+idx); if(el)el.innerHTML=hrAgentTableHtml(idx); }
function hrShowMore(idx){ var a=HR_AGENTS[idx]; if(!a)return; a.shown=(a.shown||HR_PAGE0)+HR_STEP; hrRenderAgent(idx); }
function hrShowLess(idx){ var a=HR_AGENTS[idx]; if(!a)return; a.shown=HR_PAGE0; hrRenderAgent(idx); }
function hrSort(idx,field){ var a=HR_AGENTS[idx]; if(!a)return; if(a.sortField===field){a.sortDir=(a.sortDir==='desc'?'asc':'desc');}else{a.sortField=field;a.sortDir='desc';} a.shown=HR_PAGE0; hrRenderAgent(idx); }
window.hrShowMore=hrShowMore; window.hrShowLess=hrShowLess; window.hrSort=hrSort;

function ic(n,s){return window.icon?window.icon(n,s||14):'';}
function agentBlock(a){
  // Register this agent for paginated/sorted rendering; idx addresses it from the buttons.
  const idx=HR_AGENTS.length;
  HR_AGENTS.push({ agent:a.agent, tickets:a.tickets||[], shown:HR_PAGE0, sortField:'res', sortDir:'desc' });
  return '<div class="hr-agent" data-agent="'+esc(String(a.agent).toLowerCase())+'">'+
    '<button type="button" class="hr-agent-head" onclick="hrToggle(this)">'+
      '<span class="hr-agent-name">'+esc(a.agent)+phdTag(a.agent)+'<span class="sub">@'+esc(a.agent)+'</span></span>'+
      '<span class="hr-agent-meta"><span class="hr-agent-pet">'+(window.icon?window.icon('paw',12):'')+' '+a.pet+' pet · '+a.nonPet+' non-pet</span>'+
        '<span class="hr-agent-count">'+a.count+'</span></span>'+
      '<span class="hr-caret" aria-hidden="true">\u25be</span>'+
    '</button>'+
    '<div class="hr-agent-body"><div id="hrAgentBody'+idx+'">'+hrAgentTableHtml(idx)+'</div></div>'+
  '</div>';
}

// Per-range header icon.
const RANGE_ICON={after:'bolt',mid:'clock-rewind',before:'calendar',unknown:'alert',pet:'paw',nonpet:'alert'};
// One date-range section: collapsible (closed by default), colorful border + icon, summary + agents.
// Rebuild a range summary keeping only pet (wantPet=true) or only non-pet tickets. Each agent's
// ticket list is filtered by isPet, counts are recomputed, and agents left with zero are dropped.
// Agents stay ordered by their filtered count (highest first).
function splitByPet(d, wantPet){
  const out=(d.agents||[]).map(function(a){
    const tickets=(a.tickets||[]).filter(function(t){ return !!t.isPet===!!wantPet; });
    return { agent:a.agent, count:tickets.length,
             pet:wantPet?tickets.length:0, nonPet:wantPet?0:tickets.length, tickets:tickets };
  }).filter(function(a){ return a.count>0; })
    .sort(function(x,y){ return y.count-x.count; });
  const totalTickets=out.reduce(function(s,a){ return s+a.count; },0);
  return { agents:out, totalTickets:totalTickets, totalAgents:out.length,
           totalPet:wantPet?totalTickets:0, totalNonPet:wantPet?0:totalTickets };
}

// A nested sub-section: "Incidents handled by PHD agents" / "…Non-PHD agents". Collapsible, with its
// own agent list + inline filter. `skey` is unique per (range, phd) so filters/accordion don't clash.
function subGroup(skey, label, iconName, agents){
  const list=agents.length
    ? agents.map(function(a){return agentBlock(a,skey);}).join('')
    : '<div class="empty">No repeat-incident tickets handled by these agents.</div>';
  const tickets=agents.reduce(function(s,a){return s+a.count;},0);
  const ico=(window.icon?window.icon(iconName,16):'');
  return '<div class="hr-sub">'+
    '<button type="button" class="hr-sub-head" onclick="hrSubToggle(this)">'+
      '<span class="hr-sub-ic">'+ico+'</span>'+
      '<span class="hr-sub-title">'+esc(label)+'</span>'+
      '<span class="hr-sub-meta">'+tickets+' tickets</span>'+
      '<span class="hr-caret" aria-hidden="true">\u25be</span>'+
    '</button>'+
    '<div class="hr-sub-body">'+
      '<div class="hr-list" data-range="'+skey+'">'+list+'</div>'+
    '</div>'+
  '</div>';
}

function rangeSection(key,label,d){
  const agents=d.agents||[];
  // Split the section's agents into PHD (registered with us) and Non-PHD (everyone else).
  const phd=agents.filter(function(a){ return isPhdUser(a.agent); });
  const nonPhd=agents.filter(function(a){ return !isPhdUser(a.agent); });
  const ico=(window.icon?window.icon(RANGE_ICON[key]||'calendar',18):'');
  const body=agents.length
    ? (subGroup(key+'-phd','Incidents handled by PHD agents','user-shield',phd)+
       subGroup(key+'-nonphd','Incidents handled by Non-PHD agents','users',nonPhd))
    : '<div class="empty">No resolved repeat-incident tickets in this range.</div>';
  return '<div class="hr-range rng-'+key+'" data-range="'+key+'">'+
    '<button type="button" class="hr-range-head" onclick="hrRangeToggle(this)">'+
      '<span class="hr-range-ic">'+ico+'</span>'+
      '<span class="hr-range-title">'+esc(label)+'</span>'+
      '<span class="hr-caret" aria-hidden="true">\u25be</span>'+
    '</button>'+
    '<div class="hr-range-body">'+body+'</div>'+
  '</div>';
}
// ================= Page shell: hero + KPI row + three collapsible section cards =================
const CHEV='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let NP_Q='', PT_Q='';            // per-section search text (ticket ID, title, agent, country, root cause)
let HR_LOADED_AT=null;           // when the monthly trend last loaded (shown in the hero chip)
let HR_SUBSEQ=0;                 // unique ids for group expanders (aria-controls)
function $id(id){ return document.getElementById(id); }
function fmtN(n){ return (Number(n)||0).toLocaleString('en-US'); }
// Percentage text: one decimal below 10% (so 0.4% does not read as 0%), whole numbers above.
function pctTxt(n,d){ if(!d) return '0%'; var p=n/d*100; return (p>0&&p<10?p.toFixed(1).replace(/\.0$/,''):String(Math.round(p)))+'%'; }
function hueOf(s){ var h=0; s=String(s||''); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return [24,205,165,265,335,45,190,120][h%8]; }
function announce(msg){ var l=$id('hrxLive'); if(l){ l.textContent=''; setTimeout(function(){ l.textContent=msg; },30); } }
function errMsg(r){
  if(!r) return 'The server didn\u2019t respond. Check your connection and try again.';
  return (r.data&&r.data.error)||('The server returned an error ('+r.status+'). Please try again.');
}

function render(d){
  HR_DATA=d;
  HR_AGENTS=[]; // reset the paginated-agent registry on each full render
  document.getElementById('wrap').innerHTML=
    '<div class="hrx is-anim" id="hrx">'+
      heroHtml()+
      '<div class="hrx-kpis" id="hrxKpis" role="group" aria-label="Headline figures, 2026" aria-busy="true">'+kpiSkeleton()+'</div>'+
      '<p class="hrx-sr" id="hrxLive" role="status" aria-live="polite"></p>'+
      '<div class="hrx-sections">'+
        monthlyChartHtml()+
        nonPetSectionHtml()+
        petSectionHtml()+
      '</div>'+
    '</div>';
  paintListMeta('nonpet'); paintListMeta('pet');
  // No eager render: each section fetches + draws on its first expand (see hiLoad* functions).
  // The chart section is open by default, so init() kicks off hiLoadChart().
}

// ---------- Hero ----------
function heroHtml(){
  return '<header class="hrx-hero"><div class="hrx-hero-in"><div class="hrx-hero-main"><span class="hrx-hero-ic" aria-hidden="true">'+ic('repeat',24)+'</span><div>'+
    '<p class="hrx-eyebrow">Repeat incidents \u00b7 Resolved tickets</p><h1>Resolved Repeat Incidents</h1>'+
    '<p class="hrx-hero-sub">Tickets created each month in 2026 and the resolved tickets that came back as repeat incidents, split into non-pet and pet cases by country, highest HI count and agent.</p>'+
    '</div></div>'+
    '<ul class="hrx-chips" aria-label="Report scope">'+
      '<li class="hrx-chip">'+ic('calendar',14)+'<span>YTD 2026</span></li>'+
      '<li class="hrx-chip">'+ic('check-circle',14)+'<span>Resolved &amp; closed</span></li>'+
      '<li class="hrx-chip" id="hrxUpdated">'+updatedInner()+'</li>'+
    '</ul></div></header>';
}
function fmtClock(d,tz){ try{ return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d); }catch(e){ return ''; } }
function updatedInner(){
  if(HI_CHART_STATE==='error') return ic('alert',14)+'<span>Not loaded</span>';
  if(!HR_LOADED_AT) return ic('clock',14)+'<span class="hrx-skel hrx-skel-d" style="width:110px;height:11px" aria-hidden="true"></span><span class="hrx-sr">Loading</span>';
  return ic('clock',14)+'<span>Loaded '+esc(fmtClock(HR_LOADED_AT,'America/Phoenix'))+' MST \u00b7 '+esc(fmtClock(HR_LOADED_AT,'Asia/Kolkata'))+' IST</span>';
}
function paintUpdated(){ var c=$id('hrxUpdated'); if(!c) return; c.classList.toggle('is-err',HI_CHART_STATE==='error'); c.innerHTML=updatedInner(); }

// ---------- KPIs (rolled up from the monthly series) ----------
function kpiCard(cls,icon,label,value,sub,ratio){
  return '<div class="hrx-kpi '+cls+'"><p class="hrx-kpi-l"><span class="hrx-kpi-ic" aria-hidden="true">'+ic(icon,15)+'</span>'+label+'</p>'+
    '<p class="hrx-kpi-v">'+value+'</p><p class="hrx-kpi-s">'+sub+'</p>'+
    (ratio==null?'':'<div class="hrx-kpi-bar" aria-hidden="true"><i style="width:'+Math.max(0,Math.min(100,ratio*100)).toFixed(1)+'%"></i></div>')+'</div>';
}
function kpiSkeleton(){
  var k='<div class="hrx-kpi" aria-hidden="true"><span class="hrx-skel" style="width:55%;height:11px"></span><span class="hrx-skel" style="width:45%;height:30px;margin-top:14px"></span><span class="hrx-skel" style="width:70%;height:10px;margin-top:10px"></span></div>';
  return k+k+k+k+k;
}
// "Jan – Mar 2026" for the months that have data so far.
function monthsSpan(){
  var months=(HR_MONTHLY&&HR_MONTHLY.months)||[], last=-1;
  months.forEach(function(m,i){ if((m.total||0)>0) last=i; });
  var y=(HR_MONTHLY&&HR_MONTHLY.year)||2026;
  if(last<0) return 'No tickets yet in '+y;
  return (last===0?MONTH_LBL[0]:MONTH_LBL[0]+' \u2013 '+MONTH_LBL[last])+' '+y;
}
function renderKpis(){
  var box=$id('hrxKpis'); if(!box) return;
  var busy=(HI_CHART_STATE==='idle'||HI_CHART_STATE==='loading');
  box.setAttribute('aria-busy',busy?'true':'false');
  if(busy){ box.innerHTML=kpiSkeleton(); return; }
  if(!HR_MONTHLY){

    kpiCard('is-rate','bar-chart','Repeat rate',s.rate.toFixed(1)+'%','Repeat incidents per ticket created',s.rate/100);

// Search + view dispatch shared by both sections. Writes the "N tickets" count next to the toolbar.
function ticketMatches(t,q){
  return (String(t.shortId||'')+' '+(t.title||'')+' '+(t.resolvedBy||'')+' '+(t.country||'')+' '+(NP_COUNTRY_NAME[t.country]||'')+' '+(t.rootCause||'')).toLowerCase().indexOf(q)>=0;
}
function repeatView(all, view, wantPhd, wantNonPhd, query, pfx, kind){
  const q=String(query||'').trim().toLowerCase();
  const list=q?all.filter(function(t){ return ticketMatches(t,q); }):all;
  const cnt=document.getElementById(pfx+'Count');
  if(cnt) cnt.textContent=all.length?(q?fmtN(list.length)+' of '+fmtN(all.length)+' tickets match':fmtN(all.length)+' ticket'+(all.length===1?'':'s')):'';
  if(!all.length) return emptyHtml('check-circle','No '+kind+' repeat incidents','Nothing has come back as a repeat incident in 2026 so far.');
  if(!list.length) return emptyHtml('search','No tickets match \u201c'+esc(String(query).trim())+'\u201d','Try a ticket ID, an agent login, a country code or words from the title.',
    '<button type="button" class="hrx-btn" data-clear-q="'+pfx+'">Clear search</button>');
  if(view==='country') return npByCountry(list, pfx, !!q);
  if(view==='hi')      return npByHi(list);
  return npByAgent(list, wantPhd, wantNonPhd, pfx, !!q);
}

// ---- View 1: By Country — one group per country code (count on the right), expand to a table. ----
// Columns: Ticket · ResolvedBy · HI Count (desc) · Title (truncated) · Root Cause.
function npByCountry(tickets, pfx, openAll){
  const groups={};
  tickets.forEach(function(t){ (groups[t.country]=groups[t.country]||[]).push(t); });
  // Country codes ordered by ticket count (desc).
  const codes=Object.keys(groups).sort(function(a,b){ return groups[b].length-groups[a].length; });
  const max=codes.reduce(function(m,c){ return Math.max(m,groups[c].length); },1);
  return codes.map(function(code){
    const list=groups[code].slice().sort(function(a,b){ return b.hi-a.hi; });
    const rows=list.map(function(t){
      return '<tr>'+
        '<td>'+npIdLink(t)+'</td>'+
        '<td>'+whoHtml(t.resolvedBy)+'</td>'+
        '<td class="np-c">'+hiBadge(t.hi)+'</td>'+
        '<td class="np-title" title="'+esc(t.title)+'">'+esc(t.title)+'</td>'+
        '<td class="np-rc" title="'+esc(t.rootCause)+'">'+esc(t.rootCause)+'</td>'+
      '</tr>';
    }).join('');
    const c=(code&&code!=='undefined')?code:'';
    return groupHtml({ open:openAll, ratio:list.length/max, count:list.length, top:list[0]?list[0].hi:0,
      av:'<span class="hrx-av is-ctry" style="--h:'+hueOf(c)+'" aria-hidden="true">'+esc((c||'?').slice(0,3).toUpperCase())+'</span>',
      name:npCountryLabel(c),
      table:tableWrap('Tickets for '+(NP_COUNTRY_NAME[c]||c||'unknown country'),[14,18,8,36,24],
        '<th scope="col">Ticket</th><th scope="col">Resolved By</th><th scope="col" class="np-c">HI</th><th scope="col">Title</th><th scope="col">Root Cause</th>',rows) });
  }).join('');
}

// ---- View 2: By Highest HI count — one flat table, HI desc. ----
// Columns: Ticket · HI Count (desc) · Country · ResolvedBy · Title (truncated) · Root Cause.
function npByHi(tickets){
  const list=tickets.slice().sort(function(a,b){ return b.hi-a.hi; });
  return npFlatTable(list);
}

// ---- View 3: By Agents — PHD / Non-PHD checkboxes, one group per agent ordered by volume (desc). ----
// Columns: Ticket · HI Count (desc) · Country · Title (truncated) · Root Cause.
function npByAgent(tickets, wantPhd, wantNonPhd, pfx, openAll){
  // The PHD / Non-PHD checkboxes live in the controls row. Keep tickets whose resolver matches a
  // selected kind (flags passed in so both the Non-Pet and Pet sections can reuse this).
  const filtered=tickets.filter(function(t){
    const isPhd=isPhdUser(t.resolvedBy);
    return (isPhd&&wantPhd)||(!isPhd&&wantNonPhd);
  });
  // Agents who handled the most appear first; within an agent, HI desc.
  const perAgent={};
  filtered.forEach(function(t){ var k=t.resolvedBy||'\u2014'; (perAgent[k]=perAgent[k]||[]).push(t); });
  const agents=Object.keys(perAgent).sort(function(a,b){ return (perAgent[b].length-perAgent[a].length)||a.localeCompare(b); });
  if(!agents.length) return emptyHtml('users','No incidents for the selected analyst type','Tick PHD Analysts or Non-PHD Analysts to see their tickets.');
  const max=agents.reduce(function(m,a){ return Math.max(m,perAgent[a].length); },1);
  return agents.map(function(ag){
    const list=perAgent[ag].sort(function(a,b){ return b.hi-a.hi; });
    const rows=list.map(function(t){
      return '<tr>'+
        '<td>'+npIdLink(t)+'</td>'+
        '<td class="np-c">'+hiBadge(t.hi)+'</td>'+
        '<td>'+ctryChip(t.country)+'</td>'+
        '<td class="np-title" title="'+esc(t.title)+'">'+esc(t.title)+'</td>'+
        '<td class="np-rc" title="'+esc(t.rootCause)+'">'+esc(t.rootCause)+'</td>'+
      '</tr>';
    }).join('');
    return groupHtml({ open:openAll, ratio:list.length/max, count:list.length, top:list[0]?list[0].hi:0,
      av:'<span class="hrx-av" style="--h:'+hueOf(ag)+'" aria-hidden="true">'+esc(String(ag).charAt(0).toUpperCase())+'</span>',
      name:esc(ag), tag:isPhdUser(ag)?'<span class="hrx-phd" title="Registered PHD user">PHD</span>':'',
      table:tableWrap('Tickets resolved by '+ag,[15,8,10,40,27],
        '<th scope="col">Ticket</th><th scope="col" class="np-c">HI</th><th scope="col">Country</th><th scope="col">Title</th><th scope="col">Root Cause</th>',rows) });
  }).join('');
}

// Flat table for the HI view. Columns: Ticket · HI · Country · ResolvedBy · Title · Root Cause.
function npFlatTable(list){
  const rows=list.map(function(t){
    return '<tr>'+
      '<td>'+npIdLink(t)+'</td>'+
      '<td class="np-c">'+hiBadge(t.hi)+'</td>'+
      '<td>'+ctryChip(t.country)+'</td>'+
      '<td>'+whoHtml(t.resolvedBy)+'</td>'+
      '<td class="np-title" title="'+esc(t.title)+'">'+esc(t.title)+'</td>'+
      '<td class="np-rc" title="'+esc(t.rootCause)+'">'+esc(t.rootCause)+'</td>'+
    '</tr>';
  }).join('');
  return tableWrap('Tickets by highest HI count',[13,7,9,17,34,20],
    '<th scope="col">Ticket</th><th scope="col" class="np-c">HI</th><th scope="col">Country</th><th scope="col">Resolved By</th><th scope="col">Title</th><th scope="col">Root Cause</th>',rows);
}

// Roll the monthly series into headline numbers for the KPI row.
function chartStats(){
  var months=(HR_MONTHLY&&HR_MONTHLY.months)||[];
  var total=0, nonPet=0, pet=0, repeat=0, repeatPet=0, repeatNonPet=0;
  months.forEach(function(m){
    total+=m.total||0; nonPet+=m.nonPet||0; pet+=m.pet||0;
    repeatNonPet+=m.repeatNonPet||0; repeatPet+=m.repeatPet||0;
    repeat+=(m.repeatNonPet||0)+(m.repeatPet||0);
  });
  var rate=(total>0)?(repeat/total*100):0;
  return { total:total, nonPet:nonPet, pet:pet, repeat:repeat, rate:rate, repeatPet:repeatPet, repeatNonPet:repeatNonPet };
}
function chartStatsHtml(){
  var s=chartStats();
  var fmt=function(n){ return (n||0).toLocaleString('en-US'); };
  function tile(ic0,cls,val,lbl){ return '<div class="hr-stat '+(cls||'')+'">'+
    '<span class="hr-stat-ic">'+ic(ic0,16)+'</span>'+
    '<span class="hr-stat-body"><span class="hr-stat-n">'+val+'</span><span class="hr-stat-l">'+lbl+'</span></span></div>'; }
  return '<div class="hr-stats">'+
    tile('inbox','combined',fmt(s.total),'Tickets created')+
    tile('alert','nonpet',fmt(s.nonPet),'Non-pet')+
    tile('paw','pet',fmt(s.pet),'Pet')+
    tile('repeat','',fmt(s.repeat),'Repeat incidents')+
    tile('bar-chart','rate',s.rate.toFixed(1)+'%','Repeat rate')+
  '</div>';
}

// Paint the chart body for its current state: skeleton / error / chart.
function paintChart(){
  var body=$id('hrxBody-chart'), box=$id('hicContent'); if(!box) return;
  var st=HI_CHART_STATE;
  if(body) body.setAttribute('aria-busy',st==='loading'?'true':'false');
  var meta=$id('hrxMeta-chart');
  if(meta){ meta.className='hr-range-meta'+(st==='error'?' is-err':'');
    meta.innerHTML=st==='done'&&HR_MONTHLY?fmtN(chartStats().total)+' created':st==='error'?'Not loaded':st==='loading'?'<span class="hrx-skel" style="width:70px;height:10px" aria-hidden="true"></span>':''; }
  if(st==='loading'){ box.innerHTML=hrChartSkeleton(); return; }
  if(st==='error'){ box.innerHTML=errorHtml('chart','Couldn\u2019t load the monthly trend',HI_CHART_ERR); return; }
  box.innerHTML=chartInnerHtml();
  if(HR_MONTHLY) drawMonthlyChart(HR_MONTHLY);
}
function drawMonthlyChart(data){
  const svg=document.getElementById('hrChartSvg'); if(!svg) return;
  const months=(data&&data.months)||[];
  // Only draw Jan..Oct (indices 0..9); keep all 12 x labels on the axis.
  const draw=months.slice(0, CHART_LAST_MONTH);
  // Size the drawing to its box (same as the SLA chart): keep H=320 units for ~300px of height and
  // widen W to the box's real aspect, so the plot fills 100% of the width at the same text size.
  const wrapEl=document.getElementById('hrChartWrap');
  const boxW=(wrapEl&&wrapEl.clientWidth)||920, TARGET_PX_H=300;
  const H=320, W=Math.max(600, Math.round(H*boxW/TARGET_PX_H));
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  const padL=46,padR=20,padT=18,padB=36;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  // Y scale from the combined max (the tallest line), with a little headroom.
  let maxV=0; draw.forEach(function(m){ if(m.total>maxV)maxV=m.total; });
  maxV=Math.max(maxV,1);
  const niceMax=niceCeil(maxV);
  const xAt=function(i){ return padL + (plotW*(i/11)); };           // 12 slots across the full width
  const yAt=function(v){ return padT + plotH - (plotH*(v/niceMax)); };
  // Grid + y labels (5 bands).
  let g='';
  const bands=5;
  for(let b=0;b<=bands;b++){
    const v=Math.round(niceMax*b/bands); const y=yAt(v);
    g+='<line class="grid" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>';
    g+='<text class="axlbl" x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" aria-hidden="true">'+v+'</text>';
  }
  // X axis labels (all 12 months).
  for(let i=0;i<12;i++){
    g+='<text class="axlbl" x="'+xAt(i)+'" y="'+(H-padB+20)+'" text-anchor="middle" aria-hidden="true">'+MONTH_LBL[i]+'</text>';
  }
  g+='<line class="axis" x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'"/>';
  // Build the 3 polylines.
  const seriesPts=function(getter){ return draw.map(function(m,i){ return xAt(i)+','+yAt(getter(m)); }).join(' '); };
  g+='<polyline class="ln combined" points="'+seriesPts(function(m){return m.total;})+'"/>';
  g+='<polyline class="ln nonpet" points="'+seriesPts(function(m){return m.nonPet;})+'"/>';
  g+='<polyline class="ln pet" points="'+seriesPts(function(m){return m.pet;})+'"/>';
  // Hover vertical guide.
  g+='<line class="vline" id="hrChartVLine" y1="'+padT+'" y2="'+(padT+plotH)+'"/>';
  // Points for each series.
  draw.forEach(function(m,i){
    g+='<circle class="pt combined" cx="'+xAt(i)+'" cy="'+yAt(m.total)+'" r="4"/>';
    g+='<circle class="pt nonpet" cx="'+xAt(i)+'" cy="'+yAt(m.nonPet)+'" r="4"/>';
    g+='<circle class="pt pet" cx="'+xAt(i)+'" cy="'+yAt(m.pet)+'" r="4"/>';
  });
  // Value labels on every point. Combined and Non-pet often coincide (few pet tickets), so per month
  // the labels are ordered top->bottom by point height and spaced at least GAP apart (each still sits
  // just above its point when there's room). If the stack runs into the x-axis it shifts up as a group.
  const axisY=padT+plotH, GAP=12, TOP_MIN=padT+8, BOT_MAX=axisY-3;
  const num=function(v){ return Number(v||0).toLocaleString('en-US'); };
  draw.forEach(function(m,i){
    const x=xAt(i);
    const items=[
      {cls:'combined', v:m.total||0},
      {cls:'nonpet',   v:m.nonPet||0},
      {cls:'pet',      v:m.pet||0},
    ].map(function(it){ it.py=yAt(it.v); return it; })
     .sort(function(a,b){ return a.py-b.py; });          // highest point first
    let prev=-Infinity;
    items.forEach(function(it){ it.y=Math.max(it.py-9, TOP_MIN, prev+GAP); prev=it.y; });
    const over=items[items.length-1].y-BOT_MAX;
    if(over>0) items.forEach(function(it){ it.y=Math.max(TOP_MIN, it.y-over); });
    items.forEach(function(it){
      g+='<text class="ptlbl '+it.cls+'" x="'+x+'" y="'+it.y+'" text-anchor="middle" aria-hidden="true">'+num(it.v)+'</text>';
    });
  });
  // Transparent hit columns (one per drawn month) carry the hover — and keyboard focus, each with a
  // full spoken summary of that month.
  const colW=plotW/11;
  const pctOf=function(n,total){ return total? Math.round((n/total)*1000)/10 : 0; };
  draw.forEach(function(m,i){
    const cx=xAt(i), total=m.total||0;
    const lbl=MONTH_LBL[i]+' 2026: '+total+' created, '+(m.nonPet||0)+' non-pet, '+(m.pet||0)+' pet. Repeat incidents: '+
      (m.repeatPet||0)+' pet ('+pctOf(m.repeatPet||0,total)+'%), '+(m.repeatNonPet||0)+' non-pet ('+pctOf(m.repeatNonPet||0,total)+'%).';
    g+='<rect class="hit" data-i="'+i+'" tabindex="0" role="img" aria-label="'+esc(lbl)+'" x="'+(cx-colW/2)+'" y="'+padT+'" width="'+colW+'" height="'+plotH+'"/>';
  });
  svg.innerHTML=g;
  // Wire hover + focus.
  const tip=document.getElementById('hrChartTip');
  const vline=document.getElementById('hrChartVLine');
  const wrap=document.getElementById('hrChartWrap');
  const show=function(rect){
      const i=+rect.getAttribute('data-i'); const m=draw[i]; if(!m) return;
      const total=m.total||0;
      const petPct = pctOf(m.repeatPet||0,total);
      const nonPct = pctOf(m.repeatNonPet||0,total);
      tip.innerHTML=
        '<div class="tt-m">'+MONTH_LBL[i]+' 2026 · '+total+' created</div>'+
        '<div class="tt-row"><span class="k"><i style="background:'+CHART_COL.combined+'"></i>Combined</span><span class="v">'+total+'</span></div>'+
        '<div class="tt-row"><span class="k"><i style="background:'+CHART_COL.nonpet+'"></i>Non-pet</span><span class="v">'+(m.nonPet||0)+'</span></div>'+
        '<div class="tt-row"><span class="k"><i style="background:'+CHART_COL.pet+'"></i>Pet</span><span class="v">'+(m.pet||0)+'</span></div>'+
        '<div class="tt-sep"></div>'+
        '<div class="tt-pct">Repeat incidents (of '+total+' created):</div>'+
        '<div class="tt-row"><span class="k"><i style="background:'+CHART_COL.pet+'"></i>Pet repeat</span><span class="v">'+(m.repeatPet||0)+' | <b>'+petPct+'%</b></span></div>'+
        '<div class="tt-row"><span class="k"><i style="background:'+CHART_COL.nonpet+'"></i>Non-pet repeat</span><span class="v">'+(m.repeatNonPet||0)+' | <b>'+nonPct+'%</b></span></div>';
      // Position the vertical guide + tooltip relative to the wrap box.
      const cx=xAt(i);
      vline.setAttribute('x1',cx); vline.setAttribute('x2',cx); vline.style.visibility='visible';
      // Convert SVG x (0..W) to pixel offset within the responsive wrap.
      const box=svg.getBoundingClientRect();
      const px=(cx/W)*box.width;
      tip.classList.add('show');
      const tipW=tip.offsetWidth||200;
      let left=px+14; if(left+tipW>box.width) left=px-tipW-14; if(left<0) left=4;
      tip.style.left=left+'px'; tip.style.top='8px';
  };
  const hide=function(){ tip.classList.remove('show'); vline.style.visibility='hidden'; };
  svg.querySelectorAll('.hit').forEach(function(rect){
    rect.addEventListener('mouseenter', function(){ show(rect); });
    rect.addEventListener('focus', function(){ show(rect); });
    rect.addEventListener('blur', hide);
  });
  if(!wrap._hrLeave){   // bind once per wrap (drawMonthlyChart re-runs on resize)
    wrap._hrLeave=true;
    wrap.addEventListener('mouseleave', function(){ const t=document.getElementById('hrChartTip'), v=document.getElementById('hrChartVLine'); if(t) t.classList.remove('show'); if(v) v.style.visibility='hidden'; });
  }
}
// Redraw on resize so the chart keeps filling 100% of its box at the new width (debounced).
(function(){
  let tmr=null;
  window.addEventListener('resize', function(){
    clearTimeout(tmr);
    tmr=setTimeout(function(){ if(HR_MONTHLY && document.getElementById('hrChartSvg')) drawMonthlyChart(HR_MONTHLY); }, 150);
  });
})();
// Round up to a "nice" axis maximum (1-2-5 x 10^n).
function niceCeil(v){
  if(v<=5) return 5;
  const exp=Math.floor(Math.log10(v)); const base=Math.pow(10,exp); const f=v/base;
  const nf = f<=1?1 : f<=2?2 : f<=5?5 : 10;
  return nf*base;
}

// Accordion: only one agent open at a time WITHIN a range section.
function hrToggle(btn){
  const s=btn.closest('.hr-agent'); if(!s)return;
  const willOpen=!s.classList.contains('open');
  const scope=s.closest('.hr-range')||document;
  scope.querySelectorAll('.hr-agent.open').forEach(function(o){ if(o!==s) o.classList.remove('open'); });
  s.classList.toggle('open', willOpen);
}
window.hrToggle=hrToggle;
// Open/close one section card (class + aria-expanded + hidden body stay in sync).
function setRangeOpen(s,on){
  s.classList.toggle('open',on);
  var h=s.querySelector('.hr-range-head'); if(h) h.setAttribute('aria-expanded',on?'true':'false');
  var b=s.querySelector('.hr-range-body'); if(b) b.hidden=!on;
}
// Expand/collapse a whole section — accordion: only ONE section open at a time.
function hrRangeToggle(btn){
  const s=btn.closest('.hr-range'); if(!s)return;
  const willOpen=!s.classList.contains('open');
  document.querySelectorAll('.hr-range.open').forEach(function(o){ if(o!==s) setRangeOpen(o,false); });
  setRangeOpen(s,willOpen);
  // Lazy-load: fetch the section's data the FIRST time it is expanded (or again after a failure).
  if(willOpen){
    var r=s.getAttribute('data-range');
    if(r==='chart'){ if(HI_CHART_STATE==='done'&&HR_MONTHLY) drawMonthlyChart(HR_MONTHLY); else hiLoadChart(); }
    else if(r==='nonpet') hiLoadNonPet();
    else if(r==='pet') hiLoadPet();
  }
}
window.hrRangeToggle=hrRangeToggle;

// ---- Lazy-load orchestration: fetch each section's data the FIRST time it is expanded. ----
// States: idle -> loading -> done | error (error: Retry, or re-expanding, fetches again).
var HI_CHART_STATE='idle', HI_NONPET_STATE='idle', HI_PET_STATE='idle';
var HI_CHART_ERR='', HI_NONPET_ERR='', HI_PET_ERR='';
async function hiLoadChart(){
  if(HI_CHART_STATE==='loading'||HI_CHART_STATE==='done') return;
  HI_CHART_STATE='loading'; paintChart(); renderKpis(); paintUpdated();
  announce('Loading the monthly trend\u2026');
  var mr=null;
  try{ mr=await A.api('GET','/api/hi-monthly'); }catch(e){}
  // Session gate: a 401 here bounces home (this replaces the old heavy /api/hi-resolved gate).
  if(mr&&mr.status===401){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  if(mr&&mr.ok&&mr.data&&Array.isArray(mr.data.months)){ HR_MONTHLY=mr.data; HR_LOADED_AT=new Date(); HI_CHART_STATE='done'; announce('Monthly trend loaded.'); }
  else { HI_CHART_ERR=errMsg(mr); HI_CHART_STATE='error'; announce('Couldn\u2019t load the monthly trend. '+HI_CHART_ERR); }
  paintChart(); renderKpis(); paintUpdated();
}
// Paint a Non-Pet / Pet section body for its current state: skeleton / error / content.
function listState(key){ return key==='pet'?HI_PET_STATE:HI_NONPET_STATE; }
function paintListMeta(key){
  var st=listState(key), data=key==='pet'?HR_PET:HR_NONPET, meta=$id('hrxMeta-'+key); if(!meta) return;
  var n=data&&data.tickets?data.tickets.length:0;
  meta.className='hr-range-meta'+(st==='idle'?' is-idle':st==='error'?' is-err':'');
  meta.innerHTML=st==='done'?fmtN(n)+' ticket'+(n===1?'':'s'):st==='error'?'Not loaded':st==='loading'?'<span class="hrx-skel" style="width:70px;height:10px" aria-hidden="true"></span>':'Expand to load';
}
function paintList(key){
  var lp=key==='pet'?'hip':'hin', st=listState(key);
  var stBox=$id(lp+'State'), content=$id(lp+'Content'), body=$id('hrxBody-'+key);
  paintListMeta(key);
  if(body) body.setAttribute('aria-busy',st==='loading'?'true':'false');
  if(!stBox||!content) return;
  if(st==='loading'){ stBox.innerHTML=npSkeleton(6); content.hidden=true; return; }
  if(st==='error'){ stBox.innerHTML=errorHtml(key,'Couldn\u2019t load '+(key==='pet'?'pet':'non-pet')+' repeat incidents',key==='pet'?HI_PET_ERR:HI_NONPET_ERR); content.hidden=true; return; }
  stBox.innerHTML=''; content.hidden=(st!=='done');
  if(st==='done'){ if(key==='pet') renderPetView(); else renderNonPetView(); }
}
async function hiLoadNonPet(){
  if(HI_NONPET_STATE==='loading'||HI_NONPET_STATE==='done') return;
  HI_NONPET_STATE='loading'; paintList('nonpet');
  announce('Loading non-pet repeat incidents\u2026');
  var nr=null;
  try{ nr=await A.api('GET','/api/hi-nonpet'); }catch(e){}
  if(nr&&nr.ok&&nr.data&&Array.isArray(nr.data.tickets)){ HR_NONPET=nr.data; HI_NONPET_STATE='done'; announce(fmtN(nr.data.tickets.length)+' non-pet repeat incidents loaded.'); }
  else { HI_NONPET_ERR=errMsg(nr); HI_NONPET_STATE='error'; announce('Couldn\u2019t load non-pet repeat incidents. '+HI_NONPET_ERR); }
  paintList('nonpet');
}
async function hiLoadPet(){
  if(HI_PET_STATE==='loading'||HI_PET_STATE==='done') return;
  HI_PET_STATE='loading'; paintList('pet');
  announce('Loading pet repeat incidents\u2026');
  var pr=null;
  try{ pr=await A.api('GET','/api/hi-nonpet?pet=1'); }catch(e){}
  if(pr&&pr.ok&&pr.data&&Array.isArray(pr.data.tickets)){ HR_PET=pr.data; HI_PET_STATE='done'; announce(fmtN(pr.data.tickets.length)+' pet repeat incidents loaded.'); }
  else { HI_PET_ERR=errMsg(pr); HI_PET_STATE='error'; announce('Couldn\u2019t load pet repeat incidents. '+HI_PET_ERR); }
  paintList('pet');
}
// Expand/collapse a group row (country / agent) — accordion scoped to its parent section.
function setSubOpen(s,on){
  s.classList.toggle('open',on);
  var h=s.querySelector('.hr-sub-head'); if(h) h.setAttribute('aria-expanded',on?'true':'false');
  var b=s.querySelector('.hr-sub-body'); if(b) b.hidden=!on;
}
function hrSubToggle(btn){
  const s=btn.closest('.hr-sub'); if(!s)return;
  const willOpen=!s.classList.contains('open');
  const scope=s.closest('.hr-range-body')||document;
  scope.querySelectorAll('.hr-sub.open').forEach(function(o){ if(o!==s) setSubOpen(o,false); });
  setSubOpen(s,willOpen);
}
window.hrSubToggle=hrSubToggle;
function hrFilter(inp,key){
  const q=String(inp.value||'').trim().toLowerCase();
  document.querySelectorAll('.hr-list[data-range="'+key+'"] .hr-agent').forEach(function(el){
    el.style.display=(!q||el.getAttribute('data-agent').indexOf(q)>=0)?'':'none';
  });
}
window.hrFilter=hrFilter;

// Retry buttons, "Clear search" buttons and the per-section search boxes (delegated).
document.addEventListener('click',function(ev){
  var t=ev.target; if(!t||!t.closest) return;
  var r=t.closest('[data-retry]');
  if(r){
    var k=r.getAttribute('data-retry');
    if(k==='chart'){ HI_CHART_STATE='idle'; hiLoadChart(); }
    else if(k==='nonpet'){ HI_NONPET_STATE='idle'; hiLoadNonPet(); }
    else if(k==='pet'){ HI_PET_STATE='idle'; hiLoadPet(); }
    var h=$id('hrxHead-'+k); if(h) h.focus();
    return;
  }
  var c=t.closest('[data-clear-q]');
  if(c){
    var p=c.getAttribute('data-clear-q'), inp=$id(p+'Q');
    if(p==='pt'){ PT_Q=''; renderPetView(); } else { NP_Q=''; renderNonPetView(); }
    if(inp){ inp.value=''; inp.focus(); }
  }
});
document.addEventListener('input',function(ev){
  var el=ev.target; if(!el||!el.getAttribute) return;
  var p=el.getAttribute('data-q'); if(!p) return;
  if(p==='pt'){ PT_Q=el.value; renderPetView(); } else { NP_Q=el.value; renderNonPetView(); }
});
(async function init(){
  // Not logged in (or no token) -> send to the home page (same behavior as the guest lockdown).
  if(!A||!A.getUser||!A.getUser()||!A.getToken()){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  // Logged in but lacks access to Repeat Incidents -> home page.
  if(!(A.canViewRepeat&&A.canViewRepeat())){ location.replace('index.html'); return; }
  // Load the registered-user roster (for PHD tags) in the background — don't block the first paint.
  // If a section has already rendered by the time it arrives, repaint it so the PHD tags appear.
  A.api('GET','/api/user-roles').then(function(ru){
    if(ru&&ru.ok&&Array.isArray(ru.data)){ HR_USERS=new Set(ru.data.map(function(u){return String(u.username||'').trim().toLowerCase();}));
      if(HI_NONPET_STATE==='done') renderNonPetView(); if(HI_PET_STATE==='done') renderPetView(); }
  }).catch(function(){ HR_USERS=null; });
  // Paint the three section shells IMMEDIATELY (chart open, non-pet + pet collapsed) so the loader
  // shows right away — do NOT block on any network call here.
  render({});
  // Chart section is open by default -> load it now. Non-pet + pet lazy-load on first expand.
  // The 401 session gate now piggybacks on hiLoadChart()'s /api/hi-monthly call, so we no longer
  // fetch the heavy /api/hi-resolved (122 kB) just for an auth check.
  hiLoadChart();
})();
</script>
