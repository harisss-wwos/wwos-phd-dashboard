<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Anti-FOUC: hide the body until topbar-auth.js injects its CSS + builds the nav rail / profile
     column, so the chrome doesn't flash in on refresh. Cleared by topbar-auth after the chrome
     builds; a failsafe timer clears it if the script never runs (offline) so it can't stay hidden. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<title>Ticket Sanitization · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252;--tl:#44b9d6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.wrap{padding:32px 24px;width:auto;max-width:none;margin:0}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
<!-- ===== Light-theme page styles (loaded last, wins the cascade) ===== -->
<style id="ts-light">
/* Ticket Sanitization — "guided path": the same dark navy hero + orange rule as Home / Errors in Resolved /
   PHD Resolutions, then a linked-resources grid and a vertical numbered stepper (circles joined by a rail).
   Everything is scoped under .ts (a size container, so the layout reacts to the content column width). */
#wrap.wrap{padding-top:0!important;padding-bottom:28px!important}
.ts{--ink:#1b2026;--mut:#5c6773;--line:#e2e6ea;--soft:#f5f6f8;--acc:#ec7211;--acc-bg:#fff3e8;--acc-ink:#9a4100;
  --red:#b42318;--red-bg:#fdecec;--grn:#1a7a43;--grn-bg:#e5f5ec;--info:#1d5a8a;--info-bg:#eaf3fb;--focus:#f0a35a;--navy:#161d2d;
  container-type:inline-size;color:var(--ink)}
.ts button,.ts-modal button{font-family:inherit}
.ts :is(button,a,input,li[tabindex]):focus-visible,.ts-modal :is(button,textarea):focus-visible{outline:3px solid var(--focus,#f0a35a);outline-offset:2px}
.ts-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.ts-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 30px 26px 34px;margin-bottom:16px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.ts-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.ts-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.ts-hero-in{position:relative;display:flex;gap:18px;align-items:flex-start}
.ts-hero-ic{width:50px;height:50px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.ts-hero-txt{min-width:0}
.ts-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:8px}
.ts-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.08;margin:0}
.ts-sub{margin-top:10px;max-width:78ch;font-size:.94em;line-height:1.6;color:rgba(233,237,243,.82)}
.ts-sub b{color:#fff;font-weight:700}
.ts-hero-chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:16px 0 0;padding:0}
.ts-hero-chips li{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;font-size:.76em;font-weight:700;
  color:#e9edf3;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);font-variant-numeric:tabular-nums}
.ts-hero-chips li::before{content:'';width:6px;height:6px;border-radius:50%;background:#ffb26b}
.ts-hero-chips li b{color:#fff;font-weight:800}
.ts-hero-chips li.is-acc{background:rgba(236,114,17,.18);border-color:rgba(236,114,17,.5);color:#ffd2a8}
.ts-hero-chips li.is-skel::before{display:none}

/* ---- Layout: single full-width content column ---- */
.ts-main{display:flex;flex-direction:column;gap:16px;min-width:0}

/* ---- Cards ---- */
.ts-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18);padding:20px 22px;overflow:hidden;scroll-margin-top:90px}
.ts-card::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#ff9f2e,#ec7211)}
.ts-card.is-res::before{background:linear-gradient(90deg,#1f9d57,#7fc79b)}
.ts-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 18px;flex-wrap:wrap;margin-bottom:14px}
.ts-head-t{display:flex;align-items:flex-start;gap:12px;min-width:0;flex:1 1 300px}
.ts-head-ic{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--acc-bg);color:#b5530a}
.is-res .ts-head-ic{background:var(--grn-bg);color:var(--grn)}
.ts-head h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0;font-size:1.2em;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:var(--ink)}
.ts-head h2:focus{outline:none}
.ts-head-p{margin:5px 0 0;color:var(--mut);font-size:.86em;font-weight:600;line-height:1.5}
.ts-count{display:inline-flex;align-items:center;justify-content:center;min-width:28px;padding:2px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line);
  font-size:.66em;font-weight:800;letter-spacing:0;color:#3a4552;font-variant-numeric:tabular-nums}
.ts-mode{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.56em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  background:var(--acc-bg);color:var(--acc-ink);border:1px solid #f7c99c;white-space:nowrap}
.ts-mode::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc)}

/* ---- Linked resources grid ---- */
.ts-res-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.ts-res-item{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#fff,#fafbfc);
  transition:border-color .15s,box-shadow .15s}
.ts-res-item:hover{border-color:#b7e1c8;box-shadow:0 12px 24px -20px rgba(20,30,50,.6)}
.ts-res-ic{width:44px;height:44px;border-radius:11px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--grn-bg);color:var(--grn);border:1px solid #b7e1c8}
.ts-res-txt{flex:1 1 240px;min-width:0}
.ts-res-k{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 3px;font-size:.66em;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--grn)}
.ts-res-k span{padding:1px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--mut);letter-spacing:.6px}
.ts-res-txt h3{margin:0;font-size:1em;font-weight:800;color:var(--ink);letter-spacing:-.1px}
.ts-res-txt p{margin:4px 0 0;color:var(--mut);font-size:.9em;line-height:1.55}
.ts-res-txt p b{color:var(--ink)}
.ts-cta{flex-shrink:0;display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border-radius:9px;background:var(--navy);color:#fff!important;font-weight:800;font-size:.9em;text-decoration:none;
  box-shadow:0 8px 18px -12px rgba(20,30,50,.8);transition:background .15s,transform .1s}
.ts-cta svg{flex-shrink:0;color:#ffb26b;transition:transform .15s}
.ts-cta:hover{background:#0f1420;transform:translateY(-1px)}
.ts-cta:hover svg{transform:translate(2px,-2px)}
.ts-cta:active{transform:none}

/* ---- Callouts ---- */
.ts-callout{display:flex;align-items:flex-start;gap:10px;margin:0 0 16px;padding:10px 13px;border-radius:10px;border:1px solid #c9dff0;background:var(--info-bg);color:#1f3f5c;font-size:.86em;line-height:1.5}
.ts-callout svg{flex-shrink:0;margin-top:1px;color:var(--info)}
.ts-callout b{color:#12324d}
.ts-callout.is-warn{border-color:#f5d48c;background:#fff8e6;color:#6b4a06}
.ts-callout.is-warn svg{color:#b7791f}

/* Buttons */
.ts-copyall,.ts-ibtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;cursor:pointer;border-radius:8px;border:1px solid #d4dade;background:#fff;color:#3a4552;
  transition:border-color .15s,background .15s,color .15s}
.ts-copyall{padding:8px 14px;font-size:.84em}
.ts-copyall:disabled{opacity:.55;cursor:default}
.ts-ibtn{width:32px;height:32px;padding:0}
.ts-ibtn:hover,.ts-copyall:hover:not(:disabled){border-color:#9aa6b1;background:#f5f6f8;color:var(--ink)}
.ts-ibtn.del{border-color:#f1c4c4;color:#c0261a}
.ts-ibtn.del:hover{background:var(--red-bg);border-color:#dc2626;color:#c0261a}
.ts-copyall.copied,.ts-ibtn.copied{border-color:#1f9d57!important;background:var(--grn-bg)!important;color:var(--grn)!important}
.ts-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:none;border-radius:8px;background:var(--navy);color:#f4f3ef!important;font-size:.86em;font-weight:800;cursor:pointer;text-decoration:none;transition:background .15s}
.ts-btn svg{color:#ffb26b}
.ts-btn:hover{background:#0f1420}

/* ---- Stepper ---- */
.ts-steps{list-style:none;margin:0;padding:0}
.ts-step{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:14px;padding-bottom:12px;border-radius:10px;scroll-margin-top:90px}
.ts-step:last-child{padding-bottom:0}
/* Rail joining the circles. */
.ts-step::before{content:'';position:absolute;left:19px;top:40px;bottom:0;width:2px;border-radius:2px;background:linear-gradient(180deg,#f7c99c,#e2e6ea)}
.ts-step:last-child::before{display:none}
.ts-step:focus{outline:none}
.ts-step:focus-visible .ts-step-body{outline:3px solid var(--focus);outline-offset:2px}
.ts-dot{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:2px solid #f3b77f;
  color:var(--acc-ink);font-size:.92em;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 0 0 4px #fff}
.ts-step:first-child .ts-dot{background:linear-gradient(180deg,#ff9f2e,#ec7211);border-color:#ec7211;color:#fff}
.ts-step-body{display:flex;align-items:flex-start;gap:12px;min-width:0;padding:10px 12px 10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;
  transition:border-color .15s,box-shadow .15s,background .15s}
.ts-step:hover .ts-step-body{border-color:#cfd6dd;box-shadow:0 10px 22px -18px rgba(20,30,50,.55)}
.ts-step-txt{flex:1 1 auto;min-width:0;padding-top:1px}
.ts-step-k{display:block;font-size:.66em;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--acc-ink);margin-bottom:2px}
.ts-text{display:block;color:#2a3340;font-size:.94em;font-weight:600;line-height:1.55;overflow-wrap:anywhere}
.ts-step-act{flex-shrink:0;display:inline-flex;align-items:center;gap:6px}
.ts-empty{display:flex;align-items:center;gap:10px;padding:14px;border:1px dashed #d4dade;border-radius:10px;color:var(--mut);font-size:.9em;font-style:italic}

/* Editor add row */
.ts-add-row{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid #eef1f4;flex-wrap:wrap}
.ts-add-row input{flex:1 1 280px;min-width:0;height:40px;padding:0 12px;border:1px solid #d4dce4;border-radius:8px;color:#1b2026;font-size:.9em;font-family:inherit;background:#fff}
.ts-add-row input:focus{outline:none;border-color:#ec7211;box-shadow:0 0 0 3px rgba(236,114,17,.16)}
.ts-err{display:none;align-items:flex-start;gap:8px;margin-top:10px;padding:9px 12px;border-radius:8px;background:var(--red-bg);border:1px solid #f2b8b1;color:var(--red);font-size:.86em;font-weight:700;line-height:1.45}

/* ---- Loading / error states ---- */
.ts-skel{display:block;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:tsShim 1.4s ease infinite}
.ts-skel-d{background:linear-gradient(90deg,rgba(255,255,255,.08) 25%,rgba(255,255,255,.18) 40%,rgba(255,255,255,.08) 60%);background-size:400% 100%}
@keyframes tsShim{0%{background-position:100% 0}100%{background-position:0 0}}
.ts-step.is-skel .ts-dot{border-color:#e2e6ea;background:#f5f6f8}
.ts-step.is-skel:first-child .ts-dot{background:#f5f6f8;border-color:#e2e6ea}
.ts-step.is-skel::before{background:#eef1f4}
.ts-step.is-skel:hover .ts-step-body{border-color:var(--line);box-shadow:none}
.ts-state{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;padding:16px 18px;border-radius:10px;border:1px solid #f2b8b1;background:#fffafa}
.ts-state-ic{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--red-bg);color:var(--red)}
.ts-state.is-info{border-color:var(--line);background:var(--soft)}
.ts-state.is-info .ts-state-ic{background:var(--acc-bg);color:#b5530a}
.ts-state-txt{flex:1 1 240px;min-width:0}
.ts-state-t{margin:0;font-size:1em;font-weight:800;color:var(--ink)}
.ts-state-p{margin:3px 0 0;font-size:.86em;line-height:1.5;color:var(--mut)}
.ts-state .ts-btn{align-self:center}

/* Spinner (inline busy state on modal buttons). */
.ts-spin{display:inline-block;flex-shrink:0;width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:tsSpin .7s linear infinite;vertical-align:-1px}
@keyframes tsSpin{to{transform:rotate(360deg)}}

/* ---- One orchestrated entrance on the first loaded paint ---- */
@keyframes tsUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ts.is-hero-anim .ts-hero{animation:tsUp .45s ease both}
.ts.is-hero-anim .ts-card.is-res{animation:tsUp .45s ease .06s both}
.ts.is-anim .ts-step{animation:tsUp .4s ease both;animation-delay:calc(.1s + var(--i,0) * 40ms)}
@media (prefers-reduced-motion:reduce){
  .ts *,.ts *::before,.ts *::after,.ts-modal *,.ts-modal-bg{animation:none!important;transition:none!important}
}

@container (max-width:520px){
  .ts-step{grid-template-columns:32px minmax(0,1fr);column-gap:10px}
  .ts-dot{width:32px;height:32px;font-size:.84em}
  .ts-step::before{left:15px;top:32px}
  .ts-step-body{flex-wrap:wrap;padding:10px 12px}
  .ts-step-txt{flex-basis:100%}
  .ts-step-act{margin-left:auto}
  .ts-cta{width:100%;justify-content:center}
}
@media (max-width:700px){
  .ts-hero{padding:22px 18px 22px 22px}
  .ts-hero-ic{display:none}
  .ts-hero h1{font-size:1.6em;letter-spacing:-.5px}
  .ts-sub{font-size:.86em}
  .ts-card{padding:18px 14px}
  .ts-head-ic{display:none}
}

/* ---- Edit / delete modal popup ---- */
.ts-modal-bg{position:fixed;inset:0;background:rgba(16,24,38,.55);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
.ts-modal-bg.show{display:flex;animation:tsFade .16s ease-out}
@keyframes tsFade{from{opacity:0}to{opacity:1}}
.ts-modal{--focus:#f0a35a;position:relative;overflow:auto;background:#fff;border:1px solid #e2e6ea;border-radius:12px;width:min(560px,100%);max-height:88vh;padding:22px 22px 18px;color:#1b2026;
  box-shadow:0 28px 70px -24px rgba(16,24,38,.5);animation:tsUp .2s ease-out}
.ts-modal::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#ff9f2e,#ec7211)}
.ts-modal-danger::before{background:linear-gradient(90deg,#d92d20,#f97066)}
.ts-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.ts-modal-head h2{margin:0;color:#1b2026;font-size:1.15em;font-weight:800;letter-spacing:-.2px}
.ts-modal-danger .ts-modal-head h2{color:#b42318}
.ts-modal-x{background:transparent;border:none;color:#5c6773;font-size:1.6em;line-height:1;cursor:pointer;padding:0 6px;border-radius:6px}
.ts-modal-x:hover{color:#1b2026;background:#f5f6f8}
.ts-modal textarea{width:100%;background:#fff;border:1px solid #d4dce4;border-radius:8px;color:#1b2026;font-size:.92em;font-family:inherit;line-height:1.5;padding:11px 13px;resize:vertical;min-height:84px}
.ts-modal textarea:focus{outline:none;border-color:#ec7211;box-shadow:0 0 0 3px rgba(236,114,17,.16)}
.ts-modal-body{color:#2a3340;font-size:.92em;line-height:1.6;margin:0;background:#f7f9fb;border:1px solid #eef1f4;border-radius:8px;padding:12px 14px;word-break:break-word}
.ts-modal-err{display:none;color:#b42318;font-size:.84em;font-weight:700;margin-top:10px}
.ts-modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid #eef1f4}
.ts-mbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;font-family:inherit;font-weight:800;font-size:.86em;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s}
.ts-mbtn.primary{background:#161d2d;color:#fff;border-color:#161d2d}
.ts-mbtn.primary:hover{background:#0f1420}
.ts-mbtn.danger{background:#c0261a;border-color:#c0261a;color:#fff}
.ts-mbtn.danger:hover{background:#a51f15}
.ts-mbtn.sec{background:#fff;border:1px solid #d4dade;color:#2a3340}
.ts-mbtn.sec:hover{background:#f5f6f8}
.ts-mbtn:disabled{opacity:.7;cursor:default}
</style>
</head>
<body data-nav-active="ticket-sanitization" data-back-href="index.html" data-back-label="Home">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<!-- Filled by render() / gate(); starts with the loading skeleton. -->
<div class="wrap" id="wrap"></div>

<!-- Edit-line modal (editors) -->
<div class="ts-modal-bg" id="tsEditModal" onclick="if(event.target===this)tsCloseEdit()">
  <div class="ts-modal" role="dialog" aria-modal="true" aria-labelledby="tsEditTitle">
    <div class="ts-modal-head"><h2 id="tsEditTitle">Edit checklist line</h2><button class="ts-modal-x" type="button" onclick="tsCloseEdit()" aria-label="Close">&times;</button></div>
    <label class="ts-sr" for="tsEditText">Checklist line text</label>
    <textarea id="tsEditText" maxlength="1000" rows="3" placeholder="Checklist line text&hellip;"></textarea>
    <div class="ts-modal-err" id="tsEditErr" role="alert"></div>
    <div class="ts-modal-actions">
      <button class="ts-mbtn sec" type="button" onclick="tsCloseEdit()">Cancel</button>
      <button class="ts-mbtn primary" id="tsEditSave" type="button" onclick="tsEditSave()">Save</button>
    </div>
  </div>
</div>

<!-- Delete-confirm modal (editors) -->
<div class="ts-modal-bg" id="tsDelModal" onclick="if(event.target===this)tsCloseDel()">
  <div class="ts-modal ts-modal-danger" role="dialog" aria-modal="true" aria-labelledby="tsDelTitle">
    <div class="ts-modal-head"><h2 id="tsDelTitle">Delete checklist line?</h2><button class="ts-modal-x" type="button" onclick="tsCloseDel()" aria-label="Close">&times;</button></div>
    <p class="ts-modal-body" id="tsDelBody"></p>
    <div class="ts-modal-actions">
      <button class="ts-mbtn sec" type="button" onclick="tsCloseDel()">Cancel</button>
      <button class="ts-mbtn danger" id="tsDelConfirm" type="button" onclick="tsDelConfirm()">Delete</button>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=216"></script>
<script>
const A=window.PHDAuth;
const ic=(n,s)=>window.icon?window.icon(n,s||18):'';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// The shared SharePoint sheet where each analyst finds their assigned tickets and sanitizes them.
var TS_SHEET_URL='https://amazon-my.sharepoint.com/:x:/r/personal/flofalgu_amazon_com/_layouts/15/doc2.aspx?sourcedoc=%7B1C13EF24-F76D-41A3-A9A4-CE41C2550BA8%7D&file=Book.xlsx&action=editnew&mobileredirect=true';
// Edit access: only these two usernames (case-insensitive). The server enforces the same allow-list.
var TS_EDITORS=['harisss','flofalgu'];
function tsCanEdit(){ var u=A&&A.getUser&&A.getUser(); return !!(u && TS_EDITORS.indexOf(String(u.username||'').toLowerCase())>=0); }

// Glyphs.
var ICO_EXT='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';
var ICO_COPY='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
var ICO_CHK='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
var ICO_EDIT='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
var ICO_DEL='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
var ICO_PLUS='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
var ICO_RETRY='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>';
var ICO_INFO='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';
var ICO_SHEET='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>';
var ICO_LIST='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M4 6h1v4M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>';
var ICO_LINK='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
var SPIN='<span class="ts-spin" aria-hidden="true"></span>';

var TS_ITEMS=[];  // [{id,text,order}]
// View state: LOADING = checklist request in flight; LOAD_ERR = why the last GET failed (error + Retry).
var LOADING=true, LOAD_ERR='', FIRST=true, HERO_FIRST=true, TS_LAST_FOCUS=null;

// One persistent polite live region (outside #wrap, so re-renders never replace it).
function liveEl(){
  var el=document.getElementById('tsLive');
  if(!el){ el=document.createElement('span'); el.id='tsLive'; el.className='ts-sr'; el.setAttribute('aria-live','polite'); el.setAttribute('role','status'); document.body.appendChild(el); }
  return el;
}
function announce(msg){ var live=liveEl(); live.textContent=''; setTimeout(function(){ live.textContent=msg; },30); }

function copyText(text,btn,doneLabel){
  if(doneLabel===undefined) doneLabel='Copied';
  var done=function(ok){
    if(!btn||!ok) return;
    var orig=btn.innerHTML; btn.classList.add('copied');
    btn.innerHTML=ICO_CHK+(doneLabel?'<span>'+doneLabel+'</span>':'');
    announce('Copied');
    setTimeout(function(){ btn.innerHTML=orig; btn.classList.remove('copied'); }, 1300);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){done(true);},function(){copyFallback(text,done);}); }
  else copyFallback(text,done);
}
function copyFallback(text,done){ try{ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.focus(); ta.select(); var ok=document.execCommand('copy'); document.body.removeChild(ta); done(ok); }catch(e){ done(false); } }
function tsCopyAll(btn){ copyText(TS_ITEMS.map(function(x){return x.text;}).join('\n'), btn); }
window.tsCopyAll=tsCopyAll;
function tsCopyOne(i,btn){ var it=TS_ITEMS[i]; if(it) copyText(it.text,btn,''); }
window.tsCopyOne=tsCopyOne;

// ---- Building blocks ----
function heroHtml(editor){
  var n=TS_ITEMS.length;
  var chips=LOADING
    ? '<li class="is-skel" aria-hidden="true"><span class="ts-skel ts-skel-d" style="width:120px;height:10px"></span></li><li class="is-skel" aria-hidden="true"><span class="ts-skel ts-skel-d" style="width:70px;height:10px"></span></li>'
    : (LOAD_ERR?'<li><span>Checklist unavailable \u00b7 <b>1</b> resource</span></li>':'<li><span><b>'+n+'</b> '+(n===1?'step':'steps')+' \u00b7 <b>1</b> resource</span></li>')+
      (editor?'<li class="is-acc">Editor access</li>':'<li>View only</li>');
  return '<header class="ts-hero"><div class="ts-hero-in"><span class="ts-hero-ic" aria-hidden="true">'+ic('check-circle',24)+'</span><div class="ts-hero-txt">'+
    '<p class="ts-eyebrow">Step-by-step guide</p><h1>Ticket Sanitization</h1>'+
    '<p class="ts-sub">Open the shared sheet, find <b>your assigned tickets</b>, then work through the <b>sanitization checklist</b> below for each one.</p>'+
    '<ul class="ts-hero-chips" aria-label="Summary">'+chips+'</ul>'+
  '</div></div></header>';
}

function resourcesHtml(){
  return '<section class="ts-card is-res" id="tsRes" aria-labelledby="tsResHead">'+
    '<div class="ts-head"><div class="ts-head-t"><span class="ts-head-ic" aria-hidden="true">'+ICO_LINK+'</span><div>'+
      '<h2 id="tsResHead">Linked resources</h2><p class="ts-head-p">Start here \u2014 opens in a new tab.</p></div></div></div>'+
    '<ul class="ts-res-grid">'+
      '<li class="ts-res-item">'+
        '<span class="ts-res-ic" aria-hidden="true">'+ICO_SHEET+'</span>'+
        '<div class="ts-res-txt"><p class="ts-res-k">Shared sheet<span>SharePoint \u00b7 Excel</span></p>'+
          '<h3>Assigned tickets sheet</h3>'+
          '<p>Use the link below to open the shared sheet, find <b>your assigned tickets</b>, and <b>sanitize</b> them.</p></div>'+
        '<a class="ts-cta" href="'+esc(TS_SHEET_URL)+'" target="_blank" rel="noopener">Link'+ICO_EXT+'<span class="ts-sr"> (opens the assigned tickets sheet in a new tab)</span></a>'+
      '</li>'+
    '</ul></section>';
}

function skeletonSteps(){
  var w=[72,84,60,78,88,66], s='';
  for(var i=0;i<w.length;i++){
    s+='<li class="ts-step is-skel" aria-hidden="true"><span class="ts-dot"></span>'+
      '<div class="ts-step-body"><div class="ts-step-txt"><span class="ts-skel" style="width:44px;height:9px;margin:3px 0 8px"></span><span class="ts-skel" style="width:'+w[i]+'%;height:12px"></span></div>'+
      '<span class="ts-skel" style="width:32px;height:32px;border-radius:8px"></span></div></li>';
  }
  return s;
}

function stepsHtml(editor,anim){
  if(LOADING) return '<ol class="ts-steps" aria-hidden="true">'+skeletonSteps()+'</ol>';
  if(LOAD_ERR) return '<div class="ts-state" role="alert"><span class="ts-state-ic" aria-hidden="true">'+ic('alert-triangle',20)+'</span><div class="ts-state-txt">'+
      '<p class="ts-state-t">Couldn\u2019t load the checklist</p><p class="ts-state-p">'+esc(LOAD_ERR)+' The shared sheet link above still works.</p></div>'+
      '<button type="button" class="ts-btn" id="tsRetry" onclick="tsRetry()">'+ICO_RETRY+'<span>Retry</span></button></div>';
  if(!TS_ITEMS.length) return '<div class="ts-empty">'+ICO_INFO+'No checklist lines yet.</div>';
  return '<ol class="ts-steps">'+TS_ITEMS.map(function(it,i){
    return '<li class="ts-step" id="tsItem'+i+'" tabindex="-1"'+(anim?' style="--i:'+Math.min(i,14)+'"':'')+'>'+
      '<span class="ts-dot" aria-hidden="true">'+(i+1)+'</span>'+
      '<div class="ts-step-body">'+
        '<div class="ts-step-txt"><span class="ts-step-k">Step '+(i+1)+'</span><span class="ts-text">'+esc(it.text)+'</span></div>'+
        '<span class="ts-step-act">'+
          '<button class="ts-ibtn" type="button" title="Copy step" aria-label="Copy step '+(i+1)+'" onclick="tsCopyOne('+i+',this)">'+ICO_COPY+'</button>'+
          (editor?('<button class="ts-ibtn edit" type="button" title="Edit line" aria-label="Edit step '+(i+1)+'" onclick="tsEdit('+i+')">'+ICO_EDIT+'</button>'+
            '<button class="ts-ibtn del" type="button" title="Delete line" aria-label="Delete step '+(i+1)+'" onclick="tsDelete('+i+')">'+ICO_DEL+'</button>'):'')+
        '</span>'+
      '</div></li>';
  }).join('')+'</ol>';
}

function render(){
  var editor=tsCanEdit(), n=TS_ITEMS.length;
  var anim=FIRST&&!LOADING&&!LOAD_ERR; if(anim) FIRST=false;
  var heroAnim=HERO_FIRST; HERO_FIRST=false;
  var ready=!LOADING&&!LOAD_ERR;
  var html='<div class="ts'+(anim?' is-anim':'')+(heroAnim?' is-hero-anim':'')+'">'+
    heroHtml(editor)+
    '<div class="ts-main">'+
      resourcesHtml()+
      '<section class="ts-card" id="tsGuide" aria-labelledby="tsStepsHead" aria-busy="'+(LOADING?'true':'false')+'">'+
        '<div class="ts-head"><div class="ts-head-t"><span class="ts-head-ic" aria-hidden="true">'+ICO_LIST+'</span><div>'+
          '<h2 id="tsStepsHead" tabindex="-1">Sanitization checklist'+(ready?'<span class="ts-count"><span class="ts-sr">(</span>'+n+'<span class="ts-sr"> steps)</span></span>':'')+
            (ready&&editor?'<span class="ts-mode">Editor</span>':'')+'</h2>'+
          '<p class="ts-head-p">Work through each step in order for every assigned ticket.</p></div></div>'+
          '<button class="ts-copyall" type="button" onclick="tsCopyAll(this)"'+(ready&&n?'':' disabled')+'>'+ICO_COPY+'<span>Copy all</span></button>'+
        '</div>'+
        (ready&&n?'<p class="ts-callout">'+ICO_INFO+'<span>Use the <b>copy</b> button on a step to paste that line, or <b>Copy all</b> to paste the full checklist.</span></p>':'')+
        stepsHtml(editor,anim)+
        (ready&&editor?('<div class="ts-add-row"><label class="ts-sr" for="tsNewLine">New checklist line</label><input type="text" id="tsNewLine" maxlength="1000" placeholder="Add a new checklist line\u2026" onkeydown="if(event.key===\'Enter\')tsAdd();">'+
          '<button class="ts-btn" type="button" onclick="tsAdd()">'+ICO_PLUS+'<span>Add line</span></button></div>'+
          '<div class="ts-err" id="tsErr" role="alert"></div>'):'')+
      '</section>'+
    '</div></div>';
  document.getElementById('wrap').innerHTML=html;
}

function tsErr(msg){ var e=document.getElementById('tsErr'); if(e){ e.textContent=msg||''; e.style.display=msg?'flex':'none'; } }

async function loadChecklist(fromRetry){
  LOADING=true; LOAD_ERR=''; render();
  announce('Loading the sanitization checklist\u2026');
  var r=null;
  try{ r=await A.api('GET','/api/sanitization-checklist'); }catch(e){ r=null; }
  LOADING=false;
  if(r&&r.ok&&r.data&&Array.isArray(r.data.items)){ TS_ITEMS=r.data.items; }
  else LOAD_ERR=r?('Could not load the checklist (HTTP '+(r.status||'?')+').'):'Could not load the checklist \u2014 network error.';
  render();
  if(LOAD_ERR){
    announce('Couldn\u2019t load the checklist.');
    if(fromRetry){ var rb=document.getElementById('tsRetry'); if(rb) rb.focus(); }
  } else {
    announce('Loaded '+TS_ITEMS.length+' checklist '+(TS_ITEMS.length===1?'step':'steps')+'.');
    if(fromRetry){ var h=document.getElementById('tsStepsHead'); if(h) h.focus(); }
  }
}
function tsRetry(){ loadChecklist(true); }
window.tsRetry=tsRetry;

async function tsAdd(){
  if(!tsCanEdit()) return;
  var inp=document.getElementById('tsNewLine'); if(!inp) return;
  var text=String(inp.value||'').trim(); if(!text){ tsErr('Enter a line first.'); inp.focus(); return; }
  tsErr('');
  var r=await A.api('POST','/api/sanitization-checklist',{text:text});
  if(r&&r.ok){ inp.value=''; await loadChecklist(); var ni=document.getElementById('tsNewLine'); if(ni) ni.focus(); }
  else tsErr((r&&r.data&&r.data.error)||('Add failed (HTTP '+(r?r.status:'?')+').'));
}
window.tsAdd=tsAdd;

// ---- Edit via in-page modal (replaces window.prompt) ----
var TS_EDIT_ID=null, TS_DEL_ID=null;
function tsModalErr(id,msg){ var e=document.getElementById(id); if(e){ e.textContent=msg||''; e.style.display=msg?'block':'none'; } }
function tsRestoreFocus(){ var f=TS_LAST_FOCUS; TS_LAST_FOCUS=null; if(f&&document.body.contains(f)) f.focus(); }

function tsEdit(i){
  if(!tsCanEdit()) return;
  var it=TS_ITEMS[i]; if(!it) return;
  TS_EDIT_ID=it.id; TS_LAST_FOCUS=document.activeElement;
  var ta=document.getElementById('tsEditText'); ta.value=it.text;
  tsModalErr('tsEditErr','');
  document.getElementById('tsEditModal').classList.add('show');
  setTimeout(function(){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); },40);
}
window.tsEdit=tsEdit;
function tsCloseEdit(){ var m=document.getElementById('tsEditModal'); var open=m.classList.contains('show'); m.classList.remove('show'); TS_EDIT_ID=null; if(open) tsRestoreFocus(); }
window.tsCloseEdit=tsCloseEdit;
async function tsEditSave(){
  if(!tsCanEdit()||!TS_EDIT_ID) return;
  var text=String(document.getElementById('tsEditText').value||'').trim();
  if(!text){ tsModalErr('tsEditErr','Line cannot be empty.'); return; }
  var btn=document.getElementById('tsEditSave'); btn.disabled=true; btn.innerHTML=SPIN+'<span>Saving\u2026</span>';
  var r=await A.api('PUT','/api/sanitization-checklist/'+TS_EDIT_ID,{text:text});
  btn.disabled=false; btn.textContent='Save';
  if(r&&r.ok){ TS_LAST_FOCUS=null; tsCloseEdit(); await loadChecklist(); announce('Checklist line saved.'); }
  else tsModalErr('tsEditErr',(r&&r.data&&r.data.error)||('Save failed (HTTP '+(r?r.status:'?')+').'));
}
window.tsEditSave=tsEditSave;

function tsDelete(i){
  if(!tsCanEdit()) return;
  var it=TS_ITEMS[i]; if(!it) return;
  TS_DEL_ID=it.id; TS_LAST_FOCUS=document.activeElement;
  document.getElementById('tsDelBody').textContent=it.text;
  document.getElementById('tsDelModal').classList.add('show');
  setTimeout(function(){ var b=document.getElementById('tsDelConfirm'); if(b) b.focus(); },40);
}
window.tsDelete=tsDelete;
function tsCloseDel(){ var m=document.getElementById('tsDelModal'); var open=m.classList.contains('show'); m.classList.remove('show'); TS_DEL_ID=null; if(open) tsRestoreFocus(); }
window.tsCloseDel=tsCloseDel;
async function tsDelConfirm(){
  if(!tsCanEdit()||!TS_DEL_ID) return;
  var btn=document.getElementById('tsDelConfirm'); btn.disabled=true; btn.innerHTML=SPIN+'<span>Deleting\u2026</span>';
  var r=await A.api('DELETE','/api/sanitization-checklist/'+TS_DEL_ID);
  btn.disabled=false; btn.textContent='Delete';
  TS_LAST_FOCUS=null;
  if(r&&r.ok){ tsCloseDel(); await loadChecklist(); announce('Checklist line deleted.'); }
  else { tsCloseDel(); tsErr((r&&r.data&&r.data.error)||('Delete failed (HTTP '+(r?r.status:'?')+').')); }
}
window.tsDelConfirm=tsDelConfirm;

// Not logged in: hero + a friendly notice (no checklist request, which would 401).
function gate(msg){
  LOADING=false;
  document.getElementById('wrap').innerHTML='<div class="ts is-hero-anim">'+
    '<header class="ts-hero"><div class="ts-hero-in"><span class="ts-hero-ic" aria-hidden="true">'+ic('check-circle',24)+'</span><div class="ts-hero-txt">'+
      '<p class="ts-eyebrow">Step-by-step guide</p><h1>Ticket Sanitization</h1></div></div></header>'+
    '<section class="ts-card"><div class="ts-state is-info"><span class="ts-state-ic" aria-hidden="true">'+ic('alert-triangle',20)+'</span><div class="ts-state-txt">'+
      '<p class="ts-state-t">Login required</p><p class="ts-state-p">'+esc(msg)+'</p></div>'+
      '<a class="ts-btn" href="app.html">Back to the live dashboard</a></div></section></div>';
}

// Esc closes whichever modal is open.
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ tsCloseEdit(); tsCloseDel(); } });

// Any logged-in user can view/copy. Only harisss/flofalgu see edit controls (server enforces too).
(function(){
  if(!(A&&A.getUser&&A.getUser())){ gate('This page is for logged-in users. Log in from the Live Dashboard first.'); return; }
  loadChecklist();
})();
</script>
</body>
</html>
