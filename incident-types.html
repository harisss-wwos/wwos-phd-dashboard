<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incident Types (owner tool) · WWOS-GSOC PHD</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252;--tl:#44b9d6;--yl:#fbbf24;--pl:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:26px;width:auto;display:block}
.logo span{font-size:1.05em;font-weight:700;color:#fff}
.wrap{width:92%;max-width:1400px;margin:0 auto;padding:34px 20px}
h1{color:#fff;font-size:1.6em;margin-bottom:6px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:8px;line-height:1.5}
.warn-banner{background:rgba(255,153,0,.1);border:1px solid rgba(255,153,0,.35);color:var(--o);border-radius:8px;padding:10px 14px;font-size:.82em;margin:14px 0 22px;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;background:transparent;color:var(--o);border:1px solid var(--o);border-radius:6px;font-weight:600;font-size:.85em;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,153,0,.12)}
.btn.sec{color:var(--o);border-color:var(--bd)}
.btn.sec:hover{border-color:var(--o);background:rgba(255,153,0,.1)}
.btn.primary{background:var(--o);color:#000}
.btn.primary:hover{background:var(--oh)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--rl);border-color:rgba(255,82,82,.4)}
.btn.danger:hover{background:rgba(255,82,82,.12)}
.gate{text-align:center;padding:70px 0}.gate p{color:var(--tm);margin-bottom:18px}
.spinner{width:42px;height:42px;border:4px solid var(--bd);border-top-color:var(--o);border-radius:50%;animation:spin 1s linear infinite;margin:60px auto}
@keyframes spin{100%{transform:rotate(360deg)}}
/* Two-column layout: source list (left) + groups editor (right). Preview below. */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.card{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;padding:18px 18px}
.card h2{color:var(--o);font-size:.9em;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.card .hint{color:#5f6b6c;font-size:.78em;margin-bottom:12px}
/* Source raw-type list */
.src-tools{display:flex;gap:8px;margin-bottom:10px}
.src-tools input{flex:1;background:#000;border:1px solid var(--bd);border-radius:6px;color:#fff;font-size:.85em;padding:8px 10px}
.src-tools input:focus{outline:none;border-color:var(--o)}
.src-list{max-height:440px;overflow:auto;border:1px solid #1b2530;border-radius:8px}
.src-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;font-size:.86em}
.src-row:last-child{border-bottom:none}
.src-row:hover{background:rgba(255,255,255,.03)}
.src-row.assigned{opacity:.5}
.src-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--o);flex-shrink:0}
.src-row .st-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.src-row .st-count{color:var(--tm);font-variant-numeric:tabular-nums;font-size:.9em}
.src-row .st-in{color:var(--pl);font-size:.72em;font-weight:700;white-space:nowrap}
.assign-bar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.assign-bar select{flex:1;min-width:140px;background:#000;border:1px solid var(--bd);border-radius:6px;color:#fff;font-size:.85em;padding:8px 10px}
/* Groups editor */
.grp{border:1px solid #1b2530;border-radius:8px;padding:12px 14px;margin-bottom:12px;background:#000}
.grp-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.grp-head input{flex:1;background:#0a0a0a;border:1px solid var(--bd);border-radius:6px;color:#fff;font-weight:600;font-size:.9em;padding:8px 10px}
.grp-head input:focus{outline:none;border-color:var(--o)}
.grp-members{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4);color:var(--pl);border-radius:20px;padding:3px 10px;font-size:.76em}
.chip button{background:none;border:none;color:var(--pl);cursor:pointer;font-size:1.1em;line-height:1;padding:0}
.grp-empty{color:#5f6b6c;font-size:.78em;font-style:italic}
.new-grp{display:flex;gap:8px;margin-top:6px}
.new-grp input{flex:1;background:#000;border:1px solid var(--bd);border-radius:6px;color:#fff;font-size:.85em;padding:8px 10px}
.new-grp input:focus{outline:none;border-color:var(--o)}
/* Preview */
.preview{margin-top:24px}
.inc-sub-h{display:flex;align-items:center;gap:8px;font-size:.95em;font-weight:700;color:#d5dbdb;margin:14px 0 8px}
.inc-sub-h .n{font-weight:800;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;font-size:.85em}
table{width:100%;border-collapse:collapse;font-size:.86em}
.xls-table{border:1px solid #2f3a45}
.xls-table th,.xls-table td{border:1px solid #2f3a45;padding:7px 11px}
th{color:var(--tm);text-transform:uppercase;letter-spacing:.4px;font-size:.78em;text-align:left}
.grouped-row{background:rgba(167,139,250,.08)}
.grouped-row td:nth-child(2){color:var(--pl);font-weight:700}
.actions-bar{display:flex;gap:10px;align-items:center;margin:20px 0;flex-wrap:wrap}
.msg{font-size:.85em;display:none}
.msg.err{color:var(--rl)}.msg.ok{color:var(--gl)}
.bar-cell{display:flex;align-items:center}
.bar-cell>div{height:8px;border-radius:4px;background:#ff9900;min-width:4px}
</style>
</head>
<body>
<div class="top-bar">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>Incident Types — grouping tool</span></a>
  <a class="btn sec" href="app.html">Live Dashboard</a>
</div>
<div class="wrap" id="wrap">
  <div class="spinner"></div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script>
const A=window.PHDAuth;
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isOwner=()=>A.role&&A.role()==='owner';

let RAW=[];        // [{type,count}] raw incident-type labels for the live quarter
let GROUPS=[];     // [{name, members:[rawType]}] working copy
let VERSION=0;     // last-loaded server version
let SEL=new Set(); // currently-checked raw types in the source list
let FILTER='';

function gate(msg){document.getElementById('wrap').innerHTML='<div class="gate"><h1>Incident Types</h1><p>'+esc(msg)+'</p><a class="btn" href="index.html">Go to Home</a></div>';}

// lowercased raw type -> group name (for "assigned" markers + preview relabel).
function memberIndex(){
  const idx={};
  GROUPS.forEach(g=>{ (g.members||[]).forEach(m=>{ idx[m]=g.name; }); });
  return idx;
}

async function boot(){
  if(!A.getUser()||!A.getToken()){gate('Please log in to use this tool.');return;}
  if(!isOwner()){gate('This tool is for the owner only.');return;}
  try{
    const [rawR,grpR]=await Promise.all([
      A.api('GET','/api/incident-types/raw'),
      A.api('GET','/api/incident-groups'),
    ]);
    if(!rawR.ok){gate('Could not load incident types (HTTP '+rawR.status+').');return;}
    RAW=(rawR.data&&rawR.data.types)||[];
    GROUPS=((grpR.ok&&grpR.data&&grpR.data.groups)||[]).map(g=>({name:g.name,members:(g.members||[]).slice()}));
    VERSION=(grpR.ok&&grpR.data&&grpR.data.version)||0;
    render();
  }catch(e){gate('Could not load the tool. '+esc(e.message||''));}
}

function render(){
  const wrap=document.getElementById('wrap');
  wrap.innerHTML=`
    <h1>Incident Types — grouping tool</h1>
    <p class="sub">Combine multiple raw incident types (root causes) into one display name. This only relabels what everyone sees on the dashboard's Incident Types section — the underlying ticket data is never changed. Publish to make it live for all users.</p>
    <div class="warn-banner">${ic('alert',15)} Owner-only. This page isn't linked anywhere. Changes go live for everyone only when you click <b>&nbsp;Publish</b>.</div>

    <div class="actions-bar">
      <button class="btn primary" id="publishBtn" onclick="publish()">${ic('check-circle',15)} Publish (v${VERSION} &rarr; v${VERSION+1})</button>
      <button class="btn sec" onclick="reloadFromServer()">${ic('refresh',15)} Reload saved</button>
      <button class="btn danger" onclick="clearAll()">Clear all groups</button>
      <span class="msg err" id="err"></span><span class="msg ok" id="ok"></span>
    </div>

    <div class="cols">
      <div class="card">
        <h2>Raw incident types (live quarter)</h2>
        <div class="hint">These are the exact labels the dashboard buckets by. Check the ones to combine, then assign them to a group.</div>
        <div class="src-tools"><input id="srcFilter" placeholder="Filter…" oninput="onFilter(this.value)" value="${esc(FILTER)}"></div>
        <div class="src-list" id="srcList"></div>
        <div class="assign-bar">
          <select id="assignTarget"></select>
          <button class="btn" onclick="assignSelected()">Add checked &rarr;</button>
        </div>
      </div>

      <div class="card">
        <h2>Groups</h2>
        <div class="hint">Each group becomes one row on the dashboard. Unassigned types keep their original name.</div>
        <div id="grpList"></div>
        <div class="new-grp">
          <input id="newGrpName" placeholder="New group name (e.g. Pet Incidents)" onkeydown="if(event.key==='Enter')addGroup()">
          <button class="btn" onclick="addGroup()">${ic('plus',14)} Add group</button>
        </div>
      </div>
    </div>

    <div class="preview">
      <h2 style="color:var(--o);font-size:.95em;text-transform:uppercase;letter-spacing:.5px">Preview</h2>
      <p class="hint" style="color:#5f6b6c;font-size:.8em;margin-bottom:6px">How the combined Incident Types list will look (overall, all resolved+unresolved this quarter). Grouped rows are highlighted.</p>
      <div id="previewBox"></div>
    </div>`;
  paintSourceList();
  paintGroups();
  paintPreview();
}

function onFilter(v){ FILTER=v; paintSourceList(); }

function paintSourceList(){
  const idx=memberIndex();
  const f=FILTER.trim().toLowerCase();
  const rows=RAW.filter(r=>!f||r.type.toLowerCase().includes(f)).map(r=>{
    const inGrp=idx[r.type];
    const checked=SEL.has(r.type)?' checked':'';
    return '<label class="src-row'+(inGrp?' assigned':'')+'">'+
      '<input type="checkbox" data-t="'+esc(r.type)+'"'+checked+' onchange="toggleSel(this)">'+
      '<span class="st-name" title="'+esc(r.type)+'">'+esc(r.type)+'</span>'+
      (inGrp?'<span class="st-in">in: '+esc(inGrp)+'</span>':'')+
      '<span class="st-count">'+r.count.toLocaleString()+'</span>'+
    '</label>';
  }).join('');
  document.getElementById('srcList').innerHTML=rows||'<div style="padding:14px;color:#5f6b6c;font-size:.82em">No matching types.</div>';
  // Refresh the assign-target dropdown.
  const sel=document.getElementById('assignTarget');
  sel.innerHTML=GROUPS.length?GROUPS.map((g,i)=>'<option value="'+i+'">'+esc(g.name)+'</option>').join(''):'<option value="">(create a group first)</option>';
}

function toggleSel(cb){ const t=cb.getAttribute('data-t'); if(cb.checked)SEL.add(t); else SEL.delete(t); }

function addGroup(){
  const inp=document.getElementById('newGrpName');
  const name=inp.value.trim();
  if(!name)return;
  if(GROUPS.some(g=>g.name.toLowerCase()===name.toLowerCase())){flash('err','A group with that name already exists.');return;}
  GROUPS.push({name,members:[]});
  inp.value='';
  paintGroups();paintSourceList();paintPreview();
}

function assignSelected(){
  const sel=document.getElementById('assignTarget');
  const gi=parseInt(sel.value);
  if(isNaN(gi)||!GROUPS[gi]){flash('err','Create a group first, then assign.');return;}
  const idx=memberIndex();
  let added=0;
  SEL.forEach(t=>{
    // Remove from any other group first (a type belongs to at most one group).
    GROUPS.forEach(g=>{const p=g.members.indexOf(t);if(p>=0)g.members.splice(p,1);});
    if(!GROUPS[gi].members.includes(t)){GROUPS[gi].members.push(t);added++;}
  });
  SEL.clear();
  flash('ok',added+' type'+(added===1?'':'s')+' added to "'+GROUPS[gi].name+'".');
  paintGroups();paintSourceList();paintPreview();
}

function renameGroup(i,val){ if(GROUPS[i]){GROUPS[i].name=val; paintSourceList();paintPreview();} }
function removeMember(i,t){ if(GROUPS[i]){GROUPS[i].members=GROUPS[i].members.filter(m=>m!==t); paintGroups();paintSourceList();paintPreview();} }
function removeGroup(i){ GROUPS.splice(i,1); paintGroups();paintSourceList();paintPreview(); }
function clearAll(){ if(!GROUPS.length)return; if(!confirm('Remove all groups? (Not published until you click Publish.)'))return; GROUPS=[]; paintGroups();paintSourceList();paintPreview(); }

function paintGroups(){
  const box=document.getElementById('grpList');
  if(!GROUPS.length){box.innerHTML='<div class="grp-empty">No groups yet. Add one on the right, then assign types from the left.</div>';return;}
  box.innerHTML=GROUPS.map((g,i)=>{
    const chips=g.members.length?g.members.map(m=>'<span class="chip">'+esc(m)+'<button title="Remove" onclick="removeMember('+i+',\''+m.replace(/'/g,"\\'")+'\')">&times;</button></span>').join(''):'<span class="grp-empty">No types yet — check some on the left and click "Add checked".</span>';
    return '<div class="grp">'+
      '<div class="grp-head"><input value="'+esc(g.name)+'" oninput="renameGroup('+i+',this.value)"><button class="btn danger" style="padding:6px 10px" onclick="removeGroup('+i+')">Delete</button></div>'+
      '<div class="grp-members">'+chips+'</div>'+
    '</div>';
  }).join('');
}

// Build the combined preview from RAW + GROUPS (mirrors the server relabel).
function paintPreview(){
  const idx=memberIndex();
  const m={};let tot=0;
  RAW.forEach(r=>{ const name=idx[r.type]||r.type; m[name]=(m[name]||0)+r.count; tot+=r.count; });
  const grouped=new Set(GROUPS.map(g=>g.name));
  const list=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  const max=list.length?list[0][1]:1;
  const rows=list.map(([type,count],i)=>{
    const isG=grouped.has(type);
    return '<tr'+(isG?' class="grouped-row"':'')+'><td style="text-align:center;color:#ff9900;font-weight:700">'+(i+1)+'</td>'+
      '<td>'+esc(type)+(isG?' <span style="color:var(--pl);font-size:.7em;font-weight:700">(grouped)</span>':'')+'</td>'+
      '<td style="text-align:center">'+count.toLocaleString()+'</td>'+
      '<td style="text-align:center">'+(tot?(count/tot*100).toFixed(1):0)+'%</td>'+
      '<td><div class="bar-cell"><div style="width:'+(count/max*100).toFixed(0)+'%"></div></div></td></tr>';
  }).join('');
  document.getElementById('previewBox').innerHTML=
    '<div style="overflow-x:auto"><table class="xls-table"><thead><tr><th style="text-align:center">#</th><th>Incident Type</th><th style="text-align:center">Count</th><th style="text-align:center">% of Total</th><th>Volume</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

async function publish(){
  const btn=document.getElementById('publishBtn');
  // Client-side validation mirrors the server.
  const seen={};
  for(const g of GROUPS){
    if(!g.name.trim()){flash('err','Every group needs a name.');return;}
    for(const mmb of g.members){ if(seen[mmb]){flash('err','"'+mmb+'" is in more than one group.');return;} seen[mmb]=true; }
  }
  const groups=GROUPS.filter(g=>g.members.length).map(g=>({name:g.name.trim(),members:g.members}));
  btn.disabled=true;
  const r=await A.api('PUT','/api/incident-groups',{groups});
  btn.disabled=false;
  if(r.ok){
    VERSION=(r.data&&r.data.version)||VERSION+1;
    flash('ok','Published. Now live for everyone (v'+VERSION+'). The dashboard shows it on next load.');
    btn.innerHTML=ic('check-circle',15)+' Publish (v'+VERSION+' &rarr; v'+(VERSION+1)+')';
  }else{
    flash('err',(r.data&&r.data.error)||('Publish failed (HTTP '+r.status+').'));
  }
}

async function reloadFromServer(){
  const r=await A.api('GET','/api/incident-groups');
  if(r.ok){
    GROUPS=((r.data&&r.data.groups)||[]).map(g=>({name:g.name,members:(g.members||[]).slice()}));
    VERSION=(r.data&&r.data.version)||0;
    SEL.clear();
    render();
    flash('ok','Reloaded the saved grouping (v'+VERSION+').');
  }else flash('err','Could not reload.');
}

function flash(kind,msg){
  const el=document.getElementById(kind==='err'?'err':'ok');
  const other=document.getElementById(kind==='err'?'ok':'err');
  if(other)other.style.display='none';
  if(!el)return;el.textContent=msg;el.style.display='inline';
  setTimeout(()=>{el.style.display='none';},5000);
}
function ic(n,s){return window.icon?window.icon(n,s||14):'';}

// expose handlers
window.onFilter=onFilter;window.toggleSel=toggleSel;window.addGroup=addGroup;window.assignSelected=assignSelected;
window.renameGroup=renameGroup;window.removeMember=removeMember;window.removeGroup=removeGroup;window.clearAll=clearAll;
window.publish=publish;window.reloadFromServer=reloadFromServer;

boot();
</script>
</body>
</html>
