<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Summary · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: keep the page hidden until topbar-auth.js has injected its chrome. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --o:#ff6100; --o-l:#fe9046; --page:#f4f3ef; --card:#ffffff; --ink:#1b2026; --ink2:#161d2d;
  --mut:#5c6773; --mut2:#818284; --line:#e2e6ea; --soft:#f5f6f8; --blue:#2b66c1; --blue-bg:#e6f0fc; --blue-ic:#c4def6;
  --green:#1a7a43; --green-bg:#e5f5ec; --red:#b42318; --red-bg:#fdecec; --amber:#b5530a; --amber-bg:#fff3e8;
  --acc:#ec7211; --acc-ink:#9a4100; --focus:#f0a35a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--page);color:var(--ink);min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:var(--ink);line-height:1}
.wrap{width:auto!important;max-width:none!important;margin:0 15px!important;padding:0 0 28px!important}
#wrap.wrap{padding-top:0!important}

/* =====================================================================================
   Performance Summary — same visual language as errors-in-resolved.html:
   dark navy hero (grid texture + orange glow + orange left rule), KPI cards that overlap it,
   then white section cards. Scoped under .ps (a size container for the responsive grids).
   ===================================================================================== */
.ps{container-type:inline-size;color:var(--ink)}
.ps button{font:inherit;text-transform:none}
.ps :is(button,a,input,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ps-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.ps-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 80px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.ps-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.ps-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.ps-hero-in{position:relative;display:flex;gap:20px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.ps-hero-main{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1 1 380px}
.ps-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.ps-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.ps-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.08}
.ps-hero-sub{margin-top:9px;max-width:64ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.8)}
.ps-hero-txt{min-width:0}
/* Desktop: the subtitle stays on one line; the text column keeps its full width (min-width:auto), so
   the Weekly/Monthly + Export tools wrap below it instead of the line overflowing. Wraps under 1100px. */
@media (min-width:1100px){
  .ps-hero-main,.ps-hero-txt{min-width:auto}
  .ps-hero-main{flex-basis:auto}
  .ps-hero-sub{white-space:nowrap;max-width:none}
  .ps-hero .ps-hero-tools{flex-direction:row;align-items:center}
}
.ps-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;list-style:none;padding:0}
.ps-chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  font-size:.8em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;max-width:100%;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ps-chip svg{flex-shrink:0;color:#ffb26b}
.ps-chip span{color:rgba(233,237,243,.62);font-weight:800;font-size:.86em;letter-spacing:1px;text-transform:uppercase}
.ps-hero-tools{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:0 0 auto}

/* Weekly / Monthly segmented control (glassy, on the dark hero). */
.ps-seg{display:inline-flex;gap:3px;padding:4px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
.ps-tab{display:inline-flex;align-items:center;gap:8px;border:none;background:transparent;cursor:pointer;font-size:.88em;font-weight:800;
  color:rgba(233,237,243,.78);padding:8px 18px;border-radius:8px;transition:background .15s,color .15s,box-shadow .15s}
.ps-tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.ps-tab.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px -6px rgba(0,0,0,.6)}
.ps-tab.on svg{color:var(--acc)}
.ps-tab svg{flex-shrink:0}

/* Export (copy) — orange on the hero; navy elsewhere (e.g. the modal's Extract button). */
.ps-export{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.86em;font-weight:800;
  color:#f4f3ef;background:#161d2d;border:none;border-radius:8px;padding:10px 16px;transition:background .15s,transform .12s,opacity .15s}
.ps-export:hover{background:#0f1420}
.ps-export:active{transform:translateY(1px)}
.ps-export svg{flex-shrink:0}
.ps-hero .ps-export{background:var(--acc);color:#fff;box-shadow:0 8px 18px -10px rgba(236,114,17,.9)}
.ps-hero .ps-export:hover{background:#d4620b}
.ps-hero .ps-export:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.ps-export.ok,.ps-hero .ps-export.ok{background:#1f9d57}

/* ---- Panes ---- */
.ps-pane{display:none}
.ps-pane.on{display:block}
.ps-pane:focus{outline:none}

/* ---- KPI row (overlaps the hero) ---- */
.ps-kpis{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:-58px 18px 16px}
@container (min-width:520px){.ps-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:900px){.ps-kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ps-kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px 15px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.ps-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#1f2a40)}
.ps-kpi-l{display:flex;align-items:center;gap:9px;font-size:.7em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.ps-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--kb,var(--soft));color:var(--ki,#3a4552)}
.ps-kpi-n{margin-top:12px;font-size:2.4em;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.ps-kpi-sub{margin-top:9px;display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;font-size:.8em;font-weight:600;color:var(--mut)}
.ps-kpi-bar{margin-top:12px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.ps-kpi-bar i{display:block;height:100%;border-radius:inherit;background:var(--k)}
.ps-kpi.k-base{--k:#1f2a40}
.ps-kpi.k-good{--k:#1f9d57;--kb:var(--green-bg);--ki:var(--green)}
.ps-kpi.k-warn{--k:var(--acc);--kb:var(--amber-bg);--ki:var(--amber)}
.ps-kpi.k-blue{--k:#2b66c1;--kb:var(--blue-bg);--ki:var(--blue)}

/* WoW / MoM delta badge */
.wow{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:.92em;border-radius:99px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.wow svg{width:12px;height:12px}
.wow.good{color:var(--green);background:var(--green-bg);border:1px solid #bfe6cf}
.wow.bad{color:var(--red);background:var(--red-bg);border:1px solid #f2c3bd}
.wow.flat{color:#3a4552;background:#eef1f4;border:1px solid var(--line)}

/* ---- Section cards ---- */
.ps-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18);margin-bottom:16px;overflow:hidden}
.ps-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.ps-card.is-shut .ps-card-head{border-bottom-color:transparent}
.ps-card-h{display:flex;align-items:center;gap:12px;min-width:0;font-size:1em;font-weight:inherit}
.ps-card-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;flex-shrink:0;background:var(--cb,var(--blue-bg));color:var(--ci,var(--blue))}
.ps-card.t-green{--cb:var(--green-bg);--ci:var(--green)}
.ps-card.t-amber{--cb:var(--amber-bg);--ci:var(--amber)}
.ps-card.t-rose{--cb:var(--red-bg);--ci:var(--red)}
.ps-card-tt{display:flex;flex-direction:column;min-width:0;text-align:left}
.ps-card-title{font-size:1.12em;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:var(--ink)}
.ps-card-sub{margin-top:3px;font-size:.8em;font-weight:500;color:var(--mut);line-height:1.4}
.ps-card-body{padding:16px 20px 18px}
.ps-card-body[hidden]{display:none}
/* Chevron expander (as on errors-in-resolved). */
.ps-exp{display:inline-flex;align-items:center;gap:12px;margin:-5px -8px;padding:5px 10px 5px 6px;border:none;border-radius:9px;background:none;color:var(--ink);cursor:pointer;min-width:0}
.ps-exp:hover{background:#fafbfc}
.ps-chev{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;color:#818284}
.ps-chev svg{transition:transform .15s}
.ps-exp[aria-expanded="true"] .ps-chev svg{transform:rotate(90deg)}
.ps-exp:hover .ps-chev{background:#e6f0fc;color:#2b66c1}
.ps-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.78em;font-weight:700;color:#3a4552;white-space:nowrap;font-variant-numeric:tabular-nums}
.ps-pill b{color:var(--ink);font-weight:800}

/* Two-up grid (Quality + Address/GEO). */
.ps-grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px}
@container (min-width:760px){.ps-grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ps-grid2 .ps-card{margin-bottom:0}

/* Metric rows: label left, big number + delta badge right, optional proportional bar. */
.ps-metrics{list-style:none;display:flex;flex-direction:column}
.ps-metric{padding:12px 2px;border-bottom:1px solid #eef1f4}
.ps-metric:first-child{padding-top:2px}
.ps-metric:last-child{border-bottom:none;padding-bottom:2px}
.ps-metric-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.ps-metric-l{display:inline-flex;align-items:center;gap:9px;font-size:.9em;font-weight:700;color:#2a3340;min-width:0}
.ps-metric-l::before{content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--m,#c4ccd4)}
.ps-metric.m-green{--m:#1f9d57}
.ps-metric.m-flat{--m:#8793a0}
.ps-metric.m-blue{--m:#2b66c1}
.ps-metric.m-amber{--m:var(--acc)}
.ps-metric-r{display:inline-flex;align-items:center;gap:10px;flex-shrink:0}
.ps-metric-n{font-size:1.5em;font-weight:800;letter-spacing:-.4px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.ps-metric-bar{display:flex;align-items:center;gap:10px;margin-top:9px}
.ps-metric-bar .ps-bar{flex:1 1 auto}
.ps-metric-bar small{font-size:.74em;font-weight:700;color:var(--mut);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.ps-bar{display:block;height:6px;border-radius:99px;background:#eef1f4;overflow:hidden}
.ps-bar i{display:block;height:100%;border-radius:inherit;background:var(--m,var(--acc));transition:width .5s ease}

/* Defect trends: Improving / Watch groups of compact chips. */
.ps-grp+.ps-grp{margin-top:16px}
.ps-grp-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.7em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)}
.ps-grp-h::after{content:'';flex:1 1 auto;height:1px;background:var(--line)}
.ps-tag{display:inline-flex;align-items:center;gap:6px;font-size:1em;font-weight:800;letter-spacing:1px;border-radius:99px;padding:4px 10px}
.ps-tag.good{color:var(--green);background:var(--green-bg)}
.ps-tag.watch{color:var(--amber);background:var(--amber-bg)}
.ps-defs{list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@container (min-width:640px){.ps-defs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:1100px){.ps-defs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ps-def{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 12px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
.ps-def::before{content:'';position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--d)}
.ps-def.good{--d:#1f9d57}
.ps-def.watch{--d:var(--acc)}
.ps-def:hover{border-color:#cfd6dd;box-shadow:0 10px 22px -18px rgba(20,30,50,.55)}
.ps-def-n{font-size:.88em;font-weight:700;color:#2a3340;min-width:0}
.ps-def-r{display:inline-flex;align-items:center;gap:9px;flex-shrink:0}
.ps-def-c{font-size:1.25em;font-weight:800;letter-spacing:-.4px;color:var(--ink);font-variant-numeric:tabular-nums}
.ps-empty{color:#8793a0;font-size:.88em;padding:6px 2px}
/* Hashtag trend items: a labelled "Hashtags" sub-group inside Improving / Watch Item. */
.ps-sub{margin-top:12px}
.ps-grp>.ps-sub:first-child{margin-top:0}
.ps-sub-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:.66em;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut2)}
.ps-sub-h::before{content:'#';display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;background:var(--soft);border:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.1em;letter-spacing:0;color:#3a4552}
.ps-hxs{list-style:none;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@container (min-width:640px){.ps-hxs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:1100px){.ps-hxs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ps-hx{position:relative;padding:12px 14px 12px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
.ps-hx::before{content:'';position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--d)}
.ps-hx.good{--d:#1f9d57}
.ps-hx.watch{--d:var(--acc)}
.ps-hx.flat{--d:#8793a0}
.ps-hx:hover{border-color:#cfd6dd;box-shadow:0 10px 22px -18px rgba(20,30,50,.55)}
.ps-hx-top{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.ps-hx-tag{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.84em;font-weight:700;color:#2a3340;overflow-wrap:anywhere;min-width:0}
.ps-hx-nums{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:start;margin-top:10px}
.ps-hx-nums>.ps-hx-spark{align-self:center}
.ps-hx-k{display:block;font-size:.64em;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut2)}
.ps-hx-v{display:block;margin-top:2px;font-size:1.25em;font-weight:800;letter-spacing:-.3px;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}
.ps-hx-prev .ps-hx-v{font-size:1.05em;color:#4a5562}
.ps-hx-r{display:block;font-size:.72em;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.ps-hx-spark{display:block;width:76px;height:28px;color:var(--d);overflow:visible}
.ps-hx-cnt{margin-top:8px;font-size:.74em;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.ps-hx-err{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid #f2c3bd;border-radius:10px;background:var(--red-bg);color:var(--red);font-size:.86em;font-weight:700}
.ps-hx-err .ps-btn{margin-top:0;padding:6px 12px;font-size:.92em}
.ps-hx-foot{margin-top:14px;font-size:.74em;line-height:1.5;color:var(--mut2)}
.ps-hx-foot code{font-size:.95em;color:var(--mut)}
.ps-asides{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Resolution Distribution table. */
.ps-res-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
.ps-res-tbl{width:100%;min-width:560px;border-collapse:separate;border-spacing:0;font-size:.88em}
.ps-res-tbl th,.ps-res-tbl td{padding:10px 14px;border-bottom:1px solid #eef1f4;text-align:left;vertical-align:middle;color:#2a3340}
.ps-res-tbl thead th{position:sticky;top:0;z-index:1;background:#f5f6f8;border-bottom:1px solid var(--line);font-size:.72em;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.ps-res-tbl tbody tr:last-child>*{border-bottom:none}
.ps-res-tbl tbody tr{transition:background .12s}
.ps-res-tbl tbody tr:hover{background:#fafbfc}
.ps-res-tbl tbody th{font-weight:700;color:var(--ink)}
.ps-res-tbl tfoot>tr>*{position:sticky;bottom:0;background:#f5f6f8;border-top:1px solid var(--line);border-bottom:none;font-weight:800;color:var(--ink)}
.ps-res-tbl .rk{width:44px;color:#8793a0;font-weight:700;font-variant-numeric:tabular-nums}
.ps-res-tbl .sh{width:32%;min-width:150px}
.ps-res-tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ps-res-tbl .ps-bar{height:8px}
.ps-res-tbl .ps-bar i{background:linear-gradient(90deg,#f5a54a,var(--acc))}
.ps-res-cnt{font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue);background:none;border:none;border-radius:6px;padding:3px 8px;margin:-3px -8px -3px 0;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(43,102,193,.35);text-underline-offset:3px;transition:background .12s}
.ps-res-cnt:hover{background:var(--blue-bg);text-decoration-color:currentColor}

/* ---- Loading skeleton ---- */
.ps-sk{display:block;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:psShim 1.4s ease infinite}
@keyframes psShim{0%{background-position:100% 0}100%{background-position:0 0}}
.ps-kpi.is-sk::before{background:#e2e6ea}
.ps-sk-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 2px;border-bottom:1px solid #eef1f4}
.ps-sk-row:last-child{border-bottom:none}
.ps-loadnote{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 16px;font-size:.86em;font-weight:700;color:var(--mut);min-height:28px}
.ps-loadnote-ic{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--amber-bg);color:var(--amber);animation:psPulse 1.6s ease-in-out infinite}

<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>

<div class="wrap" id="wrap">
  <div class="ps-gate"><h1>Performance Summary</h1><p>Loading…</p></div>
</div>

<script src="icons.js?v=2"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=222"></script>
<script src="resolution-tickets-modal.js?v=1"></script>
<script>
const A=window.PHDAuth;
const ic=(n,s)=>window.icon?window.icon(n,s||14):'';
var CHEV='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// ---- Dynamic date ranges (computed from "now") ----
var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDay(d){ return MON[d.getMonth()].slice(0,3)+' '+d.getDate(); }
function fmtDayYr(d){ return MON[d.getMonth()].slice(0,3)+' '+d.getDate()+', '+d.getFullYear(); }
// Last COMPLETED week, Sunday -> Saturday. (The most recent Saturday that has already passed, back 6 days.)
function lastCompletedWeek(now){
  var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()); // midnight today
  var dow=d.getDay();                 // 0=Sun .. 6=Sat
  var lastSat=new Date(d); lastSat.setDate(d.getDate()-((dow+1)%7)); // most recent Saturday strictly before/at today's week
  // If today IS Saturday, the "last completed" week is the one ending the PREVIOUS Saturday.
  if(dow===6) lastSat.setDate(lastSat.getDate()-7);
  var sun=new Date(lastSat); sun.setDate(lastSat.getDate()-6);
  return { start:sun, end:lastSat };
}
// Previous calendar month, full span (1st -> last day).
function previousMonth(now){
  var first=new Date(now.getFullYear(),now.getMonth()-1,1);
  var last=new Date(now.getFullYear(),now.getMonth(),0); // day 0 of this month = last day of prev month
  return { start:first, end:last };
}
// Human label: "Jul 26 – Aug 1, 2026" (omit the first year when both share it; always show end year).
function rangeLabel(r){
  var sameYear=r.start.getFullYear()===r.end.getFullYear();
  return (sameYear ? fmtDay(r.start) : fmtDayYr(r.start))+' \u2013 '+fmtDayYr(r.end);
}
/* PS-WEEK-START */
// Week number for Sunday–Saturday weeks (US / Excel WEEKNUM type 1 style): W01 is the Sun–Sat week
// that contains 1 January; a week spanning New Year belongs to the NEW year's W01. `d` = any day of
// the week (local Date naming a calendar day; only its Y/M/D are used). UTC math, so DST never shifts
// a day. Returns { week:1..53, year } (year = the year of that week's Saturday).
function psWeekOf(d){
  var DAY=86400000;
  var t=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  var sun=t-new Date(t).getUTCDay()*DAY;                 // Sunday that starts the week
  var year=new Date(sun+6*DAY).getUTCFullYear();         // the week belongs to its Saturday's year
  var jan1=Date.UTC(year,0,1);
  var wk1=jan1-new Date(jan1).getUTCDay()*DAY;           // Sunday of the week holding 1 Jan (= W01)
  return { week:Math.round((sun-wk1)/DAY/7)+1, year:year };
}
// 'W44' (always 2 digits).
function psWeekTag(d){ var w=psWeekOf(d).week; return 'W'+(w<10?'0':'')+w; }
/* PS-WEEK-END */
// Weekly period label: 'W44 · Oct 25 – Oct 31, 2026'.
function weekLabel(r){ return psWeekTag(r.start)+' \u00b7 '+rangeLabel(r); }
// Comparison (previous) week label: 'W43 · Oct 18 – Oct 24' (years only when they differ from `cur`'s end).
function prevWeekLabel(r,cur){
  var short=r.start.getFullYear()===cur.end.getFullYear()&&r.end.getFullYear()===cur.end.getFullYear();
  return psWeekTag(r.start)+' \u00b7 '+(short?fmtDay(r.start)+' \u2013 '+fmtDay(r.end):rangeLabel(r));
}

// Raw delta badge from a preformatted "%" string + good/bad direction.
function delta(pctText,good,period){
  var cls=good?'good':'bad';
  var arrow=good
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 15 12 9 18 15"/></svg>';
  return '<span class="wow '+cls+'">'+arrow+pctText+' '+period+'<span class="ps-sr"> ('+(good?'better':'worse')+')</span></span>';
}
function flat(text){ return '<span class="wow flat">'+text+'</span>'; }
// Compute a WoW/MoM delta badge from current vs previous values. lowerIsGood=true means a DECREASE
// is positive (defects, backlog, breaches); false means an INCREASE is positive.
function deltaOf(cur,prev,lowerIsGood,period){
  cur=Number(cur)||0; prev=Number(prev)||0;
  if(prev===0){ // no prior baseline -> show "new" neutrally
    if(cur===0) return flat('0% '+period);
    return flat('new '+period);
  }
  var chg=(cur-prev)/prev*100;
  var rounded=Math.round(chg*10)/10;
  var txt=(rounded>0?'+':'')+rounded+'%';
  var good = lowerIsGood ? (chg<0) : (chg>0);
  if(rounded===0) return flat('0% '+period);
  return delta(txt,good,period);
}
// Signed percent as plain text, for the Export write-up (e.g. "-11.3%").
function pctText(cur,prev){
  cur=Number(cur)||0; prev=Number(prev)||0;
  if(prev===0) return cur===0?'0%':'new';
  var r=Math.round((cur-prev)/prev*1000)/10;
  return (r>0?'+':'')+r+'%';
}

// KPI card. tone: base | good | warn | blue. `extra` = optional HTML under the sub line (e.g. a bar).
function kpi(icon,label,n,sub,tone,extra){
  return '<div class="ps-kpi k-'+(tone||'base')+'"><div class="ps-kpi-l"><span class="ps-kpi-ic">'+ic(icon,15)+'</span>'+label+'</div>'+
    '<div class="ps-kpi-n">'+n+'</div><div class="ps-kpi-sub">'+sub+'</div>'+(extra||'')+'</div>';
}
// Build one period's full summary from REAL data. `D` = { current, previous } window stats,
// `mtdPct` = month-to-date SLA %. `p` is the suffix ("WoW"/"MoM").
function summaryPane(kind,p,rangeTxt,D,mtdPct){
  var inWindow=(p==='WoW')?'in-week':'in-month';
  var period=(kind==='Weekly')?'weekly':'monthly';
  var prevWord=(p==='WoW')?'prior week':'prior month';
  var c=D.current, pv=D.previous;
  var sla=Math.round((c.slaPct||0)*10)/10, slaTxt=sla+'%';
  var mtdTxt='MTD '+(Math.round((mtdPct||0)*10)/10)+'%';
  var vs='<span>vs '+prevWord+'</span>';
  var rt=Number(c.repeat.total)||0;
  return ''+
    // KPI tiles (headline numbers), overlapping the hero
    '<div class="ps-kpis">'+
      kpi('inbox','Reports received',num(c.reports),deltaOf(c.reports,pv.reports,true,p)+vs,'base')+
      kpi('check-circle','Resolved',num(c.resolved),deltaOf(c.resolved,pv.resolved,false,p)+vs,'good')+
      kpi('repeat','Added to backlog',num(c.backlog),deltaOf(c.backlog,pv.backlog,true,p)+vs,'warn')+
      kpi('target','SLA ('+inWindow+')',slaTxt,flat(mtdTxt)+'<span>month to date</span>','blue',
        '<div class="ps-kpi-bar" aria-hidden="true"><i style="width:'+Math.max(0,Math.min(100,sla))+'%"></i></div>')+
    '</div>'+

    // ---- Quality + GEO (two compact metric cards side by side) ----
    '<div class="ps-grid2">'+
      metricCard('repeat','green','Quality \u2014 Repeat Incidents','Repeat incidents and the pet / non-pet split',[
        metric('Total repeat incidents',num(c.repeat.total),deltaOf(c.repeat.total,pv.repeat.total,true,p),'green'),
        metric('Non-pet related',num(c.repeat.nonPet),deltaOf(c.repeat.nonPet,pv.repeat.nonPet,true,p),'blue',rt?(Number(c.repeat.nonPet)||0)/rt:0),
        metric('Pet related',num(c.repeat.pet),deltaOf(c.repeat.pet,pv.repeat.pet,true,p),'amber',rt?(Number(c.repeat.pet)||0)/rt:0)
      ])+
      metricCard('map-pin','amber','Address & GEO','Resolved tickets whose \u201cRes:\u201d value includes each action',psAddrGeoItems(D).map(function(a){
        return metric(a.label,num(a.cur),deltaOf(a.cur,a.prev,a.lowerIsGood,p),a.tone);
      }))+
    '</div>'+

    // ---- Defect Code Trends (auto-split into Improving (down) vs Watch (up)) ----
    defectTrendsCard(c.defects,pv.defects,p,period)+

    // ---- Resolution Distribution ("Res:" value from RootCauseDetails, resolved in this period) ----
    resolutionCard(D,period)+

    '<div class="ps-foot">WWOS-GSOC PHD \u00b7 '+kind+' Performance Summary \u00b7 use <b>Export</b> for the full write-up</div>';
}
// Address & GEO: the 5 actions from /api/perf-summary?grouped=1 `addressGeo` (fixed order and labels).
// A multi-action Res value counts in each of its actions. Delta direction as before: exclusions /
// deprio lower is better; GeoPin / GeoFence / Routing updates higher is better.
var PS_ADDR_GEO=[
  ['addressExclusion','Address Exclusion',true,'green'],
  ['routingUpdate','Routing Update',false,'blue'],
  ['addressDeprio','Address Deprio',true,'amber'],
  ['geoPinUpdate','GeoPin Update',false,'flat'],
  ['geoFenceUpdate','GeoFence Update',false,'flat'],
];
function psAddrGeoItems(D){
  var g=(D&&D.addressGeo)||{}, c=g.current||{}, pv=g.previous||{};
  return PS_ADDR_GEO.map(function(a){ return { key:a[0], label:a[1], lowerIsGood:a[2], tone:a[3], cur:Number(c[a[0]])||0, prev:Number(pv[a[0]])||0 }; });
}
// Defect trends: three tracked tags, auto-sorted into Improving (count went down or flat) vs
// Watch Item (count went up vs the prior window).
var PS_DEFECTS=[
  ['contradictory','Contradictory Statement / No Proof'],
  ['noEmt','No EMT'],
  ['unsuccessfulOutreach','Unsuccessful Outreach'],
];
function defectTrendsCard(cur,prev,p,period){
  var improving=[], watch=[];
  PS_DEFECTS.forEach(function(d){
    var key=d[0], name=d[1], cv=(cur&&cur[key])||0, pvv=(prev&&prev[key])||0;
    var up=cv>pvv;
    (up?watch:improving).push(defectItem(up?'watch':'good',name,num(cv),deltaOf(cv,pvv,true,p)));
  });
  // Hashtag trend items (separate fetch, PS_HT[period]) join each section as a "Hashtags" sub-group.
  var H=PS_HT[period], hx=(H&&H.state==='done')?psHxItems(H.data):null, hxState='';
  if(H&&H.state==='loading') hxState=psHxLoading();
  else if(H&&H.state==='error') hxState=psHxError(period);
  var rows='';
  if(improving.length||(hx&&hx.good.length)) rows+=defectRow('good','Improving',improving,hx&&hx.good.length?psHxSub(hx.good,p):'');
  if(watch.length||(hx&&hx.watch.length)) rows+=defectRow('watch','Watch Item',watch,hx&&hx.watch.length?psHxSub(hx.watch,p):'');
  if(!rows) rows='<div class="ps-empty">No tagged defects in this window.</div>';
  rows+=hxState+(hx?psHxFoot():'');
  var aside='<span class="ps-pill"><b>'+improving.length+'</b> improving \u00b7 <b>'+watch.length+'</b> to watch</span>';
  if(hx) aside='<span class="ps-asides">'+aside+'<span class="ps-pill"><b>'+hx.good.length+'</b> hashtags improving \u00b7 <b>'+hx.watch.length+'</b> to watch</span></span>';
  return sectionCard('alert','Defect Code Trends',rows,{key:'defects',period:period,tone:'rose',
    sub:'Tagged defects vs the prior '+(p==='WoW'?'week':'month')+'; any increase is a watch item',aside:aside});
}

// ===== Hashtag trend items (from /api/perf-summary/hashtag-trends) =====
// Count = unique tickets CREATED in the window carrying the tag, on the Hashtags page's basis (Labels
// '#tags' + manual hashtags, alias spellings merged). Rate = per 100 tickets created in the window.
// All six are defect tags, so a LOWER rate is better: rate down -> Improving; rate up -> Watch Item;
// |change| < 0.1 per 100 (or no data in either window) -> Watch Item with a neutral "No change" badge.
var PS_HT={ weekly:null, monthly:null };   // { state:'loading'|'done'|'error', data }
var PS_HT_SEQ={ weekly:0, monthly:0 };     // ignores stale responses after a retry
var PS_HX_FLAT=0.1;                        // per-100 change treated as "no change"
function psHxRate(n,created){ return (n==null||!created)?null:n/created*100; }
function psHx1(x){ return (Math.round(x*10)/10).toFixed(1); }
// -> { good:[...], watch:[...] } item models, sorted by size of change.
function psHxItems(data){
  var per=data.periods||[], L=per.length-1, out={ good:[], watch:[] };
  if(L<1) return out;
  (data.tags||[]).forEach(function(t){
    var counts=t.counts||[], c=counts[L], pc=counts[L-1];
    var cr=psHxRate(c,per[L].created), pr=psHxRate(pc,per[L-1].created);
    var noData=(cr==null||pr==null||(c===0&&pc===0));
    var chg=noData?0:cr-pr, flat=noData||Math.abs(chg)<PS_HX_FLAT;
    var m={ tag:t.tag, also:t.also||[], c:c, pc:pc, cr:cr, pr:pr, chg:chg, flat:flat, noData:noData,
      spark:counts.map(function(n,i){ return psHxRate(n,per[i]&&per[i].created); }) };
    (!flat&&chg<0?out.good:out.watch).push(m);
  });
  out.good.sort(function(a,b){ return a.chg-b.chg; });                                  // biggest drop first
  out.watch.sort(function(a,b){ return (a.flat-b.flat)||(b.chg-a.chg); });             // biggest rise first, "No change" last
  return out;
}
function psHxSub(list,p){
  return '<div class="ps-sub"><h4 class="ps-sub-h">Hashtags</h4><ul class="ps-hxs">'+list.map(function(m){ return psHxItem(m,p); }).join('')+'</ul></div>';
}

// Tiny sparkline of the per-100 rate over the last 6 windows (gaps skipped); the last point is marked.
function psHxSpark(vals,word){
  var pts=[], W=76, Hh=28, pad=3, n=vals.length;
  var nums=vals.filter(function(v){ return v!=null; });
  if(nums.length<2) return '<span></span>';
  var lo=Math.min.apply(null,nums), hi=Math.max.apply(null,nums), rg=(hi-lo)||1;
  vals.forEach(function(v,i){ if(v==null) return;
    var x=pad+(n>1?i*(W-2*pad)/(n-1):0), y=(hi===lo)?Hh/2:pad+(1-(v-lo)/rg)*(Hh-2*pad);
    pts.push([Math.round(x*10)/10,Math.round(y*10)/10]); });
  var last=pts[pts.length-1];
  var lbl='Rate per 100 created, last '+n+' '+word+'s: '+vals.map(function(v){ return v==null?'no data':psHx1(v); }).join(', ');
  return '<svg class="ps-hx-spark" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="'+esc(lbl)+'"><title>'+esc(lbl)+'</title>'+
    '<polyline points="'+pts.map(function(q){ return q.join(','); }).join(' ')+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.4" fill="currentColor"/></svg>';
}

// Data-driven plain-text summary for Export. `p` = 'WoW' | 'MoM', D = { current, previous }, mtd = MTD SLA %.
function psSummaryText(kind,p,rangeTxt,D,mtd){
  var over=(p==='WoW')?'week over week':'month over month';
  var within=(p==='WoW')?'within the week':'within the month';
  var c=D.current, pv=D.previous;
  var pt=function(a,b){ return pctText(a,b); };
  var slaPct=(Math.round((c.slaPct||0)*10)/10)+'%';
  var mtdPct=(Math.round((mtd||0)*10)/10)+'%';
  // Group defects into improving/watch like the UI does.
  var improving=[], watch=[];
  PS_DEFECTS.forEach(function(d){ var k=d[0],n=d[1],cv=(c.defects&&c.defects[k])||0,pvv=(pv.defects&&pv.defects[k])||0;
    (cv>pvv?watch:improving).push(n+' ('+pt(cv,pvv)+' '+p+')'); });
  var defImp=improving.length?('\u2022 Improving: '+improving.join(' and ')+'.\n'):'';
  var defWatch=watch.length?('\u2022 Watch Item: '+watch.join(' and ')+' \u2014 an opportunity area. Customer and driver outreach, performed by LMIR, directly supports mitigating actions such as driver notes, delivery GEO pin updates, and parcel box instructions for low-severity incidents.\n'):'';
  var cmpTxt=(p==='WoW'&&PS_HERO.weekly.cmp)?(', vs '+PS_HERO.weekly.cmp):'';

      'netting '+num(c.backlog)+' cases to the backlog ('+pt(c.backlog,pv.backlog)+' '+over+'). SLA performance was '+slaPct+' for cases '+

      'GEO Pins are critical to setting accurate Road Entry Points (REP) and delivery points, ensuring transporters can '+
      'complete deliveries safely via the Rabbit app.'+

}

    ['map-pin',     'One more pass over exclusions and GEO pins\u2026'],
    ['check-circle','Polishing the last few numbers\u2026'],
    ['calendar',    'Finalising the period comparison\u2026'],
    ['bar-chart',   'Nearly ready \u2014 wrapping up the totals\u2026'],
    ['clock',       'Appreciate the wait \u2014 almost done\u2026'],
  ]);
}
var _psTimers={};  // pfx -> interval id
function _psSet(pfx,tuple){
  var e=document.getElementById(pfx+'LoaderMsg'), i=document.getElementById(pfx+'LoaderIc');
  if(i){ i.innerHTML=ic(tuple[0]||'clock',15); }
  if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent=tuple[1]; e.classList.add('gw-msg-in'); }
}
function _psStop(pfx){ if(_psTimers[pfx]){ clearInterval(_psTimers[pfx]); _psTimers[pfx]=null; } }
function _psStart(pfx,win){
  _psStop(pfx);
  var p1=psPhase1(win), i=0; _psSet(pfx,p1[0]);
  _psTimers[pfx]=setInterval(function(){
    i++;
    if(i<p1.length){ _psSet(pfx,p1[i]); return; }
    _psStop(pfx);
    _psSet(pfx,['alert','Sorry for the delay \u2014 still crunching the numbers\u2026']);
    setTimeout(function(){
      if(!document.getElementById(pfx+'LoaderMsg')) return;   // already rendered / errored
      var p2=psPhase2(win), j=0; _psSet(pfx,p2[0]);
      _psTimers[pfx]=setInterval(function(){ j=(j+1)%p2.length; _psSet(pfx,p2[j]); },3000);
    },3000);
  },2000);
}
function _psSuccess(pfx){
  _psStop(pfx);
  var l=document.getElementById(pfx+'Loader'); if(l) l.classList.add('gw-done');
  var i=document.getElementById(pfx+'LoaderIc'); if(i) i.innerHTML=ic('check-circle',15);
  var e=document.getElementById(pfx+'LoaderMsg'); if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent='Data fetched successfully'; e.classList.add('gw-msg-in'); }
}
var _psDelay=function(ms){ return new Promise(function(res){ setTimeout(res,ms); }); };
// Polite screen-reader announcements (loading / loaded / failed / copied).
function psAnnounce(msg){ var l=document.getElementById('psLive'); if(!l) return; l.textContent=''; setTimeout(function(){ l.textContent=msg; },60); }

// Fetch one window's stats. The API's `to` is EXCLUSIVE, so pass (end + 1 day).
function nextDay(d){ var x=new Date(d); x.setDate(x.getDate()+1); return x; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function fetchWindow(range){
  // grouped=1: Resolution Distribution rows use the resolutions.html Section 2 group labels.
  var r=await A.api('GET','/api/perf-summary?from='+ymd(range.start)+'&to='+ymd(nextDay(range.end))+'&grouped=1');
  if(r&&r.ok&&r.data&&r.data.current) return r.data;
  throw new Error((r&&r.data&&r.data.error)||'fetch failed');
}
// Loading pane: skeleton placeholders that mirror the final layout (KPI row, two metric cards,
// defect trends, resolution table) + a rotating status line. Animation started by the caller.
function loadingPane(kind,pfx){
  var sk=function(w,h,extra){ return '<span class="ps-sk" style="width:'+w+';height:'+h+'px'+(extra?';'+extra:'')+'"></span>'; };
  var kpiSk='<div class="ps-kpi is-sk">'+sk('58%',11)+sk('44%',34,'margin-top:14px')+sk('72%',14,'margin-top:11px')+'</div>';
  var head=function(){ return '<div class="ps-card-head"><div class="ps-card-h">'+sk('34px',34,'border-radius:9px')+'<span style="display:flex;flex-direction:column;gap:7px">'+sk('180px',14)+sk('240px',10,'max-width:52vw')+'</span></div></div>'; };
  var mrow='<div class="ps-sk-row">'+sk('46%',13)+sk('96px',22,'border-radius:99px')+'</div>';
  var card=function(rows){ var r=''; for(var i=0;i<rows;i++) r+=mrow; return '<div class="ps-card">'+head()+'<div class="ps-card-body">'+r+'</div></div>'; };
  var chips=''; for(var c=0;c<3;c++) chips+=sk('100%',46,'border-radius:10px');
  var trow='', tw=['62%','48%','55%','40%','34%','28%'];
  for(var t=0;t<6;t++) trow+='<div class="ps-sk-row" style="padding:12px 14px">'+sk(tw[t],12)+sk('30%',8,'border-radius:99px')+sk('48px',12)+'</div>';
  return '<div id="'+pfx+'Loader" class="ps-load">'+
      '<div class="ps-kpis">'+kpiSk+kpiSk+kpiSk+kpiSk+'</div>'+
      '<div class="ps-loadnote" aria-hidden="true"><span class="ps-loadnote-ic" id="'+pfx+'LoaderIc">'+ic('clock',15)+'</span>'+
        '<span class="ps-loadnote-msg gw-msg-in" id="'+pfx+'LoaderMsg">Getting the '+kind.toLowerCase()+' numbers ready\u2026</span></div>'+
      '<div class="ps-grid2">'+card(3)+card(2)+'</div>'+
      '<div class="ps-card">'+head()+'<div class="ps-card-body"><div class="ps-defs">'+chips+'</div></div></div>'+
      '<div class="ps-card">'+head()+'<div class="ps-card-body" style="padding-top:8px">'+trow+'</div></div>'+
    '</div>';
}
// Friendly error state with a Retry that re-runs the same fetch.
function errorPane(kind,period,err){
  var detail=err&&err.message&&err.message!=='fetch failed'?'<code>'+esc(err.message)+'</code>':'';
  return '<div class="ps-state" role="alert">'+
    '<span class="ps-state-ic">'+ic('alert',26)+'</span>'+
    '<h2>We couldn\u2019t load the '+kind.toLowerCase()+' summary</h2>'+
    '<p>The server didn\u2019t send the numbers for '+esc(PS_RANGES[period]||'this period')+'. Check your connection, then try again.</p>'+detail+
    '<button type="button" class="ps-btn" data-ps-retry="'+period+'">'+ic('refresh',15)+'Retry</button>'+
  '</div>';
}

async function render(){
  var now=new Date();
  var wk=lastCompletedWeek(now), mo=previousMonth(now);
  var wkTxt=weekLabel(wk);
  // Comparison week = the 7 days before (the same window /api/perf-summary uses for `previous`).
  var pwS=new Date(wk.start); pwS.setDate(pwS.getDate()-7);
  var pwE=new Date(wk.end); pwE.setDate(pwE.getDate()-7);
  PS_HERO.weekly.cmp=prevWeekLabel({ start:pwS, end:pwE },wk);
  var moTxt=MON[mo.start.getMonth()]+' '+mo.start.getFullYear()+'  \u00b7  '+rangeLabel(mo);
  PS_RANGES={ weekly:wkTxt, monthly:moTxt };
  PS_WIN={ weekly:wk, monthly:mo };
  PS_STATE={ weekly:'idle', monthly:'idle' };
  var h=PS_HERO.weekly;
  // Shell: shared hero (title, period chips, Weekly/Monthly segmented control, Export) + one pane per period.
  document.getElementById('wrap').innerHTML=
    '<div class="ps">'+
    '<div id="psLive" class="ps-sr" role="status" aria-live="polite" aria-atomic="true"></div>'+
    '<header class="ps-hero">'+
      '<div class="ps-hero-in">'+
        '<div class="ps-hero-main">'+
          '<span class="ps-hero-ic" aria-hidden="true">'+ic('clipboard',24)+'</span>'+
          '<div class="ps-hero-txt">'+
            '<div class="ps-eyebrow" id="psEyebrow">'+h.eyebrow+'</div>'+
            '<h1 id="psTitle">'+h.title+'</h1>'+
            '<p class="ps-hero-sub" id="psSub">'+h.sub+'</p>'+
            '<ul class="ps-chips">'+
              '<li class="ps-chip">'+ic('calendar',14)+'<span>Period</span><b id="psRange">'+esc(wkTxt)+'</b></li>'+
              '<li class="ps-chip">'+ic('bar-chart',14)+'<span>Compared with</span><b id="psCmp">'+h.cmp+'</b></li>'+
            '</ul>'+
          '</div>'+
        '</div>'+
        '<div class="ps-hero-tools">'+
          '<div class="ps-seg ps-tabs" role="tablist" aria-label="Summary period">'+
            '<button type="button" class="ps-tab on" role="tab" id="psTab-weekly" aria-selected="true" aria-controls="psPane-weekly" tabindex="0" onclick="psSwitch(\'weekly\')">'+ic('calendar',15)+'Weekly</button>'+
            '<button type="button" class="ps-tab" role="tab" id="psTab-monthly" aria-selected="false" aria-controls="psPane-monthly" tabindex="-1" onclick="psSwitch(\'monthly\')">'+ic('calendar',15)+'Monthly</button>'+
          '</div>'+
          '<button type="button" class="ps-export" id="psExport" onclick="psExport()" disabled>'+ic('copy',15)+'<span id="psExportLbl">Export Weekly</span></button>'+
        '</div>'+
      '</div>'+
    '</header>'+
    '<div class="ps-pane on" id="psPane-weekly" role="tabpanel" aria-labelledby="psTab-weekly" tabindex="-1"></div>'+
    '<div class="ps-pane" id="psPane-monthly" role="tabpanel" aria-labelledby="psTab-monthly" tabindex="-1"></div>'+
    '</div>';

  // Arrow-key navigation inside the segmented control (WAI-ARIA tabs pattern).
  var tl=document.querySelector('.ps-seg');
  if(tl) tl.addEventListener('keydown',function(ev){
    if(['ArrowLeft','ArrowRight','Home','End'].indexOf(ev.key)<0) return;
    ev.preventDefault();
    var next=(ev.key==='Home')?'weekly':(ev.key==='End')?'monthly':(PS_ACTIVE==='weekly'?'monthly':'weekly');
    psSwitch(next); var t=document.getElementById('psTab-'+next); if(t) t.focus();
  });

  // Only the ACTIVE (Weekly) pane fetches on load. Monthly fetches lazily the first time its tab
  // is opened (psSwitch -> psFill), so the hidden tab's /api/perf-summary isn't fired on load.
  psFill('weekly');
}
// Fetch + render one period's pane. Shows the skeleton, fetches the window once, reveals.
var PS_META={
  weekly:  { pfx:'psW', paneId:'psPane-weekly',  kind:'Weekly',  per:'WoW', phase:'week'  },
  monthly: { pfx:'psM', paneId:'psPane-monthly', kind:'Monthly', per:'MoM', phase:'month' }
};
function psFill(period){
  if(PS_STATE[period]!=='idle') return;   // fetch each period only once
  PS_STATE[period]='loading';
  var m=PS_META[period], win=PS_WIN[period], txt=PS_RANGES[period];
  var pane=document.getElementById(m.paneId);
  if(pane){ pane.classList.remove('is-anim'); pane.setAttribute('aria-busy','true'); pane.innerHTML=loadingPane(m.kind,m.pfx); }
  psAnnounce('Loading the '+m.kind.toLowerCase()+' summary\u2026');
  _psStart(m.pfx,m.phase);
  psHxFetch(period);   // hashtag trend items load in parallel (own loader / error state in the card)
  var t0=Date.now();
  var minHold=function(){ var el=500-(Date.now()-t0); return el>0?_psDelay(el):Promise.resolve(); };
  fetchWindow(win).then(async function(D){
    PS_DATA[period]=D;
    await minHold();
    _psSuccess(m.pfx); await _psDelay(250);
    var el=document.getElementById(m.paneId);
    if(el){ el.innerHTML=summaryPane(m.kind,m.per,txt,D,D.mtdSlaPct); el.classList.add('is-anim'); el.removeAttribute('aria-busy'); }
    PS_STATE[period]='done';
    psSyncExport();
    psAnnounce(m.kind+' summary loaded for '+txt);
  }).catch(function(err){
    _psStop(m.pfx);
    PS_STATE[period]='idle';   // allow a retry (button or next tab open)
    var el=document.getElementById(m.paneId);
    if(el){ el.innerHTML=errorPane(m.kind,period,err); el.removeAttribute('aria-busy'); }
    psAnnounce('Could not load the '+m.kind.toLowerCase()+' summary.');
  });
}
window.psFill=psFill;
// Retry: re-run the same fetch, keeping keyboard focus inside the pane.
function psRetry(period){
  if(!PS_META[period]) return;
  psFill(period);
  var p=document.getElementById(PS_META[period].paneId); if(p) p.focus();
}

(function init(){
  if(!A||!A.getUser||!A.getUser()||!A.getToken()){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  render();
})();
</script>
