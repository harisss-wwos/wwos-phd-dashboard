<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Summary · WWOS-GSOC PHD Dashboard</title>
<!-- Anti-FOUC: keep the page hidden until topbar-auth.js has injected its chrome. -->
<style>html.tb-booting body{visibility:hidden!important}</style>
<script>document.documentElement.className+=' tb-booting';setTimeout(function(){document.documentElement.classList.remove('tb-booting');},2000);</script>
<noscript><style>html.tb-booting body{visibility:visible!important}</style></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --o:#ff6100; --o-l:#fe9046; --page:#f4f3ef; --card:#ffffff; --ink:#151d28; --ink2:#161d2d;
  --mut:#5c6773; --mut2:#818284; --line:#e2e6ea; --blue:#2b66c1; --blue-bg:#e6f0fc; --blue-ic:#c4def6;
  --green:#1f9d57; --green-bg:#eafaf0; --red:#dc2626; --red-bg:#fdeaea; --amber:#b5680c; --amber-bg:#fff3e0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--page);color:var(--ink);min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:var(--ink);line-height:1}
.wrap{width:auto!important;max-width:none!important;margin:0 15px!important;padding:0 0 28px!important}

/* ---- Hero banner ---- */
.ps-hero{position:relative;overflow:hidden;border-radius:10px;padding:22px 26px;margin-bottom:18px;
  background:linear-gradient(120deg,#1f49a8,#2b66c1 48%,#4f8cf0);box-shadow:0 14px 34px -22px rgba(20,40,70,.6)}
.ps-hero h1{color:#fff;font-size:1.55em;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:12px;line-height:1.15}
.ps-hero h1 svg{flex-shrink:0}
.ps-hero .ps-range{margin-top:6px;color:rgba(255,255,255,.9);font-size:.95em;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.ps-hero .ps-range svg{opacity:.9}
.ps-hero::after{content:"";position:absolute;top:0;bottom:0;right:0;width:230px;opacity:.16;pointer-events:none;
  background-repeat:no-repeat;background-position:right center;background-size:auto 150%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 60V40M40 60V26M64 60V34M88 60V18"/><path d="M12 66h96"/></svg>')}

/* ---- KPI tiles row ---- */
.ps-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.ps-kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:0 2px 10px -6px rgba(20,40,70,.25)}
.ps-kpi-l{font-size:.72em;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut2);display:flex;align-items:center;gap:7px}
.ps-kpi-l svg{color:var(--blue)}
.ps-kpi-n{font-size:1.9em;font-weight:800;letter-spacing:-.5px;color:var(--ink);line-height:1.1;margin:8px 0 6px}
.ps-kpi-sub{font-size:.8em;color:var(--mut);font-weight:600}
@media(max-width:900px){.ps-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.ps-kpis{grid-template-columns:1fr}}

/* WoW delta badge */
.wow{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:.82em;border-radius:999px;padding:2px 9px;white-space:nowrap}
.wow svg{width:12px;height:12px}
.wow.good{color:var(--green);background:var(--green-bg);border:1px solid #c8efd8}
.wow.bad{color:var(--red);background:var(--red-bg);border:1px solid #f6cccc}
.wow.flat{color:var(--mut);background:#eef1f4;border:1px solid var(--line)}

/* ---- Section cards ---- */
.ps-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 10px -6px rgba(20,40,70,.22)}
.ps-card-head{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#f7f9fc,#fff)}
.ps-card-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;flex-shrink:0;background:var(--blue-bg);color:var(--blue)}
.ps-card.rose .ps-card-ic{background:var(--red-bg);color:var(--red)}
.ps-card.green .ps-card-ic{background:var(--green-bg);color:var(--green)}
.ps-card.amber .ps-card-ic{background:var(--amber-bg);color:var(--amber)}
.ps-card-title{font-size:1.02em;font-weight:800;color:var(--ink)}
.ps-card-body{padding:18px 20px}
.ps-card-body p{font-size:.95em;line-height:1.72;color:#2a3340}
.ps-card-body p+p{margin-top:12px}
.ps-card-body b{color:var(--ink);font-weight:800}

/* Two-up card grid (Quality + Address/GEO). */
.ps-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
@media(max-width:720px){.ps-grid2{grid-template-columns:1fr}}
.ps-grid2 .ps-card{margin-bottom:0}

/* Metric rows: label left, big number + delta badge right. */
.ps-metrics{display:flex;flex-direction:column;gap:10px}
.ps-metric{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-radius:9px;background:#fafbfc;border:1px solid var(--line)}
.ps-metric.m-green{border-left:4px solid var(--green)}
.ps-metric.m-flat{border-left:4px solid #c4ccd4}
.ps-metric-l{font-size:.9em;font-weight:700;color:#2a3340}
.ps-metric-r{display:inline-flex;align-items:center;gap:10px;flex-shrink:0}
.ps-metric-n{font-size:1.5em;font-weight:800;letter-spacing:-.4px;color:var(--ink);line-height:1}

/* Defect trends: a status pill + compact "tag  badge" items, no prose. */
.ps-trend{display:flex;flex-direction:column;gap:10px}
.ps-trend-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 15px;border-radius:9px;border:1px solid var(--line);background:#fafbfc}
.ps-trend-row.good{border-left:4px solid var(--green)}
.ps-trend-row.watch{border-left:4px solid var(--amber)}
.ps-defitems{display:flex;flex-wrap:wrap;gap:8px 10px;min-width:0}
.ps-defitem{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ps-defitem-n{font-size:.86em;font-weight:700;color:#2a3340}
.ps-tag{font-size:.68em;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-radius:999px;padding:4px 11px;flex-shrink:0}
.ps-tag.good{color:var(--green);background:var(--green-bg)}
.ps-tag.watch{color:var(--amber);background:var(--amber-bg)}

.ps-gate{text-align:center;padding:60px 20px;color:var(--mut)}
.ps-gate h1{color:var(--ink);font-size:1.4em;margin-bottom:10px}
.ps-foot{font-size:.78em;color:var(--mut2);text-align:center;margin-top:18px}
/* ---- Toolbar: Weekly/Monthly tabs (left) + Export (right) ---- */
.ps-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
.ps-export{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:inherit;font-size:.86em;font-weight:800;
  color:#f4f3ef;background:#161d2d;border:none;border-radius:5px;padding:10px 16px;transition:background .15s,transform .12s}
.ps-export:hover{background:#0f1420}
.ps-export:active{transform:translateY(1px)}
.ps-export.ok{background:#1f9d57}
.ps-export svg{flex-shrink:0}
/* ---- Weekly / Monthly tab switcher ---- */
.ps-tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:#eceef2;border:1px solid var(--line)}
.ps-tab{display:inline-flex;align-items:center;gap:8px;border:none;background:transparent;cursor:pointer;font:inherit;font-size:.9em;font-weight:800;color:var(--mut);padding:9px 20px;border-radius:999px;transition:background .15s,color .15s,box-shadow .15s}
.ps-tab:hover{color:var(--ink)}
.ps-tab.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px -3px rgba(20,40,70,.35)}
.ps-tab svg{flex-shrink:0}
.ps-pane{display:none}
.ps-pane.on{display:block;animation:psFade .22s ease}
@keyframes psFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ===== Fancy phased loader (ported from sla-breach.html section loaders) ===== */
.gw-loader{min-height:52vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gw-loader-in{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:680px}
.gw-orb{position:relative;width:96px;height:96px;display:flex;align-items:center;justify-content:center}
.gw-orb::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(#2b66c1,#c4def6,#fe9046,#ff6100,#2b66c1);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  animation:gwSpin 1.1s linear infinite}
.gw-orb-ic{position:relative;width:62px;height:62px;border-radius:50%;background:#e6f0fc;color:#2b66c1;
  display:flex;align-items:center;justify-content:center;animation:gwPulse 1.6s ease-in-out infinite;box-shadow:0 6px 18px -8px rgba(43,102,193,.5)}
.gw-orb-ic svg{width:30px;height:30px}
@keyframes gwSpin{100%{transform:rotate(360deg)}}
@keyframes gwPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.gw-loader-msg{font-size:1.18em;font-weight:800;color:#151d28;line-height:1.4;min-height:1.5em}
.gw-loader-msg.gw-msg-in{animation:gwMsgIn .5s cubic-bezier(.22,1,.36,1)}
@keyframes gwMsgIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.gw-dots{display:flex;gap:7px}
.gw-dots span{width:9px;height:9px;border-radius:50%;background:#ff6100;animation:gwDot 1.2s ease-in-out infinite}
.gw-dots span:nth-child(2){background:#fe9046;animation-delay:.18s}
.gw-dots span:nth-child(3){background:#2b66c1;animation-delay:.36s}
@keyframes gwDot{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-8px);opacity:1}}
.gw-loader-sub{font-size:.72em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#2b66c1;background:#e6f0fc;border:1px solid #c4def6;border-radius:999px;padding:4px 14px}
.gw-loader.gw-done .gw-orb::before{animation:none;background:#1f9d57}
.gw-loader.gw-done .gw-orb-ic{background:#e7f7ee;color:#1f9d57;animation:gwPop .4s ease}
.gw-loader.gw-done .gw-loader-msg{color:#1f9d57}
.gw-loader.gw-done .gw-dots{visibility:hidden}
@keyframes gwPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
#wrap.wrap{padding-top:0!important}
</style>
</head>

<div class="wrap" id="wrap">
  <div class="ps-gate"><h1>Performance Summary</h1><p>Loading…</p></div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=200"></script>
<script>
const A=window.PHDAuth;
const ic=(n,s)=>window.icon?window.icon(n,s||14):'';

// ---- Dynamic date ranges (computed from "now") ----
var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtDay(d){ return MON[d.getMonth()].slice(0,3)+' '+d.getDate(); }
function fmtDayYr(d){ return MON[d.getMonth()].slice(0,3)+' '+d.getDate()+', '+d.getFullYear(); }
// Last COMPLETED week, Sunday -> Saturday. (The most recent Saturday that has already passed, back 6 days.)
function lastCompletedWeek(now){
  var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()); // midnight today
  var dow=d.getDay();                 // 0=Sun .. 6=Sat
  var lastSat=new Date(d); lastSat.setDate(d.getDate()-((dow+1)%7)); // most recent Saturday strictly before/at today's week
  // If today IS Saturday, the "last completed" week is the one ending the PREVIOUS Saturday.
  if(dow===6) lastSat.setDate(lastSat.getDate()-7);
  var sun=new Date(lastSat); sun.setDate(lastSat.getDate()-6);
  return { start:sun, end:lastSat };
}
// Previous calendar month, full span (1st -> last day).
function previousMonth(now){
  var first=new Date(now.getFullYear(),now.getMonth()-1,1);
  var last=new Date(now.getFullYear(),now.getMonth(),0); // day 0 of this month = last day of prev month
  return { start:first, end:last };
}
// Human label: "Jul 26 – Aug 1, 2026" (omit the first year when both share it; always show end year).
function rangeLabel(r){
  var sameYear=r.start.getFullYear()===r.end.getFullYear();
  return (sameYear ? fmtDay(r.start) : fmtDayYr(r.start))+' \u2013 '+fmtDayYr(r.end);
}

// Raw delta badge from a preformatted "%" string + good/bad direction.
function delta(pctText,good,period){
  var cls=good?'good':'bad';
  var arrow=good
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>';
  return '<span class="wow '+cls+'">'+arrow+pctText+' '+period+'</span>';
}
function flat(text){ return '<span class="wow flat">'+text+'</span>'; }
// Compute a WoW/MoM delta badge from current vs previous values. lowerIsGood=true means a DECREASE
// is positive (defects, backlog, breaches); false means an INCREASE is positive.
function deltaOf(cur,prev,lowerIsGood,period){
  cur=Number(cur)||0; prev=Number(prev)||0;
  if(prev===0){ // no prior baseline -> show "new" neutrally
    if(cur===0) return flat('0% '+period);
    return flat('new '+period);
  }
  var chg=(cur-prev)/prev*100;
  var rounded=Math.round(chg*10)/10;
  var txt=(rounded>0?'+':'')+rounded+'%';
  var good = lowerIsGood ? (chg<0) : (chg>0);
  if(rounded===0) return flat('0% '+period);
  return delta(txt,good,period);
}
// Signed percent as plain text, for the Export write-up (e.g. "-11.3%").
function pctText(cur,prev){
  cur=Number(cur)||0; prev=Number(prev)||0;
  if(prev===0) return cur===0?'0%':'new';
  var r=Math.round((cur-prev)/prev*1000)/10;
  return (r>0?'+':'')+r+'%';
}

function kpi(icon,label,n,sub){
  return '<div class="ps-kpi"><div class="ps-kpi-l">'+ic(icon,13)+label+'</div><div class="ps-kpi-n">'+n+'</div><div class="ps-kpi-sub">'+sub+'</div></div>';
}
// Build one period's full summary from REAL data. `D` = { current, previous } window stats,
// `mtdPct` = month-to-date SLA %. `p` is the suffix ("WoW"/"MoM").
function summaryPane(kind,p,rangeTxt,D,mtdPct){
  var inWindow=(p==='WoW')?'in-week':'in-month';
  var c=D.current, pv=D.previous;
  var slaTxt=(Math.round((c.slaPct||0)*10)/10)+'%';
  var mtdTxt='MTD '+(Math.round((mtdPct||0)*10)/10)+'%';
  return ''+
    // Hero
    '<div class="ps-hero">'+
      '<h1>'+ic('clipboard',24)+'PHD '+kind+' Performance Summary</h1>'+
      '<div class="ps-range">'+ic('calendar',15)+rangeTxt+'</div>'+
    '</div>'+
    // KPI tiles (headline numbers)
    '<div class="ps-kpis">'+
      kpi('inbox','Reports received',num(c.reports),deltaOf(c.reports,pv.reports,true,p))+
      kpi('check-circle','Resolved',num(c.resolved),deltaOf(c.resolved,pv.resolved,false,p))+
      kpi('repeat','Added to backlog',num(c.backlog),deltaOf(c.backlog,pv.backlog,true,p))+
      kpi('target','SLA ('+inWindow+')',slaTxt,flat(mtdTxt))+
    '</div>'+

    // ---- Quality + GEO (two compact metric cards side by side) ----
    '<div class="ps-grid2">'+
      metricCard('repeat','green','Quality \u2014 Repeat Incidents',[
        metric('Total repeat incidents',num(c.repeat.total),deltaOf(c.repeat.total,pv.repeat.total,true,p),'green'),
        metric('Non-pet related',num(c.repeat.nonPet),deltaOf(c.repeat.nonPet,pv.repeat.nonPet,true,p),'green'),
        metric('Pet related',num(c.repeat.pet),deltaOf(c.repeat.pet,pv.repeat.pet,true,p),'green')
      ])+
      metricCard('map-pin','amber','Address & GEO',[
        metric('Address exclusions',num(c.addressExclusions),deltaOf(c.addressExclusions,pv.addressExclusions,true,p),'green'),
        metric('GEO Pin updates',num(c.geoPins),deltaOf(c.geoPins,pv.geoPins,false,p),'flat')
      ])+
    '</div>'+

    // ---- Defect Code Trends (auto-split into Improving (down) vs Watch (up)) ----
    defectTrendsCard(c.defects,pv.defects,p)+

    '<div class="ps-foot">WWOS-GSOC PHD \u00b7 '+kind+' Performance Summary \u00b7 use <b>Export</b> for the full write-up</div>';
}
// Defect trends: three tracked tags, auto-sorted into Improving (count went down or flat) vs
// Watch Item (count went up vs the prior window).
var PS_DEFECTS=[
  ['contradictory','Contradictory Statement / No Proof'],
  ['noEmt','No EMT'],
  ['unsuccessfulOutreach','Unsuccessful Outreach'],
];
function defectTrendsCard(cur,prev,p){
  var improving=[], watch=[];
  PS_DEFECTS.forEach(function(d){
    var key=d[0], name=d[1], cv=(cur&&cur[key])||0, pvv=(prev&&prev[key])||0;
    var up=cv>pvv;
    var item=defectItem(name,deltaOf(cv,pvv,true,p));
    (up?watch:improving).push(item);
  });
  var rows='';
  if(improving.length) rows+=defectRow('good','Improving',improving);
  if(watch.length) rows+=defectRow('watch','Watch Item',watch);
  if(!rows) rows='<div style="color:#8793a0;font-size:.88em;padding:6px 2px">No tagged defects in this window.</div>';
  return sectionCard('alert','Defect Code Trends','<div class="ps-trend">'+rows+'</div>');
}
// Number formatter with thousands separators.
function num(n){ return (Number(n)||0).toLocaleString('en-US'); }
// A labelled metric card holding one or more metric rows.
function metricCard(icon,tone,title,rowsArr){
  return '<div class="ps-card'+(tone&&tone!=='blue'?' '+tone:'')+'">'+
    '<div class="ps-card-head"><span class="ps-card-ic">'+ic(icon,18)+'</span><span class="ps-card-title">'+title+'</span></div>'+
    '<div class="ps-card-body"><div class="ps-metrics">'+rowsArr.join('')+'</div></div></div>';
}
// One metric: label (left) + big number + delta badge (right).
function metric(label,n,badge,tone){
  return '<div class="ps-metric'+(tone?(' m-'+tone):'')+'">'+
    '<span class="ps-metric-l">'+label+'</span>'+
    '<span class="ps-metric-r"><span class="ps-metric-n">'+n+'</span>'+badge+'</span>'+
  '</div>';
}
// A plain titled section card (for the defect trends block).
function sectionCard(icon,title,bodyHtml){
  return '<div class="ps-card">'+
    '<div class="ps-card-head"><span class="ps-card-ic">'+ic(icon,18)+'</span><span class="ps-card-title">'+title+'</span></div>'+
    '<div class="ps-card-body">'+bodyHtml+'</div></div>';
}
// A defect group row: a status pill + a set of "tag  badge" items (no sentences).
function defectRow(tone,tag,items){
  return '<div class="ps-trend-row '+tone+'">'+
    '<span class="ps-tag '+tone+'">'+tag+'</span>'+
    '<div class="ps-defitems">'+items.join('')+'</div>'+
  '</div>';
}
function defectItem(name,badge){
  return '<span class="ps-defitem"><span class="ps-defitem-n">'+name+'</span>'+badge+'</span>';
}

var PS_ACTIVE='weekly';           // currently-shown pane
var PS_RANGES={ weekly:'', monthly:'' }; // live date-range labels, set in render()
var PS_DATA={ weekly:null, monthly:null }; // fetched { current, previous, mtdSlaPct } per period
function psSwitch(which){
  PS_ACTIVE=which;
  ['weekly','monthly'].forEach(function(k){
    var t=document.getElementById('psTab-'+k), pane=document.getElementById('psPane-'+k);
    if(t) t.classList.toggle('on',k===which);
    if(pane) pane.classList.toggle('on',k===which);
  });
  var lbl=document.getElementById('psExportLbl'); if(lbl) lbl.textContent='Export '+(which==='weekly'?'Weekly':'Monthly');
}
window.psSwitch=psSwitch;

// Data-driven plain-text summary for Export. `p` = 'WoW' | 'MoM', D = { current, previous }, mtd = MTD SLA %.
function psSummaryText(kind,p,rangeTxt,D,mtd){
  var over=(p==='WoW')?'week over week':'month over month';
  var within=(p==='WoW')?'within the week':'within the month';
  var c=D.current, pv=D.previous;
  var pt=function(a,b){ return pctText(a,b); };
  var slaPct=(Math.round((c.slaPct||0)*10)/10)+'%';
  var mtdPct=(Math.round((mtd||0)*10)/10)+'%';
  // Group defects into improving/watch like the UI does.
  var improving=[], watch=[];
  PS_DEFECTS.forEach(function(d){ var k=d[0],n=d[1],cv=(c.defects&&c.defects[k])||0,pvv=(pv.defects&&pv.defects[k])||0;
    (cv>pvv?watch:improving).push(n+' ('+pt(cv,pvv)+' '+p+')'); });
  var defImp=improving.length?('\u2022 Improving: '+improving.join(' and ')+'.\n'):'';
  var defWatch=watch.length?('\u2022 Watch Item: '+watch.join(' and ')+' \u2014 an opportunity area. Customer and driver outreach, performed by LMIR, directly supports mitigating actions such as driver notes, delivery GEO pin updates, and parcel box instructions for low-severity incidents.\n'):'';
  return 'PHD '+kind+' Performance Summary ('+rangeTxt+')\n\n'+
    'Volume & Throughput: PHD received '+num(c.reports)+' incident reports ('+pt(c.reports,pv.reports)+' '+p+') and resolved '+num(c.resolved)+' ('+pt(c.resolved,pv.resolved)+' '+p+'), '+
      'netting '+num(c.backlog)+' cases to the backlog ('+pt(c.backlog,pv.backlog)+' '+over+'). SLA performance was '+slaPct+' for cases '+
      'resolved '+within+', with MTD SLA at '+mtdPct+'.\n\n'+
    'Quality \u2014 Repeat Incidents: Total repeat incidents were '+num(c.repeat.total)+' ('+pt(c.repeat.total,pv.repeat.total)+' '+p+') \u2014 '+num(c.repeat.nonPet)+' non-pet related ('+pt(c.repeat.nonPet,pv.repeat.nonPet)+' '+p+') and '+num(c.repeat.pet)+' pet related ('+pt(c.repeat.pet,pv.repeat.pet)+' '+p+').\n\n'+
    'Defect Code Trends:\n'+defImp+defWatch+'\n'+
    'Address Exclusions & GEO Pins: '+num(c.addressExclusions)+' address exclusions were processed ('+pt(c.addressExclusions,pv.addressExclusions)+' '+p+') alongside '+num(c.geoPins)+' GEO Pin updates ('+pt(c.geoPins,pv.geoPins)+' '+p+'). '+
      'GEO Pins are critical to setting accurate Road Entry Points (REP) and delivery points, ensuring transporters can '+
      'complete deliveries safely via the Rabbit app.';
}
// Export (copy) the summary for whichever period is currently selected.
async function psExport(){
  var isWk=(PS_ACTIVE==='weekly');
  var D=PS_DATA[PS_ACTIVE];
  if(!D){ return; }  // data not loaded yet
  var txt=psSummaryText(isWk?'Weekly':'Monthly', isWk?'WoW':'MoM', PS_RANGES[PS_ACTIVE]||'', D, D.mtdSlaPct);
  var btn=document.getElementById('psExport'), lbl=document.getElementById('psExportLbl');
  try{
    await navigator.clipboard.writeText(txt);
    if(lbl){ var prev=lbl.textContent; lbl.textContent='Copied!'; if(btn)btn.classList.add('ok'); setTimeout(function(){ lbl.textContent=prev; if(btn)btn.classList.remove('ok'); },1600); }
  }catch(e){
    // Clipboard blocked -> fall back to a selectable prompt.
    window.prompt('Copy the '+(isWk?'weekly':'monthly')+' summary:', txt);
  }
}
window.psExport=psExport;

// ===== Fancy phased loader (ported from the SLA-breach section loaders) =====
function psFirstName(){ try{ var u=A.getUser&&A.getUser(); var n=(u&&(u.username||u.displayName||u.name))||''; return String(n).split(/[@\s]/)[0]||'there'; }catch(e){ return 'there'; } }
function psShuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
// PHASE 1 — 20 performance-themed lines (no agent names), personalized + period-aware.
function psPhase1(win){
  var me=psFirstName();
  return psShuffle([
    ['clock',       'Pulling the '+win+' numbers for you, '+me+' \u2728'],
    ['inbox',       'Counting reports received '+win+'\u2026'],
    ['check-circle','Tallying tickets resolved '+win+'\u2026'],
    ['target',      'Checking SLA compliance (240-hour rule)\u2026'],
    ['bar-chart',   'Measuring the backlog delta\u2026'],
    ['repeat',      'Finding repeat incidents\u2026'],
    ['repeat',      'Splitting pet vs non-pet repeats\u2026'],
    ['alert',       'Scanning defect-code trends\u2026'],
    ['map-pin',     'Counting address exclusions\u2026'],
    ['map-pin',     'Counting GEO pin updates\u2026'],
    ['calendar',    'Comparing against the previous '+win+'\u2026'],
    ['bar-chart',   'Computing week-over-week changes\u2026'],
    ['check-circle','Verifying resolution times\u2026'],
    ['inbox',       'Reconciling created vs resolved\u2026'],
    ['target',      'Re-checking the SLA window\u2026'],
    ['clock',       'Measuring month-to-date SLA\u2026'],
    ['repeat',      'Reviewing first-contact resolution\u2026'],
    ['bar-chart',   'Sorting defects into improving vs watch\u2026'],
    ['clock',       'Warming up the numbers, '+me+'\u2026'],
    ['check-circle','Almost there \u2014 assembling the summary\u2026'],
  ]);
}
// PHASE 2 — after the apology, 10 lines at 3s (loops).
function psPhase2(win){
  var me=psFirstName();
  return psShuffle([
    ['clock',       'Still working on it \u2014 thanks for your patience, '+me+'\u2026'],
    ['inbox',       'The server is taking a little longer than usual\u2026'],
    ['bar-chart',   'Re-checking the '+win+' figures to be sure\u2026'],
    ['target',      'Hang tight \u2014 re-verifying SLA compliance\u2026'],
    ['repeat',      'Reconciling the repeat-incident counts\u2026'],
    ['map-pin',     'One more pass over exclusions and GEO pins\u2026'],
    ['check-circle','Polishing the last few numbers\u2026'],
    ['calendar',    'Finalising the period comparison\u2026'],
    ['bar-chart',   'Nearly ready \u2014 wrapping up the totals\u2026'],
    ['clock',       'Appreciate the wait \u2014 almost done\u2026'],
  ]);
}
var _psTimers={};  // pfx -> interval id
function _psSet(pfx,tuple){
  var e=document.getElementById(pfx+'LoaderMsg'), i=document.getElementById(pfx+'LoaderIc');
  if(i){ i.innerHTML=ic(tuple[0]||'clock',30); }
  if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent=tuple[1]; e.classList.add('gw-msg-in'); }
}
function _psStop(pfx){ if(_psTimers[pfx]){ clearInterval(_psTimers[pfx]); _psTimers[pfx]=null; } }
function _psStart(pfx,win){
  _psStop(pfx);
  var p1=psPhase1(win), i=0; _psSet(pfx,p1[0]);
  _psTimers[pfx]=setInterval(function(){
    i++;
    if(i<p1.length){ _psSet(pfx,p1[i]); return; }
    _psStop(pfx);
    _psSet(pfx,['alert','Sorry for the delay \u2014 still crunching the numbers\u2026']);
    setTimeout(function(){
      var p2=psPhase2(win), j=0; _psSet(pfx,p2[0]);
      _psTimers[pfx]=setInterval(function(){ j=(j+1)%p2.length; _psSet(pfx,p2[j]); },3000);
    },3000);
  },2000);
}
function _psSuccess(pfx){
  _psStop(pfx);
  var l=document.getElementById(pfx+'Loader'); if(l) l.classList.add('gw-done');
  var i=document.getElementById(pfx+'LoaderIc'); if(i) i.innerHTML=ic('check-circle',30);
  var e=document.getElementById(pfx+'LoaderMsg'); if(e){ e.classList.remove('gw-msg-in'); void e.offsetWidth; e.textContent='Data fetched successfully'; e.classList.add('gw-msg-in'); }
}
var _psDelay=function(ms){ return new Promise(function(res){ setTimeout(res,ms); }); };

// Fetch one window's stats. The API's `to` is EXCLUSIVE, so pass (end + 1 day).
function nextDay(d){ var x=new Date(d); x.setDate(x.getDate()+1); return x; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function fetchWindow(range){
  var r=await A.api('GET','/api/perf-summary?from='+ymd(range.start)+'&to='+ymd(nextDay(range.end)));
  if(r&&r.ok&&r.data&&r.data.current) return r.data;
  throw new Error((r&&r.data&&r.data.error)||'fetch failed');
}
// Loading pane: hero + the phased orb loader (keyed by pfx). Animation started by the caller.
function loadingPane(kind,rangeTxt,pfx){
  return '<div class="ps-hero"><h1>'+ic('clipboard',24)+'PHD '+kind+' Performance Summary</h1>'+
    '<div class="ps-range">'+ic('calendar',15)+rangeTxt+'</div></div>'+
    '<div id="'+pfx+'Loader" class="gw-loader">'+
      '<div class="gw-loader-in">'+
        '<div class="gw-orb"><span class="gw-orb-ic" id="'+pfx+'LoaderIc">'+ic('clock',30)+'</span></div>'+
        '<div class="gw-loader-msg gw-msg-in" id="'+pfx+'LoaderMsg">Getting the numbers ready\u2026</div>'+
        '<div class="gw-dots"><span></span><span></span><span></span></div>'+
        '<div class="gw-loader-sub" id="'+pfx+'LoaderSub">'+kind+' summary</div>'+
      '</div>'+
    '</div>';
}

async function render(){
  var now=new Date();
  var wk=lastCompletedWeek(now), mo=previousMonth(now);
  var wkTxt=rangeLabel(wk);
  var moTxt=MON[mo.start.getMonth()]+' '+mo.start.getFullYear()+'  \u00b7  '+rangeLabel(mo);
  PS_RANGES={ weekly:wkTxt, monthly:moTxt };
  // Shell with loading placeholders in both panes.
  document.getElementById('wrap').innerHTML=
    '<div class="ps-toolbar">'+
      '<div class="ps-tabs">'+
        '<button type="button" class="ps-tab on" id="psTab-weekly" onclick="psSwitch(\'weekly\')">'+ic('calendar',15)+'Weekly</button>'+
        '<button type="button" class="ps-tab" id="psTab-monthly" onclick="psSwitch(\'monthly\')">'+ic('calendar',15)+'Monthly</button>'+
      '</div>'+
      '<button type="button" class="ps-export" id="psExport" onclick="psExport()">'+ic('copy',15)+'<span id="psExportLbl">Export Weekly</span></button>'+
    '</div>'+
    '<div class="ps-pane on" id="psPane-weekly">'+loadingPane('Weekly',wkTxt,'psW')+'</div>'+
    '<div class="ps-pane" id="psPane-monthly">'+loadingPane('Monthly',moTxt,'psM')+'</div>';

  // Start the phased loader animation in both panes.
  _psStart('psW','week'); _psStart('psM','month');
  var t0=Date.now();
  var minHold=function(){ var el=1500-(Date.now()-t0); return el>0?_psDelay(el):Promise.resolve(); };

  // Fetch both windows in parallel; on each result show the success beat (~1s) then reveal.
  var fill=function(pfx,paneId,kind,per,txt,win){
    fetchWindow(win).then(async function(D){
      PS_DATA[kind.toLowerCase()]=D;
      await minHold();
      _psSuccess(pfx); await _psDelay(900);
      var el=document.getElementById(paneId); if(el) el.innerHTML=summaryPane(kind,per,txt,D,D.mtdSlaPct);
    }).catch(function(){
      _psStop(pfx);
      var el=document.getElementById(paneId); if(el) el.innerHTML='<div class="ps-gate" style="padding:40px"><p style="color:#dc2626">Could not load '+kind.toLowerCase()+' data. Please refresh.</p></div>';
    });
  };
  fill('psW','psPane-weekly','Weekly','WoW',wkTxt,wk);
  fill('psM','psPane-monthly','Monthly','MoM',moTxt,mo);
}

(function init(){
  if(!A||!A.getUser||!A.getUser()||!A.getToken()){ try{A.clear&&A.clear();}catch(e){} location.replace('index.html'); return; }
  render();
})();
</script>
