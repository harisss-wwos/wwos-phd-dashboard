<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paging Contacts · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shimmer.css">
<style>
:root{--o:#ec7211;--oh:#c85f0e;--t:#2a3340;--tm:#5c6773;--bd:#e2e7eb;--gl:#1f9d57;--rl:#dc2626;--tl:#2591ad;--card:#fff;--cardh:#f5fbfd;--inp:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#f3f5f7;color:var(--t);min-height:100vh}
/* Keep the static fallback bar's box (no layout jump) but invisible, so the shared toolbar (with the
   hamburger, injected by topbar-auth.js) is the only bar the user sees — no hamburger-less flash. */
.top-bar{background:#121820;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;visibility:hidden}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#1b2026;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#fff;border-radius:8px;font-weight:700;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.btn.sec{background:#fff;border:1px solid var(--bd);color:var(--t)}
.tools-subnav{background:#fff;border-bottom:1px solid var(--bd);padding:0 24px;display:flex;gap:4px;flex-wrap:wrap}
.tools-subnav a{padding:12px 16px;color:var(--tm);text-decoration:none;font-size:.88em;font-weight:600;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tools-subnav a:hover{color:#1b2026}
.tools-subnav a.active{color:var(--o);border-bottom-color:var(--o)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.btn.mini{padding:5px 12px;font-size:.78em}
.wrap{width:90%;max-width:1400px;margin:0 auto;padding:40px 24px}
h1{color:#1b2026;font-size:1.7em;margin-bottom:6px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:22px}
.btn.mini{padding:5px 12px;font-size:.78em}
.btn.danger{background:#fff;border:1px solid rgba(220,38,38,.4);color:var(--rl)}
.btn.danger:hover{background:#fef2f2}
.copied{color:var(--gl)!important;border-color:rgba(31,157,87,.5)!important}
.msg{font-size:.85em;margin-top:10px;display:none}.msg.err{color:var(--rl)}.msg.ok{color:var(--gl)}
.edit-area input{width:100%;background:var(--inp);border:1px solid var(--bd);border-radius:8px;color:#1b2026;font-size:.9em;padding:10px 12px;font-family:inherit}
.edit-area input:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(236,114,17,.14)}
.edit-area label{display:block;color:var(--tm);font-size:.8em;font-weight:700;margin:10px 0 6px}
/* Header row: title left, actions right */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.page-head h1{margin:0}
.page-head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Stacked list of expandable, click-to-copy paging cards (copies the EMAIL) */
.pg-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start}
@media(max-width:760px){.pg-list{grid-template-columns:1fr}}
.pg-card{position:relative;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--tl);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,30,50,.05);transition:border-color .15s,background .15s,box-shadow .15s}
.pg-card:hover{border-color:var(--tl);background:var(--cardh);box-shadow:0 4px 14px -6px rgba(37,145,173,.3)}
/* View toggle button */
.pg-view{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-family:inherit;font-size:.82em;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid var(--bd);background:#fff;color:var(--t);flex-shrink:0}
.pg-view:hover{border-color:var(--tl);color:var(--tl)}
.pg-card.show .pg-view{border-color:var(--tl);color:var(--tl);background:#eef9fc}
.pg-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pg-headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.pg-title{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.pg-country{color:#1b2026;font-weight:700;font-size:1.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pg-count{display:inline-flex;align-items:center;gap:4px;background:#eef9fc;color:#1577a0;border:1px solid #bfe3ee;border-radius:20px;padding:2px 9px;font-size:.7em;font-weight:800;flex-shrink:0}
.pg-count svg{width:12px;height:12px}
.pg-code{color:#5c6773;font-weight:800;font-size:.75em;background:#f0f3f6;border:1px solid #e2e7eb;padding:2px 8px;border-radius:20px;flex-shrink:0}
.pg-copy{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-family:inherit;font-size:.82em;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid var(--tl);background:var(--tl);color:#fff;flex-shrink:0}
.pg-copy:hover{filter:brightness(1.08)}
.pg-copy.copied{background:var(--gl);border-color:var(--gl);color:#fff}
.pg-content{max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s ease,margin .2s ease;margin-top:0}
.pg-card.show .pg-content{max-height:300px;opacity:1;margin-top:12px}
.pg-content .pg-email{color:#1577a0;font-size:.92em;word-break:break-all;border-top:1px solid #eef1f4;padding-top:12px}
.pg-admin{display:flex;gap:8px;margin-top:12px}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,45,.55);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border:1px solid var(--bd);border-radius:14px;width:50vw;max-width:50vw;min-width:min(92vw,420px);padding:24px;box-shadow:0 24px 60px -20px rgba(20,40,70,.5)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.modal-head h2{color:#1b2026;font-size:1.05em;font-weight:800}
.modal-close{background:transparent;border:none;color:var(--tm);font-size:1.6em;line-height:1;cursor:pointer;padding:0 4px}
.modal-close:hover{color:#1b2026}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1b2026;border:1px solid #1b2026;color:#fff;padding:10px 18px;border-radius:10px;font-size:.85em;z-index:2200;opacity:0;transition:opacity .2s;box-shadow:0 10px 30px -10px rgba(20,40,70,.5)}
.toast.show{opacity:1}

/* Global: main content spans 90% of the viewport at all sizes. */
.wrap,.content{width:auto!important;max-width:none!important;margin-left:15px!important;margin-right:15px!important}

/* ---- Illustrated gradient banner header (matches the live dashboard section banners) ---- */
.tool-banner{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-radius:16px;padding:16px 22px;min-height:78px;margin-bottom:8px;
  border:1px solid #242a31;box-shadow:0 12px 30px -20px rgba(0,0,0,.75);
  background-size:200% 100%;animation:toolBanner 9s ease infinite}
@keyframes toolBanner{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.tool-banner .tb-left{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.tool-banner .tb-title{margin:0;display:inline-flex;align-items:center;gap:11px;font-size:1.5em;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.tool-banner .tb-title svg{flex-shrink:0}
.tool-banner .tb-sub{font-size:.86em;font-weight:500;line-height:1.4;max-width:60ch}
.tool-banner .page-head-actions{position:relative;z-index:1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tool-banner::after{content:"";position:absolute;top:0;bottom:0;right:0;width:260px;
  background-repeat:no-repeat;background-position:right center;background-size:auto 118%;opacity:.32;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%)}
.tool-banner .btn{background:rgba(10,12,15,.82);color:#fff;border:1px solid rgba(255,255,255,.14)}
.tool-banner .btn:hover{background:rgba(10,12,15,.92);border-color:rgba(255,255,255,.28)}
.tool-banner .btn.sec{background:rgba(255,255,255,.14);color:#0e1013;border:1px solid rgba(255,255,255,.35);font-weight:700}
.tool-banner .btn.sec:hover{background:rgba(255,255,255,.24);color:#0e1013}
/* Paging Contacts — teal/green gradient, dark-ink title, mail + globe illustration. */
.tool-banner.tb-paging{background:linear-gradient(90deg,#0d9488,#2dd4bf 55%,#8ef0e2)}
.tool-banner.tb-paging .tb-title,.tool-banner.tb-paging .tb-title svg{color:#06322d}
.tool-banner.tb-paging .tb-sub{color:rgba(6,50,45,.78)}
.tool-banner.tb-paging::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="26" y="22" width="52" height="36" rx="5"/><path d="M26 26l26 18 26-18"/><circle cx="96" cy="40" r="15"/><path d="M81 40h30M96 25a24 24 0 0 1 0 30M96 25a24 24 0 0 0 0 30"/></svg>')}
@media(max-width:640px){.tool-banner .tb-title{font-size:1.25em}.tool-banner::after{opacity:.22}}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=4">
</head>
<body data-nav-active="tools" data-back-href="tools.html" data-back-label="PHD Tools">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="tools-subnav">
  <a href="tool-blurbs.html">Common Blurbs</a>
  <a href="tool-hashtags.html">Hashtags</a>
  <a href="tool-paging.html" class="active">Paging Contacts</a>
  <a href="tool-prompts.html">Prompt</a>
</div>
<div class="wrap" id="wrap">
  <div class="sk-wrap"><div class="shimmer sk-title"></div><div class="shimmer sk-sub"></div><div class="shimmer sk-card" style="min-height:280px"></div></div>
</div>
<div class="toast" id="toast"></div>

<!-- Add region popup (admin+) -->
<div class="modal-bg" id="addModal" onclick="if(event.target===this)closeAddModal()">
  <div class="modal">
    <div class="modal-head"><h2>➕ Add Region</h2><button class="modal-close" onclick="closeAddModal()" aria-label="Close">&times;</button></div>
    <div class="edit-area">
      <label>Country</label>
      <input type="text" id="newCountry" placeholder="e.g. Brazil">
      <label>Code</label>
      <input type="text" id="newCode" placeholder="e.g. BR">
      <label>Email</label>
      <input type="text" id="newEmail" placeholder="e.g. sds-ecr-adhoc@amazon.com.br">
      <div class="msg err" id="addErr"></div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
        <button class="btn sec" onclick="closeAddModal()">Cancel</button>
        <button class="btn" onclick="addContact()">Add region</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit region popup (admin+) -->
<div class="modal-bg" id="editModal" onclick="if(event.target===this)closeEditModal()">
  <div class="modal">
    <div class="modal-head"><h2>Edit Region</h2><button class="modal-close" onclick="closeEditModal()" aria-label="Close">&times;</button></div>
    <div class="edit-area">
      <label>Country</label>
      <input type="text" id="editCountry">
      <label>Code</label>
      <input type="text" id="editCode">
      <label>Email</label>
      <input type="text" id="editEmail">
      <div class="msg err" id="editErr"></div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:space-between">
        <button class="btn danger" onclick="confirmDelete()">Delete</button>
        <div style="display:flex;gap:10px">
          <button class="btn sec" onclick="closeEditModal()">Cancel</button>
          <button class="btn" onclick="saveEdit()">Save changes</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Confirm delete popup -->
<div class="modal-bg" id="confirmModal" onclick="if(event.target===this)closeConfirm()" style="z-index:2100">
  <div class="modal" style="max-width:440px">
    <div class="modal-head"><h2 style="color:#ff5252">Delete region?</h2><button class="modal-close" onclick="closeConfirm()" aria-label="Close">&times;</button></div>
    <p id="confirmText" style="color:var(--t);font-size:.9em;line-height:1.6;margin:6px 0 4px"></p>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn sec" onclick="closeConfirm()">Cancel</button>
      <button class="btn danger" onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=99"></script>
<script>
const A=window.PHDAuth;
let CONTACTS=[];
const canAdd=()=>A.canEditTools&&A.canEditTools();
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// Browser cache (stale-while-revalidate) — paging contacts change rarely.
const CACHE_KEY='phd_paging_cache';
function readCache(){try{const raw=localStorage.getItem(CACHE_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}}
function writeCache(arr){try{localStorage.setItem(CACHE_KEY,JSON.stringify(arr));}catch(e){}}

async function load(){
  let paintedFromCache=false;
  const cached=readCache();
  if(Array.isArray(cached)&&cached.length){CONTACTS=cached;render();paintedFromCache=true;}
  const r=await A.api('GET','/api/paging');
  if(!r.ok){ if(!paintedFromCache)document.getElementById('wrap').innerHTML='<h1>Paging Contacts</h1><p class="sub" style="color:#ff5252">Could not load contacts (HTTP '+r.status+').</p>'; return; }
  const fresh=Array.isArray(r.data)?r.data:[];
  writeCache(fresh);
  const changed=JSON.stringify(fresh)!==JSON.stringify(CONTACTS);
  CONTACTS=fresh;
  if(!paintedFromCache||changed)render();
}

function render(){
  const admin=canAdd();
  const copyIcon='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  // Header: title left, actions (Add + edit log) right.
  // Illustrated gradient banner header (title + sub on the left, actions on the right).
  let html='<div class="tool-banner tb-paging">'
    +'<div class="tb-left">'
      +'<h1 class="tb-title">'+(window.icon?window.icon('mail',24):'')+' Paging Contacts</h1>'
      +'<div class="tb-sub">SDS ECR paging contacts by region. Copy an email with one click.'+(admin?' As an admin you can add, edit, or delete a region.':'')+'</div>'
    +'</div>'
    +'<div class="page-head-actions">'
      +(admin?'<button class="btn" onclick="openAddModal()">➕ Add Region</button>':'')
      +'<a class="btn sec" href="paging-log.html">'+(window.icon?window.icon('history',15):'')+' Paging edit log</a>'
    +'</div>'
  +'</div>';
  // Expandable, click-to-copy cards. Copies the EMAIL; hover reveals the email detail.
  html+=`<div class="pg-list">`+CONTACTS.map((c,i)=>`
    <div class="pg-card" id="pgcard-${i}">
      <div class="pg-headrow">
        <div class="pg-title"><span class="pg-count" id="count-${i}" title="Times copied">${copyIcon}<span class="pg-count-n">${c.copyCount||0}</span></span><span class="pg-country">${esc(c.country)}</span><span class="pg-code">${esc(c.code)}</span></div>
        <div class="pg-actions">
          <button class="pg-view" id="viewCard-${i}" onclick="toggleView(${i},event)" title="Show / hide the email"><span>View</span></button>
          <button class="pg-copy" id="copyBtn-${i}" onclick="copyEmail(${i},event)" title="Copy email">${copyIcon}<span>Copy</span></button>
        </div>
      </div>
      <div class="pg-content">
        <div class="pg-email">${esc(c.email)}</div>
        ${admin?`<div class="pg-admin"><button class="btn sec mini" onclick="event.stopPropagation();openEditModal(${i})">Edit</button></div>`:''}
      </div>
    </div>`).join('')+`</div>`;
  document.getElementById('wrap').innerHTML=html;
}

// Expand/collapse a card's email via the View button. Accordion: only one open at a time.
function toggleView(i,ev){
  if(ev)ev.stopPropagation();
  const card=document.getElementById('pgcard-'+i);
  if(!card)return;
  const willOpen=!card.classList.contains('show');
  document.querySelectorAll('.pg-card.show').forEach(c=>{
    if(c!==card){c.classList.remove('show');const b=c.querySelector('.pg-view span');if(b)b.textContent='View';}
  });
  card.classList.toggle('show',willOpen);
  const label=card.querySelector('.pg-view span');if(label)label.textContent=willOpen?'Hide':'View';
}

// Copy the EMAIL (via the Copy button).
function copyEmail(i,ev){
  if(ev)ev.stopPropagation();
  const text=CONTACTS[i].email;
  const done=()=>{const btn=document.getElementById('copyBtn-'+i);if(btn){const s=btn.querySelector('span');const old=s?s.textContent:'';if(s)s.textContent='Copied';btn.classList.add('copied');setTimeout(()=>{if(s)s.textContent=old;btn.classList.remove('copied');},1600);}toast('Email copied to clipboard');recordCopy(i);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));}
  else fallbackCopy(text,done);
}

// Record a copy on the server (logged-in only) and bump the on-screen count badge.
function recordCopy(i){
  const c=CONTACTS[i];if(!c||!c.id)return;
  if(!(A.getUser&&A.getUser())||!(A.getToken&&A.getToken()))return;
  A.api('POST','/api/paging/'+c.id+'/copy',{}).then(r=>{
    if(r&&r.ok&&r.data&&typeof r.data.copyCount==='number'){
      c.copyCount=r.data.copyCount;
      const el=document.querySelector('#count-'+i+' .pg-count-n');if(el)el.textContent=c.copyCount;
    }
  }).catch(()=>{});
}
function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();done();}

function openAddModal(){document.getElementById('addModal').style.display='flex';document.getElementById('newCountry').value='';document.getElementById('newCode').value='';document.getElementById('newEmail').value='';document.getElementById('addErr').style.display='none';setTimeout(()=>document.getElementById('newCountry').focus(),40);}
function closeAddModal(){document.getElementById('addModal').style.display='none';}
async function addContact(){
  const country=document.getElementById('newCountry').value.trim();
  const code=document.getElementById('newCode').value.trim();
  const email=document.getElementById('newEmail').value.trim();
  const err=document.getElementById('addErr');
  if(!country||!code||!email){err.textContent='Country, code, and email are all required.';err.style.display='block';return;}
  const r=await A.api('POST','/api/paging',{country,code,email});
  if(r.ok){closeAddModal();toast('Region added');await load();}
  else{err.textContent=(r.data&&r.data.error)||('Failed (HTTP '+r.status+')');err.style.display='block';}
}

// ----- Edit / delete (admin) -----
let EDIT_INDEX=null;
function openEditModal(i){
  EDIT_INDEX=i;const c=CONTACTS[i];
  document.getElementById('editCountry').value=c.country;
  document.getElementById('editCode').value=c.code;
  document.getElementById('editEmail').value=c.email;
  document.getElementById('editErr').style.display='none';
  document.getElementById('editModal').style.display='flex';
  setTimeout(()=>document.getElementById('editCountry').focus(),40);
}
function closeEditModal(){document.getElementById('editModal').style.display='none';EDIT_INDEX=null;}
async function saveEdit(){
  if(EDIT_INDEX==null)return;const c=CONTACTS[EDIT_INDEX];
  const country=document.getElementById('editCountry').value.trim();
  const code=document.getElementById('editCode').value.trim();
  const email=document.getElementById('editEmail').value.trim();
  const err=document.getElementById('editErr');
  if(!country||!code||!email){err.textContent='Country, code, and email are all required.';err.style.display='block';return;}
  const r=await A.api('PUT','/api/paging/'+c.id,{country,code,email});
  if(r.ok){closeEditModal();toast('Region updated');await load();}
  else{err.textContent=(r.data&&r.data.error)||('Failed (HTTP '+r.status+')');err.style.display='block';}
}
function confirmDelete(){
  if(EDIT_INDEX==null)return;const c=CONTACTS[EDIT_INDEX];
  document.getElementById('confirmText').innerHTML='Delete the paging contact for <b>'+esc(c.country)+' ('+esc(c.code)+')</b>? This cannot be undone.';
  document.getElementById('confirmModal').style.display='flex';
}
function closeConfirm(){document.getElementById('confirmModal').style.display='none';}
async function doDelete(){
  if(EDIT_INDEX==null)return;const c=CONTACTS[EDIT_INDEX];
  const r=await A.api('DELETE','/api/paging/'+c.id);
  closeConfirm();
  if(r.ok){closeEditModal();toast('Region deleted');await load();}
  else{toast((r.data&&r.data.error)||('Delete failed (HTTP '+r.status+')'));}
}

load();
</script>
</body>
</html>
