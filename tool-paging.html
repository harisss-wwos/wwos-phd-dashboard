<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paging Contacts · WWOS-GSOC PHD Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shimmer.css">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252;--tl:#44b9d6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#000;border-radius:6px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.tools-subnav{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:0 24px;display:flex;gap:4px;flex-wrap:wrap}
.tools-subnav a{padding:12px 16px;color:var(--tm);text-decoration:none;font-size:.88em;font-weight:600;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tools-subnav a:hover{color:#fff}
.tools-subnav a.active{color:var(--o);border-bottom-color:var(--o)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.btn.mini{padding:5px 12px;font-size:.78em}
.wrap{width:80%;max-width:1000px;margin:0 auto;padding:40px 24px}
h1{color:#fff;font-size:1.7em;margin-bottom:6px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:22px}
.btn.mini{padding:5px 12px;font-size:.78em}
.btn.danger{background:transparent;border:1px solid rgba(255,82,82,.5);color:var(--rl)}
.btn.danger:hover{background:rgba(255,82,82,.12)}
.copied{color:var(--gl)!important;border-color:rgba(74,222,128,.5)!important}
.msg{font-size:.85em;margin-top:10px;display:none}.msg.err{color:var(--rl)}.msg.ok{color:var(--gl)}
.edit-area input{width:100%;background:#000;border:1px solid var(--bd);border-radius:8px;color:#fff;font-size:.9em;padding:10px 12px;font-family:inherit}
.edit-area label{display:block;color:var(--tm);font-size:.8em;margin:10px 0 6px}
/* Header row: title left, actions right */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.page-head h1{margin:0}
.page-head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Stacked list of expandable, click-to-copy paging cards (copies the EMAIL) */
.pg-list{display:flex;flex-direction:column;gap:14px}
.pg-card{position:relative;background:#0a0a0a;border:1px solid var(--bd);border-left:3px solid var(--tl);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s,background .15s}
.pg-card:hover{border-color:var(--tl);background:#0d0d0d}
.pg-headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pg-title{display:flex;align-items:center;gap:10px;min-width:0}
.pg-country{color:#fff;font-weight:600;font-size:1.02em}
.pg-code{color:var(--tm);font-weight:700;font-size:.75em;background:rgba(255,255,255,.06);padding:2px 8px;border-radius:20px;flex-shrink:0}
.pg-copy{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-family:inherit;font-size:.82em;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid var(--tl);background:var(--tl);color:#000;flex-shrink:0}
.pg-copy:hover{filter:brightness(1.08)}
.pg-copy.copied{background:var(--gl);border-color:var(--gl);color:#000}
.pg-content{max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s ease,margin .2s ease;margin-top:0}
.pg-card:hover .pg-content,.pg-card.show .pg-content{max-height:300px;opacity:1;margin-top:12px}
.pg-content .pg-email{color:#44b9d6;font-size:.92em;word-break:break-all;border-top:1px solid var(--bd);padding-top:12px}
.pg-admin{display:flex;gap:8px;margin-top:12px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;max-width:480px;width:100%;padding:24px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.modal-head h2{color:var(--o);font-size:1.05em;font-weight:700}
.modal-close{background:transparent;border:none;color:var(--tm);font-size:1.6em;line-height:1;cursor:pointer;padding:0 4px}
.modal-close:hover{color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0a0a0a;border:1px solid var(--gl);color:var(--gl);padding:10px 18px;border-radius:8px;font-size:.85em;z-index:2200;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body data-nav-active="tools">
<div class="top-bar">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>
<div class="tools-subnav">
  <a href="tool-blurbs.html">Common Blurbs</a>
  <a href="tool-hashtags.html">Hashtags</a>
  <a href="tool-paging.html" class="active">Paging Contacts</a>
</div>
<div class="wrap" id="wrap">
  <div class="sk-wrap"><div class="shimmer sk-title"></div><div class="shimmer sk-sub"></div><div class="shimmer sk-card" style="min-height:280px"></div></div>
</div>
<div class="toast" id="toast"></div>

<!-- Add region popup (admin+) -->
<div class="modal-bg" id="addModal" onclick="if(event.target===this)closeAddModal()">
  <div class="modal">
    <div class="modal-head"><h2>➕ Add Region</h2><button class="modal-close" onclick="closeAddModal()" aria-label="Close">&times;</button></div>
    <div class="edit-area">
      <label>Country</label>
      <input type="text" id="newCountry" placeholder="e.g. Brazil">
      <label>Code</label>
      <input type="text" id="newCode" placeholder="e.g. BR">
      <label>Email</label>
      <input type="text" id="newEmail" placeholder="e.g. sds-ecr-adhoc@amazon.com.br">
      <div class="msg err" id="addErr"></div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">
        <button class="btn sec" onclick="closeAddModal()">Cancel</button>
        <button class="btn" onclick="addContact()">Add region</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit region popup (admin+) -->
<div class="modal-bg" id="editModal" onclick="if(event.target===this)closeEditModal()">
  <div class="modal">
    <div class="modal-head"><h2>Edit Region</h2><button class="modal-close" onclick="closeEditModal()" aria-label="Close">&times;</button></div>
    <div class="edit-area">
      <label>Country</label>
      <input type="text" id="editCountry">
      <label>Code</label>
      <input type="text" id="editCode">
      <label>Email</label>
      <input type="text" id="editEmail">
      <div class="msg err" id="editErr"></div>
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:space-between">
        <button class="btn danger" onclick="confirmDelete()">Delete</button>
        <div style="display:flex;gap:10px">
          <button class="btn sec" onclick="closeEditModal()">Cancel</button>
          <button class="btn" onclick="saveEdit()">Save changes</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Confirm delete popup -->
<div class="modal-bg" id="confirmModal" onclick="if(event.target===this)closeConfirm()" style="z-index:2100">
  <div class="modal" style="max-width:440px">
    <div class="modal-head"><h2 style="color:#ff5252">Delete region?</h2><button class="modal-close" onclick="closeConfirm()" aria-label="Close">&times;</button></div>
    <p id="confirmText" style="color:var(--t);font-size:.9em;line-height:1.6;margin:6px 0 4px"></p>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn sec" onclick="closeConfirm()">Cancel</button>
      <button class="btn danger" onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js"></script>
<script>
const A=window.PHDAuth;
let CONTACTS=[];
const canAdd=()=>A.atLeast&&A.atLeast('admin');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

async function load(){
  const r=await A.api('GET','/api/paging');
  if(!r.ok){document.getElementById('wrap').innerHTML='<h1>Paging Contacts</h1><p class="sub" style="color:#ff5252">Could not load contacts (HTTP '+r.status+').</p>';return;}
  CONTACTS=Array.isArray(r.data)?r.data:[];
  render();
}

function render(){
  const admin=canAdd();
  const copyIcon='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  // Header: title left, actions (Add + edit log) right.
  let html='<div class="page-head"><h1>Paging Contacts</h1><div class="page-head-actions">'
    +(admin?'<button class="btn" onclick="openAddModal()">➕ Add Region</button>':'')
    +'<a class="btn sec" href="paging-log.html">'+(window.icon?window.icon('history',15):'')+' Paging edit log</a>'
    +'</div></div>';
  html+='<p class="sub">SDS ECR paging contacts by region. Copy an email with one click.'+(admin?' As an admin you can add, edit, or delete a region.':'')+'</p>';
  // Expandable, click-to-copy cards. Copies the EMAIL; hover reveals the email detail.
  html+=`<div class="pg-list">`+CONTACTS.map((c,i)=>`
    <div class="pg-card" id="pgcard-${i}" onclick="copyEmail(${i},event)" title="Click to copy ${esc(c.email)}">
      <div class="pg-headrow">
        <div class="pg-title"><span class="pg-country">${esc(c.country)}</span><span class="pg-code">${esc(c.code)}</span></div>
        <button class="pg-copy" id="copyBtn-${i}" onclick="copyEmail(${i},event)" title="Copy email">${copyIcon}<span>Copy</span></button>
      </div>
      <div class="pg-content">
        <div class="pg-email">${esc(c.email)}</div>
        ${admin?`<div class="pg-admin"><button class="btn sec mini" onclick="event.stopPropagation();openEditModal(${i})">Edit</button></div>`:''}
      </div>
    </div>`).join('')+`</div>`;
  document.getElementById('wrap').innerHTML=html;
}

// Copy the EMAIL (clicking the card or the Copy button).
function copyEmail(i,ev){
  if(ev)ev.stopPropagation();
  const text=CONTACTS[i].email;
  const done=()=>{const btn=document.getElementById('copyBtn-'+i);if(btn){const s=btn.querySelector('span');const old=s?s.textContent:'';if(s)s.textContent='Copied';btn.classList.add('copied');setTimeout(()=>{if(s)s.textContent=old;btn.classList.remove('copied');},1600);}toast('Email copied to clipboard');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));}
  else fallbackCopy(text,done);
}
function fallbackCopy(text,done){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();done();}

function openAddModal(){document.getElementById('addModal').style.display='flex';document.getElementById('newCountry').value='';document.getElementById('newCode').value='';document.getElementById('newEmail').value='';document.getElementById('addErr').style.display='none';setTimeout(()=>document.getElementById('newCountry').focus(),40);}
function closeAddModal(){document.getElementById('addModal').style.display='none';}
async function addContact(){
  const country=document.getElementById('newCountry').value.trim();
  const code=document.getElementById('newCode').value.trim();
  const email=document.getElementById('newEmail').value.trim();
  const err=document.getElementById('addErr');
  if(!country||!code||!email){err.textContent='Country, code, and email are all required.';err.style.display='block';return;}
  const r=await A.api('POST','/api/paging',{country,code,email});
  if(r.ok){closeAddModal();toast('Region added');await load();}
  else{err.textContent=(r.data&&r.data.error)||('Failed (HTTP '+r.status+')');err.style.display='block';}
}

// ----- Edit / delete (admin) -----
let EDIT_INDEX=null;
function openEditModal(i){
  EDIT_INDEX=i;const c=CONTACTS[i];
  document.getElementById('editCountry').value=c.country;
  document.getElementById('editCode').value=c.code;
  document.getElementById('editEmail').value=c.email;
  document.getElementById('editErr').style.display='none';
  document.getElementById('editModal').style.display='flex';
  setTimeout(()=>document.getElementById('editCountry').focus(),40);
}
function closeEditModal(){document.getElementById('editModal').style.display='none';EDIT_INDEX=null;}
async function saveEdit(){
  if(EDIT_INDEX==null)return;const c=CONTACTS[EDIT_INDEX];
  const country=document.getElementById('editCountry').value.trim();
  const code=document.getElementById('editCode').value.trim();
  const email=document.getElementById('editEmail').value.trim();
  const err=document.getElementById('editErr');
  if(!country||!code||!email){err.textContent='Country, code, and email are all required.';err.style.display='block';return;}
  const r=await A.api('PUT','/api/paging/'+c.id,{country,code,email});
  if(r.ok){closeEditModal();toast('Region updated');await load();}
  else{err.textContent=(r.data&&r.data.error)||('Failed (HTTP '+r.status+')');err.style.display='block';}
}
function confirmDelete(){
  if(EDIT_INDEX==null)return;const c=CONTACTS[EDIT_INDEX];
  document.getElementById('confirmText').innerHTML='Delete the paging contact for <b>'+esc(c.country)+' ('+esc(c.code)+')</b>? This cannot be undone.';
  document.getElementById('confirmModal').style.display='flex';
}
function closeConfirm(){document.getElementById('confirmModal').style.display='none';}
async function doDelete(){
  if(EDIT_INDEX==null)return;const c=CONTACTS[EDIT_INDEX];
  const r=await A.api('DELETE','/api/paging/'+c.id);
  closeConfirm();
  if(r.ok){closeEditModal();toast('Region deleted');await load();}
  else{toast((r.data&&r.data.error)||('Delete failed (HTTP '+r.status+')'));}
}

load();
</script>
</body>
</html>
