<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groups Page (owner tool) · WWOS-GSOC PHD</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252;--tl:#44b9d6;--yl:#fbbf24;--pl:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:26px;width:auto;display:block}
.logo span{font-size:1.05em;font-weight:700;color:#fff}
.wrap{width:auto;max-width:none;margin:0;padding:20px 0}
h1{color:#fff;font-size:1.6em;margin-bottom:6px}
/* Top-level collapsible section cards (Incident type / Resolutions). */
.section-card{margin-bottom:20px}
.section-title{font-size:1.15em!important;color:#fff!important;text-transform:none!important;letter-spacing:0!important}
.sub{color:var(--tm);font-size:.9em;margin-bottom:8px;line-height:1.5}
.warn-banner{background:rgba(255,153,0,.1);border:1px solid rgba(255,153,0,.35);color:var(--o);border-radius:8px;padding:10px 14px;font-size:.82em;margin:14px 0 22px;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;background:transparent;color:var(--o);border:1px solid var(--o);border-radius:6px;font-weight:600;font-size:.85em;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,153,0,.12)}
.btn.sec{color:var(--o);border-color:var(--bd)}
.btn.sec:hover{border-color:var(--o);background:rgba(255,153,0,.1)}
.btn.primary{background:var(--o);color:#000}
.btn.primary:hover{background:var(--oh)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--rl);border-color:rgba(255,82,82,.4)}
.btn.danger:hover{background:rgba(255,82,82,.12)}
.gate{text-align:center;padding:70px 0}.gate p{color:var(--tm);margin-bottom:18px}
.spinner{width:42px;height:42px;border:4px solid var(--bd);border-top-color:var(--o);border-radius:50%;animation:spin 1s linear infinite;margin:60px auto}
@keyframes spin{100%{transform:rotate(360deg)}}
/* Two-column layout: source list (left) + groups editor (right). Preview below. */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.card{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;padding:18px 18px}
.card h2{color:var(--o);font-size:.9em;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.card .hint{color:#5f6b6c;font-size:.78em;margin-bottom:12px}
/* Collapsible top-level cards: click the h2 to hide/show the whole body (incl. tables). */
.card-toggle{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;margin-bottom:12px!important}
.card-caret{display:inline-block;color:var(--o);transition:transform .18s ease}
.card.collapsed .card-caret{transform:rotate(-90deg)}
.card.collapsed .card-body{display:none}
.card.collapsed h2{margin-bottom:0!important}
/* Source raw-type list */
.src-tools{display:flex;gap:8px;margin-bottom:10px}
.src-tools input{flex:1;background:#000;border:1px solid var(--bd);border-radius:6px;color:#fff;font-size:.85em;padding:8px 10px}
.src-tools input:focus{outline:none;border-color:var(--o)}
.src-list{max-height:380px;overflow:auto;border:1px solid #1b2530;border-radius:8px}
/* Collapsible per-quarter source section */
.sec-panel{border:1px solid #1b2530;border-radius:8px;margin-bottom:10px;overflow:hidden}
.sec-head{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0d1620;border:none;color:var(--t);cursor:pointer;font-size:.88em;text-align:left}
.sec-head:hover{background:#111e2b}
.sec-caret{color:var(--o);font-size:.9em;width:14px;flex-shrink:0}
.sec-title{flex:1;font-weight:700;color:#fff}
.sec-meta{color:var(--tm);font-size:.82em;font-variant-numeric:tabular-nums}
.sec-panel .src-tools{margin:10px 10px 8px}
.sec-panel .src-list{margin:0 10px 10px;max-height:340px}
.src-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;font-size:.86em}
.src-row:last-child{border-bottom:none}
.src-row:hover{background:rgba(255,255,255,.03)}
.src-row.assigned{opacity:.5}
.src-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--o);flex-shrink:0}
.src-row .st-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.src-row .st-count{color:var(--tm);font-variant-numeric:tabular-nums;font-size:.9em}
.src-row .st-in{color:var(--pl);font-size:.72em;font-weight:700;white-space:nowrap}
.assign-bar{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.assign-bar select{flex:1;min-width:140px;background:#000;border:1px solid var(--bd);border-radius:6px;color:#fff;font-size:.85em;padding:8px 10px}
/* Groups editor */
.grp{border:1px solid #1b2530;border-radius:8px;padding:12px 14px;margin-bottom:12px;background:#000}
.grp-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.grp-head input{flex:1;background:#0a0a0a;border:1px solid var(--bd);border-radius:6px;color:#fff;font-weight:600;font-size:.9em;padding:8px 10px}
.grp-head input:focus{outline:none;border-color:var(--o)}
.grp-members{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4);color:var(--pl);border-radius:20px;padding:3px 10px;font-size:.76em}
.chip button{background:none;border:none;color:var(--pl);cursor:pointer;font-size:1.1em;line-height:1;padding:0}
.grp-empty{color:#5f6b6c;font-size:.78em;font-style:italic}
.new-grp{display:flex;gap:8px;margin-top:6px}
.new-grp input{flex:1;background:#000;border:1px solid var(--bd);border-radius:6px;color:#fff;font-size:.85em;padding:8px 10px}
.new-grp input:focus{outline:none;border-color:var(--o)}
/* Preview */
.preview{margin-top:24px}
.inc-sub-h{display:flex;align-items:center;gap:8px;font-size:.95em;font-weight:700;color:#d5dbdb;margin:14px 0 8px}
.inc-sub-h .n{font-weight:800;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;font-size:.85em}
table{width:100%;border-collapse:collapse;font-size:.86em}
.xls-table{border:1px solid #2f3a45}
.xls-table th,.xls-table td{border:1px solid #2f3a45;padding:7px 11px}
th{color:var(--tm);text-transform:uppercase;letter-spacing:.4px;font-size:.78em;text-align:left}
.grouped-row{background:rgba(167,139,250,.08);cursor:help}
.grouped-row:hover{background:rgba(167,139,250,.16)}
.grouped-row td:nth-child(2){color:var(--pl);font-weight:700}
/* Hover tooltip listing a group's member types + counts (chart-style). */
.grp-tip{position:fixed;z-index:4000;display:none;pointer-events:none;background:#0d1620;border:1px solid var(--pl);border-radius:8px;padding:8px 10px;width:fit-content;max-width:480px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:.82em}
.grp-tip-h{color:var(--pl);font-weight:800;border-bottom:1px solid rgba(167,139,250,.35);padding-bottom:6px;margin-bottom:6px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.grp-tip-h span{color:#fff;font-variant-numeric:tabular-nums}
.grp-tip-row{display:flex;justify-content:space-between;gap:14px;padding:2px 0}
.grp-tip-t{color:var(--t);white-space:nowrap}
/* Clickable non-grouped preview rows */
.clickable-row{cursor:pointer}
.clickable-row:hover{background:rgba(255,153,0,.08)}
/* Tickets popup (Excel-style) */
.tk-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:5000;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.tk-card{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;width:80vw;max-width:80vw;padding:18px 18px 14px}
.tk-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}
.tk-head h2{color:var(--o);font-size:1.1em;display:flex;align-items:baseline;gap:10px}
.tk-count{color:var(--tm);font-size:.7em;font-weight:600}
.tk-loading{display:flex;justify-content:center;padding:40px}
.tk-scroll{overflow-x:auto;max-height:60vh;overflow-y:auto;border:1px solid #2f3a45;border-radius:6px}
.tk-table{width:100%;border-collapse:collapse}
.tk-table th{position:sticky;top:0;background:#0d1620;z-index:1}
.tk-table td,.tk-table th{border:1px solid #2f3a45;padding:7px 11px;font-size:.86em}
.tk-table a{color:var(--tl);text-decoration:none;font-weight:600}
.tk-table a:hover{text-decoration:underline}
.tk-pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tk-pageinfo{color:var(--tm);font-size:.82em;font-variant-numeric:tabular-nums}
.tk-pgbtns{display:flex;gap:6px}
.tk-pgbtns .btn{padding:5px 10px;font-size:.8em}
.grp-tip-c{color:#9aa7a8;font-variant-numeric:tabular-nums;flex-shrink:0}
.actions-bar{display:flex;gap:10px;align-items:center;margin:20px 0;flex-wrap:wrap}
.msg{font-size:.85em;display:none}
.msg.err{color:var(--rl)}.msg.ok{color:var(--gl)}
.bar-cell{display:flex;align-items:center}
.bar-cell>div{height:8px;border-radius:4px;background:#ff9900;min-width:4px}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body data-no-toolbar="true">
<div class="wrap" id="wrap">
  <div class="spinner"></div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js"></script>
<script>
const A=window.PHDAuth;
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isOwner=()=>A.role&&A.role()==='owner';

// Two source lists (one per quarter). RAW is the MERGED list (dedup by type, summed counts) used
// for the preview + memberIndex, so grouping a Q2-only type still previews.
let RAW_Q3=[], RAW_Q2=[];
let RAW=[];        // merged [{type,count}] across both quarters shown
let GROUPS=[];     // [{name, members:[rawType]}] working copy
let VERSION=0;     // last-loaded server version
let SEL=new Set(); // currently-checked raw types
let FILTER='';     // filter text for the combined source list
const Q_IDS=['2026-Q2','2026-Q3']; // quarters combined (1 Apr 2026 onward)
let RES=[];        // [{type,count}] distinct resolution values (Q2+Q3, resolved/closed), exact
let RES_FILTER=''; // filter text for the resolutions list
// Resolution grouping (independent from incident-type grouping above).
let RGROUPS=[];    // [{name, members:[rawValue]}] working copy for resolutions
let RVERSION=0;    // last-loaded resolution-group server version
let RSEL=new Set();// checked resolution values

// Merge the two per-quarter lists into RAW (dedup by type, sum counts).
function rebuildMerged(){
  const m={};
  RAW_Q3.forEach(r=>{m[r.type]=(m[r.type]||0)+r.count;});
  RAW_Q2.forEach(r=>{m[r.type]=(m[r.type]||0)+r.count;});
  RAW=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([type,count])=>({type,count}));
}

function gate(msg){document.getElementById('wrap').innerHTML='<div class="gate"><h1>Groups Page</h1><p>'+esc(msg)+'</p><a class="btn" href="index.html">Go to Home</a></div>';}

// lowercased raw type -> group name (for "assigned" markers + preview relabel).
function memberIndex(){
  const idx={};
  GROUPS.forEach(g=>{ (g.members||[]).forEach(m=>{ idx[m]=g.name; }); });
  return idx;
}

// lowercased raw resolution value -> group name.
function resMemberIndex(){
  const idx={};
  RGROUPS.forEach(g=>{ (g.members||[]).forEach(m=>{ idx[m]=g.name; }); });
  return idx;
}

// ---- Local draft persistence: keep in-progress (unpublished) groups across page reloads. ----
const DRAFT_KEY='phdGroupsDraft';
function saveDraft(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(GROUPS)); }catch(e){} }
function loadDraft(){ try{ const s=localStorage.getItem(DRAFT_KEY); const a=s?JSON.parse(s):null; return Array.isArray(a)?a:null; }catch(e){ return null; } }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
// Separate draft store for resolution groups.
const RDRAFT_KEY='phdResolutionGroupsDraft';
function saveRDraft(){ try{ localStorage.setItem(RDRAFT_KEY, JSON.stringify(RGROUPS)); }catch(e){} }
function loadRDraft(){ try{ const s=localStorage.getItem(RDRAFT_KEY); const a=s?JSON.parse(s):null; return Array.isArray(a)?a:null; }catch(e){ return null; } }
function clearRDraft(){ try{ localStorage.removeItem(RDRAFT_KEY); }catch(e){} }

async function boot(){
  if(!A.getUser()||!A.getToken()){gate('Please log in to use this tool.');return;}
  if(!(A.canGroupingPage&&A.canGroupingPage())){gate('You do not have access to the Grouping Page.');return;}
  try{
    const [q2R,q3R,resR,grpR,rgrpR]=await Promise.all([
      A.api('GET','/api/incident-types/raw?q=2026-Q2'),
      A.api('GET','/api/incident-types/raw?q=2026-Q3'),
      A.api('GET','/api/resolutions/raw?q='+encodeURIComponent(Q_IDS.join(','))),
      A.api('GET','/api/incident-groups'),
      A.api('GET','/api/resolution-groups'),
    ]);
    if(!q3R.ok&&!q2R.ok){gate('Could not load incident types.');return;}
    RAW_Q3=(q3R.ok&&q3R.data&&q3R.data.types)||[];
    RAW_Q2=(q2R.ok&&q2R.data&&q2R.data.types)||[];
    RES=(resR.ok&&resR.data&&resR.data.types)||[];
    rebuildMerged();
    const serverGroups=((grpR.ok&&grpR.data&&grpR.data.groups)||[]).map(g=>({name:g.name,members:(g.members||[]).slice()}));
    VERSION=(grpR.ok&&grpR.data&&grpR.data.version)||0;
    const serverRGroups=((rgrpR.ok&&rgrpR.data&&rgrpR.data.groups)||[]).map(g=>({name:g.name,members:(g.members||[]).slice()}));
    RVERSION=(rgrpR.ok&&rgrpR.data&&rgrpR.data.version)||0;
    // Prefer a locally-saved draft (unpublished edits) over the server's published groups, so a page
    // reload never loses in-progress work. "Reload saved" discards the draft and restores the server copy.
    const draft=loadDraft();
    GROUPS = draft ? draft : serverGroups;
    const rdraft=loadRDraft();
    RGROUPS = rdraft ? rdraft : serverRGroups;
    render();
    if(draft||rdraft) flash('ok','Restored your unsaved draft. Use "Reload saved" to discard it.');
  }catch(e){gate('Could not load the tool. '+esc(e.message||''));}
}

function render(){
  const wrap=document.getElementById('wrap');
  wrap.innerHTML=`
    <p class="sub">Combine raw values into one display name. This only relabels what's shown — the underlying ticket data is never changed. Publish to save. Each section below expands/collapses independently.</p>
    <div class="warn-banner">${ic('alert',15)} Owner-only. This page isn't linked anywhere. Changes are saved only when you click a <b>&nbsp;Publish</b> button.</div>

    <!-- ============ SECTION 1: INCIDENT TYPE ============ -->
    <div class="card section-card" id="secIncident">
      <h2 class="card-toggle section-title" onclick="toggleCard('secIncident')"><span class="card-caret">&#9662;</span> Incident type</h2>
      <div class="card-body">
        <div class="actions-bar">
          <button class="btn primary" id="publishBtn" onclick="publish()">${ic('check-circle',15)} Publish (v${VERSION} &rarr; v${VERSION+1})</button>
          <button class="btn sec" onclick="reloadFromServer()">${ic('refresh',15)} Reload saved</button>
          <button class="btn danger" onclick="clearAll()">Clear all groups</button>
          <span class="msg err" id="err"></span><span class="msg ok" id="ok"></span>
        </div>
        <div class="cols">
          <div class="card" style="background:#000">
            <h2>Raw incident types</h2>
            <div class="card-body">
              <div class="hint">Incident types from <b>1 Apr 2026 onward</b> (Q2 + Q3 combined; counts total across both quarters). Check the ones to combine, then assign them to a group.</div>
              <div id="srcSection"></div>
              <div class="assign-bar">
                <select id="assignTarget"></select>
                <button class="btn" onclick="assignSelected()">Add checked &rarr;</button>
              </div>
            </div>
          </div>
          <div class="card" style="background:#000">
            <h2>Groups</h2>
            <div class="card-body">
              <div class="hint">Each group becomes one row on the dashboard. Unassigned types keep their original name.</div>
              <div id="grpList"></div>
              <div class="new-grp">
                <input id="newGrpName" placeholder="New group name (e.g. Pet Incidents)" onkeydown="if(event.key==='Enter')addGroup()">
                <button class="btn" onclick="addGroup()">${ic('plus',14)} Add group</button>
              </div>
            </div>
          </div>
        </div>
        <div class="preview" style="margin-top:16px">
          <h2 style="color:var(--o);font-size:.9em;text-transform:uppercase;letter-spacing:.5px">Preview</h2>
          <p class="hint" style="color:#5f6b6c;font-size:.8em;margin-bottom:6px">How the combined Incident Types list will look (overall, all resolved+unresolved this quarter). Grouped rows are highlighted.</p>
          <div id="previewBox"></div>
        </div>
      </div>
    </div>

    <!-- ============ SECTION 2: RESOLUTIONS ============ -->
    <div class="card section-card" id="secRes" style="margin-top:20px">
      <h2 class="card-toggle section-title" onclick="toggleCard('secRes')"><span class="card-caret">&#9662;</span> Resolutions</h2>
      <div class="card-body">
        <div class="hint">The <b>Resolution</b> value recorded in each ticket's details (from 1 Apr 2026 onward, Q2 + Q3, resolved/closed only). Exact values. Grouping here is separate from incident-type grouping.</div>
        <div class="actions-bar">
          <button class="btn primary" id="rPublishBtn" onclick="rPublish()">${ic('check-circle',15)} Publish resolutions (v${RVERSION} &rarr; v${RVERSION+1})</button>
          <button class="btn sec" onclick="rReloadFromServer()">${ic('refresh',15)} Reload saved</button>
          <button class="btn danger" onclick="rClearAll()">Clear all groups</button>
          <span class="msg err" id="rErr"></span><span class="msg ok" id="rOk"></span>
        </div>
        <div class="cols">
          <div class="card" style="background:#000">
            <h2>Resolution values</h2>
            <div class="card-body">
              <div class="hint">Check the ones to combine, then assign them to a group.</div>
              <div id="resSection"></div>
              <div class="assign-bar">
                <select id="rAssignTarget"></select>
                <button class="btn" onclick="rAssignSelected()">Add checked &rarr;</button>
              </div>
            </div>
          </div>
          <div class="card" style="background:#000">
            <h2>Resolution groups</h2>
            <div class="card-body">
              <div class="hint">Each group becomes one combined resolution. Unassigned values keep their original name.</div>
              <div id="rGrpList"></div>
              <div class="new-grp">
                <input id="rNewGrpName" placeholder="New group name (e.g. Driver Follow-up)" onkeydown="if(event.key==='Enter')rAddGroup()">
                <button class="btn" onclick="rAddGroup()">${ic('plus',14)} Add group</button>
              </div>
            </div>
          </div>
        </div>
        <div class="preview" style="margin-top:16px">
          <h2 style="color:var(--o);font-size:.9em;text-transform:uppercase;letter-spacing:.5px">Resolutions preview</h2>
          <p class="hint" style="color:#5f6b6c;font-size:.8em;margin-bottom:6px">Combined resolutions (Q2 + Q3, resolved/closed). Grouped rows are highlighted; hover for the breakdown, or click a non-grouped row for its tickets.</p>
          <div id="rPreviewBox"></div>
        </div>
      </div>
    </div>`;
  paintSourceList();
  paintGroups();
  paintPreview();
  paintResolutions();
  paintRGroups();
  paintRPreview();
}

// Filtering updates ONLY the row container (not the whole section), so the filter input keeps focus.
function onFilter(v){ FILTER=v; paintRows(); }
// Collapse/expand a whole top-level card (its body incl. tables) by id.
function toggleCard(id){ const el=document.getElementById(id); if(el)el.classList.toggle('collapsed'); }
// Build the filtered row HTML for the combined source list (Q2 + Q3, merged counts).
function rowsHtml(){
  const idx=memberIndex();
  const f=(FILTER||'').trim().toLowerCase();
  const rows=RAW.filter(r=>!f||r.type.toLowerCase().includes(f)).map(r=>{
    const inGrp=idx[r.type];
    const checked=SEL.has(r.type)?' checked':'';
    return '<label class="src-row'+(inGrp?' assigned':'')+'">'+
      '<input type="checkbox" data-t="'+esc(r.type)+'"'+checked+' onchange="toggleSel(this)">'+
      '<span class="st-name" title="'+esc(r.type)+'">'+esc(r.type)+'</span>'+
      (inGrp?'<span class="st-in">in: '+esc(inGrp)+'</span>':'')+
      '<span class="st-count">'+r.count.toLocaleString()+'</span>'+
    '</label>';
  }).join('');
  return rows||'<div style="padding:14px;color:#5f6b6c;font-size:.82em">No matching types.</div>';
}

// Update only the row list (keeps the filter input + its focus intact while typing).
function paintRows(){ const el=document.getElementById('rows-combined'); if(el)el.innerHTML=rowsHtml(); }

// Paint the single combined source section (Q2 + Q3 from 1 Apr 2026).
function paintSourceList(){
  const host=document.getElementById('srcSection');
  if(host){
    const total=RAW.reduce((n,r)=>n+r.count,0);

function grpTipMove(ev){

  try{ members=JSON.parse(tr.getAttribute('data-members')||'[]'); }catch(e){}
  const name=tr.getAttribute('data-grpname')||'Group';
  const tip=grpTip();

async function publish(){

  const seen={};
  for(const g of GROUPS){

    for(const mmb of g.members){ if(seen[mmb]){flash('err','"'+mmb+'" is in more than one group.');return;} seen[mmb]=true; }
  }
  const groups=GROUPS.filter(g=>g.members.length).map(g=>({name:g.name.trim(),members:g.members}));
  btn.disabled=true;
  const r=await A.api('PUT','/api/incident-groups',{groups});
  btn.disabled=false;
  if(r.ok){
    VERSION=(r.data&&r.data.version)||VERSION+1;
    saveDraft(); // keep the local draft in sync with what was just published
    flash('ok','Published. Now live for everyone (v'+VERSION+'). The dashboard shows it on next load.');

async function reloadFromServer(){

  const r=await A.api('GET','/api/incident-groups');

    VERSION=(r.data&&r.data.version)||0;
    SEL.clear();
    clearDraft(); // discard the local draft — server copy is now the working state
    render();
    flash('ok','Reloaded the saved grouping (v'+VERSION+'). Draft discarded.');
  }else flash('err','Could not reload.');
}

function flash(kind,msg){
  const el=document.getElementById(kind==='err'?'err':'ok');
  const other=document.getElementById(kind==='err'?'ok':'err');
  if(other)other.style.display='none';
  if(!el)return;el.textContent=msg;el.style.display='inline';
  setTimeout(()=>{el.style.display='none';},5000);
}
function ic(n,s){return window.icon?window.icon(n,s||14):'';}

// expose handlers
window.onFilter=onFilter;window.toggleCard=toggleCard;window.toggleSel=toggleSel;window.addGroup=addGroup;window.assignSelected=assignSelected;
window.renameGroup=renameGroup;window.removeMember=removeMember;window.removeGroup=removeGroup;window.clearAll=clearAll;
window.publish=publish;window.reloadFromServer=reloadFromServer;

boot();
</script>
