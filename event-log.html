<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Ticket Movements · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shimmer.css">
<style>
:root{--o:#ff9900;--oh:#ec7211;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--gl:#4ade80;--rl:#ff5252}
.spinner{width:44px;height:44px;border:4px solid var(--bd);border-top-color:var(--o);border-radius:50%;animation:spin .9s linear infinite;margin:40px auto}
@keyframes spin{100%{transform:rotate(360deg)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.15em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#000;border-radius:6px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.btn.mini{padding:5px 11px;font-size:.76em}
.wrap{max-width:1200px;margin:0 auto;padding:36px 24px 80px}
h1{color:#fff;font-size:1.6em;margin-bottom:6px;display:inline-flex;align-items:center;gap:10px}
.sub{color:var(--tm);font-size:.9em;margin-bottom:22px;line-height:1.6}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gl);box-shadow:0 0 8px var(--gl);animation:pulse 1.6s ease-in-out infinite;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* Toolbar row: refresh state + testing tools */
.el-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
.el-meta{color:var(--tm);font-size:.82em}
.el-meta b{color:#d5dbdb}
.el-spacer{margin-left:auto}
/* Status count chips */
.el-counts{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.el-chip{display:flex;flex-direction:column;gap:3px;min-width:96px;background:#0b0f14;border:1px solid #23303c;border-radius:10px;padding:10px 14px}
.el-chip .n{color:#fff;font-size:1.4em;font-weight:800;line-height:1}
.el-chip .l{color:var(--tm);font-size:.7em;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.el-chip.total{border-color:var(--o)}
/* Two-column layout: board + timeline */
.el-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.el-grid{grid-template-columns:1fr}}
.el-card{background:#0a0a0a;border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.el-card h2{color:#fff;font-size:1.02em;font-weight:600;padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.el-card h2 .c{margin-left:auto;color:var(--tm);font-size:.72em;font-weight:600;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:20px;padding:2px 10px}
/* Status board table */
.el-scroll{overflow-x:auto}
.el-table{width:100%;border-collapse:collapse;font-size:.86em}
.el-table th,.el-table td{padding:9px 14px;text-align:left;border-bottom:1px solid #1b2530;white-space:nowrap}
.el-table thead th{color:var(--tm);font-size:.72em;text-transform:uppercase;letter-spacing:.4px;font-weight:700;background:#0d1319;position:sticky;top:0}
.el-table tbody tr:hover td{background:rgba(255,153,0,.05)}
.el-id a{color:#44b9d6;text-decoration:none;font-weight:700}
.el-id a:hover{text-decoration:underline}
.el-title{color:var(--tm);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el-ago{color:var(--tm);font-size:.92em}
/* Status pill — colored per status */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74em;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.s-open{color:#9fb0b8;background:rgba(159,176,184,.14);border-color:rgba(159,176,184,.35)}
.pill.s-assigned{color:#60a5fa;background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.35)}
.pill.s-wip{color:#fbbf24;background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.35)}
.pill.s-researching{color:#a78bfa;background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.35)}
.pill.s-pending{color:#f472b6;background:rgba(244,114,182,.14);border-color:rgba(244,114,182,.35)}
.pill.s-resolved{color:#4ade80;background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.35)}
.pill.s-closed{color:#44b9d6;background:rgba(68,185,214,.14);border-color:rgba(68,185,214,.35)}
.pill.s-other{color:#879596;background:rgba(135,149,150,.14);border-color:rgba(135,149,150,.35)}
/* Timeline feed */
.el-feed{max-height:620px;overflow-y:auto;padding:6px 0}
.el-ev{display:flex;gap:12px;padding:11px 18px;border-bottom:1px solid #141c24}
.el-ev:last-child{border-bottom:none}
.el-ev-dot{flex-shrink:0;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--o)}
.el-ev-body{min-width:0;flex:1}
.el-ev-line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.el-ev-id{color:#44b9d6;font-weight:700;font-size:.88em}
.el-ev-title{color:var(--tm);font-size:.8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.el-ev-line2{color:var(--tm);font-size:.76em;margin-top:3px}
.el-ev-line2 b{color:#d5dbdb}
.empty{text-align:center;color:var(--tm);padding:36px;font-size:.9em}
.gate{text-align:center;padding:50px 0}.gate p{color:var(--tm);margin-bottom:18px}
/* Simulate tool */
.el-sim{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#0b0f14;border:1px dashed #2f3a45;border-radius:10px;padding:10px 12px}
.el-sim input,.el-sim select{background:#000;border:1px solid var(--bd);border-radius:6px;color:#fff;font-size:.82em;padding:6px 9px;font-family:inherit}
.el-sim input{width:120px}
.el-sim .lbl{color:var(--tm);font-size:.76em}
/* Global: main content spans 90% of the viewport at all sizes. */
.wrap,.content{width:90%!important;max-width:none!important;margin-left:auto!important;margin-right:auto!important}
</style>
</head>
<body data-nav-active="event-log" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="visibility:hidden">
  <a class="logo" href="index.html"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a>
</div>

<div class="wrap" id="wrap">
  <h1><span class="live-dot"></span> Live Ticket Movements</h1>
  <p class="sub">Real-time feed of ticket status changes from LM-HUB (Assigned → Work In Progress → Pending → … → Closed).
  This is an <b>isolated tracker</b> — it does not affect the live dashboard data.</p>
  <div class="spinner"></div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js"></script>
<script>
const A=window.PHDAuth;
let EL_TIMER=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function gate(msg){ if(EL_TIMER)clearInterval(EL_TIMER); document.getElementById('wrap').innerHTML='<div class="gate"><h1>Live Ticket Movements</h1><p>'+msg+'</p><a class="btn" href="app.html">Go to Live Dashboard</a></div>'; }

// Map a status string to a pill css class.
function statusClass(s){
  const k=String(s||'').toLowerCase();
  if(k==='open')return 's-open';
  if(k==='assigned')return 's-assigned';
  if(k==='work in progress'||k==='wip')return 's-wip';
  if(k==='researching')return 's-researching';
  if(k==='pending')return 's-pending';
  if(k==='resolved')return 's-resolved';
  if(k==='closed')return 's-closed';
  return 's-other';
}
function pill(s){ return '<span class="pill '+statusClass(s)+'">'+esc(s||'—')+'</span>'; }

// "3m ago" style relative time.
function ago(iso){
  const t=Date.parse(iso); if(isNaN(t))return '';
  let s=Math.max(0,Math.floor((Date.now()-t)/1000));
  if(s<60)return s+'s ago';
  let m=Math.floor(s/60); if(m<60)return m+'m ago';
  let h=Math.floor(m/60); if(h<24)return h+'h ago';
  let d=Math.floor(h/24); return d+'d ago';
}
function tlink(id){ return 'https://t.corp.amazon.com/'+encodeURIComponent(id); }

function shell(){
  return ''+
    '<h1><span class="live-dot"></span> Live Ticket Movements</h1>'+
    '<p class="sub">Real-time feed of ticket status changes from LM-HUB (Assigned → Work In Progress → Pending → … → Closed). '+
    'This is an <b>isolated tracker</b> — it does not affect the live dashboard data.</p>'+
    '<div class="el-bar">'+
      '<span class="el-meta" id="elMeta">Loading…</span>'+
      '<button class="btn sec mini" onclick="elRefresh()">'+(window.icon?window.icon('refresh',13):'')+' Refresh</button>'+
      '<span class="el-spacer"></span>'+
      '<div class="el-sim">'+
        '<span class="lbl">Simulate:</span>'+
        '<input id="simId" placeholder="Ticket ID" value="TEST-1001">'+
        '<select id="simStatus"><option>Open</option><option>Assigned</option><option>Work In Progress</option><option>Researching</option><option>Pending</option><option>Resolved</option><option>Closed</option></select>'+
        '<button class="btn mini" onclick="elSimulate()">Send event</button>'+
        '<button class="btn sec mini" onclick="elClear()" title="Clear all tracked events">Clear</button>'+
      '</div>'+
    '</div>'+
    '<div class="el-counts" id="elCounts"></div>'+
    '<div class="el-grid">'+
      '<div class="el-card"><h2>'+(window.icon?window.icon('grid',15):'')+' Current Status Board <span class="c" id="elBoardCount">0</span></h2><div class="el-scroll"><div id="elBoard"></div></div></div>'+
      '<div class="el-card"><h2>'+(window.icon?window.icon('clock-rewind',15):'')+' Event Timeline <span class="c" id="elTlCount">0</span></h2><div class="el-feed" id="elFeed"></div></div>'+
    '</div>';
}

function renderCounts(d){
  const order=d.tracked||['Open','Assigned','Work In Progress','Researching','Pending','Resolved','Closed'];
  let h='<div class="el-chip total"><span class="n">'+(d.totalTickets||0)+'</span><span class="l">Tickets tracked</span></div>';
  h+=order.map(function(s){ return '<div class="el-chip"><span class="n" style="color:var(--t)">'+((d.counts&&d.counts[s])||0)+'</span><span class="l">'+esc(s)+'</span></div>'; }).join('');
  document.getElementById('elCounts').innerHTML=h;
}

function renderBoard(states){
  const body=document.getElementById('elBoard');
  document.getElementById('elBoardCount').textContent=states.length;
  if(!states.length){ body.innerHTML='<div class="empty">No tickets tracked yet. Send a simulated event, or wait for LM-HUB to fire.</div>'; return; }
  const rows=states.map(function(s){
    return '<tr>'+
      '<td class="el-id"><a href="'+tlink(s.shortId)+'" target="_blank" rel="noopener">'+esc(s.shortId)+'</a></td>'+
      '<td>'+pill(s.status)+'</td>'+
      '<td class="el-title" title="'+esc(s.title||'')+'">'+esc(s.title||'—')+'</td>'+
      '<td>'+esc(s.assignee||'—')+'</td>'+
      '<td class="el-ago">'+ago(s.updatedAt||s.at)+'</td>'+
    '</tr>';
  }).join('');
  body.innerHTML='<table class="el-table"><thead><tr><th>Ticket</th><th>Status</th><th>Title</th><th>Assignee</th><th>Updated</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function renderFeed(timeline){
  const body=document.getElementById('elFeed');
  document.getElementById('elTlCount').textContent=timeline.length;
  if(!timeline.length){ body.innerHTML='<div class="empty">No events yet.</div>'; return; }
  body.innerHTML=timeline.map(function(e){
    const col={'s-open':'#9fb0b8','s-assigned':'#60a5fa','s-wip':'#fbbf24','s-researching':'#a78bfa','s-pending':'#f472b6','s-resolved':'#4ade80','s-closed':'#44b9d6','s-other':'#879596'}[statusClass(e.status)]||'#ff9900';
    return '<div class="el-ev">'+
      '<span class="el-ev-dot" style="background:'+col+'"></span>'+
      '<div class="el-ev-body">'+
        '<div class="el-ev-line1"><span class="el-ev-id">'+esc(e.shortId)+'</span> '+pill(e.status)+' <span class="el-ev-title" title="'+esc(e.title||'')+'">'+esc(e.title||'')+'</span></div>'+
        '<div class="el-ev-line2">'+(e.assignee?('<b>'+esc(e.assignee)+'</b> · '):'')+ago(e.receivedAt||e.at)+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

async function elLoad(silent){
  const r=await A.api('GET','/api/ticket-events?limit=300');
  if(r.status===401){ gate('Your session has expired. Please log in again.'); return; }
  if(!r.ok||!r.data){ if(!silent){ const m=document.getElementById('elMeta'); if(m)m.textContent='Could not load events.'; } return; }
  const d=r.data;
  renderCounts(d);
  renderBoard(d.states||[]);
  renderFeed(d.timeline||[]);
  const m=document.getElementById('elMeta');
  if(m)m.innerHTML='<b>'+(d.totalEvents||0)+'</b> events · <b>'+(d.totalTickets||0)+'</b> tickets · updated '+new Date().toLocaleTimeString();
}
function elRefresh(){ elLoad(false); }
window.elRefresh=elRefresh;

// --- Testing helpers (until the LM-HUB rule is live) ---
async function elSimulate(){
  const id=(document.getElementById('simId').value||'').trim(); const status=document.getElementById('simStatus').value;
  if(!id){ alert('Enter a ticket ID'); return; }
  // Posts directly to the webhook with the dev secret so we can see the pipeline end-to-end.
  const body={ secret:'phd-dev-hook-secret', shortId:id, status:status, title:'Simulated ticket '+id, assignee:(A.getUser()&&A.getUser().username)||'tester', at:new Date().toISOString() };
  try{
    const base=(window.PHD_API_BASE||'');
    const res=await fetch(base+'/api/hook/ticket-event',{method:'POST',headers:{'Content-Type':'application/json','x-hook-secret':'phd-dev-hook-secret'},body:JSON.stringify(body)});
    if(!res.ok){ const j=await res.json().catch(()=>({})); alert('Event rejected: '+(j.error||res.status)); return; }
    elLoad(false);
  }catch(e){ alert('Could not send event (is the API running?).'); }
}
window.elSimulate=elSimulate;
async function elClear(){
  if(!confirm('Clear ALL tracked events and states? (testing only)'))return;
  const r=await A.api('POST','/api/ticket-events/clear',{});
  if(r.ok)elLoad(false); else alert('Could not clear.');
}
window.elClear=elClear;

(function init(){
  if(!A||!A.getUser||!A.getUser()||!A.getToken()){ gate('This page is for logged-in admins. Please log in from the home page.'); return; }
  if(!A.atLeast||!A.atLeast('admin')){ gate('This page requires admin access.'); return; }
  document.getElementById('wrap').innerHTML=shell();
  elLoad(false);
  EL_TIMER=setInterval(function(){ elLoad(true); },15000);   // auto-refresh every 15s
})();
</script>
</body>
</html>
