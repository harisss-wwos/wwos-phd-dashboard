<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWOS-PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="shimmer.css">
<style>
:root{--o:#ff9900;--oh:#ec7211;--ol:#ffb84d;--bl:#2074d5;--bll:#44b9d6;--tl:#1b9cb0;--g:#1d8102;--gl:#3ecf4a;--r:#d13212;--rl:#ff5252;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--s:#000;--a1:#7dd3fc;--a2:#fbbf24;--b:#4ade80}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:flex-start;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.1em;font-weight:700;color:#fff;line-height:1}
.logo-link{text-decoration:none;cursor:pointer;transition:opacity .15s}
.logo-link:hover{opacity:.82}
.live-badge{font-size:.7em;font-weight:700;letter-spacing:.5px;color:#4ade80;background:rgba(74,222,128,.14);border:1px solid rgba(74,222,128,.4);border-radius:20px;padding:3px 12px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;animation:livepulse 2s ease-in-out infinite}
.live-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.62}}
/* Second row: toolbar holding all nav + action buttons */
/* Two explicit rows: nav on line 1, action buttons on line 2. */
.toolbar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:10px 24px;display:flex;flex-direction:column;align-items:stretch;gap:10px;position:sticky;top:53px;z-index:99}
.toolbar-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--bd)}
.nav-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Priority blink for BLACK / out-of-policy PURPLE ticket sections */
.blink-alert{animation:blinkAlert 1s ease-in-out infinite;border:1px solid rgba(255,82,82,.55)!important}
@keyframes blinkAlert{0%,100%{box-shadow:0 0 0 0 rgba(255,82,82,0);background:#0a0a0a}50%{box-shadow:0 0 14px 2px rgba(255,82,82,.5);background:rgba(255,82,82,.09)}}
.btn{display:inline-flex;align-items:center;padding:7px 16px;background:var(--o);color:#000;border-radius:4px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.btn.danger{background:var(--r);color:#fff}
.content{padding:24px;max-width:1600px;margin:0 auto}
.page-title{margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.page-title h1{font-size:1.8em;color:#fff;font-weight:700}
.page-title p{color:var(--tm);margin-top:4px;font-size:.9em}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.kpi-card{background:var(--s);border-radius:8px;padding:20px;text-align:center;border:1px solid var(--bd);border-top:3px solid var(--o)}
.kpi-card .value{font-size:2em;font-weight:700;color:#fff;margin-bottom:4px}
.kpi-card .label{font-size:.78em;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.kpi-card.accent .value{color:var(--o)}.kpi-card.success .value{color:var(--gl)}.kpi-card.warning .value{color:var(--ol)}.kpi-card.danger .value{color:var(--rl)}
.section{background:var(--s);border-radius:8px;padding:24px;margin-bottom:24px;border:1px solid var(--bd)}
.section h2{color:#fff;margin-bottom:18px;font-size:1.2em;font-weight:600;display:flex;align-items:center;gap:8px}
.section h2::before{content:'';display:inline-block;width:4px;height:20px;background:var(--o);border-radius:2px}
/* Collapsible sections */
.section.collapsible>h2{cursor:pointer;user-select:none;justify-content:space-between}
.section.collapsible>h2 .sec-caret{margin-left:auto;color:var(--tm);transition:transform .2s;font-size:.8em}
.section.collapsible.collapsed>h2{margin-bottom:0}
.section.collapsible.collapsed>h2 .sec-caret{transform:rotate(-90deg)}
.section.collapsible.collapsed>.sec-body{display:none}
/* Grouped chart pair section: two charts side by side, stacked on mobile */
.section .pair-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(max-width:920px){.section .pair-grid{grid-template-columns:1fr}}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:20px;margin-bottom:24px}
.chart-box{background:var(--s);border-radius:8px;padding:20px;border:1px solid var(--bd)}
.chart-box h3{color:#fff;margin-bottom:16px;text-align:center;font-size:.95em;font-weight:600}
.chart-wrap{position:relative;height:300px}
.chart-wrap.tall{height:340px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--bd);font-size:.88em}
th{background:#0a0a0a;color:var(--tm);font-weight:600;text-transform:uppercase;font-size:.75em;letter-spacing:.5px}
tr:hover{background:rgba(255,153,0,.03)}
.badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:.78em;font-weight:600}
.badge-g{background:rgba(62,207,74,.2);color:#3ecf4a;font-weight:700}
.badge-w{background:rgba(255,153,0,.15);color:var(--ol)}
.handoff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.handoff-box{background:#0a0a0a;border-radius:6px;padding:16px;border:1px solid var(--bd)}
.handoff-box h3{color:var(--o);margin-bottom:12px;font-size:.9em;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.handoff-box ul{list-style:none;padding:0}
.handoff-box li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;font-size:.9em}
.handoff-box li:last-child{border-bottom:none}
.handoff-box .val{color:var(--o);font-weight:600}
.meta-info{color:var(--tm);font-size:.85em;margin-bottom:16px}
.tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:.72em;font-weight:600}
.tag-a1{background:rgba(125,211,252,.15);color:var(--a1)}.tag-a2{background:rgba(251,191,36,.15);color:var(--a2)}.tag-b{background:rgba(74,222,128,.15);color:var(--b)}
.upload-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.drop-zone{border:2px dashed var(--bd);border-radius:12px;padding:50px 30px;cursor:pointer;text-align:center;max-width:500px;width:100%}
.drop-zone:hover{border-color:var(--o)}
.spinner{width:48px;height:48px;border:4px solid var(--bd);border-top:4px solid var(--o);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
/* Small inline spinner for a loading number, and chart-area spinner overlay (shell -> DB fill) */
.num-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
.chart-spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--s);z-index:2}
.chart-spin .spinner{margin:0}
.hidden{display:none}
/* Icon alignment: labels/buttons show icon + text neatly */
.kpi-card .label{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
/* Ticket Age tiles: count / COLOR / (range) stacked on separate lines */
.age-tile .age-name{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.9em;letter-spacing:.5px;margin-top:6px;color:#fff}
.age-tile .age-range{color:var(--tm);font-size:.72em;margin-top:4px}
.btn .ic,.btn svg.ic{margin-right:2px}
.ic{opacity:.9}
/* Wide tables scroll horizontally instead of breaking the layout on small screens */
.section table{min-width:520px}
.section > div[style*="overflow"], .section{ }
@media(max-width:1024px){
  .charts-grid{grid-template-columns:1fr}
  .content{padding:18px}
}
@media(max-width:768px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:14px}
  .top-bar{padding:10px 14px}
  .toolbar{padding:8px 14px}
  .logo span{font-size:1em}
  .page-title h1{font-size:1.4em}
  .btn{padding:6px 12px;font-size:.8em}
  .chart-wrap{height:260px}
  /* let any table live inside a horizontal scroller */
  .section table{display:block;overflow-x:auto;white-space:nowrap}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr}
  .toolbar-nav,.toolbar-actions{width:100%}
  .kpi-card .value{font-size:1.6em}
}
</style>
</head>
<body data-app="live" data-back-href="index.html" data-back-label="All Dashboards">
<div id="app"></div>
<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js"></script>
<script src="app.js"></script>
</body>
</html>
