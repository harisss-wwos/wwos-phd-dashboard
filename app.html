<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WWOS PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="shimmer.css">
<style>
:root{--o:#ff9900;--oh:#ec7211;--ol:#ffb84d;--bl:#2074d5;--bll:#44b9d6;--tl:#1b9cb0;--g:#1d8102;--gl:#3ecf4a;--r:#d13212;--rl:#ff5252;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--s:#000;--a1:#7dd3fc;--a2:#fbbf24;--b:#4ade80}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:flex-start;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.1em;font-weight:700;color:#fff;line-height:1}
.logo-link{text-decoration:none;cursor:pointer;transition:opacity .15s}
.logo-link:hover{opacity:.82}
.live-badge{font-size:.7em;font-weight:700;letter-spacing:.5px;color:#4ade80;background:rgba(74,222,128,.14);border:1px solid rgba(74,222,128,.4);border-radius:5px;padding:3px 12px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;animation:livepulse 2s ease-in-out infinite}
.live-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:liveblink 1s steps(1,end) infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.62}}
@keyframes liveblink{0%,49%{opacity:1;box-shadow:0 0 8px 2px #4ade80}50%,100%{opacity:.25;box-shadow:0 0 0 0 rgba(74,222,128,0)}}
/* Second row: toolbar holding all nav + action buttons */
/* Two explicit rows: nav on line 1, action buttons on line 2. */
.toolbar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:10px 24px;display:flex;flex-direction:column;align-items:stretch;gap:10px;position:sticky;top:53px;z-index:99}
.toolbar-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--bd)}
.nav-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Priority blink for BLACK / out-of-policy PURPLE ticket sections */
.blink-alert{animation:blinkAlert 1s ease-in-out infinite;border:1px solid rgba(255,82,82,.55)!important}
/* KPI value cell blink (e.g. Repeat Incident % above threshold): red text pulse. */
.kt-value.kpi-blink-alert{color:#ff5252!important;font-weight:800;animation:kpiBlinkText 1s ease-in-out infinite}
@keyframes kpiBlinkText{0%,100%{opacity:1;text-shadow:0 0 8px rgba(255,82,82,.6)}50%{opacity:.45;text-shadow:none}}
@keyframes blinkAlert{0%,100%{box-shadow:0 0 0 0 rgba(255,82,82,0);background:#0a0a0a}50%{box-shadow:0 0 14px 2px rgba(255,82,82,.5);background:rgba(255,82,82,.09)}}
.btn{display:inline-flex;align-items:center;padding:7px 16px;background:var(--o);color:#000;border-radius:5px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.btn.danger{background:var(--r);color:#fff}
.content{padding:10px 24px 24px;max-width:1600px;margin:0 auto}
.page-title{margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.page-title h1{font-size:1.8em;color:#fff;font-weight:700}
.page-title p{color:var(--tm);margin-top:4px;font-size:.9em}
/* Dashboard title row: Q3 (left) + LIVE (right), plus Alerts/Upload/data-log actions. */
/* Split toolbar: personal nav pinned left, data actions pinned right. */
/* One header div: title on the left; the top-right cluster (Uploaded data log + avatar) is moved in
   as the right-side child by topbar-auth.js (PHDPlaceTopRight). */
.dash-title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.dash-title-row:not(:empty){margin-bottom:10px}
.dash-title-h1{font-size:1.8em;color:#fff;font-weight:700;margin:0;display:inline-flex;align-items:center;gap:12px;flex:1 1 auto;justify-content:space-between}
/* Dashboard title label (replaces the old My Tickets button in this row). */
.dash-title-name{font-size:1.2em;color:#fff;font-weight:700;letter-spacing:.3px;line-height:1}
/* Each group is a segmented pill container so its buttons read as one cohesive control. */
.dash-actions{display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap;background:#0e141b;border:1px solid #2f3a45;border-radius:5px;padding:4px}
.dash-actions-left{margin-right:auto}
.dash-actions-right{margin-left:auto}
.dash-act{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;box-sizing:border-box;white-space:nowrap;border:1px solid transparent!important;background:transparent!important;color:#cdd7de!important;border-radius:5px;padding:0 16px;font-size:.88em;font-weight:600;box-shadow:none!important;transition:background .14s,color .14s}
.dash-act:hover{background:rgba(255,255,255,.06)!important;color:#fff!important}
.dash-act svg{flex-shrink:0;opacity:.9}
/* Upload = the one primary/accent action (admins). */
.dash-actions-right button.dash-act{color:#ff9f2e!important}
.dash-actions-right button.dash-act:hover{background:linear-gradient(180deg,#ff9f2e,#f07d0a)!important;color:#fff!important}
/* Scope selector (Overall / Q3 live / Q2) — centered chip radios replacing the old title. */
.dash-scope{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.dash-scope-opt{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;font-size:.9em;font-weight:600;color:#aab7c2;cursor:pointer;user-select:none;border:1px solid #2f3a45;background:#0e141b;transition:background .15s,color .15s,border-color .15s}
.dash-scope-opt input{position:absolute;opacity:0;width:0;height:0}
.dash-scope-opt:hover{color:#e6edf0;border-color:#3d566a}
.dash-scope-opt.checked{color:#fff;background:linear-gradient(180deg,#ff9f2e,#f07d0a);border-color:#f07d0a;box-shadow:0 2px 8px rgba(240,125,10,.35)}
.dash-scope-live{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:liveblink 1s steps(1,end) infinite}
.dash-scope-opt.checked .dash-scope-live{background:#fff;box-shadow:0 0 6px #fff}
@media(max-width:700px){.dash-scope{flex:1 1 100%;order:-1}}
/* Section header row: title on the left, its own scope selector on the right. */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{margin:0}
/* Per-section scope selector (Q3 Live | Q2 | Overall) — compact chip radios on the section header. */
.dash-scope-sec{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.dsc-opt{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:.8em;font-weight:600;color:#aab7c2;cursor:pointer;user-select:none;border:1px solid #2f3a45;background:#0e141b;transition:background .15s,color .15s,border-color .15s}
.dsc-opt input{position:absolute;opacity:0;width:0;height:0}
.dsc-opt:hover{color:#e6edf0;border-color:#3d566a}
.dsc-opt.checked{color:#fff;background:linear-gradient(180deg,#ff9f2e,#f07d0a);border-color:#f07d0a;box-shadow:0 2px 8px rgba(240,125,10,.3)}
.dsc-live{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:liveblink 1s steps(1,end) infinite}
.dsc-opt.checked .dsc-live{background:#fff;box-shadow:0 0 6px #fff}
@media(max-width:600px){.dash-scope-sec{flex:1 1 100%}.dsc-opt{flex:1 1 auto;justify-content:center}}
/* When the row is tight, both groups take full width and their buttons spread evenly.
   Labels stay visible as long as they fit; collapse to icon-only on the smallest screens. */
@media(max-width:760px){
  .dash-title-row{flex-direction:column;align-items:stretch}
  .dash-actions{width:100%;justify-content:space-between}
  .dash-actions-left,.dash-actions-right{margin:0}
  .dash-actions .dash-act{flex:1 1 auto;justify-content:center}
}
@media(max-width:460px){
  .dash-act .dash-act-label{display:none}
  .dash-act{padding:9px 12px}
}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
/* KPI summary sections rendered as tables (Queue Status / Average / Repeat Incident). */
.kpi-table{width:100%;border-collapse:collapse;font-size:.9em}
.kpi-table th,.kpi-table td{padding:10px 14px;border:1px solid #223040;vertical-align:top;text-align:left}
.kpi-table thead th{background:#111820;color:var(--tm);text-transform:uppercase;font-size:.72em;letter-spacing:.5px;font-weight:700}
.kpi-table td.kt-metric{color:var(--t);font-weight:600;white-space:nowrap;padding-right:24px}
/* Extra 10px breathing room on the right of the Metric header, matching the body cells. */
.kpi-table thead th:first-child{padding-right:24px}
.kpi-table td.kt-metric .ic,.kpi-table td.kt-metric svg{vertical-align:middle;margin-right:6px;opacity:.85}
.kpi-table td.kt-value{color:#fff;font-weight:800;font-size:1.05em;white-space:nowrap;text-align:right;width:1%}
.kpi-table td.kt-desc{color:var(--tm);font-size:.82em;line-height:1.45;font-weight:400}
.kpi-table tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.kpi-card{background:var(--s);border-radius:5px;padding:20px;text-align:center;border:1px solid var(--bd);border-top:3px solid var(--o)}
.kpi-card .value{font-size:2em;font-weight:700;color:#fff;margin-bottom:4px}
.kpi-card .label{font-size:.78em;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.kpi-card.accent .value{color:var(--o)}.kpi-card.success .value{color:var(--gl)}.kpi-card.warning .value{color:var(--ol)}.kpi-card.danger .value{color:var(--rl)}
/* Compact KPI strip used by the collapsible summary cards (Queue/Total/Average/Repeat). Smaller
   tiles that sit in a single row; the explicit column count is set inline per section. */
.kpi-section{padding:16px 20px}
.kpi-section>h2{margin-bottom:0}
.kpi-section:not(.collapsed)>h2{margin-bottom:16px}
.kpi-grid-compact{gap:10px;margin-bottom:0}
.kpi-grid-compact .kpi-card{padding:12px 10px;border-top-width:2px}
.kpi-grid-compact .kpi-card{min-width:0;overflow:hidden}
/* Highlighted open-status tiles in Queue Status Data (Assigned/WIP/Researching/Pending). */
.kpi-card.qhl{background:linear-gradient(160deg,#14202b,#0f171f);border:1px solid #223243;border-top:3px solid #44b9d6}
.kpi-card.qhl .value{color:#5ecdec}
.kpi-card.qhl .label{color:#9fb8c4}
/* Visible per-tile definition text (Average Data). */
.kpi-grid-compact .kpi-card .kpi-desc{margin-top:8px;font-size:.66em;line-height:1.45;color:var(--tm);text-transform:none;letter-spacing:0;white-space:normal;font-weight:400}
.kpi-grid-compact .kpi-card .value{font-size:1.25em;margin-bottom:3px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* Label truncates to a single line (ellipsis) as the card narrows, instead of wrapping. The
   inline-flex layout is dropped for `display:block` so the whole label (icon + text) clips cleanly. */
.kpi-grid-compact .kpi-card .label{display:block;font-size:.66em;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kpi-grid-compact .kpi-card .label .ic,.kpi-grid-compact .kpi-card .label svg{vertical-align:middle;margin-right:3px}
@media(max-width:900px){
  .kpi-grid.kpi-grid-compact{grid-template-columns:repeat(3,1fr)!important}
}
@media(max-width:520px){
  .kpi-grid.kpi-grid-compact{grid-template-columns:repeat(2,1fr)!important}
  .kpi-grid-compact .kpi-card .value{font-size:1.1em}
}
.section{background:var(--s);border-radius:5px;padding:24px;margin-bottom:24px;border:1px solid var(--bd)}
/* Average Data + Repeat Incident Data shown side by side (stack on narrow screens). */
.kpi-pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.kpi-pair>.section{margin-bottom:24px}
@media(max-width:900px){.kpi-pair{grid-template-columns:1fr}}
.section h2{color:#fff;margin-bottom:18px;font-size:1.2em;font-weight:600;display:flex;align-items:center;gap:8px}
.section h2::before{content:'';display:inline-block;width:4px;height:20px;background:var(--o);border-radius:2px}
/* Collapsible sections — animated via grid-template-rows (0fr<->1fr) so height eases smoothly. */
.section.collapsible{display:grid;grid-template-rows:auto 1fr;transition:grid-template-rows .3s ease}
.section.collapsible>h2{cursor:pointer;user-select:none;justify-content:space-between}
.section.collapsible>h2 .sec-caret{margin-left:auto;color:var(--tm);transition:transform .3s ease;font-size:.8em}
.section.collapsible>.sec-body{overflow:hidden;min-height:0;transition:opacity .3s ease}
.section.collapsible.collapsed{grid-template-rows:auto 0fr}
.section.collapsible.collapsed>h2{margin-bottom:0}
.section.collapsible.collapsed>h2 .sec-caret{transform:rotate(-90deg)}
.section.collapsible.collapsed>.sec-body{opacity:0}
/* Grouped chart pair section: two charts side by side, stacked on mobile */
.section .pair-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(max-width:920px){.section .pair-grid{grid-template-columns:1fr}}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:20px;margin-bottom:24px}
.chart-box{background:var(--s);border-radius:5px;padding:20px;border:1px solid var(--bd)}
.chart-box h3{color:#fff;margin-bottom:16px;text-align:center;font-size:.95em;font-weight:600}
.chart-wrap{position:relative;height:300px}
.chart-wrap.tall{height:340px}
/* Week / Day granularity toggle for the repeat-incidents chart. */
.hi-gran{display:inline-flex;background:#11161d;border:1px solid #2a323b;border-radius:5px;padding:2px;flex-shrink:0}
.hi-gran-btn{background:transparent;border:none;color:#879596;font:inherit;font-size:.8em;font-weight:700;padding:6px 14px;border-radius:5px;cursor:pointer;transition:background .12s,color .12s}
.hi-gran-btn:hover{color:#d5dbdb}
.hi-gran-btn.on{background:#a78bfa;color:#0e1013}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #eef1f4;font-size:.88em;color:#2a3340}
th{background:#f7f9fb;color:#5c6773;font-weight:700;text-transform:uppercase;font-size:.75em;letter-spacing:.5px}
tr:hover{background:#f8fafb}
.badge{display:inline-block;padding:3px 10px;border-radius:5px;font-size:.78em;font-weight:600}
/* Excel-sheet style tables (Incident Types / Historical Incidents): gridlines on every cell, header bg, zebra rows. */
.xls-table{border:1px solid #2f3a45}
.xls-table th,.xls-table td{border:1px solid #2f3a45;padding:8px 12px}
/* Incident Types subsection headers (Resolved by AutoSIM / by PHD agents). */
.inc-sub-h{display:flex;align-items:center;gap:8px;font-size:.95em;font-weight:700;color:#d5dbdb;margin:4px 0 8px}
.inc-sub-h .inc-sub-n{font-weight:800;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:5px;padding:1px 10px;font-size:.85em}
/* Clickable incident-type rows -> agent-breakdown popup. */
.xls-table tr.inc-clickrow{cursor:pointer}
.xls-table tr.inc-clickrow:hover td{background:rgba(255,153,0,.08)}
/* Grouped PHD incident rows (a published grouping) — purple highlight + name colour. */
.xls-table tr.inc-grouped td{background:rgba(167,139,250,.08)}
.xls-table tr.inc-grouped td:nth-child(2) strong{color:#a78bfa}
/* "View types" button on a grouped row — opens the member-list popup. */
.inc-grp-btn{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:2px 9px;font-size:.72em;font-weight:700;color:#a78bfa;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.45);border-radius:5px;cursor:pointer;vertical-align:middle}
.inc-grp-btn:hover{background:rgba(167,139,250,.24);color:#c4b5fd}
.inc-grp-btn svg{width:12px;height:12px}
/* PHD agent popup: table on the left, per-agent bar chart on the right (uses the old Volume space).
   The chart column is vertically centered against the table's height. */
.inc-ag-split{display:grid;grid-template-columns:minmax(320px,1fr) 1.3fr;gap:20px;align-items:center}
.inc-ag-split .inc-ag-tbl{min-width:0;overflow-x:auto;align-self:start}
.inc-ag-split .inc-ag-chart{min-width:0}
@media(max-width:820px){.inc-ag-split{grid-template-columns:1fr}}
/* Agent cell in the incident-type popup: avatar + name/handle. */
.inc-ag-cell{display:inline-flex;align-items:center;gap:9px}
.inc-ag-cell .phd-avatar{width:28px!important;height:28px!important;font-size:12px!important}
.inc-ava-fallback{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(167,139,250,.15);color:#a78bfa}
.inc-ag-name{display:inline-flex;flex-direction:column;line-height:1.25;font-weight:700;color:#fff}
.inc-ag-name .inc-ag-sub{font-weight:400;font-size:.8em;color:var(--tm)}
/* Incident-tickets drill-down: Title column truncates with an ellipsis (full text on hover).
   Auto layout + a bounded max-width on the cell lets the other 4 columns stay fit-to-content
   while Title absorbs the rest and clips. */
.inc-tk-table td.inc-tk-title{max-width:1px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9d3d4}
/* Ticket-ID link in the drill-down: brighter + larger for legibility (icon lives in the header). */
.inc-tk-table .inc-tk-id{color:#5ecdec;font-weight:700;font-size:1em;letter-spacing:.2px;text-decoration:none}
.inc-tk-table .inc-tk-id:hover{color:#8fe0f5;text-decoration:underline}
/* Plain (non-link-looking) ticket id: bold, inherits body text color, no underline. */
.inc-tk-table .tk-id-plain{color:#e6ebec;font-weight:700;text-decoration:none;letter-spacing:.2px}
.inc-tk-table .tk-id-plain:hover{color:#fff;text-decoration:none}
/* Fit-to-content columns: shrink to their content width; the free-text column (last) absorbs the rest. */
.inc-tk-table th.tk-fit,.inc-tk-table td.tk-fit{width:1%;white-space:nowrap}
/* Sortable headers (Created / HI Cnt / etc.). */
.inc-tk-table th.inc-sort-th:hover{color:#ff9900}
.inc-tk-table th.inc-sort-th .inc-sort-ar{font-size:.9em;color:#ff9900}
/* Load more / less footer under a drill-down table. */
.inc-tk-more{display:flex;justify-content:center;gap:10px;align-items:center;padding:14px 0 2px}
.inc-tk-more button{background:#1a2129;border:1px solid #2a323b;color:#d5dbdb;border-radius:5px;padding:7px 16px;font-size:.85em;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.inc-tk-more button:hover{background:#222b34;border-color:#3a444f;color:#fff}
.inc-tk-more .tk-count{color:#879596;font-size:.8em}
.xls-table thead th{background:#111820}
.xls-table tbody tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.xls-table tbody tr:hover td{background:rgba(255,153,0,.06)}

/* ---- Clean drill-down table (no Excel gridlines): row-per-line with a subtle divider, bold
   labels, roomy padding. Mirrors the "list" presentation in the reference mock. Applied on TOP of
   .xls-table so it overrides borders/zebra while keeping the fit/sort helpers from .inc-tk-table. */
.xls-table.tk-clean,.xls-table.tk-clean th,.xls-table.tk-clean td{border:0!important}
.xls-table.tk-clean{border-collapse:collapse;background:transparent}
.xls-table.tk-clean thead th{background:transparent;color:#7f8c96;font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:6px 16px 10px;border-bottom:1px solid #2a323b!important}
.xls-table.tk-clean tbody td{padding:12px 16px;border-bottom:1px solid #1c232b!important;font-size:.9em}
.xls-table.tk-clean tbody tr:nth-child(even) td{background:transparent}
.xls-table.tk-clean tbody tr:hover td{background:rgba(255,255,255,.035)}
.xls-table.tk-clean tbody tr:last-child td{border-bottom:0!important}
/* Mini progress bar in the % column (orange fill on a dark track), like the reference. */
.tk-bar{display:inline-block;vertical-align:middle;width:96px;max-width:22vw;height:7px;border-radius:5px;background:#2a323b;overflow:hidden;margin-right:10px}
.tk-bar>span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#f0810a,#ff9f2e)}
.tk-pct{color:#c9d3d4;font-weight:600;font-size:.92em}
.badge-g{background:rgba(62,207,74,.2);color:#3ecf4a;font-weight:700}
.badge-w{background:rgba(255,153,0,.15);color:var(--ol)}
.handoff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.handoff-box{background:#0a0a0a;border-radius:5px;padding:16px;border:1px solid var(--bd)}
.handoff-box h3{color:var(--o);margin-bottom:12px;font-size:.9em;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.handoff-box ul{list-style:none;padding:0}
.handoff-box li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;font-size:.9em}
.handoff-box li:last-child{border-bottom:none}
.handoff-box .val{color:var(--o);font-weight:600}
.meta-info{color:var(--tm);font-size:.85em;margin-bottom:16px}
/* ================= Shift Report (redesigned) ================= */
.sr{max-width:1200px}
/* ============ Shift Report — illustrated gradient hero banner (matches the section banners) ============ */
.sr{max-width:1200px}
/* Compact one-line hero: title + snapshot date (left) + In-queue badge (right). Height matches the
   profile-column banner / app.html section banners (56px). */
.sr-hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;flex-wrap:nowrap;
  height:56px;min-height:56px;max-height:56px;box-sizing:border-box;
  border:none;border-radius:5px;padding:0 18px;margin-bottom:18px;
  box-shadow:0 6px 18px -8px rgba(236,114,17,.45),0 2px 6px rgba(20,30,50,.12);
  background:linear-gradient(90deg,#f07d0a,#ff9f2e 52%,#ffcf7a);background-size:200% 100%;animation:secBanner 10s ease infinite}
.sr-hero-title{position:relative;z-index:1;color:#3a2405;font-size:1.12em;font-weight:800;letter-spacing:-.2px;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.sr-hero-title svg{color:#3a2405;flex-shrink:0}
.sr-hero-sub{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;color:#6a3d05;font-size:.68em;font-weight:800;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis}
/* In-queue badge: compact frosted white pill, pinned to the right of the one-line hero. */
.sr-hero-badge{position:relative;z-index:1;margin-left:auto;display:inline-flex;align-items:baseline;gap:6px;text-align:center;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);border-radius:5px;padding:4px 12px;flex-shrink:0;box-shadow:0 6px 18px -8px rgba(0,0,0,.35)}
.sr-hero-num{font-size:1.1em;font-weight:800;color:#c25e00;line-height:1}
.sr-hero-cap{color:#8a5a1a;font-size:.6em;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
/* Hero watermark hidden on the compact one-line hero (not enough height for it to read well). */
.sr-hero-compact::after{display:none!important}
/* Hero watermark: clipboard + handoff arrows line-art on the right. */
.sr-hero::after{content:"";position:absolute;top:0;bottom:0;right:200px;width:200px;
  background-repeat:no-repeat;background-position:center;background-size:auto 84%;opacity:.34;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="24" y="14" width="46" height="52" rx="6"/><rect x="38" y="9" width="18" height="9" rx="3"/><path d="M34 32h26M34 42h26M34 52h16"/><path d="M84 30h24M100 22l8 8-8 8"/><path d="M108 54H84M92 46l-8 8 8 8"/></svg>')}
.sr-sec{margin-bottom:22px}
/* Collapsible section head — a flat BLUE mini-banner matching the app.html Live Queue / Performance
   Overview scheme: collapsed = sky-blue #38bdf8, expanded = #0b63cf, white font + caret. Fixed 56px. */
.sr-sec-head{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;flex-wrap:nowrap;cursor:pointer;
  border-radius:5px;padding:0 18px;height:56px;min-height:56px;max-height:56px;box-sizing:border-box;margin:-18px -20px 18px;
  background:#0b63cf;transition:background .15s}
.sr-collapsible.collapsed .sr-sec-head{background:#38bdf8;margin-bottom:-18px}
.sr-sec-head h2{font-size:1.08em;font-weight:800;display:flex;align-items:center;gap:10px;flex:1;min-width:0;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff!important}
.sr-sec-head h2 *{color:#fff!important}
.sr-sec-head h2 .ic,.sr-sec-head h2 svg{flex-shrink:0;color:#fff!important}
.sr-sec-actions{display:flex;align-items:center;gap:12px;flex-shrink:0;position:relative;z-index:1}
/* Export buttons: ORANGE bg, white UPPERCASE text, 5px radius (override base .btn / .btn.sec). */
.sr-sec-head .sr-exp,.sr-sec-head .btn.sr-exp,.sr-sec-head .btn.sec.sr-exp{white-space:nowrap;text-transform:uppercase;border-radius:5px!important;background:#f0820f!important;border:1px solid #f0820f!important;color:#fff!important;font-weight:800;letter-spacing:.3px}
.sr-sec-head .sr-exp:hover,.sr-sec-head .btn.sr-exp:hover,.sr-sec-head .btn.sec.sr-exp:hover{background:#d9730c!important;border-color:#d9730c!important;color:#fff!important}
.sr-sec-head .sr-exp svg{color:#fff!important}
/* Caret on the right; rotates when collapsed (mirrors app.html .sec-caret). */
.sr-sec-caret{position:relative;z-index:1;color:#fff;opacity:.85;font-size:.9em;flex-shrink:0;transition:transform .3s ease}
.sr-collapsible.collapsed .sr-sec-caret{transform:rotate(-90deg)}
/* Body collapses to height 0 (one open at a time via the accordion JS). */
.sr-collapsible>.sr-sec-body{overflow:hidden;transition:max-height .32s ease,opacity .25s ease,margin .32s ease;max-height:4000px;opacity:1}
.sr-collapsible.collapsed>.sr-sec-body{max-height:0;opacity:0;margin-top:0;margin-bottom:0}
/* When collapsed, the head's own bottom margin + the card padding should also close up so the
   collapsed card is just the 56px banner (equal height for both sections). */
.sr-collapsible.collapsed.sr-card-sec{padding-top:18px;padding-bottom:0}
/* Buttons on the bright section banner stay legible. */
.sr-sec-head .btn{background:rgba(10,12,15,.82);color:#fff;border:1px solid rgba(255,255,255,.16)}
.sr-sec-head .btn:hover{background:rgba(10,12,15,.92);border-color:rgba(255,255,255,.3)}
.sr-sec-head .btn.sec{background:rgba(255,255,255,.16);color:#0e1013;border:1px solid rgba(255,255,255,.4);font-weight:700}
.sr-sec-head .btn.sec:hover{background:rgba(255,255,255,.28);color:#0e1013}
/* Bordered shift-report sections (Takeover / Handoff) — glass card, no collapse. */
.sr-sec.sr-card-sec{background:#fff;border:1px solid var(--bd);border-radius:5px;padding:18px 20px;box-shadow:0 2px 12px -6px rgba(20,40,70,.12)}
@media(max-width:560px){
  .sr-sec-head{flex-wrap:wrap;height:auto;min-height:62px;padding:12px 16px}
  .sr-sec-head h2{flex-basis:auto;white-space:normal}
  .sr-exp{font-size:.8em}
}
/* Age-colour queue tiles (glass tiles with a colored top spine + soft glow). */
.sr-colors{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.sr-color{position:relative;background:#fff;border:1px solid #e6eaee;border-radius:5px;padding:18px 12px 14px;text-align:center;overflow:hidden;box-shadow:0 2px 8px -4px rgba(20,40,70,.18);transition:transform .16s,border-color .16s,box-shadow .16s}
.sr-color:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--sc) 55%,#e6eaee);box-shadow:0 14px 30px -16px color-mix(in srgb,var(--sc) 55%,#9aa6b0)}
.sr-color::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--sc)}
.sr-color-dot{width:11px;height:11px;border-radius:50%;background:var(--sc);margin:0 auto 8px;box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 20%,transparent)}
.sr-color-v{font-size:1.95em;font-weight:900;color:#1b2026;line-height:1}
.sr-color-l{color:#2a3340;font-size:.82em;font-weight:700;margin-top:6px}
.sr-color-r{color:#8b96a0;font-size:.68em;margin-top:3px}
.sr-purple{--sc:#7c5cf0}.sr-black{--sc:#4a5563}.sr-red{--sc:#dc2626}.sr-yellow{--sc:#d9930a}.sr-green{--sc:#1f9d57}
.sr-chart-card{background:#fff;border:1px solid #e6eaee;border-radius:5px;padding:20px;box-shadow:0 2px 12px -6px rgba(20,40,70,.2)}
.sr-chart-card h3{color:#1b2026;font-size:.95em;font-weight:700;text-align:center;letter-spacing:.4px;margin-bottom:14px}
/* Handoff meta chips + cards */
.sr-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.sr-chip{background:#f7f9fb;border:1px solid var(--bd);border-radius:5px;padding:6px 14px;font-size:.82em;color:var(--tm);display:inline-flex;align-items:center;gap:6px}
.sr-chip b{color:#1b2026;font-weight:700}
/* Handoff cards: fixed 2×2 grid (Ticket Health | Last 12 Hours Activity / Ticket Count by Status | Status Distribution). Collapse to 1 column on narrow screens. */
.sr-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.sr-cards{grid-template-columns:1fr}}
.sr-card{background:#fff;border:1px solid #e6eaee;border-radius:5px;padding:16px 18px;box-shadow:0 1px 4px rgba(20,30,50,.05)}
.sr-card h3{color:var(--o);font-size:.78em;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.sr-card ul{list-style:none;padding:0;margin:0}
.sr-card li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f4;font-size:.9em}
.sr-card li:last-child{border-bottom:none}
.sr-card li span{color:#2a3340}
.sr-card li em{color:var(--tm);font-style:normal;font-size:.85em}
.sr-card li b{color:#1b2026;font-weight:800;font-size:1.05em}
/* Tally value inside stat cards (renders as the bold number). Inside colour tiles it inherits the big size. */
.sr-card li .sr-v{color:#1b2026;font-weight:800;font-size:1.05em;flex-shrink:0}
/* Handoff Report sections rendered as tables (one table per card). */
.sr-table{width:100%;border-collapse:collapse;font-size:.9em}
.sr-table td{padding:8px 10px;border:1px solid #eef1f4;vertical-align:middle}
.sr-table td:first-child{color:#2a3340}
.sr-table td.sr-v{text-align:right;white-space:nowrap;color:#1b2026;font-weight:800;font-size:1.02em;width:1%}
.sr-table td em{color:var(--tm);font-style:normal;font-size:.85em}
.sr-table tr:nth-child(even) td{background:#f8fafb}
.sr-table .sr-pct{color:#1b2026;font-weight:800}
.sr-table .sk-row-v{width:26px;height:16px}
.sr-pct{color:#1b2026;font-weight:800;font-size:1.05em}
.sr-notes{margin-top:20px}
.sr-notes label{display:flex;align-items:center;gap:6px;color:var(--tm);font-size:.8em;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.sr-notes textarea{width:100%;min-height:110px;padding:12px 14px;background:#fff;border:1px solid var(--bd);border-radius:5px;color:#1b2026;font-family:inherit;font-size:.9em;resize:vertical}
.sr-notes textarea:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(236,114,17,.14)}
@media(max-width:760px){.sr-colors{grid-template-columns:repeat(2,1fr)}.sr-hero-badge{flex:1 1 100%}}
/* Shift Report shimmer skeleton blocks */
.sk-blk{position:relative;overflow:hidden;background:#e9edf1;border-radius:5px;display:inline-block}
.sk-blk::after{content:"";position:absolute;top:0;left:-150%;height:100%;width:150%;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.7) 50%,transparent 100%);animation:skmove 1.3s infinite}
@keyframes skmove{100%{left:150%}}
.sk-num{width:52px;height:30px}
.sk-lbl{width:70px;height:12px}
.sk-sub{width:96px;height:10px}
.sk-h3{width:150px;height:13px;margin-bottom:14px}
.sr-card li .sk-row-l{width:55%;height:12px}
.sr-card li .sk-row-v{width:26px;height:16px}
.tag{display:inline-block;padding:2px 10px;border-radius:5px;font-size:.72em;font-weight:600}
.tag-a1{background:rgba(125,211,252,.15);color:var(--a1)}.tag-a2{background:rgba(251,191,36,.15);color:var(--a2)}.tag-b{background:rgba(74,222,128,.15);color:var(--b)}
.upload-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.drop-zone{border:2px dashed var(--bd);border-radius:5px;padding:50px 30px;cursor:pointer;text-align:center;max-width:500px;width:100%}
.drop-zone:hover{border-color:var(--o)}
.spinner{width:48px;height:48px;border:4px solid var(--bd);border-top:4px solid var(--o);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
/* Small inline spinner for a loading number, and chart-area spinner overlay (shell -> DB fill) */
.num-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
/* KPI loading spinner (replaces the old scramble-number flicker). Sized variants: default for table
   value cells, .kpi-spin-lg for the big Queue Status tile numbers. Inherits the cell's text colour. */
.kpi-spin{display:inline-block;width:15px;height:15px;border:2px solid var(--bd);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
.kpi-spin-lg{width:24px;height:24px;border-width:3px;vertical-align:-4px}
.chart-spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--s);z-index:2}
.chart-spin .spinner{margin:0}
.hidden{display:none}
/* Icon alignment: labels/buttons show icon + text neatly */
.kpi-card .label{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
/* Ticket Age tiles: count / COLOR / (range) stacked on separate lines */
.age-tile .age-name{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.9em;letter-spacing:.5px;margin-top:6px;color:#fff}
.age-tile .age-range{color:var(--tm);font-size:.72em;margin-top:4px}
/* The 5 age tiles ALWAYS spread across the full width (equal columns that shrink together),
   so they never leave a half-empty row on narrow screens. Use .kpi-grid.age-grid for higher
   specificity than the generic .kpi-grid mobile rules below (which would otherwise override). */
.kpi-grid.age-grid{grid-template-columns:repeat(5,1fr);margin-bottom:0}
@media(max-width:640px){
  .kpi-grid.age-grid{grid-template-columns:1fr 1fr 1fr}   /* 3 across, still full width */
  .age-tile{padding:14px 8px}
  .age-tile .age-range{font-size:.68em}
}
/* ---- Ticket Age Classification as an Excel-style table ---- */
.age-xls-wrap{overflow-x:auto;margin-top:6px}
.age-xls{width:100%;border-collapse:collapse;font-size:.9em;min-width:520px;table-layout:auto}
.age-xls th,.age-xls td{border:1px solid #2f3a45;padding:11px 14px;text-align:center;vertical-align:middle}
/* Width priority: the two icon columns (5 = SR/Addr Excl, 6 = No EMT) absorb the free space so their
   per-agent icon rows have room; every other column shrinks to fit its own content (width:1% + nowrap
   forces auto-layout to give them only what they need). */
.age-xls th:nth-child(1),.age-xls td:nth-child(1),
.age-xls th:nth-child(2),.age-xls td:nth-child(2),
.age-xls th:nth-child(3),.age-xls td:nth-child(3),
.age-xls th:nth-child(4),.age-xls td:nth-child(4),
.age-xls th:nth-child(7),.age-xls td:nth-child(7){width:1%;white-space:nowrap}
.age-xls th:nth-child(5),.age-xls td:nth-child(5),
.age-xls th:nth-child(6),.age-xls td:nth-child(6){width:auto}
.age-xls thead th{background:#111820;color:var(--tm);font-size:.72em;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
/* Icon + label in the SR / No-EMT header cells: center them together with a consistent gap. */
.age-xls thead th .age-th-lbl{display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1}
.age-xls thead th .age-th-lbl svg{flex-shrink:0}
.age-xls tbody tr:hover td{background:rgba(255,153,0,.05)}
/* Whole-row click target (replaces the old Details "View tickets" button). */
.age-xls tbody tr.age-clickrow{cursor:pointer}
.age-xls tbody tr.age-clickrow:hover td{background:rgba(255,153,0,.09)}
.age-xls .age-swatch{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:800;letter-spacing:.4px}
.age-xls .age-swatch .dot{width:12px;height:12px;border-radius:5px;flex-shrink:0}
.age-xls .age-rng{color:var(--tm);font-size:.85em}
.age-xls td.age-agents{text-align:center;font-weight:800;color:#fff}
.age-xls td.age-cnt{text-align:center;font-weight:800}
/* Priority-label column (Station Request / Address Exclusion): one profile icon per agent. */
.age-xls td.age-prio{text-align:center;font-weight:800;color:var(--tm);padding:9px 12px}
.age-xls td.age-prio .prio-icons{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
/* Each agent reads as one pill: avatar + count on a subtle rounded chip, so they don't blur together. */
.age-xls td.age-prio .prio-agent{display:inline-flex;align-items:center;gap:6px;cursor:default;background:rgba(255,255,255,.04);border:1px solid #2b3742;border-radius:999px;padding:3px 10px 3px 3px;transition:border-color .12s,background .12s}
.age-xls td.age-prio .prio-agent:hover{background:rgba(255,255,255,.08);border-color:#3d566a}
/* Avatar chip: a circular ring (roster-colored via inline box-shadow) around the 22px avatar. */
.age-xls td.age-prio .prio-ava{display:inline-flex;align-items:center;justify-content:center;line-height:0;border-radius:50%}
.age-xls td.age-prio .prio-ava .phd-avatar{width:22px!important;height:22px!important;font-size:10px!important}
.age-xls td.age-prio .prio-ava-fallback{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px}
.age-xls td.age-prio .prio-n{font-weight:800;color:#fff;font-size:.9em;min-width:8px;text-align:center}
.age-xls td.age-prio .age-prio-zero{color:#5f6b6c;font-weight:800}
.age-xls .age-view{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;font-size:.8em;font-weight:600;border:1px solid var(--bd);border-radius:5px;background:transparent;color:var(--t);cursor:pointer;font-family:inherit;transition:border-color .12s,color .12s}
.age-xls .age-view:hover{border-color:var(--o);color:var(--o)}
.age-xls tr.blink-alert td:first-child{box-shadow:inset 4px 0 0 var(--rl)}
/* ---- Color popup: agent accordion + per-agent Excel ticket table ---- */
.ap-agent{border:1px solid #2f3a45;border-radius:5px;margin-bottom:12px;overflow:hidden;background:#0b0f14}
.ap-agent-head{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;background:transparent;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .12s}
.ap-agent-head:hover{background:rgba(255,255,255,.03)}
/* Unregistered / Unassigned holder: a red gradient background on the WHOLE block, blinking.
   Applied when the assignee is NOT a registered PHD user in the database (see isRegisteredUser). */
.ap-agent.ap-unreg{border-color:rgba(255,82,82,.6);animation:apUnregBlink 1.25s ease-in-out infinite}
.ap-agent.ap-unreg .ap-agent-head{background:transparent}
@keyframes apUnregBlink{
  0%,100%{background:linear-gradient(135deg,rgba(255,82,82,.06),rgba(200,20,20,.10));box-shadow:0 0 0 0 rgba(255,82,82,0)}
  50%{background:linear-gradient(135deg,rgba(255,82,82,.28),rgba(180,10,10,.42));box-shadow:0 0 16px 2px rgba(255,82,82,.45)}
}
/* "PHD" tag next to a registered PHD user's name. */
.ap-phd-tag{display:inline-block;margin-left:9px;font-size:.58em;font-weight:800;letter-spacing:.5px;color:#5ecdec;background:rgba(94,205,236,.14);border:1px solid rgba(94,205,236,.5);border-radius:5px;padding:2px 8px;vertical-align:middle}
.ap-agent-name{color:#fff;font-weight:700;font-size:1.12em}
.ap-agent-name .sub{color:var(--tm);font-weight:400;font-size:.85em;margin-left:8px}
/* Crown badge next to an agent's name = count of Station Request / Address Exclusion tickets. */
.ap-agent-prio{display:inline-flex;align-items:center;gap:4px;margin-left:10px;font-size:.82em;font-weight:800;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);border-radius:5px;padding:1px 9px;vertical-align:middle;cursor:default}
.ap-agent-prio svg{flex-shrink:0}
/* No-EMT badge next to an agent's name = count of No-EMT tickets (red no-entry mark). */
.ap-agent-noemt{color:#ff8080;background:rgba(255,82,82,.12);border-color:rgba(255,82,82,.4)}
/* Marker icon next to a ticket id (expanded agent table + per-agent drill-down cards). */
.ap-crown{display:inline-flex;align-items:center;cursor:default;margin-left:4px;color:#fbbf24;vertical-align:middle}
.ap-noemt{color:#ff8080}
/* Highlight priority ticket rows (Station Request / Address Exclusion) with a soft amber wash. */
.ap-tbl tr.ap-row-prio td{background:linear-gradient(180deg,rgba(251,191,36,.10),rgba(251,191,36,.05))}

.content .dash-collapsible.collapsed:has(.lq-body) .sec-head,
.content .dash-collapsible.collapsed[data-perf] .sec-head{background:#38bdf8!important}
/* White title text + caret on both banners (overrides the default dark #0e1013). */
.content .dash-collapsible:has(.lq-body) .sec-head h2,
.content .dash-collapsible:has(.lq-body) .sec-head h2 svg,
.content .dash-collapsible:has(.lq-body) .sec-head .sec-caret,
.content .dash-collapsible[data-perf] .sec-head h2,
.content .dash-collapsible[data-perf] .sec-head h2 svg,
.content .dash-collapsible[data-perf] .sec-head .sec-caret{color:#ffffff!important}
/* The watermark illustration is a dark SVG; soften it so it reads on the blue (optional subtlety). */
.content .dash-collapsible:has(.lq-body) .sec-head::after,
.content .dash-collapsible[data-perf] .sec-head::after{opacity:.28}
/* Average Data — green */
.content .kpi-section:has(#dashSumAvg) .sec-head{background:linear-gradient(90deg,#22c55e,#4ade80 55%,#86efac)}
/* Repeat Incident Data — purple */
.content .kpi-section:has(#dashSumRepeat) .sec-head{background:linear-gradient(90deg,#7c5cff,#a78bfa 55%,#c9b6ff)}
/* Incident Types — rose/red */
.content .section:has(#dashIncidentsBody) .sec-head{background:linear-gradient(90deg,#e5484d,#ff6b6b 55%,#ff9d9d)}
/* Resolutions — teal */
.content .section:has(#dashResolutionsBody) .sec-head{background:linear-gradient(90deg,#0d9488,#2dd4bf 55%,#7ff0e0)}
/* Historical Incidents — indigo/blue */
.content .section:has(#dashHiBody) .sec-head{background:linear-gradient(90deg,#3b6fe0,#5b8def 55%,#9db8f7)}
/* Weekly Volume & SLA — magenta/pink */
.content .section:has(#dashWeeklyBody) .sec-head{background:linear-gradient(90deg,#c026d3,#e152f0 55%,#f4a7fb)}
/* ---- Themed illustrations per section (white line-art SVG, right side of each banner) ---- */
/* Queue Status — stacked inbox/queue trays */
.content .kpi-section:has(#dashQueueKpis) .sec-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%230e1013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"><path d="M20 24h32l6 10h24"/><path d="M20 24v20a4 4 0 0 0 4 4h58a4 4 0 0 0 4-4V24"/><path d="M30 40h20l4 8h22"/><circle cx="96" cy="20" r="7"/></svg>')}
/* Ticket Age — clock + hourglass */
.content .section:has(#dashAgeBody) .sec-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%230e1013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"><circle cx="44" cy="40" r="22"/><path d="M44 28v12l9 6"/><path d="M78 20h24M78 60h24M82 20c0 12 16 14 16 20s-16 8-16 20M98 20c0 12-16 14-16 20s16 8 16 20"/></svg>')}
/* Average Data — line/trend chart */
.content .kpi-section:has(#dashSumAvg) .sec-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%230e1013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"><path d="M16 62h92M22 62V30M22 48l18-16 16 12 22-26 16 10"/><circle cx="40" cy="32" r="3.5"/><circle cx="56" cy="44" r="3.5"/><circle cx="78" cy="18" r="3.5"/></svg>')}
/* Repeat Incident Data — repeat/refresh loop */
.content .kpi-section:has(#dashSumRepeat) .sec-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%230e1013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"><path d="M40 28h34a14 14 0 0 1 14 14"/><path d="M74 18l14 10-14 10"/><path d="M84 56H50a14 14 0 0 1-14-14"/><path d="M50 66L36 56l14-10"/></svg>')}
/* Incident Types — alert triangles */
.content .section:has(#dashIncidentsBody) .sec-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%230e1013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"><path d="M52 16l26 44H26z"/><path d="M52 32v14M52 52v.5"/><path d="M88 40l16 24H72z"/><path d="M88 50v6"/></svg>')}
/* Resolutions — check circles */
.content .section:has(#dashResolutionsBody) .sec-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%230e1013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"><circle cx="50" cy="40" r="24"/><path d="M38 40l9 9 17-19"/><circle cx="92" cy="26" r="10"/><path d="M87 26l4 4 7-8"/></svg>')}
/* Historical Incidents — bar chart / history */
.content .section:has(#dashHiBody) .sec-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%230e1013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"><path d="M18 62h90"/><rect x="30" y="40" width="12" height="22"/><rect x="52" y="28" width="12" height="34"/><rect x="74" y="46" width="12" height="16"/><rect x="96" y="34" width="12" height="28"/></svg>')}
/* Weekly Volume & SLA — wave + axis */
.content .section:has(#dashWeeklyBody) .sec-head::after{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%230e1013" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"><path d="M16 60h92M20 60V26"/><path d="M20 48c10 0 12-16 22-16s12 20 22 20 12-24 22-24 10 12 16 12"/></svg>')}

/* Scope selector on the bright banner: wrap it in a dark translucent pill so Q3/Q2 stay legible. */
.content .sec-head .dash-scope-sec{background:rgba(10,12,15,.55);border:1px solid rgba(0,0,0,.35);border-radius:5px;padding:3px 5px;backdrop-filter:blur(2px)}
.content .sec-head .dash-scope-sec .dsc-opt{color:#e6edf0}
.content .sec-head .dash-scope-sec .dsc-opt.checked{color:#fff}
/* Main dashboard content spans 70% of the viewport, centered. High-specificity selector so it wins
   over the global .content auto-width rule AND any stylesheet the topbar injects at runtime.
   Top padding matches the GSOC logo's offset from the top of the rail so the first section lines up. */
/* Live dashboard content fills the middle 80% of the viewport. The body already reserves 10vw on
   each side (rail zone left, back-button zone right), so the content just fills that middle band
   with a small 10px inner gap on each side. */
body[data-app="live"] .content{width:auto!important;max-width:none!important;margin:0!important;padding-left:10px!important;padding-right:10px!important;padding-top:14px!important}

/* ---- Live Queue: merged Queue Status + Ticket Age ---- */
.lq-head-note{font-size:.78em;color:#8b96a0;margin-left:12px;white-space:nowrap}
.lq-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:18px}
.lq-sub-h{display:flex;align-items:center;gap:8px;font-size:.9em;font-weight:700;color:#1b2026;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #eef1f4}
.lq-sub-h svg{color:#ec7211}

/* ---- Performance Overview: period picker (segmented chips + optional sub-select) ---- */
/* Keep the whole picker on ONE line (never wrap -> never break the fixed 56px banner height). If it
   genuinely can't fit, it scrolls horizontally instead of wrapping. The title truncates to yield room. */
.content [data-perf] .sec-head{gap:12px}
/* Title = icon + text. The icon never shrinks; the text truncates first to give the picker room, and
   is hidden entirely on narrow banners (below) where even a truncated label would crowd the chips. */
.content [data-perf] .sec-head>h2{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;gap:9px}
.content [data-perf] .sec-head>h2 .perf-h2-ic{flex:0 0 auto;display:inline-flex;align-items:center}
.content [data-perf] .sec-head>h2 .perf-h2-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Narrow viewport: the full picker (6 chips + up to 2 selects) needs the width — drop the title text,
   keep just the icon. The hover tooltip still reads "Performance Overview". */
@media(max-width:1150px){
  .content [data-perf] .sec-head>h2 .perf-h2-txt{display:none}
  .content [data-perf] .sec-head>h2{gap:0}
}
.perf-head-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:nowrap;justify-content:flex-end;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.perf-head-right::-webkit-scrollbar{display:none}
.perf-head-right>span{display:inline-flex}
.perf-picker{display:inline-flex;align-items:center;gap:10px;flex-wrap:nowrap;justify-content:flex-end}
.perf-sub{flex:0 0 auto}
/* Segmented chip group: one rounded pill track, each range type a chip; active chip = white on orange. */
.perf-chips{display:inline-flex;flex:0 0 auto;background:#f0f3f6;border:1px solid #e2e7eb;border-radius:999px;padding:3px;gap:2px}
.perf-chip{font-family:inherit;font-size:.76em;font-weight:700;letter-spacing:.1px;color:#5c6773;background:transparent;border:none;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.perf-chip:hover{color:#1b2026}
.perf-chip.on{background:linear-gradient(120deg,#ff9f2e,#ec7211);color:#fff;box-shadow:0 2px 8px -2px rgba(236,114,17,.6)}
/* Secondary select(s) for month / week / quarter — compact, appears only when needed. */
.perf-sub{display:inline-flex;align-items:center;gap:6px}
.perf-sel{font-family:inherit;font-size:.8em;font-weight:600;color:#1b2026;background:#fff;border:1px solid #d4dade;border-radius:5px;padding:6px 10px;cursor:pointer;outline:none}
.perf-sel:hover{border-color:#c2cad1}
.perf-sel:focus{border-color:#ec7211;box-shadow:0 0 0 3px rgba(236,114,17,.14)}
.perf-body{padding:14px 18px 18px}
/* ---- Performance KPIs: top-3 podium + colorful stat tiles ---- */
.pf-section-h{display:flex;align-items:center;gap:7px;font-size:.72em;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#8b96a0;margin:2px 0 10px}
.pf-section-h svg{width:13px;height:13px;color:#ec7211}
.pf-podium-wrap{margin-bottom:18px}
.pf-podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}
.pf-medal{position:relative;border-radius:5px;padding:18px 14px 14px;text-align:center;color:#1b2026;border:1px solid rgba(0,0,0,.06);box-shadow:0 6px 18px -10px rgba(20,40,70,.35);overflow:hidden}
.pf-medal::before{content:"";position:absolute;inset:0 0 auto 0;height:4px}
.pf-medal.pf-gold{background:linear-gradient(180deg,#fff8e6,#fff);} .pf-medal.pf-gold::before{background:linear-gradient(90deg,#f6c21a,#ffde7a)}
.pf-medal.pf-silver{background:linear-gradient(180deg,#f4f7fa,#fff);} .pf-medal.pf-silver::before{background:linear-gradient(90deg,#aab6c2,#d9e1e8)}
.pf-medal.pf-bronze{background:linear-gradient(180deg,#fbf0e6,#fff);} .pf-medal.pf-bronze::before{background:linear-gradient(90deg,#cd7f32,#e3a86a)}
.pf-medal.pf-gold{transform:translateY(-6px)}            /* gold stands a touch taller, podium feel */
/* medal emoji badge, top-right corner */
.pf-medal-badge{position:absolute;top:8px;right:10px;font-size:1.25em;line-height:1}
/* avatar: photo or coloured initial, centered */
.pf-av{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;overflow:hidden;background:#eef1f4;border:2px solid #fff;box-shadow:0 2px 6px rgba(20,40,70,.18)}
.pf-av img{width:100%;height:100%;object-fit:cover;display:block}
.pf-av-i{font-weight:800;font-size:1.3em;color:#5c6773}
.pf-medal.pf-gold .pf-av{border-color:#f6c21a}.pf-medal.pf-silver .pf-av{border-color:#c3ccd4}.pf-medal.pf-bronze .pf-av{border-color:#cd7f32}
.pf-medal-id{font-size:.9em;font-weight:800;margin-top:8px;color:#1b2026;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-medal-metrics{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.pf-mm{font-size:.76em;color:#5c6773}
.pf-mm b{color:#1b2026;font-size:1.05em}
.pf-mm-avg{color:#8b96a0;font-size:.72em;margin-top:1px}
.pf-mm-avg small{opacity:.8}
/* Stat tiles — one accent colour each. */
.pf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pf-stat{position:relative;background:#fff;border:1px solid #e6eaee;border-radius:5px;padding:13px 14px;overflow:hidden;box-shadow:0 2px 8px -4px rgba(20,40,70,.18)}
.pf-stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.pf-stat-top{display:flex;align-items:center;gap:7px;color:#5c6773}
.pf-stat-top svg{width:15px;height:15px}
.pf-stat-l{font-size:.72em;font-weight:700;letter-spacing:.2px;text-transform:uppercase}
.pf-stat-v{font-size:1.5em;font-weight:900;letter-spacing:-.5px;color:#1b2026;margin-top:7px;line-height:1}
.pf-stat-s{font-size:.72em;color:#8b96a0;margin-top:4px}
.pf-created::before{background:#2563eb}.pf-created .pf-stat-top{color:#2563eb}
.pf-resolved::before{background:#1f9d57}.pf-resolved .pf-stat-top{color:#1f9d57}
.pf-avgres::before{background:#0ea5b7}.pf-avgres .pf-stat-top{color:#0ea5b7}
.pf-sla::before{background:#7c5cf0}.pf-sla .pf-stat-top{color:#7c5cf0}
.pf-sla.ok .pf-stat-v{color:#1f9d57}.pf-sla.warn .pf-stat-v{color:#dc2626}
.pf-autosim::before{background:#ec7211}.pf-autosim .pf-stat-top{color:#ec7211}
.pf-repeat::before{background:#d9930a}.pf-repeat .pf-stat-top{color:#b5760a}
.pf-avgrep::before{background:#db2777}.pf-avgrep .pf-stat-top{color:#db2777}
.pf-pet::before{background:#0d9488}.pf-pet .pf-stat-top{color:#0d9488}
@media(max-width:900px){.pf-stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.pf-podium{grid-template-columns:1fr}.pf-medal.pf-gold{transform:none}}
/* Spinner overlay centered on the chart plot while the series data loads (axes already drawn). */
.perf-spin-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.perf-chart-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a94a0;font-size:.86em}
@media(max-width:860px){.perf-head-right{width:100%;margin-left:0;justify-content:flex-start}.perf-chips{flex-wrap:wrap}}

/* ---- Queue Status: stat tiles ---- */
.q-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;grid-column:1/-1}
.q-tile{background:linear-gradient(180deg,#15181d,#0f1115);border:1px solid #232830;border-radius:5px;padding:14px 16px;
  box-shadow:0 10px 26px -18px rgba(0,0,0,.7);transition:transform .16s,border-color .16s}
.q-tile:hover{transform:translateY(-2px);border-color:#2c333d}
/* Clickable status tiles (Assigned/WIP/Researching/Pending) open the all-agents status popup. */
.q-tile-click{cursor:pointer;position:relative}
.q-tile-click:hover{border-color:#ec7211}
.q-tile-click:focus-visible{outline:2px solid #ec7211;outline-offset:2px}
body[data-profile-panel] .content .q-tile-click:hover{border-color:#ec7211!important;box-shadow:0 6px 18px -10px rgba(236,114,17,.5)}
/* "Open in new window" hint icon, top-right of each clickable tile. Muted until hover/focus. */
.q-tile-open{position:absolute;top:10px;right:10px;display:inline-flex;align-items:center;justify-content:center;color:#8b96a0;opacity:.6;transition:opacity .15s,color .15s}
.q-tile-open svg{display:block}
.q-tile-click:hover .q-tile-open,.q-tile-click:focus-visible .q-tile-open{opacity:1;color:#ec7211}
body[data-profile-panel] .content .q-tile-open{color:#8b96a0}
body[data-profile-panel] .content .q-tile-click:hover .q-tile-open{color:#ec7211!important;opacity:1}
.q-tile .k{color:#8b96a0;font-size:11.5px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.q-tile .v{font-size:22px;font-weight:800;letter-spacing:-.3px;color:#eef2f4}
.q-tile .v small{font-size:12px;font-weight:600;color:#8b96a0;margin-left:3px}
.q-tile.cy .v{color:var(--cy2)}.q-tile.gr .v{color:#7ef2a8}.q-tile.am .v{color:#ffcf5e}.q-tile.gy .v{color:#9aa6b0}.q-tile.mut .v{color:#5f6b6c}
@media(max-width:720px){.q-tiles{grid-template-columns:repeat(2,1fr)}}

/* ---- Ticket Age: color rows ---- */
.age-grid{--age-cols:96px 108px 104px 1fr 1fr}
.agehead{display:grid;grid-template-columns:var(--age-cols);gap:16px;align-items:end;justify-items:center;
  padding:0 16px 10px;color:#6b7681;font-size:10px;font-weight:700;letter-spacing:.5px;line-height:1.35;text-align:center}
.agehead span{white-space:nowrap}
.agehead .hi{display:inline-block;vertical-align:-2px;margin-right:3px}
.agerows{display:flex;flex-direction:column;gap:10px}
.age{position:relative;display:grid;grid-template-columns:var(--age-cols);gap:16px;align-items:center;justify-items:center;overflow:hidden;
  background:linear-gradient(180deg,#15181d,#0f1115);border:1px solid #232830;border-radius:5px;padding:14px 16px;
  cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s}
.age:hover{transform:translateY(-1px);box-shadow:0 12px 28px -18px rgba(0,0,0,.7)}
.age::after{content:"";position:absolute;inset:0;z-index:0;opacity:0;pointer-events:none;transition:opacity .3s;
  background:radial-gradient(120% 140% at 0% 50%, var(--glow-a), transparent 55%),radial-gradient(120% 140% at 100% 50%, var(--glow-b), transparent 55%);
  background-size:200% 100%;background-position:0% 50%}
.age:hover::after{opacity:1;animation:ageFlow 3.2s ease-in-out infinite}
@keyframes ageFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.age>*{position:relative;z-index:1}
.age:hover{border-color:var(--glow-bd)}
/* While the counts are still loading, the row is not clickable (opening the popup now would show a
   wrong 0). Disable the pointer + hover lift/glow until renderAgeChunk removes .age-loading. */
.age.age-loading{cursor:default;pointer-events:none}
.age.age-loading:hover{transform:none;box-shadow:none;border-color:#232830}
.age.age-loading:hover::after{opacity:0;animation:none}
.age.purple{--glow-a:rgba(167,139,250,.20);--glow-b:rgba(167,139,250,.08);--glow-bd:rgba(167,139,250,.55)}
.age.black{--glow-a:rgba(139,150,160,.16);--glow-b:rgba(139,150,160,.06);--glow-bd:rgba(139,150,160,.5)}
.age.red{--glow-a:rgba(255,107,107,.20);--glow-b:rgba(255,107,107,.08);--glow-bd:rgba(255,107,107,.55);border-color:#3a2323}
.age.yellow{--glow-a:rgba(251,191,36,.20);--glow-b:rgba(251,191,36,.08);--glow-bd:rgba(251,191,36,.55)}
.age.green{--glow-a:rgba(74,222,128,.20);--glow-b:rgba(74,222,128,.08);--glow-bd:rgba(74,222,128,.55)}
.age::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;z-index:2}
.age.purple::before{background:var(--pu)}.age.black::before{background:#8b96a0}.age.red::before{background:var(--rd)}.age.yellow::before{background:var(--am)}.age.green::before{background:var(--gr)}
.age .band{display:flex;align-items:center;gap:11px;min-width:0;text-align:left}
.age .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.age.purple .dot{background:var(--pu)}.age.black .dot{background:#5f6b6c}.age.red .dot{background:var(--rd)}.age.yellow .dot{background:var(--am)}.age.green .dot{background:var(--gr)}
.age .band .lbl{line-height:1.25}
.age .band .lbl b{display:block;color:#eef2f4;font-size:13px;font-weight:700;letter-spacing:.3px}
.age .band .lbl span{color:#8b96a0;font-size:10.5px}
.age .agents-count{font-size:18px;font-weight:800;color:#eef2f4}
.age .agents-count.mut{color:#5f6b6c}
.age .tik{font-size:18px;font-weight:800}
.age.purple .tik{color:#c9b6ff}.age.red .tik{color:#ff8a8a}.age.yellow .tik{color:#ffcf5e}.age.green .tik{color:#7ef2a8}.age.black .tik{color:#8b96a0}
.age .idlist{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;width:100%}
.age .idchips{display:grid;grid-template-columns:auto auto;gap:6px 8px;align-items:center}
.age .idchips.idchips-2{grid-template-columns:auto auto}
.age .idchips.idchips-3{grid-template-columns:auto auto auto}
.age .idchips.idchips-4{grid-template-columns:auto auto auto auto}
.age .idchip{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;background:#12161c;border:1px solid #232c36;border-radius:5px;padding:3px 8px 3px 3px;font-size:11px;color:#cfd7dd;white-space:nowrap;min-width:110px}
.age .idchip.idchip-noava{padding:3px 10px}
/* Push the login id to the LEFT and the count to the RIGHT corner of the chip. */
.age .idchip b{margin-right:auto}
.age .idchip .ct{margin-left:auto}
.age .idchip .av{width:20px;height:20px;border-radius:50%;overflow:hidden;flex-shrink:0;display:grid;place-items:center}
