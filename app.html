<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q3 Live Dashboard · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="shimmer.css">
<style>
:root{--o:#ff9900;--oh:#ec7211;--ol:#ffb84d;--bl:#2074d5;--bll:#44b9d6;--tl:#1b9cb0;--g:#1d8102;--gl:#3ecf4a;--r:#d13212;--rl:#ff5252;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--s:#000;--a1:#7dd3fc;--a2:#fbbf24;--b:#4ade80}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:flex-start;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.1em;font-weight:700;color:#fff;line-height:1}
.logo-link{text-decoration:none;cursor:pointer;transition:opacity .15s}
.logo-link:hover{opacity:.82}
.live-badge{font-size:.7em;font-weight:700;letter-spacing:.5px;color:#4ade80;background:rgba(74,222,128,.14);border:1px solid rgba(74,222,128,.4);border-radius:20px;padding:3px 12px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;animation:livepulse 2s ease-in-out infinite}
.live-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:liveblink 1s steps(1,end) infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.62}}
@keyframes liveblink{0%,49%{opacity:1;box-shadow:0 0 8px 2px #4ade80}50%,100%{opacity:.25;box-shadow:0 0 0 0 rgba(74,222,128,0)}}
/* Second row: toolbar holding all nav + action buttons */
/* Two explicit rows: nav on line 1, action buttons on line 2. */
.toolbar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:10px 24px;display:flex;flex-direction:column;align-items:stretch;gap:10px;position:sticky;top:53px;z-index:99}
.toolbar-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--bd)}
.nav-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Priority blink for BLACK / out-of-policy PURPLE ticket sections */
.blink-alert{animation:blinkAlert 1s ease-in-out infinite;border:1px solid rgba(255,82,82,.55)!important}
/* KPI value cell blink (e.g. Repeat Incident % above threshold): red text pulse. */
.kt-value.kpi-blink-alert{color:#ff5252!important;font-weight:800;animation:kpiBlinkText 1s ease-in-out infinite}
@keyframes kpiBlinkText{0%,100%{opacity:1;text-shadow:0 0 8px rgba(255,82,82,.6)}50%{opacity:.45;text-shadow:none}}
@keyframes blinkAlert{0%,100%{box-shadow:0 0 0 0 rgba(255,82,82,0);background:#0a0a0a}50%{box-shadow:0 0 14px 2px rgba(255,82,82,.5);background:rgba(255,82,82,.09)}}
.btn{display:inline-flex;align-items:center;padding:7px 16px;background:var(--o);color:#000;border-radius:4px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.btn.danger{background:var(--r);color:#fff}
.content{padding:24px;max-width:1600px;margin:0 auto}
.page-title{margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.page-title h1{font-size:1.8em;color:#fff;font-weight:700}
.page-title p{color:var(--tm);margin-top:4px;font-size:.9em}
/* Dashboard title row: Q3 (left) + LIVE (right), plus Alerts/Upload/data-log actions. */
/* Split toolbar: personal nav pinned left, data actions pinned right. */
/* Title row sits in the header band. Reserve space on the right for the floating top-right cluster
   (Uploaded data log + avatar) so the title never tucks underneath it. */
.dash-title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;min-height:46px;padding-right:240px}
.dash-title-row:not(:empty){margin-bottom:20px}
@media(max-width:760px){.dash-title-row{padding-right:0}}
.dash-title-h1{font-size:1.8em;color:#fff;font-weight:700;margin:0;display:inline-flex;align-items:center;gap:12px;flex:1 1 auto;justify-content:space-between}
/* Dashboard title label (replaces the old My Tickets button in this row). */
.dash-title-name{font-size:1.5em;color:#fff;font-weight:700;letter-spacing:.3px}
/* Each group is a segmented pill container so its buttons read as one cohesive control. */
.dash-actions{display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap;background:#0e141b;border:1px solid #2f3a45;border-radius:12px;padding:4px}
.dash-actions-left{margin-right:auto}
.dash-actions-right{margin-left:auto}
.dash-act{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;box-sizing:border-box;white-space:nowrap;border:1px solid transparent!important;background:transparent!important;color:#cdd7de!important;border-radius:9px;padding:0 16px;font-size:.88em;font-weight:600;box-shadow:none!important;transition:background .14s,color .14s}
.dash-act:hover{background:rgba(255,255,255,.06)!important;color:#fff!important}
.dash-act svg{flex-shrink:0;opacity:.9}
/* Upload = the one primary/accent action (admins). */
.dash-actions-right button.dash-act{color:#ff9f2e!important}
.dash-actions-right button.dash-act:hover{background:linear-gradient(180deg,#ff9f2e,#f07d0a)!important;color:#fff!important}
/* Scope selector (Overall / Q3 live / Q2) — centered chip radios replacing the old title. */
.dash-scope{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.dash-scope-opt{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;font-size:.9em;font-weight:600;color:#aab7c2;cursor:pointer;user-select:none;border:1px solid #2f3a45;background:#0e141b;transition:background .15s,color .15s,border-color .15s}
.dash-scope-opt input{position:absolute;opacity:0;width:0;height:0}
.dash-scope-opt:hover{color:#e6edf0;border-color:#3d566a}
.dash-scope-opt.checked{color:#fff;background:linear-gradient(180deg,#ff9f2e,#f07d0a);border-color:#f07d0a;box-shadow:0 2px 8px rgba(240,125,10,.35)}
.dash-scope-live{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:liveblink 1s steps(1,end) infinite}
.dash-scope-opt.checked .dash-scope-live{background:#fff;box-shadow:0 0 6px #fff}
@media(max-width:700px){.dash-scope{flex:1 1 100%;order:-1}}
/* Section header row: title on the left, its own scope selector on the right. */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{margin:0}
/* Per-section scope selector (Q3 Live | Q2 | Overall) — compact chip radios on the section header. */
.dash-scope-sec{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.dsc-opt{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:.8em;font-weight:600;color:#aab7c2;cursor:pointer;user-select:none;border:1px solid #2f3a45;background:#0e141b;transition:background .15s,color .15s,border-color .15s}
.dsc-opt input{position:absolute;opacity:0;width:0;height:0}
.dsc-opt:hover{color:#e6edf0;border-color:#3d566a}
.dsc-opt.checked{color:#fff;background:linear-gradient(180deg,#ff9f2e,#f07d0a);border-color:#f07d0a;box-shadow:0 2px 8px rgba(240,125,10,.3)}
.dsc-live{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80;animation:liveblink 1s steps(1,end) infinite}
.dsc-opt.checked .dsc-live{background:#fff;box-shadow:0 0 6px #fff}
@media(max-width:600px){.dash-scope-sec{flex:1 1 100%}.dsc-opt{flex:1 1 auto;justify-content:center}}
/* When the row is tight, both groups take full width and their buttons spread evenly.
   Labels stay visible as long as they fit; collapse to icon-only on the smallest screens. */
@media(max-width:760px){
  .dash-title-row{flex-direction:column;align-items:stretch}
  .dash-actions{width:100%;justify-content:space-between}
  .dash-actions-left,.dash-actions-right{margin:0}
  .dash-actions .dash-act{flex:1 1 auto;justify-content:center}
}
@media(max-width:460px){
  .dash-act .dash-act-label{display:none}
  .dash-act{padding:9px 12px}
}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
/* KPI summary sections rendered as tables (Queue Status / Average / Repeat Incident). */
.kpi-table{width:100%;border-collapse:collapse;font-size:.9em}
.kpi-table th,.kpi-table td{padding:10px 14px;border:1px solid #223040;vertical-align:top;text-align:left}
.kpi-table thead th{background:#111820;color:var(--tm);text-transform:uppercase;font-size:.72em;letter-spacing:.5px;font-weight:700}
.kpi-table td.kt-metric{color:var(--t);font-weight:600;white-space:nowrap;padding-right:24px}
/* Extra 10px breathing room on the right of the Metric header, matching the body cells. */
.kpi-table thead th:first-child{padding-right:24px}
.kpi-table td.kt-metric .ic,.kpi-table td.kt-metric svg{vertical-align:middle;margin-right:6px;opacity:.85}
.kpi-table td.kt-value{color:#fff;font-weight:800;font-size:1.05em;white-space:nowrap;text-align:right;width:1%}
.kpi-table td.kt-desc{color:var(--tm);font-size:.82em;line-height:1.45;font-weight:400}
.kpi-table tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.kpi-card{background:var(--s);border-radius:8px;padding:20px;text-align:center;border:1px solid var(--bd);border-top:3px solid var(--o)}
.kpi-card .value{font-size:2em;font-weight:700;color:#fff;margin-bottom:4px}
.kpi-card .label{font-size:.78em;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.kpi-card.accent .value{color:var(--o)}.kpi-card.success .value{color:var(--gl)}.kpi-card.warning .value{color:var(--ol)}.kpi-card.danger .value{color:var(--rl)}
/* Compact KPI strip used by the collapsible summary cards (Queue/Total/Average/Repeat). Smaller
   tiles that sit in a single row; the explicit column count is set inline per section. */
.kpi-section{padding:16px 20px}
.kpi-section>h2{margin-bottom:0}
.kpi-section:not(.collapsed)>h2{margin-bottom:16px}
.kpi-grid-compact{gap:10px;margin-bottom:0}
.kpi-grid-compact .kpi-card{padding:12px 10px;border-top-width:2px}
.kpi-grid-compact .kpi-card{min-width:0;overflow:hidden}
/* Highlighted open-status tiles in Queue Status Data (Assigned/WIP/Researching/Pending). */
.kpi-card.qhl{background:linear-gradient(160deg,#14202b,#0f171f);border:1px solid #223243;border-top:3px solid #44b9d6}
.kpi-card.qhl .value{color:#5ecdec}
.kpi-card.qhl .label{color:#9fb8c4}
/* Visible per-tile definition text (Average Data). */
.kpi-grid-compact .kpi-card .kpi-desc{margin-top:8px;font-size:.66em;line-height:1.45;color:var(--tm);text-transform:none;letter-spacing:0;white-space:normal;font-weight:400}
.kpi-grid-compact .kpi-card .value{font-size:1.25em;margin-bottom:3px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* Label truncates to a single line (ellipsis) as the card narrows, instead of wrapping. The
   inline-flex layout is dropped for `display:block` so the whole label (icon + text) clips cleanly. */
.kpi-grid-compact .kpi-card .label{display:block;font-size:.66em;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kpi-grid-compact .kpi-card .label .ic,.kpi-grid-compact .kpi-card .label svg{vertical-align:middle;margin-right:3px}
@media(max-width:900px){
  .kpi-grid.kpi-grid-compact{grid-template-columns:repeat(3,1fr)!important}
}
@media(max-width:520px){
  .kpi-grid.kpi-grid-compact{grid-template-columns:repeat(2,1fr)!important}
  .kpi-grid-compact .kpi-card .value{font-size:1.1em}
}
.section{background:var(--s);border-radius:8px;padding:24px;margin-bottom:24px;border:1px solid var(--bd)}
/* Average Data + Repeat Incident Data shown side by side (stack on narrow screens). */
.kpi-pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.kpi-pair>.section{margin-bottom:24px}
@media(max-width:900px){.kpi-pair{grid-template-columns:1fr}}
.section h2{color:#fff;margin-bottom:18px;font-size:1.2em;font-weight:600;display:flex;align-items:center;gap:8px}
.section h2::before{content:'';display:inline-block;width:4px;height:20px;background:var(--o);border-radius:2px}
/* Collapsible sections — animated via grid-template-rows (0fr<->1fr) so height eases smoothly. */
.section.collapsible{display:grid;grid-template-rows:auto 1fr;transition:grid-template-rows .3s ease}
.section.collapsible>h2{cursor:pointer;user-select:none;justify-content:space-between}
.section.collapsible>h2 .sec-caret{margin-left:auto;color:var(--tm);transition:transform .3s ease;font-size:.8em}
.section.collapsible>.sec-body{overflow:hidden;min-height:0;transition:opacity .3s ease}
.section.collapsible.collapsed{grid-template-rows:auto 0fr}
.section.collapsible.collapsed>h2{margin-bottom:0}
.section.collapsible.collapsed>h2 .sec-caret{transform:rotate(-90deg)}
.section.collapsible.collapsed>.sec-body{opacity:0}
/* Grouped chart pair section: two charts side by side, stacked on mobile */
.section .pair-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
@media(max-width:920px){.section .pair-grid{grid-template-columns:1fr}}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:20px;margin-bottom:24px}
.chart-box{background:var(--s);border-radius:8px;padding:20px;border:1px solid var(--bd)}
.chart-box h3{color:#fff;margin-bottom:16px;text-align:center;font-size:.95em;font-weight:600}
.chart-wrap{position:relative;height:300px}
.chart-wrap.tall{height:340px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--bd);font-size:.88em}
th{background:#0a0a0a;color:var(--tm);font-weight:600;text-transform:uppercase;font-size:.75em;letter-spacing:.5px}
tr:hover{background:rgba(255,153,0,.03)}
.badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:.78em;font-weight:600}
/* Excel-sheet style tables (Incident Types / Historical Incidents): gridlines on every cell, header bg, zebra rows. */
.xls-table{border:1px solid #2f3a45}
.xls-table th,.xls-table td{border:1px solid #2f3a45;padding:8px 12px}
/* Incident Types subsection headers (Resolved by AutoSIM / by PHD agents). */
.inc-sub-h{display:flex;align-items:center;gap:8px;font-size:.95em;font-weight:700;color:#d5dbdb;margin:4px 0 8px}
.inc-sub-h .inc-sub-n{font-weight:800;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;font-size:.85em}
/* Clickable incident-type rows -> agent-breakdown popup. */
.xls-table tr.inc-clickrow{cursor:pointer}
.xls-table tr.inc-clickrow:hover td{background:rgba(255,153,0,.08)}
/* Grouped PHD incident rows (a published grouping) — purple highlight + name colour. */
.xls-table tr.inc-grouped td{background:rgba(167,139,250,.08)}
.xls-table tr.inc-grouped td:nth-child(2) strong{color:#a78bfa}
/* "View types" button on a grouped row — opens the member-list popup. */
.inc-grp-btn{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:2px 9px;font-size:.72em;font-weight:700;color:#a78bfa;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.45);border-radius:20px;cursor:pointer;vertical-align:middle}
.inc-grp-btn:hover{background:rgba(167,139,250,.24);color:#c4b5fd}
.inc-grp-btn svg{width:12px;height:12px}
/* PHD agent popup: table on the left, per-agent bar chart on the right (uses the old Volume space).
   The chart column is vertically centered against the table's height. */
.inc-ag-split{display:grid;grid-template-columns:minmax(320px,1fr) 1.3fr;gap:20px;align-items:center}
.inc-ag-split .inc-ag-tbl{min-width:0;overflow-x:auto;align-self:start}
.inc-ag-split .inc-ag-chart{min-width:0}
@media(max-width:820px){.inc-ag-split{grid-template-columns:1fr}}
/* Agent cell in the incident-type popup: avatar + name/handle. */
.inc-ag-cell{display:inline-flex;align-items:center;gap:9px}
.inc-ag-cell .phd-avatar{width:28px!important;height:28px!important;font-size:12px!important}
.inc-ava-fallback{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(167,139,250,.15);color:#a78bfa}
.inc-ag-name{display:inline-flex;flex-direction:column;line-height:1.25;font-weight:700;color:#fff}
.inc-ag-name .inc-ag-sub{font-weight:400;font-size:.8em;color:var(--tm)}
/* Incident-tickets drill-down: Title column truncates with an ellipsis (full text on hover).
   Auto layout + a bounded max-width on the cell lets the other 4 columns stay fit-to-content
   while Title absorbs the rest and clips. */
.inc-tk-table td.inc-tk-title{max-width:1px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9d3d4}
/* Ticket-ID link in the drill-down: brighter + larger for legibility (icon lives in the header). */
.inc-tk-table .inc-tk-id{color:#5ecdec;font-weight:700;font-size:1em;letter-spacing:.2px;text-decoration:none}
.inc-tk-table .inc-tk-id:hover{color:#8fe0f5;text-decoration:underline}
/* Sortable Created/Resolved headers. */
.inc-tk-table th.inc-sort-th:hover{color:#ff9900}
.inc-tk-table th.inc-sort-th .inc-sort-ar{font-size:.9em;color:#ff9900}
.xls-table thead th{background:#111820}
.xls-table tbody tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.xls-table tbody tr:hover td{background:rgba(255,153,0,.06)}
.badge-g{background:rgba(62,207,74,.2);color:#3ecf4a;font-weight:700}
.badge-w{background:rgba(255,153,0,.15);color:var(--ol)}
.handoff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.handoff-box{background:#0a0a0a;border-radius:6px;padding:16px;border:1px solid var(--bd)}
.handoff-box h3{color:var(--o);margin-bottom:12px;font-size:.9em;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.handoff-box ul{list-style:none;padding:0}
.handoff-box li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;font-size:.9em}
.handoff-box li:last-child{border-bottom:none}
.handoff-box .val{color:var(--o);font-weight:600}
.meta-info{color:var(--tm);font-size:.85em;margin-bottom:16px}
/* ================= Shift Report (redesigned) ================= */
.sr{max-width:1200px}
.sr-hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:linear-gradient(135deg,rgba(255,153,0,.12),#0a0a0a 55%);border:1px solid var(--bd);border-left:3px solid var(--o);border-radius:16px;padding:22px 24px;margin-bottom:26px}
.sr-eyebrow{color:var(--o);font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.sr-hero-txt h1{color:#fff;font-size:1.7em;font-weight:800;margin:6px 0 8px}
.sr-lead{color:var(--tm);font-size:.92em;max-width:620px;line-height:1.6}
.sr-lead strong{color:#fff}
.sr-hero-badge{text-align:center;background:#000;border:1px solid var(--bd);border-radius:14px;padding:16px 26px;flex-shrink:0}
.sr-hero-num{font-size:2.4em;font-weight:800;color:var(--o);line-height:1}
.sr-hero-cap{color:var(--tm);font-size:.72em;text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
.sr-sec{margin-bottom:30px}
.sr-sec-head{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.sr-sec-head h2{color:#fff;font-size:1.15em;font-weight:800;display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.sr-sec-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
.sr-sec-head h2 .ic{color:var(--o)}
.sr-exp{white-space:nowrap}
/* Bordered shift-report sections (Takeover / Handoff) — card look, no collapse. */
.sr-sec.sr-card-sec{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;padding:18px 20px}
@media(max-width:560px){
  .sr-sec-head{flex-wrap:wrap}
  .sr-sec-head h2{flex-basis:auto}
  .sr-exp{font-size:.8em}
}
/* Age-colour queue tiles */
.sr-colors{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.sr-color{position:relative;background:#000;border:1px solid var(--bd);border-radius:12px;padding:16px 12px 14px;text-align:center;overflow:hidden}
.sr-color::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--sc)}
.sr-color-dot{width:10px;height:10px;border-radius:50%;background:var(--sc);margin:0 auto 8px;box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 22%,transparent)}
.sr-color-v{font-size:1.9em;font-weight:800;color:#fff;line-height:1}
.sr-color-l{color:#fff;font-size:.82em;font-weight:600;margin-top:6px}
.sr-color-r{color:var(--tm);font-size:.68em;margin-top:3px}
.sr-purple{--sc:#a78bfa}.sr-black{--sc:#8a8a8a}.sr-red{--sc:#ff5252}.sr-yellow{--sc:#fbbf24}.sr-green{--sc:#4ade80}
.sr-chart-card{background:linear-gradient(160deg,#0f0f0f,#000);border:1px solid #333;border-radius:14px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.sr-chart-card h3{color:#fff;font-size:.95em;font-weight:600;text-align:center;letter-spacing:.4px;margin-bottom:14px}
/* Handoff meta chips + cards */
.sr-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.sr-chip{background:#0a0a0a;border:1px solid var(--bd);border-radius:20px;padding:6px 14px;font-size:.82em;color:var(--tm);display:inline-flex;align-items:center;gap:6px}
.sr-chip b{color:#fff;font-weight:600}
.sr-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sr-card{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;padding:16px 18px}
.sr-card h3{color:var(--o);font-size:.78em;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.sr-card ul{list-style:none;padding:0;margin:0}
.sr-card li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.9em}
.sr-card li:last-child{border-bottom:none}
.sr-card li span{color:var(--t)}
.sr-card li em{color:var(--tm);font-style:normal;font-size:.85em}
.sr-card li b{color:#fff;font-weight:800;font-size:1.05em}
/* Tally value inside stat cards (renders as the bold number). Inside colour tiles it inherits the big size. */
.sr-card li .sr-v{color:#fff;font-weight:800;font-size:1.05em;flex-shrink:0}
/* Handoff Report sections rendered as tables (one table per card). */
.sr-table{width:100%;border-collapse:collapse;font-size:.9em}
.sr-table td{padding:8px 10px;border:1px solid rgba(255,255,255,.09);vertical-align:middle}
.sr-table td:first-child{color:var(--t)}
.sr-table td.sr-v{text-align:right;white-space:nowrap;color:#fff;font-weight:800;font-size:1.02em;width:1%}
.sr-table td em{color:var(--tm);font-style:normal;font-size:.85em}
.sr-table tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.sr-table .sr-pct{color:#fff;font-weight:800}
.sr-table .sk-row-v{width:26px;height:16px}
.sr-pct{color:#fff;font-weight:800;font-size:1.05em}
.sr-notes{margin-top:20px}
.sr-notes label{display:flex;align-items:center;gap:6px;color:var(--tm);font-size:.8em;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.sr-notes textarea{width:100%;min-height:110px;padding:12px 14px;background:#0a0a0a;border:1px solid var(--bd);border-radius:10px;color:#fff;font-family:inherit;font-size:.9em;resize:vertical}
.sr-notes textarea:focus{outline:none;border-color:var(--o)}
@media(max-width:760px){.sr-colors{grid-template-columns:repeat(2,1fr)}.sr-hero-badge{flex:1 1 100%}}
/* Shift Report shimmer skeleton blocks */
.sk-blk{position:relative;overflow:hidden;background:#141414;border-radius:6px;display:inline-block}
.sk-blk::after{content:"";position:absolute;top:0;left:-150%;height:100%;width:150%;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.06) 50%,transparent 100%);animation:skmove 1.3s infinite}
@keyframes skmove{100%{left:150%}}
.sk-num{width:52px;height:30px}
.sk-lbl{width:70px;height:12px}
.sk-sub{width:96px;height:10px}
.sk-h3{width:150px;height:13px;margin-bottom:14px}
.sr-card li .sk-row-l{width:55%;height:12px}
.sr-card li .sk-row-v{width:26px;height:16px}
.tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:.72em;font-weight:600}
.tag-a1{background:rgba(125,211,252,.15);color:var(--a1)}.tag-a2{background:rgba(251,191,36,.15);color:var(--a2)}.tag-b{background:rgba(74,222,128,.15);color:var(--b)}
.upload-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.drop-zone{border:2px dashed var(--bd);border-radius:12px;padding:50px 30px;cursor:pointer;text-align:center;max-width:500px;width:100%}
.drop-zone:hover{border-color:var(--o)}
.spinner{width:48px;height:48px;border:4px solid var(--bd);border-top:4px solid var(--o);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
/* Small inline spinner for a loading number, and chart-area spinner overlay (shell -> DB fill) */
.num-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
.chart-spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--s);z-index:2}
.chart-spin .spinner{margin:0}
.hidden{display:none}
/* Icon alignment: labels/buttons show icon + text neatly */
.kpi-card .label{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
/* Ticket Age tiles: count / COLOR / (range) stacked on separate lines */
.age-tile .age-name{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.9em;letter-spacing:.5px;margin-top:6px;color:#fff}
.age-tile .age-range{color:var(--tm);font-size:.72em;margin-top:4px}
/* The 5 age tiles ALWAYS spread across the full width (equal columns that shrink together),
   so they never leave a half-empty row on narrow screens. Use .kpi-grid.age-grid for higher
   specificity than the generic .kpi-grid mobile rules below (which would otherwise override). */
.kpi-grid.age-grid{grid-template-columns:repeat(5,1fr);margin-bottom:0}
@media(max-width:640px){
  .kpi-grid.age-grid{grid-template-columns:1fr 1fr 1fr}   /* 3 across, still full width */
  .age-tile{padding:14px 8px}
  .age-tile .age-range{font-size:.68em}
}
/* ---- Ticket Age Classification as an Excel-style table ---- */
.age-xls-wrap{overflow-x:auto;margin-top:6px}
.age-xls{width:100%;border-collapse:collapse;font-size:.9em;min-width:520px;table-layout:auto}
.age-xls th,.age-xls td{border:1px solid #2f3a45;padding:11px 14px;text-align:center;vertical-align:middle}
/* Width priority: the two icon columns (5 = SR/Addr Excl, 6 = No EMT) absorb the free space so their
   per-agent icon rows have room; every other column shrinks to fit its own content (width:1% + nowrap
   forces auto-layout to give them only what they need). */
.age-xls th:nth-child(1),.age-xls td:nth-child(1),
.age-xls th:nth-child(2),.age-xls td:nth-child(2),
.age-xls th:nth-child(3),.age-xls td:nth-child(3),
.age-xls th:nth-child(4),.age-xls td:nth-child(4),
.age-xls th:nth-child(7),.age-xls td:nth-child(7){width:1%;white-space:nowrap}
.age-xls th:nth-child(5),.age-xls td:nth-child(5),
.age-xls th:nth-child(6),.age-xls td:nth-child(6){width:auto}
.age-xls thead th{background:#111820;color:var(--tm);font-size:.72em;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
/* Icon + label in the SR / No-EMT header cells: center them together with a consistent gap. */
.age-xls thead th .age-th-lbl{display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1}
.age-xls thead th .age-th-lbl svg{flex-shrink:0}
.age-xls tbody tr:hover td{background:rgba(255,153,0,.05)}
/* Whole-row click target (replaces the old Details "View tickets" button). */
.age-xls tbody tr.age-clickrow{cursor:pointer}
.age-xls tbody tr.age-clickrow:hover td{background:rgba(255,153,0,.09)}
.age-xls .age-swatch{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:800;letter-spacing:.4px}
.age-xls .age-swatch .dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.age-xls .age-rng{color:var(--tm);font-size:.85em}
.age-xls td.age-agents{text-align:center;font-weight:800;color:#fff}
.age-xls td.age-cnt{text-align:center;font-weight:800}
/* Priority-label column (Station Request / Address Exclusion): one profile icon per agent. */
.age-xls td.age-prio{text-align:center;font-weight:800;color:var(--tm);padding:9px 12px}
.age-xls td.age-prio .prio-icons{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
/* Each agent reads as one pill: avatar + count on a subtle rounded chip, so they don't blur together. */
.age-xls td.age-prio .prio-agent{display:inline-flex;align-items:center;gap:6px;cursor:default;background:rgba(255,255,255,.04);border:1px solid #2b3742;border-radius:999px;padding:3px 10px 3px 3px;transition:border-color .12s,background .12s}
.age-xls td.age-prio .prio-agent:hover{background:rgba(255,255,255,.08);border-color:#3d566a}
/* Avatar chip: a circular ring (roster-colored via inline box-shadow) around the 22px avatar. */
.age-xls td.age-prio .prio-ava{display:inline-flex;align-items:center;justify-content:center;line-height:0;border-radius:50%}
.age-xls td.age-prio .prio-ava .phd-avatar{width:22px!important;height:22px!important;font-size:10px!important}
.age-xls td.age-prio .prio-ava-fallback{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px}
.age-xls td.age-prio .prio-n{font-weight:800;color:#fff;font-size:.9em;min-width:8px;text-align:center}
.age-xls td.age-prio .age-prio-zero{color:#5f6b6c;font-weight:800}
.age-xls .age-view{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;font-size:.8em;font-weight:600;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--t);cursor:pointer;font-family:inherit;transition:border-color .12s,color .12s}
.age-xls .age-view:hover{border-color:var(--o);color:var(--o)}
.age-xls tr.blink-alert td:first-child{box-shadow:inset 4px 0 0 var(--rl)}
/* ---- Color popup: agent accordion + per-agent Excel ticket table ---- */
.ap-agent{border:1px solid #2f3a45;border-radius:10px;margin-bottom:12px;overflow:hidden;background:#0b0f14}
.ap-agent-head{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;background:transparent;border:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .12s}
.ap-agent-head:hover{background:rgba(255,255,255,.03)}
.ap-agent-name{color:#fff;font-weight:700;font-size:1.12em}
.ap-agent-name .sub{color:var(--tm);font-weight:400;font-size:.85em;margin-left:8px}
/* Crown badge next to an agent's name = count of Station Request / Address Exclusion tickets. */
.ap-agent-prio{display:inline-flex;align-items:center;gap:4px;margin-left:10px;font-size:.82em;font-weight:800;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);border-radius:20px;padding:1px 9px;vertical-align:middle;cursor:default}
.ap-agent-prio svg{flex-shrink:0}
/* No-EMT badge next to an agent's name = count of No-EMT tickets (red no-entry mark). */
.ap-agent-noemt{color:#ff8080;background:rgba(255,82,82,.12);border-color:rgba(255,82,82,.4)}
/* Marker icon next to a ticket id (expanded agent table + per-agent drill-down cards). */
.ap-crown{display:inline-flex;align-items:center;cursor:default;margin-left:4px;color:#fbbf24;vertical-align:middle}
.ap-noemt{color:#ff8080}
/* Highlight priority ticket rows (Station Request / Address Exclusion) with a soft amber wash. */
.ap-tbl tr.ap-row-prio td{background:linear-gradient(180deg,rgba(251,191,36,.10),rgba(251,191,36,.05))}
.ap-tbl tr.ap-row-prio:hover td{background:linear-gradient(180deg,rgba(251,191,36,.16),rgba(251,191,36,.09))}
/* Priority ticket card (per-agent drill-down): same soft amber wash. */
.pc-tk.pc-tk-prio{background:linear-gradient(180deg,rgba(251,191,36,.10),rgba(251,191,36,.04))}
.ap-agent-count{margin-left:auto;font-weight:800;background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:20px;padding:4px 14px;font-size:1em}
.ap-caret{color:var(--tm);transition:transform .25s ease;flex-shrink:0;font-size:1.1em}
.ap-agent.open .ap-caret{transform:rotate(180deg)}
.ap-agent-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.ap-agent.open .ap-agent-body{max-height:3000px}
.ap-scroll{overflow-x:auto}
.ap-tbl{width:100%;border-collapse:collapse;font-size:1em;table-layout:fixed}
.ap-tbl th,.ap-tbl td{border-top:1px solid #1b2530;padding:11px 16px;text-align:left;vertical-align:middle;overflow-wrap:break-word;word-break:break-word}
.ap-tbl thead th{background:#0d1319;color:var(--tm);font-size:.8em;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.ap-tbl tbody tr:hover td{background:rgba(255,153,0,.05)}
.ap-tbl .ap-id{color:#44b9d6;text-decoration:none;font-weight:700}
.ap-tbl .ap-id:hover{text-decoration:underline}
.ap-tbl .ap-st{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.ap-tbl .ap-left-ok{color:#4ade80;font-weight:700}
.ap-tbl .ap-left-warn{color:#fbbf24;font-weight:700}
.ap-tbl .ap-left-over{color:#ff5252;font-weight:800}
.ap-tbl td.ap-cmt{white-space:normal;color:#c9d3d4;font-size:.9em;line-height:1.45}
.ap-tbl td.ap-cmt .pc-tk-cmt-txt{color:inherit}
.ap-add-cmt{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;font-size:.9em;font-weight:600;border:1px solid var(--o);border-radius:6px;background:rgba(255,153,0,.1);color:var(--o);cursor:pointer;font-family:inherit}
.ap-add-cmt:hover{background:var(--o);color:#141414}
/* When the inline comment editor is open, the wrapping span must become a full-width block so the
   textarea + buttons can span the whole Last-comment cell (a span is shrink-to-fit by default). */
.ap-cmt .pc-tk-cmt-txt:has(.ap-cmt-input){display:block;width:100%}
.ap-cmt-input{display:block;width:100%;box-sizing:border-box;min-width:0;min-height:52px;background:#000;border:1px solid var(--bd);border-radius:6px;color:#fff;font-size:.95em;padding:7px 9px;font-family:inherit;line-height:1.4;resize:vertical}
.ap-cmt-actions{display:flex;gap:8px;margin-top:6px;width:100%}
.ap-cmt-save,.ap-cmt-cancel{flex:1 1 0;box-sizing:border-box;text-align:center;padding:5px 12px;font-size:.85em;font-weight:600;border-radius:6px;cursor:pointer;font-family:inherit;border:1px solid var(--bd)}
.ap-cmt-save{background:var(--o);color:#141414;border-color:var(--o)}
.ap-cmt-cancel{background:transparent;color:var(--t)}
.ap-cmt-cancel:hover{border-color:var(--o);color:var(--o)}
/* Historical Incidents: text/stat cells (left) + pet-vs-nonpet doughnut (right). */
.hi-split{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:center}
.hi-split-left{min-width:0}
.hi-split-chart{position:relative;height:180px}
@media(max-width:640px){.hi-split{grid-template-columns:1fr}.hi-split-chart{height:200px;max-width:280px;margin:0 auto}}
@media(max-width:400px){
  .kpi-grid.age-grid{grid-template-columns:1fr 1fr}        /* 2 across on very small phones */
}
.btn .ic,.btn svg.ic{margin-right:2px}
.ic{opacity:.9}
/* Wide tables scroll horizontally instead of breaking the layout on small screens */
.section table{min-width:520px}
.section > div[style*="overflow"], .section{ }
@media(max-width:1024px){
  .charts-grid{grid-template-columns:1fr}
  .content{padding:18px}
}
@media(max-width:768px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:14px}
  .top-bar{padding:10px 14px}
  .toolbar{padding:8px 14px}
  .logo span{font-size:1em}
  .page-title h1{font-size:1.4em}
  .btn{padding:6px 12px;font-size:.8em}
  .chart-wrap{height:260px}
  /* let any table live inside a horizontal scroller */
  .section table{display:block;overflow-x:auto;white-space:nowrap}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr}
  .toolbar-nav,.toolbar-actions{width:100%}
  .kpi-card .value{font-size:1.6em}
}
/* ---- Ticket/agent popups (color popup + agent drill-down): responsive, full-width on mobile ---- */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
/* flex:1 1 100% (not just width:100%) so the card actually fills the overlay up to its max-width;
   a plain flex child can otherwise shrink to its content and only use ~half the width. */
.popup-card{background:#111;border:1px solid #333;border-radius:12px;flex:1 1 100%;width:100%;max-height:82vh;overflow:auto;padding:24px}
.popup-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.popup-head h2{font-size:1.2em;margin:0}
.popup-actions{display:flex;gap:10px;flex-shrink:0}
.pc-subcount{color:var(--tm);font-size:.82em;margin-top:4px}
.pt-default{margin-left:8px;padding:2px 6px;background:rgba(249,115,22,.15);color:#f97316;border-radius:3px;font-size:.7em;vertical-align:middle}
.pc-none{color:#5f6b6c;font-size:.85em;font-style:italic;margin:4px 0 0}
/* ---- Section headers (Registered / Non-registered) ---- */
.pc-section{margin-top:20px}
.pc-section-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pc-section-title{font-weight:700;font-size:.95em;display:inline-flex;align-items:center;gap:6px}
.pc-section-meta{color:#5f6b6c;font-size:.8em}
.pc-section-note{color:#879596;font-size:.78em;margin:-4px 0 10px}
/* ---- Agent cards (color popup): responsive grid, avatar + name + count pill ---- */
.pc-agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pc-agent{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;background:#0d1420;border:1px solid var(--bd);border-radius:10px;cursor:pointer;font-family:inherit;transition:border-color .12s,background .12s}
.pc-agent:hover{border-color:var(--o);background:#141d2b}
.pc-agent-av{flex-shrink:0;display:inline-flex}
.pc-agent-name{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
.pc-agent-name strong{font-size:.95em;overflow-wrap:anywhere}
.pc-agent-sub{color:#5f6b6c;font-size:.74em}
.pc-agent-count{flex-shrink:0;font-weight:800;font-size:1.5em;line-height:1;min-width:34px;text-align:right}
/* ---- Ticket cards (agent drill-down): stacked list ---- */
.pc-tk-list{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.pc-tk{background:#0d1420;border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.pc-tk-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pc-tk-id{color:#44b9d6;font-weight:700;font-size:.92em;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.pc-tk-id:hover{text-decoration:underline}
.pc-tk-status{font-size:.72em;font-weight:700;text-transform:uppercase;letter-spacing:.4px;border:1px solid;border-radius:20px;padding:3px 10px;background:rgba(255,255,255,.03)}
.pc-tk-meta{color:#879596;font-size:.82em;margin-top:8px;display:inline-flex;align-items:center;gap:6px}
.pc-tk-age{color:#5f6b6c}
.pc-tk-cmt{color:#879596;font-size:.83em;margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd);display:flex;gap:6px;line-height:1.5}
.pc-tk-cmt svg{flex-shrink:0;margin-top:2px}
@media(max-width:600px){
  .popup-overlay{padding:8px}
  .popup-card{padding:16px;max-height:92vh;border-radius:10px}
  .popup-head{flex-direction:column;align-items:stretch;gap:12px}
  .popup-head h2{font-size:1.1em;line-height:1.3}
  .popup-actions{width:100%}
  .popup-actions .btn{flex:1 1 auto;justify-content:center;text-align:center}
  .pc-agent-grid{grid-template-columns:1fr}
}

/* Global: main content spans 90% of the viewport at all sizes. */
.wrap,.content{width:auto!important;max-width:none!important;margin-left:15px!important;margin-right:15px!important}
