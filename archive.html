<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program History (BC Era) · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--o:#ec7211;--oh:#c85f0e;--t:#2a3340;--tm:#5c6773;--bd:#e2e7eb;--ac:#7c5cf0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#f3f5f7;color:var(--t);min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto}
.logo span{font-size:1.1em;font-weight:700;color:#1b2026}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--o);color:#fff;border-radius:5px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn.sec{background:#fff;border:1px solid var(--bd);color:var(--t)}
.btn.sec:hover{border-color:var(--o);color:var(--o)}
.wrap{padding:26px 24px 60px;width:auto;max-width:none;margin-left:15px;margin-right:15px}
/* ---- Hero banner (BC era: violet->indigo) ---- */
.bc-hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-radius:5px;padding:22px 26px;margin-bottom:18px;color:#fff;
  background:linear-gradient(100deg,#5b3fd6,#7c5cf0 50%,#a98bff);box-shadow:0 14px 34px -20px rgba(91,63,214,.7)}
.bc-hero .hb-eyebrow{font-size:.72em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
.bc-hero .hb-title{font-size:1.75em;font-weight:800;letter-spacing:-.5px;margin:4px 0 0;display:flex;align-items:center;gap:12px}
.bc-hero .hb-sub{font-size:.9em;font-weight:500;opacity:.92;margin-top:6px;max-width:70ch}
.bc-hero .hb-badge{display:inline-flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.92);border-radius:5px;padding:12px 20px;color:#3b1a78}
.bc-hero .hb-badge .n{font-size:1.9em;font-weight:900;line-height:1}
.bc-hero .hb-badge .l{font-size:.64em;font-weight:800;letter-spacing:.6px;text-transform:uppercase;opacity:.8;margin-top:3px}
.bc-hero::after{content:"";position:absolute;top:0;bottom:0;right:0;width:220px;background-repeat:no-repeat;background-position:right center;background-size:auto 110%;opacity:.25;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);mask-image:linear-gradient(90deg,transparent,#000 60%);
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none" stroke="%23ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="20" width="48" height="46" rx="5"/><path d="M22 33h48M35 14v10M57 14v10"/><path d="M86 30a14 14 0 1 1-5 24"/><path d="M86 24v8h8"/></svg>')}
/* ---- Year checkpoints ---- */
/* Year selector = ONE horizontal row: label | chips | Clear. flex + nowrap-ish; chips may wrap only
   if the viewport is truly narrow. !important guards against app-light.css forcing block display. */
.bc-years{display:flex!important;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--bd);border-radius:5px;padding:12px 16px;margin-bottom:18px;box-shadow:0 2px 10px rgba(20,40,70,.05)}
.bc-years-t{display:inline-flex;align-items:center;gap:7px;font-size:.8em;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#1b2026;white-space:nowrap;flex:0 0 auto}
.bc-years-t svg{width:14px;height:14px;color:var(--ac)}
.bc-year-chips{display:inline-flex!important;flex-wrap:wrap;gap:8px;align-items:center}
.bc-years .bc-clear{margin-left:auto;flex:0 0 auto}
/* Checkbox-style chip: a square box (with a check when selected) + the year label. */
.bc-chip{display:inline-flex!important;align-items:center;gap:8px;padding:8px 14px;border-radius:5px;border:1.5px solid #dce1e7;background:#fff;color:#5c6773;font-weight:700;font-size:.86em;cursor:pointer;white-space:nowrap;transition:all .14s;width:auto}
.bc-chip:hover{border-color:#b9a7f3;color:#1b2026;background:#faf9ff}
.bc-box{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;border:1.5px solid #c6cdd4;background:#fff;transition:all .14s}
.bc-chk{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.6);transition:opacity .14s,transform .14s}
.bc-chip.on{border-color:#7c5cf0;color:#5b3fd6;background:#f3efff}
.bc-chip.on .bc-box{background:linear-gradient(135deg,#7c5cf0,#9d7bf7);border-color:#7c5cf0}
.bc-chip.on .bc-chk{opacity:1;transform:scale(1)}
.bc-chip-all{font-weight:800}
.bc-chip-all.on{background:linear-gradient(120deg,#7c5cf0,#9d7bf7);border-color:#7c5cf0;color:#fff}
.bc-chip-all.on .bc-box{background:#fff;border-color:#fff}
.bc-chip-all.on .bc-chk{color:#7c5cf0}
.bc-clear{background:transparent;border:1px solid var(--bd);color:var(--tm);border-radius:5px;padding:6px 13px;font-size:.8em;font-weight:700;cursor:pointer}
.bc-clear:hover{border-color:var(--o);color:var(--o)}
/* ---- Stat tiles ---- */
.bc-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.bc-stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.bc-stats{grid-template-columns:repeat(2,1fr)}}
.bc-stat{position:relative;background:#fff;border:1px solid #e6eaee;border-radius:5px;padding:14px 15px;overflow:hidden;box-shadow:0 2px 8px -4px rgba(20,40,70,.18)}
.bc-stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.bc-stat .top{display:flex;align-items:center;gap:7px;color:#5c6773}
.bc-stat .top svg{width:15px;height:15px}
.bc-stat .lab{font-size:.7em;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.bc-stat .val{font-size:1.55em;font-weight:900;letter-spacing:-.5px;color:#1b2026;margin-top:8px;line-height:1}
.bc-stat .sub{font-size:.72em;color:#8b96a0;margin-top:4px}
.bc-total::before{background:#2563eb}.bc-total .top{color:#2563eb}
.bc-resolved::before{background:#1f9d57}.bc-resolved .top{color:#1f9d57}
.bc-sla::before{background:#7c5cf0}.bc-sla .top{color:#7c5cf0}
.bc-repeat::before{background:#d9930a}.bc-repeat .top{color:#b5760a}
.bc-pet::before{background:#0d9488}.bc-pet .top{color:#0d9488}
.bc-autosim::before{background:#ec7211}.bc-autosim .top{color:#ec7211}
/* ---- Section card ---- */
.bc-sec{background:#fff;border:1px solid var(--bd);border-radius:5px;margin-bottom:16px;overflow:hidden;box-shadow:0 2px 10px rgba(20,40,70,.05)}
.bc-sec-h{display:flex;align-items:center;gap:9px;padding:15px 20px;border-bottom:1px solid #eef1f4;font-size:1em;font-weight:800;color:#1b2026}
.bc-sec-h svg{width:16px;height:16px;color:var(--ac)}
.bc-sec-b{padding:16px 20px 20px}
.chart-wrap{position:relative;height:340px}
/* ---- Per-year table ---- */
.bc-tbl{width:100%;border-collapse:collapse;font-size:.9em}
/* All columns centered so each value sits directly under its heading. */
.bc-tbl th,.bc-tbl td{padding:11px 14px;border-bottom:1px solid #eef1f4;text-align:center;vertical-align:middle}
.bc-tbl th{color:var(--tm);font-size:.72em;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.bc-tbl td{color:#2a3340}
.bc-tbl td.y{font-weight:800;color:#1b2026}
.bc-tbl td.n{font-weight:700}
.bc-tbl tbody tr:last-child td{border-bottom:none}
.bc-tbl tbody tr:hover td{background:#f7f9fb}
.bc-tbl tfoot td{border-top:2px solid #e2e7eb;font-weight:800;color:#1b2026;background:#fafbfc}
.bc-bar{height:7px;border-radius:5px;background:#eef1f4;overflow:hidden;width:120px;margin:0 auto}
.bc-bar>span{display:block;height:100%;background:linear-gradient(90deg,#7c5cf0,#9d7bf7);border-radius:5px}
/* ---- Podium ---- */
.bc-podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:stretch}
@media(max-width:560px){.bc-podium{grid-template-columns:1fr}}
.bc-medal{position:relative;display:flex;flex-direction:column;align-items:center;border-radius:5px;padding:18px 14px 16px;text-align:center;border:1px solid rgba(0,0,0,.06);box-shadow:0 6px 18px -10px rgba(20,40,70,.35);overflow:hidden}
.bc-medal::before{content:"";position:absolute;inset:0 0 auto 0;height:4px}
.bc-medal.g{background:linear-gradient(180deg,#fff8e6,#fff)}.bc-medal.g::before{background:linear-gradient(90deg,#f6c21a,#ffde7a)}
.bc-medal.s{background:linear-gradient(180deg,#f4f7fa,#fff)}.bc-medal.s::before{background:linear-gradient(90deg,#aab6c2,#d9e1e8)}
.bc-medal.b{background:linear-gradient(180deg,#fbf0e6,#fff)}.bc-medal.b::before{background:linear-gradient(90deg,#cd7f32,#e3a86a)}
.bc-medal.g{border-color:#f1c84a;box-shadow:0 8px 22px -10px rgba(246,194,26,.55)}
.bc-medal .badge{position:absolute;top:8px;right:10px;font-size:1.25em}
.bc-av{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;overflow:hidden;background:#eef1f4;border:2px solid #fff;box-shadow:0 2px 6px rgba(20,40,70,.18);font-weight:800;font-size:1.3em;color:#5c6773}
.bc-av img{width:100%;height:100%;object-fit:cover}
.bc-medal .id{font-size:.9em;font-weight:800;margin-top:8px;color:#1b2026}
.bc-medal .m{font-size:.76em;color:#5c6773;margin-top:6px}
.bc-medal .m b{color:#1b2026}
/* loading / gate */
.bc-sk{background:#fff;border:1px solid var(--bd);border-radius:5px;margin-bottom:14px;padding:16px 20px}
.bc-sk-l{display:block;height:14px;border-radius:5px;background:linear-gradient(90deg,#eef1f4,#f6f8fa,#eef1f4);background-size:200% 100%;animation:bcsk 1.2s linear infinite}
@keyframes bcsk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.bc-spin{display:flex;align-items:center;justify-content:center;min-height:120px}
.spinner{width:40px;height:40px;border:4px solid #e2e7eb;border-top-color:var(--ac);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}
.bc-gate{max-width:560px;margin:60px auto;text-align:center}
.bc-gate h1{color:#1b2026;font-size:1.5em;margin-bottom:10px}
.bc-gate p{color:var(--tm);line-height:1.55}
.wrap,.content{width:auto!important;max-width:none!important;margin-left:15px!important;margin-right:15px!important}
</style>

</head>

  <div class="bc-sk"><span class="bc-sk-l" style="width:88%"></span></div>
</div>
