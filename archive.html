<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive Dashboard · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="shimmer.css">
<style>
:root{--o:#ff9900;--oh:#ec7211;--ol:#ffb84d;--bl:#2074d5;--bll:#44b9d6;--tl:#1b9cb0;--g:#1d8102;--gl:#3ecf4a;--r:#d13212;--rl:#ff5252;--t:#d5dbdb;--tm:#879596;--bd:#2a2a2a;--s:#000}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#000;color:var(--t);min-height:100vh}
.top-bar{background:#0a0a0a;border-bottom:1px solid var(--bd);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:28px;width:auto;display:block}
.logo span{font-size:1.1em;font-weight:700;color:#fff;line-height:1}
.btn{display:inline-flex;align-items:center;padding:7px 16px;background:var(--o);color:#000;border-radius:4px;font-weight:600;font-size:.85em;cursor:pointer;border:none;text-decoration:none}
.btn:hover{background:var(--oh)}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--t)}
.content{padding:24px;max-width:1600px;margin:0 auto}
.page-title{margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.page-title h1{font-size:1.8em;color:#fff;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.page-title p{color:var(--tm);margin-top:4px;font-size:.9em;overflow:hidden;text-overflow:ellipsis}
.page-title p span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.kpi-card{background:var(--s);border-radius:8px;padding:18px;text-align:center;border:1px solid var(--bd);border-top:3px solid var(--o)}
.kpi-card .value{font-size:1.7em;font-weight:700;color:#fff;margin-bottom:4px}
.kpi-card .label{font-size:.75em;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.kpi-card.accent .value{color:var(--o)}.kpi-card.success .value{color:var(--gl)}.kpi-card.warning .value{color:var(--ol)}.kpi-card.info .value{color:var(--bll)}
.section{background:var(--s);border-radius:8px;padding:24px;margin-bottom:24px;border:1px solid var(--bd)}
.section h2{color:#fff;margin-bottom:18px;font-size:1.2em;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.section h2>span,.section h2{white-space:nowrap;text-overflow:ellipsis}
.section h2::before{content:'';display:inline-block;width:4px;height:20px;background:var(--o);border-radius:2px}
/* Small inline spinner for KPI numbers while they "load" */
.num-spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
/* Collapsible sections (expand/collapse) */
.collapsible .collapse-head{cursor:pointer;justify-content:space-between;margin-bottom:0;user-select:none;border-radius:6px;margin-left:-8px;margin-right:-8px;padding:6px 8px;transition:background .15s}
/* Hover cue while collapsed so users know the header is clickable to expand */
.collapsible:not(.open) .collapse-head:hover{background:rgba(255,153,0,.10)}
.collapsible.open .collapse-head{margin-bottom:18px}
.collapse-title{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.collapse-head{min-width:0}
.collapse-caret{color:var(--tm);transition:transform .3s ease;font-size:.8em}
.collapsible.open .collapse-caret{transform:rotate(180deg)}
/* Animated via grid-template-rows (auto 0fr <-> auto 1fr), ~300ms. */
.section.collapsible{display:grid;grid-template-rows:auto 0fr;transition:grid-template-rows .3s ease}
.section.collapsible.open{grid-template-rows:auto 1fr}
.collapse-body{overflow:hidden;min-height:0;transition:opacity .3s ease;opacity:0}
.collapsible.open .collapse-body{opacity:1}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(450px,1fr));gap:20px;margin-bottom:24px}
.chart-box{background:var(--s);border-radius:8px;padding:20px;border:1px solid var(--bd)}
.chart-box h3{color:#fff;margin-bottom:16px;text-align:center;font-size:.95em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-wrap{position:relative;height:320px}
.chart-wrap.tall{height:480px}
/* Chart-loading spinner overlay (DB-backed quarter reports) */
.chart-spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--s);z-index:2}
.chart-spin .spinner{margin:0}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--bd);font-size:.86em}
th{background:#0a0a0a;color:var(--tm);font-weight:600;text-transform:uppercase;font-size:.72em;letter-spacing:.5px}
tr:hover{background:rgba(255,153,0,.03)}
/* Excel-sheet style tables (Program History sections): gridlines on every cell, header bg, zebra rows. */
.xls-table{border:1px solid #2f3a45;border-collapse:collapse;width:100%;margin-top:12px}
.xls-table th,.xls-table td{border:1px solid #2f3a45;padding:8px 12px;font-size:.86em;text-align:left}
.xls-table thead th{background:#111820;color:#c9d3d4;text-transform:uppercase;font-size:.72em;letter-spacing:.5px;font-weight:700}
.xls-table tbody tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.xls-table tbody tr:hover td{background:rgba(255,153,0,.06)}
/* Two sub-tables side-by-side inside one big Program History section. */
.ph-2col{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.ph-2col .ph-col{min-width:0;overflow-x:auto}
.ph-col-title{color:#fff;font-size:.95em;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.ph-col-title::before{content:'';display:inline-block;width:3px;height:15px;background:var(--o);border-radius:2px;flex-shrink:0}
@media(max-width:900px){.ph-2col{grid-template-columns:1fr}}
.spinner{width:48px;height:48px;border:4px solid var(--bd);border-top:4px solid var(--o);border-radius:50%;animation:spin 1s linear infinite;margin:60px auto}
@keyframes spin{100%{transform:rotate(360deg)}}
.phd-badge{display:inline-block;margin-left:6px;padding:1px 6px;background:rgba(255,153,0,.15);color:var(--o);border-radius:3px;font-size:.7em;font-weight:600}
/* Program History title prefix: full on desktop, abbreviated "PH:" on mobile */
.ph-short{display:none}
/* Header action buttons (Update data log / Upload-merge) — right-aligned group on desktop */
.pt-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-left:auto;max-width:100%}
.pt-btn{max-width:100%;min-width:0}
.pt-btn .btn-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}.content{padding:16px}
  .ph-full{display:none}.ph-short{display:inline}
  /* Header stacks on mobile: title/range block on top, action buttons full-width below it, equal size */
  .page-title{flex-direction:column;align-items:stretch}
  .pt-actions{margin-left:0;width:100%;flex-wrap:nowrap}
  .pt-actions .pt-btn{flex:1 1 0;justify-content:center}}
/* Root-cause grouped table */
.rc-table{width:100%;border-collapse:collapse;font-size:.9em}
.rc-table thead th{background:#000;color:var(--tm);font-size:.72em;text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:10px 14px;text-align:left;border-bottom:1px solid var(--bd)}
.rc-grow{cursor:pointer;transition:background .12s}
.rc-grow td{padding:12px 14px;border-bottom:1px solid var(--bd)}
.rc-grow:hover{background:rgba(255,153,0,.07)}
.rc-grow.open{background:rgba(255,153,0,.12)}
.rc-idx{color:var(--tm);font-weight:600}
.rc-gname{color:#fff;font-weight:600}
.rc-gname .rc-caret{color:var(--o);font-size:.7em;margin-right:10px;display:inline-block;transition:transform .15s}
.rc-grow.open .rc-gname .rc-caret{transform:rotate(90deg)}
.rc-gcount{text-align:right;color:var(--o);font-weight:700}
.rc-gshare{text-align:right;color:var(--tm)}
.rc-detail-row>td{padding:0;border-bottom:1px solid var(--bd);background:#050505}
.rc-detail-row>td:first-child{border-bottom:none;background:#000}
.rc-detail-row .rc-group-regions{padding:12px 16px 6px}
.rc-regions-label{display:block;font-size:.7em;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:600}
.rc-regions{display:flex;flex-wrap:wrap;gap:5px}
.rc-region-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:4px;font-size:.78em;color:#d5dbdb;background:rgba(255,255,255,.07)}
.rc-region-chip b{color:var(--o);font-weight:600;margin-left:2px}
.rc-subtable{width:100%;border-collapse:collapse;margin:4px 0 10px}
.rc-subtable thead th{background:transparent;color:var(--tm);font-size:.68em;text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:6px 16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}
.rc-subtable tbody td{padding:8px 16px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
.rc-subtable tbody tr:last-child td{border-bottom:none}
.rc-item-name{color:var(--t)}
.rc-item-count{color:#fff;font-weight:600;text-align:right}
/* Incident-type agent drill-down modal */
.inc-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.inc-modal{background:#0a0a0a;border:1px solid var(--bd);border-radius:12px;width:80vw;max-width:80vw;max-height:85vh;display:flex;flex-direction:column}
.inc-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px;border-bottom:1px solid var(--bd)}
.inc-modal-head h2{color:#fff;font-size:1.15em;font-weight:600;margin:0}
.inc-modal-head h2::before{display:none}
.inc-modal-sub{display:block;color:var(--o);font-size:.8em;font-weight:600;margin-top:4px}
.inc-modal-close{background:transparent;border:none;color:var(--tm);font-size:1.5em;cursor:pointer;line-height:1;padding:0 4px}
.inc-modal-close:hover{color:#fff}
.inc-modal-body{overflow-y:auto;padding:14px 22px 22px}
.inc-agent-list{display:flex;flex-direction:column;gap:6px}
.inc-agent{border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:#000}
.inc-agent-head{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;background:transparent;border:none;cursor:pointer;color:#fff;font-size:.92em;font-weight:600;text-align:left;font-family:inherit;transition:background .12s}
.inc-agent-head:hover{background:rgba(255,153,0,.08)}
.inc-agent-head.open{background:rgba(255,153,0,.12)}
.inc-caret{color:var(--o);font-size:.72em;transition:transform .15s;flex-shrink:0}
.inc-agent-head.open .inc-caret{transform:rotate(90deg)}
.inc-agent-name{flex:1}
.inc-agent-count{color:var(--o);font-weight:700;background:rgba(255,153,0,.12);padding:2px 11px;border-radius:20px;font-size:.85em}
.inc-agent-body{border-top:1px solid var(--bd);padding:4px 0}
.inc-ticket-table{width:100%;border-collapse:collapse;font-size:.84em}
.inc-ticket-table thead th{color:var(--tm);font-size:.7em;text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:7px 14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}
.inc-ticket-table tbody td{padding:7px 14px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--t)}
.inc-ticket-table tbody tr:last-child td{border-bottom:none}
.inc-ticket-table a{color:var(--bll);text-decoration:none}
.inc-ticket-table a:hover{text-decoration:underline}

/* Global: main content spans 90% of the viewport at all sizes. */
.wrap,.content{width:auto!important;max-width:none!important;margin-left:15px!important;margin-right:15px!important}
/* #phBody holds a nested .content (from render()); strip its gutters/padding so the analytics align
   flush with the filter panel and Summary Statistics above it (no double indent). */
#phBody .content{margin:0!important;padding:0!important;width:auto!important}
/* Program History quarter-selection checkbox tree (era -> year -> quarter). */
.ph-filter{background:#0a0f14;border:1px solid #2f3a45;border-radius:12px;padding:16px 18px;margin-bottom:22px}
.ph-filter-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #1e2830}
.ph-clear{background:transparent;border:1px solid #3a4655;color:#879596;border-radius:6px;padding:5px 12px;font-size:.82em;font-weight:600;cursor:pointer;font-family:inherit}
.ph-clear:hover{border-color:#ff9900;color:#ff9900}
.ph-tree{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
/* Each year is its own tinted pill-group: [Year] Q3 Q2 Q1 — kept together on one row. */
.ph-year{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;border:1px solid transparent}
.ph-qs{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px}
.ph-year-head{margin-right:4px;font-weight:700}
/* Distinct background + accent per year for easy differentiation. */
.ph-year-0{background:rgba(255,153,0,.08);border-color:rgba(255,153,0,.28)}
.ph-year-1{background:rgba(68,185,214,.08);border-color:rgba(68,185,214,.28)}
.ph-year-2{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.28)}
.ph-year-3{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.28)}
.ph-year-4{background:rgba(255,184,77,.08);border-color:rgba(255,184,77,.28)}
/* Chip-style option (mirrors agent-analytics .ga-opt): hidden native input, styled label + square. */
.ph-opt{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:7px;font-size:.86em;font-weight:600;color:#aab7c2;cursor:pointer;user-select:none;transition:background .15s,color .15s;position:relative}
.ph-opt input{position:absolute;opacity:0;width:0;height:0}
.ph-opt::before{content:'';width:11px;height:11px;border-radius:3px;border:1.5px solid #4a5c6a;flex-shrink:0;transition:background .15s,border-color .15s}
.ph-opt:hover{color:#e6edf0;background:rgba(255,255,255,.04)}
.ph-opt.checked{color:#fff}
.ph-opt.checked::before{background:var(--o);border-color:var(--o);box-shadow:0 0 0 2px rgba(255,153,0,.2)}
.ph-opt.partial::before{background:rgba(255,153,0,.35);border-color:var(--o)}
.ph-master{font-size:.95em;color:#fff}
.ph-year-head{color:#cfd8df}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body data-nav-active="" data-nav-hide="home,dashboard,tools" data-back-href="index.html" data-back-label="All Dashboards">
<div class="top-bar" style="visibility:hidden"><a class="logo" href="index.html" style="text-decoration:none"><img src="gsoc-logo.svg" alt="GSOC"><span>WWOS-GSOC PHD Dashboard</span></a></div>
<div id="app"><div class="spinner"></div></div>

<div class="inc-modal-bg" id="incModalBg" onclick="if(event.target===this)closeIncidentModal()">
  <div class="inc-modal">
    <div class="inc-modal-head">
      <div><h2 id="incModalTitle">Incident Type</h2><span class="inc-modal-sub" id="incModalSub"></span></div>
      <button class="inc-modal-close" onclick="closeIncidentModal()" aria-label="Close">&times;</button>
    </div>
    <div class="inc-modal-body" id="incModalBody"></div>
  </div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js"></script>
<script src="quarter-metrics.js?v=3"></script>
<script src="archive-quarters.js?v=2"></script>
<script src="archive.js?v=15"></script>
</body>
</html>
