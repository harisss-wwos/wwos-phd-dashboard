<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Program History (BC Era) · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--o:#ec7211;--oh:#c85f0e;--t:#2a3340;--tm:#5c6773;--bd:#e2e7eb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#f3f5f7;color:var(--t);min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{height:28px;width:auto}
.logo span{font-size:1.1em;font-weight:700;color:#1b2026}
.wrap{padding:32px 24px;width:auto;max-width:none;margin:0}
</style>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app-light.css?v=5">
<style id="arc-light">
/* Program History — same visual language as Errors in Resolved / Home: dark navy hero with an orange
   rule (year picker lives in the hero), KPI cards overlapping it, then white cards. Scoped under .arc
   (a size container for the responsive grids). */
#wrap.wrap{padding-top:0!important;padding-bottom:28px!important}
.arc{--ink:#1b2026;--mut:#5c6773;--line:#e2e6ea;--soft:#f5f6f8;--acc:#ec7211;--acc-bg:#fff3e8;--acc-ink:#9a4100;
  --red:#b42318;--red-bg:#fdecec;--grn:#1a7a43;--grn-bg:#e5f5ec;--blu:#1f5fbf;--blu-bg:#e9f0fb;--focus:#f0a35a;container-type:inline-size;color:var(--ink)}
/* :where() keeps this reset at class-level specificity so .arc-chip/.arc-btn sizes + weights still win. */
.arc :where(button){font:inherit;text-transform:none}
.arc :is(button,a,input,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.arc-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---- Hero ---- */
.arc-hero{position:relative;overflow:hidden;border-radius:12px;padding:26px 28px 80px 32px;color:#e9edf3;
  background:radial-gradient(110% 160% at 100% 0%,rgba(236,114,17,.30),transparent 55%),linear-gradient(135deg,#131a2a,#1f2a40);
  box-shadow:0 18px 40px -26px rgba(20,30,50,.75)}
.arc-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 75%);mask-image:linear-gradient(90deg,transparent 20%,#000 75%)}
.arc-hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9f2e,var(--acc))}
.arc-hero-in{position:relative;display:flex;gap:20px 28px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.arc-hero-main{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1 1 360px}
.arc-hero-ic{width:48px;height:48px;border-radius:12px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(236,114,17,.16);color:#ffb26b;border:1px solid rgba(236,114,17,.4)}
.arc-eyebrow{font-size:.7em;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#ffb26b;margin-bottom:6px}
.arc-hero h1{color:#fff!important;font-size:2.15em;font-weight:800;letter-spacing:-.9px;line-height:1.05}
.arc-hero-sub{margin-top:9px;max-width:62ch;font-size:.92em;line-height:1.55;color:rgba(233,237,243,.8)}
.arc-meta{display:grid;grid-template-columns:repeat(2,minmax(0,auto));gap:10px 26px;margin:0;padding:13px 16px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);max-width:100%;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.arc-meta dt{font-size:.64em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:rgba(233,237,243,.66)}
.arc-meta dd{margin:3px 0 0;font-size:.9em;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-height:1.2em}
.arc-meta .arc-meta-wide{grid-column:1/-1}

/* Year picker (glass pills on the hero) */
.arc-years{position:relative;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1)}
.arc-years-t{display:inline-flex;align-items:center;gap:7px;font-size:.68em;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:rgba(233,237,243,.72);white-space:nowrap}
.arc-years-t svg{color:#ffb26b}
.arc-year-chips{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center}
.arc-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);color:#e9edf3;font-size:.86em;font-weight:700;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;
  transition:background .15s,border-color .15s,color .15s}
.arc-chip:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.34)}
.arc-box{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:5px;border:1.5px solid rgba(255,255,255,.45);transition:background .15s,border-color .15s}
.arc-chk{width:12px;height:12px;color:#fff;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.arc-chip.on{background:#fff;border-color:#fff;color:var(--ink)}
.arc-chip.on .arc-box{background:var(--acc);border-color:var(--acc)}
.arc-chip.on .arc-chk{opacity:1;transform:none}
.arc-chip-all{font-weight:800}
.arc-clear{margin-left:auto;padding:7px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.2);background:none;color:rgba(233,237,243,.85);font-size:.82em;font-weight:700;cursor:pointer}
.arc-clear:hover:not(:disabled){border-color:#ffb26b;color:#ffb26b}
.arc-clear:disabled{opacity:.45;cursor:default}

/* ---- KPI row (overlaps the hero) ---- */
.arc-kpis{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:-58px 18px 16px}
@container (min-width:700px){.arc-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (min-width:1100px){.arc-kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.arc-kpi{position:relative;overflow:hidden;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px 14px;
  box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.arc-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--k,#c4ccd4)}
.arc-kpi-l{display:flex;align-items:center;gap:8px;font-size:.66em;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut);line-height:1.25}
.arc-kpi-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--kb,var(--soft));color:var(--ki,#3a4552)}
.arc-kpi-v{margin-top:12px;font-size:2em;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arc-kpi-s{margin-top:7px;font-size:.8em;font-weight:600;line-height:1.35;color:var(--mut);overflow-wrap:anywhere}
.arc-kpi-s b{color:var(--ink);font-weight:800}
.arc-kpi-bar{margin-top:11px;height:5px;border-radius:99px;background:#eef1f4;overflow:hidden}
.arc-kpi-bar i{display:block;height:100%;border-radius:inherit;background:var(--k)}
.arc-kpi.k-total{--k:#1f2a40}
.arc-kpi.k-resolved{--k:#1f9d57;--kb:var(--grn-bg);--ki:var(--grn)}
.arc-kpi.k-sla{--k:var(--acc);--kb:var(--acc-bg);--ki:#b5530a}
.arc-kpi.k-repeat{--k:#d92d20;--kb:var(--red-bg);--ki:var(--red)}
.arc-kpi.k-pet{--k:#13827c;--kb:#dcf2f0;--ki:#0f6b66}
.arc-kpi.k-autosim{--k:var(--blu);--kb:var(--blu-bg);--ki:var(--blu)}
.arc-kpi.is-skel{min-height:112px}
.arc-kpi.is-skel .arc-skel{display:block}

/* ---- Cards ---- */
.arc-card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px -6px rgba(20,30,50,.18);padding:20px 22px;margin-bottom:16px;min-width:0}
.arc-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;margin-bottom:16px}
.arc-card-tt{display:flex;gap:12px;align-items:flex-start;min-width:0}
.arc-card-ic{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--acc-bg);color:#b5530a}
.arc-card-head h2{font-size:1.15em;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:var(--ink)}
.arc-help{margin-top:4px;font-size:.84em;color:var(--mut);line-height:1.5;max-width:72ch}
.arc-split{display:grid;grid-template-columns:minmax(0,1fr);gap:0 16px;align-items:start}
@container (min-width:1000px){.arc-split{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}}

/* Legend (HTML, replaces the canvas legend so it stays readable + keyboard-free) */
.arc-legend{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0}
.arc-legend li{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:.78em;font-weight:700;color:#3a4552;white-space:nowrap}
.arc-lg{width:10px;height:10px;border-radius:3px;background:var(--c)}
.arc-lg.is-line{width:16px;height:0;border-radius:0;background:none;border-top:2.5px dashed var(--c)}
.arc-chart-wrap{position:relative;height:340px}
@container (max-width:560px){.arc-chart-wrap{height:260px}}
.arc-none{display:flex;align-items:center;justify-content:center;height:100%;color:var(--mut);font-size:.9em;font-weight:600}

/* ---- Per-year table ---- */
.arc-scroll{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:10px}
/* display/width forced: the shared chrome's narrow-screen table rules would otherwise shrink it. */
.arc .arc-tbl{display:table!important;width:100%!important;border-collapse:separate;border-spacing:0;font-size:.9em}
/* All columns centered so each value sits directly under its heading. */
.arc-tbl th,.arc-tbl td{padding:11px 14px;border-bottom:1px solid #eef1f4;text-align:center;vertical-align:middle;font-variant-numeric:tabular-nums}
.arc-tbl thead th{position:sticky;top:0;z-index:1;background:#f5f6f8;border-bottom:1px solid var(--line);color:var(--mut);font-size:.7em;font-weight:800;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.arc-tbl tbody th.y{font-weight:800;color:var(--ink)}
.arc-tbl td{color:#2a3340}
.arc-tbl td.n{font-weight:700}
.arc-tbl td.v{width:34%;min-width:110px}
.arc-tbl tbody tr:hover td,.arc-tbl tbody tr:hover th{background:#fafbfc}
.arc-tbl tfoot th,.arc-tbl tfoot td{border-top:1px solid var(--line);border-bottom:none;font-weight:800;color:var(--ink);background:#f8f9fa}
.arc-bar{height:8px;border-radius:99px;background:#eef1f4;overflow:hidden;max-width:180px;margin:0 auto}
.arc-bar>span{display:block;height:100%;background:linear-gradient(90deg,#ff9f2e,var(--acc));border-radius:inherit}
.arc-pill{display:inline-block;min-width:52px;padding:3px 10px;border-radius:99px;background:var(--acc-bg);border:1px solid #f7c99c;color:var(--acc-ink);font-size:.9em;font-weight:800}

/* ---- Top performers ---- */
.arc-podium{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.arc-medal{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;min-width:0}
.arc-medal::before{content:'';position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--m)}
.arc-medal.g{--m:#e0a800;--mb:#fff6d6;--mi:#7a5a00;background:linear-gradient(90deg,#fffbeb,#fff 60%);border-color:#f2dc8d}
.arc-medal.s{--m:#8d99a6;--mb:#eef1f4;--mi:#3a4552}
.arc-medal.b{--m:#c2702c;--mb:#fbeee2;--mi:#8a4a14}
.arc-rank{flex-shrink:0;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--mb);color:var(--mi);border:1px solid var(--m);font-size:.8em;font-weight:800}
.arc-av{flex-shrink:0;width:40px;height:40px;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-size:.95em;font-weight:800;
  background:hsl(var(--h,205) 60% 92%);color:hsl(var(--h,205) 55% 28%);border:1px solid hsl(var(--h,205) 45% 82%)}
.arc-av img{width:100%;height:100%;object-fit:cover}
.arc-medal-id{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.arc-medal-id .id{font-size:.95em;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arc-medal-id .m{font-size:.76em;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.arc-medal-st{display:flex;gap:14px;margin:0;flex-shrink:0;text-align:right}
.arc-medal-st dt{font-size:.6em;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.arc-medal-st dd{margin:2px 0 0;font-size:1.05em;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
@container (max-width:440px){.arc-medal{flex-wrap:wrap}.arc-medal-st{width:100%;justify-content:flex-start;text-align:left;padding-left:38px}}

/* ---- States ---- */
.arc-body-flat .arc-state{position:relative;z-index:1;margin:-58px 18px 16px;box-shadow:0 16px 32px -24px rgba(20,30,50,.6)}
.arc-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 20px;text-align:center;color:var(--mut)}
.arc-empty-ic{width:58px;height:58px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#eef1f4;color:#5c6773;margin-bottom:4px}
.arc-empty-ic.is-err{background:var(--red-bg);color:var(--red)}
.arc-empty-t{font-size:1.08em!important;font-weight:800;color:var(--ink)!important}
.arc-empty p{font-size:.9em;max-width:52ch;line-height:1.5}
.arc-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.arc-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid #161d2d;border-radius:6px;background:#161d2d;color:#f4f3ef;font-size:.86em;font-weight:800;cursor:pointer;text-decoration:none;transition:background .15s}
.arc-btn:hover{background:#0f1420}
.arc-btn.is-sec{background:#fff;color:var(--ink);border-color:#d4dade}
.arc-btn.is-sec:hover{border-color:var(--acc);color:var(--acc-ink);background:#fff}
.arc-skel{display:inline-block;vertical-align:middle;border-radius:6px;background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 40%,#eceff2 60%);background-size:400% 100%;animation:arcShim 1.4s ease infinite}
.arc-skel-d{background:linear-gradient(90deg,rgba(255,255,255,.08) 25%,rgba(255,255,255,.18) 40%,rgba(255,255,255,.08) 60%);background-size:400% 100%}
@keyframes arcShim{0%{background-position:100% 0}100%{background-position:0 0}}
.arc-skbars{display:flex;align-items:flex-end;justify-content:space-around;gap:12px;padding:10px 24px 0;border-bottom:1px solid #eef1f4}
.arc-skb{display:flex;align-items:flex-end;gap:6px;height:100%;flex:0 1 96px}
.arc-skb .arc-skel{flex:1 1 0;border-radius:6px 6px 0 0}
.arc-skrows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.arc-skrow{display:grid;grid-template-columns:60px minmax(60px,1fr) 80px 80px 60px;gap:16px;align-items:center;padding:13px 14px;border-bottom:1px solid #eef1f4}
.arc-skrow:last-child{border-bottom:none}
.arc-skrow.is-p{display:flex;gap:12px}
.arc-loadnote{padding:4px 0 10px;font-size:.82em}

/* One orchestrated entrance on first paint: hero, KPI cards (staggered), then the sections. */
@keyframes arcUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.arc.is-anim .arc-hero{animation:arcUp .45s ease both}
.arc.is-anim .arc-kpi{animation:arcUp .5s ease both}
.arc.is-anim .arc-kpi:nth-child(2){animation-delay:.06s}
.arc.is-anim .arc-kpi:nth-child(3){animation-delay:.12s}
.arc.is-anim .arc-kpi:nth-child(4){animation-delay:.18s}
.arc.is-anim .arc-kpi:nth-child(5){animation-delay:.24s}
.arc.is-anim .arc-kpi:nth-child(6){animation-delay:.3s}
.arc.is-anim .arc-card{animation:arcUp .5s ease .3s both}

/* ---- Small screens ---- */
@container (max-width:620px){
  .arc-hero{padding:22px 18px 76px 22px}
  .arc-hero h1{font-size:1.7em}
  .arc-hero-ic{display:none}
  .arc-meta{width:100%}
  .arc-kpis{margin:-56px 10px 14px;gap:10px}
  .arc-kpi{padding:13px 13px 12px}
  .arc-kpi-v{font-size:1.6em}
  .arc-card{padding:16px 14px}
  .arc-clear{margin-left:0}
  .arc-body-flat .arc-state{margin:-56px 10px 14px}
  .arc-skrow{grid-template-columns:44px minmax(40px,1fr) 56px 56px;gap:10px}
  .arc-skrow>.arc-skel:last-child{display:none}
}
@media (prefers-reduced-motion:reduce){
  .arc *,.arc *::before,.arc *::after{animation:none!important;transition:none!important}
}
</style>
</head>
