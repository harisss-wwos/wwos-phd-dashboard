<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile · WWOS-GSOC PHD Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --o:#ff6100;--oh:#fe9046;--ol:#fe9046;
  --gray:#f4f3ef;--white:#fff;--ink:#151d28;--ink2:#818284;
  --blue:#e6f0fc;--purple:#161d2d;--icbg:#c4def6;--icfg:#2b66c1;
  --t:#151d28;--tm:#818284;--bd:#e7e5df;--gl:#1f9d57;
  --sh:0 1px 2px rgba(21,29,40,.05),0 10px 28px -18px rgba(21,29,40,.28);
}
*{margin:0;padding:0;box-sizing:border-box}
input,button,textarea,select{font-family:inherit}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--gray);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.top-bar{display:none!important}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;background:var(--o);color:#fff;border-radius:5px;font-weight:700;font-size:.88em;cursor:pointer;border:none;text-decoration:none;transition:filter .14s,transform .12s,box-shadow .14s}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.sec{background:#fff;border:1px solid var(--bd);color:var(--ink)}
.btn.sec:hover{border-color:var(--o);color:var(--o);filter:none}
.btn.danger{background:#fff;border:1px solid rgba(214,69,111,.4);color:#d6456f}
.btn.danger:hover{background:#fcebf0;filter:none}
.btn.mini{padding:7px 13px;font-size:.8em}
.btn svg{width:15px;height:15px}
.wrap{padding:0}
/* ===== Hero — light card with orange accent + avatar, matching index.html ===== */
.ph-hero{position:relative;overflow:hidden;border-radius:5px;padding:0;margin-bottom:12px;background:var(--white);border:1px solid var(--line,#e7e5df);box-shadow:var(--sh)}
.ph-hero-top{height:84px;background:linear-gradient(100deg,var(--o),var(--ol) 60%,#ffd3b0);position:relative}
.ph-hero-top::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 85% -10%,rgba(255,255,255,.45),transparent 42%)}
.ph-hero-body{display:flex;align-items:flex-end;gap:18px;padding:0 24px 20px;margin-top:-44px;position:relative}
.ph-hero-av{position:relative;flex:0 0 auto;width:96px;height:96px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 6px 18px -6px rgba(20,40,70,.4)}
.ph-hero-av #avatarBox,.ph-hero-av #avatarBox img,.ph-hero-av #avatarBox .avatar-initial,.ph-hero-av .avatar-loading{width:86px!important;height:86px!important;border-radius:50%!important;object-fit:cover;display:flex;align-items:center;justify-content:center}
.ph-hero-cam{position:absolute;right:0;bottom:4px;width:30px;height:30px;border-radius:50%;background:var(--o);color:#fff;border:3px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(21,29,40,.3)}
.ph-hero-cam:hover{background:var(--oh)}
.ph-hero-cam svg{width:14px;height:14px}
.ph-hero-meta{flex:1;min-width:0;padding-bottom:4px}
.ph-hero-name{font-size:1.45em;font-weight:800;color:var(--ink);letter-spacing:-.3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph-hero-badge{display:inline-flex;align-items:center;background:#ffe6d6;color:var(--o);border:1px solid #ffd0b3;font-size:.56em;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.ph-hero-handle{color:var(--ink2);font-size:.9em;font-weight:600;margin-top:3px}
.ph-hero-actions{flex:0 0 auto;display:flex;gap:8px;padding-bottom:4px}
@media(max-width:600px){.ph-hero-body{flex-direction:column;align-items:center;text-align:center}.ph-hero-actions{justify-content:center}.ph-hero-name{justify-content:center}}
/* ===== Cards ===== */
.ph-card{background:var(--white);border:1px solid var(--bd);border-radius:5px;padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
/* Two 50/50 columns of EQUAL height. Left = Account; right = Security + Admin tools stacked
   (spread to fill the same height). */
.ph-row-2{display:flex;gap:18px;align-items:stretch;margin-bottom:12px}
.ph-row-2>.ph-card,.ph-row-2>.ph-col{flex:1 1 0;min-width:0;margin-bottom:0}
.ph-row-2>.ph-card{display:flex;flex-direction:column}
.ph-col{display:flex;flex-direction:column;gap:12px}
.ph-col>.ph-card{margin-bottom:0}
.ph-col>.ph-card:last-child{flex:1}
/* Change/Remove photo buttons pinned to the RIGHT of the Account header title. Not uppercase. */
.ph-photo-btns{margin-left:auto;display:inline-flex;gap:8px;text-transform:none;letter-spacing:normal}
/* Login ID + Role + Save on one line. Each cell shows "Label: value" INLINE (not stacked). */
.ph-idrow{display:flex;align-items:stretch;gap:12px;margin-top:16px}
.ph-idrow .cell{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;background:var(--gray);border:1px solid #eceae4;border-radius:5px;padding:10px 14px}
.ph-idrow .cell .k{flex:0 0 auto;font-size:.76em;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2)}
.ph-idrow .cell .k::after{content:':'}
.ph-idrow .cell .v{min-width:0;font-size:.95em;font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis}
.ph-idrow .btn{flex:0 0 auto;align-self:stretch;min-width:150px;justify-content:center}
@media(max-width:700px){.ph-row-2{flex-direction:column;gap:12px}.ph-idrow{flex-wrap:wrap}.ph-idrow .btn{flex:1 1 100%}.ph-photo-btns{margin-left:0;flex-wrap:wrap}}
.ph-card-h{display:flex;align-items:center;gap:10px;font-size:.8em;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--ink);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eef0f3}
.ph-card-h::before{content:'';flex:0 0 auto;width:3px;height:18px;border-radius:2px;background:linear-gradient(var(--o),var(--ol))}
.ph-card-h svg{flex:0 0 auto;width:28px;height:28px;padding:6px;background:var(--icbg);color:var(--icfg);border-radius:8px}
label{display:block;color:var(--ink2);font-size:.82em;font-weight:700;margin:14px 0 7px}
input[type=text],input[type=password]{width:100%;padding:11px 13px;background:var(--white);border:1px solid var(--bd);border-radius:5px;color:var(--ink);font-size:.92em;transition:border-color .14s,box-shadow .14s}
input:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(255,97,0,.14)}
.ph-kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.ph-kv .cell{background:var(--gray);border:1px solid #eceae4;border-radius:5px;padding:12px 14px}
.ph-kv .k{font-size:.7em;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2)}
.ph-kv .v{font-size:1em;font-weight:800;color:var(--ink);margin-top:4px;display:flex;align-items:center;gap:8px}
.ph-badge{background:#ffe6d6;color:var(--o);border:1px solid #ffd0b3;padding:2px 10px;border-radius:999px;font-size:.72em;text-transform:uppercase;font-weight:800}
.ph-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.ph-actions .btn{flex:1;min-width:150px;justify-content:center}
/* ===== Admin-tool link rows (icon + label | Local + Live buttons) ===== */
.ph-links{display:flex;flex-direction:column;gap:2px}
.ph-link-row{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:8px;transition:background .12s}
.ph-link-row:not(:last-child){border-bottom:1px solid #eef0f3}
.ph-link-row:hover{background:#f7f9fb}
.ph-link-ic{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--icbg);color:var(--icfg)}
.ph-link-ic svg{width:18px;height:18px}
.ph-link-label{flex:1;min-width:0;font-weight:800;font-size:.95em;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-link-btns{flex:0 0 auto;display:inline-flex;gap:8px}
/* Regular button (reuses .btn.sec); just size it a touch smaller for the row. */
.ph-lbtn{padding:7px 15px;font-size:.82em}
.ph-lbtn svg{width:13px;height:13px}
@media(max-width:600px){.ph-link-row{flex-wrap:wrap}.ph-link-btns{margin-left:46px}}
.msg{font-size:.85em;margin-top:12px;display:none;font-weight:600}
.msg.err{color:#d6456f}.msg.ok{color:var(--gl)}
.gate{text-align:center;padding:60px 20px;background:var(--white);border:1px solid var(--bd);border-radius:5px;box-shadow:var(--sh)}
.gate h1{color:var(--ink);font-size:1.5em;margin-bottom:10px}
.gate p{color:var(--ink2);margin-bottom:18px;line-height:1.55}
/* spinners */
.pspin{display:inline-block;border:2px solid #e2e7eb;border-top-color:var(--o);border-radius:50%;animation:pspin .8s linear infinite}
.pspin.big{width:34px;height:34px;border-width:3px}
.pspin.sm{width:15px;height:15px;vertical-align:-3px;margin-right:7px}
@keyframes pspin{100%{transform:rotate(360deg)}}
.avatar-loading{background:#eef1f4;border-radius:50%;display:flex;align-items:center;justify-content:center}
.field-loading{display:flex;align-items:center;color:var(--tm);font-size:.9em;padding:11px 13px;background:#fff;border:1px solid var(--bd);border-radius:5px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,45,.55);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:5px;width:440px;max-width:92vw;padding:24px;box-shadow:0 24px 60px -20px rgba(21,29,40,.5)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.modal-head h2{color:var(--ink);font-size:1.1em;font-weight:800}
.modal-close{background:transparent;border:none;color:var(--ink2);font-size:1.6em;line-height:1;cursor:pointer;padding:0 4px}
.modal-close:hover{color:var(--ink)}
/* ===== Weekly Performance Summary (managers + owners) ===== */
.ws-card{background:#fff;border:1px solid var(--bd);border-radius:5px;padding:0;margin-bottom:18px;box-shadow:0 2px 10px rgba(20,40,70,.05);overflow:hidden}
.ws-head{width:100%;display:flex;align-items:center;gap:12px;padding:16px 22px;background:linear-gradient(100deg,#fff6ec,#fff 70%);border:none;border-bottom:1px solid var(--bd);font:inherit;text-align:left;cursor:pointer}
.ws-head:hover{background:linear-gradient(100deg,#fff1e0,#fbfbfb 70%)}
.ws-head-meta{min-width:0;flex:1}
.ws-caret{flex:0 0 auto;display:inline-flex;color:#9aa5b1;transition:transform .3s ease}
.ws-card.open .ws-head{border-bottom-color:var(--bd)}
.ws-card.open .ws-caret{transform:rotate(180deg)}
.ws-collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.ws-collapse>.ws-body{min-height:0;overflow:hidden;padding:0 22px}
.ws-card.open .ws-collapse{grid-template-rows:1fr}
.ws-card.open .ws-collapse>.ws-body{padding:20px 22px}
.ws-card:not(.open) .ws-head{border-bottom:none}
.ws-export{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-size:.72em;font-weight:800;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;padding:7px 13px;border:1px solid #f3d4b0;border-radius:5px;background:#fff;color:#b5560c;box-shadow:0 1px 3px rgba(20,40,70,.06);transition:background .14s,color .14s,border-color .14s,transform .12s}
.ws-export:hover{background:var(--o);border-color:var(--o);color:#fff;transform:translateY(-1px)}
.ws-export.copied{background:#eafaf0;border-color:#c8efd8;color:#1f9d57}
.ws-export svg{width:13px;height:13px}
.ws-head .ws-ic{flex:0 0 auto;width:34px;height:34px;border-radius:5px;background:var(--o);color:#fff;display:flex;align-items:center;justify-content:center}
.ws-head .ws-ic svg{width:17px;height:17px}
.ws-head-meta{min-width:0}
.ws-title{font-size:1.02em;font-weight:800;color:#1b2026;letter-spacing:-.2px}
.ws-sub{font-size:.76em;font-weight:600;color:var(--tm);margin-top:2px}
/* KPI grid */
.ws-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.ws-kpi{background:#f7f9fb;border:1px solid #eef1f4;border-radius:5px;padding:12px 14px}
.ws-kpi .k{font-size:.68em;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--tm)}
.ws-kpi .vrow{display:flex;align-items:baseline;gap:8px;margin-top:5px;flex-wrap:wrap}
.ws-kpi .v{font-size:1.35em;font-weight:800;color:#1b2026;line-height:1}
.ws-kpi .note{font-size:.72em;font-weight:600;color:var(--tm);margin-top:5px}
.ws-delta{display:inline-flex;align-items:center;gap:3px;font-size:.72em;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
.ws-delta.good{background:#eafaf0;color:#1f9d57;border:1px solid #c8efd8}
.ws-delta.bad{background:#fdeaea;color:#d33a3a;border:1px solid #f6cccc}
.ws-delta svg{width:11px;height:11px}
/* Narrative sections */
.ws-sec{margin-bottom:16px}
.ws-sec:last-child{margin-bottom:0}
.ws-sec-h{font-size:.78em;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#1b2026;margin-bottom:6px}
.ws-sec-b{font-size:.9em;line-height:1.6;color:var(--t)}
/* Divider + sub-blocks */
.ws-div{height:1px;background:var(--bd);margin:18px 0}
.ws-block-h{font-size:.78em;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#1b2026;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ws-rows{display:flex;flex-direction:column;gap:8px}
.ws-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:5px;border:1px solid #eef1f4;background:#fafbfc}
.ws-row.improving{border-left:3px solid #1f9d57}
.ws-row.watch{border-left:3px solid #e08a1e}
.ws-row-main{flex:1;min-width:0}
.ws-row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ws-row-label{font-size:.9em;font-weight:700;color:#1b2026}
.ws-row-note{font-size:.82em;line-height:1.55;color:var(--tm);margin-top:5px}
.ws-tag{font-size:.64em;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:999px}
.ws-tag.improving{background:#eafaf0;color:#1f9d57}
.ws-tag.watch{background:#fff3e0;color:#b5680c}
.ws-note-line{font-size:.82em;line-height:1.55;color:var(--tm);margin-top:12px;font-style:italic}
@media(max-width:560px){.ws-kpis{grid-template-columns:repeat(2,1fr)}}

/* Shared colour tokens used by the profile cards. (The header + left menu come from the shared
   chrome in topbar-auth.js, like every other page.) */
:root{--gray:#f4f3ef;--white:#fff;--ink:#151d28;--ink2:#818284;--line:#e7e5df;--icbg:#c4def6;--icfg:#2b66c1;--sh:0 1px 2px rgba(21,29,40,.05),0 10px 28px -18px rgba(21,29,40,.28)}
</style>
</head>
<body data-nav-active="profile" data-back-href="app.html" data-back-label="Dashboard">
<div class="top-bar" style="display:none"></div>
<!-- Main profile content (filled by render). The header + left menu are the SHARED chrome that
     topbar-auth.js wraps around #wrap — the same one every other page uses. -->
<div class="wrap" id="wrap"><div class="gate"><p>Loading…</p></div></div>

<div class="modal-bg" id="pwModal" onclick="if(event.target===this)closePwModal()">
  <div class="modal">
    <div class="modal-head"><h2>Change Password</h2><button class="modal-close" onclick="closePwModal()" aria-label="Close">&times;</button></div>
    <label>Current password</label>
    <input type="password" id="curPw" autocomplete="current-password">
    <label>New password (min 6 chars)</label>
    <input type="password" id="newPw" autocomplete="new-password">
    <label>Confirm new password</label>
    <input type="password" id="newPw2" autocomplete="new-password">
    <div class="msg err" id="msgErr"></div>
    <div class="msg ok" id="msgOk"></div>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn sec" onclick="closePwModal()">Cancel</button>
      <button class="btn" id="saveBtn" onclick="changePw()">Update Password</button>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="api-config.js"></script>
<script src="topbar-auth.js?v=203"></script>
<script>
const A=window.PHDAuth;
const ic=(n,s)=>window.icon?window.icon(n,s||15):'';
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// (Header + left menu come from the shared chrome in topbar-auth.js, like every other page.)

let PROFILE_LOADED=false;
let PENDING_AVATAR=undefined; // undefined=no change, ''=remove, 'data:...'=new

function render(){
  const user=A.getUser();
  const wrap=document.getElementById('wrap');
  if(!user||!A.getToken()){
    wrap.innerHTML='<div class="gate"><h1>Profile</h1><p>You are not logged in. Log in from the Live Dashboard to view your profile.</p><a class="btn" href="app.html">Go to Live Dashboard</a></div>';
    return;
  }
  const prof=A._myProfile||user;
  const name=(prof.displayName||user.username||'Profile');
  const heroAv=PROFILE_LOADED
    ? `<div id="avatarBox">${A.avatarHtml(prof,86)}</div>`
    : `<div id="avatarBox"><div class="avatar-loading" style="width:86px;height:86px"><span class="pspin big"></span></div></div>`;
  const nameField=PROFILE_LOADED
    ? `<input type="text" id="displayName" maxlength="40" value="${(prof.displayName||'').replace(/"/g,'&quot;')}" placeholder="How your name appears to others">`
    : `<div class="field-loading"><span class="pspin sm"></span>Loading…</div>`;
  const removeBtn=(PROFILE_LOADED&&prof.avatar)?('<button class="btn sec mini" onclick="removeAvatar()">'+ic('trash')+' Remove photo</button>'):'';

  wrap.innerHTML=`
    <div class="ph-hero">
      <div class="ph-hero-top"></div>
      <div class="ph-hero-body">
        <div class="ph-hero-av">
          ${heroAv}
          <button class="ph-hero-cam" title="Change photo" onclick="document.getElementById('avatarFile').click()">${ic('camera',14)}</button>
          <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
        </div>
        <div class="ph-hero-meta">
          <div class="ph-hero-name">${esc(name)} <span class="ph-hero-badge">${esc(user.role)}</span></div>
          <div class="ph-hero-handle">${esc(user.username)}@ · WWOS-GSOC PHD</div>
        </div>
        <div class="ph-hero-actions">
          ${String(user.role||'').toLowerCase()==='manager'?'':`<a class="btn sec mini" href="my-tickets.html">${ic('ticket',14)} My Tickets</a>`}
          <button class="btn danger mini" onclick="doLogout()">${ic('log-out',14)} Logout</button>
        </div>
      </div>
    </div>

    <div class="ph-row-2">
      <!-- LEFT 50%: Account -->
      <div class="ph-card">
        <div class="ph-card-h">${ic('user',15)} Account
          <span class="ph-photo-btns">
            <button class="btn sec mini" onclick="document.getElementById('avatarFile').click()">${ic('camera')} Change photo</button>
            ${removeBtn}
          </span>
        </div>
        <label>Display name</label>
        ${nameField}
        <div class="ph-idrow">
          <div class="cell"><span class="k">Login ID</span><span class="v">${esc(user.username)}</span></div>
          <div class="cell"><span class="k">Role</span><span class="v"><span class="ph-badge">${esc(user.role)}</span></span></div>
          <button class="btn" id="saveProfBtn" onclick="saveProfile()"${PROFILE_LOADED?'':' disabled'}>${ic('check-circle')} Save changes</button>
        </div>
        <div class="msg err" id="profErr"></div>
        <div class="msg ok" id="profOk"></div>
      </div>
      <!-- RIGHT 50%: Security above Admin tools (stacked) -->
      <div class="ph-col">
        <div class="ph-card">
          <div class="ph-card-h">${ic('lock',15)} Security</div>
          <div class="ph-actions">
            <button class="btn sec" onclick="openPwModal()">${ic('lock')} Change Password</button>
            <button class="btn danger" onclick="doLogout()">${ic('log-out')} Logout</button>
          </div>
        </div>
        ${adminToolsCard()}
      </div>
    </div>`;
  if(PROFILE_LOADED)wireAvatarInput();
  paintWeeklySummary();
}

// Base URLs for the Local vs Live links (same as wwos-phd-bookmarks.html). Each row shows ONE button
// that matches WHERE the profile page is currently open: on localhost -> "Local" (localhost base),
// on the live site -> "Live" (GitHub Pages base).
const PH_LOCAL='http://localhost:8082/';
const PH_LIVE='https://harisss-wwos.github.io/wwos-phd-dashboard/';
const PH_IS_LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
function adminToolsCard(){
  const links=[
    { show:(A.canManageUsers&&A.canManageUsers()),  icon:'users',    href:'users.html',       label:'Users' },
    { show:(A.canDatabase&&A.canDatabase()),        icon:'database', href:'db-health.html',   label:'Database Health' },
    { show:(A.canGroupingPage&&A.canGroupingPage()),icon:'copy',     href:'groups-page.html', label:'Grouping Page' },
  ].filter(x=>x.show);
  if(!links.length) return '';
  const base=PH_IS_LOCAL?PH_LOCAL:PH_LIVE;
  const rows=links.map(l=>
    `<div class="ph-link-row">`+
      `<span class="ph-link-ic">${ic(l.icon,18)}</span>`+
      `<span class="ph-link-label">${esc(l.label)}</span>`+
      `<span class="ph-link-btns">`+
        `<a class="btn sec ph-lbtn" href="${base}${l.href}" target="_blank" rel="noopener">${ic('external-link',12)} Open</a>`+
      `</span>`+
    `</div>`
  ).join('');
  return `<div class="ph-card"><div class="ph-card-h">${ic('tool',15)} Admin tools</div><div class="ph-links">${rows}</div></div>`;
}

// ---- Weekly + Monthly Performance Summary (managers + owners only) ----
let WEEKLY_SUMMARY=undefined, MONTHLY_SUMMARY=undefined; // undefined=not fetched, null=unavailable, object=data

function canSeeWeekly(){ return A.role()==='manager' || A.isOwner(); }

// Signed delta -> a coloured chip. goodWhen ('up'|'down') decides green vs red; period = 'WoW'|'MoM'.
function wsDelta(wow,goodWhen,period){
  if(wow==null||isNaN(wow)) return '';
  const up=wow>0;
  const good=(goodWhen==='up'&&up)||(goodWhen==='down'&&!up);
  const arrow=up?'arrow-up':'arrow-down';
  const sign=up?'+':'';
  return `<span class="ws-delta ${good?'good':'bad'}">${ic(arrow,11)}${sign}${wow}% ${period||'WoW'}</span>`;
}

// Previous FULL week (Sunday -> Saturday, app's Sunday-aligned bucket). Thu Oct 8 2026 -> "Sep 27 – Oct 3, 2026".
function wsPrevFullWeekLabel(today){
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const t=today||new Date();
  const d=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const curStart=new Date(d); curStart.setDate(d.getDate()-d.getDay());  // this week's Sunday
  const start=new Date(curStart); start.setDate(curStart.getDate()-7);   // previous Sunday
  const end=new Date(start); end.setDate(start.getDate()+6);             // previous Saturday
  const sameYear=start.getFullYear()===end.getFullYear();
  const left=MON[start.getMonth()]+' '+start.getDate()+(sameYear?'':', '+start.getFullYear());
  const right=MON[end.getMonth()]+' '+end.getDate()+', '+end.getFullYear();
  return left+' \u2013 '+right;
}
function wsWeekLabel(d){ return (d&&d.week)?d.week:wsPrevFullWeekLabel(new Date()); }
// Previous FULL calendar month. Oct 15 2026 -> "September 2026"; Jan 10 2026 -> "December 2025".
function wsPrevFullMonthLabel(today){
  const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const t=today||new Date();
  const d=new Date(t.getFullYear(),t.getMonth(),1); d.setMonth(d.getMonth()-1);
  return MON[d.getMonth()]+' '+d.getFullYear();
}
function wsMonthLabel(d){ return (d&&d.month)?d.month:wsPrevFullMonthLabel(new Date()); }

// Full narrative report text for clipboard export. period = 'WoW'|'MoM'; periodLabel = range/month.
function reportText(d,period,periodLabel){
  if(!d) return '';
  period=period||'WoW';
  const L=[];
  const title=(d.title||'PHD Performance Summary');
  L.push(title+(periodLabel?` (${periodLabel})`:''));
  L.push('');
  (d.sections||[]).forEach(s=>{ L.push(`${s.title}: ${s.body}`); L.push(''); });
  const dc=d.defectCodes||{};
  const imp=dc.improving||[], wat=dc.watch||[];
  if(imp.length||wat.length){
    L.push('Defect Code Trends:'); L.push('');
    if(imp.length){
      const names=imp.map(x=>`${x.label} (${x.wow>0?'+':''}${x.wow}% ${period})`);
      L.push('• Improving: '+names.join(' and ')+' both showed meaningful improvement.');
    }
    wat.forEach(x=>{
      let line='• Watch Item: '+x.label+' increased '+(x.wow>0?'+':'')+x.wow+'% '+period;
      if(x.note) line+=' and '+x.note.charAt(0).toLowerCase()+x.note.slice(1);
      L.push(line);
    });
    L.push('');
  }
  const addr=d.address||[];
  if(d.addressSentence||addr.length){
    const core=d.addressSentence||(addr.map(x=>`${x.v} ${x.k.toLowerCase()} (${x.wow>0?'+':''}${x.wow}% ${period})`).join(' alongside ')+'.');
    let sentence='Address Exclusions & GEO Pins: '+core;
    if(d.addressNote) sentence+=' '+d.addressNote;
    L.push(sentence);
  }
  return L.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
async function wsCopy(text){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.top='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok;
  }catch(e){ return false; }
}
async function wsExport(btn,text){
  const ok=await wsCopy(text);
  if(!btn) return;
  btn.classList.add('copied');
  btn.innerHTML=ok?`${ic('check-circle',13)} Copied`:'Copy failed';
  setTimeout(()=>{ btn.classList.remove('copied'); btn.innerHTML=weeklyExportLabel(); },1600);
}
function weeklyExport(btn){ if(WEEKLY_SUMMARY) wsExport(btn,reportText(WEEKLY_SUMMARY,'WoW',wsWeekLabel(WEEKLY_SUMMARY))); }
function monthlyExport(btn){ if(MONTHLY_SUMMARY) wsExport(btn,reportText(MONTHLY_SUMMARY,'MoM',wsMonthLabel(MONTHLY_SUMMARY))); }
function weeklyExportLabel(){ return `${ic('copy',13)} Export`; }

// Generic metrics-ONLY card. opts: {title, sub, period, exportFn, toggleFn}. Collapsed by default.
function summaryCardHtml(d,opts){
  if(!d) return '';
  const kpis=(d.kpis||[]).map(x=>`
    <div class="ws-kpi"><div class="k">${esc(x.k)}</div>
      <div class="vrow"><span class="v">${esc(x.v)}</span>${wsDelta(x.wow,x.goodWhen,opts.period)}</div></div>`).join('');
  const dc=d.defectCodes||{};
  const improving=(dc.improving||[]).map(x=>`
    <div class="ws-row improving"><div class="ws-row-main">
      <div class="ws-row-top"><span class="ws-tag improving">Improving</span><span class="ws-row-label">${esc(x.label)}</span>${wsDelta(x.wow,'down',opts.period)}</div>
    </div></div>`).join('');
  const watch=(dc.watch||[]).map(x=>`
    <div class="ws-row watch"><div class="ws-row-main">
      <div class="ws-row-top"><span class="ws-tag watch">Watch</span><span class="ws-row-label">${esc(x.label)}</span>${wsDelta(x.wow,'down',opts.period)}</div>
    </div></div>`).join('');
  const defectBlock=(improving||watch)?`
    <div class="ws-div"></div>
    <div class="ws-block-h">${ic('alert-triangle',14)} Defect Code Trends</div>
    <div class="ws-rows">${improving}${watch}</div>`:'';
  const addr=(d.address||[]).map(x=>`
    <div class="ws-kpi"><div class="k">${esc(x.k)}</div>
      <div class="vrow"><span class="v">${esc(x.v)}</span>${wsDelta(x.wow,x.goodWhen,opts.period)}</div></div>`).join('');
  const addrBlock=addr?`
    <div class="ws-div"></div>
    <div class="ws-block-h">${ic('map-pin',14)} Address Exclusions &amp; GEO Pins</div>
    <div class="ws-kpis">${addr}</div>`:'';
  const sub=opts.sub||'';
  // Collapsed by default; the header row is the toggle. Export sits in the header (stops propagation).
  return `
    <div class="ws-card">
      <button type="button" class="ws-head" aria-expanded="false" onclick="summaryToggle(this)">
        <div class="ws-ic">${ic('bar-chart',17)}</div>
        <div class="ws-head-meta">
          <div class="ws-title">${esc(d.title||opts.title)}</div>
          ${sub?`<div class="ws-sub">${sub}</div>`:''}
        </div>
        <span class="ws-export" role="button" tabindex="0" onclick="event.stopPropagation();${opts.exportFn}(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();${opts.exportFn}(this);}" title="Copy full report to clipboard">${weeklyExportLabel()}</span>
        <span class="ws-caret">${ic('chevron-down',18)}</span>
      </button>
      <div class="ws-collapse"><div class="ws-body">
        ${kpis?`<div class="ws-kpis">${kpis}</div>`:''}
        ${defectBlock}
        ${addrBlock}
      </div></div>
    </div>`;
}
function weeklySummaryHtml(d){ return summaryCardHtml(d,{title:'Weekly Performance Summary',sub:wsWeekLabel(d),period:'WoW',exportFn:'weeklyExport',toggleFn:'summaryToggle'}); }
function monthlySummaryHtml(d){ return summaryCardHtml(d,{title:'Monthly Performance Summary',sub:wsMonthLabel(d),period:'MoM',exportFn:'monthlyExport',toggleFn:'summaryToggle'}); }
function summaryToggle(btn){
  const card=btn.closest('.ws-card'); if(!card) return;
  const open=card.classList.toggle('open');
  btn.setAttribute('aria-expanded', open?'true':'false');
}

// Paint the summaries into their slots. Called after each render() (slots recreated each time).
function paintWeeklySummary(){
  const ws=document.getElementById('weeklySummarySlot');
  if(ws){ ws.innerHTML = (canSeeWeekly()&&WEEKLY_SUMMARY) ? weeklySummaryHtml(WEEKLY_SUMMARY) : ''; }
  const ms=document.getElementById('monthlySummarySlot');
  if(ms){ ms.innerHTML = (canSeeWeekly()&&MONTHLY_SUMMARY) ? monthlySummaryHtml(MONTHLY_SUMMARY) : ''; }
}

async function loadWeeklySummary(){
  if(!canSeeWeekly()){ WEEKLY_SUMMARY=null; MONTHLY_SUMMARY=null; return; }
  try{ const r=await fetch('weekly-summary.json?v='+Date.now(),{cache:'no-store'}); WEEKLY_SUMMARY = r.ok ? await r.json() : null; }catch(e){ WEEKLY_SUMMARY=null; }
  try{ const r2=await fetch('monthly-summary.json?v='+Date.now(),{cache:'no-store'}); MONTHLY_SUMMARY = r2.ok ? await r2.json() : null; }catch(e){ MONTHLY_SUMMARY=null; }
  paintWeeklySummary();
}

function wireAvatarInput(){ const inp=document.getElementById('avatarFile'); if(inp)inp.onchange=(e)=>handleAvatarFile(e.target.files[0]); }

function removeAvatar(){
  PENDING_AVATAR='';
  const p=A.myProfile()||A.getUser();
  const dn=document.getElementById('displayName');
  document.getElementById('avatarBox').innerHTML=A.avatarHtml({displayName:dn?dn.value:'',username:p.username},86);
  render();
}

function handleAvatarFile(file){
  const err=document.getElementById('profErr'),ok=document.getElementById('profOk');
  err.style.display='none';ok.style.display='none';
  if(!file)return;
  if(!/^image\/(png|jpe?g|gif|webp)$/.test(file.type)){err.textContent='Unsupported file. Please upload a PNG, JPG, GIF, or WebP image.';err.style.display='block';return;}
  if(file.size>8*1024*1024){err.textContent='That image is too large. Please upload a smaller image.';err.style.display='block';return;}
  const reader=new FileReader();
  reader.onerror=()=>{err.textContent='Could not read that image. Please upload a different one.';err.style.display='block';};
  reader.onload=(ev)=>{
    const img=new Image();
    img.onerror=()=>{err.textContent='That file is not a valid image.';err.style.display='block';};
    img.onload=()=>{
      const size=128;const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d');
      const s=Math.min(img.width,img.height);const sx=(img.width-s)/2,sy=(img.height-s)/2;
      ctx.drawImage(img,sx,sy,s,s,0,0,size,size);
      let dataUrl=canvas.toDataURL('image/jpeg',0.82);
      if(dataUrl.length>200000){dataUrl=canvas.toDataURL('image/jpeg',0.6);}
      if(dataUrl.length>200000){err.textContent='Image is still too large after resizing. Please upload a different image.';err.style.display='block';return;}
      PENDING_AVATAR=dataUrl;
      document.getElementById('avatarBox').innerHTML='<img class="phd-avatar" src="'+dataUrl+'" alt="avatar" style="width:86px;height:86px;border-radius:50%;object-fit:cover;display:block">';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveProfile(){
  const err=document.getElementById('profErr'),ok=document.getElementById('profOk');
  err.style.display='none';ok.style.display='none';
  const body={displayName:document.getElementById('displayName').value.trim()};
  if(PENDING_AVATAR!==undefined)body.avatar=PENDING_AVATAR;
  const btn=document.getElementById('saveProfBtn');btn.disabled=true;btn.textContent='Saving…';
  const r=await A.api('POST','/api/me/profile',body);
  btn.disabled=false;
  if(r.ok){A.setMyProfile?A.setMyProfile(r.data):(A._myProfile=r.data);PENDING_AVATAR=undefined;render();setTimeout(()=>{const o=document.getElementById('profOk');if(o){o.textContent='Profile updated.';o.style.display='block';setTimeout(()=>{if(o)o.style.display='none';},1800);}},30);}
  else{err.textContent=(r.data&&r.data.error)||('Failed (HTTP '+r.status+')');err.style.display='block';}
}

function openPwModal(){
  ['curPw','newPw','newPw2'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('msgErr').style.display='none';
  document.getElementById('msgOk').style.display='none';
  const btn=document.getElementById('saveBtn');btn.disabled=false;btn.textContent='Update Password';
  document.getElementById('pwModal').style.display='flex';
  setTimeout(()=>document.getElementById('curPw').focus(),40);
}
function closePwModal(){document.getElementById('pwModal').style.display='none';}
function doLogout(){ if(window.PHDConfirmLogout){window.PHDConfirmLogout();return;} if(confirm('Log out?')){A.clear();location.href='index.html';} }

async function changePw(){
  const cur=document.getElementById('curPw').value;
  const np=document.getElementById('newPw').value;
  const np2=document.getElementById('newPw2').value;
  const err=document.getElementById('msgErr'),ok=document.getElementById('msgOk');
  err.style.display='none';ok.style.display='none';
  if(!cur||!np){err.textContent='Fill in all fields.';err.style.display='block';return;}
  if(np.length<6){err.textContent='New password must be at least 6 characters.';err.style.display='block';return;}
  if(np!==np2){err.textContent='New passwords do not match.';err.style.display='block';return;}
  const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Updating…';
  const r=await A.api('POST','/api/change-password',{currentPassword:cur,newPassword:np});
  btn.disabled=false;btn.textContent='Update Password';
  if(r.ok){ok.textContent='Password updated successfully.';ok.style.display='block';['curPw','newPw','newPw2'].forEach(id=>document.getElementById(id).value='');setTimeout(closePwModal,1200);}
  else if(r.status===401 && !A.getToken()){err.textContent='Session expired. Please log in again from the Live Dashboard.';err.style.display='block';setTimeout(()=>{closePwModal();render();},1500);}
  else{err.textContent=(r.data&&r.data.error)||('Failed (HTTP '+r.status+')');err.style.display='block';}
}

(async()=>{
  render();
  if(A.getUser()&&A.getToken()){
    try{ await A.loadMyProfile(); }catch(e){}
    try{ if(A._refreshMe) await A._refreshMe(); else if(A.getMe) await A.getMe(); }catch(e){}
    PROFILE_LOADED=true;
    render();
    // Repaint the shared header avatar now that the full profile is loaded.
    if(window.PHDRefreshHomeChrome) window.PHDRefreshHomeChrome();
  }
})();
</script>
